一句话 → Research"},{"j":"機密情報を誰とでも共有したい → Artifactの公開","z":"想把机密信息与任何人共享 → 公开 Artifact"},{"j":"継続的に同じ規程集を参照してQ&Aをしたい → Project","z":"想持续参照同一套规章进行问答 → Project"},{"j":"大量の単純分類を安く速く行いたい → 最上位モデル＋拡張思考","z":"想便宜快速地进行大量简单分类 → 最高级模型＋扩展思考"},{"j":"最新の業界ニュースを確認したい → Web検索","z":"想确认最新行业新闻 → 网页搜索"}],"a":[2,4],"e":"正确的两项：确认最新行业新闻 → Web 搜索；持续参照同一套规章问答 → Project。错误：改写一句话用普通对话即可，用 Research 属于过度；机密信息不应通过公开 Artifact 共享；大量简单分类应选快速低成本模型，而不是最高级模型＋扩展思考。","ej":"最新→Web検索／継続参照→Project"},{"id":"d3-024","d":3,"t":"3.1","n":1,"q":"Styles（応答スタイル）機能の用途として最も適切なものはどれか。","qz":"Styles（回答风格）功能最合适的用途是哪一个？","o":[{"j":"外部サービスとの接続を許可する","z":"允许与外部服务连接"},{"j":"回答に含まれる事実の正確性を保証し、誤った内容が出力されないようにする","z":"保证回答中事实的准确性，防止输出错误内容"},{"j":"組織のデータ保持期間を設定する","z":"设置组织的数据保留期限"},{"j":"回答の口調・簡潔さ・形式などの書き方を調整する","z":"调整回答的语气、简洁程度、形式等写法"}],"a":[3],"e":"Styles 用来调整 Claude 的写作方式（如正式、简洁或自定义风格）。它不保证事实正确；数据保留期限属于管理设置；与外部服务连接靠的是连接器。","ej":"Styles＝書き方（口調・簡潔さ）の調整"},{"id":"d3-026","d":3,"t":"3.1","n":1,"q":"ある担当者が、会議の直前に「この3行のメモを丁寧な日本語に直して」と頼むとき、出力形式として最も適切なものはどれか。","qz":"某负责人在会议前请 Claude“把这 3 行笔记改成礼貌的日语”。最合适的输出形式是哪一个？","o":[{"j":"Researchレポート","z":"Research 报告"},{"j":"チャット内のインライン回答","z":"对话中的内联回答"},{"j":"Artifactとして独立したドキュメントを作成する","z":"生成为独立的 Artifact 文档"},{"j":"JSON形式の構造化データ","z":"JSON 格式的结构化数据"}],"a":[1],"e":"简短、一次性的改写，直接内联回答最方便复制使用。独立 Artifact 适合较长、需要反复编辑或共享的成果物；Research 报告是多来源调查；JSON 是给系统处理的数据格式，不适合直接阅读。","ej":"短い一回限りの回答 → インライン"},{"id":"d3-028","d":3,"t":"3.1","n":1,"q":"アソシエイトが、社内の複雑なシステム連携（APIを使った自動化パイプライン）をClaudeで構築したいという依頼を受けた。自身はAPI開発の経験がない。最も適切な対応はどれか。","qz":"Associate 收到请求：要用 Claude 构建公司内部复杂的系统联动（使用 API 的自动化流水线）。本人没有 API 开发经验。最合适的应对是哪一个？","o":[{"j":"Claudeにコードを書かせ、検証せずに本番環境へ導入する","z":"让 Claude 写代码，不经验证就上线到生产环境"},{"j":"要件と業務上の目的を整理したうえで、Claude DeveloperやArchitectなど技術担当にエスカレーションする","z":"整理好需求和业务目的后，升级给 Claude Developer 或 Architect 等技术负责人"},{"j":"依頼を断り、理由も伝えない","z":"拒绝请求，也不说明理由"},{"j":"Researchで調べた手順通りに、自分でAPI連携の自動化パイプラインを本番環境に構築し、動いたことを確認してから関係部署に報告する","z":"按 Research 查到的步骤，自己在生产环境搭建 API 集成的自动化管道，确认能运行后再报告给相关部门"}],"a":[1],"e":"Associate 的职责包括认识局限，把复杂/技术性的实现升级给 Architect 和 Developer。可以先用 Claude 整理需求、用例和业务目的，方便交接。让 Claude 写代码不验证就上线、按 Research 查到的步骤自己搭生产环境，都缺乏专业审查，风险高；不说明理由直接拒绝，则放弃了 Associate 能贡献的价值。","ej":"API連携・エージェント設計 → Developer/Architectへエスカレーション"},{"id":"d3-031","d":3,"t":"3.1","n":1,"q":"総務担当者が、社内イベントの出欠管理用に、参加者が名前を入力すると一覧に反映される簡単なツールを試作したい。プログラミングの経験はない。最も適切な機能の使い方はどれか。","qz":"总务负责人想试做一个简单的工具，用于公司活动的出席管理：参加者输入名字后就会显示在列表中。他没有编程经验。最合适的功能用法是哪一个？","o":[{"j":"Claudeでは作れないため、すぐに社内のシステム開発部門へ本番システムとしての開発を依頼する","z":"因为 Claude 做不到，所以马上请公司系统开发部门作为正式系统来开发"},{"j":"Researchで出欠管理ツールの市販製品を調査させ、その結果をそのまま社内ツールとして使う","z":"用 Research 调查市面上的出席管理工具，把调查结果直接当作公司内部工具使用"},{"j":"Artifactとして小さなインタラクティブツールを作成させ、動作を確認しながら修正を依頼する","z":"让 Claude 以 Artifact 形式做一个小型交互工具，边确认运行效果边要求修改"},{"j":"シークレットチャットで依頼し、作成したツールが履歴に残らないようにしてから共有する","z":"在无痕对话中提出请求，让做好的工具不留在历史中，然后再共享"}],"a":[2],"e":"简单的交互式小工具、原型正适合用 Artifact 制作：在独立面板中运行，可以边看边迭代修改，也能共享。Research 是调查用的，调查结果不等于可用的工具；这种规模的试作不必一开始就交给开发部门做正式系统（但若要处理个人信息、长期运行或与公司系统集成，再升级给专家）；无痕对话与制作和共享无关。","ej":"簡単なツールの試作＝Artifactで作って反復"},{"id":"d3-032","d":3,"t":"3.1","n":1,"q":"営業担当者が、商談前に「顧客企業の最新の決算発表の要点」を3行で知りたい。情報源は1つで十分で、すぐに必要である。最も適切な方法はどれか。","qz":"销售人员想在商谈前用 3 行了解“客户企业最新财报发布的要点”。一个信息来源就够了，而且马上就要。最合适的方法是哪一个？","o":[{"j":"Web検索を使わず、Claudeの学習済み知識だけで最新の決算内容を答えさせ、そのまま使う","z":"不用 Web 搜索，只靠 Claude 的训练知识回答最新财报内容，并直接使用"},{"j":"Researchを起動して数十件の情報源を網羅した詳細レポートを作成させ、その完成を待つ","z":"启动 Research，让它生成覆盖几十个信息来源的详细报告，并等待完成"},{"j":"Web検索を有効にして質問し、引用元の決算資料を開いて数字を確認する","z":"开启 Web 搜索提问，并打开引用的财报资料确认数字"},{"j":"顧客企業の過去5年分の決算資料をすべてProjectナレッジにアップロードしてから質問する","z":"先把客户企业过去 5 年的财报资料全部上传到 Project 知识库，然后再提问"}],"a":[2],"e":"需要最新信息、来源单一、要得快 → 开启 Web 搜索即可，并通过引用核对数字。Research 适合多来源深入调查，需要几分钟，这里属于过度；训练知识有截止日期，无法得到最新财报；为一次性问题上传 5 年资料，准备成本过高，而且仍然拿不到最新发布的内容。","ej":"最新情報で単純＝Web検索／多数の情報源で深く＝Research"},{"id":"d3-033","d":3,"t":"3.1","n":1,"q":"毎月の定例報告書を、決まった章立て・社内テンプレート・表記ルールに沿って作っている。複数のProjectや会話で同じ手順を自動的に使い回したい。最も適切な機能はどれか。","qz":"每月按固定章节结构、公司模板和书写规则制作例行报告。希望在多个 Project 和对话中自动重复使用同一套步骤。最合适的功能是哪一个？","o":[{"j":"手順・テンプレート・ルールをSkillとしてまとめ、関連する作業で読み込まれるようにする","z":"把步骤、模板和规则整理成 Skill，让它在相关工作时被加载"},{"j":"Styles（応答スタイル）に報告書の章立てを書き込み、毎回スタイルを切り替えて使う","z":"把报告的章节结构写进 Styles（回答风格），每次切换风格使用"},{"j":"毎回の会話の冒頭に、前月の報告書全文と作成手順をコピーして貼り付ける","z":"每次对话开头复制粘贴上个月的报告全文和制作步骤"},{"j":"メモリに「報告書の章立てを覚えて」と1回伝えれば、テンプレートファイルも自動で生成される","z":"只要对记忆说一次“记住报告的章节结构”，模板文件也会自动生成"}],"a":[0],"e":"Skill 把操作步骤、模板、脚本打包成一个文件夹（SKILL.md），在相关任务中自动加载，适合跨对话、跨 Project 重复使用的固定流程，还可配合文件创建生成 docx 等。Styles 只调整语气和写法，不适合管理章节结构和模板文件；每次粘贴费时易漏；记忆保存的是背景偏好，不会因此自动生成模板文件。","ej":"繰り返す定型手順・テンプレート＝Skills"},{"id":"d3-034","d":3,"t":"3.1","n":2,"q":"次のうち、Artifactとして出力するのが適しているものを2つ選べ。","qz":"以下哪些适合以 Artifact 形式输出？请选择 2 项。","o":[{"j":"売上データから作る、フィルター付きのインタラクティブなグラフ","z":"用销售数据做的、带筛选功能的交互式图表"},{"j":"チームで何度も修正しながら共有する新サービスの提案書ドラフト","z":"团队要反复修改并共享的新服务提案书草稿"},{"j":"「この単語の読み方は？」という一言の質問への回答","z":"“这个词怎么读？”这种一句话问题的回答"},{"j":"「了解しました」と返信するための短いチャット文","z":"用来回复“明白了”的简短聊天消息"},{"j":"会議中に確認したい、ある用語の簡単な意味の説明","z":"会议中想确认的某个术语的简单解释"}],"a":[0,1],"e":"Artifact 适合需要反复编辑、单独保存或共享的成果，以及可交互的内容：提案书草稿、交互式图表都是典型。读音问题、简短回复、术语的简单解释都是一次性的短内容，内联回答最方便。","ej":"反復・共有・インタラクティブ＝Artifact／短い一回限り＝インライン"},{"id":"d3-035","d":3,"t":"3.1","n":1,"q":"Google Driveに保存された最新の営業マニュアルを参照しながら回答させたい。マニュアルは毎週更新される。組織の管理者はGoogle Driveコネクタを有効にしている。最も適切な方法はどれか。","qz":"希望 Claude 参照保存在 Google Drive 中的最新销售手册来回答。手册每周更新。组织管理员已启用 Google Drive 连接器。最合适的方法是哪一个？","o":[{"j":"Google Driveコネクタで自分に権限のあるマニュアルを参照させ、回答の出典を確認する","z":"用 Google Drive 连接器参照自己有权限的手册，并确认回答的出处"},{"j":"Claudeの学習済み知識には社内マニュアルも含まれていると考え、何も接続せずに質問し、回答をそのまま使う","z":"认为 Claude 的训练知识里也包含公司手册，不连接任何东西直接提问，并直接使用回答"},{"j":"毎週マニュアルをダウンロードし、チャットに新しい版を追加でアップロードし続ける","z":"每周下载手册，并不断把新版本追加上传到对话中"},{"j":"マニュアルをWebに一般公開し、Web検索で見つけさせる","z":"把手册公开到网上，让 Web 搜索找到它"}],"a":[0],"e":"资料存放在 Drive 且频繁更新 → 用连接器直接参照源头的最新版，省去反复上传，并可确认出处。反复追加上传会造成新旧版本混在一起；训练知识里没有公司内部手册；把内部资料公开到网上是严重的信息泄露风险。","ej":"頻繁に更新される社内資料＝コネクタで最新版を参照"},{"id":"d3-036","d":3,"t":"3.1","n":1,"q":"新任の担当者が「Claudeの機能はどれも同じなので、とりあえず全部オンにしておけばよい」と考えている。これに対する助言として最も適切なものはどれか。","qz":"新负责人认为“Claude 的功能都差不多，先全部打开就行”。对此最合适的建议是哪一个？","o":[{"j":"全機能をオンにするとClaudeの回答が必ず正確になるので、その考えは正しい","z":"打开全部功能后 Claude 的回答一定准确，所以这个想法是对的"},{"j":"タスクの目的に合わせて機能を選ぶ。例えば最新情報にはWeb検索、繰り返す資料参照にはProjectを使う","z":"根据任务目的选择功能。例如最新信息用 Web 搜索，反复参照资料用 Project"},{"j":"どの機能を使うかは管理者が決めるため、利用者が機能の違いを理解する必要はない","z":"用哪些功能由管理员决定，所以使用者不需要理解功能的区别"},{"j":"機能を使うとコストや待ち時間が増えるので、通常のチャット以外の機能はすべて使わないようにするのが最も安全である","z":"使用功能会增加成本和等待时间，所以普通对话以外的功能一律不用最安全"}],"a":[1],"e":"考试的核心思路是“按任务选功能”：需要最新信息开 Web 搜索，深入多来源调查用 Research，反复参照同一资料用 Project，需要编辑共享的成果用 Artifact。功能全开不保证准确，还可能增加时间、引入不必要的数据访问；一律不用会失去价值；管理员决定的是可用范围，使用者仍要会选。","ej":"目的に合った機能を選ぶ"},{"id":"d3-037","d":3,"t":"3.1","n":1,"q":"Researchを使って業界動向レポートを作成したところ、引用付きの詳細なレポートが得られた。この後に行うべきこととして最も適切なものはどれか。","qz":"使用 Research 制作了行业动向报告，得到了带引用的详细报告。之后最应该做的是什么？","o":[{"j":"引用があるので内容は正しいと判断し、そのまま経営会議の資料に使う","z":"因为有引用，所以判断内容正确，直接用作经营会议资料"},{"j":"重要な数値や主張について引用元を開き、内容が一致しているかを確認する","z":"对重要的数字和观点打开引用来源，确认内容是否一致"},{"j":"同じ依頼をもう一度Researchで実行し、結果が同じなら正しいと判断する","z":"用 Research 再执行一次相同请求，如果结果相同就判断为正确"},{"j":"引用部分は読みにくいので削除し、本文だけを社外に配布する","z":"引用部分不好读，所以删掉，只把正文分发到公司外部"}],"a":[1],"e":"Research 带引用，但引用本身也要打开确认：来源是否存在、是否真的支持该数字和观点。“有引用就正确”是过度信任；重复运行得到相同结果也不能证明正确；删除引用会让读者无法核实，对外发布前更需要验证。","ej":"引用付きでも重要な点は引用元を確認"},{"id":"d3-038","d":3,"t":"3.1","n":1,"q":"拡張思考（Extended thinking）を使うべき場面として最も適切なものはどれか。","qz":"以下哪个场景最适合使用扩展思考（Extended thinking）？","o":[{"j":"機密情報を扱うため、会話を履歴に残さないようにしたいとき","z":"因为处理机密信息，想让对话不留在历史中时"},{"j":"「お疲れさまです」の一言を、より丁寧な言い方に直したいとき","z":"想把一句“辛苦了”改成更礼貌的说法时"},{"j":"回答を一刻も早く受け取りたい、毎日数千件ある大量の単純な分類作業を行うとき","z":"进行每天几千件的大量简单分类工作、希望尽快拿到回答时"},{"j":"複数の条件と制約がある人員配置案を比較し、その理由を論理的に整理したいとき","z":"比较有多个条件和约束的人员配置方案，并想有逻辑地整理理由时"}],"a":[3],"e":"扩展思考在回答前进行更深推理，适合多条件、多约束的复杂比较和论证。简单改写不需要；大量简单分类重视速度，扩展思考只会增加延迟和用量；不留历史是无痕对话的用途，与扩展思考无关。","ej":"複雑な推論・多条件の比較＝拡張思考"},{"id":"d3-039","d":3,"t":"3.1","n":2,"q":"コード実行・ファイル作成機能が役立つタスクを2つ選べ。","qz":"以下哪些任务适合用代码执行与文件创建功能？请选择 2 项。","o":[{"j":"会議資料をPowerPoint（pptx）ファイルとして作成する","z":"把会议资料制作成 PowerPoint（pptx）文件"},{"j":"ある専門用語の意味を簡単に説明してもらう","z":"让它简单解释某个专业术语"},{"j":"アンケート結果のCSVを集計し、設問別のグラフを作る","z":"汇总问卷结果的 CSV，制作每道题的图表"},{"j":"新商品のキャッチコピー案をブレインストーミングする","z":"头脑风暴新商品的宣传标语方案"},{"j":"取引先へのお礼メールの言い回しを考える","z":"思考给合作方的感谢邮件的措辞"}],"a":[0,2],"e":"代码执行与文件创建用于数据处理、制图、生成 Office/PDF 文件：CSV 汇总制图、制作 pptx 都是典型。邮件措辞、标语头脑风暴、术语解释都是文字对话任务，不需要运行代码。","ej":"データ集計・グラフ・ファイル生成＝コード実行"},{"id":"d3-040","d":3,"t":"3.1","n":1,"q":"Teamプランの組織で、ある社員が「Gmailコネクタが一覧に表示されない」と言っている。最も考えられる理由と対応はどれか。","qz":"在使用 Team 方案的组织中，一名员工说“连接器列表里没有 Gmail 连接器”。最可能的原因和应对是哪一个？","o":[{"j":"Gmailコネクタは存在しないので、メールの全文を毎回コピーして貼り付ける","z":"不存在 Gmail 连接器，所以每次复制粘贴邮件全文"},{"j":"個人のGoogleアカウントで非公式のツールを使って接続し、業務に支障が出ないよう管理者には伝えない","z":"用个人 Google 账号通过非官方工具连接，为了不影响工作，不告诉管理员"},{"j":"組織の管理者が有効にしていない可能性があるため、社内の手続きに沿って管理者に確認する","z":"可能是组织管理员没有启用，所以按公司流程向管理员确认"},{"j":"ブラウザを変えれば必ず表示されるので、別のブラウザで再度ログインする","z":"换浏览器就一定会显示，所以用别的浏览器重新登录"}],"a":[2],"e":"在 Team/Enterprise 中，连接器需要管理员在组织层面启用。看不到时应按流程联系管理员确认，同时确认公司政策上是否允许使用。Gmail 连接器是存在的；用个人账号和非官方工具绕过管理属于“影子 AI”，违反治理；换浏览器不能解决组织设置问题。","ej":"Team/Enterpriseのコネクタ＝管理者が有効化"},{"id":"d3-041","d":3,"t":"3.1","n":1,"q":"Projectsとシークレットチャットの使い分けとして最も適切なものはどれか。","qz":"关于 Projects 与无痕对话的区分使用，最合适的是哪一个？","o":[{"j":"Projectもシークレットチャットも、会話が履歴に残らない点で同じ機能である","z":"Project 和无痕对话在对话不留历史这一点上是相同的功能"},{"j":"繰り返し使う資料と前提はProjectで管理し、記録を残したくない一時的な相談はシークレットチャットで行う","z":"反复使用的资料和前提用 Project 管理，不想留记录的临时咨询用无痕对话"},{"j":"シークレットチャットを使えば、組織のデータ取扱いポリシーに従う必要はなくなる","z":"使用无痕对话后，就不需要遵守组织的数据处理政策"},{"j":"Projectにナレッジを入れると、シークレットチャットでもそのナレッジが自動的に参照される","z":"在 Project 中放入知识后，无痕对话中也会自动参照这些知识"}],"a":[1],"e":"Project 用于持续性：保存资料、指令和对话；无痕对话用于不留痕的一次性对话，不保存到历史、不用于记忆。两者目的相反，不是相同功能；无痕对话并不免除组织的数据政策；无痕对话不会自动带入 Project 的知识。","ej":"継続＝Project／記録を残さない一時利用＝シークレットチャット"},{"id":"d3-042","d":3,"t":"3.1","n":1,"q":"ある担当者は、社外向けの文章を常に「です・ます調で簡潔、専門用語は避ける」書き方で出力させたい。会話ごとに説明する手間を減らす手段として最も直接的なものはどれか。","qz":"某负责人希望对外文章始终以“敬体、简洁、避免专业术语”的写法输出。为减少每次对话都要说明的麻烦，最直接的手段是哪一个？","o":[{"j":"カスタムのStyleを作成し、その書き方を指定して使う","z":"创建自定义 Style，指定这种写法来使用"},{"j":"Researchを有効にして、他社の文章スタイルを毎回調査させる","z":"开启 Research，每次让它调查其他公司的文章风格"},{"j":"最も高性能なモデルに切り替えれば、指示しなくても好みの書き方になる","z":"切换到最高性能的模型，不用指示也会变成喜欢的写法"},{"j":"毎回出力された文章を自分で手直しし、Claudeには何も伝えない","z":"每次自己修改输出的文章，不告诉 Claude 任何东西"}],"a":[0],"e":"Styles 用来设定回答的语气和写法，可以创建自定义风格反复使用（也可以写进 Project 指令或个人偏好）。Research 是调查功能；高性能模型也不会自动知道你的偏好；每次手动修改效率低，也没有利用可用的设置。","ej":"書き方の統一＝Styles（またはProject指示）"},{"id":"d3-043","d":3,"t":"3.1","n":1,"q":"長いPDFの契約書について「第何条に解約条件が書かれているか」を確認したい。Claudeに依頼する方法として最も適切なものはどれか。","qz":"想确认一份很长的 PDF 合同中“解约条件写在第几条”。请 Claude 帮忙时最合适的方法是哪一个？","o":[{"j":"PDFをアップロードし、該当箇所の原文を引用させたうえで、自分でもその条文を開いて確認する","z":"上传 PDF，让它引用相关原文，然后自己也打开该条文确认"},{"j":"PDFはアップロードせず、契約書の一般的な構成からClaudeに推測させる","z":"不上传 PDF，让 Claude 根据合同的一般结构推测"},{"j":"Researchで一般的な契約書の解約条項を調べさせ、その条番号を採用する","z":"用 Research 调查一般合同的解约条款，并采用那个条号"},{"j":"Claudeが答えた条番号は必ず正しいので、引用は求めずに、そのまま法務部門に報告して確認作業を省略する","z":"Claude 回答的条号一定正确，所以不要求引用，直接报告给法务部门并省略确认工作"}],"a":[0],"e":"基于具体文档的问题，应上传文档并要求先引用相关原文，再由人对照原文确认——条号是容易出错、需要验证的具体信息。不上传资料就是让它猜；网上一般合同的条号与这份合同无关；对条号盲目信任，有向法务传达错误信息的风险。","ej":"文書の条番号＝原文を引用させ自分で確認"},{"id":"d3-044","d":3,"t":"3.1","n":1,"q":"Claudeの製品機能と、Developer／Architectが担う領域の境界として最も適切な説明はどれか。","qz":"关于 Claude 产品功能与 Developer/Architect 负责领域的边界，最合适的说明是哪一个？","o":[{"j":"ProjectsやArtifactsは開発者専用の機能であり、アソシエイトは通常のチャットだけを使う","z":"Projects 和 Artifacts 是开发者专用功能，Associate 只使用普通对话"},{"j":"アソシエイトはClaudeの設定を一切変更してはならず、すべて開発者に依頼する","z":"Associate 不得更改 Claude 的任何设置，全部交给开发者"},{"j":"どんな規模のシステム統合でも、アソシエイトがClaudeに聞きながら単独で本番構築するべきである","z":"无论多大规模的系统集成，Associate 都应该边问 Claude 边独自完成正式构建"},{"j":"Projects・Artifacts・コネクタなど既存機能の組み合わせはアソシエイトの範囲で、APIを使ったシステム統合は専門家にエスカレーションする","z":"组合使用 Projects、Artifacts、连接器等现有功能属于 Associate 的范围，用 API 做系统集成则升级给专家"}],"a":[3],"e":"Associate 的范围是用现有产品功能（Projects、Artifacts、连接器、Skills、提示词等）优化业务；涉及 API 集成、企业级架构、Agent 设计时，应升级给 Developer / Architect。Projects、Artifacts 不是开发者专用；独自正式构建大型系统超出范围且有风险；完全不能改设置也不对，配置 Project 正是 Associate 的工作。","ej":"既存機能の活用＝アソシエイト／API統合＝専門家へ"},{"id":"d3-045","d":3,"t":"3.1","n":1,"q":"Researchの特徴として最も適切なものはどれか。","qz":"关于 Research 的特点，最合适的是哪一个？","o":[{"j":"複数回の検索を自律的に行い、情報を統合して引用付きのレポートを作成するため、数分かかることがある","z":"会自主进行多次搜索、整合信息并生成带引用的报告，因此可能需要几分钟"},{"j":"社内のシステムに自動でログインし、権限のないデータも調べることができる","z":"会自动登录公司内部系统，也能调查没有权限的数据"},{"j":"1回の検索結果だけを即座に返すため、最も速く回答が得られる機能である","z":"只立即返回一次搜索的结果，所以是回答最快的功能"},{"j":"Researchで得た内容は複数の情報源で検証済みなので、引用元を開いて確認する必要はない","z":"Research 得到的内容已经过多个信息来源验证，所以不需要打开引用来源确认"}],"a":[0],"e":"Research 会自主进行多轮搜索（以及已连接数据源的搜索），整合后生成带引用的报告，通常需要几分钟。它不是最快的功能；它只能访问被授权的范围；引用来源仍需人工核实。","ej":"Research＝自律的に複数検索→引用付きレポート（数分）"},{"id":"d3-072","d":3,"t":"3.1","n":1,"q":"マーケティング担当者が、競合3社のWebサイトの公開情報をもとに、機能・価格帯・ターゲットを比較した表を作りたい。最新の情報が必要で、後でExcelでも並べ替えたい。最も適切な進め方はどれか。","qz":"市场负责人想根据 3 家竞争对手网站的公开信息，制作比较功能、价格带、目标客户的表格。需要最新信息，之后还想在 Excel 中排序。最合适的做法是哪一个？","o":[{"j":"学習済み知識だけで比較表を作らせ、出典は不要とする","z":"只靠训练知识制作比较表，不需要出处"},{"j":"3社の担当者になりすまして問い合わせ、非公開の価格情報を入手する","z":"冒充 3 家公司的负责人询问，获取未公开的价格信息"},{"j":"比較の観点を指定してWeb検索で情報を集めさせ、表形式（CSVやExcel）で出力させたうえで、出典を確認する","z":"指定比较角度，用 Web 搜索收集信息，以表格形式（CSV 或 Excel）输出，并确认出处"},{"j":"長い文章で比較させ、表は自分で手作業で作る","z":"让它用长篇文字比较，表格自己手工制作"}],"a":[2],"e":"需要最新公开信息 → Web 搜索；需要排序比较 → 结构化数据（表格/CSV/Excel）；最后确认出处。只靠训练知识会过时且无法核实；冒充他人获取非公开信息是不道德、可能违法的行为；用长篇文字输出再手工做表，没有选对输出格式。","ej":"比較・並べ替え＝構造化データ／最新＝Web検索"},{"id":"d3-006","d":3,"t":"3.2","n":1,"q":"Claudeのモデルファミリー（Haiku・Sonnet・Opus）に関する説明として、最も適切なものはどれか。","qz":"关于 Claude 模型家族（Haiku、Sonnet、Opus）的说明，最合适的是哪一个？","o":[{"j":"Haikuは高速・低コスト、Sonnetはバランス型、Opusは最も高性能で複雑なタスク向けである","z":"Haiku 快速低成本，Sonnet 均衡型，Opus 性能最高、适合复杂任务"},{"j":"3つのモデルは性能もコストも同じで、名前が違うだけなので、どのモデルを選んでも業務への影響はまったくない","z":"三个模型性能和成本都一样，只是名字不同，所以选哪个模型对业务都完全没有影响"},{"j":"Haikuは最も高性能で、複雑な推論に最適である","z":"Haiku 性能最高，最适合复杂推理"},{"j":"Opusは最も高速かつ低コストで、大量処理に向く","z":"Opus 最快且成本最低，适合大批量处理"}],"a":[0],"e":"基本定位：Haiku＝快、便宜，适合大量简单任务；Sonnet＝性能与成本平衡，日常业务的标准选择；Opus＝最强，适合复杂推理和长的多步骤任务，但更贵更慢。把 Haiku 说成最高性能、把 Opus 说成最快最便宜，都是把两者特点颠倒了；“三者完全一样”也错误。","ej":"Haiku＝速い・安い／Sonnet＝バランス／Opus＝最高性能"},{"id":"d3-007","d":3,"t":"3.2","n":1,"q":"法務部門が、複数の契約書の条項間の矛盾を洗い出し、リスクの影響を多段階で推論して整理する作業を依頼したい。件数は少なく、精度が最優先である。最も適切なモデル選択はどれか。","qz":"法务部门想委托一项工作：找出多份合同条款之间的矛盾，并对风险影响进行多步推理整理。件数少，精度最优先。最合适的模型选择是哪一个？","o":[{"j":"最も高性能なモデル（Opus）を使い、必要に応じて拡張思考も有効にする","z":"使用性能最高的模型（Opus），必要时开启扩展思考"},{"j":"最も安いモデルを使い、出力は確認せずにそのまま使う。件数が少ないのでコストを最小限に抑えることを優先する","z":"使用最便宜的模型，输出不确认直接使用。因为件数少，所以优先把成本降到最低"},{"j":"速度が最優先なので最速のモデルを使う","z":"速度最优先，所以用最快的模型"},{"j":"モデルの違いは無関係なので何でもよい","z":"模型差异无关，用哪个都行"}],"a":[0],"e":"复杂、多步推理、件数少、精度第一——正是最高性能模型＋扩展思考的使用场景，多花的时间和成本是值得的。用最便宜模型且不检查，风险大，而且法律相关输出必须人工确认；本题优先的是精度不是速度；模型能力确有差异，不能说“用哪个都行”。","ej":"少量・複雑・精度最優先 → Opus（＋拡張思考）"},{"id":"d3-019","d":3,"t":"3.2","n":1,"q":"あるチームが「最も高性能なモデルを使えば、ハルシネーションは起きないので出力確認は不要」と考えている。この考えに対する最も適切な評価はどれか。","qz":"某团队认为“只要用性能最高的模型就不会出现幻觉，所以无需检查输出”。对此最合适的评价是哪一个？","o":[{"j":"誤り。上位モデルは下位モデルより常に誤りが多い","z":"错误。高级模型总是比低级模型错误更多"},{"j":"正しい。上位モデルは誤りを出さない","z":"正确。高级模型不会出错"},{"j":"正しい。ただし拡張思考をオンにした場合に限る。深く推論させれば誤りは起きないため、確認作業は省略してよい","z":"正确，但仅限于开启扩展思考时。只要深入推理就不会出错，所以可以省略确认工作"},{"j":"誤り。上位モデルでも誤りは起こり得るため、重要な出力は検証が必要である","z":"错误。即使是高级模型也可能出错，重要输出仍需验证"}],"a":[3],"e":"更强的模型可以降低出错率，但任何模型都可能产生幻觉，尤其是具体数字、引用、条文号，重要输出必须用一手资料验证。“高级模型不会出错”“开启扩展思考就不会出错”都是过度信任；“高级模型错误总是更多”也不正确。","ej":"どのモデルでもハルシネーションは起こり得る"},{"id":"d3-023","d":3,"t":"3.2","n":1,"q":"新しいClaudeモデルが発表され、チームで標準モデルを切り替えるか検討している。最も適切な進め方はどれか。","qz":"新的 Claude 模型发布了，团队在考虑是否切换标准模型。最合适的推进方式是哪一个？","o":[{"j":"新しいモデルは必ずすべての面で優れているので、発表された当日に全業務を切り替え、旧モデルの利用は禁止する","z":"新模型一定在所有方面都更优秀，所以在发布当天就切换全部业务，并禁止使用旧模型"},{"j":"代表的な業務タスクで現行モデルと比較評価し、品質・速度・コストを確認してから切り替える","z":"用代表性业务任务与现行模型比较评估，确认质量、速度、成本后再切换"},{"j":"変化を避けるため、新モデルは一切試さない","z":"为避免变化，完全不尝试新模型"},{"j":"発表記事の評判だけで判断する","z":"只凭发布文章的评价来判断"}],"a":[1],"e":"切换前用自己业务的代表性任务与现行模型对比，确认质量、速度、成本后再分阶段切换。“新模型一定全面更好、当天全部切换”风险大；“完全不尝试”会失去改进机会；只看发布文章的评价不一定反映自己的业务。","ej":"モデル変更は自社タスクで比較評価してから"},{"id":"d3-030","d":3,"t":"3.2","n":1,"q":"短納期で、数百件の商品説明文を一定のテンプレートに沿って生成する必要がある。内容は単純だが、ブランド表記のルールを守る必要がある。最も適切な進め方はどれか。","qz":"交期很短，需要按固定模板生成几百条商品说明。内容简单，但必须遵守品牌书写规则。最合适的推进方式是哪一个？","o":[{"j":"最上位モデルで1件ずつ時間をかけて生成し、ブランド表記のルールは生成後に担当者が全件を目視で修正する","z":"用最高级模型逐条花时间生成，品牌表记规则由负责人在生成后逐条目视修改"},{"j":"テンプレートやルールは示さず、モデルの判断に任せる","z":"不给模板和规则，交给模型自行判断"},{"j":"高速・低コストのモデルに、テンプレートとブランドルールを明示して生成させ、サンプルを確認してから全件処理する","z":"给快速低成本模型明确提供模板和品牌规则，先检查样例，再处理全部"},{"j":"生成後の確認は一切行わない","z":"生成后完全不检查"}],"a":[2],"e":"大量且简单 → 快速低成本模型；用明确的模板和规则保证一致性；先检查样例再批量，能及早发现问题。用最高级模型逐条生成又慢又贵；不给模板和规则无法保证品牌表记；生成后完全不检查缺少质量把关。","ej":"大量定型 → 高速モデル＋明確なルール＋サンプル確認"},{"id":"d3-046","d":3,"t":"3.2","n":1,"q":"Haikuを選ぶのが最も適しているタスクはどれか。","qz":"以下哪个任务最适合选择 Haiku？","o":[{"j":"新規事業の参入可否を、多数の資料から多面的に分析して提言をまとめる","z":"从大量资料多角度分析是否进入新业务，并整理建议"},{"j":"毎日数万件届く短い問い合わせ文に、決められたラベルを付ける","z":"给每天几万条简短的咨询文字打上规定好的标签"},{"j":"複雑な規制の条文を相互に照らし合わせ、矛盾点を推論で洗い出す","z":"把复杂法规的条文相互对照，通过推理找出矛盾点"},{"j":"経営陣向けに、長期的な戦略の選択肢とリスクを深く検討する","z":"为管理层深入研究长期战略的选项和风险"}],"a":[1],"e":"Haiku 快速、低成本，适合大量、简单、规则明确的任务，如短文本分类、打标签。多角度新业务分析、法规矛盾推理、长期战略研究都是复杂推理任务，更适合 Sonnet 或 Opus。","ej":"大量・単純・速度重視＝Haiku"},{"id":"d3-047","d":3,"t":"3.2","n":1,"q":"Opusを選ぶのが最も適しているタスクはどれか。","qz":"以下哪个任务最适合选择 Opus？","o":[{"j":"複数部門の要望が対立する業務改革案について、影響と論点を多段階で整理し、選択肢を比較する","z":"针对多个部门需求冲突的业务改革方案，多步骤整理影响和论点并比较选项"},{"j":"社内チャットで使う短い挨拶文を10パターン作る","z":"制作 10 种在公司聊天中使用的简短问候语"},{"j":"数百件の商品名を、決まった形式でカタカナから英字表記に変換し、一覧表として出力する","z":"把几百个商品名按固定格式从片假名转换为英文字母表记，并输出为一览表"},{"j":"会議の日時を確認するための一文のメールを書く","z":"写一句确认会议时间的邮件"}],"a":[0],"e":"Opus 性能最高，适合复杂推理、多步骤分析、质量最重要的场合，比如利益冲突的业务改革方案比较。格式转换、简短问候语、一句话邮件都是简单任务，用 Opus 浪费成本和时间。","ej":"複雑・多段階・質最優先＝Opus"},{"id":"d3-048","d":3,"t":"3.2","n":1,"q":"Sonnetの位置づけとして最も適切なものはどれか。","qz":"关于 Sonnet 的定位，最合适的是哪一个？","o":[{"j":"最も高速で最も安いが、文章作成には使えないモデル","z":"最快最便宜，但不能用于写作的模型"},{"j":"画像しか扱えない専用モデル","z":"只能处理图像的专用模型"},{"j":"最も高性能だが、応答が非常に遅いため、緊急時や特別な案件にしか使うことができないモデル","z":"性能最高，但响应非常慢，所以只能在紧急情况或特别案件中使用的模型"},{"j":"性能と速度・コストのバランスが取れ、多くの日常業務で標準として使いやすいモデル","z":"在性能与速度、成本之间取得平衡，适合作为大多数日常业务标准的模型"}],"a":[3],"e":"Sonnet 是平衡型模型，在性能、速度、成本之间取得平衡，适合起草、分析等大多数日常业务，是常见的默认选择。最快最便宜是 Haiku 的定位（且 Haiku 也能写作）；最高性能是 Opus；Sonnet 也不是图像专用模型。","ej":"Sonnet＝バランス型・日常業務の標準"},{"id":"d3-049","d":3,"t":"3.2","n":2,"q":"Claudeのモデル選択について正しい説明を2つ選べ。","qz":"关于 Claude 的模型选择，以下哪些说明是正确的？请选择 2 项。","o":[{"j":"モデルを変えれば、プロンプトの改善は一切不要になる","z":"只要换模型，就完全不需要改进提示词"},{"j":"モデルのバージョンは更新されていくため、名前の数字より「速度・コスト・性能」の特性で選ぶ考え方が重要である","z":"模型版本会不断更新，所以按“速度、成本、性能”的特性来选，比看名字里的数字更重要"},{"j":"同じワークフローでも、工程ごとに異なるモデルを使い分けることができる","z":"即使在同一个工作流程中，也可以按步骤分别使用不同的模型"},{"j":"小さいモデルは常に品質が低いので、業務では使うべきではない","z":"小模型质量总是很低，所以不应在业务中使用"},{"j":"高性能モデルを使えば、出力の事実確認は不要になる","z":"使用高性能模型后，就不需要对输出做事实确认"}],"a":[1,2],"e":"版本号会更新，考试考的是按特性选择的思路；同一流程可以按步骤用不同模型（例如先用 Haiku 分类，再用 Opus 深入分析重要案件）。小模型在简单大量任务上非常合适；换模型不能替代提示词改进；任何模型都可能产生幻觉，重要内容仍需验证。","ej":"特性で選ぶ・工程ごとに使い分け"},{"id":"d3-050","d":3,"t":"3.2","n":1,"q":"チームで「新しいモデルの方が賢いはずなので、既存の業務テンプレートも見直さずにすぐ切り替えよう」という意見が出た。最も適切な対応はどれか。","qz":"团队中有人提出：“新模型应该更聪明，所以现有业务模板也不用重新检查，马上切换吧。”最合适的应对是哪一个？","o":[{"j":"意見に従い、即日すべての業務を新モデルに切り替える","z":"听从意见，当天把所有业务切换到新模型"},{"j":"代表的な業務タスクとテンプレートで新旧モデルを比較し、品質・速度・コストを確認してから段階的に切り替える","z":"用代表性业务任务和模板比较新旧模型，确认质量、速度、成本后分阶段切换"},{"j":"新モデルについてのSNSの評判や比較記事を集め、評判が良ければ自社業務での確認はせずに切り替える","z":"收集社交媒体上关于新模型的评价和比较文章，评价好的话不在本公司业务中确认就切换"},{"j":"新モデルは信用できないため、今後も一切使わない方針にする","z":"新模型不可信，所以今后一律不用"}],"a":[1],"e":"新模型通常更强，但对具体业务的效果、输出风格、成本可能有变化，应该用代表性任务比较评估后再分阶段切换。不验证就全部切换风险大；一律不用会失去改进机会；网上评价不一定反映自己的业务。","ej":"切替前に代表タスクで比較評価"},{"id":"d3-051","d":3,"t":"3.2","n":1,"q":"コストを抑えるために全業務を最も安価なモデルに統一したところ、複雑な分析レポートの品質が下がり、手直しの時間が大幅に増えた。この状況の評価として最も適切なものはどれか。","qz":"为了降低成本，所有业务统一使用最便宜的模型，结果复杂分析报告的质量下降，修改时间大幅增加。对这一情况最合适的评价是哪一个？","o":[{"j":"モデルの料金だけでなく、手直しにかかる人の時間も含めた総コストで判断すべきであり、複雑なタスクには上位モデルを使う方がよい","z":"不应只看模型费用，而应包括人工修改时间在内的总成本来判断，复杂任务用更高级的模型更好"},{"j":"モデルの料金が下がったので、手直しの時間が増えても全体としては成功である","z":"模型费用降低了，即使修改时间增加，整体上也算成功"},{"j":"品質低下はプロンプトとは無関係なので、誰にも改善できない","z":"质量下降与提示词无关，所以谁也无法改善"},{"j":"すべての業務を最上位モデルに戻し、今後はコストを一切考慮しない","z":"把所有业务改回最高级模型，今后完全不考虑成本"}],"a":[0],"e":"成本要看总成本：模型费用省下的钱，可能被人工返工的时间抵消。正确做法是按任务难度分配模型：简单大量任务用便宜模型，复杂分析用更高级模型。只看模型费用会误判；质量可以通过提示词和模型选择改善；全部改回最高级、完全不考虑成本也是另一种极端。","ej":"総コスト（人の手直し含む）で判断"},{"id":"d3-052","d":3,"t":"3.2","n":1,"q":"モデルについての説明として誤っているものはどれか。","qz":"关于模型，以下哪个说明是错误的？","o":[{"j":"最上位モデルを使えば、知識のカットオフ後の最新ニュースも検索なしで正確に答えられる","z":"只要使用最高级模型，即使不搜索，也能准确回答知识截止日期之后的最新新闻"},{"j":"同じ指示でも、モデルによって出力の質や詳しさが異なることがある","z":"即使指示相同，不同模型的输出质量和详细程度也可能不同"},{"j":"どのモデルも学習データの時点以降の出来事は、検索などを使わない限り知らない","z":"任何模型在不使用搜索等手段时，都不知道训练数据截止之后发生的事"},{"j":"一般に、より高性能なモデルほどコストが高く、応答に時間がかかる傾向がある","z":"一般来说，性能越高的模型成本越高，响应也越慢"}],"a":[0],"e":"本题选“错误”的说明。知识截止日期对所有模型都存在，最高级模型不搜索也不知道之后的新闻，需要开启 Web 搜索或提供资料。其余三项都是正确说明：高性能＝更贵更慢；不同模型输出不同；不搜索不知道截止后的事。","ej":"上位モデルでもカットオフ後の情報は検索が必要"},{"id":"d3-073","d":3,"t":"3.2","n":1,"q":"ある利用者が「モデル名の後ろの数字が大きいほど、どんな用途でも必ず最適だ」と考えている。最も適切な助言はどれか。","qz":"某用户认为“模型名称后面的数字越大，就一定在任何用途上都是最佳选择”。最合适的建议是哪一个？","o":[{"j":"新しいモデルが改善されていることは多いが、用途に必要な速度・コスト・品質を自分の業務で確かめて選ぶことが大切だ","z":"新模型多半有所改进，但重要的是在自己的业务中确认用途所需的速度、成本、质量后再选择"},{"j":"数字が大きいモデルは必ず遅いので、使わない方がよい","z":"数字大的模型一定很慢，所以最好不用"},{"j":"その通りなので、常に最新・最上位のモデルだけを使えばよい","z":"没错，所以始终只用最新、最高级的模型就行"},{"j":"モデルの違いは名前だけなので、どれを選んでも結果は同じだ","z":"模型的区别只在名字，所以选哪个结果都一样"}],"a":[0],"e":"新版本通常有改进，但“最适合”取决于用途：大量简单任务可能用小模型更好。应以自己业务的速度、成本、质量需求来验证选择。“永远用最新最高级”忽略成本和速度；“数字大一定慢所以不用”是武断的；“只有名字不同”也错误。","ej":"用途に合わせて自分の業務で確かめる"},{"id":"d3-008","d":3,"t":"3.3","n":1,"q":"カスタマーサポート部門が、毎日数千件届く問い合わせを「請求」「技術」「その他」の3カテゴリに振り分けたい。各判定は単純で、処理速度とコストが重要である。最も適切な選択はどれか。","qz":"客服部门想把每天上千条咨询分为“账单”“技术”“其他”三类。每次判定都很简单，处理速度和成本很重要。最合适的选择是哪一个？","o":[{"j":"全件を最も高性能なモデルで処理し、品質を最大化する。分類ミスによる手戻りを防ぐためには、コストよりも精度を常に優先すべきである","z":"全部用最高性能模型处理，追求质量最大化。为防止分类错误造成返工，应始终把精度放在成本之前"},{"j":"Research機能で1件ずつ調べさせる","z":"用 Research 功能逐条调查"},{"j":"高速・低コストのモデル（Haiku）を使い、サンプルで精度を定期確認する","z":"使用快速低成本的模型（Haiku），并定期抽样检查准确率"},{"j":"拡張思考を常にオンにして慎重に判定させる","z":"始终开启扩展思考，让它谨慎判定"}],"a":[2],"e":"大量、简单、重视速度和成本 → 选快速低成本模型，同时用抽样检查确认分类质量。全部用最高性能模型浪费成本和时间；始终开启扩展思考会增加延迟和 token，对简单分类没必要；Research 用于多来源调查，完全不适合分类。","ej":"大量・単純・速度とコスト重視 → Haiku＋抽出確認"},{"id":"d3-009","d":3,"t":"3.3","n":1,"q":"営業企画チームが日常的に行う、議事録の要約・メール文案の作成・資料の構成案づくりに使う標準モデルを決めたい。品質とコスト・速度のバランスを重視する。最も適切なのはどれか。","qz":"营业企划团队想决定日常用于会议纪要摘要、邮件草稿、资料结构草案的标准模型。重视质量与成本、速度的平衡。最合适的是哪一个？","o":[{"j":"バランス型のSonnetを標準とし、特に難しい案件だけ上位モデルに切り替える","z":"以均衡型 Sonnet 为标准，只有特别难的案子才切换到更高级的模型"},{"j":"常にHaikuを使う。品質は問わない","z":"始终用 Haiku，不在乎质量"},{"j":"毎回ランダムにモデルを選ぶ","z":"每次随机选择模型"},{"j":"常にOpusを使う。最も高性能なモデルであれば、どの業務でも品質が最大になるので、コストや速度は考慮しなくてよい","z":"始终使用 Opus。只要是性能最高的模型，任何业务的质量都会最大化，所以不必考虑成本和速度"}],"a":[0],"e":"日常知识工作以平衡型 Sonnet 为默认，遇到复杂任务再升级到 Opus，遇到大批量简单任务再降到 Haiku，这就是“按任务需求匹配模型”。“始终用 Opus”浪费成本和速度；“始终用 Haiku”对写作类任务质量可能不足；随机选择没有依据。","ej":"日常業務の標準 → Sonnet、難題だけ上位へ"},{"id":"d3-010","d":3,"t":"3.3","n":2,"q":"モデル選択の考え方として適切なものを2つ選べ。","qz":"关于模型选择的思路，请选出 2 个合适的。","o":[{"j":"コストは利用部門の問題なので、モデル選択では考慮しない","z":"成本是使用部门的事，选模型时不考虑"},{"j":"最も高価なモデルなら必ず全てのタスクで最良の結果になるので、迷ったら常に最上位を選ぶ","z":"最贵的模型在所有任务上一定最好，犹豫时总是选最高级"},{"j":"小規模なテストで品質を確認し、十分なら低コストのモデルを採用する","z":"先小规模测试质量，如果足够就采用低成本模型"},{"j":"タスクの複雑さ・量・求められる速度・予算を考慮して選ぶ","z":"综合考虑任务复杂度、数量、所需速度和预算来选择"},{"j":"一度決めたモデルは、業務内容が変わっても見直さない","z":"一旦确定的模型，即使业务内容变化也不重新评估"}],"a":[2,3],"e":"正确的两项：按复杂度、数量、速度、预算综合选择；先小规模验证质量，够用就选低成本模型——这是平衡质量与成本的实践。错误：“最贵的模型一定最好”，对简单大量任务反而浪费成本和延迟；“定了就不再评估”，业务变化时应重新评估；“不考虑成本”，成本是模型选择的核心要素之一。","ej":"要件（複雑さ・量・速度・コスト）に合わせ、テストで検証"},{"id":"d3-011","d":3,"t":"3.3","n":1,"q":"拡張思考（Extended thinking）の利用に関する説明として、最も適切なものはどれか。","qz":"关于扩展思考（Extended thinking）的使用，最合适的说明是哪一个？","o":[{"j":"複雑な推論や分析で精度向上が期待できるが、応答時間とトークン消費が増える","z":"在复杂推理和分析中有望提高准确度，但响应时间和 token 消耗会增加"},{"j":"オンにすると出力が必ず事実として正しくなるため、検証は不要になり、確認の手間を減らせる","z":"开启后输出一定符合事实，因此不再需要验证，可以减少确认的工夫"},{"j":"コストを下げるための機能である","z":"这是用来降低成本的功能"},{"j":"どんなタスクでも常にオンにすべきで、デメリットはない","z":"任何任务都应始终开启，没有缺点"}],"a":[0],"e":"扩展思考让模型在回答前进行更多推理，适合复杂分析、多条件判断；代价是更慢、消耗更多 token。“任何任务都应开启”不对，简单任务没必要；“开启后一定符合事实”不对，推理更深不等于事实保证，仍需验证；它会增加而不是降低成本。","ej":"拡張思考＝精度↑、時間・トークン↑。検証は依然必要"},{"id":"d3-020","d":3,"t":"3.3","n":1,"q":"短い社内チャット返信の下書きを大量に作るため最速モデルを使っていたが、一部の複雑な技術的問い合わせへの回答品質が不十分だと分かった。最も適切な改善策はどれか。","qz":"为了大量制作简短的内部聊天回复草稿而使用最快的模型，但发现部分复杂技术咨询的回答质量不足。最合适的改进方案是哪一个？","o":[{"j":"品質問題は無視して速度を優先し続ける","z":"无视质量问题，继续优先速度"},{"j":"単純な問い合わせは高速モデルのまま、複雑な問い合わせだけ上位モデルに振り分ける","z":"简单咨询继续用快速模型，只把复杂咨询分配给更高级的模型"},{"j":"全件を最上位モデルに切り替える。一部でも品質問題があるなら、すべての問い合わせに最高品質のモデルを使うのが確実である","z":"全部切换到最高级模型。只要有一部分质量问题，所有咨询都用最高质量的模型最稳妥"},{"j":"Claudeの利用をやめる","z":"停止使用 Claude"}],"a":[1],"e":"按任务难度分流：多数简单咨询维持快速低成本模型，少数复杂咨询升级到更高级模型，同时兼顾成本与质量。全部换成最高级模型成本大增，对简单任务也无益；无视质量问题继续优先速度是放任风险；停止使用 Claude 是过度反应。","ej":"難易度で振り分け：単純→高速モデル、複雑→上位モデル"},{"id":"d3-027","d":3,"t":"3.3","n":2,"q":"コスト・速度・品質のトレードオフに関する記述として適切なものを2つ選べ。","qz":"关于成本、速度、质量的权衡，请选出 2 个合适的说法。","o":[{"j":"タスクの重要度や難易度に応じてモデルを使い分けることで、全体のコストと品質を最適化できる","z":"根据任务的重要性和难度区分使用模型，可以优化整体成本和质量"},{"j":"速度が必要な場面でも、常に拡張思考をオンにすべきである","z":"即使需要速度的场合，也应始终开启扩展思考"},{"j":"モデルの選択は出力品質に影響しない","z":"模型选择不影响输出质量"},{"j":"どのタスクでも最安モデルが最も費用対効果が高い","z":"无论什么任务，最便宜的模型性价比都最高"},{"j":"上位モデルは一般に高性能だが、コストが高く応答も遅めになりやすい","z":"高级模型一般性能更高，但成本更高、响应也往往更慢"}],"a":[0,4],"e":"正确的两项：高级模型一般更强，但更贵、响应也往往更慢；按任务的重要性和难度区分使用模型，可以优化整体成本和质量。错误：“最便宜的模型永远性价比最高”，复杂任务可能需要大量返工；“模型选择不影响质量”明显错误；“需要速度时也始终开启扩展思考”会增加延迟。","ej":"上位＝高性能・高コスト・遅め／使い分けで最適化"},{"id":"d3-053","d":3,"t":"3.3","n":1,"q":"人事部門が、数千件の社員アンケートの自由記述を「ポジティブ／ネガティブ／中立」に分類し、その中から深刻な不満を含む数十件について原因分析を行いたい。最も適切なモデルの使い方はどれか。","qz":"人事部门想把几千条员工问卷的自由填写内容分为“正面/负面/中立”，并从中对含有严重不满的几十条进行原因分析。最合适的模型用法是哪一个？","o":[{"j":"すべての工程に最上位モデルと拡張思考を使い、時間とコストは考えない","z":"所有步骤都使用最高级模型和扩展思考，不考虑时间和成本"},{"j":"すべてを最も安いモデルで行い、原因分析の結果も確認せずに経営層へ報告する。件数が多いのでコストを最優先する","z":"全部用最便宜的模型处理，原因分析结果也不确认就报告给管理层。因为件数多，所以成本最优先"},{"j":"大量の分類は高速・低コストのモデルで行い、抽出された重要案件の分析は高性能モデルで行う","z":"大量分类用快速低成本模型，抽出的重要案件分析用高性能模型"},{"j":"分類も分析もClaudeは使わず、すべて手作業で行う","z":"分类和分析都不用 Claude，全部手工完成"}],"a":[2],"e":"按步骤匹配模型：大量简单的分类交给快速低成本模型，少量复杂的原因分析交给高性能模型，同时兼顾成本和质量。全部用最高级浪费；全部用最便宜且不确认就上报风险大（人事相关内容需要人工审核）；完全手工则放弃了合适的效率提升。","ej":"大量の単純作業と少数の深い分析でモデルを使い分け"},{"id":"d3-054","d":3,"t":"3.3","n":1,"q":"ある部署が、モデルを選ぶ際に考慮すべき要素を整理している。最も適切な組み合わせはどれか。","qz":"某部门在整理选择模型时应考虑的因素。最合适的组合是哪一个？","o":[{"j":"担当者が使い慣れているモデル名と、社内アンケートでの人気の高さ","z":"负责人用惯了的模型名称，以及公司内问卷中的人气高低"},{"j":"モデルの発表日の新しさだけ","z":"只看模型发布日期是否最新"},{"j":"回答の文字数が多いかどうかだけ","z":"只看回答字数多不多"},{"j":"タスクの複雑さ、処理量、求められる速度、許容できるコスト、必要な品質","z":"任务复杂度、处理量、要求的速度、可接受的成本、需要的质量"}],"a":[3],"e":"模型选择的核心是任务需求：复杂度、处理量、速度、成本、质量。个人喜好和人气没有依据；只看发布日期不一定适合你的任务；字数多不等于质量高。","ej":"複雑さ・量・速度・コスト・品質で選ぶ"},{"id":"d3-055","d":3,"t":"3.3","n":1,"q":"社内FAQの一次回答を自動で下書きする運用で、ほとんどの質問は定型的だが、ごく一部に法務判断が必要な質問が含まれる。最も適切な設計はどれか。","qz":"在自动起草公司内部 FAQ 初步回答的运营中，大部分问题是固定的，但极少数包含需要法务判断的问题。最合适的设计是哪一个？","o":[{"j":"法務判断が必要な質問も含め、すべて最上位モデルが回答すれば精度は十分なので、人のレビューは不要になる","z":"包括需要法务判断的问题在内，只要全部由最高级模型回答，精度就足够，不需要人工审核"},{"j":"定型的な質問は高速なモデルで下書きし、法務判断が必要と思われる質問は法務担当者のレビューに回す","z":"固定问题用快速模型起草，看起来需要法务判断的问题交给法务人员审核"},{"j":"法務の質問があるため、FAQ全体でClaudeの利用をやめる","z":"因为有法务问题，所以整个 FAQ 都停止使用 Claude"},{"j":"すべての質問を最も安価なモデルで回答し、法務関連も含めてそのまま社員に送信する","z":"所有问题都用最便宜的模型回答，包括法务相关的也直接发给员工"}],"a":[1],"e":"按风险和难度分流：大部分固定问题用快速模型高效处理；法务判断属于高风险领域，必须有专家审核（Human-in-the-loop）。高级模型不能取代法务判断；因少数问题全面停用是过度反应；法务内容不经审核直接发送风险很大。","ej":"定型は高速モデル／高リスクは専門家レビュー"},{"id":"d3-056","d":3,"t":"3.3","n":2,"q":"「速度」を最優先すべきタスクとして適切なものを2つ選べ。","qz":"以下哪些任务应该把“速度”放在最优先？请选择 2 项。","o":[{"j":"ライブチャットで顧客を待たせずに返す、短い定型回答の下書き","z":"在线客服中不让客户等待的简短固定回答草稿"},{"j":"半年かけて検討する中期経営計画の論点整理","z":"花半年研究的中期经营计划的论点整理"},{"j":"重大事故の原因を多面的に分析する報告書の作成","z":"多角度分析重大事故原因的报告制作"},{"j":"リアルタイムに流れてくる大量の投稿を、その場でカテゴリ分けする作業","z":"对实时涌入的大量帖子当场进行分类的工作"},{"j":"新規事業の投資判断に使う詳細なリスク分析","z":"用于新业务投资判断的详细风险分析"}],"a":[0,3],"e":"实时、大量、简单的任务（在线客服的短回答草稿、实时帖子分类）以速度为先，适合快速模型。中期计划、事故原因分析、投资风险分析都是质量优先的复杂任务，花更多时间换取准确性是值得的。","ej":"リアルタイム・大量・単純＝速度優先"},{"id":"d3-057","d":3,"t":"3.3","n":1,"q":"ある担当者は、どのモデルを使うべきか迷ったとき「とりあえず最上位モデル」を選んでいる。より適切な進め方はどれか。","qz":"某负责人在不确定该用哪个模型时，总是“先用最高级模型”。更合适的做法是哪一个？","o":[{"j":"標準的なモデルで試し、品質が足りなければ上位モデルへ、十分ならそのまま使う。大量処理では小さいモデルで足りるかを試す","z":"先用标准模型试，质量不够再换更高级的，足够就继续用；大量处理时试试小模型是否够用"},{"j":"最上位モデルで常に処理し、コストの報告はしない","z":"始终用最高级模型处理，不汇报成本"},{"j":"毎回違うモデルをランダムに選んで同じ依頼を出し、その中で最も結果が良かったものを採用して、どのモデルだったかは記録しないでおく","z":"每次随机选不同模型发同样的请求，采用其中结果最好的，不记录是哪个模型"},{"j":"最も安いモデルだけを使い、品質が足りなければ諦める","z":"只用最便宜的模型，质量不够就放弃"}],"a":[0],"e":"实用的做法是从标准（平衡型）模型开始试，根据质量需要升级或降级。“总用最高级”浪费成本和时间；随机选择没有依据，也难以复现；只用最便宜的、不够就放弃，会错失合适的解决方案。","ej":"標準モデルで試し、必要に応じて上げ下げ"},{"id":"d3-058","d":3,"t":"3.3","n":1,"q":"プロンプトは同じまま、モデルを上位に変えても出力の問題（必要な項目の抜け）が解消しなかった。最も考えられる原因と対応はどれか。","qz":"提示词不变，只把模型换成更高级的，输出问题（遗漏必要项目）仍未解决。最可能的原因和应对是哪一个？","o":[{"j":"上位モデルでも解決しないなら、Claudeでは不可能なタスクであると判断し、別のAIツールの導入を検討する","z":"连高级模型都解决不了，就判断这是 Claude 做不到的任务，考虑引入其他 AI 工具"},{"j":"指示に必要な項目が明示されていない可能性があるため、必須項目や出力形式をプロンプトで具体的に指定する","z":"可能是指示中没有明确写出必要项目，所以在提示词中具体指定必需项目和输出格式"},{"j":"さらに上位のモデルが出るまで待つ","z":"等待更高级的模型推出"},{"j":"同じプロンプトを何度も再送信し、偶然うまくいくのを待つ","z":"反复重发同一提示词，等它偶然成功"}],"a":[1],"e":"遗漏项目往往是提示词问题，而不是模型能力问题：没有明确列出必需项目和格式时，任何模型都可能遗漏。先诊断原因、改进指示（列出检查项、给出模板）。断定“做不到”、等新模型、反复重发碰运气，都没有处理根本原因。","ej":"モデル変更で直らない＝指示の具体性を見直す"},{"id":"d3-059","d":3,"t":"3.3","n":1,"q":"社外向けプレスリリースの最終稿を作成する。分量は1本で、誤りがあると企業の信頼に大きく影響する。最も適切な進め方はどれか。","qz":"要制作一份对外新闻稿的终稿。只有一篇，一旦出错会严重影响企业信誉。最合适的做法是哪一个？","o":[{"j":"品質を重視して高性能なモデルで作成し、事実・数値・表現を担当者と広報責任者が確認してから公開する","z":"重视质量，用高性能模型制作，由负责人和公关负责人确认事实、数字和表达后再发布"},{"j":"速度を優先して最も高速なモデルで作成し、そのまま公開する","z":"优先速度，用最快的模型制作并直接发布"},{"j":"Claudeが作った文章は信頼できないので、作成に一切使わない","z":"Claude 写的文章不可靠，所以完全不用于制作"},{"j":"上位モデルで作成すれば事実や数値の誤りは起きないので、確認は不要であり、作成後すぐに配信する","z":"用高级模型制作就不会有事实和数字错误，所以不需要确认，做完马上发布"}],"a":[0],"e":"件数少、影响大、质量第一 → 可以用高性能模型，但对外发布必须由人确认事实、数字和表达。优先速度直接发布风险大；完全不用是过度反应；“高级模型就不用确认”是过度信任。","ej":"重要な対外文書＝高品質モデル＋人の最終確認"},{"id":"d3-060","d":3,"t":"3.3","n":1,"q":"毎週、同じ形式の短い営業日報を50件要約する作業がある。現在は最上位モデルで処理しており、品質は十分だがコストと待ち時間が課題になっている。最も適切な改善策はどれか。","qz":"每周要对 50 份同样格式的简短销售日报做摘要。目前用最高级模型处理，质量足够，但成本和等待时间成了问题。最合适的改进措施是哪一个？","o":[{"j":"拡張思考をオンにして、さらに丁寧に処理させる","z":"开启扩展思考，让它处理得更细致"},{"j":"品質が十分なので、コストと待ち時間は我慢して現状を続ける。モデルを変えると品質が下がる危険があるためである","z":"质量足够，所以忍受成本和等待时间维持现状。因为换模型有质量下降的风险"},{"j":"要約をやめて、日報を全部そのまま上司に転送する","z":"不做摘要，把日报全部原样转发给上司"},{"j":"より高速・低コストなモデルで同じ日報を試し、品質が許容範囲なら切り替える","z":"用更快、更便宜的模型试处理同样的日报，质量可接受就切换"}],"a":[3],"e":"同格式、简短、大量的摘要是快速低成本模型的典型场景。先用样本测试质量，可接受就切换，既保住质量又降低成本和等待。维持现状放弃了优化机会；停止摘要会失去价值；开启扩展思考只会让成本和等待更多。","ej":"定型・大量は小さいモデルで試して切替"},{"id":"d3-074","d":3,"t":"3.3","n":1,"q":"社内報の記事案を作る作業で、下書き作成は短時間で何本も試したいが、最終的に採用する1本は丁寧に仕上げたい。最も適切なモデルの使い方はどれか。","qz":"在制作公司内刊文章方案时，草稿想在短时间内试写多篇，但最终采用的一篇想精心打磨。最合适的模型用法是哪一个？","o":[{"j":"モデルは関係ないので、どのモデルで作っても同じ品質になる","z":"与模型无关，用哪个模型做质量都一样"},{"j":"すべての下書きを最上位モデルと拡張思考で作り、時間とコストがかかっても採用案が出るまで待つ","z":"所有草稿都用最高级模型和扩展思考制作，即使花时间和成本也要等到出现可采用的方案"},{"j":"最終稿も最も安いモデルで作り、確認せずに掲載する","z":"终稿也用最便宜的模型制作，不确认直接刊登"},{"j":"下書きの量産は高速なモデルで行い、採用案の仕上げは高性能なモデルで行い、最後に人が確認する","z":"批量写草稿用快速模型，最终采用稿的打磨用高性能模型，最后由人确认"}],"a":[3],"e":"同一任务的不同阶段可以用不同模型：量多、求快的草稿阶段用快速模型；少量、质量优先的定稿阶段用高性能模型；最后人工确认。草稿全用最高级会浪费时间和成本；终稿不确认就刊登有风险；模型对质量确实有影响。","ej":"工程ごとにモデルを使い分ける"},{"id":"d3-075","d":3,"t":"3.3","n":1,"q":"モデル選択の判断を部門内で共有したい。最も適切な方法はどれか。","qz":"想在部门内共享模型选择的判断。最合适的方法是哪一个？","o":[{"j":"各自が自由に選び、結果の違いは気にしない","z":"各自自由选择，不在意结果的差异"},{"j":"最上位モデル以外の使用を禁止する","z":"禁止使用最高级模型以外的模型"},{"j":"代表的なタスクごとに推奨モデルと理由（品質・速度・コスト）をまとめたガイドを作り、定期的に見直す","z":"按代表性任务整理推荐模型及理由（质量、速度、成本）的指南，并定期复查"},{"j":"一度決めた推奨モデルは、モデルが更新されても混乱を避けるために今後も変更しない","z":"一旦定下的推荐模型，即使模型更新，为了避免混乱今后也不更改"}],"a":[2],"e":"把“哪类任务用哪个模型、为什么”整理成指南，可以让团队判断一致，并随模型更新和业务变化定期复查。完全各自为政会导致质量和成本不稳定；只允许最高级模型浪费成本；永不更改无法跟上变化。","ej":"推奨モデルのガイド化と定期見直し"},{"id":"d3-012","d":3,"t":"3.4","n":1,"q":"同じチャットで数時間にわたり企画書を練り上げてきたところ、Claudeが序盤に合意した前提を忘れたり、応答が遅くなったりしてきた。最も適切な対処はどれか。","qz":"在同一个对话里花了几个小时打磨企划书，Claude 开始忘记前面达成一致的前提，响应也变慢。最合适的处理是哪一个？","o":[{"j":"Claudeは長い会話でも全てを完全に覚えているので、気のせいとして続ける","z":"Claude 在长对话中也能完全记住一切，当作错觉继续"},{"j":"これまでの合意事項と現状を要約させ、その要約を使って新しいチャットで再開する","z":"让它总结至今为止的共识和现状，用这份摘要在新对话中重新开始"},{"j":"同じチャットで「前提を忘れないで」と繰り返し入力し続け、序盤の合意事項も毎回もう一度貼り付け直す","z":"在同一对话里不断重复输入“不要忘记前提”，每次还把开头的共识事项重新粘贴一遍"},{"j":"最初から全てをやり直し、これまでの成果は破棄する","z":"从头全部重来，丢弃之前的成果"}],"a":[1],"e":"对话变长会占满上下文窗口，导致早期信息被淡化、质量下降、速度变慢。标准做法：让 Claude 总结要点 → 带着摘要在新对话中重新开始。在同一对话里反复强调“别忘了”只会让对话更长、问题更严重；“Claude 能完全记住一切”前提错误；全部推倒重来没有必要。","ej":"長い会話で劣化 → 要約して新しいチャットで再開"},{"id":"d3-013","d":3,"t":"3.4","n":1,"q":"コンテキストウィンドウの説明として最も適切なものはどれか。","qz":"关于上下文窗口（context window），最合适的说明是哪一个？","o":[{"j":"Claudeが過去の全ユーザーとの会話を記憶する領域","z":"Claude 记住所有用户过去对话的区域"},{"j":"Claudeがインターネット上で検索できる範囲のことで、Web検索を有効にすると広がり、無効にすると狭くなる上限のことである","z":"指 Claude 能在互联网上搜索的范围，开启 Web 搜索时会扩大、关闭时会缩小的上限"},{"j":"ユーザーが保存できるチャットの数の上限","z":"用户可以保存的对话数量上限"},{"j":"Claudeが一度に扱える作業記憶で、指示・アップロードしたファイル・会話履歴などがこの中に収まる必要がある","z":"Claude 一次能处理的工作记忆，指令、上传文件、对话历史等都需要容纳在其中"}],"a":[3],"e":"上下文窗口是模型单次处理时的“工作记忆”，项目指令、文件、整段对话历史、当前回答都在其中，接近上限就会出现遗忘或无法继续。“可搜索的互联网范围”说的是 Web 搜索；它与可保存的对话数量无关；模型也不会跨用户记住所有人的对话。","ej":"コンテキスト＝一度に扱える作業記憶（指示＋ファイル＋履歴）"},{"id":"d3-014","d":3,"t":"3.4","n":1,"q":"プロジェクトマネージャーが、毎回のチャットで「私はPMで、報告は箇条書き3点以内、敬体で」と説明している。この恒常的な好みを毎回伝える手間を省きたい。最も適切なのはどれか。","qz":"项目经理每次对话都要说明“我是 PM，汇报最多 3 个要点，用敬体”。想省去每次传达这些固定偏好的麻烦。最合适的是哪一个？","o":[{"j":"恒常的な好みはメモリや該当Projectの指示に持たせ、新しいチャットでも反映されるようにする","z":"把固定偏好放进记忆功能或对应 Project 的指令，使新对话也能体现"},{"j":"毎回チャットの最後に同じ説明を貼り付け続ける","z":"每次都在对话最后粘贴同样的说明"},{"j":"一つのチャットを永遠に使い続け、新しいチャットは開かないようにすれば、一度伝えた好みがずっと反映される","z":"永远只用一个对话、不开新对话，这样说过一次的偏好就会一直被体现"},{"j":"シークレットチャットを使う","z":"使用无痕对话"}],"a":[0],"e":"长期不变的偏好应“持久化”：放在记忆（Memory）或 Project 指令中，每次新对话自动生效。每次手动粘贴低效易漏；永远只用一个对话会让上下文无限变长、质量下降；无痕对话不使用也不保存记忆，正好相反。","ej":"恒常的な情報 → メモリ／Project指示に永続化"},{"id":"d3-015","d":3,"t":"3.4","n":1,"q":"従業員が、社外秘の人事評価に関するブレインストーミングを、今後のメモリや会話履歴に残さない形で一時的に行いたい（組織ポリシー上、Claudeの利用自体は許可されている）。最も適切な機能はどれか。","qz":"员工想临时进行一次关于内部保密人事评价的头脑风暴，且不希望留在今后的记忆和对话历史中（按组织政策，使用 Claude 本身是允许的）。最合适的功能是哪一个？","o":[{"j":"Projectを作り、評価資料を全てナレッジに入れる","z":"建一个 Project，把评价资料全部放入知识库"},{"j":"メモリに「この内容は忘れて」と書き込んでおく","z":"在记忆里写上“忘掉这些内容”"},{"j":"シークレットチャット（インコグニート）を使う","z":"使用无痕对话（Incognito）"},{"j":"Research機能を使う","z":"使用 Research 功能"}],"a":[2],"e":"无痕对话不会保存到历史，也不会用于或写入记忆，适合不想留痕的临时讨论。把评价资料放进 Project 会让资料长期留存，与目的相反；在记忆里写“忘掉这些”不是可靠的控制方式；Research 与留痕问题无关。注意：无痕不等于可以无视组织的数据政策。","ej":"履歴・メモリに残さない一時的な会話 → シークレットチャット"},{"id":"d3-016","d":3,"t":"3.4","n":2,"q":"長期にわたるプロジェクトで、コンテキストの制限を踏まえた情報管理として適切なものを2つ選べ。","qz":"在长期项目中，考虑上下文限制的信息管理方式，请选出 2 个合适的。","o":[{"j":"全ての作業を1つのチャットに集約し、決して新しいチャットを開かない","z":"所有工作集中在一个对话里，绝不开新对话"},{"j":"重要な決定事項や前提は、定期的に要約してProjectナレッジや指示に反映する","z":"定期总结重要决定和前提，并反映到 Project 知识库或指令中"},{"j":"関係のない大容量ファイルも念のため全て会話にアップロードしておく","z":"把无关的大文件也全部上传到对话中以防万一"},{"j":"話題が大きく変わるときは、新しいチャットを開始する","z":"话题发生大变化时开启新对话"},{"j":"Claudeは自動で全てを永久に記憶するので、管理は不要である","z":"Claude 会自动永久记住一切，不需要管理"}],"a":[1,3],"e":"正确的两项：定期总结重要决定和前提，持久化到 Project 知识或指令中；话题大幅变化时开新对话，避免无关历史占用上下文。错误：所有工作塞进一个对话，越长越容易劣化；无关大文件“以防万一”全部上传，浪费上下文、干扰回答；“Claude 会自动永久记住一切”，上下文有上限，记忆也不是全部永久保存。","ej":"要約して永続化／話題が変われば新チャット"},{"id":"d3-022","d":3,"t":"3.4","n":1,"q":"メモリ機能について、組織のTeamプランで利用者が「メモリの設定が見当たらない」と言っている。最も考えられる理由はどれか。","qz":"关于记忆功能，组织 Team 方案的用户说“找不到记忆设置”。最可能的原因是哪一个？","o":[{"j":"Teamプランではメモリ機能が存在しない","z":"Team 方案根本没有记忆功能"},{"j":"利用者がシークレットチャットを一度でも使うと永久に無効化される","z":"用户只要用过一次无痕对话就会永久失效"},{"j":"Team/Enterpriseでは、メモリは管理者が組織で有効化する必要があり、まだ有効化されていない可能性がある","z":"在 Team/Enterprise 中，记忆需要管理员在组织层面开启，可能尚未开启"},{"j":"メモリはモデルをHaikuにすると表示される","z":"把模型换成 Haiku 才会显示记忆"}],"a":[2],"e":"个人方案记忆默认开启；Team/Enterprise 需要组织管理员先启用。用户看不到设置，应联系管理员确认组织设置。“Team 方案根本没有记忆功能”错误；“用过一次无痕对话就永久失效”“换成 Haiku 才会显示”都不是事实。","ej":"Team/Enterpriseのメモリは管理者が有効化"},{"id":"d3-025","d":3,"t":"3.4","n":1,"q":"大量の資料を1つのチャットにアップロードしたところ、「会話が長すぎる」旨の表示が出て続行できなくなった。最も適切な対応はどれか。","qz":"在一个对话中上传了大量资料后，出现“对话过长”的提示，无法继续。最合适的处理是哪一个？","o":[{"j":"Claudeは長さに制限がないので、時間をおいて再送する","z":"Claude 没有长度限制，过一会儿重发"},{"j":"同じファイルを何度も再アップロードする","z":"反复重新上传同样的文件"},{"j":"資料を関連するものに絞る・分割して扱う、または継続利用ならProjectナレッジに置いて検索で参照させる","z":"把资料缩减为相关部分或拆分处理；如果要持续使用，就放进 Project 知识库让它通过检索参照"},{"j":"資料の内容を想像で補ってもらう","z":"让它凭想象补全资料内容"}],"a":[2],"e":"达到上下文上限时，应减少放入的内容（只放相关部分、分批处理），长期使用的资料放进 Project 知识库，资料多时会自动切换到检索方式（RAG）。反复重新上传、过一会儿重发都不解决根本问题；让它凭想象补全资料会导致幻觉。","ej":"上限到達 → 絞る・分割する・Projectナレッジ（RAG）へ"},{"id":"d3-029","d":3,"t":"3.4","n":1,"q":"利用者が「Claudeが以前の会話内容を覚えていて驚いた。どこで管理できるのか」と尋ねている。最も適切な案内はどれか。","qz":"用户问：“Claude 记得之前的对话内容，让我很吃惊。在哪里可以管理？”最合适的说明是哪一个？","o":[{"j":"アカウントを削除する以外に方法はない","z":"除了删除账号没有其他办法"},{"j":"一度記憶された内容は利用者には管理できず、管理者だけが確認できる。利用者は記憶されたくない内容を最初から話さないしかない","z":"一旦被记住的内容用户无法管理，只有管理员能查看。用户只能从一开始就不说不想被记住的内容"},{"j":"設定のメモリ関連項目から、記憶内容の確認・編集や、メモリ・過去チャット参照の無効化ができる","z":"可以在设置中的记忆相关项目查看、编辑记忆内容，或关闭记忆和过往对话参照"},{"j":"Claudeは過去の会話を覚えることはない","z":"Claude 从不记住过去的对话"}],"a":[2],"e":"记忆功能是透明可控的：用户可以在设置中查看和编辑记忆、关闭记忆或“搜索并参照过往对话”。“用户无法管理”“只能删除账号”都不正确；“Claude 从不记住过去的对话”也不对，记忆和过往对话搜索确实存在。","ej":"メモリは設定で確認・編集・無効化できる"},{"id":"d3-061","d":3,"t":"3.4","n":1,"q":"新しいチャットを始めた利用者が「昨日の別の会話で決めた方針をClaudeが覚えていない」と困っている。メモリ機能はオフである。最も適切な対応はどれか。","qz":"新开对话的用户很困扰：“Claude 不记得昨天在另一个对话里定下的方针。”记忆功能处于关闭状态。最合适的应对是哪一个？","o":[{"j":"Claudeが故障しているので、サポートに連絡する","z":"Claude 出故障了，联系客服"},{"j":"Claudeに「昨日の会話を思い出して」と何度も入力すれば、別の会話の内容も復元できる","z":"对 Claude 反复输入“想起昨天的对话”，就能恢复另一个对话的内容"},{"j":"前回の決定事項の要約を新しい会話の冒頭に貼るか、継続する作業ならProjectにまとめて保存する","z":"把上次决定事项的摘要贴在新对话开头，或者如果是持续性工作就整理保存到 Project 里"},{"j":"同じ内容をすべて最初から説明し直すしか方法はない","z":"除了从头全部重新说明外没有别的办法"}],"a":[2],"e":"记忆关闭时，每个对话的上下文是独立的，新对话不会自动知道别的对话的内容。做法：把要点摘要贴进新对话；持续性工作用 Project 保存资料和指令（或在允许时启用记忆/过往对话搜索）。这不是故障；反复说“想起来”不能恢复；也不必每次从头说明全部内容。","ej":"会話は独立：要約を持ち込む／Projectで永続化"},{"id":"d3-062","d":3,"t":"3.4","n":1,"q":"長い会話の途中で、Claudeに「ここまでの内容を要約して」と依頼した。この要約を新しい会話で使う際の注意点として最も適切なものはどれか。","qz":"在长对话中途请 Claude“总结到目前为止的内容”。在新对话中使用这份摘要时，最需要注意的是哪一个？","o":[{"j":"重要な決定事項・数値・前提が抜けたり変わったりしていないか確認してから使う","z":"确认重要的决定事项、数字、前提没有遗漏或被改变后再使用"},{"j":"要約は必ず元の会話の全文より長くなるので、使わない方がよい","z":"摘要一定比原对话全文更长，所以最好不用"},{"j":"新しい会話では要約は読まれないので、意味がない","z":"新对话不会读取摘要，所以没有意义"},{"j":"要約はClaudeが元の会話を読んで作ったものなので、内容は正確であり、そのまま信頼して使ってよい","z":"摘要是 Claude 读了原对话后做的，所以内容准确，可以直接信任使用"}],"a":[0],"e":"摘要也是 Claude 的输出，可能遗漏或改变重要细节，所以带入新对话前要检查关键决定、数字、前提。直接信任有风险；摘要通常比全文短；贴进新对话的摘要会作为上下文被读取，这正是续接的方法。","ej":"要約も確認してから引き継ぐ"},{"id":"d3-063","d":3,"t":"3.4","n":2,"q":"新しい会話を始める方がよい状況を2つ選べ。","qz":"以下哪些情况下最好开始新对话？请选择 2 项。","o":[{"j":"同じ文章の1文だけを少し修正したいとき","z":"只想稍微修改同一篇文章中的一句话时"},{"j":"直前の回答の続きを書いてほしいとき","z":"希望它接着刚才的回答继续写时"},{"j":"これまでとは全く別のテーマの作業に移るとき","z":"要转到与之前完全不同主题的工作时"},{"j":"長いやり取りで誤った試行が多く積み重なり、応答の質が落ちてきたとき","z":"长时间交流中积累了很多错误尝试，回答质量开始下降时"},{"j":"直前の回答について、簡単な追加質問をしたいとき","z":"想就刚才的回答提一个简单的追加问题时"}],"a":[2,3],"e":"主题完全改变时，旧的历史只会占用上下文、带来干扰；对话很长且积累了很多错误尝试时，质量会下降，应总结要点后开新对话。修改一句话、接着写、简单追问，都依赖当前对话的上下文，在同一对话里继续更合适。","ej":"テーマ変更・質の低下＝新しい会話へ"},{"id":"d3-064","d":3,"t":"3.4","n":1,"q":"メモリ機能が有効な状態で、社員が業務と無関係な私的な相談をした後、その内容が今後の業務の回答に影響しないか心配している。最も適切な対応はどれか。","qz":"在记忆功能开启的状态下，员工做了与业务无关的私人咨询，担心这些内容会影响今后工作相关的回答。最合适的应对是哪一个？","o":[{"j":"メモリは一度記録されると変更できないため、アカウントを作り直す","z":"记忆一旦记录就无法更改，所以重新创建账号"},{"j":"設定でメモリの内容を確認し、不要な内容を編集・削除する。今後はシークレットチャットの利用も検討する","z":"在设置中查看记忆内容，编辑、删除不需要的内容。今后也可以考虑使用无痕对话"},{"j":"Claudeに「今の話は忘れて」と言えば、メモリも会話履歴も含めて、すべての記録が完全に消える","z":"对 Claude 说“忘掉刚才的话”，包括记忆和对话历史在内的所有记录都会完全消失"},{"j":"何もしない。メモリは業務の回答に一切使われない","z":"什么也不做。记忆完全不会用于工作相关的回答"}],"a":[1],"e":"记忆是可以查看和管理的：在设置中确认、编辑或删除不需要的内容，也可以关闭记忆；不想留痕的对话可用无痕对话。记忆并非不可更改；口头说“忘掉”不是可靠的管理方式；记忆的目的就是在之后的对话中参考背景，所以“完全不用”不对。","ej":"メモリは設定で確認・編集・削除できる"},{"id":"d3-065","d":3,"t":"3.4","n":1,"q":"Projectごとのメモリに関する説明として最も適切なものはどれか。","qz":"关于每个 Project 的记忆，最合适的说明是哪一个？","o":[{"j":"すべてのProjectのメモリは共通で、別のProjectの内容も自動的に混ざる","z":"所有 Project 的记忆是共用的，其他 Project 的内容也会自动混入"},{"j":"Projectの中ではメモリ機能は一切使えない","z":"在 Project 中完全不能使用记忆功能"},{"j":"Projectのメモリは他の利用者全員に自動で公開される","z":"Project 的记忆会自动公开给其他所有用户"},{"j":"Projectごとにメモリが分かれているため、案件や顧客ごとの文脈が混ざりにくい","z":"每个 Project 的记忆是分开的，所以不同案件或客户的上下文不容易混在一起"}],"a":[3],"e":"每个 Project 的记忆是分开的，可以避免不同案件、不同客户的上下文互相混淆，这也是按目的拆分 Project 的好处之一。说记忆“全部共用”“Project 中不能用”“自动公开给所有人”都不正确。","ej":"Projectごとにメモリは分離"},{"id":"d3-066","d":3,"t":"3.4","n":1,"q":"大量の資料をチャットに追加しながら作業を続けたところ、序盤に指示した出力形式が守られなくなってきた。最も考えられる原因と対応はどれか。","qz":"在对话中不断追加大量资料继续工作，结果一开始指示的输出格式渐渐不被遵守。最可能的原因和应对是哪一个？","o":[{"j":"Claudeが指示に反抗しているので、強い口調で叱る","z":"Claude 在反抗指示，所以用强硬的语气训斥"},{"j":"資料をさらに追加すれば、形式も自然と守られるようになる","z":"再追加更多资料，格式就会自然被遵守"},{"j":"出力形式は一度伝えれば永久に守られるはずなので、そのまま続ける","z":"输出格式只要说一次就会永远被遵守，所以继续下去"},{"j":"会話の情報量が増えて初期の指示が埋もれている可能性があるため、要点と出力形式をまとめ直して新しい会話を始めるか、指示をProjectに設定する","z":"对话信息量增多，最初的指示可能被淹没，所以重新整理要点和输出格式开新对话，或把指示设置到 Project 中"}],"a":[3],"e":"上下文变长时，早期的指示容易被淡化。应重新整理要点和格式，在新对话中开始；持续使用的格式规则放进 Project 指令，让它在每个对话中都生效。训斥语气解决不了上下文问题；“说一次就永久遵守”不成立；继续加资料只会让情况更糟。","ej":"長い会話で初期指示が埋もれる→整理して再開／Project指示へ"},{"id":"d3-067","d":3,"t":"3.4","n":1,"q":"情報を「持続させる」場所の使い分けとして最も適切なものはどれか。","qz":"关于“持久保存”信息的地方如何区分使用，最合适的是哪一个？","o":[{"j":"どんな情報も、その場の会話にだけ書いておけば十分である","z":"任何信息只要写在当时的对话里就足够了"},{"j":"機密資料も含めて、すべてをメモリに覚えさせるのが最も安全である","z":"包括机密资料在内，全部让记忆记住是最安全的"},{"j":"すべての情報をメモリに入れれば、Projectは不要になる","z":"把所有信息都放进记忆，就不需要 Project 了"},{"j":"案件の資料と共通ルールはProjectのナレッジと指示に、個人の恒常的な好みはメモリや個人設定に、その場限りの条件は会話に書く","z":"案件资料和共通规则放进 Project 的知识与指令，个人长期偏好放在记忆或个人设置，只用于当次的条件写在对话里"}],"a":[3],"e":"分层保存：案件资料、团队共通规则 → Project 知识与指令；个人长期偏好 → 记忆或个人设置；一次性条件 → 当次对话。只写在对话里无法跨对话延续；记忆不能替代 Project 的资料管理和共享；把机密资料塞进记忆不符合数据管理原则。","ej":"Project／メモリ／会話を使い分ける"},{"id":"d3-068","d":3,"t":"3.4","n":1,"q":"コンテキストウィンドウに関する説明として誤っているものはどれか。","qz":"关于上下文窗口，以下哪个说明是错误的？","o":[{"j":"会話が長くなると上限に近づき、新しい内容を受け付けにくくなったり、初期の内容が埋もれたりすることがある","z":"对话变长会接近上限，可能难以再接收新内容，或者早期内容被淹没"},{"j":"アップロードしたファイルや指示もコンテキストの一部として扱われる","z":"上传的文件和指示也会作为上下文的一部分处理"},{"j":"不要な資料を入れないことは、コンテキストを有効に使うことにつながる","z":"不放入不需要的资料，有助于有效利用上下文"},{"j":"コンテキストウィンドウは無制限なので、どれだけ資料を入れても品質は変わらない","z":"上下文窗口是无限的，所以无论放多少资料，质量都不会变化"}],"a":[3],"e":"本题选“错误”的说明。上下文窗口有上限，放入过多资料会让早期内容被淡化甚至无法继续。其余三项都是正确的：会话变长会接近上限；文件和指示也占用上下文；避免无关资料能更有效利用上下文。","ej":"コンテキストには上限がある"},{"id":"d3-069","d":3,"t":"3.4","n":1,"q":"1つの会話で3つの顧客案件を並行して相談していたところ、A社の条件がB社の提案に混ざってしまった。最も適切な改善策はどれか。","qz":"在一个对话里同时咨询 3 个客户案件，结果 A 公司的条件混进了 B 公司的提案。最合适的改进措施是哪一个？","o":[{"j":"混ざるのは避けられないので、提案書を送る前に各顧客に内容を確認してもらい、誤りがあれば指摘してもらう","z":"混在一起无法避免，所以发送提案书前请各客户确认内容，有错误时请他们指出"},{"j":"案件ごとに会話（継続するならProject）を分け、それぞれに必要な情報だけを入れる","z":"按案件分开对话（持续性的话分开 Project），每个只放所需信息"},{"j":"1つの会話に全顧客の資料をさらに追加し、Claudeに区別させる","z":"在一个对话里继续追加所有客户的资料，让 Claude 自己区分"},{"j":"Claudeの利用を1日1案件までに制限する","z":"把 Claude 的使用限制为每天 1 个案件"}],"a":[1],"e":"不同案件混在一个上下文里，容易发生信息混用，对客户来说还是信息泄露风险。按案件分开对话或 Project（Project 的记忆也是分开的），只放所需信息。让客户替你检查不合适，而且会把一家公司的信息暴露给另一家公司；继续追加资料会让混淆更严重；限制使用次数没有解决原因。","ej":"案件ごとに会話／Projectを分ける"},{"id":"d3-070","d":3,"t":"3.4","n":1,"q":"「過去のチャットを検索して参照する」機能（Search and reference chats）の説明として最も適切なものはどれか。","qz":"关于“搜索并参照过往对话”（Search and reference chats）功能，最合适的说明是哪一个？","o":[{"j":"自分の過去の会話から関連する内容を探して、現在の作業に活かすことができ、設定で無効にもできる","z":"可以从自己过去的对话中查找相关内容用于当前工作，也可以在设置中关闭"},{"j":"一度オンにすると、利用者は無効にできない","z":"一旦开启，用户就无法关闭"},{"j":"シークレットチャットの内容も検索対象になる","z":"无痕对话的内容也会成为搜索对象"},{"j":"他の利用者のチャットも含めて社内のすべての会話を検索できるため、他部署の議論も参考にできる","z":"可以搜索包括其他用户对话在内的公司所有对话，所以也能参考其他部门的讨论"}],"a":[0],"e":"该功能让 Claude 搜索并引用你自己过去的对话，可以在设置中关闭。它不会搜索其他用户的对话；不能关闭的说法错误；无痕对话不会成为搜索对象。","ej":"過去チャット検索＝自分の会話が対象・設定で無効化可"},{"id":"d3-071","d":3,"t":"3.4","n":2,"q":"長期間続く業務で、コンテキストとメモリを適切に管理する行動を2つ選べ。","qz":"在长期持续的业务中，以下哪些是正确管理上下文和记忆的行为？请选择 2 项。","o":[{"j":"念のため、関係のない過去資料もすべて同じ会話に入れ続ける","z":"以防万一，把无关的过去资料也全部持续放进同一个对话"},{"j":"会話が長くなっても、新しい会話は一切始めない","z":"即使对话变长，也绝不开始新对话"},{"j":"節目ごとに決定事項を要約し、必要な情報をProjectのナレッジや指示に反映する","z":"在每个阶段节点总结决定事项，把需要的信息反映到 Project 的知识或指令中"},{"j":"メモリがあるので、Projectの資料の更新は不要になる","z":"因为有记忆，所以不需要更新 Project 的资料"},{"j":"メモリに記録された内容を定期的に確認し、古くなった情報や不要な情報を整理する","z":"定期查看记忆中记录的内容，整理过时或不需要的信息"}],"a":[2,4],"e":"定期总结并持久化到 Project、定期检查并整理记忆，都是长期管理上下文的好习惯。无关资料持续堆进同一对话会浪费上下文、干扰回答；对话变长不开新对话会让质量下降；记忆不能代替 Project 资料的维护。","ej":"要約して永続化・メモリも定期的に整理"},{"id":"d4-001","d":4,"t":"4.1","n":1,"q":"営業部門から「Claudeで何か効率化したい」という漠然とした相談を受けた。最初に行うべきこととして最も適切なものはどれか。","qz":"销售部门提出了“想用Claude提高点效率”这种模糊的咨询。最先应该做的事情，最合适的是哪一项？","o":[{"j":"最も高性能なモデルを全員に配布し、使いながら各自で効率化できる業務を見つけてもらう","z":"给所有人分配最高性能的模型，让每个人在使用中自己找到能提效的业务"},{"j":"まずAPI連携による営業支援の自動化システムを外注し、要件は稼働後に調整する","z":"先外包基于API对接的销售支持自动化系统，需求在上线后再调整"},{"j":"現在の業務フローと時間のかかっている作業を洗い出し、課題と成功指標を明確にする","z":"梳理当前的业务流程和耗时的工作，明确课题和成功指标"},{"j":"他社の事例をそのまま導入する","z":"直接照搬其他公司的案例"}],"a":[2],"e":"导入前先做需求分析：明确现状流程、痛点和衡量成功的指标，才能判断Claude适合用在哪里。直接发高端模型没有目标；照搬他社案例不一定符合本部门；一上来就做API系统超出了Associate的范围，也未确认需求。","ej":"まず現状業務と課題・成功指標を明確化"},{"id":"d4-002","d":4,"t":"4.1","n":1,"q":"人事担当者が、採用面接の議事メモから候補者の評価サマリーを作るユースケースを検討している。Claudeの適用可否を判断するうえで最も重要な観点はどれか。","qz":"人事负责人在考虑一个用例：根据招聘面试的会议笔记生成候选人评价摘要。判断是否适用Claude时，最重要的观点是哪一项？","o":[{"j":"出力の文字数をどれだけ減らせるか","z":"能把输出的字数减少多少"},{"j":"候補者に知らせずに処理できるかどうか","z":"能否在不告知候选人的情况下处理"},{"j":"個人情報の扱いに関する社内規程への適合と、最終判断を人が行う体制があるか","z":"是否符合关于个人信息处理的公司规定，以及是否有由人来做最终判断的体制"},{"j":"Claudeが評価基準に沿って採否を自動決定し、面接官の負担をなくせるかどうか","z":"Claude能否按评价标准自动决定录用与否，从而消除面试官的负担"}],"a":[2],"e":"招聘涉及个人信息和对人的重大决定，评估用例时首先要看数据处理是否合规、以及是否保留人的最终判断。让AI自动决定录用属于高风险用法；字数不是核心；不告知候选人违背透明性。","ej":"人に影響する判断は人が最終決定・個人情報規程に適合"},{"id":"d4-003","d":4,"t":"4.1","n":2,"q":"マーケティングチームがClaude活用候補の業務を挙げた。Claudeに適した候補として適切なものを2つ選べ。","qz":"市场团队列出了Claude的候选应用业务。请选出2项适合Claude的候选。","o":[{"j":"キャンペーン案のブレインストーミングと複数案の比較","z":"活动方案的头脑风暴及多方案比较"},{"j":"リアルタイムの株価に基づく自動発注","z":"基于实时股价的自动下单"},{"j":"顧客アンケートの自由記述回答のテーマ分類と要約","z":"客户问卷自由回答的主题分类和摘要"},{"j":"正式な広告予算の最終承認","z":"正式广告预算的最终审批"},{"j":"法的契約書への代表者署名","z":"在法律合同上代表人签字"}],"a":[0,2],"e":"头脑风暴和大量文本的分类摘要是Claude擅长的增强型任务。预算最终审批、合同签字属于需要人负责的决策；基于实时股价自动下单既需要实时数据又是高风险自动化，不适合Associate层面的Claude使用。","ej":"発想支援・大量テキスト整理は得意、承認・署名は人"},{"id":"d4-004","d":4,"t":"4.1","n":1,"q":"Claudeを使って新しい社内問い合わせ対応フローを設計したい。要件定義の段階でClaudeを最も効果的に使う方法はどれか。","qz":"想用Claude设计新的内部咨询应对流程。在需求定义阶段最有效使用Claude的方法是哪一项？","o":[{"j":"過去の問い合わせ例と制約条件を渡し、関係者・要件・抜け漏れの論点を洗い出させてから人が確認する","z":"提供过去的咨询案例和约束条件，让它梳理相关方、需求和遗漏点，然后由人确认"},{"j":"網羅的なシステム仕様書をClaudeに一度で作らせ、時間短縮のため開発会社へそのまま送付する","z":"让Claude一次性生成全面的系统规格书，为节省时间直接发给开发公司"},{"j":"要件定義は人だけで行い、Claudeは文章校正だけに使う","z":"需求定义只由人来做，Claude只用于文字校对"},{"j":"「良いフローを作って」とだけ依頼し、出てきた案をそのまま採用する","z":"只说“做一个好的流程”，直接采用给出的方案"}],"a":[0],"e":"在需求分析中，给Claude足够的背景（过去案例、约束），让它帮忙整理相关方、需求和遗漏点，再由人审核，是典型的增强用法。只给模糊指令得到的方案质量不可控；只用于校对浪费能力；未经审核直接发出规格书风险大。","ej":"背景を渡して論点洗い出し→人が確認"},{"id":"d4-005","d":4,"t":"4.1","n":1,"q":"ある業務について、Claudeで自動化すべきか、人の作業を支援(拡張)すべきかを判断したい。拡張(Augmentation)のほうが適している業務の特徴はどれか。","qz":"想判断某项业务应该用Claude自动化，还是用来辅助（增强）人的工作。哪一项特征说明更适合“增强”？","o":[{"j":"担当者がまったく関与したくない作業","z":"负责人完全不想参与的工作"},{"j":"誤りがあっても影響がほとんどない定型作業","z":"即使出错也几乎没有影响的固定作业"},{"j":"判断に文脈や専門知識が必要で、結果の責任を人が負う業務","z":"判断需要上下文和专业知识，且由人对结果负责的业务"},{"j":"毎回同じ形式で入力され、判定ルールが明確に文書化されている大量の定型処理","z":"每次以相同格式输入、判定规则已明确文档化的大量定型处理"}],"a":[2],"e":"AI Fluency中区分Automation（自动化）和Augmentation（增强）。需要专业判断、责任在人的业务适合人与AI协作的增强模式。规则明确的大量处理、低影响定型作业更适合自动化；“不想参与”不是判断依据。","ej":"専門判断・人が責任→Augmentation"},{"id":"d4-006","d":4,"t":"4.1","n":1,"q":"教育担当者が、研修資料作成にClaudeを導入する効果を事前に見積もりたい。最も適切な進め方はどれか。","qz":"培训负责人想事先估算在培训资料制作中导入Claude的效果。最合适的推进方式是哪一项？","o":[{"j":"全資料を一斉に切り替えてから効果を考える","z":"所有资料一次性切换后再考虑效果"},{"j":"ベンダーや他社の公開事例にある平均削減率を引用し、自部署の資料数を掛けて効果を算出する","z":"引用供应商或他社公开案例中的平均削减率，乘以本部门资料数计算效果"},{"j":"一部の資料で試行し、作成時間と品質(レビュー指摘数など)を従来と比較する","z":"在部分资料上试行，比较制作时间和质量（如审核指出数）与以往的差异"},{"j":"効果測定は不要なので、利用者数だけ数える","z":"不需要效果测定，只统计用户数"}],"a":[2],"e":"小规模试点（パイロット）并用时间和质量等指标与基线比较，是评估用例价值的标准做法。供应商数据不代表自己的环境；一次性全量切换风险大；仅统计用户数无法说明价值。","ej":"小さく試行し、時間・品質をベースラインと比較"},{"id":"d4-007","d":4,"t":"4.1","n":1,"q":"経理部が「月次の請求書データをClaudeで照合したい」と相談してきた。データは社内会計システムに数万件あり、毎日更新される。Associateとして最も適切な対応はどれか。","qz":"财务部咨询“想用Claude核对每月的发票数据”。数据在公司会计系统中有数万条，每天更新。作为Associate最合适的应对是哪一项？","o":[{"j":"サンプルデータで照合ルールの整理や例外パターン分析を支援しつつ、システム連携による本格自動化は開発者・アーキテクトに相談する","z":"用样本数据协助整理核对规则和分析例外模式，同时把基于系统对接的正式自动化交给开发者/架构师商量"},{"j":"会計システムの管理者アカウントとパスワードを共有してもらい、Claudeから直接全データを参照できるようにして毎日の照合を完全に自動化する","z":"让对方共享会计系统管理员账号和密码，使Claude能直接参照全部数据，把每天的核对完全自动化"},{"j":"毎日すべてのデータをチャットに貼り付ける運用を提案する","z":"建议每天把所有数据粘贴到聊天中的运作方式"},{"j":"照合は不可能だと伝えて検討を終える","z":"告知无法核对并结束讨论"}],"a":[0],"e":"大规模、每日更新、与系统集成的自动化超出Associate范围，应升级给Developer/Architect；但Associate可以在样本层面帮助梳理规则。每天手动粘贴数万条不现实且易错；直接放弃不必要；共享管理员密码违反安全原则。","ej":"大規模なシステム連携は開発者・アーキテクトへエスカレーション"},{"id":"d4-036","d":4,"t":"4.1","n":1,"q":"総務部で「社内の備品申請メールへの返信が多くて大変」という声がある。Claude活用を検討する最初のステップとして最も適切なものはどれか。","qz":"总务部反映“回复内部备品申请邮件的工作量很大”。作为讨论 Claude 应用的第一步，最合适的是哪一项？","o":[{"j":"問い合わせ対応はAIに向かないので、Claudeの活用対象から外すことを部内に周知する","z":"认为问询处理不适合 AI，通知部门把它排除在 Claude 应用范围之外"},{"j":"すぐにClaudeで返信テンプレートを100種類作成し、全員に配布して使ってもらう","z":"马上用 Claude 制作 100 种回复模板，发给所有人使用"},{"j":"他社の事例をそのまま取り入れ、同じ運用ルールで明日から開始するよう指示する","z":"照搬其他公司的案例，指示从明天起按同样规则开始运行"},{"j":"現状の件数・所要時間・よくある問い合わせの種類を整理し、どこに負荷があるかを把握する","z":"整理目前的件数、所需时间和常见问询类型，弄清负担集中在哪里"}],"a":[3],"e":"先要把业务问题量化（件数、时间、类型），才能判断 Claude 能在哪个环节发挥作用、怎么衡量效果。马上大量做模板是“先有手段后找问题”；直接排除没有依据；照搬他社案例忽略了本公司的实际情况。","ej":"まず現状把握（件数・時間・種類）→課題の特定"},{"id":"d4-037","d":4,"t":"4.1","n":1,"q":"ある自治体の窓口担当者が、住民からの手続き相談にClaudeを使いたいと考えている。ユースケースとして最も適切なものはどれか。","qz":"某地方政府的窗口负责人想把 Claude 用于居民的手续咨询。作为用例，最合适的是哪一项？","o":[{"j":"住民の個人情報を含む過去の相談記録をすべて個人アカウントのClaudeに入れて分析する","z":"把包含居民个人信息的所有过往咨询记录放进个人账号的 Claude 中分析"},{"j":"職員が公式の手続き案内を参照しながら、住民向け説明文のたたき台をClaudeで作り、職員が確認してから渡す","z":"职员参照官方手续说明，用 Claude 制作面向居民的说明初稿，由职员确认后再交给居民"},{"j":"法令の解釈は難しいので、条文の確認は省略してClaudeの説明をそのまま窓口で読み上げる","z":"法规解释很难，所以省略条文确认，在窗口直接朗读 Claude 的说明"},{"j":"住民がClaudeと直接やりとりし、窓口の待ち時間を減らすために、受給資格の有無の最終判定から結果の通知までをClaudeに一貫して任せる","z":"为了减少窗口等待时间，让居民直接与 Claude 对话，把从最终判定领取资格到通知结果全部交给 Claude"}],"a":[1],"e":"以人确认为前提、基于官方资料制作初稿，是低风险且有效的用法。资格判定属于影响居民权益的决定，必须由人负责；个人信息放入个人账号违反数据管理；不核对条文直接使用存在幻觉风险。","ej":"影響の大きい判定は人が行い、Claudeは下書き支援に"},{"id":"d4-038","d":4,"t":"4.1","n":2,"q":"製造業の品質管理部門で、Claude活用に向いている業務を2つ選べ。","qz":"在制造业的质量管理部门，选出 2 项适合使用 Claude 的业务。","o":[{"j":"顧客クレーム対応の報告書を、社内様式に沿って文章として整える","z":"把客户投诉处理报告按公司内部格式整理成文"},{"j":"出荷可否の最終判定を、検査担当者の確認なしでClaudeに任せる","z":"不经检验人员确认，把能否出货的最终判定交给 Claude"},{"j":"ISO監査で提出する測定データの数値を、Claudeにもっともらしく補完させる","z":"让 Claude 把 ISO 审核要提交的测量数据“合理地”补全"},{"j":"不具合報告書の自由記述を読み、原因カテゴリごとに分類・集計する下書きを作る","z":"阅读不良报告中的自由描述，按原因类别做分类、汇总的初稿"},{"j":"製造ラインのセンサー値をリアルタイムで監視し、異常時に自動でラインを停止させる","z":"实时监控生产线传感器数值，异常时自动停止生产线"}],"a":[0,3],"e":"文字为中心、结果可以由人检查的工作（分类自由描述、整理报告文案）适合 Claude。实时设备控制需要系统集成，超出 Associate 范围；出货判定必须由人负责；编造测量数据属于造假，绝对不可以。","ej":"文章中心・人が検証できる業務が向いている"},{"id":"d4-039","d":4,"t":"4.1","n":1,"q":"人事部が「Claude導入の成功を何で判断するか」を検討している。成功指標の設定として最も適切なものはどれか。","qz":"人事部在讨论“用什么判断 Claude 导入是否成功”。关于成功指标的设定，最合适的是哪一项？","o":[{"j":"導入前に現状の作業時間や修正回数を測っておき、導入後の同じ指標と比較できるようにする","z":"导入前先测量目前的作业时间和修改次数，以便和导入后的同一指标比较"},{"j":"効果はやってみないと分からないため、指標は決めずに半年ほど自由に使ってもらう","z":"效果要试了才知道，所以不定指标，先自由使用半年左右"},{"j":"「AIを使っている」こと自体が組織にとっての成果なので、各部署の利用者数とログイン回数を毎月集計して報告すれば、成功の判断材料として十分とする","z":"认为“在用 AI”本身就是组织的成果，每月汇总各部门的使用人数和登录次数并报告，就足以作为判断成功的依据"},{"j":"経営層に好印象を与えるため、最も楽観的な削減時間の試算値を目標として掲げる","z":"为了给高层留下好印象，把最乐观的时间削减估算作为目标"}],"a":[0],"e":"成功指标要有导入前的基线才能比较。只看使用人数无法说明业务效果；不设指标无法评估；用最乐观估算会造成期望过高。","ej":"導入前にベースラインを測り、前後比較できる指標を"},{"id":"d4-040","d":4,"t":"4.1","n":1,"q":"小売チェーンの本部で、店舗スタッフ向けの新商品説明資料を毎週作っている。Claude適用の検討で、要件として最初に確認すべきことはどれか。","qz":"零售连锁总部每周为门店员工制作新品说明资料。讨论用 Claude 时，首先要确认的需求是哪一项？","o":[{"j":"他部署が使っているAIツールの数と、それぞれの月額料金の一覧","z":"其他部门在用的 AI 工具数量和各自的月费一览"},{"j":"Claudeで使える最上位モデルの名前と、そのモデルの最新バージョン番号、および他のモデルとの性能差の一覧","z":"Claude 可用的最高级模型名称、该模型的最新版本号，以及与其他模型的性能差异一览"},{"j":"資料の読み手（店舗スタッフ）が何を知りたいか、どんな形式なら現場で使いやすいか","z":"资料的读者（门店员工）想知道什么、什么格式在现场最好用"},{"j":"資料作成担当者の過去の人事評価と、作業スピードの個人ランキング","z":"资料制作负责人过去的人事评价和工作速度的个人排名"}],"a":[2],"e":"需求分析从“谁用、要解决什么问题”开始。模型版本、其他工具价格与本用例的需求关系不大；个人人事评价与需求无关，还涉及隐私。","ej":"要件は「読み手・目的・使われ方」から"},{"id":"d4-041","d":4,"t":"4.1","n":1,"q":"法務部から「判例調査をClaudeで完全に置き換えたい」という要望が来た。Associateとしての最も適切な対応はどれか。","qz":"法务部提出“想用 Claude 完全替代判例调查”。作为 Associate，最合适的应对是哪一项？","o":[{"j":"Claudeは大量の法律文書で学習しており判例を正確に覚えているため、引用された判例番号や判決日はそのまま書面に使ってよいと伝える","z":"告诉对方 Claude 用大量法律文书训练过，能准确记住判例，引用的判例编号和判决日期可以直接用在文书中"},{"j":"論点整理や調査メモの下書きなど支援できる範囲を示し、判例の存在と内容は必ず公式データベースで確認する運用を提案する","z":"说明能支持的范围（整理论点、调查备忘初稿等），并建议判例的存在与内容必须在官方数据库中确认"},{"j":"判例調査用の専用AIシステムを自分でAPI連携して構築し、来月から稼働させると約束する","z":"承诺自己通过 API 集成搭建判例调查专用 AI 系统，下个月上线"},{"j":"法律分野はリスクがあるため、どんな用途でもClaudeの利用は一切認められないと回答する","z":"因为法律领域有风险，回答任何用途都绝对不能使用 Claude"}],"a":[1],"e":"正确做法是明确“能帮什么、必须人来确认什么”。判例编号是典型的幻觉高发点，不能直接用；全面禁止过度；自行 API 开发超出 Associate 范围，应交给 Developer/Architect。","ej":"支援範囲と検証ルールを示す。判例番号は必ず一次資料で確認"},{"id":"d4-042","d":4,"t":"4.1","n":2,"q":"新しい業務へのClaude適用を判断する際、慎重な検討（または人の関与強化）が必要なサインを2つ選べ。","qz":"判断是否把 Claude 用于新业务时，选出 2 个需要慎重讨论（或加强人工参与）的信号。","o":[{"j":"出力の誤りを事後に検証する手段がなく、誤ると取り返しがつかない","z":"没有手段事后验证输出错误，而且一旦出错无法挽回"},{"j":"結果が個人の採用・評価・与信など、人の権利や生活に大きく影響する","z":"结果会大幅影响个人的录用、评价、信用审批等权利和生活"},{"j":"社内向けのアイデア出しで、最終案は会議で人が決める","z":"用于内部头脑风暴，最终方案由人在会议上决定"},{"j":"下書きをもとに担当者が必ず内容を確認してから使う運用になっている","z":"运营方式是负责人一定会基于初稿确认内容后再使用"},{"j":"作業が文章中心で、毎週ほぼ同じ形式で繰り返し発生する","z":"工作以文字为中心，每周以几乎相同的格式重复发生"}],"a":[0,1],"e":"无法验证且不可挽回、对个人权利影响大的场景，需要更谨慎、加强人工参与。文字为中心的重复工作、有人工确认的初稿、内部头脑风暴，都是风险较低、适合 Claude 的用法。","ej":"検証不能・不可逆・人への影響大 → 慎重に"},{"id":"d4-043","d":4,"t":"4.1","n":1,"q":"IT部門のヘルプデスク担当者が、Claudeを使って問い合わせ対応を改善したい。要件を洗い出すためのClaudeの使い方として最も適切なものはどれか。","qz":"IT 部门的服务台负责人想用 Claude 改进问询处理。作为梳理需求的 Claude 用法，最合适的是哪一项？","o":[{"j":"「ヘルプデスクの要件を全部考えて」とだけ伝え、Claudeが一般的な観点から網羅的に出した案を、そのまま要件定義書として確定させる","z":"只说“把服务台的需求全部想出来”，把 Claude 从一般角度全面列出的方案直接定为需求定义书"},{"j":"現場へのヒアリングは不要なので、Claudeの一般論だけで要件を決める","z":"认为不需要访谈一线，只用 Claude 的一般论来决定需求"},{"j":"個人情報を除いた過去の問い合わせログを渡し、多い問い合わせの種類・解決に時間がかかる原因を分類させる","z":"提供去除个人信息后的过往问询记录，让 Claude 分类出常见问询类型和处理耗时的原因"},{"j":"問い合わせログを社員名やPCのIDも含めてそのままアップロードし、個人ごとの傾向を分析する","z":"把包含员工姓名和电脑 ID 的问询记录原样上传，分析每个人的倾向"}],"a":[2],"e":"用去标识化的实际数据让 Claude 帮忙分类、找原因，是有效的需求分析。只给模糊指示并直接定稿缺少验证；原样上传个人信息违反数据保护；不访谈一线只靠一般论会偏离实际。","ej":"匿名化した実データ＋Claudeで分類 → 人が確認"},{"id":"d4-044","d":4,"t":"4.1","n":1,"q":"教育機関の職員が、学生からの奨学金に関する質問にClaudeを活用したい。もっとも適切な検討ポイントはどれか。","qz":"教育机构的职员想用 Claude 回答学生关于奖学金的提问。最合适的讨论要点是哪一项？","o":[{"j":"学生の家計状況の詳細をすべてClaudeに入力し、支給額を自動で決定させる","z":"把学生家庭经济情况的详细信息全部输入 Claude，让它自动决定发放金额"},{"j":"回答の丁寧さを最優先し、内容の正確さは学生自身に確認してもらう","z":"把回答的礼貌放在第一位，内容准确性由学生自己确认"},{"j":"Claudeは一般的な奨学金制度を知っているので、学内の要項は渡さなくてよいとする","z":"Claude 了解一般的奖学金制度，所以不必提供校内简章"},{"j":"最新の募集要項を根拠として使えるか、回答を職員が確認する体制を作れるかを確認する","z":"确认能否以最新的招募简章为依据，能否建立由职员确认回答的机制"}],"a":[3],"e":"制度信息会每年变化，需要以最新的正式资料为依据，并有人确认。仅靠一般知识可能过时或不符合本校规定；自动决定金额涉及个人权益和敏感数据；把准确性推给学生是不负责任的。","ej":"最新の一次資料を根拠に＋職員の確認体制"},{"id":"d4-045","d":4,"t":"4.1","n":1,"q":"ある部門が「Claudeを使えば何でも自動化できる」と考え、20の業務を同時にClaude化しようとしている。最も適切な助言はどれか。","qz":"某部门认为“用 Claude 什么都能自动化”，打算同时把 20 项业务改为由 Claude 处理。最合适的建议是哪一项？","o":[{"j":"効果が大きくリスクが低い業務を2〜3件選び、小さく試して効果と課題を確認してから広げる","z":"选出 2〜3 项效果大、风险低的业务，小规模试行，确认效果和问题后再推广"},{"j":"自動化はリスクが高いので、20業務すべてを諦めて従来どおり手作業を続ける","z":"自动化风险高，20 项全部放弃，继续手工作业"},{"j":"せっかく全社の期待が高まっているので、20業務すべてを同時に開始し、問題が出た業務だけを後から個別に止めていく","z":"既然全公司的期待很高，就 20 项业务同时开始，出问题的业务以后再逐个停止"},{"j":"最上位モデルを使えば失敗しないので、業務の選定は不要だと伝える","z":"告诉对方用最高级模型就不会失败，所以不需要筛选业务"}],"a":[0],"e":"按“效果×风险”排定优先级，从小规模试点开始，是导入的基本做法。同时铺开难以管理和评估；全部放弃过于消极；模型选择不能代替用例筛选。","ej":"優先順位付け＋小さく試す（パイロット）"},{"id":"d4-046","d":4,"t":"4.1","n":1,"q":"マーケティング部で、SNS投稿文の作成にClaudeを使う案がある。要件として明確にしておくべきこととして最も重要なものはどれか。","qz":"市场部有用 Claude 写 SNS 帖子的方案。作为需求，最需要事先明确的是哪一项？","o":[{"j":"競合他社の投稿文をそのまま流用できるよう、大量にコピーして渡すこと","z":"为了能直接挪用竞争对手的帖子，大量复制给 Claude"},{"j":"ブランドのトーン、禁止表現、投稿前の承認者など、品質と責任のルール","z":"品牌语气、禁止用语、发帖前的批准人等质量与责任规则"},{"j":"投稿の承認は不要とし、Claudeの出力をそのまま自動投稿する設定方法","z":"不需要批准，把 Claude 的输出原样自动发布的设置方法"},{"j":"Claudeが1日に生成できる投稿の最大数を事前に調べておくこと","z":"事先查清 Claude 一天最多能生成多少条帖子"}],"a":[1],"e":"对外发布内容需要明确品牌规范和批准流程。生成数量不是关键需求；无人审核直接发布风险高；照搬他社内容有著作权问题。","ej":"対外発信はトーン・禁止事項・承認者を決める"},{"id":"d4-008","d":4,"t":"4.2","n":1,"q":"新規市場への参入を検討するため、複数の公開情報源から競合動向をまとめたい。最も適したClaudeの機能はどれか。","qz":"为了研究进入新市场，想从多个公开信息源汇总竞争对手动态。最适合的Claude功能是哪一项？","o":[{"j":"Research(リサーチ)機能で、引用付きの調査レポートを作成させる","z":"用Research（研究）功能，生成带引用的调研报告"},{"j":"スタイル設定を「簡潔」に変える","z":"把风格设置改为“简洁”"},{"j":"通常のチャットでOpusに競合の動向を質問し、学習済みの知識の範囲でまとめさせる","z":"在普通聊天中向Opus询问竞争动向，让它在已学习知识的范围内汇总"},{"j":"Haikuに一文で答えさせる","z":"让Haiku用一句话回答"}],"a":[0],"e":"需要跨多个信息源、多步检索并带出处的调研，正适合Research功能。只凭模型已学习的知识无法保证信息最新且没有出处；风格设置与信息收集无关；一句话回答无法满足综合调研。","ej":"多数の情報源・引用付き調査→Research"},{"id":"d4-009","d":4,"t":"4.2","n":1,"q":"プロジェクトマネージャーが、3か月の社内システム移行計画をClaudeと一緒に作りたい。最も効果的な依頼方法はどれか。","qz":"项目经理想和Claude一起制定3个月的内部系统迁移计划。最有效的委托方式是哪一项？","o":[{"j":"目的、期限、関係部署、制約(予算・停止可能時間など)を伝え、まずフェーズ分けとリスクを出させてから詳細化する","z":"告知目的、期限、相关部门、约束（预算、可停机时间等），先让它分阶段并列出风险，然后再细化"},{"j":"移行に関する一般的なベストプラクティスをClaudeに質問し、出てきた詳細なガントチャートの日付と担当者をそのまま確定版として関係部署に通知する","z":"向Claude询问迁移相关的一般最佳实践，把给出的详细甘特图的日期和负责人直接作为定稿通知相关部门"},{"j":"過去の別プロジェクトの計画書を渡し、日付だけ変えさせる","z":"提供过去其他项目的计划书，只让它改日期"},{"j":"「移行計画を作って」と一言で依頼する","z":"只说一句“做个迁移计划”"}],"a":[0],"e":"规划类任务需要提供目的、期限、相关方、约束等上下文，并分步骤（先阶段划分和风险，再细化）推进。一句话指令缺少背景；套用别的项目计划忽略差异；一次性生成的日期未经验证不能直接确定。","ej":"文脈+制約を渡し、段階的に詳細化"},{"id":"d4-010","d":4,"t":"4.2","n":1,"q":"受注処理に時間がかかっている。業務改善のためClaudeを使う方法として最も適切なものはどれか。","qz":"接单处理很耗时。为了业务改善，使用Claude的方法中最合适的是哪一项？","o":[{"j":"改善は不要と判断し、処理件数を減らす","z":"判断不需要改善，减少处理件数"},{"j":"受注処理の全工程を即日Claudeに置き換える","z":"当天就把接单处理的全部工序替换为Claude"},{"j":"Claudeに業界の先進事例をもとにした理想の受注フローを設計させ、現行手順や担当者へのヒアリングは省いて、来月から全面的にそのまま導入する","z":"让Claude基于行业先进案例设计理想的接单流程，省略对现行步骤的确认和对负责人的访谈，从下个月起全面直接导入"},{"j":"担当者の作業手順を書き出してClaudeに渡し、ボトルネックや重複作業の候補と改善案を挙げさせ、関係者と検証する","z":"写出负责人的作业步骤交给Claude，让它列出瓶颈和重复作业的候选及改善方案，再与相关人员验证"}],"a":[3],"e":"流程优化要基于现状：把实际步骤交给Claude分析瓶颈与重复，再由相关人员验证。脱离现状的理想流程可能不可行；一天内全部替换风险过高；减少件数不是改善。","ej":"現行手順を基に分析→関係者で検証"},{"id":"d4-011","d":4,"t":"4.2","n":2,"q":"Claudeを使った業界調査の結果を経営会議に提出する。提出前に行うべきこととして適切なものを2つ選べ。","qz":"要把用Claude做的行业调研结果提交给经营会议。提交前应该做的事情，请选出2项。","o":[{"j":"Claudeが作成したことを伏せ、自分の独自調査として提出する","z":"隐瞒由Claude制作，作为自己的独立调查提交"},{"j":"引用が多いので正確だと判断してそのまま提出する","z":"因为引用很多，判断为准确就直接提交"},{"j":"情報の日付を確認し、古いデータや推測が含まれていないかを明示・修正する","z":"确认信息日期，明示或修正其中是否包含旧数据或推测"},{"j":"重要な数値や主張について、引用元の一次情報を確認する","z":"对重要的数值和主张，确认引用源的一次信息"},{"j":"Claudeの回答の口調を経営層向けに強めるだけにする","z":"只把Claude回答的语气改得更适合经营层"}],"a":[2,3],"e":"调研结果用于决策前，应核查关键数据的原始出处和信息时效。只改语气不解决正确性；引用多不等于准确（引用本身也可能错或与内容不符）；隐瞒AI的使用违背Diligence（透明与负责）。","ej":"一次情報と日付を確認してから提出"},{"id":"d4-012","d":4,"t":"4.2","n":1,"q":"広報担当者が、来年度のコンテンツ配信計画を立てたい。Claudeに過去1年分の記事一覧と閲覧データ(CSV)を渡す場合、最も適切な依頼はどれか。","qz":"公关负责人想制定下一年度的内容发布计划。如果把过去1年的文章列表和浏览数据（CSV）交给Claude，最合适的请求是哪一项？","o":[{"j":"「データを分析し、反応の良かったテーマ・時期の傾向を示したうえで、根拠付きで来年度の配信計画案を3つ提案して」","z":"“分析数据，指出反响好的主题和时期的趋势，并基于依据提出3个下一年度发布计划方案”"},{"j":"「バズる記事を書いて」","z":"“写一篇爆款文章”"},{"j":"「過去の記事一覧を参考に、来年度に配信すべき記事タイトルを52本、週1本ずつ配信日付と担当者を付けた一覧表にして」","z":"“参考过去的文章列表，把下一年度应发布的52个文章标题做成每周一篇、附发布日期和负责人的一览表”"},{"j":"「CSVの行数を数えて」","z":"“数一下CSV的行数”"}],"a":[0],"e":"好的请求要明确任务（分析趋势→提出方案）、要求依据，并给出多个可比较的选项便于人决策。“写爆款文章”与计划无关；数行数无意义；直接列52个标题跳过了数据分析，缺乏依据。","ej":"分析→根拠付きで複数案を提案させる"},{"id":"d4-013","d":4,"t":"4.2","n":1,"q":"複数部署にまたがる業務プロセスの改善案をClaudeと作成した。案の妥当性を高めるための次のステップとして最も適切なものはどれか。","qz":"和Claude一起制作了跨多个部门的业务流程改善方案。作为提高方案合理性的下一步，最合适的是哪一项？","o":[{"j":"案をそのまま全社メールで通知する","z":"直接通过全公司邮件通知该方案"},{"j":"別のチャットでClaudeに案を評価させ、問題点の指摘がなければ各部署への確認を省略して確定する","z":"在另一个聊天中让Claude评估方案，如果没有指出问题，就省略各部门的确认直接定稿"},{"j":"案の文章量を2倍にして説得力を出す","z":"把方案的篇幅加倍以增强说服力"},{"j":"各部署の担当者に案をレビューしてもらい、現場の制約や例外を反映して改訂する","z":"请各部门负责人审阅方案，反映现场的约束和例外后修订"}],"a":[3],"e":"AI生成的方案需要现场相关人员审核，补充实际约束和例外，再迭代修订。让Claude自我确认不可靠；未经审核直接全员通知风险大；篇幅不等于质量。","ej":"現場担当者のレビューで制約・例外を反映"},{"id":"d4-014","d":4,"t":"4.2","n":1,"q":"研究開発部門の担当者が、学術論文20本を読み比べて技術動向を整理したい。最も効率的で信頼性の高い進め方はどれか。","qz":"研发部门的负责人想通读比较20篇学术论文，整理技术动向。最高效且可靠的推进方式是哪一项？","o":[{"j":"論文をProjectのナレッジにアップロードし、各論文の要点を出典付きで抽出させてから比較表を作り、重要箇所は原文で確認する","z":"把论文上传到Project知识库，让它带出处提取每篇要点，再做比较表，重要部分对照原文确认"},{"j":"20本を一文で要約させ、それを結論とする","z":"让它把20篇用一句话概括，并以此为结论"},{"j":"論文のタイトルだけを渡し、内容を推測させる","z":"只给论文标题，让它推测内容"},{"j":"論文は読ませず、Claudeの一般知識だけで最新の技術動向をまとめさせ、もっともらしく整った内容であればそのまま部門の結論として採用する","z":"不让它读论文，只用Claude的一般知识汇总最新技术动向，只要内容貌似合理、整齐，就直接作为部门结论采用"}],"a":[0],"e":"把资料放入Project知识库，分步骤（逐篇提取→比较）并要求出处，再回到原文核对关键点，兼顾效率和可靠性。只给标题会导致推测和幻觉；一句话概括丢失信息；只靠一般知识可能过时且不基于指定资料。","ej":"資料を渡し、出典付き抽出→比較→原文確認"},{"id":"d4-035","d":4,"t":"4.2","n":1,"q":"新製品の発売準備として、Claudeにタスク一覧を作らせた。抜け漏れを減らすための追加の依頼として最も有効なものはどれか。","qz":"为新产品发售准备，让Claude生成了任务列表。为了减少遗漏，最有效的追加请求是哪一项？","o":[{"j":"「もっと長くして」","z":"“再写长一点”"},{"j":"「このタスク一覧を、より詳細なサブタスクに分解し、各タスクの所要時間と担当者を見積もって、ガントチャート形式で追加して」","z":"“把这个任务列表分解为更详细的子任务，估算每项任务的所需时间和负责人，并以甘特图形式追加”"},{"j":"「タスクをアルファベット順に並べて」","z":"“把任务按字母顺序排列”"},{"j":"「このタスク一覧を、関係部署(法務・物流・広報など)の観点からレビューし、不足しているタスクと依存関係を指摘して」","z":"“从相关部门（法务、物流、公关等）的视角审查这个任务列表，指出缺少的任务和依赖关系”"}],"a":[3],"e":"让Claude从不同相关方视角复查并找出缺口和依赖关系，是规划中提高完整性的有效手法。单纯加长不保证有用；细分子任务和估时只是在现有列表内深挖，无法发现遗漏的任务；排序不影响完整性。","ej":"関係者の視点でレビューさせ、不足と依存関係を洗い出す"},{"id":"d4-047","d":4,"t":"4.2","n":1,"q":"営業企画担当者が、来期の営業戦略を立てるために業界の最新動向を調べたい。複数の情報源を横断した引用付きの整理が必要である。最も適した進め方はどれか。","qz":"营业企划负责人想调查行业最新动向来制定下期营业战略，需要横跨多个信息源、附引用的整理。最合适的做法是哪一项？","o":[{"j":"Researchを使って引用付きのレポートを作らせ、重要な数字は引用元を開いて確認する","z":"用 Research 生成附引用的报告，重要数字要打开引用来源确认"},{"j":"Web検索を無効にした通常チャットで、Claudeの学習済み知識だけで最新動向をまとめさせる","z":"在关闭 Web 搜索的普通对话中，只用 Claude 的训练知识总结最新动向"},{"j":"Claudeに「確信度が高い情報だけを書いて」と指示すれば、引用の確認は不要とする","z":"指示 Claude“只写确信度高的信息”，就不需要确认引用"},{"j":"調査は時間がかかるので、営業担当者の印象をもとにClaudeに戦略案だけを書かせる","z":"调查费时间，所以只根据营业人员的印象让 Claude 写战略方案"}],"a":[0],"e":"需要多来源、最新、附引用的深入调查，适合用 Research；但引用也要打开确认。只靠训练知识会遇到知识截止问题；自我确信度不能代替验证；只凭印象缺少依据。","ej":"多ソースの最新調査＝Research＋引用元を確認"},{"id":"d4-048","d":4,"t":"4.2","n":1,"q":"PMが、社内イベントの準備計画をClaudeに作らせた。計画をより実行しやすくするための次の依頼として最も有効なものはどれか。","qz":"项目经理让 Claude 做了内部活动的准备计划。为让计划更易执行，下一个请求最有效的是哪一项？","o":[{"j":"完成した計画書を見栄えよく仕上げるために、見出しに絵文字を付け、色や罫線などの装飾を増やすよう依頼する","z":"为了让完成的计划书更好看，请 Claude 在标题加表情符号，增加颜色、边框等装饰"},{"j":"同じプロンプトをもう一度送り、出力が変わるかどうかだけを確かめる","z":"把同样的提示词再发一次，只看输出会不会变"},{"j":"計画の内容は確認せず、そのまま全社に正式決定として通知させる","z":"不确认计划内容，直接作为正式决定通知全公司"},{"j":"各タスクの担当・期限・前後関係と、遅れたときに影響が大きいリスクを洗い出させる","z":"让 Claude 梳理每项任务的负责人、期限、前后关系，以及延误时影响大的风险"}],"a":[3],"e":"可执行的计划需要负责人、期限、依赖关系和风险。装饰不提升可执行性；不确认就正式通知跳过了人的决策；重复相同提示无法改进内容。","ej":"計画は担当・期限・依存関係・リスクまで"},{"id":"d4-049","d":4,"t":"4.2","n":2,"q":"物流部門が、出荷業務の手順書をClaudeに渡し、プロセス改善のヒントを得たい。効果的な依頼方法を2つ選べ。","qz":"物流部门想把出货作业手册交给 Claude，获得流程改善的启发。选出 2 个有效的请求方法。","o":[{"j":"手順書は渡さず、一般的な物流改善の事例だけを聞いて自社に当てはめる","z":"不提供手册，只问一般物流改善案例，直接套用到本公司"},{"j":"改善案ごとに期待効果と導入時のリスク・前提条件を表で整理させる","z":"让 Claude 用表格整理每个改善方案的预期效果、导入风险和前提条件"},{"j":"現場作業員の名前と個人別のミス件数を入れ、個人の責任を明らかにさせる","z":"输入现场作业员姓名和个人失误次数，让 Claude 追究个人责任"},{"j":"手順書と各工程の所要時間データを渡し、時間がかかっている工程と重複作業を指摘させる","z":"提供手册和各工序耗时数据，让 Claude 指出耗时的工序和重复作业"},{"j":"「とにかく効率化して」とだけ伝え、出た案を翌日から全倉庫に適用する","z":"只说“总之提高效率”，第二天就把方案应用到所有仓库"}],"a":[1,3],"e":"提供实际流程和数据、并让 Claude 整理效果与风险，能得到具体可评估的改善方案。模糊指示后立刻全面推广缺少验证；以个人追责为目的使用个人数据不合适；只靠一般案例脱离实际。","ej":"実データ＋効果とリスクの整理 → 人が判断"},{"id":"d4-050","d":4,"t":"4.2","n":1,"q":"経営企画部が、3つの新規事業案のどれを優先するか検討している。Claudeの使い方として最も適切なものはどれか。","qz":"经营企划部在讨论 3 个新业务方案中优先哪个。Claude 的用法中最合适的是哪一项？","o":[{"j":"3案のうち担当者が気に入っている案だけを渡し、その案を推す理由を書かせる","z":"只把负责人喜欢的方案交给 Claude，让它写支持该方案的理由"},{"j":"評価基準は示さず「どれが儲かる?」とだけ聞き、最も自信のある回答を採用する","z":"不给评价标准，只问“哪个赚钱？”，采用最有把握的回答"},{"j":"評価基準（市場規模・投資額・自社の強みとの適合など）を示し、案ごとの比較表と論点を整理させて、最終判断は経営層が行う","z":"给出评价标准（市场规模、投资额、与自身优势的匹配等），让 Claude 整理各方案的比较表和论点，最终判断由高层做"},{"j":"経営会議の時間を短縮するため、3案のうちどれがよいかをClaudeに一言で決めさせ、その結論をそのまま経営会議の決定事項として記録する","z":"为了缩短经营会议时间，让 Claude 用一句话决定 3 个方案中哪个好，并把结论直接记录为会议决定事项"}],"a":[2],"e":"Claude 适合按明确标准整理比较和论点，决策由人负责。让 Claude 直接决定属于不当委任；没有标准的提问结果难以评价；只给一个方案会产生确认偏误。","ej":"評価基準を示して比較整理、決定は人"},{"id":"d4-051","d":4,"t":"4.2","n":1,"q":"ある研究所の担当者が、Claudeで作った調査レポートの中に、見覚えのない統計データと出典名を見つけた。最も適切な行動はどれか。","qz":"某研究所的负责人在用 Claude 做的调查报告中，发现了从没见过的统计数据和出处名称。最合适的行动是哪一项？","o":[{"j":"数値を四捨五入して目立たなくし、出典名だけ削除して残す","z":"把数字四舍五入让它不显眼，只删除出处名称后保留"},{"j":"Claudeに「この出典は本当ですか」と聞き、「はい」と答えたら採用する","z":"问 Claude“这个出处是真的吗”，回答“是”就采用"},{"j":"Claudeが出典名や発行年まで具体的に書いているので、実在する資料にもとづいた信頼できる情報だと判断し、そのまま採用する","z":"Claude 连出处名称和发行年份都写得很具体，所以判断是基于真实资料的可信信息，直接采用"},{"j":"出典が実在し数値が一致するかを一次資料で確認し、確認できなければ削除または要確認と明記する","z":"在一手资料中确认出处是否存在、数字是否一致，无法确认就删除或注明“需确认”"}],"a":[3],"e":"具体的统计数据和出处是幻觉高发点，必须用一手资料确认。写了出处名不代表真实；让 Claude 自我确认不是有效验证；模糊处理数字反而隐藏了问题。","ej":"見覚えのない出典・数値は一次資料で確認"},{"id":"d4-052","d":4,"t":"4.2","n":1,"q":"ホテルの運営チームが、宿泊客アンケートの自由記述（個人情報は削除済み）を毎月分析している。Claudeを使った効率化として最も適切なものはどれか。","qz":"酒店运营团队每月分析住客问卷的自由描述（已删除个人信息）。用 Claude 提高效率的做法中，最合适的是哪一项？","o":[{"j":"アンケート分析は人の感覚が大事なので、Claudeは使わず全件を手作業で読む","z":"问卷分析靠人的感觉，所以不用 Claude，全部手工阅读"},{"j":"分析の視点が偏らないよう、毎月その場で思いついた指示を出し、分類カテゴリも毎回自由に変えてClaudeに分析させる","z":"为了不让分析角度固定，每月临时想到什么指示就发什么，分类类别也每次自由变化，让 Claude 分析"},{"j":"分類カテゴリと出力形式を決めたプロンプトをProjectに保存し、毎月同じ手順で分類・集計させて担当者が傾向を確認する","z":"把定好分类类别和输出格式的提示词存进 Project，每月按同样步骤分类、汇总，由负责人确认趋势"},{"j":"集計結果は確認せず、Claudeが出した数字をそのまま本部への月次報告に使う","z":"不确认汇总结果，把 Claude 给的数字直接用于向总部的月报"}],"a":[2],"e":"重复性的分析要把步骤和格式固定下来（模板化），保证每月可比，人来确认趋势。每次变化的指示让结果无法比较；不确认数字直接上报有风险；完全不用 AI 放弃了效率提升。","ej":"定型分析は手順を固定（Project/テンプレート）＋人が確認"},{"id":"d4-053","d":4,"t":"4.2","n":1,"q":"人事部が、新入社員研修の年間計画を見直したい。Claudeに相談する際、最も良い結果につながる依頼はどれか。","qz":"人事部想重新审视新员工培训的年度计划。向 Claude 咨询时，最能得到好结果的请求是哪一项？","o":[{"j":"昨年の研修計画と受講者アンケートの要約を渡し、課題を整理したうえで改善案を3つ、優先度とともに提案させる","z":"提供去年的培训计划和学员问卷摘要，让 Claude 整理问题后提出 3 个改善方案并标明优先级"},{"j":"受講者一人ひとりの評価点と氏名を入れ、成績下位者の名前を一覧にさせる","z":"输入每位学员的评分和姓名，让 Claude 列出成绩靠后的人名单"},{"j":"Claudeは研修設計の一般的な知識を持っているので、「いい研修計画を作って」とだけ伝え、出てきた一般的な計画をそのまま採用する","z":"Claude 有培训设计的一般知识，所以只说“做一个好的培训计划”，直接采用得到的一般性计划"},{"j":"研修内容には触れず、計画書のフォントと色だけを変えるよう依頼する","z":"不涉及培训内容，只请 Claude 改计划书的字体和颜色"}],"a":[0],"e":"提供背景资料和数据，并要求整理问题→提方案→排优先级，能得到具体、可讨论的结果。模糊请求得到的是一般论；列出个人名单不必要地使用了个人信息；只改格式不解决问题。","ej":"背景資料＋課題整理→改善案→優先度"},{"id":"d4-054","d":4,"t":"4.2","n":2,"q":"Claudeを使って業務プロセスの改善案を作るとき、改善案の質を高める工夫を2つ選べ。","qz":"用 Claude 制作业务流程改善方案时，选出 2 个提高方案质量的做法。","o":[{"j":"現在の手順を工程ごとに書き出して渡し、ボトルネックと自動化できる工程を特定させる","z":"把现行流程按工序写出来交给 Claude，让它找出瓶颈和可自动化的工序"},{"j":"現状の課題は伝えず、「理想の業務フロー」だけを想像で描かせる","z":"不告诉现状的问题，只让 Claude 凭想象画出“理想业务流程”"},{"j":"Claudeの改善案を現場担当者にレビューしてもらい、実現可能性を確認する","z":"请现场负责人审阅 Claude 的改善方案，确认可行性"},{"j":"改善案は多いほどよいので、100案を出させて全部を同時に実施する","z":"方案越多越好，让 Claude 出 100 个方案并全部同时实施"},{"j":"改善案の根拠を聞かれたら困るので、理由の説明は省略させる","z":"怕被问依据，所以让 Claude 省略理由说明"}],"a":[0,2],"e":"把现状流程具体化交给 Claude、再由一线确认可行性，是提高方案质量的关键。100 个方案同时实施无法管理；不提供现状只靠想象脱离实际；省略理由会让方案无法评估。","ej":"現状の見える化＋現場レビュー"},{"id":"d4-055","d":4,"t":"4.2","n":1,"q":"研究開発部の担当者が、Claudeで新技術の調査を進めている。調査範囲が広すぎて出力がまとまらない。最も適切な対処はどれか。","qz":"研发部的负责人在用 Claude 调查新技术，调查范围太广，输出很散乱。最合适的处理是哪一项？","o":[{"j":"出力がまとまらないのはモデルの限界なので、調査自体をやめる","z":"输出散乱是模型的局限，所以停止调查"},{"j":"調査の目的と問いを絞り、「用途」「主要な方式」「課題」など観点ごとに分けて順に調べさせる","z":"缩小调查目的和问题，按“用途”“主要方式”“课题”等角度分开，依次让 Claude 调查"},{"j":"同じ広い依頼のまま「もっと詳しく」と何度も繰り返す","z":"保持同样宽泛的请求，反复说“更详细一点”"},{"j":"調査結果の正確さより量を優先し、できるだけ長いレポートを書かせる","z":"比起调查结果的准确性更看重数量，让 Claude 写尽可能长的报告"}],"a":[1],"e":"范围太广时要缩小问题并分解成多个角度依次进行（任务分解）。放弃调查过于消极；重复模糊的要求不会改善结构；追求篇幅不等于质量。","ej":"問いを絞り、観点ごとに分解して調べる"},{"id":"d4-056","d":4,"t":"4.2","n":1,"q":"総務部で、全社の会議室予約ルールを見直す計画を立てている。Claudeに依頼する内容として最も適切なものはどれか。","qz":"总务部在制定全公司会议室预约规则的修订计划。请 Claude 做的内容中最合适的是哪一项？","o":[{"j":"検討の時間を省くために、新しい会議室予約ルールをClaudeに決めさせ、関係部署には確認せずに翌日から全社で施行する","z":"为了省去讨论时间，让 Claude 决定新的会议室预约规则，不向相关部门确认，第二天在全公司施行"},{"j":"社員全員の会議室利用履歴を氏名付きで入れ、使いすぎている人を特定させる","z":"输入带姓名的全员会议室使用记录，让 Claude 找出用得太多的人"},{"j":"現行ルールと利用者からの不満の要約を渡し、課題の整理・改善案・関係部署への確認事項を一覧にさせる","z":"提供现行规则和用户不满的摘要，让 Claude 列出问题整理、改善方案和需要向相关部门确认的事项"},{"j":"ルールは毎年変わるので、計画は立てずに問題が起きてから考えるよう提案させる","z":"规则每年都会变，所以让 Claude 建议不做计划，等出了问题再说"}],"a":[2],"e":"Claude 适合整理问题、提方案、列出需要确认的事项，规则的决定和协调由人来做。不经确认直接施行跳过了相关方；以个人为对象的分析不必要；不做计划不是改进。","ej":"課題整理・改善案・確認事項まで出させ、決定は人"},{"id":"d4-057","d":4,"t":"4.2","n":1,"q":"商品企画担当者が、新商品のアイデアをClaudeとブレインストーミングしている。アイデアの幅を広げる依頼として最も適切なものはどれか。","qz":"商品企划负责人在和 Claude 头脑风暴新商品创意。为了拓宽创意范围，最合适的请求是哪一项？","o":[{"j":"対象顧客と制約を伝え、まず評価せずに20案を出させ、その後に基準を示して絞り込む","z":"说明目标客户和约束，先不评价让它出 20 个方案，然后给出标准再筛选"},{"j":"社内で過去に却下された案だけを渡し、同じ方向性の案を似た表現で増やしてもらうよう依頼する","z":"只提供公司过去被否决的方案，请它用相似表达增加同一方向的方案"},{"j":"アイデアの幅は関係ないので、出力の文字数をできるだけ長くするよう指定し、詳しさで評価する","z":"创意范围无所谓，指定输出尽量长，用详细程度来评价"},{"j":"最初から「売れる案を1つだけ」と依頼し、その案が良いかどうかをClaude自身の評価で判断して、すぐに開発部門へ回す","z":"一开始就要求“只要 1 个能卖的方案”，用 Claude 自己的评价判断好坏，马上转给开发部门"}],"a":[0],"e":"头脑风暴要先追求数量和多样性，再按标准筛选（发散→收敛）。一开始只要 1 个方案并让 Claude 自评，会限制范围且缺乏人的判断；只给被否决的方案会让思路更窄；篇幅长不等于创意多。","ej":"ブレストは発散（量）→基準で収束"},{"id":"d4-015","d":4,"t":"4.3","n":1,"q":"社内向けFAQページのたたき台をClaudeで作成している。初回の出力は網羅性が足りなかった。最も適切な次の行動はどれか。","qz":"正在用Claude制作内部FAQ页面的初稿。第一次的输出覆盖不够全面。最合适的下一步是哪一项？","o":[{"j":"同じ依頼文を何度も送り直して偶然良い結果を待つ","z":"反复发送同样的请求，等待偶然出现好结果"},{"j":"足りなかった観点(対象者、よくある問い合わせ例など)を具体的に伝え、改訂版を作らせる","z":"具体告知缺少的观点（对象人群、常见咨询示例等），让它生成修订版"},{"j":"より高性能なモデルに切り替えれば網羅性は自動的に改善されると考え、依頼内容は変えずに再実行する","z":"认为切换到更高性能的模型就能自动改善覆盖面，不改请求内容直接重新执行"},{"j":"諦めて最初から人手で全部作る","z":"放弃，从头全部由人手制作"}],"a":[1],"e":"方案设计是迭代过程：给出具体反馈（缺少的视角、示例）进行修订最有效。放弃浪费已有成果；重复同一指令缺乏改进；不改指示只换模型通常无法解决信息不足的问题。","ej":"具体的なフィードバックで反復改善"},{"id":"d4-016","d":4,"t":"4.3","n":1,"q":"新サービスの申込フォームの画面案を、関係者に見せて意見をもらいたい。Claudeを使う方法として最も適切なものはどれか。","qz":"想把新服务申请表单的界面方案展示给相关人员征求意见。使用Claude的方法中最合适的是哪一项？","o":[{"j":"プロトタイプは不要なので、完成後に意見を聞く","z":"不需要原型，完成后再听意见"},{"j":"画面の説明を長文で書かせ、関係者に読んでもらう","z":"让它写很长的界面说明文字，请相关人员阅读"},{"j":"Claudeに本番用のフォーム画面のコードを書かせ、関係者にはそのまま公開環境で操作して意見を出してもらう","z":"让Claude写正式用的表单界面代码，让相关人员直接在公开环境中操作并提出意见"},{"j":"Artifactとして簡単な画面プロトタイプを作成し、フィードバックを受けて反復改善する","z":"作为Artifact制作简单的界面原型，接受反馈后迭代改进"}],"a":[3],"e":"Artifact适合制作可视化的原型并反复修改，便于收集反馈。长篇文字说明不直观；直接写生产代码上线超出Associate范围且未经审核；完成后才收集意见返工成本高。","ej":"Artifactでプロトタイプ→フィードバックで反復"},{"id":"d4-017","d":4,"t":"4.3","n":2,"q":"Claudeを使った業務ソリューション(例:週次レポート自動下書き)を試行導入する。設計段階で決めておくべきこととして適切なものを2つ選べ。","qz":"要试行导入使用Claude的业务方案（例：自动起草周报）。在设计阶段应决定的事情，请选出2项。","o":[{"j":"成功を判断する指標(作成時間、修正回数など)","z":"判断成功的指标（制作时间、修改次数等）"},{"j":"利用者に指示文を一切変更させないルール","z":"不允许用户修改任何指示文的规则"},{"j":"どのモデルが一番人気か","z":"哪个模型最受欢迎"},{"j":"失敗したときにClaudeの責任にする手順","z":"失败时把责任推给Claude的流程"},{"j":"出力を誰がどの観点でレビューし、承認するか","z":"由谁、从什么观点审核并批准输出"}],"a":[0,4],"e":"设计阶段应确定审核/批准的责任人和观点，以及衡量成功的指标，以便迭代。模型人气与需求无关；AI不能承担责任，责任在使用者；完全禁止修改指示会阻碍持续改进。","ej":"レビュー体制と成功指標を設計時に決める"},{"id":"d4-018","d":4,"t":"4.3","n":1,"q":"Claudeで作成した顧客向け提案書のテンプレートを、チームで繰り返し使いたい。最も適切な方法はどれか。","qz":"想在团队中反复使用用Claude制作的面向客户的提案书模板。最合适的方法是哪一项？","o":[{"j":"チームのProjectを作成し、テンプレートと作成ルールをナレッジ・指示として設定し共有する","z":"创建团队Project，把模板和制作规则设为知识和指示并共享"},{"j":"シークレットチャットで作成して記録を残さない","z":"在无痕聊天中制作，不留记录"},{"j":"テンプレートを印刷して配布する","z":"把模板打印出来分发"},{"j":"各メンバーが自分のチャットでテンプレートを都度貼り付け、作成ルールも毎回口頭で補足して依頼する","z":"各成员在自己的聊天中每次粘贴模板，每次口头补充制作规则后请求"}],"a":[0],"e":"需要团队反复使用的内容，适合放进共享Project（指示+知识），保证一致性和可维护性。每次从头请求效率低且不一致；打印无法与Claude联动；无痕聊天不保留，无法复用。","ej":"繰り返し使う型はチームProjectで共有"},{"id":"d4-019","d":4,"t":"4.3","n":1,"q":"Claudeで作った業務チェックリストを試行したところ、現場から「項目が多すぎて使いにくい」という声が出た。最も適切な対応はどれか。","qz":"试用了用Claude制作的业务检查清单，现场反映“项目太多不好用”。最合适的应对是哪一项？","o":[{"j":"現場の意見と利用状況をClaudeに伝え、重要度で優先順位付けした簡潔版を作らせ、再度試行する","z":"把现场意见和使用情况告诉Claude，让它按重要度排序做出精简版，再次试行"},{"j":"網羅性を確保するため項目は維持し、使いにくさは慣れの問題として、使い方の研修を追加で実施する","z":"为确保覆盖面保持项目不变，把不好用看作习惯问题，追加实施使用培训"},{"j":"チェックリストの導入を中止する","z":"中止检查清单的导入"},{"j":"項目をさらに増やして網羅性を高める","z":"进一步增加项目以提高覆盖面"}],"a":[0],"e":"把用户反馈纳入下一轮迭代（排序、精简），再试行，是解决方案设计的基本循环。把“不好用”归为习惯问题而无视反馈不可取；直接中止过早；继续增加项目与反馈相反。","ej":"利用者の声を反映して反復(試行→改善)"},{"id":"d4-020","d":4,"t":"4.3","n":1,"q":"Claudeを使って社内イベントの運営マニュアルを作る。ソリューション開発を効率よく進めるための最も適切な順序はどれか。","qz":"用Claude制作内部活动的运营手册。为了高效推进方案开发，最合适的顺序是哪一项？","o":[{"j":"全文を一度に作成→配布→問題があれば作り直し","z":"一次性写完全文→分发→有问题再重做"},{"j":"各章の担当者がそれぞれ別のチャットで並行して作成し、時間短縮のため結合後のチェックは省略する","z":"各章负责人分别在不同聊天中并行制作，为节省时间省略合并后的检查"},{"j":"目次案の作成→担当者確認→各章を順に作成・レビュー→全体の整合性チェック","z":"制作目录方案→负责人确认→逐章制作与审核→检查整体一致性"},{"j":"最終版の体裁を先に決め、内容は最後に考える","z":"先决定最终版式，内容最后再考虑"}],"a":[2],"e":"先确定结构（目录）并确认，再逐章生成和审核，最后检查整体一致性，是任务分解+迭代的做法。一次写完返工成本高；分散生成直接拼接容易前后矛盾；先排版后内容本末倒置。","ej":"構成→確認→章ごと作成→全体整合性"},{"id":"d4-021","d":4,"t":"4.3","n":1,"q":"Claudeと設計した新しい業務フローについて、技術的な実装(社内システムとのAPI連携や自律エージェント化)が必要だと分かった。Associateとして最も適切な行動はどれか。","qz":"和Claude设计的新业务流程中，发现需要技术实现（与内部系统的API对接、自主代理化）。作为Associate最合适的行动是哪一项？","o":[{"j":"ベンダーに要件を伝えず、まず見積だけ取る","z":"不告诉供应商需求，先只要报价"},{"j":"Claudeに連携用のコードと自律エージェントの設定を書かせ、動作を確認しながら情報システム部門を通さずに自分で本番環境へ導入する","z":"让Claude写对接代码和自主代理设置，一边确认运行一边不经过信息系统部门、自己导入生产环境"},{"j":"技術的な部分は不要として計画から削除する","z":"认为技术部分不需要，从计划中删除"},{"j":"要件・期待効果・試行結果をまとめて、Claude Developer/Architectの担当者に引き継ぐ","z":"汇总需求、预期效果和试行结果，交接给Claude Developer/Architect负责人"}],"a":[3],"e":"认证指南明确：API集成和代理系统设计属于Developer/Architect的范围，Associate的职责是识别局限并整理好需求和成果后升级。自己把代码导入生产风险大；删除必要部分会使方案失效；不给需求无法得到准确报价。","ej":"技術実装は要件を整理してDeveloper/Architectへ"},{"id":"d4-058","d":4,"t":"4.3","n":1,"q":"広報担当者が、プレスリリースのテンプレートをClaudeと一緒に作っている。初回の案は構成はよいが、自社の表記ルールに合っていない。最も適切な次の行動はどれか。","qz":"宣传负责人在和 Claude 一起制作新闻稿模板。第一版结构不错，但不符合公司的书写规则。最合适的下一步是哪一项？","o":[{"j":"構成がよいので表記の違いは気にせず、そのまま全社のテンプレートとして配布する","z":"结构不错，所以不在意书写差异，直接作为全公司模板发布"},{"j":"社内の表記ルール（用字用語・数字表記など）を渡し、それに沿って修正させる","z":"提供公司内部书写规则（用字用语、数字写法等），让 Claude 按规则修改"},{"j":"「もっとちゃんとして」とだけ伝え、Claudeが自分でルールを推測するのを待つ","z":"只说“再认真一点”，等 Claude 自己去猜规则"},{"j":"最初からやり直すため、別のAIツールで一から作り直す","z":"为了从头开始，用别的 AI 工具从零重新做"}],"a":[1],"e":"迭代时要提供缺少的信息（书写规则），针对问题修改。忽略规则直接发布会造成不统一；换工具解决不了“缺少规则”的根本原因；模糊反馈让 Claude 只能猜测。","ej":"足りない情報（社内ルール）を渡して反復改善"},{"id":"d4-059","d":4,"t":"4.3","n":1,"q":"営業チームが、見積もり依頼の受付から回答までの新しいフローを設計中である。関係者に流れを分かりやすく示すため、Claudeを使う方法として最も適切なものはどれか。","qz":"营业团队正在设计从接收报价请求到回复的新流程。为让相关人员看懂流程，Claude 的用法中最合适的是哪一项？","o":[{"j":"Claudeに見積もりシステムとの自動連携まで実装させ、関係者には完成品だけを見せる","z":"让 Claude 实现与报价系统的自动集成，只给相关人员看成品"},{"j":"フローは口頭で説明すれば十分なので、図や文書は作らずに会議で伝える","z":"流程口头说明就够了，不做图和文档，在会上传达"},{"j":"フロー図はClaudeが一度で完璧に作るので、関係者の意見は聞かずに確定する","z":"Claude 一次就能做出完美的流程图，所以不听相关人员意见直接定稿"},{"j":"工程と担当者を説明し、フロー図をアーティファクトとして作らせ、意見を反映しながら修正する","z":"说明工序和负责人，让 Claude 以 Artifact 形式画流程图，并根据意见修改"}],"a":[3],"e":"Artifact 适合制作可反复修改、可共享的流程图原型，边听意见边改。只口头说明难以共享；系统集成属于 Developer/Architect 的范围；不听意见直接定稿跳过了迭代。","ej":"アーティファクトで試作→意見を反映して反復"},{"id":"d4-060","d":4,"t":"4.3","n":2,"q":"Claudeを使った「週次営業レポートの下書き作成」を試行導入する。試行の設計として適切なものを2つ選べ。","qz":"试行用 Claude“起草每周营业报告”。选出 2 项合适的试行设计。","o":[{"j":"試行の目的は伝えず、メンバーには使うかどうかを各自の判断に任せる","z":"不说明试行目的，让成员各自决定用不用"},{"j":"下書きを誰がどの観点で確認するか、チェックの担当とポイントを決めておく","z":"事先定好由谁、从什么角度确认初稿，包括检查负责人和要点"},{"j":"下書きはClaudeが作るので、試行中は人による確認を省略してよいとする","z":"初稿是 Claude 写的，所以试行期间可以省略人工确认"},{"j":"試行で問題が見つからないよう、評価はせずに全社展開を前提に進める","z":"为了不在试行中发现问题，不做评价，以全公司推广为前提推进"},{"j":"試行期間・対象チーム・評価指標（作成時間、修正量など）を事前に決めておく","z":"事先定好试行期间、对象团队和评价指标（制作时间、修改量等）"}],"a":[1,4],"e":"试行要有明确的范围、期间和指标，并定好人工检查点。不评价就推广失去了试行意义；省略人工确认有风险；目的不明确会导致参与度低、数据不可比。","ej":"試行＝範囲・期間・指標＋チェック担当を決める"},{"id":"d4-061","d":4,"t":"4.3","n":1,"q":"教育担当者が、Claudeで作った研修用クイズを試しに配布したところ、「問題が簡単すぎる」というフィードバックが多かった。最も適切な対応はどれか。","qz":"培训负责人试着发放了用 Claude 做的培训测验，很多人反馈“题目太简单”。最合适的应对是哪一项？","o":[{"j":"フィードバックは一部の受講者の個人的な感想にすぎないため、内容の修正はせず、次回以降も同じクイズをそのまま使い続ける","z":"反馈只是部分学员的个人感想，所以不修改内容，之后继续原样使用同一套测验"},{"j":"クイズ形式は研修に向かないと判断し、研修からクイズを全面的に廃止する","z":"判断测验形式不适合培训，全面取消培训中的测验"},{"j":"対象者のレベルと出題の狙いを具体的に伝え、応用問題や判断を問う問題を増やすよう修正させる","z":"具体说明对象的水平和出题目的，让 Claude 修改，增加应用题和考判断的题"},{"j":"クイズの問題数を3倍にすれば難しくなると考え、同じ難易度のまま量を増やす","z":"认为题数增加 3 倍就会变难，保持同样难度只增加数量"}],"a":[2],"e":"根据反馈，补充对象水平和出题目的等信息，有针对性地改进。忽视反馈无法改进；只加量不解决难度问题；全面取消过度反应。","ej":"フィードバック→不足していた条件を補って修正"},{"id":"d4-062","d":4,"t":"4.3","n":1,"q":"経理部の担当者が、Claudeで作った経費精算チェックの手順書を部内で使い始めた。今後の改善を進めやすくするために最も有効なことはどれか。","qz":"财务部负责人开始在部门内使用 Claude 做的报销检查手册。为方便今后改进，最有效的是哪一项？","o":[{"j":"一度完成した手順書は変更しないと決め、指摘があっても次年度まで保留する","z":"决定手册一旦完成就不修改，即使有意见也搁置到下一年度"},{"j":"各メンバーが自由に手順書を書き換えてよいことにし、版の管理はしない","z":"允许每个成员自由改写手册，不做版本管理"},{"j":"手順書の改善はClaudeに任せ、人は内容を確認しないで毎回最新版を配布する","z":"把手册改进交给 Claude，人不确认内容，每次直接发布最新版"},{"j":"手順書の版数と変更履歴を管理し、現場からの指摘を定期的に集めて反映する","z":"管理手册的版本号和变更记录，定期收集一线意见并反映"}],"a":[3],"e":"方案需要持续迭代：版本管理 + 定期收集反馈。冻结不改无法改进；随意修改会造成混乱；没有人工确认就发布有错误风险。","ej":"版管理＋フィードバックを定期的に反映"},{"id":"d4-063","d":4,"t":"4.3","n":1,"q":"小規模なNPOの事務局が、寄付者向けのお礼状作成を効率化したい。開発者はいない。Associateとして提案できるソリューションとして最も適切なものはどれか。","qz":"一个小型 NPO 的事务局想提高给捐赠者写感谢信的效率，没有开发人员。作为 Associate 能提议的方案中，最合适的是哪一项？","o":[{"j":"お礼状の方針と文例をProject指示とナレッジに入れ、寄付の内容を入力するとたたき台が作られるようにし、職員が確認して送る","z":"把感谢信的方针和范例放进 Project 指示和知识中，输入捐赠内容就能生成初稿，由职员确认后发送"},{"j":"お礼状は定型文で十分なので、全員に同じ文面をClaudeで1回作って使い回す","z":"感谢信用固定格式就够，用 Claude 做一次相同文案给所有人反复使用"},{"j":"寄付者全員の個人情報と寄付履歴を個人アカウントのClaudeにまとめて保存しておく","z":"把所有捐赠者的个人信息和捐赠记录集中保存在个人账号的 Claude 中"},{"j":"寄付管理システムとClaudeをAPIで連携し、お礼状を自動送信するシステムを自分で開発する","z":"自己开发系统，把捐赠管理系统和 Claude 通过 API 集成，自动发送感谢信"}],"a":[0],"e":"组合现有功能（Project 指示 + 知识 + 人工确认）是 Associate 范围内的有效方案。API 集成开发属于 Developer 的范围；把个人信息集中存放在个人账号有风险；千篇一律的文案达不到感谢信的目的。","ej":"既存機能（Project＋指示＋ナレッジ）の組合せで解決"},{"id":"d4-064","d":4,"t":"4.3","n":1,"q":"人事部で、Claudeを使った「求人票作成支援」の仕組みを作った。リリース前に確認すべきこととして最も重要なものはどれか。","qz":"人事部做了一个用 Claude“辅助制作招聘启事”的机制。发布前最重要的确认事项是哪一项？","o":[{"j":"求人票の書式が整っているかだけを見て、記載内容の確認は採用担当者に任せない","z":"只看招聘启事格式是否整齐，不让招聘负责人确认记载内容"},{"j":"いくつかの職種で試し、内容の正確さ・差別的な表現がないか・法令や社内規定に合っているかを人が確認する","z":"用几个职位试做，由人确认内容是否准确、有无歧视性表达、是否符合法规和公司规定"},{"j":"処理が速いかどうかだけを確認しておき、記載内容の妥当性については、公開後に集まる応募者の反応を見てから判断する","z":"只确认处理速度快不快，记载内容是否妥当，等发布后看应聘者的反应再判断"},{"j":"Claudeが作った文章なので、差別的な表現は含まれないと考えて確認を省く","z":"认为是 Claude 写的文字，所以不会有歧视性表达，省略确认"}],"a":[1],"e":"招聘启事是对外发布、受法规约束的内容，发布前要用测试用例确认准确性、偏见和合规性。只看速度不够；AI 输出也可能包含偏见；只看格式忽略了内容风险。","ej":"公開前に試行し、正確性・バイアス・法令適合を人が確認"},{"id":"d4-065","d":4,"t":"4.3","n":2,"q":"Claudeと一緒に新しい業務ソリューションを開発する際、効率よく進めるためのやり方として適切なものを2つ選べ。","qz":"和 Claude 一起开发新的业务方案时，选出 2 个能高效推进的做法。","o":[{"j":"最初から完璧な最終版を目指し、関係者には完成するまで見せない","z":"从一开始就追求完美的最终版，完成前不给相关人员看"},{"j":"要件が固まるまでClaudeは使わず、すべて決まってから清書だけに使う","z":"需求定下来之前不用 Claude，全部决定后只用它来誊写"},{"j":"目的・利用者・制約を最初に整理して伝え、Claudeに複数の設計案を比較させる","z":"先整理并说明目的、用户和约束，让 Claude 比较多个设计方案"},{"j":"まず小さな試作を作って関係者に見せ、意見をもとに改善を繰り返す","z":"先做一个小原型给相关人员看，根据意见反复改进"},{"j":"試作の評価は不要なので、できた順にそのまま本番運用に入れていく","z":"不需要评价原型，做好一个就直接投入正式运行一个"}],"a":[2,3],"e":"原型→反馈→迭代，以及先明确目的/用户/约束再比较方案，是高效的方案开发方式。追求一次完美会错过早期反馈；只用来誊写浪费了 Claude 在设计阶段的价值；不评价直接上线有风险。","ej":"試作→フィードバック→反復、設計案の比較"},{"id":"d4-066","d":4,"t":"4.3","n":1,"q":"Claudeで作った業務フローを社内で試したところ、基幹システムとの自動データ連携や、複数ツールをまたぐ自律的な処理が必要だと分かった。最も適切な対応はどれか。","qz":"在公司内试行用 Claude 设计的业务流程后，发现需要与核心系统自动数据集成、以及跨多个工具的自主处理。最合适的应对是哪一项？","o":[{"j":"自動連携の代わりに、毎日数千件のデータを手作業でコピーする運用で乗り切る","z":"不做自动集成，用每天手工复制几千条数据的方式应付"},{"j":"要件と試行結果を整理し、技術的な設計・実装はArchitectやDeveloperに相談・引き継ぐ","z":"整理需求和试行结果，把技术设计和实现咨询并移交给 Architect 或 Developer"},{"j":"技術的な課題が出たので、このソリューションの検討は打ち切る","z":"出现了技术问题，所以终止该方案的讨论"},{"j":"引き継ぐと時間がかかるので、自分でAPIの仕組みを調べ、本番の基幹システムに直接つないで動作を試してみる","z":"交接很费时间，所以自己研究 API 机制，直接连接正式的核心系统测试运行"}],"a":[1],"e":"Associate 的职责之一是识别局限，把需要集成和 Agent 设计的工作升级给专家，同时交接整理好的需求和试行结果。自己直接连接正式系统有风险；直接放弃浪费了已有成果；大量手工复制不现实且容易出错。","ej":"技術的な実装はArchitect/Developerへエスカレーション"},{"id":"d4-067","d":4,"t":"4.3","n":1,"q":"顧客サポート部門が、Claudeで作ったFAQ回答案を改善している。どの回答が良いか、メンバー間で意見が分かれている。最も適切な進め方はどれか。","qz":"客户支持部门在改进用 Claude 做的 FAQ 回答方案，成员之间对哪个回答更好意见分歧。最合适的推进方式是哪一项？","o":[{"j":"Claudeに「どれが一番いいですか」と聞き、選ばれた案を理由も確認せず採用する","z":"问 Claude“哪个最好”，不确认理由就采用它选的方案"},{"j":"意見が分かれるのはClaudeの出力が悪いからなので、FAQの作成自体を中止する","z":"意见分歧是因为 Claude 的输出不好，所以停止制作 FAQ"},{"j":"一番声の大きいメンバーの好みで決め、以後は議論しない","z":"按最强势成员的喜好决定，之后不再讨论"},{"j":"正確さ・分かりやすさ・長さなどの評価基準を決め、複数案を同じ基準で比べて選ぶ","z":"定好准确性、易懂程度、长度等评价标准，用同一标准比较多个方案后选择"}],"a":[3],"e":"有明确的评价标准，才能客观比较多个方案。按个人喜好决定缺乏依据；不看理由就采用 AI 的选择是把判断全部交出去；中止过于消极。","ej":"評価基準を決めて複数案を比較"},{"id":"d4-068","d":4,"t":"4.3","n":1,"q":"不動産会社の担当者が、物件紹介文の作成にClaudeを使う仕組みを作っている。設計段階で決めておくべきこととして最も重要なものはどれか。","qz":"房地产公司的负责人在建立用 Claude 写房源介绍的机制。设计阶段最需要先决定的是哪一项？","o":[{"j":"紹介文をできるだけ魅力的にするため、実際にない設備も書いてよいとするルール","z":"为了让介绍更吸引人，规定可以写实际没有的设施"},{"j":"Claudeが作った紹介文は確認せず、ポータルサイトに自動で掲載する設定","z":"不确认 Claude 写的介绍，自动发布到门户网站的设置"},{"j":"広告表示のルール（誇大表現の禁止など）と、入力する物件情報の項目、公開前の確認者","z":"广告表示规则（禁止夸大表达等）、输入的房源信息项目，以及发布前的确认人"},{"j":"物件情報は毎回担当者の記憶で入力し、項目は決めずに自由に書く方法","z":"房源信息每次凭负责人的记忆输入，不定项目自由书写的方式"}],"a":[2],"e":"对外广告要遵守表示规则，输入项目要标准化，发布前要有人确认。写不存在的设施是虚假宣传；凭记忆输入容易出错；不确认就自动发布风险高。","ej":"広告ルール・入力項目・公開前の確認者を設計"},{"id":"d4-022","d":4,"t":"4.4","n":1,"q":"既存の議事録作成業務にClaudeを組み込みたい。現在は会議後に担当者が録音を聞き直して2時間かけて作成している。最も適切な組込み方はどれか。","qz":"想把Claude嵌入现有的会议纪要制作业务。目前会后由负责人重听录音，花2小时制作。最合适的嵌入方式是哪一项？","o":[{"j":"会議自体を廃止し、Claudeに議題の結論を出させる","z":"取消会议本身，让Claude给出议题结论"},{"j":"文字起こしテキストをClaudeに渡し、決定事項・ToDo・担当者を所定形式で下書きさせ、出席者が確認して確定する","z":"把转写文本交给Claude，按规定格式起草决定事项、待办和负责人，再由参会者确认定稿"},{"j":"議事録を作らず、各自の記憶に任せる","z":"不做纪要，交给各自记忆"},{"j":"録音データを無料の公開文字起こしサービスにアップロードし、出力された文章をそのまま全社に配信して出席者による確認は省く","z":"把录音上传到免费的公开转写服务，把输出的文字直接发给全公司，省略参会者的确认"}],"a":[1],"e":"在现有流程中用Claude做起草（增强），并保留人的确认步骤，是典型的嵌入方式。取消会议、让AI决定结论偏离目的；随意上传到公开服务违反数据政策；不做纪要不是改善。","ej":"既存フローに下書き役として組込み、人が確認"},{"id":"d4-023","d":4,"t":"4.4","n":2,"q":"カスタマーサポートで、Claudeを使った返信下書き作成を業務フローに組み込む。運用ルールとして適切なものを2つ選べ。","qz":"在客户支持中，把用Claude起草回复嵌入业务流程。作为运营规则，请选出2项合适的。","o":[{"j":"回答方針・トーン・禁止事項をProject指示として共通化する","z":"把回答方针、语气、禁止事项作为Project指示统一化"},{"j":"返金・法的対応など高リスクな案件は、担当者が必ず内容を確認してから送信する","z":"退款、法律应对等高风险案件，负责人必须确认内容后再发送"},{"j":"担当者ごとに自由な指示で運用し、統一しない","z":"每个负责人用自由的指示运作，不统一"},{"j":"Claudeの下書きは常に正しいので確認なしで送信する","z":"Claude的草稿总是正确的，不确认直接发送"},{"j":"顧客のクレジットカード番号をそのまま貼り付けて文脈を補う","z":"直接粘贴客户信用卡号以补充上下文"}],"a":[0,1],"e":"按风险分级设置人工确认，并用Project指示统一方针和语气，能兼顾效率与质量。不确认直接发送有幻觉风险；粘贴信用卡号违反数据最小化原则；各自为政会导致回答不一致。","ej":"高リスクは人が確認+方針をProject指示で共通化"},{"id":"d4-024","d":4,"t":"4.4","n":1,"q":"業務フローを「拡張(augment)」するのではなく「再設計(redesign)」すべきと判断できるのは、どのような場合か。","qz":"在什么情况下，可以判断业务流程应该“重新设计（redesign）”而不是“增强（augment）”？","o":[{"j":"一部の文章作成だけを速くしたい場合","z":"只想加快部分文字写作的情况"},{"j":"既存の手順の多くが、Claudeの活用を前提にすると不要または順序を変えた方がよいと分かった場合","z":"发现以使用Claude为前提时，现有步骤中很多变得不必要或应该改变顺序的情况"},{"j":"Claudeの利用料を減らしたい場合","z":"想减少Claude使用费的情况"},{"j":"担当者が新しいツールに不慣れで、既存の手順のまま一部の作業だけを置き換えたいと考えている場合","z":"负责人不熟悉新工具，希望保持现有步骤只替换部分作业的情况"}],"a":[1],"e":"当以Claude为前提后，现有步骤大量变得多余或顺序应调整时，就应考虑重新设计流程，而不是在旧流程上加一个工具。只想加快局部写作属于增强；不熟悉工具是培训问题；降低费用不是重设计的判断标准。","ej":"前提が変わり手順自体が不要→再設計"},{"id":"d4-025","d":4,"t":"4.4","n":1,"q":"チームのタスク管理でClaudeを使い、毎週月曜に先週の進捗メールとチャットを要約したい。Google Workspaceを使っている場合、最も適切な方法はどれか。","qz":"团队在任务管理中使用Claude，想每周一汇总上周的进度邮件和聊天。在使用Google Workspace的情况下，最合适的方法是哪一项？
