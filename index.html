<style>
:root{--bg:#faf7f2;--card:#fff;--fg:#26221e;--mute:#7a7168;--line:#e7e0d6;--acc:#c96442;--acc2:#f3e3da;--ok:#2f8a4f;--okbg:#e3f3e8;--ng:#c0392b;--ngbg:#fbe6e3;--tip:#eef5fb;--tipb:#4a86b8;--warn:#fdf3e1;--warnb:#d4952a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Hiragino Sans","PingFang SC","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:center;gap:10px}
header img{width:30px;height:30px;border-radius:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:4px 12px;font-size:13px}
.tg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:820px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}

nav button.on{color:var(--acc);font-weight:600}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600}
.btn.s{background:var(--acc2);color:var(--acc)}.btn.g{background:none;border:1px solid var(--line);color:var(--fg);font-weight:400}
.btn:disabled{opacity:.45}
.mute{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}

.note{overflow-x:auto}.note ul,.note ol{padding-left:1.3em}.note li{margin:4px 0}
.j{color:var(--acc)}
.tip{background:var(--tip);border-left:4px solid var(--tipb);padding:8px 12px;border-radius:6px;list-style:none}
.warn{background:var(--warn);border-left:4px solid var(--warnb);padding:8px 12px;border-radius:6px;list-style:none}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}
.qh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);margin-bottom:6px}
.qt{font-size:17px;font-weight:500}.zh{color:var(--mute);font-size:14px;margin-top:4px}
.pick{display:inline-block;background:var(--acc2);color:var(--acc);font-size:12px;border-radius:6px;padding:1px 8px;margin-top:6px;font-weight:600}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;font-size:15px;line-height:1.5}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc)}.opt.sel .L{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}.opt.ng .L{background:var(--ng);color:#fff;border-color:var(--ng)}
.opt .zh{font-size:13px;margin-top:2px}
.res{border-radius:12px;padding:12px 14px;margin-top:10px}.res.ok{background:var(--okbg)}.res.ng{background:var(--ngbg)}
.res .h{font-weight:700;margin-bottom:4px}.ej{margin-top:8px;font-weight:600;color:var(--acc)}
.star{border:0;background:none;font-size:20px;color:var(--mute);padding:0}.star.on{color:#e0a800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 0;font-size:13px}
.grid button.a{background:var(--acc2)}.grid button.c{outline:2px solid var(--acc)}.grid button.ok{background:var(--okbg);color:var(--ok)}.grid button.ng{background:var(--ngbg);color:var(--ng)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:40px;font-weight:800;line-height:1.1}
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-size:24px;font-weight:700}.flash .en{color:var(--mute);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;background:var(--card)}
select,input[type=number],textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--fg)}
textarea{width:100%;height:90px;font-size:12px}
.hidezh .zh,.hidezh .zhb{display:none}

<script>
// 要点ノート：中文为主，<b class=j> 为考试日语原文用语
const NOTES = [
{d:0, ja:"試験概要と攻略", zh:"考试概况与攻略", secs:[
{t:"0.1", ja:"試験の基本情報", zh:"考试基本信息", h:`
<table class=tb>
<tr><th>项目</th><th>内容</th></tr>
<tr><td>考试代码</td><td>CCAO-F（Claude Certified Associate – Foundations）</td></tr>
<tr><td>题数 / 时间</td><td>60 题 / 120 分钟（平均每题 2 分钟）</td></tr>
<tr><td>题型</td><td><b class=j>単一選択</b>（4选1）＋<b class=j>複数選択</b>（题目会写明选几个，如「2つ選択」）</td></tr>
<tr><td>合格线</td><td>スケールスコア <b>720</b> / 100〜1,000</td></tr>
<tr><td>语言</td><td>2026年10月起可选日语</td></tr>
<tr><td>形式</td><td>Pearson VUE 在线监考或考试中心</td></tr>
<tr><td>有效期</td><td>12 个月，期满前通过免费在线更新测试即可续期</td></tr>
<tr><td>重考</td><td>第1次不合格后等14天，第2次后30天，第3次后90天；12个月内最多4次</td></tr>
</table>
<p>成绩单会给出各 Domain 的正确率，但合格与否只看总分。</p>`},
{t:"0.2", ja:"出題ドメインと配点", zh:"出题领域与权重", h:`
<table class=tb>
<tr><th>#</th><th>Domain</th><th>权重</th><th>约题数</th></tr>
<tr><td>1</td><td>プロンプト設計とタスク実行<br><small>Prompting and Task Execution</small></td><td>14%</td><td>8〜9</td></tr>
<tr><td>2</td><td>出力の評価と検証<br><small>Output Evaluation and Validation</small></td><td><b>21%</b></td><td>12〜13</td></tr>
<tr><td>3</td><td>製品・モデル選定<br><small>Product and Model Selection</small></td><td>12%</td><td>7</td></tr>
<tr><td>4</td><td>ワークフロー統合とソリューション設計<br><small>Workflow Integration and Solution Design</small></td><td>16%</td><td>9〜10</td></tr>
<tr><td>5</td><td>設定とナレッジ管理<br><small>Configuration and Knowledge Management</small></td><td>12%</td><td>7</td></tr>
<tr><td>6</td><td>ガバナンス・リスク・責任ある利用<br><small>Governance, Risk, and Responsible Use</small></td><td>15%</td><td>9</td></tr>
<tr><td>7</td><td>トラブルシューティングと最適化<br><small>Troubleshooting and Optimization</small></td><td>10%</td><td>6</td></tr>
</table>
<p class=tip>D2（出力验证）+ D6（治理）= 36%，是“判断题”的核心：<b>先验证、守规则、该找人时找人</b>。</p>`},
{t:"0.3", ja:"正解を選ぶ原則", zh:"选正确答案的通用原则", h:`
<p>本考试几乎全是“业务场景 + <b class=j>最も適切な行動は？</b>”。正确答案通常符合下面的思路：</p>
<ol>
<li><b>用一手资料验证</b>，不相信 Claude 的“自信程度”（<b class=j>確信度の自己申告は根拠にならない</b>）。</li>
<li><b>符合组织政策</b>：先匿名化/删除个人信息再上传，而不是“告诉 Claude 别记住”。</li>
<li><b>适度</b>：既不“原样照用”，也不“干脆放弃 AI”。正确答案通常是“带安全措施继续做”。</li>
<li><b>人机分工</b>：高风险（法律、医疗、财务、人事、对外发布）一定有<b class=j>人によるレビュー</b>。</li>
<li><b>匹配任务</b>：简单大量用快速便宜的模型，复杂推理用高性能模型；简单查询不用 Research。</li>
<li><b>找根因</b>：输出不好时，先改善指示（目的、背景、格式、例子），而不是换平台或只改语气。</li>
<li><b>知道边界</b>：API 集成、企业级架构、Agent 开发 → <b class=j>エスカレーション</b>给 Architect / Developer。</li>
</ol>
<p class=warn>常见错误选项：「Claudeが自信を持っているのでそのまま送る」「表現をフォーマルにするだけ」「AIの利用を全面禁止」「別のAIに乗り換える」「最上位モデルを常に使う」。</p>`},
{t:"0.4", ja:"AI Fluency 4D フレームワーク", zh:"AI Fluency 4D 框架", h:`
<p>Anthropic 的 AI 素养框架，是本考试的思想基础。</p>
<table class=tb>
<tr><th>4D</th><th>含义</th><th>对应 Domain</th></tr>
<tr><td><b class=j>Delegation</b>（委任）</td><td>判断这项工作是否、何时、如何交给 AI，哪些必须由人来做</td><td>D3, D4, D6</td></tr>
<tr><td><b class=j>Description</b>（記述）</td><td>清楚描述目标、背景、约束、格式，也就是写好提示词</td><td>D1, D5</td></tr>
<tr><td><b class=j>Discernment</b>（識別）</td><td>判断输出是否准确、相关、适合用途</td><td>D2, D7</td></tr>
<tr><td><b class=j>Diligence</b>（責任・誠実さ）</td><td>对 AI 的使用负责：验证、透明披露、考虑对下游的影响</td><td>D2, D6</td></tr>
</table>
<p>三种协作模式：<b class=j>Automation</b>（让 AI 执行明确任务）/ <b class=j>Augmentation</b>（人和 AI 一起思考创作）/ <b class=j>Agency</b>（让 AI 在一定范围内自主行动）。</p>`}
]},

{d:1, ja:"D1 プロンプト設計とタスク実行", zh:"D1 提示词设计与任务执行（14%）", secs:[
{t:"1.1", ja:"効果的なプロンプトの作成", zh:"写出有效的提示词", h:`
<p>好的提示词＝把 Claude 当成<b>聪明但不了解情况的新同事</b>，把需要的信息全部告诉它。</p>
<table class=tb>
<tr><th>要素</th><th>日语</th><th>例</th></tr>
<tr><td>目的</td><td>目的・ゴール</td><td>「経営会議で予算承認を得るための要約」</td></tr>
<tr><td>背景</td><td>背景・コンテキスト</td><td>公司情况、已有讨论、前提</td></tr>
<tr><td>读者</td><td>読み手・対象者</td><td>高管、新员工、客户、技术人员</td></tr>
<tr><td>约束</td><td>制約</td><td>字数、语气、禁止事项、截止日期</td></tr>
<tr><td>格式</td><td>出力形式</td><td>表格、要点列表、JSON、邮件格式</td></tr>
<tr><td>示例</td><td>例示（few-shot）</td><td>给 1〜3 个好的例子</td></tr>
</table>
<p><b>技巧：</b></p>
<ul>
<li><b class=j>具体的に・明確に</b>：说“写 3 个要点，每个 50 字以内”，而不是“简短一点”。</li>
<li><b class=j>役割の付与</b>（ロールプロンプト）：「あなたは経験豊富な人事担当者です」。</li>
<li><b class=j>XMLタグで区切る</b>：<code>&lt;document&gt;…&lt;/document&gt;</code> 把资料和指示分开，减少混淆。</li>
<li>长资料<b>放在前面</b>，问题和指示放在后面。</li>
<li>允许它说不知道：「情報が不足している場合は推測せず、そう伝えてください」，可以减少幻觉。</li>
<li>说明<b>为什么</b>这么要求（理由），Claude 会更准确地理解意图。</li>
<li>告诉它“要做什么”比“不要做什么”更有效。</li>
</ul>`},
{t:"1.2", ja:"タスク分解", zh:"任务分解", h:`
<p>复杂的请求一次全部提出，容易出现遗漏、质量下降。要<b class=j>タスク分解</b>（task decomposition）。</p>
<ul>
<li><b class=j>プロンプトチェーン</b>：前一步的输出作为下一步的输入。例：①提取要点 → ②整理结构 → ③写初稿 → ④按读者修改。</li>
<li>每一步都能单独检查，<b>出问题时容易定位是哪一步</b>。</li>
<li>先让 Claude 制定计划或大纲，人确认后再执行。</li>
<li><b class=j>段階的に考えさせる</b>（让它一步步思考）：复杂分析时让 Claude 先写出推理过程，精度会提高。也可以用 Extended thinking。</li>
<li>适合分解的情况：多个资料比较、长文档制作、多步分析、需要不同风格的多个产出。</li>
</ul>
<p class=tip>考试判断：如果输出“遗漏多、质量不稳定”，并且原因是“一个提示词塞了太多任务”，正确答案就是“分成多个步骤”。</p>`},
{t:"1.3", ja:"プロンプトの反復改善", zh:"迭代改进提示词", h:`
<ul>
<li>第一次的输出不理想很正常，要<b class=j>反復（イテレーション）</b>。</li>
<li>改进时要<b>具体反馈</b>：「第2段落は専門用語が多いので、新入社員向けに言い換えて」，比「もっと良くして」有效得多。</li>
<li>先<b>诊断原因</b>：是缺背景？目的不清？格式没指定？例子不对？然后改提示词中对应的部分。</li>
<li>一次只改一个地方，比较效果（像 A/B 测试）。</li>
<li>好的提示词要<b>保存成模板</b>，或写进 Project 指示里重复使用。</li>
<li>对话越来越长、偏离方向时，与其继续修补，不如<b>整理好提示词，开新对话</b>。</li>
</ul>`},
{t:"1.4", ja:"タスク種別に応じた戦略", zh:"按任务类型调整策略", h:`
<table class=tb>
<tr><th>任务类型</th><th>提示词要点</th></tr>
<tr><td><b class=j>分析</b></td><td>提供数据、说明分析角度和评价标准，让它先写推理过程，要求给出依据，并区分事实和推测</td></tr>
<tr><td><b class=j>調査（リサーチ）</b></td><td>需要最新信息就开启 Web 搜索或 Research，要求附上出处，事后确认一手资料</td></tr>
<tr><td><b class=j>起草（ドラフト）</b></td><td>说明读者、语气、长度、目的，给出范文或模板，加入组织的风格规范</td></tr>
<tr><td><b class=j>ブレインストーミング</b></td><td>先追求数量和多样性，不急着评价。“请给出 20 个方案，包括非常规的”，然后再筛选评价</td></tr>
<tr><td>要約</td><td>说明用途和读者，指定长度，要求保留重要数字和结论</td></tr>
<tr><td>分类・抽取</td><td>给出明确的类别定义和例子，指定输出格式（表格/JSON）</td></tr>
</table>`}
]},

{d:2, ja:"D2 出力の評価と検証", zh:"D2 输出的评估与验证（21%・最重要）", secs:[
{t:"2.1", ja:"正確性・完全性の評価", zh:"评估准确性与完整性", h:`
<ul>
<li><b class=j>正確性</b>：事实、数字、引用是否正确。<b class=j>完全性</b>：是否覆盖了所有要求（对照原始需求逐项检查）。</li>
<li>用<b>检查清单</b>评估：目的达到了吗？必需项都有吗？数字和原始资料一致吗？读者能看懂吗？</li>
<li>摘要要和<b>原文对照</b>：有没有漏掉重要的条件、例外、数字？有没有原文里没有的内容？</li>
<li>Claude 的输出很流畅、看起来很专业，但<b>流畅≠正确</b>。</li>
</ul>`},
{t:"2.2", ja:"ハルシネーション・矛盾・バイアスの特定", zh:"识别幻觉、矛盾与偏见", h:`
<p><b class=j>ハルシネーション</b>：看起来合理但实际是错的或编造的内容。</p>
<p class=warn>重点留意：具体的<b>条文号、论文标题、URL、统计数字、人名、日期、判例</b>，这些越具体越要验证。</p>
<ul>
<li><b class=j>矛盾（不整合）</b>：前后数字不一致、合计对不上、同一份文档里结论互相冲突。</li>
<li><b class=j>バイアス</b>：只举某一方的观点、带刻板印象（性别、年龄、国籍）、用词带倾向、数据偏向特定群体。对策：要求列出多方观点、指定中立的评价标准、请多样的人来评审。</li>
<li>Claude 的知识有<b class=j>知識のカットオフ</b>（训练截止日期），最新信息可能是旧的。</li>
<li>❌「Claudeに自分の確信度を評価させる」—— 自我评价<b>不能证明正确性</b>。</li>
</ul>`},
{t:"2.3", ja:"ファクトチェックと検証手法", zh:"事实核查与验证方法", h:`
<ul>
<li><b class=j>一次情報（一次資料）</b>验证：法律原文、官方统计、公司内部正式资料、原论文。</li>
<li>要求 Claude <b>附上出处和引用</b>，然后<b>人去确认</b>出处是否存在、内容是否一致。</li>
<li>基于上传的资料回答时：要求<b>先摘录相关原文，再回答</b>（引用优先），方便核对。</li>
<li>数字计算用代码执行来验证，或手工复算。</li>
<li>交叉验证（クロスチェック）：多个独立来源一致吗？</li>
<li>Web 搜索和 Research 提供引用，但<b>引用本身也要打开确认</b>。</li>
</ul>`},
{t:"2.4", ja:"人によるレビューが必要な場面", zh:"什么时候必须人工审核", h:`
<p><b class=j>ヒューマン・イン・ザ・ループ</b>（Human-in-the-loop）：重要判断一定由人来做最终确认。</p>
<table class=tb>
<tr><th>必须人工审核/专家确认</th><th>风险较低</th></tr>
<tr><td>法律・合规・合同<br>医疗・健康<br>财务・投资・会计数字<br>人事评价・录用<br>对外发布（客户、媒体、监管）<br>影响很多人的决定</td><td>内部头脑风暴<br>个人笔记整理<br>初稿（之后还会修改）<br>格式转换</td></tr>
</table>
<ul>
<li>风险越高、越难恢复、读者越多 → 验证越严格。</li>
<li>Claude 是<b>辅助</b>，<b>最终责任在人</b>（Diligence）。</li>
</ul>`},
{t:"2.5", ja:"読み手に合わせた編集・比較", zh:"按读者编辑、比较输出", h:`
<ul>
<li>同一内容，按读者改写：高管→结论先行、简洁；技术人员→详细准确；客户→礼貌、避免内部术语；新人→解释术语。</li>
<li>让 Claude 生成<b>多个版本</b>，比较后选择或组合。</li>
<li>评估时要有<b>明确的评价标准</b>（准确性、清晰度、语气、长度），而不是凭感觉。</li>
<li>Claude 的初稿是起点，<b>人要编辑</b>：加入组织特有的知识、确认事实、调整语气。</li>
</ul>`},
{t:"2.6", ja:"情報整理と出力形式の選択", zh:"整理信息与选择输出格式", h:`
<table class=tb>
<tr><th>形式</th><th>适合</th></tr>
<tr><td><b class=j>インライン</b>（对话中直接回答）</td><td>简短回答、解释、一次性的确认</td></tr>
<tr><td><b class=j>アーティファクト</b></td><td>需要反复编辑、单独保存或共享的成果：文档、代码、图表、简单应用、网页</td></tr>
<tr><td><b class=j>構造化データ</b>（表格、JSON、CSV）</td><td>需要比较、排序、导入其他工具（Excel 等）的信息</td></tr>
<tr><td>文件（docx / xlsx / pptx / pdf）</td><td>要发给别人、在 Office 里继续编辑</td></tr>
</table>
<p class=tip>判断依据：<b>用途、读者、之后要怎么用</b>。</p>`}
]},

{d:3, ja:"D3 製品・モデル選定", zh:"D3 产品功能与模型选择（12%）", secs:[
{t:"3.1", ja:"Claudeの製品機能の選択", zh:"选择合适的 Claude 功能", h:`
<table class=tb>
<tr><th>功能</th><th>是什么</th><th>什么时候用</th></tr>
<tr><td><b class=j>チャット</b></td><td>普通对话</td><td>一次性的问题、简单任务</td></tr>
<tr><td><b class=j>Projects（プロジェクト）</b></td><td>把指示、知识文件和对话集中在一起</td><td>反复进行的同类工作、团队共享背景、需要参考固定资料</td></tr>
<tr><td><b class=j>Artifacts（アーティファクト）</b></td><td>在单独面板显示的独立成果（文档、代码、图、应用），可迭代、共享</td><td>需要反复修改或分享的成果</td></tr>
<tr><td><b class=j>Research（リサーチ）</b></td><td>自主进行多轮搜索，生成附引用的报告，需要几分钟</td><td>需要多来源的深入调查。简单事实确认用它就过度了</td></tr>
<tr><td><b class=j>Web検索</b></td><td>获取最新信息并附引用</td><td>最新新闻、价格、法规的现状</td></tr>
<tr><td><b class=j>拡張思考（Extended thinking）</b></td><td>回答前进行更深的推理</td><td>复杂分析、多步推理，代价是更慢、用量更多</td></tr>
<tr><td><b class=j>コネクタ</b></td><td>连接 Google Drive、Gmail、Calendar 等外部服务</td><td>需要基于公司内部数据或个人数据回答</td></tr>
<tr><td><b class=j>Skills（スキル）</b></td><td>把操作步骤、模板、脚本打包，相关时自动加载</td><td>按固定格式重复的工作（报告格式、公司模板）</td></tr>
<tr><td>コード実行・ファイル作成</td><td>数据分析、画图、生成 Office 文件</td><td>处理 CSV/Excel，制作 pptx/docx</td></tr>
<tr><td><b class=j>スタイル</b></td><td>设定回答的语气和风格</td><td>统一的写作风格</td></tr>
</table>`},
{t:"3.2", ja:"モデルの違い（Haiku・Sonnet・Opus）", zh:"模型的区别", h:`
<table class=tb>
<tr><th>模型</th><th>特点</th><th>适合</th></tr>
<tr><td><b>Haiku</b></td><td>最快、最便宜</td><td>大量、简单、要求速度的任务：分类、短回复、简单摘要、数据抽取</td></tr>
<tr><td><b>Sonnet</b></td><td>性能与速度/成本平衡</td><td>大多数日常业务的<b>默认选择</b>：起草、分析、编程</td></tr>
<tr><td><b>Opus</b></td><td>最高性能，较慢、成本高</td><td>复杂推理、高难度分析、长时间多步任务、质量最重要的场合</td></tr>
</table>
<p class=warn>具体版本号会更新，考试考的是<b>选择思路</b>，不考版本号。</p>`},
{t:"3.3", ja:"タスク要件に応じたモデル選定", zh:"按任务需求选择模型", h:`
<ul>
<li>三个维度：<b class=j>コスト・速度・品質</b>。</li>
<li>❌「常に最上位モデルを使う」—— 浪费成本和时间。</li>
<li>❌「常に最安モデルを使う」—— 复杂任务质量不够。</li>
<li>✅ 先用标准模型试，质量不够再升级；大量处理时测试小模型是否够用。</li>
<li>同一个工作流里可以<b>按步骤分别选模型</b>（例：Haiku 分类 → Opus 深入分析重要案件）。</li>
</ul>`},
{t:"3.4", ja:"コンテキスト制限とメモリ", zh:"上下文限制与记忆", h:`
<p><b class=j>コンテキストウィンドウ</b>：Claude 一次能“看到”的信息总量（指示 + 文件 + 对话历史），相当于工作记忆。</p>
<ul>
<li>对话太长 → 早期内容被忽略、质量下降、达到上限。</li>
<li><b>什么时候开新对话（再開）</b>：话题变了、对话变长质量下降、前面有很多错误的尝试干扰。</li>
<li><b>要约（サマリー）</b>：让 Claude 总结目前的决定事项和要点，复制到新对话开头继续。</li>
<li><b>永続化</b>：长期使用的信息放进 Project 知识/指示，或使用记忆功能。</li>
</ul>
<table class=tb>
<tr><th>功能</th><th>要点</th></tr>
<tr><td><b class=j>メモリ</b></td><td>从过去对话中记住背景。个人方案默认开启；Team/Enterprise 由管理员开启。可以在设置里查看、编辑、关闭。每个 Project 的记忆是分开的</td></tr>
<tr><td>过去对话搜索</td><td>“Search and reference chats”：引用以前的对话</td></tr>
<tr><td><b class=j>シークレットチャット（Incognito）</b></td><td>不保存在历史中，不用于记忆。适合不想留下记录的一次性对话</td></tr>
</table>`}
]},

{d:4, ja:"D4 ワークフロー統合とソリューション設計", zh:"D4 业务流程整合与方案设计（16%）", secs:[
{t:"4.1", ja:"要件・ユースケースの分析", zh:"分析需求和用例", h:`
<ul>
<li>先弄清<b>业务问题</b>（课题），而不是先想“用 AI 做点什么”。</li>
<li>适合 Claude 的工作：重复性高、以文字为中心、有明确输入输出、可以由人检查结果。</li>
<li>不适合（或需要谨慎）：需要 100% 准确且无法验证、需要实时系统数据但没有连接、法律上必须由人判断。</li>
<li>用 Claude 帮忙<b>整理需求</b>：访谈记录 → 提取需求 → 分类 → 找出缺失点。</li>
<li>定义<b class=j>成功指標（KPI）</b>：节省的时间、质量、错误率、满意度。</li>
</ul>`},
{t:"4.2", ja:"調査・計画・プロセス最適化", zh:"调研、规划与流程优化", h:`
<ul>
<li>调研：用 Research / Web 搜索收集信息 → 用一手资料确认。</li>
<li>规划：让 Claude 拟定计划、找风险、列出依赖关系，人来决策。</li>
<li>流程优化：把现有流程写出来，让 Claude 找瓶颈、重复工作、可自动化的步骤。</li>
<li>先从<b>小规模试点</b>（パイロット）开始，衡量效果，再扩大。</li>
</ul>`},
{t:"4.3", ja:"ソリューション設計と反復", zh:"方案设计与迭代", h:`
<ul>
<li>Claude 可以帮忙做：方案比较、原型（Artifact 做简单的应用或模板）、文档化。</li>
<li>反复：做出来 → 用户反馈 → 改进。</li>
<li>Associate 的范围：Projects、提示词、Artifacts、连接器、Skills 等<b>现有功能的组合</b>。</li>
<li class=warn>需要 API 集成、自定义开发、企业级系统集成、Agent 设计 → <b class=j>Architect / Developer にエスカレーション</b>。</li>
</ul>`},
{t:"4.4", ja:"既存ワークフローへの統合", zh:"融入现有业务流程", h:`
<table class=tb>
<tr><th>方式</th><th>说明</th></tr>
<tr><td><b class=j>拡張（Augment）</b></td><td>保留现有流程，在某些步骤加入 Claude 辅助（例：会议记录 → 用 Claude 做摘要初稿 → 人确认）</td></tr>
<tr><td><b class=j>再設計（Redesign）</b></td><td>以 AI 为前提重新设计整个流程（例：从“人写初稿”变为“Claude 写初稿、人审阅”）</td></tr>
</table>
<ul>
<li>明确<b>谁在哪个环节检查</b>（人工检查点）。</li>
<li>为团队准备：共享 Project、标准提示词模板、使用指南、培训。</li>
<li>变更管理：说明目的，听取一线意见，逐步推进。</li>
</ul>`},
{t:"4.5", ja:"ステークホルダーへの価値と限界の説明", zh:"向利益相关者说明价值与局限", h:`
<ul>
<li><b>价值</b>：节省时间、提高质量的一致性、更快的初稿、更大规模的分析，最好用<b>实际数据</b>说明（试点结果）。</li>
<li><b>局限</b>：可能出现幻觉、知识有截止日期、需要人工验证、敏感数据的限制、不能替代专业判断。</li>
<li>❌ 夸大（“AI 能全部自动化”“不需要人工确认”）。</li>
<li>❌ 过度消极（“AI 不可靠所以不用”）。</li>
<li>✅ 诚实、平衡地说明，管理期望值。</li>
</ul>`}
]},

{d:5, ja:"D5 設定とナレッジ管理", zh:"D5 设置与知识管理（12%）", secs:[
{t:"5.1", ja:"Projectsの指示とナレッジ設定", zh:"设置 Project 的指示和知识", h:`
<ul>
<li><b class=j>プロジェクト指示（カスタム指示）</b>：这个 Project 内所有对话都适用的规则。例如角色、读者、语气、格式、禁止事项、参考哪些资料。</li>
<li><b class=j>プロジェクトナレッジ</b>：上传的文件（规章、手册、模板、过去的成果）。Claude 回答时会参考。</li>
<li>知识量变大时会自动切换到<b>检索方式（RAG）</b>，可以容纳更多资料。</li>
<li>Team / Enterprise 可以<b>共享 Project</b>，设置权限（可查看/可编辑）。</li>
<li>一个 Project 一个目的，不要什么都放进同一个 Project（会互相干扰）。</li>
<li>资料要<b>有清楚的文件名和结构</b>，Claude 更容易找到正确的信息。</li>
</ul>`},
{t:"5.2", ja:"アップロード知識とコネクタの管理", zh:"管理上传的知识与连接器", h:`
<ul>
<li>上传前确认：是最新版本吗？有没有不该上传的机密/个人信息？有使用许可吗？</li>
<li>旧版本和新版本同时存在 → 回答会混乱。<b>删除旧版</b>，只保留正式最新版。</li>
<li><b class=j>コネクタ</b>（Google Drive、Gmail、Google Calendar 等，基于 MCP）：让 Claude 直接查看外部数据，不用每次上传。
<ul><li>Gmail：可以搜索、阅读、写草稿（发送由人来决定）。</li>
<li>Team / Enterprise：由管理员启用连接器。</li>
<li>Claude 只能访问<b>被授权的范围</b>，按<b class=j>最小権限</b>原则授权。</li>
<li>Claude 用连接器执行操作前需要用户确认。</li></ul></li>
<li>文件一直在更新 → 用连接器（查看最新版）比上传副本更合适。</li>
</ul>`},
{t:"5.3", ja:"システムレベル指示の作成", zh:"编写系统级指示", h:`
<ul>
<li>系统级指示（Project 指示、个人偏好、组织设置）对所有对话持续生效。</li>
<li>好的指示：<b>具体、简洁、有优先顺序</b>，说明理由，包含“不知道时怎么做”。</li>
<li>写法例：
<pre>役割：社内ITヘルプデスクの一次回答担当
対象：IT知識のない社員
ルール：
- 回答は添付の「社内ITガイド」に基づく
- ガイドにない場合は推測せず、ヘルプデスク窓口を案内する
- 箇条書き、300字以内</pre></li>
<li>每次都要重复说的内容 → 写进指示。只用一次的内容 → 写在对话里。</li>
<li>指示互相矛盾会导致输出不稳定，要定期检查。</li>
</ul>`},
{t:"5.4", ja:"設定・ナレッジ・指示の保守と更新", zh:"维护和更新设置、知识与指示", h:`
<ul>
<li>规章、价格、产品信息变更时，<b>及时替换知识文件</b>，更新指示。</li>
<li>指定<b>负责人</b>（オーナー），定期检查（例：每季度）。</li>
<li>记录变更（版本管理）：改了什么、为什么改。</li>
<li>更新后用<b>固定的测试问题</b>确认回答是否正确（回归检查）。</li>
<li>听取用户反馈，改进指示。</li>
<li>Skills 也一样：模板变了就更新 Skill。</li>
</ul>`}
]},

{d:6, ja:"D6 ガバナンス・リスク・責任ある利用", zh:"D6 治理、风险与负责任使用（15%）", secs:[
{t:"6.1", ja:"適切・不適切なユースケース", zh:"合适与不合适的用例", h:`
<table class=tb>
<tr><th>适合</th><th>不合适 / 需要特别注意</th></tr>
<tr><td>起草、摘要、翻译初稿<br>头脑风暴<br>资料整理、分析辅助<br>学习、解释<br>流程改善建议</td><td>没有人工审核的最终决定（录用、解雇、贷款审批、医疗诊断）<br>违反政策处理个人信息<br>冒充真人、制造虚假评价<br>用于监视或歧视<br>未经验证就对外发布</td></tr>
</table>
<p>判断标准：<b>影响有多大？能否验证？能否挽回？是否符合政策和法律？</b></p>`},
{t:"6.2", ja:"データ機密性・規制・プライバシー", zh:"数据敏感性、法规与隐私", h:`
<ul>
<li>上传前先<b>确认数据分类</b>（公开/内部/机密/个人信息）和公司政策。</li>
<li>含个人信息 → <b class=j>匿名化・仮名化・マスキング</b>，删掉不需要的识别信息后再上传。</li>
<li class=warn>❌「アップロードしてClaudeに記憶しないよう指示する」—— 这不是政策上的控制手段。</li>
<li>❌「社内利用だから問題ない」—— 内部用也要遵守规定。</li>
<li>✅ 使用公司批准的方案（Team / Enterprise：商用条款，默认不用于模型训练，有管理员控制、SSO、审计日志等）。</li>
<li>个人方案：在设置中可以选择是否允许将数据用于训练。<b>工作数据不要放进个人账号</b>。</li>
<li>相关法规：个人信息保护法（日本 APPI）、GDPR、行业规定（金融、医疗）、著作权、出口管理。</li>
<li>他人的著作物：确认使用条件。</li>
</ul>`},
{t:"6.3", ja:"組織のAIポリシーとガバナンス", zh:"组织的 AI 政策与治理", h:`
<ul>
<li>遵守<b class=j>組織のAI利用ポリシー</b>：哪些工具已批准、哪些数据可以用、需要什么审批。</li>
<li>❌ 使用未经批准的工具（<b class=j>シャドーAI</b>）。</li>
<li>不确定时 → <b>问负责部门</b>（信息安全、法务、合规），而不是自己判断。</li>
<li>管理员可以控制：哪些功能/连接器开放、成员权限、数据保留、审计。</li>
<li>发现问题（数据泄露风险、错误使用）→ 按规定<b>报告</b>。</li>
<li><b class=j>透明性</b>：在需要时说明 AI 参与了内容制作。</li>
</ul>`},
{t:"6.4", ja:"AI利用の倫理的影響", zh:"AI 使用的伦理影响", h:`
<ul>
<li><b>公平</b>：注意输出中的偏见，评审时考虑不同群体。</li>
<li><b>透明</b>：不隐瞒 AI 的使用；不把 AI 生成内容当作人的原创发布到需要原创的地方。</li>
<li><b>责任</b>：AI 出错时，责任在使用并发布它的人和组织。</li>
<li><b>尊重人</b>：不用 AI 冒充真人、操纵他人、侵犯隐私。</li>
<li><b>对工作的影响</b>：说明 AI 是辅助，引入时考虑员工的技能培养。</li>
<li>著作权：生成内容是否和现有作品过于相似，要确认。</li>
</ul>`}
]},

{d:7, ja:"D7 トラブルシューティングと最適化", zh:"D7 故障排查与优化（10%）", secs:[
{t:"7.1", ja:"不調なプロンプト・出力の診断と解決", zh:"诊断和解决效果不好的提示词/输出", h:`
<table class=tb>
<tr><th>症状</th><th>可能原因</th><th>对策</th></tr>
<tr><td>太泛泛、不具体</td><td>缺少背景和目的</td><td>补充背景、读者、目的，提供例子</td></tr>
<tr><td>格式每次不同</td><td>没有指定格式</td><td>明确格式，提供模板/示例</td></tr>
<tr><td>漏掉部分要求</td><td>一次要求太多</td><td>任务分解；列出检查项</td></tr>
<tr><td>编造信息</td><td>资料不足、没允许说“不知道”</td><td>提供资料，要求引用，允许回答“不明”</td></tr>
<tr><td>忽略上传资料</td><td>资料太多、指示不清楚、有旧版本</td><td>指明参考哪个文件；整理知识；删除旧版</td></tr>
<tr><td>长对话后质量下降</td><td>上下文太长</td><td>总结后开新对话</td></tr>
<tr><td>语气不对</td><td>没说明读者和语气</td><td>说明读者，设定风格，给范文</td></tr>
<tr><td>答案过时</td><td>知识截止日期</td><td>开启 Web 搜索，提供最新资料</td></tr>
</table>
<p class=tip>原则：<b>先诊断原因，再针对性地修改</b>。“换个 AI”“只重复同一句话”都不是好答案。</p>`},
{t:"7.2", ja:"フィードバックと結果に基づく調整", zh:"根据反馈和结果调整", h:`
<ul>
<li>收集用户反馈（哪里不好用、哪里错了），反映到提示词/指示/知识中。</li>
<li>改进效果要<b>测量</b>：修改前后用相同的测试用例比较。</li>
<li>反复出现的问题 → 修改 Project 指示或模板，而不是每次手工修正。</li>
<li>如果超出自己的能力范围（需要开发、集成）→ 升级给专家。</li>
</ul>`},
{t:"7.3", ja:"ワークフローの効率化", zh:"优化工作流程效率", h:`
<ul>
<li>重复使用的提示词 → <b>模板化</b>，放进 Project 或 Skill。</li>
<li>简单大量的工作 → 用更快、更便宜的模型。</li>
<li>不要过度使用：简单问题不用 Research，不开不需要的扩展思考。</li>
<li>减少来回：一开始就提供完整的背景和格式要求。</li>
<li>多个任务批量处理（一次给多个文件，按统一格式输出）。</li>
<li>用连接器直接读取数据，省去手动复制粘贴。</li>
<li>衡量：花费的时间、修改次数、质量。</li>
</ul>`}
]}
];

const QS=[{"id":"d1-001","d":1,"t":"1.1","n":1,"q":"マーケティング担当者が「新製品の紹介文を書いて」とだけ依頼したところ、Claudeの出力は一般的で使いにくいものだった。次の依頼で最も効果的な改善はどれか。","qz":"市场负责人只说了“写一段新产品介绍”，Claude 的输出很笼统、不好用。下一次请求中最有效的改进是哪一个？","o":[{"j":"同じ依頼を数回繰り返し、良いものが出るまで再生成する","z":"重复同样的请求几次，直到生成满意的结果"},{"j":"対象読者、製品の特徴、トーン、文字数、使用媒体を明記して依頼する","z":"写明目标读者、产品特点、语气、字数和使用媒介后再请求"},{"j":"「もっと良い文章にして」と追加で指示する","z":"追加一句“写得更好一点”"},{"j":"より高性能なモデルに切り替え、同じ依頼文のまま複数回生成させて、最も出来の良いものを選んで使う","z":"切换到更高性能的模型，用同样的请求生成多次，选出效果最好的来使用"}],"a":[1],"e":"输出笼统的根本原因是请求缺少背景信息。明确读者、目的、约束和格式（Description）是最直接的改进。反复生成或“写得更好”都没有补充信息；换模型也不能弥补缺失的上下文，还增加成本。","ej":"曖昧な出力の原因は情報不足。読者・目的・制約・形式を明示する。"},{"id":"d1-002","d":1,"t":"1.1","n":1,"q":"人事担当者が、40ページの就業規則PDFを読み込ませた上で、育児休業に関する質問に答えさせたい。長文資料を使うプロンプトの構成として最も適切なものはどれか。","qz":"人事负责人想让 Claude 读取 40 页的就业规则 PDF，然后回答有关育儿假的问题。使用长篇资料时，提示词的结构最合适的是哪一个？","o":[{"j":"質問を先頭に書き、資料はプロンプトの最後に貼り付ける","z":"问题写在开头，资料贴在提示词最后"},{"j":"資料を要約せずに、質問だけを送る","z":"不提供资料，只发送问题"},{"j":"資料を先に置き、タグなどで区切った上で、質問と回答形式を最後に記述する","z":"先放资料并用标签等分隔，最后写问题和回答格式"},{"j":"資料の内容を自分の言葉で短く書き直し、要点だけにしてから質問と一緒に送ることで、Claudeが読む量を減らす","z":"先用自己的话把资料简短改写成要点，再和问题一起发送，以减少 Claude 需要读的内容"}],"a":[2],"e":"长文档的推荐做法是“资料在前、问题在后”，并用 XML 标签等清楚分隔资料和指示，这样回答质量更高。只发问题会让 Claude 凭一般知识回答；自己改写资料可能遗漏或歪曲关键条款。","ej":"長文資料は先頭に置き、質問は最後に。タグで区切る。"},{"id":"d1-003","d":1,"t":"1.1","n":1,"q":"営業チームの週報を毎週同じ形式でまとめたい。Claudeの出力形式がばらつく問題を最も確実に減らす方法はどれか。","qz":"想每周用相同格式汇总销售团队的周报。最能可靠地减少 Claude 输出格式不一致问题的方法是哪一个？","o":[{"j":"望ましい出力の見本(例)を1〜2件プロンプトに含める","z":"在提示词中加入 1～2 个理想输出的示例"},{"j":"毎回「前回と同じ形式で」とだけ書く","z":"每次只写“和上次格式一样”"},{"j":"出力後に担当者が毎回フォーマットを手作業で整え、整えた結果を社内共有フォルダに保存しておく","z":"输出后每次由负责人手动调整格式，并把调整结果保存到公司共享文件夹"},{"j":"温かみのあるトーンで書くよう指示する","z":"指示用温暖的语气书写"}],"a":[0],"e":"提供示例（few-shot）是统一格式最有效的手段之一。“和上次一样”在新对话里 Claude 看不到上次内容；手动修正没有解决根本问题；语气与格式一致性无关。","ej":"形式をそろえるには例示(few-shot)が有効。"},{"id":"d1-004","d":1,"t":"1.1","n":2,"q":"法務部門向けに契約書のリスク箇所を指摘させるプロンプトを作成している。出力の質を高めるために有効な工夫はどれか。2つ選べ。","qz":"正在为法务部门编写提示词，让 Claude 指出合同中的风险点。以下哪些做法能有效提高输出质量？请选择 2 项。","o":[{"j":"出力を長くするため「できるだけ多く指摘して」と指示する","z":"为了让输出更长，指示“尽可能多地指出问题”"},{"j":"「あなたは企業法務に詳しいレビュアーです」と役割と観点を与える","z":"给出角色和视角：“你是熟悉企业法务的审阅者”"},{"j":"できるだけ短いプロンプトにするため、背景説明を省く","z":"为了让提示词尽量简短，省略背景说明"},{"j":"「絶対に間違えないで」と強い言葉で繰り返す","z":"用强烈的语气反复说“绝对不要出错”"},{"j":"指摘ごとに該当条文の原文を引用させ、根拠を示させる","z":"让每个指出的问题都引用相应条款原文，说明依据"}],"a":[1,4],"e":"赋予角色与审阅视角能让分析更专业；要求引用原文作为依据，既提高准确性又便于人工核对。强调“绝不要出错”不会提高准确性；省略背景会降低质量；追求数量会混入无关或牵强的指出。","ej":"役割付与と原文引用(根拠提示)で質と検証性を上げる。"},{"id":"d1-005","d":1,"t":"1.1","n":1,"q":"社内向けFAQを作成する際、Claudeに不確かな内容を推測で書かれるのを避けたい。プロンプトに加えるべき指示として最も適切なものはどれか。","qz":"制作内部 FAQ 时，希望避免 Claude 凭猜测写出不确定的内容。提示词中最应该加入的指示是哪一个？","o":[{"j":"「必ずすべての質問に答えること」","z":"“必须回答所有问题”"},{"j":"「提供した資料に根拠がない場合は『資料に記載なし』と答えてよい」","z":"“如果所提供资料中没有依据，可以回答‘资料中未记载’”"},{"j":"「自信を持って断定的に書くこと」","z":"“要自信、断定地书写”"},{"j":"「資料にない内容は、一般常識や業界の慣例から推測して補い、FAQとして完成させてよい」","z":"“资料中没有的内容，可以根据一般常识或行业惯例推测补充，完成 FAQ”"}],"a":[1],"e":"明确允许 Claude 说“不知道/资料中没有”，能显著减少幻觉。强制回答所有问题、要求断定语气、允许用常识补充，都会增加编造内容的风险。","ej":"「わからなければそう言ってよい」と許可するとハルシネーションが減る。"},{"id":"d1-006","d":1,"t":"1.1","n":1,"q":"プロンプト内で、指示・参考資料・入力データが混ざってしまい、Claudeが資料中の文章を指示と誤解することがあった。最も有効な対策はどれか。","qz":"提示词中指示、参考资料和输入数据混在一起，Claude 有时把资料里的句子误当成指示。最有效的对策是哪一个？","o":[{"j":"資料を削除し、指示だけで依頼する","z":"删除资料，只用指示请求"},{"j":"指示・資料・データをすべて1つの段落にまとめ、プロンプト全体をできるだけ短く簡潔にする","z":"把指示、资料和数据全部合并成一段，让整个提示词尽量简短"},{"j":"全文を太字にして強調する","z":"把全文加粗强调"},{"j":"<instructions>や<document>などのタグで各部分を明確に区切る","z":"用 <instructions>、<document> 等标签明确分隔各部分"}],"a":[3],"e":"用 XML 标签等分隔指示、资料和数据，可让 Claude 清楚区分哪些是要执行的指示、哪些是要处理的内容。删除资料会丢失信息；合并成一段更混乱；加粗无法表达结构。","ej":"XMLタグで指示・資料・データを区切る。"},{"id":"d1-007","d":1,"t":"1.1","n":1,"q":"教育担当者が、新入社員向け研修資料の説明文をClaudeに作らせたい。対象者に合った出力を得るために最も重要な情報はどれか。","qz":"培训负责人想让 Claude 为新员工培训资料编写说明文字。为了得到适合对象的输出，最重要的信息是哪一个？","o":[{"j":"受講者の前提知識レベルと、研修後にできるようになってほしいこと","z":"学员的基础知识水平，以及培训后希望他们能做到什么"},{"j":"担当者自身の役職名","z":"负责人自己的职位名称"},{"j":"前年の研修資料のファイル名と作成者、保存場所、使用したテンプレートの種類","z":"去年培训资料的文件名、作者、保存位置以及所用模板的类型"},{"j":"使用しているパソコンのOS","z":"所使用电脑的操作系统"}],"a":[0],"e":"面向特定受众的内容，最关键的是受众的知识水平和学习目标，这决定了用词难度和详略。职位名称、文件名和操作系统对内容质量几乎没有帮助。","ej":"読み手の前提知識と目的を伝える。"},{"id":"d1-025","d":1,"t":"1.1","n":1,"q":"Claudeに「この企画は良いと思いますか?」と尋ねると、毎回肯定的な評価ばかり返ってくる。より批判的な検討を得るためのプロンプトとして最も適切なものはどれか。","qz":"问 Claude“你觉得这个企划好吗？”，每次都只得到正面评价。为了获得更有批判性的审视，最合适的提示词是哪一个？","o":[{"j":"「この企画は素晴らしいですよね?」と確認する","z":"确认“这个企划很棒吧？”"},{"j":"「良いと言ってください」と指示する","z":"指示“请说好”"},{"j":"評価をやめて、企画書の誤字脱字や表記ゆれだけを確認させ、内容には触れないよう指示する","z":"不再评估，只让它检查企划书的错漏字和用词不统一，指示不涉及内容"},{"j":"「懐疑的な審査員の立場で、弱点とリスクを重要度順に5つ挙げて」と依頼する","z":"请求“以怀疑型评审者的立场，按重要程度列出 5 个弱点和风险”"}],"a":[3],"e":"引导性问题容易得到迎合式回答。明确指定批判性角色和输出内容（弱点、风险、排序），能获得更有价值的审视。诱导性确认和要求说好会加重偏差；只查错字回避了问题。","ej":"批判的検討は役割と観点(弱点・リスク)を明示して求める。誘導質問は避ける。"},{"id":"d1-026","d":1,"t":"1.1","n":1,"q":"Claudeに出力してほしくない内容がある場合のプロンプトの書き方として、一般的に効果的なものはどれか。","qz":"当有不希望 Claude 输出的内容时，一般来说有效的提示词写法是哪一个？","o":[{"j":"「〜しないで」だけでなく、代わりにどうしてほしいかを肯定形で具体的に書く","z":"不只写“不要做～”，而是用肯定句具体写出希望它怎么做"},{"j":"禁止事項を大文字や記号で強調し、プロンプトの冒頭と末尾で何度も繰り返して書く","z":"用大写或符号强调禁止事项，并在提示词开头和结尾多次重复"},{"j":"禁止事項は書かず、出力後に削除する","z":"不写禁止事项，输出后再删除"},{"j":"禁止事項だけを並べ、目的は書かない","z":"只罗列禁止事项，不写目的"}],"a":[0],"e":"与其只说“不要”，不如说明“要怎样”以及原因，Claude 更容易照做。重复强调效果有限；事后删除效率低；只列禁止项而不说目的，Claude 难以把握意图。","ej":"「〜しない」より「代わりに〜する」と肯定形で具体的に。"},{"id":"d1-030","d":1,"t":"1.1","n":2,"q":"毎回同じ前提(会社の事業内容、文体ルール、禁止表現)を説明するのが手間になっている。効率と一貫性を高める方法として適切なものはどれか。2つ選べ。","qz":"每次都要说明同样的前提（公司业务、文体规则、禁用表达）很麻烦。以下哪些方法能提高效率和一致性？请选择 2 项。","o":[{"j":"毎回前提を省略し、Claudeに推測させる","z":"每次省略前提，让 Claude 自己推测"},{"j":"文体ルールや禁止表現をまとめた資料をプロジェクトナレッジとして登録する","z":"把文体规则和禁用表达整理成资料，登记为项目知识"},{"j":"前提をメモ帳に保存し、必要と感じたときだけ貼る","z":"把前提存在记事本里，觉得需要时才贴"},{"j":"前提をすべて1つのチャットに書き、そのチャットを何か月も使い続ける","z":"把前提全写在一个对话里，几个月一直用这个对话"},{"j":"Projectを作成し、共通の前提をプロジェクト指示に記載する","z":"创建 Project，把共同前提写入项目指示"}],"a":[1,4],"e":"反复使用的前提应放入 Project 的指示和知识中，所有对话自动共享，既省事又一致。省略前提靠猜会降低质量；一个对话用几个月会撑满上下文、质量下降；偶尔手动粘贴容易遗漏、不一致。","ej":"繰り返す前提はProjectの指示・ナレッジに置く。"},{"id":"d1-034","d":1,"t":"1.1","n":1,"q":"次のうち、プロンプトに「なぜその指示が必要か(理由)」を添えることの効果として最も適切なものはどれか。","qz":"以下哪一项最恰当地说明了在提示词中附上“为什么需要这个指示（理由）”的效果？","o":[{"j":"Claudeの応答速度が上がる","z":"Claude 的响应速度提高"},{"j":"理由を書くとClaudeがその理由を議論し始め、肝心の指示そのものが無視されやすくなる","z":"写了理由后 Claude 会开始讨论理由，关键的指示本身反而容易被忽视"},{"j":"Claudeが指示の意図を理解し、明記されていない状況でも適切に判断しやすくなる","z":"Claude 能理解指示的意图，即使在未写明的情况下也更容易做出恰当判断"},{"j":"出力が必ず短くなる","z":"输出一定变短"}],"a":[2],"e":"说明理由（例如“读者是视力较弱的高龄者，所以要用大字和短句”）能让 Claude 理解背后的目的，从而在未明确规定的地方也能做出符合意图的判断。它与速度、输出长度无关，也不会让指示被忽视。","ej":"指示に理由を添えると意図が伝わり、応用の効く出力になる。"},{"id":"d1-008","d":1,"t":"1.2","n":1,"q":"プロジェクトマネージャーが、競合5社の調査・比較表作成・経営層向け提言の作成を、1回の長いプロンプトでまとめて依頼したところ、どれも浅い内容になった。最も適切な進め方はどれか。","qz":"项目经理用一个很长的提示词同时请求调查 5 家竞争对手、制作对比表、撰写面向管理层的建议，结果每部分都很浅。最合适的做法是哪一个？","o":[{"j":"同じプロンプトに「詳しく」と付け加えて再送する","z":"在同一提示词中加上“详细一点”后重新发送"},{"j":"調査→比較表→提言と段階に分け、各ステップの出力を確認してから次へ渡す","z":"分成调查→对比表→建议几个阶段，确认每一步的输出后再交给下一步"},{"j":"提言だけを依頼し、調査と比較は省略する","z":"只请求建议，省略调查和对比"},{"j":"対象を5社から10社に増やし、情報量を増やした上で、同じプロンプトでもう一度まとめて依頼する","z":"把对象从 5 家增加到 10 家，增加信息量后，用同样的提示词再次一并请求"}],"a":[1],"e":"复杂任务应拆解为多个步骤（提示链），每一步专注一个子任务，并在中间检查结果，最终质量更高、出错时也易于定位。只加“详细”无法解决任务过载；省略前置步骤会让建议缺乏依据；增加公司数只会更浅。","ej":"複雑な依頼は段階に分け、中間結果を確認しながら進める(プロンプトチェーン)。"},{"id":"d1-009","d":1,"t":"1.2","n":1,"q":"タスク分解を行う主な利点として最も適切なものはどれか。","qz":"进行任务拆解的主要好处中，最恰当的是哪一个？","o":[{"j":"人によるレビューが一切不要になる","z":"完全不需要人工审核"},{"j":"どんなに複雑な依頼でも、必ず1回のやり取りで完了するようになり、確認の手間がなくなる","z":"无论多复杂的请求都一定能在一次交互中完成，省去确认的工夫"},{"j":"各ステップに集中させることで精度が上がり、問題のある段階を特定・修正しやすくなる","z":"让每一步专注，提高精度，并且更容易定位和修正有问题的环节"},{"j":"プロンプトに背景情報を書く必要がなくなる","z":"提示词中不再需要写背景信息"}],"a":[2],"e":"任务拆解的价值在于：每一步更专注、更准确，且中间产物可检查，出问题时只需修正那一步。它不会免除人工审核，交互次数通常反而增加，也仍然需要背景信息。","ej":"分解の利点＝精度向上と問題箇所の特定のしやすさ。"},{"id":"d1-010","d":1,"t":"1.2","n":1,"q":"顧客アンケートの自由記述300件を分析し、改善提案をまとめたい。分解の順序として最も合理的なものはどれか。","qz":"想分析 300 条客户问卷的自由填写内容，并汇总改进建议。最合理的拆解顺序是哪一个？","o":[{"j":"改善提案を先に作り、それに合うコメントを探す","z":"先写改进建议，再找符合建议的评论"},{"j":"300件をそのまま貼り、提案だけを出させる","z":"直接贴上 300 条，只让它输出建议"},{"j":"300件の中からランダムに20件だけを選び、その20件の内容に基づいて全体の改善提案を作成させる","z":"从 300 条中随机只选 20 条，基于这 20 条内容制定整体改进建议"},{"j":"テーマ分類→テーマごとの件数と代表的な声の抽出→優先度づけ→改善提案","z":"主题分类→提取各主题数量与代表性意见→排定优先级→提出改进建议"}],"a":[3],"e":"先分类、再量化和提取证据、再排序、最后提建议，是从数据到结论的合理链条，每一步都可验证。先有结论再找证据会产生偏差；一次性只要建议难以核对依据；随机抽 20 条代表性不足。","ej":"データ→分類→根拠抽出→優先度→提案の順で分解する。"},{"id":"d1-011","d":1,"t":"1.2","n":2,"q":"新しい社内研修プログラムの企画書をClaudeと作成する。タスク分解の進め方として適切なものはどれか。2つ選べ。","qz":"要和 Claude 一起制作新的内部培训项目企划书。以下哪些是合适的任务拆解方式？请选择 2 项。","o":[{"j":"最初の依頼で完成版の企画書全文を出させ、以降は修正しない","z":"第一次请求就输出完整企划书，之后不再修改"},{"j":"各ステップを別の人に依頼し、Claudeは使わない","z":"把每个步骤交给不同的人，不使用 Claude"},{"j":"構成案が固まった後、章ごとに本文を作成させる","z":"结构方案确定后，再按章节分别撰写正文"},{"j":"分解すると時間がかかるため、すべての段階を同時に依頼する","z":"拆解太费时，所以所有阶段同时请求"},{"j":"まず目的・対象者・制約を整理させ、内容を確認してから構成案を作らせる","z":"先让它整理目的、对象和约束条件，确认后再让它做结构方案"}],"a":[2,4],"e":"先整理需求并确认，再出结构，再按章节写正文，是典型的分阶段推进，每步都有检查点。一次性定稿、完全不用 Claude、全部同时请求都失去了拆解的意义。","ej":"要件整理→構成→章ごとの本文、と確認しながら進める。"},{"id":"d1-012","d":1,"t":"1.2","n":1,"q":"長い報告書の要約を依頼するとき、Claudeに重要な引用箇所を先に抜き出させてから要約させる手法の主な目的はどれか。","qz":"请求总结长篇报告时，先让 Claude 抽取重要引用段落、再进行总结，这种方法的主要目的是什么？","o":[{"j":"根拠となる記述に基づいた要約にし、内容の取り違えを減らすため","z":"让总结基于有依据的原文，减少理解错误"},{"j":"出力全体を長くして見栄えを良くし、報告書をしっかり読み込んだ印象を読み手に与えるため","z":"让整体输出更长更好看，给读者留下认真读过报告的印象"},{"j":"Claudeの処理を速くするため","z":"让 Claude 处理更快"},{"j":"要約の作業を人が行う必要をなくすため","z":"让人不再需要参与总结工作"}],"a":[0],"e":"先抽取相关引文再作答（quote extraction），能把回答锚定在原文依据上，减少幻觉和误读，也方便人工核对。它通常会让输出更长、处理更慢，也不能取代人工确认。","ej":"先に引用を抜き出させる→根拠に基づく回答になる。"},{"id":"d1-013","d":1,"t":"1.2","n":1,"q":"複雑な判断を伴う依頼で、Claudeに「結論を出す前に、考慮すべき点を順に整理してから回答して」と指示した。この指示の効果として最も適切なものはどれか。","qz":"在需要复杂判断的请求中，指示 Claude“在得出结论前，先按顺序整理需要考虑的点再回答”。该指示的效果中最恰当的是哪一个？","o":[{"j":"回答が必ず正しくなることが保証される","z":"保证回答一定正确"},{"j":"段階的に考えさせることで、複雑な問題での推論の質が上がりやすい","z":"让它分步骤思考，复杂问题上的推理质量更容易提高"},{"j":"出力が短くなり、コストが下がる","z":"输出变短，成本降低"},{"j":"資料を添付しなくても、Claudeが段階的に考えることで最新の情報を自ら得られるようになる","z":"即使不附资料，Claude 通过分步思考也能自己获取最新信息"}],"a":[1],"e":"让模型分步骤思考（思维链）通常能提高复杂推理的质量，但不能保证正确，仍需验证。它往往使输出更长，也与获取最新信息无关。","ej":"段階的に考えさせると複雑な推論の質が上がる(正しさの保証ではない)。"},{"id":"d1-027","d":1,"t":"1.2","n":1,"q":"100ページの調査報告書から、部門ごとに必要な情報をまとめた資料を5種類作りたい。最も効率的で品質を保てる進め方はどれか。","qz":"想从 100 页的调查报告中，为各部门分别整理所需信息，共做 5 种资料。最高效且能保证质量的做法是哪一个？","o":[{"j":"5種類を1回の依頼でまとめて作らせる","z":"一次请求同时做 5 种资料"},{"j":"報告書は読ませずに、部門名だけで資料を作らせる","z":"不让它读报告，只凭部门名称做资料"},{"j":"まず報告書全体の要点と構成を抽出させ確認し、それを基に部門ごとに1種類ずつ作成させる","z":"先让它提取整份报告的要点和结构并确认，再以此为基础按部门逐一制作"},{"j":"報告書をページ数で5つに機械的に分割し、それぞれの部分から1種類ずつ資料を作らせる","z":"把报告按页数机械地分成 5 份，每份分别做一种资料"}],"a":[2],"e":"先抽取共同的要点底稿并人工确认，再为每个部门分别生成，既复用了中间结果，又让每次生成专注。一次做 5 种容易浅且混淆；不读报告会凭空编写；机械地按页数切分会让部门所需信息分散缺失。","ej":"共通の中間成果物を作って確認→それを基に個別に展開。"},{"id":"d1-031","d":1,"t":"1.2","n":1,"q":"Claudeにイベント運営計画を作らせたところ、抜け漏れが多かった。タスク分解の観点から最も有効な改善はどれか。","qz":"让 Claude 制定活动运营计划，结果遗漏很多。从任务拆解角度看，最有效的改进是哪一个？","o":[{"j":"「抜け漏れのないように」と一文追加する","z":"加一句“不要有遗漏”"},{"j":"計画作成をやめ、インターネットで公開されている一般的なイベント運営チェックリストを探して使う","z":"不再制定计划，在网上找公开的一般活动运营检查清单来用"},{"j":"まず必要な作業領域(会場・集客・当日運営・予算など)を洗い出させて確認し、領域ごとに詳細タスクを作らせる","z":"先让它列出所需工作领域（场地、招募、当天运营、预算等）并确认，再按领域制定详细任务"},{"j":"より長い文章で計画を書かせる","z":"让它用更长的文字写计划"}],"a":[2],"e":"先搭框架（工作领域）并确认覆盖面，再逐领域细化，是减少遗漏的结构化方法。只加“不要遗漏”效果有限；放弃计划不解决问题；写得更长不等于更全面。","ej":"抜け漏れ対策は、全体の枠組みを先に洗い出し→領域ごとに詳細化。"},{"id":"d1-035","d":1,"t":"1.2","n":2,"q":"Claudeを使って、新しい業務マニュアルを作成する。人が確認すべき「チェックポイント」を設けるべきタイミングとして適切なものはどれか。2つ選べ。","qz":"使用 Claude 编写新的业务手册。以下哪些时机适合设置由人确认的“检查点”？请选择 2 项。","o":[{"j":"手順や数値など、誤ると業務に影響する内容が完成した段階","z":"步骤、数值等一旦出错会影响业务的内容完成时"},{"j":"チェックは不要なので設けない","z":"不需要检查，不设置"},{"j":"Claudeが回答を始める前に、毎回一文字ずつ","z":"在 Claude 开始回答前，每次逐字检查"},{"j":"目次・構成案ができた段階(後工程の前提になるため)","z":"目录和结构方案完成时（因为它是后续工序的前提）"},{"j":"誤字を1つ見つけるたび","z":"每发现一个错别字时"}],"a":[0,3],"e":"检查点应设在“后续依赖它”的节点（如结构方案）和“出错影响大”的内容上（步骤、数值）。每个错字都停下来或逐字检查效率极低；完全不检查有风险。","ej":"チェックポイントは後工程の前提となる段階と、誤りの影響が大きい内容に置く。"},{"id":"d1-014","d":1,"t":"1.3","n":1,"q":"Claudeが作成したプレスリリース案は内容は正確だが、表現が硬すぎた。次に取るべき行動として最も適切なものはどれか。","qz":"Claude 写的新闻稿草案内容准确，但表达太生硬。下一步最合适的行动是哪一个？","o":[{"j":"最初から新しいチャットを開き、同じ依頼文で作り直させて、前回とは違う表現が出るのを待つ","z":"从头开一个新对话，用同样的请求重新生成，等待出现与上次不同的表达"},{"j":"内容は正確なので、そのまま公開する","z":"内容准确，直接发布"},{"j":"内容は維持したまま、どの部分をどんなトーンに変えたいかを具体的に伝えて修正させる","z":"保持内容不变，具体说明哪些部分要改成什么语气，让它修改"},{"j":"別のAIツールで書き直す","z":"用其他 AI 工具重写"}],"a":[2],"e":"迭代改进的要点是：保留好的部分，具体指出要改什么、改成什么样。从头重来会丢掉已经正确的内容；直接发布没有解决问题；换工具无必要。","ej":"良い部分は残し、変えたい点を具体的にフィードバックする。"},{"id":"d1-015","d":1,"t":"1.3","n":1,"q":"プロンプトを改善する反復(イテレーション)の進め方として最も適切なものはどれか。","qz":"关于改进提示词的迭代方式，最合适的是哪一个？","o":[{"j":"毎回プロンプトを全面的に書き換え、気になる点を複数同時に変えて、なるべく早く結論を出す","z":"每次全面重写提示词，同时修改多个在意的地方，尽快得出结论"},{"j":"一度うまくいかなければ、そのタスクにはClaudeを使わない","z":"一次不成功就不再用 Claude 做这项任务"},{"j":"出力を見ずに、プロンプトを長くし続ける","z":"不看输出，只是不断加长提示词"},{"j":"出力のどこが期待とずれたかを特定し、原因に対応する部分を修正して結果を比較する","z":"找出输出哪里与期望不符，修改与原因对应的部分，并比较结果"}],"a":[3],"e":"有效的迭代是：识别差距→推测原因→有针对性地修改→比较结果。同时改很多处就不知道是哪项改动起效；一次失败就放弃太早；不看输出盲目加长没有依据。","ej":"ずれを特定→原因に対応した修正→結果比較、を繰り返す。"},{"id":"d1-016","d":1,"t":"1.3","n":2,"q":"Claudeの議事録要約が、決定事項と単なる意見を区別できていなかった。プロンプトの改善として有効なものはどれか。2つ選べ。","qz":"Claude 的会议纪要总结没有区分决定事项和单纯意见。以下哪些提示词改进是有效的？请选择 2 项。","o":[{"j":"議事録を貼らずに会議名だけ伝える","z":"不贴纪要，只告诉会议名称"},{"j":"要約の文字数を半分にする","z":"把总结字数减半"},{"j":"「決定事項」「ToDo(担当・期限)」「議論中の意見」に分けて出力するよう形式を指定する","z":"指定输出格式，分为“决定事项”“待办（负责人、期限）”“讨论中的意见”"},{"j":"決定事項の判断基準(例:「〜で合意」「〜に決定」と発言されたもの)を定義する","z":"定义决定事项的判断标准（例如有“达成一致”“决定为”等发言的）"},{"j":"丁寧語で書くよう指示する","z":"指示使用敬语书写"}],"a":[2,3],"e":"区分不清是因为缺少分类结构和判断标准，所以应指定分类格式并定义“什么算决定事项”。缩短字数、只给会议名、改为敬语都没有解决分类问题。","ej":"区別させたいなら、出力の分類形式と判断基準を明示する。"},{"id":"d1-017","d":1,"t":"1.3","n":1,"q":"同じ種類の依頼(毎月の売上レポートのコメント作成)を繰り返し行っている。何度も修正を重ねてうまくいったプロンプトの扱いとして最も適切なものはどれか。","qz":"同一类请求（每月销售报告的评论撰写）反复进行。经过多次修改后效果良好的提示词，最合适的处理方式是哪一个？","o":[{"j":"毎月ゼロから新しく書き直す","z":"每月从零开始重新写"},{"j":"テンプレートとして保存し、Projectの指示などで再利用し、必要に応じて改訂する","z":"保存为模板，通过 Project 指示等方式复用，并根据需要修订"},{"j":"一度うまくいったプロンプトなので、業務や対象が変わっても今後一切変更せずに使い続ける","z":"既然效果好，即使业务或对象变化，今后也绝不修改，一直使用"},{"j":"上手くいった理由がわからないので破棄する","z":"不知道为什么效果好，所以丢弃"}],"a":[1],"e":"把验证过的提示词模板化并复用（例如放进 Project 指示），可提高效率和一致性；但业务和模型都会变化，应适时修订。每次重写浪费；永不修改会过时；丢弃不合理。","ej":"うまくいったプロンプトはテンプレート化して再利用・改訂する。"},{"id":"d1-018","d":1,"t":"1.3","n":1,"q":"Claudeの出力に対してフィードバックを与える方法として、最も効果的なものはどれか。","qz":"对 Claude 的输出给出反馈时，最有效的方法是哪一个？","o":[{"j":"「良くない」とだけ伝える","z":"只说“不好”"},{"j":"何も言わずに再生成ボタンを押し続け、偶然よい出力が出たらそれを採用する","z":"什么都不说，一直按重新生成，碰巧出了好结果就采用"},{"j":"「第2段落は数字の根拠が不明確。出典を示し、3文以内にまとめて」のように具体的に伝える","z":"具体说明，例如“第 2 段数字依据不明确，请标明出处，并压缩到 3 句以内”"},{"j":"「あなたは能力が低いので、もっと真剣に取り組んでください」と厳しく叱責して書き直させる","z":"严厉责备“你能力太差，请更认真地对待”，让它重写"}],"a":[2],"e":"具体、可执行的反馈（指出位置、问题和期望结果）最能引导改进。笼统的“不好”、无限重生成、责备都不提供可用的信息。","ej":"フィードバックは場所・問題・期待結果を具体的に。"},{"id":"d1-028","d":1,"t":"1.3","n":1,"q":"同じプロンプトを使っても、日によってClaudeの出力の細部が異なる。業務で一定の品質を保つための考え方として最も適切なものはどれか。","qz":"即使使用同样的提示词，Claude 输出的细节每天也有所不同。为了在业务中保持稳定质量，最合适的思路是哪一个？","o":[{"j":"出力が変わるのは故障なので、利用を中止する","z":"输出变化是故障，所以停止使用"},{"j":"形式・必須項目・例を明確にし、確認すべきチェック項目を決めて出力をレビューする","z":"明确格式、必填项和示例，确定检查项目并审核输出"},{"j":"毎回まったく同じ出力が得られるまで再生成を繰り返し、一致した出力だけを採用する","z":"反复重新生成，直到每次输出完全一致，只采用一致的输出"},{"j":"出力の違いは気にせず、毎回そのまま使う","z":"不在意输出差异，每次直接使用"}],"a":[1],"e":"生成式 AI 的输出天然有一定差异，这不是故障。通过明确格式、必填项和示例来缩小波动，并用检查清单审核，是保持质量的现实方法。追求完全一致不现实；不检查直接用有风险。","ej":"出力のばらつきは前提。形式・例で揺れを抑え、チェック項目でレビュー。"},{"id":"d1-032","d":1,"t":"1.3","n":1,"q":"Claudeに作成させた社内報の記事について、上司から「もう少し具体例がほしい」とコメントがあった。最も適切な対応はどれか。","qz":"上司对 Claude 写的内部刊物文章评论说“希望多一些具体例子”。最合适的应对是哪一个？","o":[{"j":"上司のコメントと、使える具体例の素材(社内事例など)をClaudeに渡し、該当箇所に例を追加させる","z":"把上司的评论和可用的具体例子素材（内部案例等）交给 Claude，让它在相应位置补充例子"},{"j":"Claudeに、社内で実際にありそうな架空の事例を自由に作らせ、それらしい具体例として記事に追加する","z":"让 Claude 自由编造公司内部可能存在的虚构案例，作为像样的具体例子加入文章"},{"j":"コメントを反映するため、記事全体を最初から書き直させ、構成も表現もすべて新しくする","z":"为了反映评论，让它从头重写整篇文章，结构和表达全部换新"},{"j":"コメントを無視してそのまま掲載する","z":"无视评论直接刊登"}],"a":[0],"e":"把反馈和真实素材一起交给 Claude，让它针对性修改，是基于反馈的高效迭代。让它编造内部案例会产生虚假信息；全文重写浪费；无视反馈不可取。","ej":"フィードバックと事実素材を渡して該当箇所を修正させる。架空の事例は作らせない。"},{"id":"d1-019","d":1,"t":"1.4","n":1,"q":"新サービスの名称案を出すブレインストーミングにClaudeを使う。プロンプトの方針として最も適切なものはどれか。","qz":"用 Claude 进行新服务名称的头脑风暴。提示词的方针中最合适的是哪一个？","o":[{"j":"多様な案を多数出させ、方向性ごとに分類させた上で、評価は後の段階で行う","z":"让它提出大量多样的方案并按方向分类，评估放到后面的阶段"},{"j":"最初から最も良い1案だけを出させる","z":"一开始就只让它给出最好的 1 个方案"},{"j":"事実確認のため、Web検索で既存の名称だけを調べさせる","z":"为了核实事实，只让它用网络搜索调查已有名称"},{"j":"厳密な形式の表で、各案の市場性を示す統計データと出典を付けて、最初から順位づけして出させる","z":"用严格格式的表格，附上显示各方案市场性的统计数据和出处，一开始就排序输出"}],"a":[0],"e":"头脑风暴的目标是“发散”：先求数量和多样性，再收敛评估。一开始只要 1 个最佳方案会限制创意；只查现有名称不是创意任务；要求统计依据与命名创意不匹配。","ej":"ブレストは「発散→分類→評価」。最初から絞り込まない。"},{"id":"d1-020","d":1,"t":"1.4","n":1,"q":"市場規模の推計など、分析タスクでClaudeを使う場合に特に重要なプロンプトの要素はどれか。","qz":"在市场规模估算等分析任务中使用 Claude 时，提示词中特别重要的要素是哪一个？","o":[{"j":"前提や制約にとらわれず、自由で創造的な発想を促し、できるだけ多くの可能性を挙げさせること","z":"不拘泥于前提和约束，鼓励自由创意，尽可能多地列出可能性"},{"j":"感情に訴える表現を使うよう求めること","z":"要求使用诉诸情感的表达"},{"j":"できるだけ短い回答を求めること","z":"要求尽可能简短的回答"},{"j":"前提条件・使用データ・計算過程を明示させ、仮定と事実を区別させること","z":"让它明确前提条件、使用的数据和计算过程，并区分假设与事实"}],"a":[3],"e":"分析类任务要求可追溯、可验证：前提、数据来源和推导过程都要摆出来，并区分假设和事实，方便检查和修正。创意发散、情感表达和过度简短都不适合分析任务。","ej":"分析タスクは前提・データ・計算過程を明示し、仮定と事実を分ける。"},{"id":"d1-021","d":1,"t":"1.4","n":1,"q":"業界の最新動向について調査したい。Claudeを使った調査タスクの進め方として最も適切なものはどれか。","qz":"想调查行业最新动态。使用 Claude 进行调研任务时，最合适的做法是哪一个？","o":[{"j":"Web検索やResearch機能を使い、出典付きで情報を集めさせ、重要な点は出典を確認する","z":"使用网络搜索或 Research 功能，让它带出处收集信息，并对重点内容核对出处"},{"j":"検索機能は使わず、Claudeが学習した幅広い知識をもとに、最新動向を網羅的に答えさせる","z":"不使用搜索功能，基于 Claude 学到的广泛知识，全面回答最新动态"},{"j":"出典は不要なので、結論だけを求める","z":"不需要出处，只要结论"},{"j":"ブレスト用のプロンプトを使い、自由に予想させる","z":"使用头脑风暴提示词，让它自由预测"}],"a":[0],"e":"调研最新信息应使用网络搜索/Research 获取带出处的信息，并抽查关键出处。仅靠训练知识可能过时；不要出处无法验证；自由预测不是调研。","ej":"最新情報の調査は検索/Researchで出典付き＋重要点は出典確認。"},{"id":"d1-022","d":1,"t":"1.4","n":1,"q":"顧客向けのお詫びメールの起草をClaudeに依頼する。起草タスクとして最も重要な指定はどれか。","qz":"请 Claude 起草一封给客户的道歉邮件。作为起草任务，最重要的指定是哪一个？","o":[{"j":"統計的な根拠を必ず含めること","z":"必须包含统计依据"},{"j":"相手、経緯、伝えるべき事実と対応策、トーン、長さを指定すること","z":"指定对象、经过、需要传达的事实和对策、语气和长度"},{"j":"できるだけ多くの案を出させること","z":"让它尽可能多地提出方案"},{"j":"Web検索で他社のお詫び文の事例を幅広く探させ、最も評判の良い文面をそのまま流用させる","z":"用网络搜索广泛查找其他公司的道歉文案例，直接套用评价最好的文案"}],"a":[1],"e":"起草类任务需要清楚的“写给谁、为什么写、要说什么、用什么语气、多长”。统计依据与道歉邮件无关；大量方案属于头脑风暴；搜索他人道歉文不能替代本次的具体事实。","ej":"起草は相手・経緯・伝える事実・トーン・長さを指定する。"},{"id":"d1-023","d":1,"t":"1.4","n":2,"q":"タスクの種類と、それに適したプロンプト戦略の組み合わせとして適切なものはどれか。2つ選べ。","qz":"以下任务类型与适合的提示词策略的组合中，哪些是恰当的？请选择 2 项。","o":[{"j":"調査:出典の提示を求め、情報の日付や信頼性を確認する","z":"调研：要求给出出处，并确认信息的日期和可靠性"},{"j":"ブレスト:最初から実現可能性で厳しく絞り込ませる","z":"头脑风暴：一开始就按可行性严格筛选"},{"j":"分析:結論だけを短く出させ、過程は省略させる","z":"分析：只让它简短给出结论，省略过程"},{"j":"調査:検索を使わず、記憶だけで回答させる","z":"调研：不使用搜索，只凭记忆回答"},{"j":"起草:読み手・目的・トーンを指定し、下書きを反復して磨く","z":"起草：指定读者、目的和语气，反复打磨草稿"}],"a":[0,4],"e":"调研要重视出处、日期和可信度；起草要明确读者、目的和语气并迭代打磨。分析省略过程无法验证；头脑风暴一开始就严格筛选会扼杀创意；调研只靠记忆会过时。","ej":"調査＝出典と日付、起草＝読み手・目的・トーン＋反復。"},{"id":"d1-024","d":1,"t":"1.4","n":1,"q":"経営会議用に、複数の選択肢(A案・B案・C案)のメリット・デメリットを比較したい。プロンプトの工夫として最も適切なものはどれか。","qz":"想为经营会议比较多个选项（A、B、C 方案）的优缺点。提示词的做法中最合适的是哪一个？","o":[{"j":"「どれが一番良いか一言で」とだけ聞く","z":"只问“一句话说哪个最好”"},{"j":"最初に「B案が良いと考えている」と伝えたうえで、その理由を補強する観点から3案を比較させる","z":"先告诉它“我认为 B 方案好”，再从强化该理由的角度比较 3 个方案"},{"j":"評価軸(コスト・期間・リスク等)を指定し、表形式で同じ軸で比較させる","z":"指定评价维度（成本、周期、风险等），让它用表格按同一维度比较"},{"j":"比較は不要なので、各案の説明を長文で書かせる","z":"不需要比较，让它对每个方案写长篇说明"}],"a":[2],"e":"比较任务应先定义统一的评价维度，再用表格并排对比，便于决策。只要一句结论缺乏依据；先给出倾向会诱导偏向（迎合）；只写长篇说明不利于比较。","ej":"比較は評価軸を決めて表形式で。先に自分の結論を示すと誘導になる。"},{"id":"d1-029","d":1,"t":"1.4","n":1,"q":"技術的な内容を、専門知識のない顧客向けに説明する文章をClaudeに作らせる。プロンプトとして最も適切なものはどれか。","qz":"让 Claude 把技术性内容写成面向没有专业知识客户的说明文字。最合适的提示词是哪一个？","o":[{"j":"「正確さが最優先なので、専門用語をできるだけ多く使い、技術的な詳細も省略せずに説明して」","z":"“准确最优先，尽量多用专业术语，技术细节也不要省略地说明”"},{"j":"技術者向けに作られた詳細な資料をそのまま渡し、専門用語や構成は変えずに全体を短く要約させる","z":"直接交出为技术人员制作的详细资料，不改专业术语和结构，只让它整体简短总结"},{"j":"「短く一行で」","z":"“简短一行”"},{"j":"「読者はITの専門知識がない顧客。専門用語は避けるか平易に言い換え、身近な例えを1つ入れて、A4半分程度で」","z":"“读者是没有 IT 专业知识的客户。避免专业术语或改用通俗说法，加入一个贴近生活的比喻，篇幅约半张 A4”"}],"a":[3],"e":"面向非专业读者，需要明确读者画像、用词要求、表达手段（比喻）和篇幅。堆砌术语、直接总结技术资料、只写一行都不符合读者需求。","ej":"読み手を明示し、用語の扱い・例え・分量を指定する。"},{"id":"d1-033","d":1,"t":"1.4","n":1,"q":"スプレッドシートの売上データから傾向を読み取りたい。Claudeへの依頼として最も適切なものはどれか。","qz":"想从电子表格的销售数据中读出趋势。向 Claude 提出的请求中最合适的是哪一个？","o":[{"j":"データは添付せず、「売上の傾向を教えて」と聞く","z":"不附数据，问“告诉我销售趋势”"},{"j":"ファイルを添付し、分析の目的・見たい切り口(月別・地域別など)・出力形式(表・グラフ)を指定する","z":"附上文件，指定分析目的、想看的维度（按月、按地区等）和输出形式（表格、图表）"},{"j":"データの一部の数値を記憶から入力して分析させる","z":"凭记忆输入部分数值让它分析"},{"j":"データは添付せず、「当社の売上で何か面白い発見をして、意外な傾向を教えて」とだけ依頼する","z":"不附数据，只请求“从我们公司的销售中找出有趣的发现，告诉我意外的趋势”"}],"a":[1],"e":"数据分析需要真实数据，加上明确目的、分析维度和输出形式，结果才有用、可核对。不附数据只能得到泛泛之谈；凭记忆输入易错；“找有趣发现”目的不明。","ej":"データ分析は実データ＋目的・切り口・出力形式を指定。"},{"id":"d2-001","d":2,"t":"2.1","n":1,"q":"営業担当者がClaudeに、30ページの顧客提案書の要約を依頼した。要約は読みやすいが、提案書に含まれる価格条件と契約期間について一切触れていない。この要約を評価する観点として最も適切なものはどれか。","qz":"一名销售人员请 Claude 总结一份 30 页的客户提案书。摘要读起来很流畅，但完全没有提到提案书中的价格条件和合同期限。评价这份摘要时，最恰当的视角是哪一项？","o":[{"j":"文章が流暢なので、要約として十分な品質であると判断する。","z":"文字流畅，因此判断其作为摘要质量已经足够。"},{"j":"完全性の観点から、目的上重要な情報が欠落していないかを確認し、不足箇所を補うよう再依頼する。","z":"从完整性角度确认是否遗漏了对目的而言重要的信息，并要求补充缺失部分。"},{"j":"要約は短いほど良いため、価格や期間の省略は望ましい。","z":"摘要越短越好，因此省略价格和期限是可取的。"},{"j":"Claudeに自分の要約を10点満点で採点させ、8点以上であれば品質基準を満たしているとみなしてそのまま使う。","z":"让 Claude 给自己的摘要打分（满分10分），8分以上就视为达到质量标准并直接使用。"}],"a":[1],"e":"评价输出要同时看“正确性”和“完整性”。流畅≠完整，价格和期限对销售目的是关键信息，遗漏就是完整性缺陷，应明确指出并要求补充。A 只看文风；C 混淆了“简洁”和“遗漏关键信息”；D 自评分数不能作为质量依据。","ej":"流暢さ≠完全性。目的に必要な情報が揃っているかを確認する。"},{"id":"d2-002","d":2,"t":"2.1","n":1,"q":"マーケティング担当者が、自社製品の機能一覧を元資料としてClaudeに比較表を作らせた。出力を確認する最も効果的な方法はどれか。","qz":"一名市场人员以本公司产品功能列表为原始资料，让 Claude 制作对比表。确认输出时最有效的方法是哪一项？","o":[{"j":"表のレイアウトが整っているかを確認する。","z":"确认表格版式是否整齐。"},{"j":"Claudeに「この表は正確ですか」と質問し、「はい」と答えれば完了とする。","z":"问 Claude“这个表准确吗？”，如果回答“是”就算完成。"},{"j":"表の各項目を元資料と突き合わせ、記載の有無や数値が一致しているかを確認する。","z":"将表中的每一项与原始资料逐一核对，确认有无遗漏、数值是否一致。"},{"j":"別の担当者に見せ、見た目の印象を聞く。","z":"给另一位同事看，询问其对外观的印象。"}],"a":[2],"e":"有原始资料时，最可靠的验证是“与来源逐项对照（source grounding）”。B 让模型自我确认不可靠；A、D 只看形式与印象，不能验证内容正确性。","ej":"元資料がある場合は、出力を元資料と突き合わせて検証する。"},{"id":"d2-003","d":2,"t":"2.1","n":1,"q":"人事担当者が、社内アンケート500件の自由記述をClaudeに分析させ、「主な不満は3つ」という結果を得た。結論を経営会議に出す前に、まず行うべきこととして最も適切なものはどれか。","qz":"一名人事负责人让 Claude 分析 500 份内部问卷的自由填写内容，得到“主要不满有 3 项”的结果。在将结论提交经营会议之前，首先应做的最恰当的事是哪一项？","o":[{"j":"各不満カテゴリについて代表的な回答の原文と件数を示させ、一部をサンプルで原データと照合する。","z":"让 Claude 列出每个不满类别的代表性原文回答及件数，并抽样与原始数据核对。"},{"j":"3つという数が覚えやすいので、そのまま報告する。","z":"3 项这个数字好记，直接汇报。"},{"j":"同じ質問を再度投げ、2回とも同じ3つの不満が挙がれば、分析は正確で再現性もあると判断して報告する。","z":"再问一遍同样的问题，如果两次都列出相同的3项不满，就判断分析准确且可复现，然后汇报。"},{"j":"分析結果の文章をより説得力のある表現に書き換える。","z":"把分析结果改写成更有说服力的表述。"}],"a":[0],"e":"对大量数据的归纳结论，应要求提供依据（原文引用、件数），再抽样核对原始数据，以检查是否有遗漏类别或数量偏差。C 一致性不等于正确性（可能每次都同样错）；B、D 没有验证。","ej":"結論には根拠（引用・件数）を出させ、サンプルで原データと照合する。"},{"id":"d2-004","d":2,"t":"2.1","n":1,"q":"Claudeに議事録から「決定事項」と「宿題（担当者・期限）」を抽出させた。出力では一部の宿題に担当者が書かれていない。最も適切な対応はどれか。","qz":"让 Claude 从会议记录中提取“决定事项”和“待办事项（负责人・期限）”。输出中部分待办事项没有写负责人。最恰当的应对是哪一项？","o":[{"j":"議事録の文脈から最も可能性の高い担当者をClaudeに推測させ、空欄をすべて埋めた状態で共有する。","z":"让 Claude 根据会议记录的上下文推测最可能的负责人，把空栏全部填满后再共享。"},{"j":"担当者欄が空の項目をそのまま削除する。","z":"直接删除负责人为空的条目。"},{"j":"出力形式が崩れていないので問題ないと判断する。","z":"输出格式没有乱，因此判断没有问题。"},{"j":"議事録に担当者の記載があるか確認し、記載がなければ「未定」と明示させ、関係者に確認する。","z":"确认会议记录中是否写有负责人；若没有，让 Claude 明确标注“未定”，并向相关人员确认。"}],"a":[3],"e":"信息缺失时，应先回到原文确认；原文确实没有就明确标为“未定/不明”，而不是让模型猜测（会制造幻觉）或删除（会丢失信息）。这既保证正确性也保证完整性。","ej":"不明な情報は推測させず「未定・不明」と明示させる。"},{"id":"d2-005","d":2,"t":"2.1","n":2,"q":"Claudeが作成した新サービスの市場調査レポートを評価する際、正確性と完全性を確認する方法として適切なものを2つ選べ。","qz":"评估 Claude 制作的新服务市场调研报告时，作为确认正确性与完整性的方法，请选出 2 项恰当的做法。","o":[{"j":"レポートに記載された統計値や出典を、一次情報で確認する。","z":"用一手资料确认报告中记载的统计数据和出处。"},{"j":"Claudeが自信を持った表現で書いている箇所は確認を省略する。","z":"Claude 以确信语气写的部分就省略确认。"},{"j":"レポートの文字数が十分に多いかを確認する。","z":"确认报告字数是否足够多。"},{"j":"依頼時に定めた調査項目（市場規模、競合、顧客層など）がすべて網羅されているかをチェックリストで確認する。","z":"用检查清单确认委托时设定的调研项目（市场规模、竞争对手、客户群等）是否全部覆盖。"},{"j":"見出しのデザインを統一する。","z":"统一标题的设计样式。"}],"a":[0,3],"e":"正确性：用一手资料核实数字与出处（A）。完整性：对照事先定义的要求逐项检查是否覆盖（D）。B 语气自信不代表正确；C 字数多不代表完整；E 只是格式。","ej":"正確性＝一次情報で検証、完全性＝要件チェックリストで網羅確認。"},{"id":"d2-006","d":2,"t":"2.1","n":1,"q":"経理担当者がClaudeに、添付した請求書データの合計金額を計算させた。業務上、金額の誤りは許されない。最も適切な進め方はどれか。","qz":"一名会计让 Claude 计算附件发票数据的合计金额。业务上不允许金额出错。最恰当的做法是哪一项？","o":[{"j":"Claudeに合計金額を計算させ、念のため「計算は正しいですか」と確認して肯定されればそのまま使用する。","z":"让 Claude 计算合计金额，为保险起见再问“计算正确吗？”，得到肯定就直接使用。"},{"j":"コード実行機能で計算させ、計算過程を確認したうえで、元データの件数や小計と照合する。","z":"用代码执行功能进行计算，确认计算过程后，再与原始数据的件数和小计核对。"},{"j":"より丁寧な口調で再度依頼する。","z":"用更礼貌的语气再请求一次。"},{"j":"金額計算はAIでは一切行わず、すべて手作業に戻す。","z":"金额计算完全不用 AI，全部回到手工处理。"}],"a":[1],"e":"精确计算应使用代码执行（分析工具）以获得可复现、可检查的过程，并与原始数据的件数/小计核对。A 语言模型直接“心算”可能出错；C 语气与准确性无关；D 过度反应，有可行的验证手段时没必要完全放弃。","ej":"正確な計算はコード実行で行い、過程と元データで検証する。"},{"id":"d2-007","d":2,"t":"2.1","n":1,"q":"Claudeに社内規程の改定案を作成させたところ、第3条では「申請期限は5営業日前」、第7条では「申請期限は3営業日前」と記載されていた。この状態を最も適切に表しているものはどれか。","qz":"让 Claude 起草公司规章修订案，结果第3条写着“申请期限为提前5个工作日”，第7条却写着“申请期限为提前3个工作日”。最能恰当描述这种状态的是哪一项？","o":[{"j":"文書内の不整合（矛盾）であり、どちらが正しいか元の方針を確認して統一する必要がある。","z":"这是文档内部的不一致（矛盾），需要确认原有方针中哪一个正确并加以统一。"},{"j":"両方の条文があれば柔軟に運用できるので問題ない。","z":"两个条文都在可以灵活运用，没有问题。"},{"j":"書式の問題なので、フォントをそろえれば解決する。","z":"这是格式问题，统一字体即可解决。"},{"j":"Claudeの出力では後に書かれた条文の方が最新の検討結果を反映しているので、第7条に合わせて統一する。","z":"Claude 的输出中后写的条文反映了最新讨论结果，因此统一为第7条。"}],"a":[0],"e":"同一输出内前后数值不一致属于“inconsistency（不一致）”，是评价输出时要识别的典型问题。应回到原始方针确认正确值并统一。D 没有依据；B、C 忽视了内容问题。","ej":"同一出力内の矛盾（不整合）は、元方針を確認して統一する。"},{"id":"d2-008","d":2,"t":"2.1","n":1,"q":"広報担当者が、Claudeにプレスリリースの英訳を依頼した。担当者は英語が得意ではない。翻訳の正確性を確認する方法として最も適切なものはどれか。","qz":"一名公关负责人请 Claude 把新闻稿翻译成英文。该负责人英语不太好。作为确认译文准确性的方法，最恰当的是哪一项？","o":[{"j":"翻訳文が長ければ正確だと判断する。","z":"译文越长就判断越准确。"},{"j":"Claudeに「この翻訳に誤りはありますか」と確認し、誤りがないと回答されれば、そのまま英語版として公開する。","z":"问 Claude“这份翻译有错误吗？”，若回答没有错误，就直接作为英文版发布。"},{"j":"固有名詞・数値・日付が原文と一致しているか確認し、対外公開前に英語に堪能な担当者のレビューを受ける。","z":"确认专有名词、数字、日期与原文一致，并在对外发布前请英语熟练的人员审阅。"},{"j":"翻訳は機械的な作業なので確認は不要である。","z":"翻译是机械性工作，不需要确认。"}],"a":[2],"e":"对外公开的内容属于高风险输出，自己无法充分判断时应请具备专业能力的人审核。同时可先自行核对专有名词、数字、日期等容易出错且可检查的部分。B 自我评价不可靠；A、D 没有依据。","ej":"対外公開物で自分が判断できない場合は、専門性のある人のレビューを入れる。"},{"id":"d2-009","d":2,"t":"2.1","n":1,"q":"Claudeに「競合3社の価格プランを比較して」と依頼したところ、2社分の情報しか記載されず、3社目は「情報が見つかりませんでした」と書かれていた。この出力について最も適切な評価はどれか。","qz":"请 Claude“比较3家竞争对手的价格方案”，结果只写了2家的信息，第3家写着“未找到信息”。对这个输出最恰当的评价是哪一项？","o":[{"j":"3社目の情報がないのは不完全なので、業界の一般的な価格帯から推定値をClaudeに埋めさせて表を完成させる。","z":"缺少第3家信息不完整，让 Claude 根据行业一般价格区间填入推测值来完成表格。"},{"j":"出力全体が信頼できないので破棄する。","z":"整个输出都不可信，予以丢弃。"},{"j":"3社目は存在しない会社だと結論づける。","z":"断定第3家公司不存在。"},{"j":"不明点を明示している点は適切であり、3社目は公式サイトなど別の情報源で補完する。","z":"明确标出不明之处是恰当的，第3家用官网等其他信息来源补充。"}],"a":[3],"e":"模型坦白“找不到”比编造数据更好，这是可信输出的表现。缺口应由人用其他可靠来源补充。A 让模型推测会诱发幻觉；B 过度反应；C 是无依据的推论。","ej":"「不明」と明示された箇所は、推測で埋めずに別の情報源で補う。"},{"id":"d2-010","d":2,"t":"2.2","n":1,"q":"法務部の担当者がClaudeに業界の判例をまとめさせたところ、判決日と事件番号付きの判例が5件挙げられた。そのうち1件は担当者が聞いたことのない判例だった。最も適切な対応はどれか。","qz":"法务部人员让 Claude 整理行业判例，列出了附有判决日期和案件编号的5个判例。其中1个是该人员从未听说过的。最恰当的应对是哪一项？","o":[{"j":"事件番号まで書かれているので実在すると判断する。","z":"连案件编号都写了，因此判断其真实存在。"},{"j":"Claudeに「この判例は本当に存在しますか」と聞き、「はい」なら採用する。","z":"问 Claude“这个判例真的存在吗？”，回答“是”就采用。"},{"j":"判例データベースなど公式の情報源で5件すべての実在と内容を確認する。","z":"通过判例数据库等官方信息源，确认全部5个判例的真实性和内容。"},{"j":"知らない1件だけ削除し、残りの4件はそのまま使う。","z":"只删除不认识的那1个，其余4个直接使用。"}],"a":[2],"e":"具体的编号、日期、引用看起来很“真”，但正是幻觉的典型形式（虚构引用）。必须通过官方数据库核实，而且要核实全部，而不只是可疑的那一个——熟悉的判例也可能内容被写错。B 自我确认不可靠。","ej":"番号・日付付きの具体的な引用ほど、全件を公式情報源で確認する。"},{"id":"d2-011","d":2,"t":"2.2","n":1,"q":"Claudeに自社の過去5年の売上推移を説明させたところ、提供していない年度の売上数値まで具体的に記載されていた。この現象として最も適切なものはどれか。","qz":"让 Claude 说明本公司过去5年的销售额走势，结果连没有提供的年度销售数字也被具体写了出来。对这种现象最恰当的描述是哪一项？","o":[{"j":"Claudeが社内データベースに自動接続して取得した正しい数値である。","z":"这是 Claude 自动连接公司内部数据库获取的正确数值。"},{"j":"もっともらしいが根拠のない情報を生成するハルシネーションの可能性が高い。","z":"这很可能是生成看似合理但没有依据的信息的幻觉。"},{"j":"Claudeは過去の会話をすべて記憶しているため、正確な数値である。","z":"Claude 记得所有过去的对话，因此是准确的数值。"},{"j":"出力形式の問題であり、内容の正確性には影響しない。","z":"这是输出格式的问题，不影响内容的准确性。"}],"a":[1],"e":"未提供数据却出现具体数字，是幻觉的典型信号。Claude 只能使用提供的资料、已连接并授权的工具或其训练知识；不会“自动”访问未连接的内部系统（A）。记忆功能也不等于记住一切（C）。","ej":"提供していないデータの具体的な数値はハルシネーションを疑う。"},{"id":"d2-012","d":2,"t":"2.2","n":1,"q":"採用担当者がClaudeに求人票の文案を作成させた。出力には「若くてエネルギッシュな方」「体力に自信のある男性歓迎」といった表現が含まれていた。最も適切な対応はどれか。","qz":"招聘负责人让 Claude 起草招聘启事。输出中包含“年轻有活力的人”“欢迎体力好的男性”等表述。最恰当的应对是哪一项？","o":[{"j":"年齢・性別に関するバイアスのある表現として修正し、職務要件に基づく中立的な表現に書き換える。","z":"将其视为带有年龄和性别偏见的表述加以修改，改写为基于职务要求的中立表述。"},{"j":"Claudeが作成したものなので、客観的で問題ないと判断する。","z":"因为是 Claude 写的，所以判断客观、没有问题。"},{"j":"表現はそのまま残し、「本求人は性別・年齢を問いません」という注意書きを末尾に追加して対応済みとする。","z":"保留原表述，在末尾加上“本招聘不限性别、年龄”的说明，视为已处理。"},{"j":"求人票の作成にはAIを使わないと決める。","z":"决定不再用 AI 撰写招聘启事。"}],"a":[0],"e":"AI 输出可能反映训练数据中的社会偏见。识别偏见并改为基于职务要求的中立表达，是使用者的责任。B 认为 AI 天然客观是误解；C 不解决问题；D 过度反应。","ej":"AIの出力にもバイアスは含まれる。人が検出し中立的に修正する。"},{"id":"d2-013","d":2,"t":"2.2","n":1,"q":"Claudeに「この業界の最新の規制動向」を質問したところ、Web検索を使わずに回答が返ってきた。回答には特定の施行日が記載されていた。最も注意すべき点はどれか。","qz":"向 Claude 询问“该行业最新的监管动向”，它没有使用网络搜索就给出了回答，回答中写有特定的施行日期。最需要注意的是哪一点？","o":[{"j":"回答が長文かどうか。","z":"回答是否够长。"},{"j":"回答の敬語が適切かどうか。","z":"回答的敬语是否恰当。"},{"j":"Claudeが回答に自信を示しているかどうか。自信があれば最新の情報を反映していると考えてよい。","z":"Claude 是否对回答表现出自信。如果有自信，可以认为反映了最新信息。"},{"j":"学習データの時点以降に変更がある可能性があり、最新の公式情報で施行日を確認する必要があること。","z":"在训练数据截止时间之后可能有变化，需要用最新的官方信息确认施行日期。"}],"a":[3],"e":"不使用网络搜索时，模型只依赖训练数据，存在“知识截止”问题，最新动向可能过时或被编造。应开启网络搜索并以官方最新信息核实。C 自信程度不代表正确。","ej":"最新情報は学習データの時点以降に変わり得る。Web検索や公式情報で確認。"},{"id":"d2-014","d":2,"t":"2.2","n":2,"q":"Claudeの出力にハルシネーションが含まれている可能性が高いサインとして、特に注意すべきものを2つ選べ。","qz":"作为 Claude 输出中很可能含有幻觉的信号，请选出 2 项特别需要注意的。","o":[{"j":"回答が箇条書きで整理されている。","z":"回答以要点形式整理。"},{"j":"実在を確認できないURLや論文タイトルが引用されている。","z":"引用了无法确认是否存在的 URL 或论文标题。"},{"j":"回答の冒頭で質問内容を言い換えて確認している。","z":"回答开头对问题内容进行了复述确认。"},{"j":"回答に「確認が必要です」という注意書きがある。","z":"回答中有“需要确认”的提示。"},{"j":"提供した資料に書かれていない具体的な数値や固有名詞が登場する。","z":"出现了所提供资料中没有写的具体数字或专有名词。"}],"a":[1,4],"e":"虚构的 URL/论文、以及来源中不存在的具体数字或专有名词，是幻觉的典型信号。A、C 是格式和沟通方式；D 提示需要确认反而是谨慎的表现，并非幻觉信号。","ej":"架空の出典・URL、資料にない具体的数値や固有名詞はハルシネーションのサイン。"},{"id":"d2-015","d":2,"t":"2.2","n":1,"q":"同じ質問をClaudeに2回したところ、1回目は「A案が優れている」、2回目は「B案が優れている」と異なる結論が返ってきた。最も適切な解釈と対応はどれか。","qz":"同一个问题问了 Claude 两次，第一次回答“A方案更好”，第二次回答“B方案更好”，结论不同。最恰当的理解和应对是哪一项？","o":[{"j":"2回目の回答が新しいので、B案を採用する。","z":"第二次的回答更新，因此采用B方案。"},{"j":"評価基準が明確でない可能性があるため、判断基準（コスト・期間・リスク等）を明示して比較させ、根拠を確認する。","z":"可能是评价标准不明确，因此明确判断标准（成本、周期、风险等）让其比较，并确认依据。"},{"j":"Claudeは不安定なので、比較検討には一切使わない。","z":"Claude 不稳定，因此比较研究完全不用它。"},{"j":"同じ質問を10回繰り返し、より多く選ばれた案を採用する。回数を重ねるほど結論の信頼性は高まるからである。","z":"同一问题重复问10次，采用被选次数更多的方案，因为次数越多结论越可靠。"}],"a":[1],"e":"结论摇摆通常说明问题缺乏明确的评价标准，或两个方案本就接近。应明确标准、要求给出依据，最终由人基于依据判断。A 没有依据；D 多数决不能保证正确；C 过度反应。","ej":"結論が揺れる場合は判断基準を明示し、根拠を比較させる。"},{"id":"d2-016","d":2,"t":"2.2","n":1,"q":"Claudeに顧客レビューの感情分析を依頼したところ、特定の地域の顧客のレビューだけが一貫して否定的に分類されていた。最も適切な対応はどれか。","qz":"请 Claude 对客户评论做情感分析，结果某一特定地区客户的评论一律被归类为负面。最恰当的应对是哪一项？","o":[{"j":"AIの分類は一貫しているので、その地域の顧客は不満が多いと結論づけ、地域別の改善施策を経営会議に提案する。","z":"AI 的分类是一致的，因此断定该地区客户不满较多，并向经营会议提出按地区的改进措施。"},{"j":"その地域のレビューを分析対象から除外する。","z":"将该地区的评论排除在分析对象之外。"},{"j":"方言や表現の違いによる分類の偏りの可能性を疑い、サンプルを人が確認して判定基準を見直す。","z":"怀疑是方言或表达差异导致的分类偏差，由人抽查样本并修订判定标准。"},{"j":"分析結果のグラフの色を変えて目立たなくする。","z":"改变分析结果图表的颜色，让它不那么显眼。"}],"a":[2],"e":"某一群体结果系统性地偏向一边，可能是模型偏见或表达差异造成的误判。应由人抽查样本确认，并修订判定标准或提示词。A 未经验证就下结论；B 丢失数据；D 掩盖问题。","ej":"特定グループに偏った結果はバイアスを疑い、人がサンプル確認する。"},{"id":"d2-017","d":2,"t":"2.2","n":1,"q":"Claudeが作成した製品マニュアルの草案で、「本製品は防水です」という記述と、後半の「水濡れに注意してください」という記述が併存していた。最初に取るべき行動はどれか。","qz":"Claude 编写的产品手册草稿中，“本产品防水”的描述与后半部分“请注意防止进水”的描述同时存在。首先应采取的行动是哪一项？","o":[{"j":"製品仕様書で防水性能を確認し、正しい内容に統一する。","z":"通过产品规格书确认防水性能，统一为正确内容。"},{"j":"両方の記述を残し、ユーザーの判断に任せる。","z":"保留两种描述，交给用户自行判断。"},{"j":"後半の記述を削除する。","z":"删除后半部分的描述。"},{"j":"Claudeに「どちらが正しいか」を聞き、その回答に従う。","z":"问 Claude“哪个是对的”，按其回答处理。"}],"a":[0],"e":"输出内部矛盾时，应以权威来源（产品规格书）确认事实再统一。B 把风险转嫁给用户；C 不确认就删除可能删错；D 模型并不知道真实规格，可能再次猜测。","ej":"矛盾は権威ある情報源（仕様書等）で事実確認してから統一する。"},{"id":"d2-018","d":2,"t":"2.2","n":2,"q":"Claudeの出力に含まれるバイアスを減らし、検出しやすくするための取り組みとして適切なものを2つ選べ。","qz":"作为减少并更容易发现 Claude 输出中偏见的做法，请选出 2 项恰当的。","o":[{"j":"AIは中立なので、出力のレビューは不要とする。","z":"AI 是中立的，因此不需要审核输出。"},{"j":"出力をできるだけ短くするよう指示する。","z":"指示输出尽量简短。"},{"j":"複数の立場や視点からの意見を出すよう依頼し、偏りがないか比較する。","z":"要求从多个立场和视角提出意见，并比较是否有偏向。"},{"j":"自分の意見を先に伝え、それを支持する根拠だけを出させる。","z":"先说出自己的意见，只让它提供支持这一意见的依据。"},{"j":"多様な背景を持つメンバーが出力をレビューする。","z":"由具有多样背景的成员审核输出。"}],"a":[2,4],"e":"要求多视角输出（C）和由多元背景的人审核（E）都能帮助发现偏见。A AI 并非天然中立；B 与偏见无关；D 会引发“迎合”，强化确认偏误。","ej":"多角的な視点を出させる＋多様なメンバーでレビュー。先に自説を示すと迎合を招く。"},{"id":"d2-019","d":2,"t":"2.3","n":1,"q":"企画担当者が、Claudeに長い業界レポート（PDF）を読み込ませて質問している。回答の根拠を確認しやすくするためのプロンプトとして最も適切なものはどれか。","qz":"一名企划人员让 Claude 读取一份很长的行业报告（PDF）并向其提问。为了便于确认回答的依据，最恰当的提示词是哪一项？","o":[{"j":"「できるだけ自信を持って回答してください」","z":"“请尽量自信地回答。”"},{"j":"「回答の根拠となるレポート内の該当箇所を引用し、ページ番号を添えてください。該当箇所がなければそう明記してください」","z":"“请引用报告中作为回答依据的相关段落，并附上页码。如果没有相关段落，请明确说明。”"},{"j":"「あなたはこの業界のトップアナリストです。専門家としての知見を最大限に活かし、自信を持って詳しく回答してください」","z":"“你是这个行业的顶级分析师。请最大限度发挥专家见解，自信而详细地回答。”"},{"j":"「簡潔に一言で回答してください」","z":"“请用一句话简洁回答。”"}],"a":[1],"e":"要求引用原文段落和页码，使人能快速回到原文核对；同时允许“没有就说没有”，可减少编造。A、C 只是改变语气，可能让幻觉更难察觉；D 去掉了依据。","ej":"根拠となる箇所を引用させ、なければ「ない」と言わせる。"},{"id":"d2-020","d":2,"t":"2.3","n":1,"q":"Claudeが回答の中で、ある調査機関の統計データを引用した。この統計を社外向け資料に使う前のファクトチェックとして最も適切なものはどれか。","qz":"Claude 在回答中引用了某调查机构的统计数据。在把该统计用于对外资料之前，作为事实核查最恰当的是哪一项？","o":[{"j":"他のAIツールにも同じ質問をして、同じ数値が出れば正しいと判断する。","z":"用其他 AI 工具问同样的问题，如果数字相同就判断正确。"},{"j":"数値が妥当な範囲に見えれば採用する。","z":"只要数值看起来在合理范围内就采用。"},{"j":"Claudeに出典を再確認させ、謝罪がなければ正しいとみなす。","z":"让 Claude 再次确认出处，如果它没有道歉就视为正确。"},{"j":"調査機関の公式発表や原典にあたり、数値・調査年・定義が一致するか確認する。","z":"查阅调查机构的官方发布或原始文献，确认数值、调查年份和定义是否一致。"}],"a":[3],"e":"事实核查的基本原则是回到一手资料（原典）。不仅核对数字，还要核对年份和定义（如“市场规模”的口径）。A 多个 AI 可能犯同样错误；B 看起来合理≠正确；C 模型的反应不是验证。","ej":"ファクトチェックは原典にあたり、数値・年・定義まで確認する。"},{"id":"d2-021","d":2,"t":"2.3","n":1,"q":"Web検索を有効にしたClaudeが、引用リンク付きで回答を返した。引用の扱いとして最も適切なものはどれか。","qz":"开启了网络搜索的 Claude 返回了附有引用链接的回答。对于引用，最恰当的处理是哪一项？","o":[{"j":"重要な主張については引用リンク先を開き、記載内容が回答と一致しているか確認する。","z":"对于重要的论断，打开引用链接，确认其内容与回答是否一致。"},{"j":"引用リンクが付いている主張は検索結果に基づいているので、リンク先を開かなくても正確だとみなしてよい。","z":"附有引用链接的论断是基于搜索结果的，因此即使不打开链接也可以视为准确。"},{"j":"引用の数が多いほど正確なので、引用数だけを確認する。","z":"引用越多越准确，因此只确认引用数量。"},{"j":"引用元のドメイン名だけを見て判断する。","z":"只看引用来源的域名来判断。"}],"a":[0],"e":"有引用也可能出现“引用内容与回答不符”或断章取义。重要论断需打开来源核对。B、C 把引用的存在或数量当作正确性证明；D 只看域名不够，需看内容本身。","ej":"引用があっても、重要な主張はリンク先の内容と一致するか確認する。"},{"id":"d2-022","d":2,"t":"2.3","n":2,"q":"Claudeが作成した社内向けの技術解説資料について、効率的かつ確実にファクトチェックを行う方法として適切なものを2つ選べ。","qz":"对于 Claude 制作的内部技术讲解资料，作为高效且可靠地进行事实核查的方法，请选出 2 项恰当的。","o":[{"j":"Claudeに、資料中の検証が必要な事実主張（数値・固有名詞・日付）を一覧化させ、それを一つずつ確認する。","z":"让 Claude 把资料中需要验证的事实性论断（数字、专有名词、日期）列成清单，然后逐一确认。"},{"j":"重要な主張は、社内の公式ドキュメントやその分野の担当者に照会して確認する。","z":"重要论断通过公司内部官方文档或向该领域的负责人询问来确认。"},{"j":"資料の文体がプロらしければ正しいとみなす。","z":"资料文风专业就视为正确。"},{"j":"Claudeに同じ資料を再生成させ、内容が変わらなければ確認済みとする。","z":"让 Claude 重新生成同一份资料，内容不变就视为已确认。"},{"j":"誤りがあれば読者が気づくので、確認は省略して配布する。","z":"有错读者会发现，所以省略确认直接分发。"}],"a":[0,1],"e":"先让 Claude 把“需要核实的论断”抽取成清单（A），能让核查有系统、不遗漏；再用权威来源或专家确认（B）。C 看风格不看事实；D 一致≠正确；E 把核查责任推给读者，违背 Diligence。","ej":"検証が必要な主張を一覧化→公式文書・担当者で確認、が効率的で確実。"},{"id":"d2-023","d":2,"t":"2.3","n":1,"q":"Claudeに提供した契約書について「解約条件」を質問したところ、もっともらしい回答が返ってきた。回答が契約書の内容に基づいているかを確かめるために、最も有効なプロンプトはどれか。","qz":"就提供给 Claude 的合同询问“解约条件”，得到了看似合理的回答。为确认回答是否基于合同内容，最有效的提示词是哪一项？","o":[{"j":"「あなたの回答は正しいですか？」","z":"“你的回答正确吗？”"},{"j":"「契約書の内容に加えて、一般的な契約実務における解約条件も含めて、網羅的に詳しく説明してください」","z":"“除了合同内容外，也请包括一般合同实务中的解约条件，全面详细地说明。”"},{"j":"「まず契約書から解約に関する条文をそのまま抜き出し、その引用だけに基づいて回答してください」","z":"“请先从合同中原样摘录与解约相关的条文，然后只基于这些引用来回答。”"},{"j":"「法律の専門家として回答してください」","z":"“请以法律专家的身份回答。”"}],"a":[2],"e":"“先摘录原文、再仅基于引用作答”是减少幻觉、提高可验证性的经典方法，人可直接对照条文。A 自我确认不可靠；B 会混入合同外的一般知识；D 角色设定不能保证依据来自合同。","ej":"先に原文を抜き出させ、その引用だけに基づいて回答させる。"},{"id":"d2-024","d":2,"t":"2.3","n":1,"q":"Claudeに市場規模の推計を依頼したところ、「約3,200億円」という数値が示された。推計の妥当性を検証する方法として最も適切なものはどれか。","qz":"请 Claude 估算市场规模，给出了“约3200亿日元”的数字。作为验证该估算是否合理的方法，最恰当的是哪一项？","o":[{"j":"桁が大きいので信頼できると判断する。","z":"数字量级大，判断可信。"},{"j":"推計に使った前提（顧客数、単価、普及率など）と計算過程を示させ、各前提を外部データで確認する。","z":"让其展示估算所用的前提（客户数、单价、普及率等）和计算过程，并用外部数据确认各前提。"},{"j":"数値を「約3,000億円」に丸めて使う。","z":"把数字四舍五入成“约3000亿日元”再使用。"},{"j":"推計の根拠は聞かずに何度か再生成させ、出てきた複数の数値の平均を取って最終的な市場規模とする。","z":"不问估算依据，多次重新生成，取得到的多个数字的平均值作为最终市场规模。"}],"a":[1],"e":"估算的可信度取决于前提与计算过程。要求展示前提和推导，再逐一用外部数据核实，才能判断是否合理。C 四舍五入不改变正确性；D 盲目重试没有验证；A 无依据。","ej":"推計は前提と計算過程を開示させ、前提を外部データで確認する。"},{"id":"d2-025","d":2,"t":"2.3","n":1,"q":"新入社員向け研修資料をClaudeで作成した。内容には社内制度（休暇制度・経費精算ルール）の説明が含まれる。公開前の確認として最も適切なものはどれか。","qz":"用 Claude 制作了新员工培训资料，其中包含公司制度（休假制度、报销规则）的说明。发布前的确认工作最恰当的是哪一项？","o":[{"j":"Claudeは一般的な企業制度に詳しいので確認は不要である。","z":"Claude 熟悉一般企业制度，不需要确认。"},{"j":"新入社員に配布してから質問があれば修正する。","z":"先分发给新员工，有疑问再修改。"},{"j":"誤字脱字のチェックのみ行う。","z":"只检查错别字和漏字。"},{"j":"最新の社内規程と照合し、人事・経理の制度担当者に内容確認を依頼する。","z":"与最新的公司规章核对，并请人事和财务的制度负责人确认内容。"}],"a":[3],"e":"公司特有的制度只能以公司内部最新规章为准，Claude 的一般知识可能与本公司规定不符。应与官方规章核对并请制度负责人确认。A 把一般知识当本公司规定；B 让错误信息先流出；C 只查形式。","ej":"社内制度は最新の社内規程と担当部署で確認する。一般知識で代用しない。"},{"id":"d2-026","d":2,"t":"2.3","n":2,"q":"Claudeの出力の正確性を検証する手法として、信頼性が低いものを2つ選べ。","qz":"作为验证 Claude 输出准确性的手段，请选出 2 项可靠性低的。","o":[{"j":"一次情報（公式発表、原典、規程原文）と照合する。","z":"与一手资料（官方发布、原始文献、规章原文）核对。"},{"j":"Claude自身に回答の確信度を数値で答えさせる。","z":"让 Claude 自己用数字回答对答案的确信程度。"},{"j":"その分野の専門家にレビューを依頼する。","z":"请该领域的专家审核。"},{"j":"回答の文章が断定的で迷いがないことを確認する。","z":"确认回答的文字是否断定、毫不犹豫。"},{"j":"コード実行で計算を再現する。","z":"用代码执行复现计算。"}],"a":[1,3],"e":"本题选“可靠性低”的。模型自报的确信度（B）和语气是否断定（D）都不是准确性的可靠信号——幻觉往往也很自信。A、C、E 都是有效的验证手段。","ej":"自己申告の確信度や断定的な口調は、正確性の根拠にならない。"},{"id":"d2-027","d":2,"t":"2.4","n":1,"q":"カスタマーサポートチームがClaudeで返信の下書きを作成している。次のうち、送信前に必ず人がレビューすべきケースとして最も適切なものはどれか。","qz":"客服团队用 Claude 起草回复。以下哪种情况最应该在发送前必须由人审核？","o":[{"j":"顧客から返金や契約上の補償を求められ、金額や条件を回答するケース。","z":"客户要求退款或合同上的补偿，需要回答金额或条件的情况。"},{"j":"営業時間を案内する定型的な返信。","z":"告知营业时间的固定格式回复。"},{"j":"問い合わせ受付を知らせる自動返信で、受付番号と回答予定日の目安を記載するもの。","z":"告知已受理咨询的自动回复，其中写有受理编号和预计回复日期的大致时间。"},{"j":"FAQページへのリンクを案内する返信。","z":"引导至FAQ页面链接的回复。"}],"a":[0],"e":"涉及金钱、合同、法律责任的回复，一旦出错影响大且难以挽回，必须由有权限的人审核。B、C、D 属于低风险的定型内容，可以用模板化方式提高效率（仍需定期抽查）。","ej":"金銭・契約・法的責任に関わる出力は送信前に必ず人がレビュー。"},{"id":"d2-028","d":2,"t":"2.4","n":1,"q":"人のレビューや追加検証の必要度を判断する際に、最も重視すべき観点はどれか。","qz":"在判断是否需要人工审核或额外验证时，最应重视的视角是哪一项？","o":[{"j":"出力の文字数の多さ。","z":"输出的字数多少。"},{"j":"Claudeの回答速度。","z":"Claude 的回答速度。"},{"j":"誤りがあった場合の影響の大きさ（リスク）と、出力が社外や意思決定に使われるかどうか。","z":"如果出错影响有多大（风险），以及输出是否用于对外或决策。"},{"j":"使用したモデルが最上位モデルかどうか。最上位モデルであれば誤りは少ないので、レビューを省略できる。","z":"所用模型是否是最高端模型。如果是最高端模型错误少，可以省略审核。"}],"a":[2],"e":"审核力度应与风险成正比：错误的影响越大、越是对外或用于重要决策，越需要人审核和额外验证。D 即使最强模型也会出错，不能免除审核；A、B 与风险无关。","ej":"レビューの強度はリスク（誤りの影響）と用途（社外・意思決定）で決める。"},{"id":"d2-029","d":2,"t":"2.4","n":1,"q":"医療機器メーカーのマーケティング担当者が、Claudeで製品の効能を説明する広告コピーを作成した。最も適切な次のステップはどれか。","qz":"一家医疗器械厂商的市场人员用 Claude 撰写了说明产品功效的广告文案。最恰当的下一步是哪一项？","o":[{"j":"コピーが魅力的なので、そのまま広告に使用する。","z":"文案很有吸引力，直接用于广告。"},{"j":"薬事・法務の担当部門による規制適合性のレビューを受けてから使用する。","z":"经药事/法务部门进行合规性审核后再使用。"},{"j":"Claudeに「この表現は法律に違反していませんか」と聞いて確認する。","z":"问 Claude“这个表述有没有违法？”来确认。"},{"j":"効能の表現をより強くして訴求力を高める。","z":"把功效表述写得更强，提高吸引力。"}],"a":[1],"e":"医疗相关的功效宣传受到严格法规约束，属于需要专业人员审核的高风险领域。C 让模型自行判断合规不能代替专业审核；D 会增加违规风险；A 跳过审核。","ej":"規制の厳しい領域（医療・金融・法務）は専門部門のレビューが必須。"},{"id":"d2-030","d":2,"t":"2.4","n":2,"q":"Claudeの出力について、人によるレビューや追加検証を特に強化すべき状況を2つ選べ。","qz":"对于 Claude 的输出，请选出 2 种特别需要加强人工审核或额外验证的情况。","o":[{"j":"社内の雑談チャンネル向けに、イベントのキャッチコピー案を出してもらう。","z":"为公司内部闲聊频道征集活动宣传语方案。"},{"j":"取締役会に提出する投資判断資料の財務数値をまとめる。","z":"整理提交给董事会的投资决策资料中的财务数字。"},{"j":"自分用のメモを箇条書きに整理する。","z":"把自己用的笔记整理成要点。"},{"j":"顧客に送付する契約更新条件の案内文を作成する。","z":"撰写发送给客户的合同续签条件通知。"},{"j":"ブレインストーミングでアイデアを20個出してもらう。","z":"在头脑风暴中让它提出20个点子。"}],"a":[1,3],"e":"用于重大决策的财务数字（B）和发给客户的合同条件（D）一旦出错，影响大且涉及责任，需加强审核。A、C、E 是低风险的内部或创意用途，人本来就会筛选。","ej":"重要な意思決定・社外への契約情報は検証を強化。アイデア出しや個人メモは低リスク。"},{"id":"d2-031","d":2,"t":"2.4","n":1,"q":"チームリーダーが、Claudeで作成した週次レポートを毎週そのまま部長に送っている。これまで誤りは見つかっていない。最も適切な考え方はどれか。","qz":"一名团队负责人每周都把用 Claude 制作的周报直接发给部长，至今没发现错误。最恰当的想法是哪一项？","o":[{"j":"これまで誤りがないので、今後もレビューは不要である。","z":"至今没有错误，今后也不需要审核。"},{"j":"レポート作成はAIの責任なので、誤りがあればAIの問題である。","z":"报告制作是 AI 的责任，如果出错是 AI 的问题。"},{"j":"念のため、毎週すべての文章を一から書き直す。","z":"为保险起见，每周从头重写所有内容。"},{"j":"送付者として内容に責任を持ち、重要な数値や結論は毎回確認する。","z":"作为发送者对内容负责，每次都确认重要的数字和结论。"}],"a":[3],"e":"过去没错不代表将来不会错（自动化偏见）。使用 AI 产出的人对结果负最终责任（Diligence），应以合理成本检查关键数字和结论。B 推卸责任；C 过度，抵消了效率。","ej":"最終責任は送付者にある。過去に誤りがなくても重要点は毎回確認する。"},{"id":"d2-032","d":2,"t":"2.4","n":1,"q":"Claudeが、従業員の健康相談に関する問い合わせに対して一般的な健康情報を回答した。社内ヘルプデスクとしての運用で最も適切なものはどれか。","qz":"Claude 针对员工健康咨询的问题回答了一般性的健康信息。作为公司内部服务台的运营方式，最恰当的是哪一项？","o":[{"j":"Claudeの回答を医学的な診断として案内する。","z":"把 Claude 的回答当作医学诊断提供给员工。"},{"j":"一般情報にとどめ、個別の症状や判断が必要な場合は産業医や専門家へ案内する仕組みにする。","z":"仅限于一般信息，对于个别症状或需要判断的情况，建立引导至产业医生或专家的机制。"},{"j":"健康に関する質問はすべて無視する。","z":"忽略所有与健康相关的问题。"},{"j":"回答の正確性を高めるため、従業員の健康診断データをすべてClaudeに入力する。","z":"为提高回答准确性，把员工的体检数据全部输入 Claude。"}],"a":[1],"e":"涉及个人健康判断的领域需要专业人员。AI 可提供一般信息，但应设计“升级（escalation）到专家”的流程。A 越权；C 过度；D 违反隐私和数据最小化原则。","ej":"専門判断が必要な領域は、専門家へエスカレーションする仕組みを作る。"},{"id":"d2-033","d":2,"t":"2.4","n":1,"q":"アソシエイトが、Claudeを使って業務自動化の簡単なスクリプトを生成した。そのスクリプトを全社の基幹システムに組み込みたいと考えている。最も適切な対応はどれか。","qz":"一名业务人员用 Claude 生成了一个简单的业务自动化脚本，想把它集成到全公司的核心系统中。最恰当的应对是哪一项？","o":[{"j":"技術的な実装やシステム連携は、開発者・アーキテクトにレビューと実装を依頼する。","z":"技术实现和系统集成应请开发人员或架构师进行审核和实施。"},{"j":"Claudeが生成したコードなので、そのまま本番環境に導入する。","z":"是 Claude 生成的代码，直接部署到生产环境。"},{"j":"Claudeに「このコードは安全ですか」と確認してから自分で導入する。","z":"先问 Claude“这段代码安全吗？”，再自己部署。"},{"j":"動作確認は本番環境で行えばよい。","z":"运行确认在生产环境中进行即可。"}],"a":[0],"e":"Associate 的定位是识别自身能力边界，把复杂或技术性的实现升级给开发者/架构师。核心系统集成涉及安全、可靠性，需要专业审核。B、D 风险极高；C 模型自评不能替代专业审核。","ej":"基幹システム連携など技術的な実装は、Developer・Architectへエスカレーション。"},{"id":"d2-034","d":2,"t":"2.4","n":1,"q":"Claudeに外国の取引先との契約書を翻訳・要約させたところ、要約に「準拠法は日本法」と記載されていた。この要約をもとに契約締結の判断をする前に、最も適切な対応はどれか。","qz":"让 Claude 翻译并总结与外国客户的合同，摘要写着“准据法为日本法”。在基于该摘要做出签约判断之前，最恰当的应对是哪一项？","o":[{"j":"要約に明記されているので、そのまま判断材料とする。","z":"摘要中写得很清楚，直接作为判断依据。"},{"j":"要約の文章を整えて社内稟議に回す。","z":"润色摘要文字后提交公司内部审批。"},{"j":"準拠法など重要条項は原文で該当条文を確認し、法務部門のレビューを受ける。","z":"准据法等重要条款要在原文中确认相关条文，并接受法务部门审核。"},{"j":"別の言い方で再度要約させ、同じ結果なら確定とする。","z":"换个说法重新总结一次，结果相同就确定。"}],"a":[2],"e":"签约是高风险决策，准据法等关键条款必须回到原文确认，并由法务专业人员审核。摘要只是辅助理解的工具。D 一致性不能证明正确；A、B 都跳过了验证。","ej":"契約締結など重要判断は、要約ではなく原文と法務レビューで確認する。"},{"id":"d2-035","d":2,"t":"2.5","n":1,"q":"技術部門がClaudeで作成したシステム障害の報告書を、経営層向けに共有したい。最も適切な依頼方法はどれか。","qz":"想把技术部门用 Claude 制作的系统故障报告分享给经营层。最恰当的请求方式是哪一项？","o":[{"j":"技術的な詳細は正確性のためにすべて残し、経営層が読みやすいように文字を大きくして図を追加するよう依頼する。","z":"为了准确性保留所有技术细节，并请它放大字体、增加图示，让经营层更易读。"},{"j":"「もっと短くして」とだけ指示する。","z":"只指示“写短一点”。"},{"j":"経営層に信頼されるよう、障害の技術的な原因分析をさらに詳しく書き加え、専門用語も正確に使って説得力を高めるよう指示する。","z":"为了获得经营层信任，指示它进一步详细补充故障的技术原因分析，并准确使用专业术语以提高说服力。"},{"j":"読み手（経営層）と目的を明示し、業務影響・原因概要・再発防止策・判断事項を1ページで、専門用語を避けて書き直させる。","z":"明确读者（经营层）和目的，让其用1页、避免专业术语，改写为业务影响、原因概要、防止再发措施和需决策事项。"}],"a":[3],"e":"为不同读者调整输出时，要明确告诉 Claude：读者是谁、他们关心什么、需要的结构和篇幅、用语水平。B 只说“短一点”不能保证保留经营层需要的信息；A、C 不符合读者需求。","ej":"読み手・目的・構成・長さ・用語レベルを明示して書き直させる。"},{"id":"d2-036","d":2,"t":"2.5","n":1,"q":"Claudeに新製品の紹介文を3パターン作らせた。どれを採用するか決める方法として最も適切なものはどれか。","qz":"让 Claude 写了3种新产品介绍文案。决定采用哪一个时，最恰当的方法是哪一项？","o":[{"j":"ターゲット顧客・訴求ポイント・トーンなどの評価基準を決め、基準に沿って比較する。","z":"先确定目标客户、诉求重点、语气等评价标准，再按照标准进行比较。"},{"j":"最も長いパターンを選ぶ。","z":"选最长的那一版。"},{"j":"最初に生成されたパターンを選ぶ。","z":"选第一个生成的版本。"},{"j":"3パターンの良い部分をすべて取り入れるため、3つの文章をつなげて1つの紹介文にまとめる。","z":"为了吸收3种版本的所有优点，把3段文字连接成一份介绍文。"}],"a":[0],"e":"比较多个输出时，应先定义评价标准（受众、目的、语气、准确性等），再按标准比较，也可以让 Claude 按标准列出各版本优缺点辅助判断。B、C 没有依据；D 会让内容冗长、重复。","ej":"複数案は評価基準を先に決めてから比較する。"},{"id":"d2-037","d":2,"t":"2.5","n":1,"q":"Claudeが作成したメール文案が、取引先への謝罪メールとしてはカジュアルすぎる。最も効率的な修正方法はどれか。","qz":"Claude 写的邮件草稿作为给客户的道歉邮件过于随意。最高效的修改方法是哪一项？","o":[{"j":"会話をすべて削除して新しいチャットを開き、最初から「丁寧な謝罪メールを書いて」と依頼し直して新たに生成させる。","z":"删除全部对话，打开新聊天，从头请求“写一封礼貌的道歉邮件”重新生成。"},{"j":"内容は維持したまま「取引先への正式な謝罪メールとして、丁寧な敬語に修正して」と具体的にフィードバックする。","z":"保留内容，具体反馈：“作为给客户的正式道歉邮件，请修改为礼貌的敬语。”"},{"j":"自分で全文を書き直す。","z":"自己把全文重写。"},{"j":"「ダメです」とだけ伝える。","z":"只告诉它“不行”。"}],"a":[1],"e":"在同一对话中给出具体的修改反馈（保留什么、改什么、为什么），是最高效的迭代方式。D 缺乏具体指示，Claude 不知如何改；A、C 浪费已完成的工作。","ej":"何を維持し何をどう変えるかを具体的にフィードバックする。"},{"id":"d2-038","d":2,"t":"2.5","n":2,"q":"Claudeが作成した社内向け技術ブログ記事を、一般顧客向けのお知らせに転用する際に、修正すべき点として適切なものを2つ選べ。","qz":"把 Claude 撰写的内部技术博客文章转用为面向一般客户的通知时，请选出 2 项应修改的地方。","o":[{"j":"段落の数を増やす。","z":"增加段落数量。"},{"j":"記事の作成日をより新しい日付に変える。","z":"把文章的撰写日期改成更新的日期。"},{"j":"Claudeが作成したことを隠すため、文体を意図的に崩す。","z":"为了隐藏是 Claude 写的，故意把文风弄乱。"},{"j":"社内でしか通じない略語や専門用語を、一般向けの平易な表現に置き換える。","z":"把只有公司内部才懂的缩写和专业术语替换为面向大众的通俗表达。"},{"j":"社内の未公開情報や内部の検討経緯が含まれていないか確認し、削除する。","z":"确认是否包含内部未公开信息或内部讨论经过，并将其删除。"}],"a":[3,4],"e":"面向不同读者转用时：调整用语水平（D），并检查是否包含不应公开的内部信息（E）。A 与读者无关；B 篡改事实；C 不当且无意义。","ej":"読み手の変更時は、用語レベルの調整と、未公開・社内情報の除去を確認する。"},{"id":"d2-039","d":2,"t":"2.5","n":1,"q":"教育担当者が、Claudeで作成した研修資料を新人向けとベテラン向けの2種類に分けたい。最も適切なアプローチはどれか。","qz":"一名培训负责人想把用 Claude 制作的培训资料分成新人版和资深员工版两种。最恰当的做法是哪一项？","o":[{"j":"同じ資料を2部コピーし、表紙だけ変える。","z":"把同一份资料复制两份，只改封面。"},{"j":"ベテラン向け資料だけ作成し、新人には自分で調べさせる。","z":"只做资深员工版，让新人自己查资料。"},{"j":"それぞれの対象者の前提知識と学習目標を伝え、説明の深さ・例・用語を調整した版を作らせる。","z":"告知各自对象的前提知识和学习目标，让 Claude 制作调整了讲解深度、示例和用语的版本。"},{"j":"ベテラン向けの資料を先に完成させ、分量を半分に削ったものを新人向けとして配布し、詳細は質問に応じて補う。","z":"先完成资深员工版，把内容删减一半作为新人版分发，细节根据提问再补充。"}],"a":[2],"e":"调整输出要基于读者的前提知识和目标：新人需要基础概念和具体例子，资深员工需要要点和进阶内容。A 没有调整；D 单纯删减可能删掉新人最需要的基础说明；B 不符合目的。","ej":"対象者の前提知識と目標を伝え、深さ・例・用語を調整させる。"},{"id":"d2-040","d":2,"t":"2.5","n":1,"q":"Claudeが作成した提案書の草案について、上司から「論点が多すぎて結論がわかりにくい」と指摘を受けた。Claudeへの修正依頼として最も適切なものはどれか。","qz":"上司对 Claude 写的提案书草稿指出“论点太多，结论不清楚”。向 Claude 提出的修改请求中最恰当的是哪一项？","o":[{"j":"「論点をもっと増やして説得力を高めて」","z":"“再增加一些论点，提高说服力。”"},{"j":"「冒頭に結論を1文で示し、根拠を重要度の高い3点に絞って、残りは付録に移して」","z":"“在开头用一句话给出结论，把依据精简为最重要的3点，其余移到附录。”"},{"j":"「フォントと配色を変えて読みやすくして」","z":"“改变字体和配色，让它更易读。”"},{"j":"「上司が気に入るような表現と構成に全体を直してください。修正の方針はお任せします」","z":"“请把全文改成上司会喜欢的表述和结构，修改方针交给你。”"}],"a":[1],"e":"把反馈转化为具体、可执行的修改指示：结论先行、依据精简、次要内容移至附录。D 太模糊，Claude 不知道上司的偏好；A 与反馈相反；C 只改外观。","ej":"フィードバックは「結論先行・根拠を絞る」など具体的な指示に変換する。"},{"id":"d2-041","d":2,"t":"2.5","n":2,"q":"Claudeの出力を自分で編集・仕上げる際の姿勢として適切なものを2つ選べ。","qz":"自己编辑、完善 Claude 的输出时，请选出 2 项恰当的态度。","o":[{"j":"自分の知見や組織特有の文脈を加え、目的に合うよう内容を補強する。","z":"加入自己的见解和组织特有的背景，补强内容使其符合目的。"},{"j":"AIが作ったものは編集すると品質が下がるので、手を加えない。","z":"AI 写的东西一编辑质量就会下降，所以不动。"},{"j":"文字数を減らすことだけに集中する。","z":"只专注于减少字数。"},{"j":"出力の誤りは読み手が判断すればよい。","z":"输出中的错误由读者自行判断即可。"},{"j":"出力はあくまで下書きと捉え、最終的な内容と表現に自分が責任を持つ。","z":"把输出视为草稿，自己对最终内容和表达负责。"}],"a":[0,4],"e":"AI 输出是起点（草稿），人应加入领域知识与组织背景（A），并对最终成果负责（E）。B 放弃了人的作用；C 片面；D 推卸责任。","ej":"出力は下書き。人が文脈を加えて仕上げ、最終責任を持つ。"},{"id":"d2-042","d":2,"t":"2.5","n":1,"q":"Claudeに同じテーマで2つの要約（A版：箇条書き、B版：段落形式）を作らせた。チーム内の進捗共有チャットに投稿する場合、最も適切な選択はどれか。","qz":"让 Claude 就同一主题写了两份摘要（A版：要点式，B版：段落式）。若要发布到团队内部的进度共享聊天中，最恰当的选择是哪一项？","o":[{"j":"A版とB版の両方を投稿し、メンバーそれぞれが読みやすい方を選べるようにする。","z":"两版都发布，让每位成员选择自己觉得易读的一版。"},{"j":"文字数が多いB版を選ぶ。","z":"选字数多的B版。"},{"j":"どちらも使わず、口頭で伝える。","z":"两份都不用，口头传达。"},{"j":"短時間で要点を把握できる箇条書きのA版を選び、必要に応じて調整する。","z":"选择能在短时间内掌握要点的要点式A版，必要时再调整。"}],"a":[3],"e":"选择输出要考虑使用场景：聊天中的进度共享需要快速扫读，要点式更合适。A 增加读者负担；B 字数多不代表合适；C 放弃了已有成果。","ej":"利用シーン（チャットでの共有）に合う形式を選ぶ。"},{"id":"d2-043","d":2,"t":"2.6","n":1,"q":"マーケティング担当者が、チームで繰り返し編集・共有する1ページのキャンペーン企画書をClaudeで作成したい。出力形式として最も適切なものはどれか。","qz":"一名市场人员想用 Claude 制作一份团队会反复编辑和共享的1页活动企划书。最恰当的输出形式是哪一项？","o":[{"j":"Artifactとして作成し、独立した成果物として反復編集・共有できるようにする。","z":"作为 Artifact 制作，使其成为可以反复编辑和共享的独立成果物。"},{"j":"チャットのインライン回答として出力し、編集が必要になるたびに全文をコピーして別のツールに貼り付ける。","z":"作为聊天行内回答输出，每次需要编辑时都把全文复制粘贴到其他工具中。"},{"j":"JSON形式で出力する。","z":"以 JSON 格式输出。"},{"j":"一文ずつ別々のメッセージで出力させる。","z":"让它每一句话分成单独的消息输出。"}],"a":[0],"e":"Artifact 适合篇幅较长、需要反复修改、独立使用或共享的成果物（文档、代码、图表、小应用等）。B 行内回答适合简短答复；C JSON 适合系统处理而不是人阅读；D 不实用。","ej":"繰り返し編集・共有する独立した成果物はArtifactが適切。"},{"id":"d2-044","d":2,"t":"2.6","n":1,"q":"同僚から「来週の会議は何曜日だったか」とチャットで聞かれ、Claudeで確認した。回答の形式として最も適切なものはどれか。","qz":"同事在聊天中问“下周的会议是星期几”，用 Claude 确认了。最恰当的回答形式是哪一项？","o":[{"j":"Artifactで会議情報のドキュメントを作成する。","z":"用 Artifact 制作会议信息文档。"},{"j":"会議の背景から詳しく説明する長文レポートを作成する。","z":"制作从会议背景开始详细说明的长篇报告。"},{"j":"短いインラインの回答で簡潔に伝える。","z":"用简短的行内回答简洁传达。"},{"j":"表形式のCSVを作成する。","z":"制作表格形式的 CSV。"}],"a":[2],"e":"简单的问答用简短的行内回答最合适。Artifact、长篇报告或 CSV 对这种场景都是过度的，反而降低效率。","ej":"短い質問への回答はインラインで簡潔に。"},{"id":"d2-045","d":2,"t":"2.6","n":1,"q":"営業部が、Claudeで抽出した顧客問い合わせ情報（会社名・問い合わせ日・カテゴリ・緊急度）を、後でスプレッドシートに取り込んで集計したい。最も適切な出力形式の指定はどれか。","qz":"销售部想把用 Claude 提取的客户咨询信息（公司名、咨询日期、类别、紧急程度）之后导入电子表格进行汇总。最恰当的输出格式指定是哪一项？","o":[{"j":"自由な文章で要約するよう指定する。","z":"指定用自由文本进行总结。"},{"j":"列名・順序・日付形式（YYYY-MM-DD）・緊急度の選択肢を指定し、CSV形式で出力させる。","z":"指定列名、顺序、日期格式（YYYY-MM-DD）和紧急程度可选值，以 CSV 格式输出。"},{"j":"詩的な表現で印象に残るように書かせる。","z":"让它用富有诗意的表达写得令人印象深刻。"},{"j":"箇条書きで出力させ、各項目の書き方や日付の表記はClaudeが読みやすいと判断した形式に任せる。","z":"用要点式输出，各项写法和日期表示交给 Claude 判断的易读格式。"}],"a":[1],"e":"后续要被工具处理的数据，应使用结构化数据格式，并明确规定列、顺序、日期格式、可选值，保证一致性，便于导入和汇总。A、D 格式不统一，难以处理；C 不合适。","ej":"後で集計するデータは、列・形式・選択肢を指定した構造化データ（表・CSV）で。"},{"id":"d2-046","d":2,"t":"2.6","n":2,"q":"Claudeに大量の調査メモを整理・キュレーションさせる際の指示として適切なものを2つ選べ。","qz":"让 Claude 整理和筛选大量调研笔记时，请选出 2 项恰当的指示。","o":[{"j":"すべての情報を同じ重要度で羅列させる。","z":"让它把所有信息按同等重要性罗列。"},{"j":"出典は不要なので削除させる。","z":"出处没必要，让它删除。"},{"j":"テーマ別に分類し、重複する内容を統合したうえで、各項目に出典メモを残すよう指示する。","z":"指示其按主题分类、合并重复内容，并在每项保留出处备注。"},{"j":"目的（例：来期の施策検討）に照らして重要度を付け、関係の薄い情報は別枠にまとめるよう指示する。","z":"指示其参照目的（如：下期措施研讨）标注重要程度，把关联性低的信息归入另一栏。"},{"j":"整理の基準はClaudeに完全に任せ、結果は確認しない。","z":"整理标准完全交给 Claude，不确认结果。"}],"a":[2,3],"e":"好的信息整理：按主题分类、去重并保留出处（C），并依据目的进行优先排序（D）。A 没有筛选；B 删除出处会使之后无法核实；E 放弃了人的确认。","ej":"テーマ別分類・重複統合・出典保持、目的に沿った重要度付けで整理する。"},{"id":"d2-047","d":2,"t":"2.6","n":1,"q":"プロジェクトマネージャーが、関係者向けにプロジェクトのスケジュールを視覚的に示したい。Claudeへの依頼として最も適切なものはどれか。","qz":"一名项目经理想向相关人员直观展示项目进度安排。向 Claude 提出的请求中最恰当的是哪一项？","o":[{"j":"タスクの前後関係や期間がすべて伝わるよう、スケジュール全体を詳しい段落形式の文章で説明させる。","z":"为了完整传达任务的先后关系和期间，让它用详细的段落文字说明整个进度安排。"},{"j":"タスク名を1行ずつ並べるだけのリストを作らせる。","z":"让它只做一份逐行列出任务名的列表。"},{"j":"スケジュールの説明を口頭用の原稿にする。","z":"把进度说明写成口头讲稿。"},{"j":"タスク・期間・担当を整理し、ガントチャート風のタイムラインをArtifactで作成させる。","z":"整理任务、期间和负责人，用 Artifact 制作甘特图式的时间线。"}],"a":[3],"e":"“视觉化展示”的需求适合用图表/时间线，Artifact 可生成独立的可视化成果并反复修改。A、B、C 都不能满足“直观”的需求。","ej":"視覚的に示したい内容は図・タイムラインなどをArtifactで作成する。"},{"id":"d2-048","d":2,"t":"2.6","n":1,"q":"Claudeに、5つのSaaSツールを「価格・主な機能・サポート体制・導入実績」で比較させたい。最も読み手が理解しやすい出力形式はどれか。","qz":"想让 Claude 从“价格、主要功能、支持体系、导入实绩”比较5个 SaaS 工具。读者最容易理解的输出形式是哪一项？","o":[{"j":"ツールを行、比較項目を列とした比較表。","z":"以工具为行、比较项目为列的对比表。"},{"j":"ツールごとに1段落ずつ、計5段落の詳しい説明文。","z":"每个工具一段，共5段详细说明文字。"},{"j":"比較項目を含まない、ツール名の一覧。","z":"不含比较项目的工具名称列表。"},{"j":"JSON形式のデータ。","z":"JSON 格式的数据。"}],"a":[0],"e":"多对象×多维度的比较最适合用表格，读者可横向、纵向对照。B 难以横向比较；C 信息不足；D 适合系统处理，不便人阅读。","ej":"複数対象×複数観点の比較は表形式が最適。"},{"id":"d2-049","d":2,"t":"2.6","n":1,"q":"Claudeの出力形式を選ぶ際の考え方として、最も適切なものはどれか。","qz":"选择 Claude 的输出形式时，最恰当的思路是哪一项？","o":[{"j":"常にArtifactを使う。独立した成果物として表示されるため、短い回答でも品質と見やすさが上がる。","z":"总是使用 Artifact。因为会作为独立成果物显示，即使是简短回答，质量和可读性也会提高。"},{"j":"利用目的・読み手・後工程（人が読む／システムが処理する／共有する）に合わせて選ぶ。","z":"根据使用目的、读者、后续环节（人读/系统处理/共享）来选择。"},{"j":"形式は内容に影響しないので、何でもよい。","z":"形式不影响内容，用什么都行。"},{"j":"文字数が多いほど詳細な形式を選ぶ。","z":"字数越多就选越详细的形式。"}],"a":[1],"e":"输出形式应“为目的服务”：简短回答→行内；长篇、可复用、可共享的成果→Artifact；需要系统处理→结构化数据（表、JSON、CSV）。A 过度使用；C 形式会显著影响可用性；D 没有依据。","ej":"形式は目的・読み手・後工程で選ぶ（インライン／Artifact／構造化データ）。"},{"id":"d2-050","d":2,"t":"2.6","n":2,"q":"次のうち、構造化データ（表・CSV・JSONなど）での出力が特に適しているケースを2つ選べ。","qz":"以下哪些情况特别适合以结构化数据（表格、CSV、JSON等）输出？请选出 2 项。","o":[{"j":"退職する同僚への感謝のメッセージを作成する。","z":"撰写给即将离职同事的感谢信息。"},{"j":"100件の問い合わせを分類し、その結果を集計ツールに取り込む。","z":"把100条咨询进行分类，并将结果导入汇总工具。"},{"j":"複数の商品の仕様を項目ごとに並べて比較する。","z":"把多个商品的规格按项目并列比较。"},{"j":"新しいサービス名のアイデアを自由に出す。","z":"自由提出新服务名称的创意。"},{"j":"上司へ送る短い業務連絡を書く。","z":"给上司写一条简短的工作联络。"}],"a":[1,2],"e":"结构化数据适合：需要被工具读取处理的数据（B）和多项目对照比较（C）。A、E 是需要自然语言表达的沟通文本；D 是自由发散的创意，列表或行内即可。","ej":"ツールに取り込むデータ・項目別の比較は構造化データが適する。"},{"id":"d3-001","d":3,"t":"3.1","n":1,"q":"マーケティング担当者が、毎週同じブランドガイドラインと過去のキャンペーン資料を参照しながらSNS投稿案を作成している。毎回ファイルをアップロードし直し、同じ前提を説明する手間を減らしたい。最も適切なClaudeの機能はどれか。","qz":"市场负责人每周都要参照同样的品牌规范和过去的活动资料来起草社交媒体文案。希望减少每次重新上传文件、重复说明相同前提的麻烦。最合适的 Claude 功能是哪一个？","o":[{"j":"毎回新しいチャットを開き、冒頭に全資料を貼り付ける","z":"每次开新对话，在开头粘贴全部资料"},{"j":"Projectを作成し、ガイドラインと資料をプロジェクトナレッジに、前提をプロジェクト指示に設定する","z":"创建 Project，把规范和资料放进项目知识库，把前提写进项目指令"},{"j":"Researchを使って毎回Webからブランド情報を収集させる","z":"每次使用 Research 让它从网络收集品牌信息"},{"j":"シークレットチャットで作業し、情報が残らないようにする","z":"在无痕对话中工作，让信息不留存"}],"a":[1],"e":"反复使用同一组资料和前提，正是 Project 的用途：项目知识库保存文件，项目指令保存固定前提，每次在该项目里新建对话都会自动带上。A 费时且容易遗漏；C Research 用于调查外部信息，品牌规范是内部资料；D 无痕对话不保留信息，与“减少重复”目的相反。","ej":"繰り返し使う資料と前提 → Project（指示＋ナレッジ）"},{"id":"d3-002","d":3,"t":"3.1","n":1,"q":"事業企画担当者が、新規参入を検討している市場について、競合各社の動向・規制・市場規模を複数の情報源から調べ、引用付きのレポートにまとめたい。時間は数分かかっても構わない。最も適した機能はどれか。","qz":"事业企划负责人想针对正在考虑进入的市场，从多个信息源调查竞争对手动向、法规和市场规模，并整理成带引用的报告。花几分钟也没关系。最合适的功能是哪一个？","o":[{"j":"通常のチャットで、Claudeの学習済み知識だけで回答させる","z":"用普通对话，只凭 Claude 已学习的知识回答"},{"j":"Artifactで表を作成させる","z":"让它用 Artifact 生成表格"},{"j":"最も高速なモデルに切り替えて質問を短くする","z":"切换到最快的模型并把问题写短"},{"j":"Research（リサーチ）機能を使い、複数の検索を自律的に行わせて引用付きレポートを作成させる","z":"使用 Research 功能，让它自主进行多次检索并生成带引用的报告"}],"a":[3],"e":"多来源、需要最新信息、要引用、可以等几分钟 —— 这是 Research 的典型场景，它会自主多次搜索并给出带出处的报告。A 训练知识可能过时且无出处；B Artifact 只是输出形式，不解决信息收集；C 速度不是这里的瓶颈。","ej":"多数の情報源・引用付き・数分OK → Research"},{"id":"d3-003","d":3,"t":"3.1","n":1,"q":"人事担当者が「今日の午後の会議で使う、来客用Wi-Fiのパスワードの伝え方の一文」をClaudeに頼もうとしている。同僚がResearch機能を使うよう勧めてきた。最も適切な判断はどれか。","qz":"人事负责人想请 Claude 写“今天下午会议上告知访客 Wi-Fi 密码的一句话”。同事建议使用 Research 功能。最合适的判断是哪一个？","o":[{"j":"Researchは常に品質が高いので、勧めに従う","z":"Research 质量总是更高，所以照做"},{"j":"単純な短文作成なので、通常のチャットでインライン回答を得る","z":"这是简单的短句写作，用普通对话获得内联回答即可"},{"j":"Projectを新規作成し、会社のWi-Fi規程を全てアップロードしてから依頼する","z":"新建 Project，上传公司全部 Wi-Fi 规定后再请求"},{"j":"Opusと拡張思考を有効にして依頼する","z":"开启 Opus 和扩展思考后再请求"}],"a":[1],"e":"任务简单、一次性、不需要外部调查，用普通对话直接得到内联回答最高效。Research 需要几分钟、面向多来源调查，对这里是过度手段；C 的准备成本远大于任务本身；D 高性能模型和扩展思考会增加时间和成本，没有必要。","ej":"単純・一回限りのタスクに重い機能は過剰"},{"id":"d3-004","d":3,"t":"3.1","n":1,"q":"研修担当者が、Claudeと対話しながら新入社員向けのチェックリスト文書を何度も修正し、最終的にチームへ共有したい。会話の中に文書が埋もれず、版を重ねて編集しやすい形が望ましい。最も適切なのはどれか。","qz":"培训负责人想一边与 Claude 对话，一边多次修改面向新员工的检查清单文档，最终共享给团队。希望文档不被埋在对话里，方便多次迭代编辑。最合适的是哪一个？","o":[{"j":"シークレットチャットで作成し、履歴を残さない","z":"在无痕对话中制作，不留历史"},{"j":"毎回インラインで全文を出力させ、最新版をスクロールで探す","z":"每次都让它内联输出全文，再滚动查找最新版"},{"j":"Researchで類似チェックリストを集めさせる","z":"用 Research 收集类似的检查清单"},{"j":"Artifactとして作成させ、別パネルで反復編集し、完成版を共有する","z":"让它作为 Artifact 生成，在独立面板中反复编辑，完成后共享"}],"a":[3],"e":"需要反复修改、独立存在并共享的成果物，适合 Artifact：在独立面板显示、可迭代版本、可共享/发布。B 内联输出会让多个版本埋在对话里；C 是信息收集，不解决编辑与共享；A 与共享目的无关，且会丢失工作记录。","ej":"反復編集・共享する独立成果物 → Artifact"},{"id":"d3-005","d":3,"t":"3.1","n":1,"q":"広報担当者が「昨日発表された同業他社のプレスリリースの要点」をClaudeに尋ねたところ、もっともらしいが古い情報が返ってきた。最も適切な次の行動はどれか。","qz":"公关负责人向 Claude 询问“同行公司昨天发布的新闻稿要点”，得到的是看似合理但过时的信息。最合适的下一步是哪一个？","o":[{"j":"モデルの知識は常に最新なので、そのまま使う","z":"模型知识总是最新的，直接使用"},{"j":"Web検索を有効にし、引用元を確認できる形で最新情報を取得させる","z":"开启网页搜索，让它以可核对出处的方式获取最新信息"},{"j":"同じ質問を言い回しを変えて何度も繰り返す","z":"换种说法反复问同一个问题"},{"j":"Artifactに出力させて見やすくする","z":"让它输出到 Artifact 以便阅读"}],"a":[1],"e":"模型的训练知识有截止时间，昨天的新闻不在其中。需要最新信息时应开启 Web 搜索，并通过引用核对原文。A 前提错误；C 换说法不会产生它不知道的信息，反而可能诱发幻觉；D 只改格式不解决正确性。","ej":"最新情報 → Web検索＋引用で確認"},{"id":"d3-017","d":3,"t":"3.1","n":1,"q":"経理担当者が、売上データのCSVをアップロードし、月別の推移を集計してグラフ化し、Excelファイルとしても受け取りたい。最も関係の深い機能はどれか。","qz":"财务人员想上传销售数据 CSV，按月汇总趋势并做成图表，同时以 Excel 文件形式获取。关系最密切的功能是哪一个？","o":[{"j":"シークレットチャット","z":"无痕对话"},{"j":"Styles（応答スタイル）","z":"Styles（回答风格）"},{"j":"Web検索","z":"网页搜索"},{"j":"コード実行とファイル作成","z":"代码执行与文件创建"}],"a":[3],"e":"数据汇总、制图、生成 xlsx 文件，需要“代码执行与文件创建”功能（Claude 在沙盒中运行代码处理数据）。A 只影响留痕；B 只调整文风；C 用于获取网络信息，不用于处理本地数据。","ej":"データ分析・グラフ・ファイル生成 → コード実行／ファイル作成"},{"id":"d3-018","d":3,"t":"3.1","n":1,"q":"教育担当者が、同じチームの複数メンバーで同じ教材資料と指示を使い、一貫したトーンで研修資料を作りたい。組織はTeamプランを契約している。最も適切な方法はどれか。","qz":"教育负责人希望同一团队的多名成员使用相同的教材和指令，以一致的语气制作培训资料。组织订阅了 Team 方案。最合适的方法是哪一个？","o":[{"j":"教材はメールで回覧し、Claudeには何も設定しない","z":"教材用邮件传阅，Claude 不做任何设置"},{"j":"各メンバーが自分の判断で個別にチャットを始める","z":"各成员按自己的判断分别开对话"},{"j":"1人のアカウントを全員で使い回す","z":"全员共用一个人的账号"},{"j":"共有Projectを作成し、教材をナレッジに、トーンの指示をプロジェクト指示に設定してメンバーに共有する","z":"创建共享 Project，把教材放入知识库、语气要求写进项目指令，并共享给成员"}],"a":[3],"e":"Team/Enterprise 可以共享 Project 并设置权限，让成员使用同一套知识和指令，产出保持一致。B 无法保证一致；C 共享账号违反安全与使用条款，也无法审计；A 没有利用 Claude 的配置能力。","ej":"チームで一貫性 → 共有Project（Team/Enterprise）"},{"id":"d3-021","d":3,"t":"3.1","n":2,"q":"次のタスクと機能の組み合わせのうち、適切なものを2つ選べ。","qz":"以下任务与功能的组合中，请选出 2 个合适的。","o":[{"j":"一文の言い換えをしたい → Research","z":"想改写一句话 → Research"},{"j":"機密情報を誰とでも共有したい → Artifactの公開","z":"想把机密信息与任何人共享 → 公开 Artifact"},{"j":"継続的に同じ規程集を参照してQ&Aをしたい → Project","z":"想持续参照同一套规章进行问答 → Project"},{"j":"大量の単純分類を安く速く行いたい → 最上位モデル＋拡張思考","z":"想便宜快速地进行大量简单分类 → 最高级模型＋扩展思考"},{"j":"最新の業界ニュースを確認したい → Web検索","z":"想确认最新行业新闻 → 网页搜索"}],"a":[2,4],"e":"正确：E 最新信息用 Web 搜索；C 反复参照同一组资料用 Project。错误：A 一句改写用普通对话即可，Research 过度；B 机密信息不应公开共享；D 大量简单任务应选快速低成本模型。","ej":"最新→Web検索／継続参照→Project"},{"id":"d3-024","d":3,"t":"3.1","n":1,"q":"Styles（応答スタイル）機能の用途として最も適切なものはどれか。","qz":"Styles（回答风格）功能最合适的用途是哪一个？","o":[{"j":"回答の口調・簡潔さ・形式などの書き方を調整する","z":"调整回答的语气、简洁程度、形式等写法"},{"j":"回答の事実の正確性を保証する","z":"保证回答内容的事实准确性"},{"j":"組織のデータ保持期間を設定する","z":"设置组织的数据保留期限"},{"j":"外部サービスとの接続を許可する","z":"允许与外部服务连接"}],"a":[0],"e":"Styles 用来调整 Claude 的写作方式（如正式、简洁或自定义风格）。它不保证事实正确（B）；数据保留是管理设置（C）；外部连接是连接器（D）。","ej":"Styles＝書き方（口調・簡潔さ）の調整"},{"id":"d3-026","d":3,"t":"3.1","n":1,"q":"ある担当者が、会議の直前に「この3行のメモを丁寧な日本語に直して」と頼むとき、出力形式として最も適切なものはどれか。","qz":"某负责人在会议前请 Claude“把这 3 行笔记改成礼貌的日语”。最合适的输出形式是哪一个？","o":[{"j":"チャット内のインライン回答","z":"对话中的内联回答"},{"j":"Researchレポート","z":"Research 报告"},{"j":"Artifactとして独立したドキュメントを作成する","z":"生成为独立的 Artifact 文档"},{"j":"JSON形式の構造化データ","z":"JSON 格式的结构化数据"}],"a":[0],"e":"简短、一次性的改写直接内联回答最方便复制使用。Artifact 适合较长、需要反复编辑或共享的成果物；Research 是多来源调查；JSON 是给系统处理的数据格式，不适合直接阅读。","ej":"短い一回限りの回答 → インライン"},{"id":"
