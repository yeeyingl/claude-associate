模型，并且全部由人重新确认"},{"j":"分類基準は示さずにClaudeに任せる","z":"不给分类标准，全权交给 Claude"},{"j":"1通ずつ別々のチャットを開き、その都度思いついた指示で分類させ、結果を手作業で集計する","z":"每封邮件各开一个对话，每次用临时想到的指示分类，再手工汇总结果"}],"a":[0],"e":"简单大量的分类任务适合 Haiku 这类高速低成本模型，配合明确标准与示例，再抽样检验准确率，是质量、成本、速度的平衡。总用最高性能模型又全部人工复核成本过高；不给标准结果不稳定；每次指示不同会不一致。","ej":"単純・大量タスク＝高速低コストモデル＋明確な基準と例＋サンプル確認。"},{"id":"d7-016","d":7,"t":"7.3","n":2,"q":"Claudeを組み込んだ業務フローを最適化する際の考え方として適切なものはどれか。2つ選べ。","qz":"在优化引入了 Claude 的业务流程时，以下哪些思路是恰当的？请选择 2 项。","o":[{"j":"どの工程で時間がかかっているか、どこで手戻りが発生しているかを把握してから改善対象を決める","z":"先掌握哪些工序耗时、哪里出现返工，再决定改进对象"},{"j":"すべての工程をClaudeに置き換えることを目標にする","z":"以用 Claude 取代所有工序为目标"},{"j":"改善の効果は測らず、利用者の印象だけで判断する","z":"不测量改进效果，只凭使用者印象判断"},{"j":"効果を測るため、作業時間や修正回数などの指標を導入前後で比較する","z":"为了衡量效果，在导入前后比较作业时间、修改次数等指标"},{"j":"人による確認工程は時間がかかるので、すべて削除する","z":"人工确认工序费时，全部删除"}],"a":[0,3],"e":"优化应从识别瓶颈和返工点开始，并用指标量化前后效果。以全部替代为目标不现实也有风险；只凭印象无法判断；删除所有人工确认会放大错误风险。","ej":"ボトルネックを特定し、指標で導入前後を比較する。人の確認は残す。"},{"id":"d7-017","d":7,"t":"7.3","n":1,"q":"毎回同じ手順(データの整形→グラフ作成→所定書式のレポート出力)をClaudeに説明している。手順と書式を再利用可能な形でまとめ、関連する依頼で自動的に使われるようにしたい。最も適した機能はどれか。","qz":"每次都要向 Claude 说明同样的步骤（整理数据→制作图表→按规定格式输出报告）。希望把步骤和格式整理成可复用的形式，并在相关请求时自动使用。最适合的功能是哪一个？","o":[{"j":"シークレットチャット","z":"无痕对话"},{"j":"Styles(応答スタイル)を使い、手順と書式を文章の雰囲気として登録しておく","z":"使用 Styles（回答风格），把步骤和格式作为文章风格登记"},{"j":"Web検索","z":"网络搜索"},{"j":"Skills(手順・テンプレート・スクリプトをまとめたもの)","z":"Skills（汇总了步骤、模板和脚本的功能）"}],"a":[3],"e":"Skills 把流程说明、模板、脚本打包在一起，在相关任务时由 Claude 自动加载，适合标准化的重复流程。无痕对话不保留记录；Styles 只调整回答语气风格；网络搜索用于获取信息。","ej":"定型手順・テンプレートの再利用＝Skills。"},{"id":"d7-018","d":7,"t":"7.3","n":1,"q":"簡単な誤字チェックや短い言い換えにも、常に拡張思考(Extended thinking)を有効にした最上位モデルを使っている。最適化の観点から最も適切な見直しはどれか。","qz":"即使是简单的错字检查或简短改写，也一直使用开启扩展思考的最高端模型。从优化角度看，最合适的调整是哪一个？","o":[{"j":"品質が最優先なので現状を維持する","z":"质量最优先，维持现状"},{"j":"単純なタスクには軽量・高速なモデルを使い、拡張思考は複雑な推論が必要なときだけ使う","z":"简单任务使用轻量高速的模型，只有需要复杂推理时才用扩展思考"},{"j":"すべてのタスクでClaudeの利用をやめる","z":"所有任务都停止使用 Claude"},{"j":"拡張思考は常に有効にしたまま、プロンプトをできるだけ短くして処理量を減らす","z":"保持一直开启扩展思考，把提示词尽量缩短以减少处理量"}],"a":[1],"e":"应按任务难度匹配模型和功能：简单任务用轻量快速模型；扩展思考会增加时间和用量，只在复杂推理时使用。维持现状浪费成本和时间；停止使用过度；只缩短提示词没有解决不匹配问题。","ej":"タスクの難易度に合わせてモデルと拡張思考を使い分ける。"},{"id":"d7-022","d":7,"t":"7.3","n":1,"q":"毎回、同じ長い参考資料を新しいチャットに添付し直している。作業を効率化する方法として最も適切なものはどれか。","qz":"每次都要把同样的长篇参考资料重新附加到新对话中。最合适的效率化方法是哪一个？","o":[{"j":"資料を添付せず、Claudeに内容を思い出させる","z":"不附资料，让 Claude 回想内容"},{"j":"資料を手作業で要約し、毎回その要約を新しいチャットに貼り付けて使う","z":"手工总结资料，每次把总结粘贴到新对话中使用"},{"j":"新しいチャットを作ると資料が失われるので、1つのチャットにすべての作業を集約し続ける","z":"新建对话会丢失资料，所以一直把所有工作集中在一个对话里"},{"j":"資料をProjectのナレッジに登録し、そのProject内で新しいチャットを始める","z":"把资料登记到 Project 知识中，在该 Project 内开始新对话"}],"a":[3],"e":"反复使用的资料放入 Project 知识，Project 内所有对话都能参考，无需重复上传。Claude 不会在新对话中“记得”未提供的文件内容；手工总结会丢信息；一个对话用到底会撑满上下文。","ej":"繰り返し使う資料はProjectナレッジに。"},{"id":"d7-023","d":7,"t":"7.3","n":1,"q":"Claudeで作成した議事録をチーム全体に展開したところ、メンバーごとにプロンプトがばらばらで品質に差が出ている。最も効果的な改善はどれか。","qz":"把用 Claude 制作会议纪要的方法推广到整个团队后，每个成员的提示词各不相同，质量参差不齐。最有效的改进是哪一个？","o":[{"j":"各自のやり方を尊重し、何もしない","z":"尊重各自做法，什么都不做"},{"j":"検証済みのプロンプトと出力形式を共有Projectにまとめ、使い方と確認手順をチームで標準化する","z":"把验证过的提示词和输出格式整理到共享 Project 中，在团队内统一使用方法和确认流程"},{"j":"品質の低いメンバーを特定し、そのメンバーだけClaudeの利用を禁止して、残りのメンバーで運用する","z":"找出质量低的成员，只禁止其使用 Claude，由其余成员运营"},{"j":"品質の差はプロンプトの問題ではないので、議事録作成をClaudeに任せること自体をやめる","z":"质量差异不是提示词的问题，所以干脆不再让 Claude 制作会议纪要"}],"a":[1],"e":"团队层面的质量差异，最有效的是标准化：共享经过验证的提示词、格式和确认流程（例如共享 Project）。放任不管、禁止个人使用、放弃使用都不能提升整体质量。","ej":"チーム展開は検証済みプロンプト・形式・確認手順を共有して標準化。"},{"id":"d7-025","d":7,"t":"7.3","n":2,"q":"Claudeの利用状況を見直したところ、利用上限に早く達してしまうことが多い。利用を効率化する方法として適切なものはどれか。2つ選べ。","qz":"检查 Claude 的使用情况后发现，经常很快就达到使用上限。以下哪些是提高使用效率的恰当方法？请选择 2 项。","o":[{"j":"関連する複数の質問は1つのメッセージにまとめて依頼する","z":"把相关的多个问题合并在一条消息中请求"},{"j":"単純な質問にも常に最上位モデルと拡張思考を使う","z":"即使是简单问题也总是使用最高端模型和扩展思考"},{"j":"同じ大きなファイルを、質問のたびに何度も添付し直す","z":"每次提问都重新附加同一个大文件"},{"j":"長くなった会話は要約して新しいチャットで続け、不要な履歴を引き継がない","z":"对话变长后先总结，再在新对话中继续，不带入不必要的历史"},{"j":"回答が出るたびに再生成を繰り返し、最も良いものを選ぶ","z":"每次出结果后反复重新生成，选最好的"}],"a":[0,3],"e":"长对话每轮都要处理全部历史，消耗更多用量；总结后开新对话、把相关问题合并提问都能节省用量。重复附加大文件、简单任务也用最高端模型加扩展思考、反复重生成都会更快耗尽额度。","ej":"利用量の節約:長い会話は要約して新規チャット、質問はまとめて送る。"}];

const $=s=>document.querySelector(s), M=()=>$("#m");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCDE";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function applyZh(){document.body.classList.toggle("hidezh",!S.zh);const b=$("#zhbtn");b.classList.toggle("on",S.zh);b.textContent=S.zh?"中文 ON":"中文 OFF"}
function toggleZh(){S.zh=!S.zh;save();applyZh()}
const TABS=[["home","🏠","ホーム"],["notes","📘","ノート"],["prac","✏️","練習"],["mock","⏱","模試"],["cards","🃏","用語"],["stats","📊","成績"]];
let cur="home", timerId=null;
function nav(t,arg){cur=t;if(timerId&&t!=="mockrun"){}document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t||(t.startsWith(b.dataset.t))));V[t](arg);window.scrollTo(0,0)}
$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="leaveCheck('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
function leaveCheck(t){if(MK&&!MK.done){if(!confirm("模試を中断しますか？（途中経過は保存されません）"))return;stopMock()}nav(t)}

function stat(ids){let n=0,ok=0,done=0;ids.forEach(id=>{const a=S.ans[id];if(a){done++;if(a.last)ok++}n++});return{n,ok,done}}
function record(id,correct){const a=S.ans[id]||{c:0,k:0};a.c++;if(correct)a.k++;a.last=correct;a.t=Date.now();S.ans[id]=a;save()}
function isOk(q,sel){return sel.length===q.a.length&&q.a.every(x=>sel.includes(x))}

const V={};
V.home=()=>{
  const all=stat(QS.map(q=>q.id)), secs=NOTES.flatMap(c=>c.secs), rd=secs.filter(s=>S.read.includes(s.t)).length;
  const wrong=QS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last).length, last=S.mocks[S.mocks.length-1];
  M().innerHTML=`<h2>Claude Certified Associate – Foundations</h2>
  <div class="card"><div class="mute">CCAO-F ・ 60問 / 120分 ・ 合格 720/1000 ・ 日本語受験可</div>
  <h3 style="margin-top:10px">学習の進み具合</h3>
  <div>ノート既読 ${rd}/${secs.length}</div><div class="bar"><i style="width:${rd/secs.length*100}%"></i></div>
  <div style="margin-top:8px">問題 解答済み ${all.done}/${all.n} ・ 直近正解 ${all.ok}</div><div class="bar"><i style="width:${all.done/all.n*100}%"></i></div>
  ${last?`<div style="margin-top:8px" class="mute">前回の模試：${last.ok}/${last.n}（${Math.round(last.ok/last.n*100)}%）${new Date(last.date).toLocaleDateString()}</div>`:""}</div>
  <div class="card"><b>おすすめの順番</b><span class="zhb mute">（推荐学习顺序）</span>
  <ol style="margin:6px 0 0;padding-left:1.3em"><li>ノートで「試験概要と攻略」を読む</li><li>ドメイン別練習（D2・D6・D4 を重点的に）</li><li>ミニ模試で弱点を見つける</li><li>弱点模試・間違えた問題を復習</li><li>本番模試で 80% 以上を目標に</li></ol></div>
  <div class="row"><button class="btn" onclick="nav('notes')">ノートを開く</button><button class="btn s" onclick="nav('prac')">練習する</button>${wrong?`<button class="btn g" onclick="startPractice(QS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last).map(q=>q.id),'間違えた問題 ${wrong}')">間違えた問題 ${wrong}</button>`:""}</div>`;
};
V.notes=()=>{
  M().innerHTML=`<h2>要点ノート</h2>`+NOTES.map(c=>{const r=c.secs.filter(s=>S.read.includes(s.t)).length;return`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(c.ja)}</b><span class="mute">${r}/${c.secs.length}</span></div><div class="zh">${esc(c.zh)}</div>
  <div class="list">${c.secs.map(s=>`<div class="it" onclick="nav('sec','${s.t}')"><span class="mute">${s.t}</span><b>${esc(s.ja)}<div class="zh">${esc(s.zh)}</div></b>${S.read.includes(s.t)?'<span class="chk">✓</span>':''}</div>`).join("")}</div></div>`}).join("");
};
V.sec=t=>{
  const secs=NOTES.flatMap(c=>c.secs.map(s=>Object.assign({d:c.d},s))), i=secs.findIndex(s=>s.t===t), s=secs[i];
  const qn=QS.filter(q=>q.t===t).length;
  M().innerHTML=`<button class="btn g" onclick="nav('notes')">← 一覧</button>
  <h2 style="margin-top:12px">${s.t} ${esc(s.ja)}</h2><div class="zh" style="margin:-8px 0 10px">${esc(s.zh)}</div>
  <div class="card note">${s.h}</div>
  <div class="row"><button class="btn ${S.read.includes(t)?'s':''}" onclick="markRead('${t}')">${S.read.includes(t)?'✓ 既読':'既読にする'}</button>
  ${qn?`<button class="btn s" onclick="startPractice(QS.filter(q=>q.t==='${t}').map(q=>q.id),'${t} の問題')">この項目の問題 ${qn}問</button>`:""}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between">${i>0?`<button class="btn g" onclick="nav('sec','${secs[i-1].t}')">← ${secs[i-1].t}</button>`:"<span></span>"}${i<secs.length-1?`<button class="btn g" onclick="nav('sec','${secs[i+1].t}')">${secs[i+1].t} →</button>`:""}</div>`;
};
function markRead(t){if(!S.read.includes(t))S.read.push(t);else S.read=S.read.filter(x=>x!==t);save();V.sec(t)}

V.prac=()=>{
  M().innerHTML=`<h2>練習</h2>
  <div class="card"><b>ドメイン別練習</b><span class="zhb mute">（按领域练习，每题即时显示解析）</span><div class="list">${Object.keys(DN).map(d=>{const ids=QS.filter(q=>q.d==d).map(q=>q.id),s=stat(ids);return`<div class="it" onclick="startPractice(QS.filter(q=>q.d==${d}).map(q=>q.id),'D${d} ${DN[d][0]}')"><span class="mute">D${d}</span><b>${DN[d][0]} <span class="mute">${DN[d][2]}%</span><div class="zh">${DN[d][1]}</div><div class="bar" style="margin-top:4px"><i style="width:${s.done/s.n*100}%"></i></div></b><span class="mute">${s.ok}/${s.n}</span></div>`}).join("")}</div></div>
  <div class="card"><b>ランダム練習</b><span class="zhb mute">（随机练习）</span>
  <div class="chips" style="margin:8px 0">${Object.keys(DN).map(d=>`<label><input type="checkbox" class="rd" value="${d}" checked> D${d}</label>`).join("")}</div>
  <div class="row"><label>問題数 <input type="number" id="rn" value="20" min="5" max="240" style="width:70px"></label>
  <label><select id="rf"><option value="all">すべて</option><option value="new">未解答のみ</option><option value="ng">間違えた問題のみ</option><option value="bm">★ お気に入り</option></select></label>
  <button class="btn" onclick="startRandom()">開始</button></div></div>`;
};
function startRandom(){const ds=[...document.querySelectorAll(".rd:checked")].map(x=>+x.value),f=$("#rf").value,n=+$("#rn").value||20;
  let p=QS.filter(q=>ds.includes(q.d));if(f==="new")p=p.filter(q=>!S.ans[q.id]);if(f==="ng")p=p.filter(q=>S.ans[q.id]&&!S.ans[q.id].last);if(f==="bm")p=p.filter(q=>S.bm.includes(q.id));
  if(!p.length){alert("該当する問題がありません");return}startPractice(shuffle(p).slice(0,n).map(q=>q.id),"ランダム練習")}

let PR=null;
function startPractice(ids,title){if(!ids.length){alert("問題がありません");return}PR={ids,i:0,title,sel:[],shown:false,ok:0};cur="pr";drawPr()}
function qHtml(q,sel,shown,click){
  const multi=q.n>1;
  return`<div class="qt">${esc(q.q)}</div><div class="zh">${esc(q.qz)}</div>${multi?`<div class="pick">${q.n}つ選択 / 选${q.n}项</div>`:""}
  ${q.o.map((o,k)=>{let c="";if(shown){if(q.a.includes(k))c="ok";else if(sel.includes(k))c="ng"}else if(sel.includes(k))c="sel";
  return`<button class="opt ${c}" onclick="${click}(${k})"><span class="L">${L[k]}</span><span>${esc(o.j)}<div class="zh">${esc(o.z)}</div></span></button>`}).join("")}`;
}
function resHtml(q,sel){const ok=isOk(q,sel);return`<div class="res ${ok?'ok':'ng'}"><div class="h">${ok?'○ 正解':'× 不正解'}　正解：${q.a.map(x=>L[x]).join("・")}</div><div>${esc(q.e)}</div><div class="ej">📌 ${esc(q.ej)}</div></div>`}
function starBtn(id){return`<button class="star ${S.bm.includes(id)?'on':''}" onclick="toggleBm('${id}',this)">★</button>`}
function toggleBm(id,el){if(S.bm.includes(id))S.bm=S.bm.filter(x=>x!==id);else S.bm.push(id);save();el.classList.toggle("on")}
function drawPr(){const q=QM[PR.ids[PR.i]];
  M().innerHTML=`<div class="qh"><span>${esc(PR.title)} ・ ${PR.i+1}/${PR.ids.length}</span><span>D${q.d} ・ ${q.t} ${starBtn(q.id)}</span></div>
  <div class="card">${qHtml(q,PR.sel,PR.shown,"prPick")}${PR.shown?resHtml(q,PR.sel):""}</div>
  <div class="row" style="justify-content:space-between"><button class="btn g" onclick="nav('prac')">終了</button>
  ${PR.shown?`<button class="btn" onclick="prNext()">${PR.i<PR.ids.length-1?'次へ →':'結果を見る'}</button>`:`<button class="btn" ${PR.sel.length!==q.n?'disabled':''} onclick="prCheck()">解答する</button>`}</div>`}
function prPick(k){if(PR.shown)return;const q=QM[PR.ids[PR.i]];if(q.n===1)PR.sel=[k];else{PR.sel=PR.sel.includes(k)?PR.sel.filter(x=>x!==k):PR.sel.length<q.n?PR.sel.concat(k):PR.sel}drawPr()}
function prCheck(){const q=QM[PR.ids[PR.i]];PR.shown=true;const ok=isOk(q,PR.sel);if(ok)PR.ok++;record(q.id,ok);drawPr()}
function prNext(){if(PR.i<PR.ids.length-1){PR.i++;PR.sel=[];PR.shown=false;drawPr();window.scrollTo(0,0)}else{M().innerHTML=`<h2>${esc(PR.title)}</h2><div class="card" style="text-align:center"><div class="big">${PR.ok}/${PR.ids.length}</div><div class="mute">正解率 ${Math.round(PR.ok/PR.ids.length*100)}%</div></div><div class="row"><button class="btn" onclick="nav('prac')">練習に戻る</button><button class="btn s" onclick="nav('stats')">成績を見る</button></div>`}}

let MK=null;
V.mock=()=>{const wrong=QS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last).length;
  M().innerHTML=`<h2>模試</h2>
  <div class="card"><b>本番模試</b>　60問 / 120分<div class="mute">ドメイン配点どおりに出題（D1 8・D2 13・D3 7・D4 10・D5 7・D6 9・D7 6）。終了まで正誤は表示されません。<span class="zhb">按正式权重出题，交卷后才显示结果。</span></div><button class="btn" style="margin-top:8px" onclick="startMock('full')">開始</button></div>
  <div class="card"><b>ミニ模試</b>　20問 / 40分<div class="mute">短時間で全ドメインを確認。</div><button class="btn s" style="margin-top:8px" onclick="startMock('mini')">開始</button></div>
  <div class="card"><b>弱点模試</b>　最大20問 / 1問2分<div class="mute">間違えた問題から出題（現在 ${wrong} 問）。</div><button class="btn s" style="margin-top:8px" ${wrong?'':'disabled'} onclick="startMock('weak')">開始</button></div>
  ${S.mocks.length?`<div class="card"><b>模試の履歴</b><div class="list">${S.mocks.slice(-10).reverse().map(m=>`<div class="it"><b>${m.kind} ${m.ok}/${m.n}（${Math.round(m.ok/m.n*100)}%）</b><span class="mute">${new Date(m.date).toLocaleString()}</span></div>`).join("")}</div></div>`:""}
  <p class="mute">※ 本番のスコアは 100〜1,000 のスケールスコアで 720 以上が合格。正答率との換算は公表されていないため、本アプリでは安全側に「正答率 80% 以上」を目標にしています。</p>`};
function startMock(kind){let ids=[],min;
  if(kind==="weak"){ids=shuffle(QS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last)).slice(0,20).map(q=>q.id);min=ids.length*2}
  else{const plan=kind==="full"?MOCK60:MOCK20;for(const d in plan)ids=ids.concat(shuffle(QS.filter(q=>q.d==d)).slice(0,plan[d]).map(q=>q.id));ids=shuffle(ids);min=kind==="full"?120:40}
  MK={kind:{full:"本番模試",mini:"ミニ模試",weak:"弱点模試"}[kind],ids,sel:ids.map(()=>[]),i:0,end:Date.now()+min*60000,done:false,flag:[]};cur="mk";
  clearInterval(timerId);timerId=setInterval(tick,1000);drawMk()}
function stopMock(){clearInterval(timerId);timerId=null;MK=null}
function tick(){if(!MK||MK.done)return;const r=MK.end-Date.now();if(r<=0){finishMock(true);return}const el=$("#tm");if(el){el.textContent=fmt(r);if(r<300000)el.style.color="var(--ng)"}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function drawMk(){const q=QM[MK.ids[MK.i]],sel=MK.sel[MK.i];
  M().innerHTML=`<div class="qh"><span>${MK.kind} ・ ${MK.i+1}/${MK.ids.length}</span><span>残り <span class="timer" id="tm">${fmt(MK.end-Date.now())}</span></span></div>
  <div class="card">${qHtml(q,sel,false,"mkPick")}</div>
  <div class="row" style="justify-content:space-between"><button class="btn g" ${MK.i?'':'disabled'} onclick="mkGo(${MK.i-1})">← 前へ</button>
  <label class="mute"><input type="checkbox" ${MK.flag.includes(MK.i)?'checked':''} onchange="mkFlag()"> 見直し</label>
  ${MK.i<MK.ids.length-1?`<button class="btn" onclick="mkGo(${MK.i+1})">次へ →</button>`:`<button class="btn" onclick="finishMock()">提出する</button>`}</div>
  <div class="card" style="margin-top:12px"><div class="grid">${MK.ids.map((id,k)=>`<button class="${MK.sel[k].length?'a':''} ${k===MK.i?'c':''}" onclick="mkGo(${k})">${MK.flag.includes(k)?'🚩':''}${k+1}</button>`).join("")}</div>
  <div class="row" style="margin-top:10px;justify-content:space-between"><span class="mute">解答済み ${MK.sel.filter(s=>s.length).length}/${MK.ids.length}</span><button class="btn s" onclick="finishMock()">提出する</button></div></div>`}
function mkPick(k){const q=QM[MK.ids[MK.i]];let s=MK.sel[MK.i];if(q.n===1)s=[k];else s=s.includes(k)?s.filter(x=>x!==k):s.length<q.n?s.concat(k):s;MK.sel[MK.i]=s;drawMk()}
function mkGo(k){MK.i=k;drawMk();window.scrollTo(0,0)}
function mkFlag(){MK.flag=MK.flag.includes(MK.i)?MK.flag.filter(x=>x!==MK.i):MK.flag.concat(MK.i)}
function finishMock(auto){if(!auto){const un=MK.sel.filter(s=>!s.length).length;if(!confirm(un?`未解答が ${un} 問あります。提出しますか？`:"提出しますか？"))return}
  clearInterval(timerId);MK.done=true;let ok=0;const by={};
  MK.ids.forEach((id,k)=>{const q=QM[id],r=isOk(q,MK.sel[k]);if(r)ok++;record(id,r);by[q.d]=by[q.d]||[0,0];by[q.d][1]++;if(r)by[q.d][0]++});
  S.mocks.push({kind:MK.kind,ok,n:MK.ids.length,date:Date.now(),by});save();MK.ok=ok;MK.by=by;drawMkRes(auto)}
function drawMkRes(auto){const p=Math.round(MK.ok/MK.ids.length*100);
  M().innerHTML=`<h2>${MK.kind} 結果</h2>${auto?'<p class="mute">時間切れで自動提出しました。</p>':''}
  <div class="card" style="text-align:center"><div class="big" style="color:${p>=80?'var(--ok)':p>=70?'var(--warnb)':'var(--ng)'}">${p}%</div><div>${MK.ok}/${MK.ids.length} 正解</div><div class="mute">${p>=80?'合格圏！この調子で':p>=70?'あと少し。弱点ドメインを復習しよう':'まずはノートとドメイン別練習で基礎固めを'}</div></div>
  <div class="card"><b>ドメイン別</b>${Object.keys(MK.by).sort().map(d=>{const [a,n]=MK.by[d];return`<div style="margin-top:8px">D${d} ${DN[d][0]} <span class="mute">${a}/${n}</span></div><div class="bar"><i style="width:${a/n*100}%;background:${a/n>=.8?'var(--ok)':a/n>=.6?'var(--warnb)':'var(--ng)'}"></i></div>`}).join("")}</div>
  <div class="card"><b>解答の見直し</b><div class="grid" style="margin-top:8px">${MK.ids.map((id,k)=>`<button class="${isOk(QM[id],MK.sel[k])?'ok':'ng'}" onclick="mkRev(${k})">${k+1}</button>`).join("")}</div></div>
  <div class="row"><button class="btn" onclick="MK=null;nav('mock')">模試メニューへ</button></div>`}
function mkRev(k){const q=QM[MK.ids[k]],sel=MK.sel[k];
  M().innerHTML=`<div class="qh"><span>${MK.kind} 見直し ${k+1}/${MK.ids.length}</span><span>D${q.d} ・ ${q.t} ${starBtn(q.id)}</span></div>
  <div class="card">${qHtml(q,sel,true,"void")}${resHtml(q,sel)}</div>
  <div class="row" style="justify-content:space-between"><button class="btn g" ${k?'':'disabled'} onclick="mkRev(${k-1})">← 前へ</button><button class="btn s" onclick="drawMkRes()">結果に戻る</button><button class="btn g" ${k<MK.ids.length-1?'':'disabled'} onclick="mkRev(${k+1})">次へ →</button></div>`;window.scrollTo(0,0)}

let CD=null;
V.cards=()=>{const known=S.cardk.length;
  M().innerHTML=`<h2>用語カード</h2><div class="card"><div class="mute">全 ${GLOSSARY.length} 語 ・ 覚えた ${known}</div>
  <div class="row" style="margin-top:8px"><button class="btn" onclick="startCards(false)">カード（全部）</button><button class="btn s" onclick="startCards(true)">まだ覚えていない語</button><button class="btn g" onclick="startCQ()">4択クイズ 10問</button></div></div>
  <div class="card"><div class="list">${GLOSSARY.map((g,i)=>`<div class="it"><b>${esc(g[0])} <span class="mute">${esc(g[1])}</span><div class="zh" style="display:block">${esc(g[2])}</div></b>${S.cardk.includes(i)?'<span class="chk">✓</span>':''}</div>`).join("")}</div></div>`};
function startCards(onlyNew){let idx=GLOSSARY.map((_,i)=>i);if(onlyNew)idx=idx.filter(i=>!S.cardk.includes(i));if(!idx.length){alert("全部覚えました！");return}CD={idx:shuffle(idx),i:0,flip:false};drawCard()}
function drawCard(){const g=GLOSSARY[CD.idx[CD.i]];
  M().innerHTML=`<div class="qh"><span>用語カード ${CD.i+1}/${CD.idx.length}</span><button class="btn g" onclick="nav('cards')">終了</button></div>
  <div class="card flash" onclick="CD.flip=!CD.flip;drawCard()">${CD.flip?`<div class="w">${esc(g[2])}</div><div class="en">${esc(g[0])} / ${esc(g[1])}</div>`:`<div class="w">${esc(g[0])}</div><div class="en">${esc(g[1])}</div><div class="mute" style="margin-top:14px">タップで意味を表示</div>`}</div>
  <div class="row" style="justify-content:space-between"><button class="btn g" onclick="cdNext(false)">まだ</button><button class="btn" onclick="cdNext(true)">覚えた ✓</button></div>`}
function cdNext(k){const i=CD.idx[CD.i];if(k&&!S.cardk.includes(i))S.cardk.push(i);if(!k)S.cardk=S.cardk.filter(x=>x!==i);save();if(CD.i<CD.idx.length-1){CD.i++;CD.flip=false;drawCard()}else nav('cards')}
let CQ=null;
function startCQ(){CQ={items:shuffle(GLOSSARY.map((_,i)=>i)).slice(0,10),i:0,ok:0,ans:null};drawCQ()}
function drawCQ(){const gi=CQ.items[CQ.i];if(!CQ.opts)CQ.opts=shuffle([gi].concat(shuffle(GLOSSARY.map((_,i)=>i).filter(i=>i!==gi)).slice(0,3)));
  M().innerHTML=`<div class="qh"><span>用語クイズ ${CQ.i+1}/10</span><span>正解 ${CQ.ok}</span></div>
  <div class="card"><div class="qt">「${esc(GLOSSARY[gi][2])}」に当たる用語は？</div>${CQ.opts.map((o,k)=>{let c="";if(CQ.ans!==null){if(o===gi)c="ok";else if(o===CQ.ans)c="ng"}return`<button class="opt ${c}" onclick="cqPick(${o})"><span class="L">${L[k]}</span><span>${esc(GLOSSARY[o][0])}</span></button>`}).join("")}</div>
  ${CQ.ans!==null?`<div class="row" style="justify-content:flex-end"><button class="btn" onclick="cqNext()">${CQ.i<9?'次へ →':'終了'}</button></div>`:""}`}
function cqPick(o){if(CQ.ans!==null)return;CQ.ans=o;if(o===CQ.items[CQ.i])CQ.ok++;drawCQ()}
function cqNext(){if(CQ.i<9){CQ.i++;CQ.ans=null;CQ.opts=null;drawCQ()}else{alert(`10問中 ${CQ.ok} 問正解`);nav('cards')}}

V.stats=()=>{
  const wrongIds=QS.filter(q=>S.ans[q.id]&&!S.ans[q.id].last).map(q=>q.id);
  M().innerHTML=`<h2>成績・弱点</h2>
  <div class="card"><b>ドメイン別 正解率</b><span class="zhb mute">（按最近一次作答）</span>${Object.keys(DN).map(d=>{const ids=QS.filter(q=>q.d==d).map(q=>q.id),s=stat(ids),r=s.done?s.ok/s.done:0;return`<div style="margin-top:10px">D${d} ${DN[d][0]} <span class="mute">${s.done?Math.round(r*100)+'%':'—'} ・ 解答 ${s.done}/${s.n}</span></div><div class="bar"><i style="width:${r*100}%;background:${!s.done?'var(--line)':r>=.8?'var(--ok)':r>=.6?'var(--warnb)':'var(--ng)'}"></i></div>`}).join("")}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><b>間違えた問題 ${wrongIds.length}</b>${wrongIds.length?`<button class="btn s" onclick="startPractice(${JSON.stringify(wrongIds).replace(/"/g,"'")},'間違えた問題')">復習する</button>`:""}</div>
  <div class="row" style="justify-content:space-between;margin-top:10px"><b>★ お気に入り ${S.bm.length}</b>${S.bm.length?`<button class="btn s" onclick="startPractice(S.bm.slice(),'お気に入り')">復習する</button>`:""}</div></div>
  <div class="card"><b>バックアップ・引継ぎ</b><div class="mute">進捗は端末内に保存されています。ファイル更新前や端末変更時は書き出してメモ等に保存してください。<span class="zhb">（更新文件或换设备前，先导出备份。）</span></div>
  <div class="row" style="margin:8px 0"><button class="btn s" onclick="expo()">進捗を書き出す</button><button class="btn g" onclick="impo()">読み込む</button><button class="btn g" onclick="resetAll()">リセット</button></div>
  <textarea id="bk" placeholder="ここに書き出し／貼り付け"></textarea></div>
  <p class="mute">問題 ${QS.length} 問 ・ 用語 ${GLOSSARY.length} 語 ・ 出典：Anthropic 公式 Exam Guide v1.0 の出題範囲に基づくオリジナル問題（非公式・個人学習用）</p>`};
function expo(){const t=$("#bk");t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();try{navigator.clipboard.writeText(t.value);alert("コピーしました")}catch(e){}}
function impo(){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o.ans)throw 0;S=Object.assign(S,o);save();alert("読み込みました");V.stats()}catch(e){alert("読み込めませんでした")}}
function resetAll(){if(confirm("すべての進捗を消去しますか？")){S={ans:{},bm:[],read:[],mocks:[],zh:S.zh,cardk:[]};save();V.stats()}}

applyZh();nav("home");
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
