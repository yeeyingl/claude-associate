<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Claude Associate ノート</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 学習ノート — 単一カラム（最大 760px）、上部に固定ヘッダー、下部にタブバー。日本語は JP 書体、中文は SC 書体、重要語は蛍光ペン風 */
:root{
  --paper:#f5f7f6;--card:#ffffff;--ink:#1e2a2e;--mute:#62727a;--line:#dce4e2;
  --accent:#0d7a6f;--accent-ink:#ffffff;--accent-soft:#ddefeb;--marker:#fff0a3;
  --ok:#23824a;--ok-soft:#e1f2e7;--ng:#bf3b2e;--ng-soft:#fbe5e2;--tip:#e8f1f8;--tip-line:#3f7fb3;--warn:#fcf2df;--warn-line:#c98a1d;
  --f-ja:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131a1c;--card:#1b2427;--ink:#e4ebe9;--mute:#94a3a7;--line:#2b3739;--accent:#4dc1b1;--accent-ink:#0b1f1c;--accent-soft:#183531;--marker:rgba(255,214,77,.24);--ok:#5cc286;--ok-soft:#173023;--ng:#f07c6f;--ng-soft:#3a201d;--tip:#172734;--tip-line:#6aa5d4;--warn:#2f2717;--warn-line:#d9a548;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#131a1c;--card:#1b2427;--ink:#e4ebe9;--mute:#94a3a7;--line:#2b3739;--accent:#4dc1b1;--accent-ink:#0b1f1c;--accent-soft:#183531;--marker:rgba(255,214,77,.24);--ok:#5cc286;--ok-soft:#173023;--ng:#f07c6f;--ng-soft:#3a201d;--tip:#172734;--tip-line:#6aa5d4;--warn:#2f2717;--warn-line:#d9a548;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:16px/1.7 var(--f-ja);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.zh,[lang="zh-CN"]{font-family:var(--f-zh)}
.j{font-family:var(--f-ja);font-weight:700;background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 1px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header img{width:30px;height:30px;border-radius:8px;flex:none}
header h1{font-size:16px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:4px 12px;font:500 13px var(--f-zh);flex:none}
.tg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
main>*{margin:0;min-width:0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 7px;font:500 11px var(--f-ja);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
h2{font-size:21px;line-height:1.4;margin:0;text-wrap:balance}
h3{font-size:17px;margin:0}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font:700 15px var(--f-ja);cursor:pointer}
.btn.s{background:var(--accent-soft);color:var(--accent)}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.4}
.btn:focus-visible,.opt:focus-visible,nav button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mute{color:var(--mute);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.it:last-child{border-bottom:0}.it .b{flex:1;min-width:0}
.tag{flex:none;font:700 12px var(--f-num);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.chk{color:var(--ok);font-weight:700}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:4;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font:500 13px var(--f-ja);cursor:pointer;white-space:nowrap}
.chip.done{border-color:var(--ok);color:var(--ok)}
.sec{scroll-margin-top:110px}
.sech{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--accent);padding-bottom:6px}
.sech .n{font:700 15px var(--f-num);color:var(--accent)}
.note{font-family:var(--f-zh);font-size:15.5px;line-height:1.85}
.note p{margin:0}.note ul,.note ol{margin:0;padding-left:1.3em}.note li{margin:3px 0}
.note .j{font-weight:500}
.tw{overflow-x:auto;margin:0 -2px}
.tb{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}
.tb th,.tb td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.tb th{background:var(--accent-soft);font-weight:700}
.tip{background:var(--tip);border-left:3px solid var(--tip-line);padding:9px 12px;border-radius:0 8px 8px 0;list-style:none}
.warn{background:var(--warn);border-left:3px solid var(--warn-line);padding:9px 12px;border-radius:0 8px 8px 0;list-style:none}
pre{background:var(--paper);border:1px solid var(--line);padding:10px 12px;border-radius:8px;white-space:pre-wrap;font:13px/1.7 var(--f-ja);margin:6px 0}
code{font-size:13px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.qt{overflow-wrap:anywhere;font-size:17px;font-weight:500;line-height:1.75}
.zh{color:var(--mute);font-size:14.5px;line-height:1.7}
.pick{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-size:12.5px;border-radius:6px;padding:2px 9px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{overflow-wrap:anywhere;display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:15px/1.6 var(--f-ja);cursor:pointer}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 13px var(--f-num);margin-top:1px}
.opt .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .zh{font-size:13.5px}
.opt.sel{border-color:var(--accent)}.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);color:var(--card);border-color:var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}.opt.ng .L{background:var(--ng);color:var(--card);border-color:var(--ng)}
.res{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.res.ok{background:var(--ok-soft)}.res.ng{background:var(--ng-soft)}
.res .h{font-weight:700}.res.ok .h{color:var(--ok)}.res.ng .h{color:var(--ng)}
.res .e{font-family:var(--f-zh);font-size:15px;line-height:1.8}
.ej{font-weight:700;color:var(--accent)}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--line);padding:0 2px;cursor:pointer}.star.on{color:#e0a800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 0;font:500 13px var(--f-num);cursor:pointer}
.grid button.a{background:var(--accent-soft)}.grid button.c{outline:2px solid var(--accent)}
.grid button.ok{background:var(--ok-soft);color:var(--ok)}.grid button.ng{background:var(--ng-soft);color:var(--ng)}
.timer{font:700 15px var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.big{font:800 44px/1.1 var(--f-num)}
.center{align-items:center;text-align:center}
.flash{min-height:210px;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-size:24px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--card);display:flex;gap:4px;align-items:center}
select,input[type=number],textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink)}
textarea{width:100%;height:88px;font-size:12px}
.hidezh .zh,.hidezh .zhb{display:none}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,20,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:380px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px}
ol.steps{margin:0;padding-left:1.3em}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media (min-width:700px){.qt{font-size:18px}}
</style>
</head>
<body>

<div id="app" lang="ja">
<header><img src="icon-192.png" alt=""><h1>Claude Associate ノート</h1><button class="tg on" id="zhbtn" type="button" lang="zh-CN">中文 ON</button></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="ov"></div>
</div>
<script>
// 要点ノート：中文为主，<b class=j> 为考试日语原文用语
const NOTES = [
{d:0, ja:"試験概要と攻略", zh:"考试概况与攻略", secs:[
{t:"0.1", ja:"試験の基本情報", zh:"考试基本信息", h:`
<div class=tw><table class=tb>
<tr><th>项目</th><th>内容</th></tr>
<tr><td>考试代码</td><td>CCAO-F（Claude Certified Associate – Foundations）</td></tr>
<tr><td>题数 / 时间</td><td>60 题 / 120 分钟（平均每题 2 分钟）</td></tr>
<tr><td>题型</td><td><b class=j>単一選択</b>（4选1）＋<b class=j>複数選択</b>（题目会写明选几个，如「2つ選択」）</td></tr>
<tr><td>合格线</td><td>スケールスコア <b>720</b> / 100〜1,000</td></tr>
<tr><td>语言</td><td>2026年10月起可选日语</td></tr>
<tr><td>形式</td><td>Pearson VUE 在线监考或考试中心</td></tr>
<tr><td>有效期</td><td>12 个月，期满前通过免费在线更新测试即可续期</td></tr>
<tr><td>重考</td><td>第1次不合格后等14天，第2次后30天，第3次后90天；12个月内最多4次</td></tr>
</table></div>
<p>成绩单会给出各 Domain 的正确率，但合格与否只看总分。</p>`},
{t:"0.2", ja:"出題ドメインと配点", zh:"出题领域与权重", h:`
<div class=tw><table class=tb>
<tr><th>#</th><th>Domain</th><th>权重</th><th>约题数</th></tr>
<tr><td>1</td><td>プロンプト設計とタスク実行<br><small>Prompting and Task Execution</small></td><td>14%</td><td>8〜9</td></tr>
<tr><td>2</td><td>出力の評価と検証<br><small>Output Evaluation and Validation</small></td><td><b>21%</b></td><td>12〜13</td></tr>
<tr><td>3</td><td>製品・モデル選定<br><small>Product and Model Selection</small></td><td>12%</td><td>7</td></tr>
<tr><td>4</td><td>ワークフロー統合とソリューション設計<br><small>Workflow Integration and Solution Design</small></td><td>16%</td><td>9〜10</td></tr>
<tr><td>5</td><td>設定とナレッジ管理<br><small>Configuration and Knowledge Management</small></td><td>12%</td><td>7</td></tr>
<tr><td>6</td><td>ガバナンス・リスク・責任ある利用<br><small>Governance, Risk, and Responsible Use</small></td><td>15%</td><td>9</td></tr>
<tr><td>7</td><td>トラブルシューティングと最適化<br><small>Troubleshooting and Optimization</small></td><td>10%</td><td>6</td></tr>
</table></div>
<p class=tip>D2（出力验证）+ D6（治理）= 36%，是“判断题”的核心：<b>先验证、守规则、该找人时找人</b>。</p>`},
{t:"0.3", ja:"正解を選ぶ原則", zh:"选正确答案的通用原则", h:`
<p>本考试几乎全是“业务场景 + <b class=j>最も適切な行動は？</b>”。正确答案通常符合下面的思路：</p>
<ol>
<li><b>用一手资料验证</b>，不相信 Claude 的“自信程度”（<b class=j>確信度の自己申告は根拠にならない</b>）。</li>
<li><b>符合组织政策</b>：先匿名化/删除个人信息再上传，而不是“告诉 Claude 别记住”。</li>
<li><b>适度</b>：既不“原样照用”，也不“干脆放弃 AI”。正确答案通常是“带安全措施继续做”。</li>
<li><b>人机分工</b>：高风险（法律、医疗、财务、人事、对外发布）一定有<b class=j>人によるレビュー</b>。</li>
<li><b>匹配任务</b>：简单大量用快速便宜的模型，复杂推理用高性能模型；简单查询不用 Research。</li>
<li><b>找根因</b>：输出不好时，先改善指示（目的、背景、格式、例子），而不是换平台或只改语气。</li>
<li><b>知道边界</b>：API 集成、企业级架构、Agent 开发 → <b class=j>エスカレーション</b>给 Architect / Developer。</li>
</ol>
<p class=warn>常见错误选项：「Claudeが自信を持っているのでそのまま送る」「表現をフォーマルにするだけ」「AIの利用を全面禁止」「別のAIに乗り換える」「最上位モデルを常に使う」。</p>`},
{t:"0.4", ja:"AI Fluency 4D フレームワーク", zh:"AI Fluency 4D 框架", h:`
<p>Anthropic 的 AI 素养框架，是本考试的思想基础。</p>
<div class=tw><table class=tb>
<tr><th>4D</th><th>含义</th><th>对应 Domain</th></tr>
<tr><td><b class=j>Delegation</b>（委任）</td><td>判断这项工作是否、何时、如何交给 AI，哪些必须由人来做</td><td>D3, D4, D6</td></tr>
<tr><td><b class=j>Description</b>（記述）</td><td>清楚描述目标、背景、约束、格式，也就是写好提示词</td><td>D1, D5</td></tr>
<tr><td><b class=j>Discernment</b>（識別）</td><td>判断输出是否准确、相关、适合用途</td><td>D2, D7</td></tr>
<tr><td><b class=j>Diligence</b>（責任・誠実さ）</td><td>对 AI 的使用负责：验证、透明披露、考虑对下游的影响</td><td>D2, D6</td></tr>
</table></div>
<p>三种协作模式：<b class=j>Automation</b>（让 AI 执行明确任务）/ <b class=j>Augmentation</b>（人和 AI 一起思考创作）/ <b class=j>Agency</b>（让 AI 在一定范围内自主行动）。</p>`}
]},

{d:1, ja:"D1 プロンプト設計とタスク実行", zh:"D1 提示词设计与任务执行（14%）", secs:[
{t:"1.1", ja:"効果的なプロンプトの作成", zh:"写出有效的提示词", h:`
<p>好的提示词＝把 Claude 当成<b>聪明但不了解情况的新同事</b>，把需要的信息全部告诉它。</p>
<div class=tw><table class=tb>
<tr><th>要素</th><th>日语</th><th>例</th></tr>
<tr><td>目的</td><td>目的・ゴール</td><td>「経営会議で予算承認を得るための要約」</td></tr>
<tr><td>背景</td><td>背景・コンテキスト</td><td>公司情况、已有讨论、前提</td></tr>
<tr><td>读者</td><td>読み手・対象者</td><td>高管、新员工、客户、技术人员</td></tr>
<tr><td>约束</td><td>制約</td><td>字数、语气、禁止事项、截止日期</td></tr>
<tr><td>格式</td><td>出力形式</td><td>表格、要点列表、JSON、邮件格式</td></tr>
<tr><td>示例</td><td>例示（few-shot）</td><td>给 1〜3 个好的例子</td></tr>
</table></div>
<p><b>技巧：</b></p>
<ul>
<li><b class=j>具体的に・明確に</b>：说“写 3 个要点，每个 50 字以内”，而不是“简短一点”。</li>
<li><b class=j>役割の付与</b>（ロールプロンプト）：「あなたは経験豊富な人事担当者です」。</li>
<li><b class=j>XMLタグで区切る</b>：<code>&lt;document&gt;…&lt;/document&gt;</code> 把资料和指示分开，减少混淆。</li>
<li>长资料<b>放在前面</b>，问题和指示放在后面。</li>
<li>允许它说不知道：「情報が不足している場合は推測せず、そう伝えてください」，可以减少幻觉。</li>
<li>说明<b>为什么</b>这么要求（理由），Claude 会更准确地理解意图。</li>
<li>告诉它“要做什么”比“不要做什么”更有效。</li>
</ul>`},
{t:"1.2", ja:"タスク分解", zh:"任务分解", h:`
<p>复杂的请求一次全部提出，容易出现遗漏、质量下降。要<b class=j>タスク分解</b>（task decomposition）。</p>
<ul>
<li><b class=j>プロンプトチェーン</b>：前一步的输出作为下一步的输入。例：①提取要点 → ②整理结构 → ③写初稿 → ④按读者修改。</li>
<li>每一步都能单独检查，<b>出问题时容易定位是哪一步</b>。</li>
<li>先让 Claude 制定计划或大纲，人确认后再执行。</li>
<li><b class=j>段階的に考えさせる</b>（让它一步步思考）：复杂分析时让 Claude 先写出推理过程，精度会提高。也可以用 Extended thinking。</li>
<li>适合分解的情况：多个资料比较、长文档制作、多步分析、需要不同风格的多个产出。</li>
</ul>
<p class=tip>考试判断：如果输出“遗漏多、质量不稳定”，并且原因是“一个提示词塞了太多任务”，正确答案就是“分成多个步骤”。</p>`},
{t:"1.3", ja:"プロンプトの反復改善", zh:"迭代改进提示词", h:`
<ul>
<li>第一次的输出不理想很正常，要<b class=j>反復（イテレーション）</b>。</li>
<li>改进时要<b>具体反馈</b>：「第2段落は専門用語が多いので、新入社員向けに言い換えて」，比「もっと良くして」有效得多。</li>
<li>先<b>诊断原因</b>：是缺背景？目的不清？格式没指定？例子不对？然后改提示词中对应的部分。</li>
<li>一次只改一个地方，比较效果（像 A/B 测试）。</li>
<li>好的提示词要<b>保存成模板</b>，或写进 Project 指示里重复使用。</li>
<li>对话越来越长、偏离方向时，与其继续修补，不如<b>整理好提示词，开新对话</b>。</li>
</ul>`},
{t:"1.4", ja:"タスク種別に応じた戦略", zh:"按任务类型调整策略", h:`
<div class=tw><table class=tb>
<tr><th>任务类型</th><th>提示词要点</th></tr>
<tr><td><b class=j>分析</b></td><td>提供数据、说明分析角度和评价标准，让它先写推理过程，要求给出依据，并区分事实和推测</td></tr>
<tr><td><b class=j>調査（リサーチ）</b></td><td>需要最新信息就开启 Web 搜索或 Research，要求附上出处，事后确认一手资料</td></tr>
<tr><td><b class=j>起草（ドラフト）</b></td><td>说明读者、语气、长度、目的，给出范文或模板，加入组织的风格规范</td></tr>
<tr><td><b class=j>ブレインストーミング</b></td><td>先追求数量和多样性，不急着评价。“请给出 20 个方案，包括非常规的”，然后再筛选评价</td></tr>
<tr><td>要約</td><td>说明用途和读者，指定长度，要求保留重要数字和结论</td></tr>
<tr><td>分类・抽取</td><td>给出明确的类别定义和例子，指定输出格式（表格/JSON）</td></tr>
</table></div>`}
]},

{d:2, ja:"D2 出力の評価と検証", zh:"D2 输出的评估与验证（21%・最重要）", secs:[
{t:"2.1", ja:"正確性・完全性の評価", zh:"评估准确性与完整性", h:`
<ul>
<li><b class=j>正確性</b>：事实、数字、引用是否正确。<b class=j>完全性</b>：是否覆盖了所有要求（对照原始需求逐项检查）。</li>
<li>用<b>检查清单</b>评估：目的达到了吗？必需项都有吗？数字和原始资料一致吗？读者能看懂吗？</li>
<li>摘要要和<b>原文对照</b>：有没有漏掉重要的条件、例外、数字？有没有原文里没有的内容？</li>
<li>Claude 的输出很流畅、看起来很专业，但<b>流畅≠正确</b>。</li>
</ul>`},
{t:"2.2", ja:"ハルシネーション・矛盾・バイアスの特定", zh:"识别幻觉、矛盾与偏见", h:`
<p><b class=j>ハルシネーション</b>：看起来合理但实际是错的或编造的内容。</p>
<p class=warn>重点留意：具体的<b>条文号、论文标题、URL、统计数字、人名、日期、判例</b>，这些越具体越要验证。</p>
<ul>
<li><b class=j>矛盾（不整合）</b>：前后数字不一致、合计对不上、同一份文档里结论互相冲突。</li>
<li><b class=j>バイアス</b>：只举某一方的观点、带刻板印象（性别、年龄、国籍）、用词带倾向、数据偏向特定群体。对策：要求列出多方观点、指定中立的评价标准、请多样的人来评审。</li>
<li>Claude 的知识有<b class=j>知識のカットオフ</b>（训练截止日期），最新信息可能是旧的。</li>
<li>❌「Claudeに自分の確信度を評価させる」—— 自我评价<b>不能证明正确性</b>。</li>
</ul>`},
{t:"2.3", ja:"ファクトチェックと検証手法", zh:"事实核查与验证方法", h:`
<ul>
<li><b class=j>一次情報（一次資料）</b>验证：法律原文、官方统计、公司内部正式资料、原论文。</li>
<li>要求 Claude <b>附上出处和引用</b>，然后<b>人去确认</b>出处是否存在、内容是否一致。</li>
<li>基于上传的资料回答时：要求<b>先摘录相关原文，再回答</b>（引用优先），方便核对。</li>
<li>数字计算用代码执行来验证，或手工复算。</li>
<li>交叉验证（クロスチェック）：多个独立来源一致吗？</li>
<li>Web 搜索和 Research 提供引用，但<b>引用本身也要打开确认</b>。</li>
</ul>`},
{t:"2.4", ja:"人によるレビューが必要な場面", zh:"什么时候必须人工审核", h:`
<p><b class=j>ヒューマン・イン・ザ・ループ</b>（Human-in-the-loop）：重要判断一定由人来做最终确认。</p>
<div class=tw><table class=tb>
<tr><th>必须人工审核/专家确认</th><th>风险较低</th></tr>
<tr><td>法律・合规・合同<br>医疗・健康<br>财务・投资・会计数字<br>人事评价・录用<br>对外发布（客户、媒体、监管）<br>影响很多人的决定</td><td>内部头脑风暴<br>个人笔记整理<br>初稿（之后还会修改）<br>格式转换</td></tr>
</table></div>
<ul>
<li>风险越高、越难恢复、读者越多 → 验证越严格。</li>
<li>Claude 是<b>辅助</b>，<b>最终责任在人</b>（Diligence）。</li>
</ul>`},
{t:"2.5", ja:"読み手に合わせた編集・比較", zh:"按读者编辑、比较输出", h:`
<ul>
<li>同一内容，按读者改写：高管→结论先行、简洁；技术人员→详细准确；客户→礼貌、避免内部术语；新人→解释术语。</li>
<li>让 Claude 生成<b>多个版本</b>，比较后选择或组合。</li>
<li>评估时要有<b>明确的评价标准</b>（准确性、清晰度、语气、长度），而不是凭感觉。</li>
<li>Claude 的初稿是起点，<b>人要编辑</b>：加入组织特有的知识、确认事实、调整语气。</li>
</ul>`},
{t:"2.6", ja:"情報整理と出力形式の選択", zh:"整理信息与选择输出格式", h:`
<div class=tw><table class=tb>
<tr><th>形式</th><th>适合</th></tr>
<tr><td><b class=j>インライン</b>（对话中直接回答）</td><td>简短回答、解释、一次性的确认</td></tr>
<tr><td><b class=j>アーティファクト</b></td><td>需要反复编辑、单独保存或共享的成果：文档、代码、图表、简单应用、网页</td></tr>
<tr><td><b class=j>構造化データ</b>（表格、JSON、CSV）</td><td>需要比较、排序、导入其他工具（Excel 等）的信息</td></tr>
<tr><td>文件（docx / xlsx / pptx / pdf）</td><td>要发给别人、在 Office 里继续编辑</td></tr>
</table></div>
<p class=tip>判断依据：<b>用途、读者、之后要怎么用</b>。</p>`}
]},

{d:3, ja:"D3 製品・モデル選定", zh:"D3 产品功能与模型选择（12%）", secs:[
{t:"3.1", ja:"Claudeの製品機能の選択", zh:"选择合适的 Claude 功能", h:`
<div class=tw><table class=tb>
<tr><th>功能</th><th>是什么</th><th>什么时候用</th></tr>
<tr><td><b class=j>チャット</b></td><td>普通对话</td><td>一次性的问题、简单任务</td></tr>
<tr><td><b class=j>Projects（プロジェクト）</b></td><td>把指示、知识文件和对话集中在一起</td><td>反复进行的同类工作、团队共享背景、需要参考固定资料</td></tr>
<tr><td><b class=j>Artifacts（アーティファクト）</b></td><td>在单独面板显示的独立成果（文档、代码、图、应用），可迭代、共享</td><td>需要反复修改或分享的成果</td></tr>
<tr><td><b class=j>Research（リサーチ）</b></td><td>自主进行多轮搜索，生成附引用的报告，需要几分钟</td><td>需要多来源的深入调查。简单事实确认用它就过度了</td></tr>
<tr><td><b class=j>Web検索</b></td><td>获取最新信息并附引用</td><td>最新新闻、价格、法规的现状</td></tr>
<tr><td><b class=j>拡張思考（Extended thinking）</b></td><td>回答前进行更深的推理</td><td>复杂分析、多步推理，代价是更慢、用量更多</td></tr>
<tr><td><b class=j>コネクタ</b></td><td>连接 Google Drive、Gmail、Calendar 等外部服务</td><td>需要基于公司内部数据或个人数据回答</td></tr>
<tr><td><b class=j>Skills（スキル）</b></td><td>把操作步骤、模板、脚本打包，相关时自动加载</td><td>按固定格式重复的工作（报告格式、公司模板）</td></tr>
<tr><td>コード実行・ファイル作成</td><td>数据分析、画图、生成 Office 文件</td><td>处理 CSV/Excel，制作 pptx/docx</td></tr>
<tr><td><b class=j>スタイル</b></td><td>设定回答的语气和风格</td><td>统一的写作风格</td></tr>
</table></div>`},
{t:"3.2", ja:"モデルの違い（Haiku・Sonnet・Opus）", zh:"模型的区别", h:`
<div class=tw><table class=tb>
<tr><th>模型</th><th>特点</th><th>适合</th></tr>
<tr><td><b>Haiku</b></td><td>最快、最便宜</td><td>大量、简单、要求速度的任务：分类、短回复、简单摘要、数据抽取</td></tr>
<tr><td><b>Sonnet</b></td><td>性能与速度/成本平衡</td><td>大多数日常业务的<b>默认选择</b>：起草、分析、编程</td></tr>
<tr><td><b>Opus</b></td><td>最高性能，较慢、成本高</td><td>复杂推理、高难度分析、长时间多步任务、质量最重要的场合</td></tr>
</table></div>
<p class=warn>具体版本号会更新，考试考的是<b>选择思路</b>，不考版本号。</p>`},
{t:"3.3", ja:"タスク要件に応じたモデル選定", zh:"按任务需求选择模型", h:`
<ul>
<li>三个维度：<b class=j>コスト・速度・品質</b>。</li>
<li>❌「常に最上位モデルを使う」—— 浪费成本和时间。</li>
<li>❌「常に最安モデルを使う」—— 复杂任务质量不够。</li>
<li>✅ 先用标准模型试，质量不够再升级；大量处理时测试小模型是否够用。</li>
<li>同一个工作流里可以<b>按步骤分别选模型</b>（例：Haiku 分类 → Opus 深入分析重要案件）。</li>
</ul>`},
{t:"3.4", ja:"コンテキスト制限とメモリ", zh:"上下文限制与记忆", h:`
<p><b class=j>コンテキストウィンドウ</b>：Claude 一次能“看到”的信息总量（指示 + 文件 + 对话历史），相当于工作记忆。</p>
<ul>
<li>对话太长 → 早期内容被忽略、质量下降、达到上限。</li>
<li><b>什么时候开新对话（再開）</b>：话题变了、对话变长质量下降、前面有很多错误的尝试干扰。</li>
<li><b>要约（サマリー）</b>：让 Claude 总结目前的决定事项和要点，复制到新对话开头继续。</li>
<li><b>永続化</b>：长期使用的信息放进 Project 知识/指示，或使用记忆功能。</li>
</ul>
<div class=tw><table class=tb>
<tr><th>功能</th><th>要点</th></tr>
<tr><td><b class=j>メモリ</b></td><td>从过去对话中记住背景。个人方案默认开启；Team/Enterprise 由管理员开启。可以在设置里查看、编辑、关闭。每个 Project 的记忆是分开的</td></tr>
<tr><td>过去对话搜索</td><td>“Search and reference chats”：引用以前的对话</td></tr>
<tr><td><b class=j>シークレットチャット（Incognito）</b></td><td>不保存在历史中，不用于记忆。适合不想留下记录的一次性对话</td></tr>
</table></div>`}
]},

{d:4, ja:"D4 ワークフロー統合とソリューション設計", zh:"D4 业务流程整合与方案设计（16%）", secs:[
{t:"4.1", ja:"要件・ユースケースの分析", zh:"分析需求和用例", h:`
<ul>
<li>先弄清<b>业务问题</b>（课题），而不是先想“用 AI 做点什么”。</li>
<li>适合 Claude 的工作：重复性高、以文字为中心、有明确输入输出、可以由人检查结果。</li>
<li>不适合（或需要谨慎）：需要 100% 准确且无法验证、需要实时系统数据但没有连接、法律上必须由人判断。</li>
<li>用 Claude 帮忙<b>整理需求</b>：访谈记录 → 提取需求 → 分类 → 找出缺失点。</li>
<li>定义<b class=j>成功指標（KPI）</b>：节省的时间、质量、错误率、满意度。</li>
</ul>`},
{t:"4.2", ja:"調査・計画・プロセス最適化", zh:"调研、规划与流程优化", h:`
<ul>
<li>调研：用 Research / Web 搜索收集信息 → 用一手资料确认。</li>
<li>规划：让 Claude 拟定计划、找风险、列出依赖关系，人来决策。</li>
<li>流程优化：把现有流程写出来，让 Claude 找瓶颈、重复工作、可自动化的步骤。</li>
<li>先从<b>小规模试点</b>（パイロット）开始，衡量效果，再扩大。</li>
</ul>`},
{t:"4.3", ja:"ソリューション設計と反復", zh:"方案设计与迭代", h:`
<ul>
<li>Claude 可以帮忙做：方案比较、原型（Artifact 做简单的应用或模板）、文档化。</li>
<li>反复：做出来 → 用户反馈 → 改进。</li>
<li>Associate 的范围：Projects、提示词、Artifacts、连接器、Skills 等<b>现有功能的组合</b>。</li>
<li class=warn>需要 API 集成、自定义开发、企业级系统集成、Agent 设计 → <b class=j>Architect / Developer にエスカレーション</b>。</li>
</ul>`},
{t:"4.4", ja:"既存ワークフローへの統合", zh:"融入现有业务流程", h:`
<div class=tw><table class=tb>
<tr><th>方式</th><th>说明</th></tr>
<tr><td><b class=j>拡張（Augment）</b></td><td>保留现有流程，在某些步骤加入 Claude 辅助（例：会议记录 → 用 Claude 做摘要初稿 → 人确认）</td></tr>
<tr><td><b class=j>再設計（Redesign）</b></td><td>以 AI 为前提重新设计整个流程（例：从“人写初稿”变为“Claude 写初稿、人审阅”）</td></tr>
</table></div>
<ul>
<li>明确<b>谁在哪个环节检查</b>（人工检查点）。</li>
<li>为团队准备：共享 Project、标准提示词模板、使用指南、培训。</li>
<li>变更管理：说明目的，听取一线意见，逐步推进。</li>
</ul>`},
{t:"4.5", ja:"ステークホルダーへの価値と限界の説明", zh:"向利益相关者说明价值与局限", h:`
<ul>
<li><b>价值</b>：节省时间、提高质量的一致性、更快的初稿、更大规模的分析，最好用<b>实际数据</b>说明（试点结果）。</li>
<li><b>局限</b>：可能出现幻觉、知识有截止日期、需要人工验证、敏感数据的限制、不能替代专业判断。</li>
<li>❌ 夸大（“AI 能全部自动化”“不需要人工确认”）。</li>
<li>❌ 过度消极（“AI 不可靠所以不用”）。</li>
<li>✅ 诚实、平衡地说明，管理期望值。</li>
</ul>`}
]},

{d:5, ja:"D5 設定とナレッジ管理", zh:"D5 设置与知识管理（12%）", secs:[
{t:"5.1", ja:"Projectsの指示とナレッジ設定", zh:"设置 Project 的指示和知识", h:`
<ul>
<li><b class=j>プロジェクト指示（カスタム指示）</b>：这个 Project 内所有对话都适用的规则。例如角色、读者、语气、格式、禁止事项、参考哪些资料。</li>
<li><b class=j>プロジェクトナレッジ</b>：上传的文件（规章、手册、模板、过去的成果）。Claude 回答时会参考。</li>
<li>知识量变大时会自动切换到<b>检索方式（RAG）</b>，可以容纳更多资料。</li>
<li>Team / Enterprise 可以<b>共享 Project</b>，设置权限（可查看/可编辑）。</li>
<li>一个 Project 一个目的，不要什么都放进同一个 Project（会互相干扰）。</li>
<li>资料要<b>有清楚的文件名和结构</b>，Claude 更容易找到正确的信息。</li>
</ul>`},
{t:"5.2", ja:"アップロード知識とコネクタの管理", zh:"管理上传的知识与连接器", h:`
<ul>
<li>上传前确认：是最新版本吗？有没有不该上传的机密/个人信息？有使用许可吗？</li>
<li>旧版本和新版本同时存在 → 回答会混乱。<b>删除旧版</b>，只保留正式最新版。</li>
<li><b class=j>コネクタ</b>（Google Drive、Gmail、Google Calendar 等，基于 MCP）：让 Claude 直接查看外部数据，不用每次上传。
<ul><li>Gmail：可以搜索、阅读、写草稿（发送由人来决定）。</li>
<li>Team / Enterprise：由管理员启用连接器。</li>
<li>Claude 只能访问<b>被授权的范围</b>，按<b class=j>最小権限</b>原则授权。</li>
<li>Claude 用连接器执行操作前需要用户确认。</li></ul></li>
<li>文件一直在更新 → 用连接器（查看最新版）比上传副本更合适。</li>
</ul>`},
{t:"5.3", ja:"システムレベル指示の作成", zh:"编写系统级指示", h:`
<ul>
<li>系统级指示（Project 指示、个人偏好、组织设置）对所有对话持续生效。</li>
<li>好的指示：<b>具体、简洁、有优先顺序</b>，说明理由，包含“不知道时怎么做”。</li>
<li>写法例：
<pre>役割：社内ITヘルプデスクの一次回答担当
対象：IT知識のない社員
ルール：
- 回答は添付の「社内ITガイド」に基づく
- ガイドにない場合は推測せず、ヘルプデスク窓口を案内する
- 箇条書き、300字以内</pre></li>
<li>每次都要重复说的内容 → 写进指示。只用一次的内容 → 写在对话里。</li>
<li>指示互相矛盾会导致输出不稳定，要定期检查。</li>
</ul>`},
{t:"5.4", ja:"設定・ナレッジ・指示の保守と更新", zh:"维护和更新设置、知识与指示", h:`
<ul>
<li>规章、价格、产品信息变更时，<b>及时替换知识文件</b>，更新指示。</li>
<li>指定<b>负责人</b>（オーナー），定期检查（例：每季度）。</li>
<li>记录变更（版本管理）：改了什么、为什么改。</li>
<li>更新后用<b>固定的测试问题</b>确认回答是否正确（回归检查）。</li>
<li>听取用户反馈，改进指示。</li>
<li>Skills 也一样：模板变了就更新 Skill。</li>
</ul>`}
]},

{d:6, ja:"D6 ガバナンス・リスク・責任ある利用", zh:"D6 治理、风险与负责任使用（15%）", secs:[
{t:"6.1", ja:"適切・不適切なユースケース", zh:"合适与不合适的用例", h:`
<div class=tw><table class=tb>
<tr><th>适合</th><th>不合适 / 需要特别注意</th></tr>
<tr><td>起草、摘要、翻译初稿<br>头脑风暴<br>资料整理、分析辅助<br>学习、解释<br>流程改善建议</td><td>没有人工审核的最终决定（录用、解雇、贷款审批、医疗诊断）<br>违反政策处理个人信息<br>冒充真人、制造虚假评价<br>用于监视或歧视<br>未经验证就对外发布</td></tr>
</table></div>
<p>判断标准：<b>影响有多大？能否验证？能否挽回？是否符合政策和法律？</b></p>`},
{t:"6.2", ja:"データ機密性・規制・プライバシー", zh:"数据敏感性、法规与隐私", h:`
<ul>
<li>上传前先<b>确认数据分类</b>（公开/内部/机密/个人信息）和公司政策。</li>
<li>含个人信息 → <b class=j>匿名化・仮名化・マスキング</b>，删掉不需要的识别信息后再上传。</li>
<li class=warn>❌「アップロードしてClaudeに記憶しないよう指示する」—— 这不是政策上的控制手段。</li>
<li>❌「社内利用だから問題ない」—— 内部用也要遵守规定。</li>
<li>✅ 使用公司批准的方案（Team / Enterprise：商用条款，默认不用于模型训练，有管理员控制、SSO、审计日志等）。</li>
<li>个人方案：在设置中可以选择是否允许将数据用于训练。<b>工作数据不要放进个人账号</b>。</li>
<li>相关法规：个人信息保护法（日本 APPI）、GDPR、行业规定（金融、医疗）、著作权、出口管理。</li>
<li>他人的著作物：确认使用条件。</li>
</ul>`},
{t:"6.3", ja:"組織のAIポリシーとガバナンス", zh:"组织的 AI 政策与治理", h:`
<ul>
<li>遵守<b class=j>組織のAI利用ポリシー</b>：哪些工具已批准、哪些数据可以用、需要什么审批。</li>
<li>❌ 使用未经批准的工具（<b class=j>シャドーAI</b>）。</li>
<li>不确定时 → <b>问负责部门</b>（信息安全、法务、合规），而不是自己判断。</li>
<li>管理员可以控制：哪些功能/连接器开放、成员权限、数据保留、审计。</li>
<li>发现问题（数据泄露风险、错误使用）→ 按规定<b>报告</b>。</li>
<li><b class=j>透明性</b>：在需要时说明 AI 参与了内容制作。</li>
</ul>`},
{t:"6.4", ja:"AI利用の倫理的影響", zh:"AI 使用的伦理影响", h:`
<ul>
<li><b>公平</b>：注意输出中的偏见，评审时考虑不同群体。</li>
<li><b>透明</b>：不隐瞒 AI 的使用；不把 AI 生成内容当作人的原创发布到需要原创的地方。</li>
<li><b>责任</b>：AI 出错时，责任在使用并发布它的人和组织。</li>
<li><b>尊重人</b>：不用 AI 冒充真人、操纵他人、侵犯隐私。</li>
<li><b>对工作的影响</b>：说明 AI 是辅助，引入时考虑员工的技能培养。</li>
<li>著作权：生成内容是否和现有作品过于相似，要确认。</li>
</ul>`}
]},

{d:7, ja:"D7 トラブルシューティングと最適化", zh:"D7 故障排查与优化（10%）", secs:[
{t:"7.1", ja:"不調なプロンプト・出力の診断と解決", zh:"诊断和解决效果不好的提示词/输出", h:`
<div class=tw><table class=tb>
<tr><th>症状</th><th>可能原因</th><th>对策</th></tr>
<tr><td>太泛泛、不具体</td><td>缺少背景和目的</td><td>补充背景、读者、目的，提供例子</td></tr>
<tr><td>格式每次不同</td><td>没有指定格式</td><td>明确格式，提供模板/示例</td></tr>
<tr><td>漏掉部分要求</td><td>一次要求太多</td><td>任务分解；列出检查项</td></tr>
<tr><td>编造信息</td><td>资料不足、没允许说“不知道”</td><td>提供资料，要求引用，允许回答“不明”</td></tr>
<tr><td>忽略上传资料</td><td>资料太多、指示不清楚、有旧版本</td><td>指明参考哪个文件；整理知识；删除旧版</td></tr>
<tr><td>长对话后质量下降</td><td>上下文太长</td><td>总结后开新对话</td></tr>
<tr><td>语气不对</td><td>没说明读者和语气</td><td>说明读者，设定风格，给范文</td></tr>
<tr><td>答案过时</td><td>知识截止日期</td><td>开启 Web 搜索，提供最新资料</td></tr>
</table></div>
<p class=tip>原则：<b>先诊断原因，再针对性地修改</b>。“换个 AI”“只重复同一句话”都不是好答案。</p>`},
{t:"7.2", ja:"フィードバックと結果に基づく調整", zh:"根据反馈和结果调整", h:`
<ul>
<li>收集用户反馈（哪里不好用、哪里错了），反映到提示词/指示/知识中。</li>
<li>改进效果要<b>测量</b>：修改前后用相同的测试用例比较。</li>
<li>反复出现的问题 → 修改 Project 指示或模板，而不是每次手工修正。</li>
<li>如果超出自己的能力范围（需要开发、集成）→ 升级给专家。</li>
</ul>`},
{t:"7.3", ja:"ワークフローの効率化", zh:"优化工作流程效率", h:`
<ul>
<li>重复使用的提示词 → <b>模板化</b>，放进 Project 或 Skill。</li>
<li>简单大量的工作 → 用更快、更便宜的模型。</li>
<li>不要过度使用：简单问题不用 Research，不开不需要的扩展思考。</li>
<li>减少来回：一开始就提供完整的背景和格式要求。</li>
<li>多个任务批量处理（一次给多个文件，按统一格式输出）。</li>
<li>用连接器直接读取数据，省去手动复制粘贴。</li>
<li>衡量：花费的时间、修改次数、质量。</li>
</ul>`}
]}
];

const QS=[{"id":"d1-001","d":1,"t":"1.1","n":1,"q":"マーケティング担当者が「新製品の紹介文を書いて」とだけ依頼したところ、Claudeの出力は一般的で使いにくいものだった。次の依頼で最も効果的な改善はどれか。","qz":"市场负责人只说了“写一段新产品介绍”，Claude 的输出很笼统、不好用。下一次请求中最有效的改进是哪一个？","o":[{"j":"同じ依頼を数回繰り返し、良いものが出るまで再生成する","z":"重复同样的请求几次，直到生成满意的结果"},{"j":"対象読者、製品の特徴、トーン、文字数、使用媒体を明記して依頼する","z":"写明目标读者、产品特点、语气、字数和使用媒介后再请求"},{"j":"「もっと良い文章にして」と追加で指示する","z":"追加一句“写得更好一点”"},{"j":"より高性能なモデルに切り替え、同じ依頼文のまま複数回生成させて、最も出来の良いものを選んで使う","z":"切换到更高性能的模型，用同样的请求生成多次，选出效果最好的来使用"}],"a":[1],"e":"输出笼统的根本原因是请求缺少背景信息。明确读者、目的、约束和格式（Description）是最直接的改进。反复生成或“写得更好”都没有补充信息；换模型也不能弥补缺失的上下文，还增加成本。","ej":"曖昧な出力の原因は情報不足。読者・目的・制約・形式を明示する。"},{"id":"d1-002","d":1,"t":"1.1","n":1,"q":"人事担当者が、40ページの就業規則PDFを読み込ませた上で、育児休業に関する質問に答えさせたい。長文資料を使うプロンプトの構成として最も適切なものはどれか。","qz":"人事负责人想让 Claude 读取 40 页的就业规则 PDF，然后回答有关育儿假的问题。使用长篇资料时，提示词的结构最合适的是哪一个？","o":[{"j":"質問を先頭に書き、資料はプロンプトの最後に貼り付ける","z":"问题写在开头，资料贴在提示词最后"},{"j":"資料を要約せずに、質問だけを送る","z":"不提供资料，只发送问题"},{"j":"資料を先に置き、タグなどで区切った上で、質問と回答形式を最後に記述する","z":"先放资料并用标签等分隔，最后写问题和回答格式"},{"j":"資料の内容を自分の言葉で短く書き直し、要点だけにしてから質問と一緒に送ることで、Claudeが読む量を減らす","z":"先用自己的话把资料简短改写成要点，再和问题一起发送，以减少 Claude 需要读的内容"}],"a":[2],"e":"长文档的推荐做法是“资料在前、问题在后”，并用 XML 标签等清楚分隔资料和指示，这样回答质量更高。只发问题会让 Claude 凭一般知识回答；自己改写资料可能遗漏或歪曲关键条款。","ej":"長文資料は先頭に置き、質問は最後に。タグで区切る。"},{"id":"d1-003","d":1,"t":"1.1","n":1,"q":"営業チームの週報を毎週同じ形式でまとめたい。Claudeの出力形式がばらつく問題を最も確実に減らす方法はどれか。","qz":"想每周用相同格式汇总销售团队的周报。最能可靠地减少 Claude 输出格式不一致问题的方法是哪一个？","o":[{"j":"望ましい出力の見本(例)を1〜2件プロンプトに含める","z":"在提示词中加入 1～2 个理想输出的示例"},{"j":"毎回「前回と同じ形式で」とだけ書く","z":"每次只写“和上次格式一样”"},{"j":"出力後に担当者が毎回フォーマットを手作業で整え、整えた結果を社内共有フォルダに保存しておく","z":"输出后每次由负责人手动调整格式，并把调整结果保存到公司共享文件夹"},{"j":"温かみのあるトーンで書くよう指示する","z":"指示用温暖的语气书写"}],"a":[0],"e":"提供示例（few-shot）是统一格式最有效的手段之一。“和上次一样”在新对话里 Claude 看不到上次内容；手动修正没有解决根本问题；语气与格式一致性无关。","ej":"形式をそろえるには例示(few-shot)が有効。"},{"id":"d1-004","d":1,"t":"1.1","n":2,"q":"法務部門向けに契約書のリスク箇所を指摘させるプロンプトを作成している。出力の質を高めるために有効な工夫はどれか。2つ選べ。","qz":"正在为法务部门编写提示词，让 Claude 指出合同中的风险点。以下哪些做法能有效提高输出质量？请选择 2 项。","o":[{"j":"出力を長くするため「できるだけ多く指摘して」と指示する","z":"为了让输出更长，指示“尽可能多地指出问题”"},{"j":"「あなたは企業法務に詳しいレビュアーです」と役割と観点を与える","z":"给出角色和视角：“你是熟悉企业法务的审阅者”"},{"j":"できるだけ短いプロンプトにするため、背景説明を省く","z":"为了让提示词尽量简短，省略背景说明"},{"j":"「絶対に間違えないで」と強い言葉で繰り返す","z":"用强烈的语气反复说“绝对不要出错”"},{"j":"指摘ごとに該当条文の原文を引用させ、根拠を示させる","z":"让每个指出的问题都引用相应条款原文，说明依据"}],"a":[1,4],"e":"赋予角色与审阅视角能让分析更专业；要求引用原文作为依据，既提高准确性又便于人工核对。强调“绝不要出错”不会提高准确性；省略背景会降低质量；追求数量会混入无关或牵强的指出。","ej":"役割付与と原文引用(根拠提示)で質と検証性を上げる。"},{"id":"d1-005","d":1,"t":"1.1","n":1,"q":"社内向けFAQを作成する際、Claudeに不確かな内容を推測で書かれるのを避けたい。プロンプトに加えるべき指示として最も適切なものはどれか。","qz":"制作内部 FAQ 时，希望避免 Claude 凭猜测写出不确定的内容。提示词中最应该加入的指示是哪一个？","o":[{"j":"「必ずすべての質問に答えること」","z":"“必须回答所有问题”"},{"j":"「提供した資料に根拠がない場合は『資料に記載なし』と答えてよい」","z":"“如果所提供资料中没有依据，可以回答‘资料中未记载’”"},{"j":"「自信を持って断定的に書くこと」","z":"“要自信、断定地书写”"},{"j":"「資料にない内容は、一般常識や業界の慣例から推測して補い、FAQとして完成させてよい」","z":"“资料中没有的内容，可以根据一般常识或行业惯例推测补充，完成 FAQ”"}],"a":[1],"e":"明确允许 Claude 说“不知道/资料中没有”，能显著减少幻觉。强制回答所有问题、要求断定语气、允许用常识补充，都会增加编造内容的风险。","ej":"「わからなければそう言ってよい」と許可するとハルシネーションが減る。"},{"id":"d1-006","d":1,"t":"1.1","n":1,"q":"プロンプト内で、指示・参考資料・入力データが混ざってしまい、Claudeが資料中の文章を指示と誤解することがあった。最も有効な対策はどれか。","qz":"提示词中指示、参考资料和输入数据混在一起，Claude 有时把资料里的句子误当成指示。最有效的对策是哪一个？","o":[{"j":"資料を削除し、指示だけで依頼する","z":"删除资料，只用指示请求"},{"j":"指示・資料・データをすべて1つの段落にまとめ、プロンプト全体をできるだけ短く簡潔にする","z":"把指示、资料和数据全部合并成一段，让整个提示词尽量简短"},{"j":"全文を太字にして強調する","z":"把全文加粗强调"},{"j":"<instructions>や<document>などのタグで各部分を明確に区切る","z":"用 <instructions>、<document> 等标签明确分隔各部分"}],"a":[3],"e":"用 XML 标签等分隔指示、资料和数据，可让 Claude 清楚区分哪些是要执行的指示、哪些是要处理的内容。删除资料会丢失信息；合并成一段更混乱；加粗无法表达结构。","ej":"XMLタグで指示・資料・データを区切る。"},{"id":"d1-007","d":1,"t":"1.1","n":1,"q":"教育担当者が、新入社員向け研修資料の説明文をClaudeに作らせたい。対象者に合った出力を得るために最も重要な情報はどれか。","qz":"培训负责人想让 Claude 为新员工培训资料编写说明文字。为了得到适合对象的输出，最重要的信息是哪一个？","o":[{"j":"受講者の前提知識レベルと、研修後にできるようになってほしいこと","z":"学员的基础知识水平，以及培训后希望他们能做到什么"},{"j":"担当者自身の役職名","z":"负责人自己的职位名称"},{"j":"前年の研修資料のファイル名と作成者、保存場所、使用したテンプレートの種類","z":"去年培训资料的文件名、作者、保存位置以及所用模板的类型"},{"j":"使用しているパソコンのOS","z":"所使用电脑的操作系统"}],"a":[0],"e":"面向特定受众的内容，最关键的是受众的知识水平和学习目标，这决定了用词难度和详略。职位名称、文件名和操作系统对内容质量几乎没有帮助。","ej":"読み手の前提知識と目的を伝える。"},{"id":"d1-025","d":1,"t":"1.1","n":1,"q":"Claudeに「この企画は良いと思いますか?」と尋ねると、毎回肯定的な評価ばかり返ってくる。より批判的な検討を得るためのプロンプトとして最も適切なものはどれか。","qz":"问 Claude“你觉得这个企划好吗？”，每次都只得到正面评价。为了获得更有批判性的审视，最合适的提示词是哪一个？","o":[{"j":"「この企画は素晴らしいですよね?」と確認する","z":"确认“这个企划很棒吧？”"},{"j":"「良いと言ってください」と指示する","z":"指示“请说好”"},{"j":"評価をやめて、企画書の誤字脱字や表記ゆれだけを確認させ、内容には触れないよう指示する","z":"不再评估，只让它检查企划书的错漏字和用词不统一，指示不涉及内容"},{"j":"「懐疑的な審査員の立場で、弱点とリスクを重要度順に5つ挙げて」と依頼する","z":"请求“以怀疑型评审者的立场，按重要程度列出 5 个弱点和风险”"}],"a":[3],"e":"引导性问题容易得到迎合式回答。明确指定批判性角色和输出内容（弱点、风险、排序），能获得更有价值的审视。诱导性确认和要求说好会加重偏差；只查错字回避了问题。","ej":"批判的検討は役割と観点(弱点・リスク)を明示して求める。誘導質問は避ける。"},{"id":"d1-026","d":1,"t":"1.1","n":1,"q":"Claudeに出力してほしくない内容がある場合のプロンプトの書き方として、一般的に効果的なものはどれか。","qz":"当有不希望 Claude 输出的内容时，一般来说有效的提示词写法是哪一个？","o":[{"j":"「〜しないで」だけでなく、代わりにどうしてほしいかを肯定形で具体的に書く","z":"不只写“不要做～”，而是用肯定句具体写出希望它怎么做"},{"j":"禁止事項を大文字や記号で強調し、プロンプトの冒頭と末尾で何度も繰り返して書く","z":"用大写或符号强调禁止事项，并在提示词开头和结尾多次重复"},{"j":"禁止事項は書かず、出力後に削除する","z":"不写禁止事项，输出后再删除"},{"j":"禁止事項だけを並べ、目的は書かない","z":"只罗列禁止事项，不写目的"}],"a":[0],"e":"与其只说“不要”，不如说明“要怎样”以及原因，Claude 更容易照做。重复强调效果有限；事后删除效率低；只列禁止项而不说目的，Claude 难以把握意图。","ej":"「〜しない」より「代わりに〜する」と肯定形で具体的に。"},{"id":"d1-030","d":1,"t":"1.1","n":2,"q":"毎回同じ前提(会社の事業内容、文体ルール、禁止表現)を説明するのが手間になっている。効率と一貫性を高める方法として適切なものはどれか。2つ選べ。","qz":"每次都要说明同样的前提（公司业务、文体规则、禁用表达）很麻烦。以下哪些方法能提高效率和一致性？请选择 2 项。","o":[{"j":"毎回前提を省略し、Claudeに推測させる","z":"每次省略前提，让 Claude 自己推测"},{"j":"文体ルールや禁止表現をまとめた資料をプロジェクトナレッジとして登録する","z":"把文体规则和禁用表达整理成资料，登记为项目知识"},{"j":"前提をメモ帳に保存し、必要と感じたときだけ貼る","z":"把前提存在记事本里，觉得需要时才贴"},{"j":"前提をすべて1つのチャットに書き、そのチャットを何か月も使い続ける","z":"把前提全写在一个对话里，几个月一直用这个对话"},{"j":"Projectを作成し、共通の前提をプロジェクト指示に記載する","z":"创建 Project，把共同前提写入项目指示"}],"a":[1,4],"e":"反复使用的前提应放入 Project 的指示和知识中，所有对话自动共享，既省事又一致。省略前提靠猜会降低质量；一个对话用几个月会撑满上下文、质量下降；偶尔手动粘贴容易遗漏、不一致。","ej":"繰り返す前提はProjectの指示・ナレッジに置く。"},{"id":"d1-034","d":1,"t":"1.1","n":1,"q":"次のうち、プロンプトに「なぜその指示が必要か(理由)」を添えることの効果として最も適切なものはどれか。","qz":"以下哪一项最恰当地说明了在提示词中附上“为什么需要这个指示（理由）”的效果？","o":[{"j":"Claudeの応答速度が上がる","z":"Claude 的响应速度提高"},{"j":"理由を書くとClaudeがその理由を議論し始め、肝心の指示そのものが無視されやすくなる","z":"写了理由后 Claude 会开始讨论理由，关键的指示本身反而容易被忽视"},{"j":"Claudeが指示の意図を理解し、明記されていない状況でも適切に判断しやすくなる","z":"Claude 能理解指示的意图，即使在未写明的情况下也更容易做出恰当判断"},{"j":"出力が必ず短くなる","z":"输出一定变短"}],"a":[2],"e":"说明理由（例如“读者是视力较弱的高龄者，所以要用大字和短句”）能让 Claude 理解背后的目的，从而在未明确规定的地方也能做出符合意图的判断。它与速度、输出长度无关，也不会让指示被忽视。","ej":"指示に理由を添えると意図が伝わり、応用の効く出力になる。"},{"id":"d1-036","d":1,"t":"1.1","n":1,"q":"経理担当者が「この請求書をチェックして」とだけ依頼したところ、Claudeは誤字の指摘しか返さなかった。本来は金額・税率・支払期日の妥当性を確認したかった。最も効果的な改善はどれか。","qz":"会计人员只说了“检查一下这张发票”，Claude 只指出了错别字。本来想确认的是金额、税率和付款期限是否正确。最有效的改进是哪一个？","o":[{"j":"経理の専門用語を多く使った長い指示文に書き換え、Claudeが専門家として振る舞うよう促す","z":"改写成使用大量会计术语的长指示，促使 Claude 像专家一样行事"},{"j":"確認したい項目(金額の計算、税率、支払期日)と、問題があった場合の報告形式を明示する","z":"明确要确认的项目（金额计算、税率、付款期限）以及发现问题时的报告格式"},{"j":"「もっと丁寧に、細かいところまで全部しっかりチェックしてください」と念押しして同じ依頼を繰り返す","z":"再三强调“请更仔细、把细节全部认真检查”，重复同样的请求"},{"j":"請求書の画像を高解像度で撮り直し、プロンプトは変えずに再度アップロードして結果を比較する","z":"重新拍摄高分辨率的发票图片，不改提示词再次上传并比较结果"}],"a":[1],"e":"问题在于目的不明确：Claude 不知道要检查什么。明确检查项目和输出格式是根本对策。只是“更仔细”地重复，仍然没告诉它检查什么；换图片不能解决指示不清；堆砌术语也不等于说明了检查项目。","ej":"何を確認してほしいか(観点)と出力形式を具体的に書く"},{"id":"d1-037","d":1,"t":"1.1","n":1,"q":"広報担当者が、社長メッセージの草案をClaudeに依頼する。読み手は全社員で、テーマは来期の方針である。プロンプトに最も含めるべき情報の組み合わせはどれか。","qz":"公关人员请 Claude 起草社长致辞。读者是全体员工，主题是下一期的方针。提示词中最应该包含的信息组合是哪一个？","o":[{"j":"社長の経歴の詳細と、会社の創業からの歴史をすべて時系列で並べた資料","z":"社长履历的详细信息，以及按时间顺序排列的公司创业以来全部历史资料"},{"j":"来期方針の要点、読み手(全社員)、伝えたいトーン、おおよその長さ","z":"下一期方针的要点、读者（全体员工）、想传达的语气、大致长度"},{"j":"「感動的で心に残る文章にして」という一文のみ","z":"只写一句“写成感人、令人难忘的文章”"},{"j":"Claudeが過去に作った他社の社長メッセージの例と、文字数を最大限に増やすようにという指示","z":"Claude 以前写过的其他公司社长致辞示例，以及尽量增加字数的指示"}],"a":[1],"e":"起草任务需要内容要点、读者、语气和长度。其他公司的示例和“尽量加长”与目的无关；完整的履历和历史会产生大量无关信息；只有“感人”一句太抽象。","ej":"起草:要点・読み手・トーン・長さを伝える"},{"id":"d1-038","d":1,"t":"1.1","n":1,"q":"Claudeに顧客の声を分類させる際、分類の基準が人によって解釈が分かれ、結果が安定しない。最も有効な対策はどれか。","qz":"让 Claude 对客户声音进行分类时，分类标准因人而异，结果不稳定。最有效的对策是哪一个？","o":[{"j":"分類のカテゴリ数をできるだけ増やして、細かく分けられるようにしたうえで、判断はClaudeに任せる","z":"尽量增加类别数量以便细分，然后把判断交给 Claude"},{"j":"各カテゴリの定義と、それぞれに当てはまる具体例を数件プロンプトに含める","z":"在提示词中写入各类别的定义，以及每类几个具体示例"},{"j":"分類結果の正確性は気にせず、処理速度を優先して最も速いモデルで処理する","z":"不在意分类结果的准确性，优先速度，用最快的模型处理"},{"j":"毎回異なるメンバーが自由な言葉で依頼し、結果の中から最も良いものを採用する","z":"每次由不同成员用自由的语言提出请求，从结果中采用最好的"}],"a":[1],"e":"分类任务的关键是清晰的类别定义和示例（few-shot）。单纯增加类别会让边界更模糊；每次换人自由发挥会让结果更不稳定；放弃准确性不是解决方案。","ej":"分類:カテゴリの定義＋具体例(few-shot)"},{"id":"d1-039","d":1,"t":"1.1","n":1,"q":"Claudeに役割(ロール)を与えるプロンプトの例として、最も効果が期待できるものはどれか。","qz":"作为给 Claude 设定角色的提示词示例，最值得期待效果的是哪一个？","o":[{"j":"役割は与えず、「専門家っぽく」とだけ書く","z":"不设定角色，只写“像专家一样”"},{"j":"「あなたは何でも知っている専門家です。どんな質問にも必ず断定的に答え、わからないとは決して言わないでください。」(回答の迷いをなくすため)","z":"“你是无所不知的专家。无论什么问题都要断定地回答，绝对不要说不知道。”（为了让回答不再犹豫）"},{"j":"「あなたは世界最高のAIです。完璧な回答をしてください。」","z":"“你是世界上最好的 AI。请给出完美的回答。”"},{"j":"「あなたは中小企業向けの経験豊富な労務コンサルタントです。人事担当者の質問に、実務の注意点を添えて答えてください。」","z":"“你是一位面向中小企业、经验丰富的劳务顾问。请回答人事人员的问题，并附上实务注意事项。”"}],"a":[3],"e":"有效的角色设定要具体：领域、对象、回答方式。“世界最好”没有可执行的信息；强迫“绝不说不知道”会增加幻觉；“像专家一样”太模糊。","ej":"ロールは具体的に(専門分野・相手・答え方)"},{"id":"d1-040","d":1,"t":"1.1","n":2,"q":"社内規程の文書と、社員からの質問を同じプロンプトに入れる。Claudeが正しく区別できるようにする工夫として適切なものはどれか。2つ選べ。","qz":"把公司规章文档和员工的问题放在同一个提示词里。为了让 Claude 正确区分，以下哪些做法合适？请选择 2 项。","o":[{"j":"規程文書と質問を区切りなく続けて貼り付け、全文を読ませてから判断させる","z":"规章文档和问题不加分隔地连续粘贴，让它读完全文后判断"},{"j":"長い規程文書を先に置き、質問と指示をその後に書く","z":"把较长的规章文档放在前面，问题和指示写在后面"},{"j":"規程文書を<規程>…</規程>のようなタグで囲み、質問とは別に示す","z":"用 <規程>…</規程> 这样的标签包住规章文档，与问题分开"},{"j":"規程文書を要約せずにそのまま貼るのは避け、Claudeの知識だけで答えさせる","z":"避免原样粘贴规章，只用 Claude 的知识回答"},{"j":"質問を規程文書の途中に挿入し、関連箇所の近くに置いて読ませる","z":"把问题插入到规章文档中间，放在相关部分附近"}],"a":[1,2],"e":"用标签区分资料和指示，并把长资料放在前面、问题放在后面，是长文档提示的基本做法。不加分隔会混淆；把问题插在文档中间更容易漏看；只用 Claude 自身知识会脱离公司规章。","ej":"資料はタグで区切る/長文は先、質問は後"},{"id":"d1-041","d":1,"t":"1.1","n":1,"q":"Claudeに、提案書の弱点を指摘してほしい。Claudeが遠慮して肯定的な意見ばかり返すのを防ぐプロンプトとして、最も適切なものはどれか。","qz":"想让 Claude 指出提案书的弱点。为了防止 Claude 客气地只给肯定意见，最合适的提示词是哪一个？","o":[{"j":"肯定的な意見が出たら同じ質問を何度も繰り返し、否定的な意見が出るまで続ける","z":"如果得到肯定意见就反复问同一个问题，直到出现否定意见为止"},{"j":"「審査員の立場で、この提案が却下される可能性のある理由を重要度順に5つ挙げて」と依頼する","z":"请求“请站在评审的立场，按重要程度列出这个提案可能被否决的 5 个理由”"},{"j":"「辛口でお願いします」と一言添え、その他の条件は特に指定せずにClaudeの判断に任せる","z":"加一句“请严厉一点”，其他条件都不指定，交给 Claude 判断"},{"j":"「この提案書はとても良いと思うのですが、どうですか?」と聞く","z":"问“我觉得这份提案书非常好，你觉得呢？”"}],"a":[1],"e":"给出具体的视角（评审）和明确的输出（按重要度列出 5 个被否决的理由），能得到有建设性的批评。带有诱导的提问会得到附和；只说“严厉一点”太模糊；反复问到出现否定意见只是碰运气。","ej":"批判的検討は視点と出力を具体的に指定する"},{"id":"d1-042","d":1,"t":"1.1","n":1,"q":"Claudeに出力形式を指定する方法として、最も確実なものはどれか。","qz":"给 Claude 指定输出格式时，最可靠的方法是哪一个？","o":[{"j":"出力してほしい形式の見本(見出し・項目名・並び順)を示す","z":"给出想要的格式样本（标题、项目名、排列顺序）"},{"j":"形式はClaudeに任せ、出力後に人が毎回手作業で整形し直す運用にする","z":"格式交给 Claude，输出后每次由人工手动重新整理"},{"j":"前回の出力が良かったので、同じチャットの中なら特に指定しなくても毎回同じ形式になると考える","z":"上次的输出很好，所以认为在同一个对话里不指定也每次都会是同样格式"},{"j":"「見やすい形式で」と指示する","z":"指示“用容易看的格式”"}],"a":[0],"e":"给出样本模板最可靠。“容易看”很主观；对话中格式不一定保持一致；每次手工整理效率低，没有解决根本问题。","ej":"形式は見本(テンプレート)で示す"},{"id":"d1-043","d":1,"t":"1.1","n":1,"q":"Claudeに情報を求める際、「情報が足りない場合は質問してから作業を始めて」とプロンプトに加えた。この指示の主な効果はどれか。","qz":"向 Claude 请求时，在提示词中加了“如果信息不足，请先提问再开始工作”。这个指示的主要效果是哪一个？","o":[{"j":"Claudeがインターネット上で不足情報を自動的に検索するようになるので、手元の情報が少なくても回答できる","z":"Claude 会自动在互联网上搜索不足的信息，所以即使手头信息少也能回答"},{"j":"Claudeの回答速度が上がり、利用上限に達しにくくなる","z":"Claude 的回答速度提高，不容易达到使用上限"},{"j":"不足している前提をClaudeが推測で補うのを減らし、意図とのずれを防ぎやすくなる","z":"减少 Claude 用推测填补缺失的前提，更容易防止与意图的偏差"},{"j":"Claudeが常に完璧な回答を出すことが保証される","z":"保证 Claude 始终给出完美的回答"}],"a":[2],"e":"允许或要求先提问，可以减少 Claude 凭推测补全前提导致的偏差。它不会提高速度，也不能保证完美，更不会自动开启网络搜索。","ej":"不足情報は推測させず質問させる"},{"id":"d1-044","d":1,"t":"1.1","n":1,"q":"「専門用語を使わないで」という否定形の指示だけでは、Claudeの出力に専門用語が残ることがあった。最も効果的な言い換えはどれか。","qz":"只用“不要使用专业术语”这种否定形式的指示，Claude 的输出中有时仍会残留专业术语。最有效的改写是哪一个？","o":[{"j":"「中学生でも理解できる日常的な言葉で説明し、必要な用語には短い言い換えを添えて」と、望む状態を書く","z":"写出想要的状态：“用初中生也能理解的日常语言说明，必要的术语附上简短的解释”"},{"j":"専門用語の一覧を作り、それを全部使わないようにと伝えたうえで、さらにほかにも避けるべき語がないか考えさせる","z":"列出专业术语清单，告诉它全部不要用，并让它再想想还有没有其他该避免的词"},{"j":"「専門用語は絶対に、絶対に使わないで」と否定を強調し、大文字や記号で目立たせる","z":"强调否定：“绝对、绝对不要用专业术语”，并用大写或符号使其醒目"},{"j":"指示は変えずに、最上位モデルに切り替える","z":"不改指示，换成最高级的模型"}],"a":[0],"e":"告诉它“要做什么”（期望状态）比“不要做什么”更有效。只是强调否定效果有限；列清单方式繁琐且漏洞多；换模型不能代替清楚的指示。","ej":"「〜しないで」より「〜して」(望む状態)を書く"},{"id":"d1-045","d":1,"t":"1.1","n":1,"q":"人事部が採用面接の質問リストをClaudeに作らせる。職種は経理のマネージャーで、評価したい能力も決まっている。最も適切なプロンプトはどれか。","qz":"人事部让 Claude 制作招聘面试问题清单。职位是会计经理，想评估的能力也已确定。最合适的提示词是哪一个？","o":[{"j":"「職種:経理マネージャー。評価したい能力:チーム管理、決算業務の経験、改善提案力。各能力につき2問、評価の着眼点も添えて。」","z":"“职位：会计经理。想评估的能力：团队管理、决算业务经验、改善提案能力。每个能力 2 个问题，并附上评估着眼点。”"},{"j":"「応募者の年齢や家族構成も把握できるような質問も含めて、網羅的に作って」","z":"“也包括能了解应聘者年龄和家庭构成的问题，全面地做出来”"},{"j":"「一般的によく使われる面接の質問を、できるだけたくさん、あらゆる職種に使えるように作って」。汎用性が高ければ他の採用にも使い回せる","z":"“尽可能多地做一些通用的、任何职位都能用的常见面试问题”。通用性高的话，其他招聘也能重复使用"},{"j":"「面接の質問を考えて」","z":"“想一些面试问题”"}],"a":[0],"e":"写明职位、评估能力、数量和附加信息，才能得到可用的清单。只写一句太模糊；通用问题与目的不符；询问年龄、家庭构成可能涉及歧视，不合适。","ej":"職種・評価軸・数・付帯情報を具体的に"},{"id":"d1-046","d":1,"t":"1.1","n":1,"q":"プロンプトに背景情報(なぜこの資料が必要か、誰が使うか)を書く主な目的として、最も適切なものはどれか。","qz":"在提示词中写背景信息（为什么需要这份资料、谁会使用）的主要目的，最合适的是哪一个？","o":[{"j":"背景を書かないとClaudeは回答を拒否する仕組みになっているため","z":"因为不写背景 Claude 就会拒绝回答"},{"j":"Claudeが目的に合わせて内容の取捨選択や表現を判断できるようにするため","z":"让 Claude 能按目的判断内容的取舍和表达方式"},{"j":"プロンプトを長くするほど、Claudeの出力の正確性が自動的に保証されるため","z":"因为提示词越长，Claude 输出的准确性就自动得到保证"},{"j":"背景情報があれば、出力内容を人が確認する必要がなくなるため","z":"因为有了背景信息，人就不需要确认输出内容"}],"a":[1],"e":"背景信息帮助 Claude 理解意图，从而做出合适的取舍和表达。提示词长度本身不保证准确性；有背景也仍需人工确认；不写背景并不会被拒绝。","ej":"背景＝目的に沿った判断材料を与える"},{"id":"d1-047","d":1,"t":"1.1","n":2,"q":"営業部のメンバーが、提案資料の作成で毎回Claudeに同じ説明を書いている。プロンプトを効果的にするための工夫として適切なものはどれか。2つ選べ。","qz":"营业部成员制作提案资料时，每次都给 Claude 写同样的说明。为了让提示词更有效，以下哪些做法合适？请选择 2 项。","o":[{"j":"説明を毎回少しずつ変えて書き、Claudeが飽きないようにする","z":"每次稍微改变说明的写法，免得 Claude 厌倦"},{"j":"毎回の説明は省略し、「いつもの感じで」とだけ依頼する","z":"每次省略说明，只请求“照平常那样”"},{"j":"過去にうまくいった提案資料を例としてProjectに置き、参考にするよう指示する","z":"把过去成功的提案资料作为示例放进 Project，指示参考"},{"j":"良い出力が得られたプロンプトを、チームで共有できるテンプレートとして整理する","z":"把得到好结果的提示词整理成团队可以共享的模板"},{"j":"プロンプトは個人の工夫なので、他のメンバーとは共有しない","z":"提示词是个人的技巧，不与其他成员共享"}],"a":[2,3],"e":"模板化和提供成功示例可以提高效率和一致性。“照平常那样”在新对话里没有上下文；Claude 不会厌倦，随意改写只会降低一致性；不共享会造成质量差异。","ej":"良いプロンプトはテンプレート化・例示を共有"},{"id":"d1-048","d":1,"t":"1.1","n":1,"q":"Claudeへの依頼で「短く」と書いたところ、期待より短すぎる回答になった。最も適切な修正はどれか。","qz":"给 Claude 的请求中写了“简短”，结果回答比预期短太多。最合适的修改是哪一个？","o":[{"j":"出力されたものに人が毎回手作業で文章を書き足し、必要な長さになるまで調整する","z":"每次由人手工往输出里补写，调整到需要的长度"},{"j":"「400字程度、要点3つ、各要点に理由を1文」のように具体的な分量を示す","z":"具体指定分量，如“400 字左右，3 个要点，每个要点附一句理由”"},{"j":"「短く」を消して、長さの指定を一切しないことにする","z":"删掉“简短”，完全不指定长度"},{"j":"「短く、でも長く」と両方書いて、Claudeにバランスを判断させる","z":"同时写“简短，但要长”，让 Claude 判断平衡"}],"a":[1],"e":"“简短”这种模糊词要换成具体的字数和结构。完全不指定会更不可控；互相矛盾的指示会让输出不稳定；手工补写效率低。","ej":"「短く」より字数・項目数で具体化"},{"id":"d1-083","d":1,"t":"1.1","n":1,"q":"Claudeに社内報の見出し案を作らせたい。出力例として「見出し:〇〇(20字以内)」の形式を2つ示した。この工夫の名称として最も適切なものはどれか。","qz":"想让 Claude 做内部刊物的标题方案。示范了两个“标题：〇〇（20 字以内）”形式的输出示例。这种做法最合适的名称是哪一个？","o":[{"j":"拡張思考","z":"扩展思考"},{"j":"プロンプトチェーン","z":"提示链"},{"j":"Few-shot(例示)プロンプト","z":"Few-shot（示例）提示"},{"j":"ロールプロンプト(役割を与える手法)","z":"角色提示（赋予角色的方法）"}],"a":[2],"e":"给出几个输出示例让模型模仿，就是 few-shot 提示。角色提示是设定身份；提示链是多步串联；扩展思考是让模型深入推理的功能。","ej":"出力例を示す＝Few-shot"},{"id":"d1-008","d":1,"t":"1.2","n":1,"q":"プロジェクトマネージャーが、競合5社の調査・比較表作成・経営層向け提言の作成を、1回の長いプロンプトでまとめて依頼したところ、どれも浅い内容になった。最も適切な進め方はどれか。","qz":"项目经理用一个很长的提示词同时请求调查 5 家竞争对手、制作对比表、撰写面向管理层的建议，结果每部分都很浅。最合适的做法是哪一个？","o":[{"j":"同じプロンプトに「詳しく」と付け加えて再送する","z":"在同一提示词中加上“详细一点”后重新发送"},{"j":"調査→比較表→提言と段階に分け、各ステップの出力を確認してから次へ渡す","z":"分成调查→对比表→建议几个阶段，确认每一步的输出后再交给下一步"},{"j":"提言だけを依頼し、調査と比較は省略する","z":"只请求建议，省略调查和对比"},{"j":"対象を5社から10社に増やし、情報量を増やした上で、同じプロンプトでもう一度まとめて依頼する","z":"把对象从 5 家增加到 10 家，增加信息量后，用同样的提示词再次一并请求"}],"a":[1],"e":"复杂任务应拆解为多个步骤（提示链），每一步专注一个子任务，并在中间检查结果，最终质量更高、出错时也易于定位。只加“详细”无法解决任务过载；省略前置步骤会让建议缺乏依据；增加公司数只会更浅。","ej":"複雑な依頼は段階に分け、中間結果を確認しながら進める(プロンプトチェーン)。"},{"id":"d1-009","d":1,"t":"1.2","n":1,"q":"タスク分解を行う主な利点として最も適切なものはどれか。","qz":"进行任务拆解的主要好处中，最恰当的是哪一个？","o":[{"j":"人によるレビューが一切不要になる","z":"完全不需要人工审核"},{"j":"どんなに複雑な依頼でも、必ず1回のやり取りで完了するようになり、確認の手間がなくなる","z":"无论多复杂的请求都一定能在一次交互中完成，省去确认的工夫"},{"j":"各ステップに集中させることで精度が上がり、問題のある段階を特定・修正しやすくなる","z":"让每一步专注，提高精度，并且更容易定位和修正有问题的环节"},{"j":"プロンプトに背景情報を書く必要がなくなる","z":"提示词中不再需要写背景信息"}],"a":[2],"e":"任务拆解的价值在于：每一步更专注、更准确，且中间产物可检查，出问题时只需修正那一步。它不会免除人工审核，交互次数通常反而增加，也仍然需要背景信息。","ej":"分解の利点＝精度向上と問題箇所の特定のしやすさ。"},{"id":"d1-010","d":1,"t":"1.2","n":1,"q":"顧客アンケートの自由記述300件を分析し、改善提案をまとめたい。分解の順序として最も合理的なものはどれか。","qz":"想分析 300 条客户问卷的自由填写内容，并汇总改进建议。最合理的拆解顺序是哪一个？","o":[{"j":"改善提案を先に作り、それに合うコメントを探す","z":"先写改进建议，再找符合建议的评论"},{"j":"300件をそのまま貼り、提案だけを出させる","z":"直接贴上 300 条，只让它输出建议"},{"j":"300件の中からランダムに20件だけを選び、その20件の内容に基づいて全体の改善提案を作成させる","z":"从 300 条中随机只选 20 条，基于这 20 条内容制定整体改进建议"},{"j":"テーマ分類→テーマごとの件数と代表的な声の抽出→優先度づけ→改善提案","z":"主题分类→提取各主题数量与代表性意见→排定优先级→提出改进建议"}],"a":[3],"e":"先分类、再量化和提取证据、再排序、最后提建议，是从数据到结论的合理链条，每一步都可验证。先有结论再找证据会产生偏差；一次性只要建议难以核对依据；随机抽 20 条代表性不足。","ej":"データ→分類→根拠抽出→優先度→提案の順で分解する。"},{"id":"d1-011","d":1,"t":"1.2","n":2,"q":"新しい社内研修プログラムの企画書をClaudeと作成する。タスク分解の進め方として適切なものはどれか。2つ選べ。","qz":"要和 Claude 一起制作新的内部培训项目企划书。以下哪些是合适的任务拆解方式？请选择 2 项。","o":[{"j":"最初の依頼で完成版の企画書全文を出させ、以降は修正しない","z":"第一次请求就输出完整企划书，之后不再修改"},{"j":"各ステップを別の人に依頼し、Claudeは使わない","z":"把每个步骤交给不同的人，不使用 Claude"},{"j":"構成案が固まった後、章ごとに本文を作成させる","z":"结构方案确定后，再按章节分别撰写正文"},{"j":"分解すると時間がかかるため、すべての段階を同時に依頼する","z":"拆解太费时，所以所有阶段同时请求"},{"j":"まず目的・対象者・制約を整理させ、内容を確認してから構成案を作らせる","z":"先让它整理目的、对象和约束条件，确认后再让它做结构方案"}],"a":[2,4],"e":"先整理需求并确认，再出结构，再按章节写正文，是典型的分阶段推进，每步都有检查点。一次性定稿、完全不用 Claude、全部同时请求都失去了拆解的意义。","ej":"要件整理→構成→章ごとの本文、と確認しながら進める。"},{"id":"d1-012","d":1,"t":"1.2","n":1,"q":"長い報告書の要約を依頼するとき、Claudeに重要な引用箇所を先に抜き出させてから要約させる手法の主な目的はどれか。","qz":"请求总结长篇报告时，先让 Claude 抽取重要引用段落、再进行总结，这种方法的主要目的是什么？","o":[{"j":"根拠となる記述に基づいた要約にし、内容の取り違えを減らすため","z":"让总结基于有依据的原文，减少理解错误"},{"j":"出力全体を長くして見栄えを良くし、報告書をしっかり読み込んだ印象を読み手に与えるため","z":"让整体输出更长更好看，给读者留下认真读过报告的印象"},{"j":"Claudeの処理を速くするため","z":"让 Claude 处理更快"},{"j":"要約の作業を人が行う必要をなくすため","z":"让人不再需要参与总结工作"}],"a":[0],"e":"先抽取相关引文再作答（quote extraction），能把回答锚定在原文依据上，减少幻觉和误读，也方便人工核对。它通常会让输出更长、处理更慢，也不能取代人工确认。","ej":"先に引用を抜き出させる→根拠に基づく回答になる。"},{"id":"d1-013","d":1,"t":"1.2","n":1,"q":"複雑な判断を伴う依頼で、Claudeに「結論を出す前に、考慮すべき点を順に整理してから回答して」と指示した。この指示の効果として最も適切なものはどれか。","qz":"在需要复杂判断的请求中，指示 Claude“在得出结论前，先按顺序整理需要考虑的点再回答”。该指示的效果中最恰当的是哪一个？","o":[{"j":"回答が必ず正しくなることが保証される","z":"保证回答一定正确"},{"j":"段階的に考えさせることで、複雑な問題での推論の質が上がりやすい","z":"让它分步骤思考，复杂问题上的推理质量更容易提高"},{"j":"出力が短くなり、コストが下がる","z":"输出变短，成本降低"},{"j":"資料を添付しなくても、Claudeが段階的に考えることで最新の情報を自ら得られるようになる","z":"即使不附资料，Claude 通过分步思考也能自己获取最新信息"}],"a":[1],"e":"让模型分步骤思考（思维链）通常能提高复杂推理的质量，但不能保证正确，仍需验证。它往往使输出更长，也与获取最新信息无关。","ej":"段階的に考えさせると複雑な推論の質が上がる(正しさの保証ではない)。"},{"id":"d1-027","d":1,"t":"1.2","n":1,"q":"100ページの調査報告書から、部門ごとに必要な情報をまとめた資料を5種類作りたい。最も効率的で品質を保てる進め方はどれか。","qz":"想从 100 页的调查报告中，为各部门分别整理所需信息，共做 5 种资料。最高效且能保证质量的做法是哪一个？","o":[{"j":"5種類を1回の依頼でまとめて作らせる","z":"一次请求同时做 5 种资料"},{"j":"報告書は読ませずに、部門名だけで資料を作らせる","z":"不让它读报告，只凭部门名称做资料"},{"j":"まず報告書全体の要点と構成を抽出させ確認し、それを基に部門ごとに1種類ずつ作成させる","z":"先让它提取整份报告的要点和结构并确认，再以此为基础按部门逐一制作"},{"j":"報告書をページ数で5つに機械的に分割し、それぞれの部分から1種類ずつ資料を作らせる。分担が明確で作業も並行して進められる","z":"把报告按页数机械地分成 5 份，每份分别做一种资料。分工明确，还能并行推进"}],"a":[2],"e":"先抽取共同的要点底稿并人工确认，再为每个部门分别生成，既复用了中间结果，又让每次生成专注。一次做 5 种容易浅且混淆；不读报告会凭空编写；机械地按页数切分会让部门所需信息分散缺失。","ej":"共通の中間成果物を作って確認→それを基に個別に展開。"},{"id":"d1-031","d":1,"t":"1.2","n":1,"q":"Claudeにイベント運営計画を作らせたところ、抜け漏れが多かった。タスク分解の観点から最も有効な改善はどれか。","qz":"让 Claude 制定活动运营计划，结果遗漏很多。从任务拆解角度看，最有效的改进是哪一个？","o":[{"j":"「抜け漏れのないように」と一文追加する","z":"加一句“不要有遗漏”"},{"j":"計画作成をやめ、インターネットで公開されている一般的なイベント運営チェックリストを探して使う。網羅性が高く、自社向けに調整する必要もない","z":"不再制定计划，在网上找公开的一般活动运营检查清单来用。覆盖面广，也不需要针对本公司调整"},{"j":"まず必要な作業領域(会場・集客・当日運営・予算など)を洗い出させて確認し、領域ごとに詳細タスクを作らせる","z":"先让它列出所需工作领域（场地、招募、当天运营、预算等）并确认，再按领域制定详细任务"},{"j":"より長い文章で計画を書かせる","z":"让它用更长的文字写计划"}],"a":[2],"e":"先搭框架（工作领域）并确认覆盖面，再逐领域细化，是减少遗漏的结构化方法。只加“不要遗漏”效果有限；放弃计划不解决问题；写得更长不等于更全面。","ej":"抜け漏れ対策は、全体の枠組みを先に洗い出し→領域ごとに詳細化。"},{"id":"d1-035","d":1,"t":"1.2","n":2,"q":"Claudeを使って、新しい業務マニュアルを作成する。人が確認すべき「チェックポイント」を設けるべきタイミングとして適切なものはどれか。2つ選べ。","qz":"使用 Claude 编写新的业务手册。以下哪些时机适合设置由人确认的“检查点”？请选择 2 项。","o":[{"j":"手順や数値など、誤ると業務に影響する内容が完成した段階","z":"步骤、数值等一旦出错会影响业务的内容完成时"},{"j":"チェックは不要なので設けない","z":"不需要检查，不设置"},{"j":"Claudeが回答を始める前に、毎回一文字ずつ","z":"在 Claude 开始回答前，每次逐字检查"},{"j":"目次・構成案ができた段階(後工程の前提になるため)","z":"目录和结构方案完成时（因为它是后续工序的前提）"},{"j":"誤字を1つ見つけるたび","z":"每发现一个错别字时"}],"a":[0,3],"e":"检查点应设在“后续依赖它”的节点（如结构方案）和“出错影响大”的内容上（步骤、数值）。每个错字都停下来或逐字检查效率极低；完全不检查有风险。","ej":"チェックポイントは後工程の前提となる段階と、誤りの影響が大きい内容に置く。"},{"id":"d1-049","d":1,"t":"1.2","n":1,"q":"新規事業の企画書をClaudeと作る。最初のステップとして最も適切なものはどれか。","qz":"和 Claude 一起制作新业务企划书。最合适的第一步是哪一个？","o":[{"j":"目的と読み手を伝えて構成案(目次)を作らせ、人が確認してから各章に進む","z":"说明目的和读者，让它先做结构方案（目录），人确认后再进入各章"},{"j":"Claudeに企画のテーマも含めてすべて自由に決めてもらう","z":"包括企划主题在内，全部让 Claude 自由决定"},{"j":"企画書の全ページを一度に完成させるよう依頼し、出来上がったものを最後にまとめて確認する","z":"请求一次完成企划书全部页面，最后统一检查完成品"},{"j":"まず表紙のデザインを決めてから、その雰囲気に合わせて中身を考えてもらう","z":"先确定封面设计，再按氛围让它考虑内容"}],"a":[0],"e":"先做目录/结构并由人确认，是任务分解的基本做法，方向错了也能早期修正。一次完成全部容易遗漏和偏离；先做封面顺序颠倒；主题全交给 Claude 偏离业务目标。","ej":"まず構成案→人が確認→各章へ"},{"id":"d1-050","d":1,"t":"1.2","n":1,"q":"プロンプトチェーン(複数のプロンプトを順につなぐ方法)の説明として、最も適切なものはどれか。","qz":"关于提示链（按顺序连接多个提示词的方法），最合适的说明是哪一个？","o":[{"j":"1つのプロンプトにすべての指示をつなげて長く書く方法。指示が1か所にまとまり管理しやすい","z":"把所有指示连接在一个提示词里写得很长。指示集中在一处，便于管理"},{"j":"複数のAIサービスに同じ依頼をして、回答を比較する方法","z":"向多个 AI 服务提出相同请求并比较回答"},{"j":"前の段階の出力を次の段階の入力として使い、作業を段階的に進める方法","z":"把前一步的输出作为下一步的输入，分阶段推进工作"},{"j":"同じプロンプトを何度も送り、最も良い回答を選ぶ方法","z":"多次发送同一个提示词，选择最好的回答"}],"a":[2],"e":"提示链就是把任务拆成多步，前一步的输出作为后一步的输入。反复发送同一提示是重试；写成一个长提示正好相反；比较多个 AI 是交叉对照，不是提示链。","ej":"プロンプトチェーン＝前段の出力を次段の入力に"},{"id":"d1-051","d":1,"t":"1.2","n":1,"q":"年次報告書の作成で、「データ集計」「グラフ化」「解説文の作成」「経営層向け要約」を行う。分解して進める場合、品質管理上の利点として最も適切なものはどれか。","qz":"制作年度报告，需要“数据汇总”“图表化”“撰写解说”“面向高管的摘要”。分步推进时，在质量管理上最主要的优点是哪一个？","o":[{"j":"各段階の出力を確認でき、誤りがあった段階を特定して直しやすい","z":"可以确认每一步的输出，容易找出并修正出错的步骤"},{"j":"Claudeが自動的に最終確認を行うため、人の確認が完全に不要になる","z":"Claude 会自动进行最终确认，所以完全不需要人工确认"},{"j":"段階が増えるほど、全体の作業時間が必ず短くなることが保証される","z":"步骤越多，整体工作时间一定越短"},{"j":"集計データの正確性が、追加の検証なしで保証されるようになる","z":"汇总数据的准确性无需额外验证即可得到保证"}],"a":[0],"e":"分解的主要好处是可以逐步检查、定位错误。不会让人工确认变得不必要；不保证缩短时间；数据仍然需要验证。","ej":"分解の利点:段階ごとに確認・原因特定しやすい"},{"id":"d1-052","d":1,"t":"1.2","n":1,"q":"会議の録音文字起こし(2時間分)から議事録を作りたい。最も適切な進め方はどれか。","qz":"想从会议录音转写稿（2 小时）制作会议记录。最合适的做法是哪一个？","o":[{"j":"文字起こしを貼り、「議事録にして」とだけ依頼して、そのまま配布する","z":"粘贴转写稿，只请求“做成会议记录”，然后直接分发"},{"j":"議事録は人が作るべきなので、Claudeは文字起こしの誤字修正だけに使い、内容整理は行わせない","z":"会议记录应由人来做，所以只用 Claude 修正转写稿错别字，不让它整理内容"},{"j":"まず議題ごとに発言を整理させ、次に決定事項・宿題(担当と期限)を抽出させ、最後に所定の書式にまとめさせる","z":"先按议题整理发言，再提取决定事项和待办（负责人和期限），最后整理成规定格式"},{"j":"文字起こしを10分ごとに分割し、それぞれを別々の新しいチャットで要約して、つなぎ合わせて完成とする","z":"把转写稿按每 10 分钟切分，分别在新对话中做摘要，拼接起来即完成"}],"a":[2],"e":"按“议题整理 → 提取决定事项和待办 → 套用格式”分步，准确度更高。一句话请求后直接分发缺少检查；机械切分会割裂上下文，拼接后不连贯；完全不用 Claude 整理是过度保守。","ej":"長い記録は段階的に整理→抽出→整形"},{"id":"d1-053","d":1,"t":"1.2","n":2,"q":"Claudeに大きな調査タスクを任せる前に「作業計画」を先に出させることの利点として適切なものはどれか。2つ選べ。","qz":"在把大型调研任务交给 Claude 之前，先让它提出“工作计划”有哪些好处？请选择 2 项。","o":[{"j":"計画を出させれば、その後の出力の事実確認は不要になる","z":"只要让它出计划，之后的输出就不需要事实核查"},{"j":"計画を出させると、Claudeが利用するモデルが自動的に上位のものに切り替わる","z":"让它出计划后，Claude 使用的模型会自动切换到更高级的"},{"j":"作業の方向性が意図と合っているか、早い段階で確認・修正できる","z":"能及早确认并修正工作方向是否符合意图"},{"j":"計画を出させることで、調査結果がすべて最新の情報になる","z":"让它出计划后，调研结果都会变成最新信息"},{"j":"抜けている観点や必要な情報源に気づきやすくなる","z":"更容易发现遗漏的视角和需要的信息来源"}],"a":[2,4],"e":"先出计划可以及早校正方向、发现遗漏。它不能代替事实核查，不会切换模型，也不会让信息自动变新。","ej":"先に計画→方向性の確認と抜け漏れ発見"},{"id":"d1-054","d":1,"t":"1.2","n":1,"q":"複数の資料(社内アンケート、業界レポート、競合のWebサイト情報)をもとに提言書を作る。最も適切なタスクの分け方はどれか。","qz":"根据多份资料（内部问卷、行业报告、竞争对手网站信息）制作建议书。最合适的任务划分是哪一个？","o":[{"j":"資料は渡さず、Claudeの一般知識だけで提言を書かせたうえで、あとから資料と合っているかを確認する","z":"不给资料，只用 Claude 的一般知识写建议，之后再确认是否与资料一致"},{"j":"提言を先に決めてしまい、それを支持する情報だけを資料から探させる","z":"先定好建议，只让它从资料中找支持这个建议的信息"},{"j":"資料ごとに要点と出典を整理させ、次にそれらを比較・統合し、最後に提言をまとめさせる","z":"先按资料分别整理要点和出处，再比较整合，最后形成建议"},{"j":"すべての資料を一度に渡して、一回のプロンプトで提言書の完成版を作らせ、すぐ提出する","z":"把所有资料一次给它，用一个提示词做出建议书完成版，立即提交"}],"a":[2],"e":"先按来源整理（保留出处）、再整合、最后提建议，便于追溯和检查。一次性完成不利于检查；不用资料容易脱离实际；先定结论再找证据会产生偏见。","ej":"資料ごと整理→統合→提言(出典を保持)"},{"id":"d1-055","d":1,"t":"1.2","n":1,"q":"Claudeに「段階的に考えてから答えて」と指示することが特に有効なタスクはどれか。","qz":"指示 Claude “请一步步思考后再回答”在哪种任务中特别有效？","o":[{"j":"社内の内線番号を一つ確認する(番号表から該当者を探す)","z":"确认一个公司内部分机号码（从号码表中找出对应的人）"},{"j":"複数の条件(予算・期間・人員)を満たす計画案を比較検討する","z":"比较研究满足多个条件（预算、期间、人员）的计划方案"},{"j":"あいさつ文の言い回しを一つだけ変える","z":"只改一句问候语的说法"},{"j":"ファイル名を英語から日本語に変える","z":"把文件名从英文改为日文"}],"a":[1],"e":"多条件的比较判断需要推理，让它一步步思考能提高精度。其他都是简单任务，不需要逐步推理，反而浪费时间。","ej":"複数条件の比較・判断で段階的思考が有効"},{"id":"d1-056","d":1,"t":"1.2","n":1,"q":"マーケティング部が、1つのプロンプトで「ターゲット分析」「キャッチコピー案」「SNS投稿計画」「予算配分」をすべて依頼した。どの項目も浅い内容だった。最も適切な改善はどれか。","qz":"市场部在一个提示词中请求了“目标分析”“广告语方案”“社交媒体发帖计划”“预算分配”。每一项内容都很浅。最合适的改进是哪一个？","o":[{"j":"4つの依頼を分け、ターゲット分析の結果を次の依頼の前提として使いながら順に進める","z":"把 4 个请求分开，用目标分析的结果作为后续请求的前提，按顺序推进"},{"j":"同じプロンプトに「すべて詳しく」と追記して、出力される文章量を増やすよう求める","z":"在同一提示词中追加“全部要详细”，要求增加输出篇幅"},{"j":"項目を減らし、キャッチコピーだけを作る","z":"减少项目，只做广告语"},{"j":"依頼の順番を入れ替えて、予算配分から先に書くように指示し、残りは同じプロンプトのまま送る","z":"调换请求顺序，指示先写预算分配，其余保持在同一提示词中发送"}],"a":[0],"e":"多个任务塞在一个提示里导致每项都浅，应该分解并让前一步结果成为后一步前提。只说“全部详细”无法解决；调顺序不解决根本问题；砍掉项目不能满足需求。","ej":"多すぎる依頼は分けて前段の結果を次に活かす"},{"id":"d1-057","d":1,"t":"1.2","n":1,"q":"長い契約書について質問する際、「まず質問に関係する条文をそのまま抜き出し、その後に回答して」と指示した。この手法の主な利点はどれか。","qz":"针对一份长合同提问时，指示“先原样摘录与问题相关的条款，然后再回答”。这种方法的主要好处是哪一个？","o":[{"j":"法務部門の確認が不要になる","z":"不再需要法务部门确认"},{"j":"回答が必ず法的に正しいことが保証される","z":"保证回答在法律上一定正确"},{"j":"契約書の全文を読まなくてもClaudeが答えられるようになる","z":"Claude 不读合同全文也能回答"},{"j":"回答の根拠が明確になり、人が原文と照合して確認しやすくなる","z":"回答的依据变得清楚，人容易对照原文确认"}],"a":[3],"e":"先摘录引用再回答，能让依据可追溯、方便核对。它不保证法律正确，也不能省略法务确认；Claude 仍需要读取文档。","ej":"引用を先に抜き出す→根拠が明確・照合しやすい"},{"id":"d1-058","d":1,"t":"1.2","n":2,"q":"新製品の発売準備チェックリストをClaudeと作る。タスク分解の進め方として適切なものはどれか。2つ選べ。","qz":"和 Claude 一起制作新产品上市准备清单。任务分解的推进方式中，以下哪些合适？请选择 2 项。","o":[{"j":"Claudeが作ったリストは網羅的なので、そのまま確定版とする","z":"Claude 做的清单很全面，直接作为定稿"},{"j":"チェックリストの項目数をできるだけ多くすることを目標にする","z":"以尽量增加清单项目数为目标"},{"j":"部門(営業・広報・物流・サポート)ごとに必要な作業を洗い出させ、最後に全体の日程と依存関係を整理させる","z":"按部门（营业、公关、物流、客服）列出需要的工作，最后整理整体日程和依赖关系"},{"j":"各部門の担当者に、生成された作業リストの抜け漏れを確認してもらう","z":"请各部门负责人确认生成的工作清单有无遗漏"},{"j":"一度に完成させ、確認は発売後に問題が出たときに行う","z":"一次完成，等上市后出了问题再确认"}],"a":[2,3],"e":"按部门分解再整合依赖关系，并请相关负责人确认，是合理的分解和人工检查。上市后再确认太晚；Claude 的清单不一定完整；项目数多不等于质量高。","ej":"部門別に分解→全体統合→担当者が確認"},{"id":"d1-059","d":1,"t":"1.2","n":1,"q":"Claudeに大量の作業を依頼する場合、一度に1000件の商品説明を作らせるよりも、まず10件で試すべき理由として最も適切なものはどれか。","qz":"让 Claude 做大量工作时，与其一次生成 1000 条商品说明，不如先用 10 条试做。最合适的理由是哪一个？","o":[{"j":"少数で品質と形式を確認し、プロンプトを調整してから全体に適用できるため","z":"可以先用少量确认质量和格式，调整提示词后再应用于全部"},{"j":"1000件を処理すると、そのデータがすべて公開されてしまうため","z":"因为处理 1000 条的话，数据会全部被公开"},{"j":"10件の方がClaudeの気分が良くなり、品質が上がるため","z":"因为 10 条时 Claude 心情更好，质量会提高"},{"j":"少数で試せば、本番の出力は人が確認しなくてもよくなるため。検証の手間を最小限にするのが目的である","z":"因为先少量试做，正式输出就不需要人确认。目的是把验证工作量降到最低"}],"a":[0],"e":"先小规模试做，确认质量、调整提示词，再扩大，可以减少大量返工。Claude 没有情绪；处理量与公开无关；正式输出仍需抽查确认。","ej":"大量処理はまず少数で試してから展開"},{"id":"d1-014","d":1,"t":"1.3","n":1,"q":"Claudeが作成したプレスリリース案は内容は正確だが、表現が硬すぎた。次に取るべき行動として最も適切なものはどれか。","qz":"Claude 写的新闻稿草案内容准确，但表达太生硬。下一步最合适的行动是哪一个？","o":[{"j":"最初から新しいチャットを開き、同じ依頼文で作り直させて、前回とは違う表現が出るのを待つ","z":"从头开一个新对话，用同样的请求重新生成，等待出现与上次不同的表达"},{"j":"内容は正確なので、そのまま公開する","z":"内容准确，直接发布"},{"j":"内容は維持したまま、どの部分をどんなトーンに変えたいかを具体的に伝えて修正させる","z":"保持内容不变，具体说明哪些部分要改成什么语气，让它修改"},{"j":"別のAIツールで書き直す","z":"用其他 AI 工具重写"}],"a":[2],"e":"迭代改进的要点是：保留好的部分，具体指出要改什么、改成什么样。从头重来会丢掉已经正确的内容；直接发布没有解决问题；换工具无必要。","ej":"良い部分は残し、変えたい点を具体的にフィードバックする。"},{"id":"d1-015","d":1,"t":"1.3","n":1,"q":"プロンプトを改善する反復(イテレーション)の進め方として最も適切なものはどれか。","qz":"关于改进提示词的迭代方式，最合适的是哪一个？","o":[{"j":"毎回プロンプトを全面的に書き換え、気になる点を複数同時に変えて、なるべく早く結論を出す","z":"每次全面重写提示词，同时修改多个在意的地方，尽快得出结论"},{"j":"一度うまくいかなければ、そのタスクにはClaudeを使わない","z":"一次不成功就不再用 Claude 做这项任务"},{"j":"出力を見ずに、プロンプトを長くし続ける","z":"不看输出，只是不断加长提示词"},{"j":"出力のどこが期待とずれたかを特定し、原因に対応する部分を修正して結果を比較する","z":"找出输出哪里与期望不符，修改与原因对应的部分，并比较结果"}],"a":[3],"e":"有效的迭代是：识别差距→推测原因→有针对性地修改→比较结果。同时改很多处就不知道是哪项改动起效；一次失败就放弃太早；不看输出盲目加长没有依据。","ej":"ずれを特定→原因に対応した修正→結果比較、を繰り返す。"},{"id":"d1-016","d":1,"t":"1.3","n":2,"q":"Claudeの議事録要約が、決定事項と単なる意見を区別できていなかった。プロンプトの改善として有効なものはどれか。2つ選べ。","qz":"Claude 的会议纪要总结没有区分决定事项和单纯意见。以下哪些提示词改进是有效的？请选择 2 项。","o":[{"j":"議事録を貼らずに会議名だけ伝える","z":"不贴纪要，只告诉会议名称"},{"j":"要約の文字数を半分にする","z":"把总结字数减半"},{"j":"「決定事項」「ToDo(担当・期限)」「議論中の意見」に分けて出力するよう形式を指定する","z":"指定输出格式，分为“决定事项”“待办（负责人、期限）”“讨论中的意见”"},{"j":"決定事項の判断基準(例:「〜で合意」「〜に決定」と発言されたもの)を定義する","z":"定义决定事项的判断标准（例如有“达成一致”“决定为”等发言的）"},{"j":"丁寧語で書くよう指示する","z":"指示使用敬语书写"}],"a":[2,3],"e":"区分不清是因为缺少分类结构和判断标准，所以应指定分类格式并定义“什么算决定事项”。缩短字数、只给会议名、改为敬语都没有解决分类问题。","ej":"区別させたいなら、出力の分類形式と判断基準を明示する。"},{"id":"d1-017","d":1,"t":"1.3","n":1,"q":"同じ種類の依頼(毎月の売上レポートのコメント作成)を繰り返し行っている。何度も修正を重ねてうまくいったプロンプトの扱いとして最も適切なものはどれか。","qz":"同一类请求（每月销售报告的评论撰写）反复进行。经过多次修改后效果良好的提示词，最合适的处理方式是哪一个？","o":[{"j":"毎月ゼロから新しく書き直す","z":"每月从零开始重新写"},{"j":"テンプレートとして保存し、Projectの指示などで再利用し、必要に応じて改訂する","z":"保存为模板，通过 Project 指示等方式复用，并根据需要修订"},{"j":"一度うまくいったプロンプトなので、業務や対象が変わっても今後一切変更せずに使い続ける","z":"既然效果好，即使业务或对象变化，今后也绝不修改，一直使用"},{"j":"上手くいった理由がわからないので破棄する","z":"不知道为什么效果好，所以丢弃"}],"a":[1],"e":"把验证过的提示词模板化并复用（例如放进 Project 指示），可提高效率和一致性；但业务和模型都会变化，应适时修订。每次重写浪费；永不修改会过时；丢弃不合理。","ej":"うまくいったプロンプトはテンプレート化して再利用・改訂する。"},{"id":"d1-018","d":1,"t":"1.3","n":1,"q":"Claudeの出力に対してフィードバックを与える方法として、最も効果的なものはどれか。","qz":"对 Claude 的输出给出反馈时，最有效的方法是哪一个？","o":[{"j":"「良くない」とだけ伝える","z":"只说“不好”"},{"j":"何も言わずに再生成ボタンを押し続け、偶然よい出力が出たらそれを採用する(試行回数を増やす方法)","z":"什么都不说，一直按重新生成，碰巧出了好结果就采用（增加尝试次数的方法）"},{"j":"「第2段落は数字の根拠が不明確。出典を示し、3文以内にまとめて」のように具体的に伝える","z":"具体说明，例如“第 2 段数字依据不明确，请标明出处，并压缩到 3 句以内”"},{"j":"「あなたは能力が低いので、もっと真剣に取り組んでください」と厳しく叱責して書き直させる","z":"严厉责备“你能力太差，请更认真地对待”，让它重写"}],"a":[2],"e":"具体、可执行的反馈（指出位置、问题和期望结果）最能引导改进。笼统的“不好”、无限重生成、责备都不提供可用的信息。","ej":"フィードバックは場所・問題・期待結果を具体的に。"},{"id":"d1-028","d":1,"t":"1.3","n":1,"q":"同じプロンプトを使っても、日によってClaudeの出力の細部が異なる。業務で一定の品質を保つための考え方として最も適切なものはどれか。","qz":"即使使用同样的提示词，Claude 输出的细节每天也有所不同。为了在业务中保持稳定质量，最合适的思路是哪一个？","o":[{"j":"出力が変わるのは故障なので、利用を中止する","z":"输出变化是故障，所以停止使用"},{"j":"形式・必須項目・例を明確にし、確認すべきチェック項目を決めて出力をレビューする","z":"明确格式、必填项和示例，确定检查项目并审核输出"},{"j":"毎回まったく同じ出力が得られるまで再生成を繰り返し、一致した出力だけを採用することで、品質を一定に保つ","z":"反复重新生成，直到每次输出完全一致，只采用一致的输出，以此保持质量稳定"},{"j":"出力の違いは気にせず、毎回そのまま使う","z":"不在意输出差异，每次直接使用"}],"a":[1],"e":"生成式 AI 的输出天然有一定差异，这不是故障。通过明确格式、必填项和示例来缩小波动，并用检查清单审核，是保持质量的现实方法。追求完全一致不现实；不检查直接用有风险。","ej":"出力のばらつきは前提。形式・例で揺れを抑え、チェック項目でレビュー。"},{"id":"d1-032","d":1,"t":"1.3","n":1,"q":"Claudeに作成させた社内報の記事について、上司から「もう少し具体例がほしい」とコメントがあった。最も適切な対応はどれか。","qz":"上司对 Claude 写的内部刊物文章评论说“希望多一些具体例子”。最合适的应对是哪一个？","o":[{"j":"上司のコメントと、使える具体例の素材(社内事例など)をClaudeに渡し、該当箇所に例を追加させる","z":"把上司的评论和可用的具体例子素材（内部案例等）交给 Claude，让它在相应位置补充例子"},{"j":"Claudeに、社内で実際にありそうな架空の事例を自由に作らせ、それらしい具体例として記事に追加する","z":"让 Claude 自由编造公司内部可能存在的虚构案例，作为像样的具体例子加入文章"},{"j":"コメントを反映するため、記事全体を最初から書き直させ、構成も表現もすべて新しくする","z":"为了反映评论，让它从头重写整篇文章，结构和表达全部换新"},{"j":"コメントを無視してそのまま掲載する","z":"无视评论直接刊登"}],"a":[0],"e":"把反馈和真实素材一起交给 Claude，让它针对性修改，是基于反馈的高效迭代。让它编造内部案例会产生虚假信息；全文重写浪费；无视反馈不可取。","ej":"フィードバックと事実素材を渡して該当箇所を修正させる。架空の事例は作らせない。"},{"id":"d1-060","d":1,"t":"1.3","n":1,"q":"Claudeが作ったマニュアル案に対し、「わかりにくい」とだけ伝えて修正を依頼したが、あまり改善しなかった。次に取るべき行動として最も適切なものはどれか。","qz":"对 Claude 写的手册草案只说“不好懂”并请求修改，但没怎么改善。下一步最合适的做法是哪一个？","o":[{"j":"「わかりにくい」と繰り返し伝え、改善するまで同じフィードバックを送り続ける","z":"反复说“不好懂”，一直发送同样的反馈直到改善"},{"j":"Claudeでの作成をあきらめ、マニュアルはすべて手作業で一から作り直すことにする","z":"放弃用 Claude 制作，手册全部手工从头重做"},{"j":"どの部分が、誰にとって、なぜわかりにくいかを具体的に伝える(例:手順3は新入社員には用語が難しい)","z":"具体说明哪个部分、对谁、为什么难懂（例：第 3 步的术语对新员工来说太难）"},{"j":"新しいチャットを開き、最初と同じ依頼文をそのまま送り直して、違う結果が出るのを待つ","z":"开新对话，原样重新发送最初的请求，等待出现不同的结果"}],"a":[2],"e":"具体反馈（哪里、对谁、为什么）才能让修改有效。重复同样模糊的反馈没有新信息；原样重发只是碰运气；完全放弃过于消极。","ej":"フィードバックは「どこ・誰に・なぜ」を具体的に"},{"id":"d1-061","d":1,"t":"1.3","n":1,"q":"プロンプトを改善するとき、一度に複数の箇所を大きく変えるのではなく、一つずつ変えて結果を比べる理由として最も適切なものはどれか。","qz":"改进提示词时，不一次大幅修改多处，而是一次改一处并比较结果。最合适的理由是哪一个？","o":[{"j":"どの変更が出力の改善(または悪化)に効いたのかを判断しやすいため","z":"容易判断是哪个修改带来了输出的改善（或变差）"},{"j":"一度に複数変更すると、Claudeがエラーで応答しなくなるため。システムへの負荷を避ける必要がある","z":"一次修改多处的话，Claude 会出错不回应。需要避免给系统造成负担"},{"j":"変更回数が多いほど、Claudeが学習して性能が上がるため","z":"修改次数越多，Claude 就会学习并提升性能"},{"j":"変更を一つに限ると、出力の確認が不要になるため","z":"只改一处，就不需要确认输出"}],"a":[0],"e":"一次改一处便于判断因果。一次改多处不会导致报错；Claude 不会在对话中通过修改次数“学习”提升性能；确认仍然必要。","ej":"一度に一箇所変更→効果を比較"},{"id":"d1-062","d":1,"t":"1.3","n":1,"q":"同じ会話の中で何度も修正を重ねた結果、Claudeの出力が以前の誤った案の要素を引きずるようになった。最も適切な対応はどれか。","qz":"在同一个对话中反复修改后，Claude 的输出开始带着之前错误方案的要素。最合适的应对是哪一个？","o":[{"j":"出力の誤りは避けられないものとして受け入れ、修正はせずにそのまま使用する","z":"把输出错误当作无法避免的事接受，不修改直接使用"},{"j":"これまでの決定事項と最新の要件を整理したプロンプトを作り、新しいチャットで始め直す","z":"整理至今的决定事项和最新需求写成提示词，在新对话中重新开始"},{"j":"会話の最初のメッセージを編集せずに、最上位モデルに切り替えれば自動的に解決する","z":"不编辑对话开头，只要切换到最高级模型就会自动解决"},{"j":"同じ会話でさらに細かい修正指示を追加し続け、誤った要素が消えるまで繰り返す","z":"在同一个对话中继续追加更细的修改指示，直到错误要素消失"}],"a":[1],"e":"长对话中错误尝试会干扰后续输出，整理要点后开新对话最有效。继续追加修改会让上下文更乱；直接使用错误输出不负责任；换模型不能清除对话中的错误上下文。","ej":"迷走した会話は整理して新しいチャットで再開"},{"id":"d1-063","d":1,"t":"1.3","n":2,"q":"Claudeが作成した顧客向け提案メールの改善を依頼する。効果的なフィードバックの例として適切なものはどれか。2つ選べ。","qz":"请求改进 Claude 写的面向客户的提案邮件。以下哪些是有效的反馈示例？请选择 2 项。","o":[{"j":"「価格の記載は削除し、次回打ち合わせの候補日を2つ提示する形にして」","z":"“删除价格的描述，改为提出两个下次会议候选日期的形式”"},{"j":"「なんか違う」","z":"“感觉不对”"},{"j":"「とにかく全部書き直して」","z":"“总之全部重写”"},{"j":"「冒頭で相手の課題に触れてから、当社の解決策を3点で示して」","z":"“开头先提到对方的课题，再用 3 点说明本公司的解决方案”"},{"j":"「もっといい感じにして」","z":"“弄得更好一点”"}],"a":[0,3],"e":"有效反馈要指明具体的结构或内容修改。“感觉不对”“更好一点”“全部重写”都没有说明要改什么。","ej":"具体的な修正内容を伝える"},{"id":"d1-064","d":1,"t":"1.3","n":1,"q":"Claudeの出力を改善するために、過去にうまくいった出力例を「この例のような形で」と示した。この方法が有効な主な理由はどれか。","qz":"为了改进 Claude 的输出，给出过去成功的输出示例，说“按这个示例的形式”。这种方法有效的主要原因是哪一个？","o":[{"j":"例を示すことで、期待する形式・トーン・粒度が具体的に伝わるため","z":"给出示例可以具体传达期望的格式、语气和颗粒度"},{"j":"例を示せば、内容の事実確認をしなくてもよくなるため","z":"给出示例后，就不需要核查内容事实"},{"j":"例を示すと、Claudeはその内容をそのままコピーするだけになるため","z":"给出示例后，Claude 只会原样复制其内容"},{"j":"例がないとClaudeは日本語で回答できないため","z":"没有示例的话 Claude 就不能用日语回答"}],"a":[0],"e":"示例（few-shot）能具体传达格式、语气、颗粒度。好的示例是被模仿而不是照抄；仍需事实核查；没有示例也能用日语回答。","ej":"例示で形式・トーン・粒度を伝える"},{"id":"d1-065","d":1,"t":"1.3","n":1,"q":"毎月の報告書作成で、Claudeへのプロンプトを改善し続けている。改善の成果を確かめる方法として最も適切なものはどれか。","qz":"每月制作报告时持续改进给 Claude 的提示词。确认改进效果的最合适方法是哪一个？","o":[{"j":"改善の効果は確認せず、新しいプロンプトをそのまま採用する","z":"不确认改进效果，直接采用新提示词"},{"j":"同じ入力データで旧プロンプトと新プロンプトの出力を比較し、事前に決めた観点で評価する","z":"用相同输入数据比较旧提示词和新提示词的输出，按事先定好的标准评估"},{"j":"Claudeに「前回より良くなりましたか?」と尋ねる","z":"问 Claude “比上次好了吗？”"},{"j":"出力の文字数が増えていれば改善したとみなし、内容面の評価は行わないことにする。分量の多さは丁寧さの指標になるため","z":"只要输出字数增加就视为改善，不做内容方面的评估。因为篇幅多是认真程度的指标"}],"a":[1],"e":"用相同输入、明确标准比较新旧输出才能客观判断。问 Claude 是自我评价不可靠；字数多不等于更好；不验证就采用有风险。","ej":"同じ入力で新旧を比較し、評価観点で判断"},{"id":"d1-066","d":1,"t":"1.3","n":1,"q":"Claudeが作った研修クイズの問題が簡単すぎた。最も効果的な修正依頼はどれか。","qz":"Claude 做的培训测验题太简单了。最有效的修改请求是哪一个？","o":[{"j":"「入社3年目の社員向けに、手順の理由を問う応用問題にし、誤答の選択肢も実務でありがちな誤解にして」","z":"“面向入职第 3 年的员工，改成询问步骤理由的应用题，错误选项也用实际工作中常见的误解”"},{"j":"クイズは人が作るべきなので、Claudeの案はすべて捨てて最初から作り直す","z":"测验应由人来做，所以把 Claude 的方案全部丢弃从头做"},{"j":"「難しくして」","z":"“弄难一点”"},{"j":"問題数を2倍に増やすよう依頼し、簡単な問題と難しい問題を混ぜてもらう。難易度の幅があれば全員に対応できる","z":"请求把题量增加一倍，让它混合简单题和难题。难度有梯度的话就能照顾到所有人"}],"a":[0],"e":"说明对象水平、题型和干扰项的方向，修改才会有效。“难一点”太模糊；增加题量不能解决难度问题；全部丢弃过于浪费。","ej":"難易度は対象者と問い方で具体化"},{"id":"d1-067","d":1,"t":"1.3","n":1,"q":"Claudeとのやり取りで良い結果が得られたプロンプトを今後も活用したい。最も適切な方法はどれか。","qz":"想今后继续使用与 Claude 交互中得到好结果的提示词。最合适的方法是哪一个？","o":[{"j":"良かったプロンプトをテンプレートとして保存し、必要に応じてProjectの指示に組み込む","z":"把好的提示词作为模板保存，必要时写进 Project 指示"},{"j":"Claudeが自動的に覚えているので何もしなくてよいと考え、次回も同じチャットで「前と同じ」とだけ伝える","z":"认为 Claude 会自动记住，什么都不做，下次在同一对话里只说“和以前一样”"},{"j":"プロンプトを保存せず、次回は記憶を頼りに書き直す","z":"不保存提示词，下次凭记忆重写"},{"j":"出力結果だけを保存し、プロンプトは捨てる","z":"只保存输出结果，丢掉提示词"}],"a":[0],"e":"把好的提示词模板化、放入 Project 指示，便于重复使用和共享。凭记忆重写会走样；依赖“和以前一样”不可靠；只存输出无法重现。","ej":"良いプロンプトはテンプレート化して再利用"},{"id":"d1-068","d":1,"t":"1.3","n":2,"q":"Claudeの出力が期待とずれた場合、プロンプトのどこを見直すべきか。確認すべき点として適切なものはどれか。2つ選べ。","qz":"Claude 的输出与期望有偏差时，应该检查提示词的哪些地方？以下哪些是应确认的点？请选择 2 项。","o":[{"j":"依頼を送った時刻","z":"发送请求的时间"},{"j":"目的や読み手が明確に書かれているか","z":"目的和读者是否写清楚"},{"j":"Claudeに丁寧語を使ったかどうか","z":"是否对 Claude 用了敬语"},{"j":"プロンプトのフォントや文字の色","z":"提示词的字体和文字颜色"},{"j":"出力形式や分量の指定があるか","z":"有没有指定输出格式和分量"}],"a":[1,4],"e":"输出偏差通常源于目的、读者、格式、分量等信息不足。字体颜色、发送时间与输出质量无关；敬语与否不是主要原因。","ej":"見直す点:目的・読み手・形式・分量"},{"id":"d1-069","d":1,"t":"1.3","n":1,"q":"Claudeに作らせた要約が、毎回重要な数値を落としている。プロンプトの改善として最も適切なものはどれか。","qz":"Claude 生成的摘要每次都漏掉重要数字。最合适的提示词改进是哪一个？","o":[{"j":"要約の長さを短くするよう指示し、より簡潔にまとめてもらう。短い要約ほど重要な情報が際立つため","z":"指示缩短摘要，让它更简洁。因为摘要越短，重要信息越突出"},{"j":"数値は人が後から書き足せばよいので、プロンプトは変えずに毎回手作業で追記する","z":"数字之后由人补上就行，所以不改提示词，每次手工补写"},{"j":"「売上・利益・前年比などの数値は必ず残し、最後に数値の一覧を付けて」と明記する","z":"明确写出“销售额、利润、同比等数字必须保留，最后附上数字一览”"},{"j":"要約をやめて、原文をそのまま配布することにし、Claudeは使わない","z":"放弃摘要，直接分发原文，不使用 Claude"}],"a":[2],"e":"明确“必须保留哪些信息”并要求附数字一览，能直接解决漏掉数字的问题。缩短会更容易漏；每次手工补写效率低；完全放弃不合理。","ej":"必ず残す情報を明示する"},{"id":"d1-070","d":1,"t":"1.3","n":1,"q":"Claudeが作成した文章の改善を繰り返す中で、最初の目的から内容がずれてきた。最も適切な対応はどれか。","qz":"在反复改进 Claude 写的文章过程中，内容逐渐偏离了最初的目的。最合适的应对是哪一个？","o":[{"j":"改善をすべて取り消し、どの段階が良かったのかは確認せずに初稿をそのまま使う","z":"撤销全部改进，也不确认哪个阶段好，直接使用初稿"},{"j":"最初の目的と必須要件をあらためて明示し、それに照らして修正を依頼する","z":"重新明确最初的目的和必备要求，对照它们请求修改"},{"j":"Claudeに目的を自由に決め直してもらう","z":"让 Claude 自由重新决定目的"},{"j":"ずれた方向のまま改善を続け、最終的に良い文章になればよいと考える","z":"沿着偏离的方向继续改进，认为最终文章好就行"}],"a":[1],"e":"迭代中要不断回到目的和必备要求进行对照。继续偏离会产出不符合需求的东西；直接用初稿浪费改进成果；让 Claude 决定目的会脱离业务需要。","ej":"反復中も目的・必須要件に立ち返る"},{"id":"d1-071","d":1,"t":"1.3","n":1,"q":"Claudeに文章を修正させたところ、直してほしくない部分まで書き換えられてしまった。最も適切な指示の出し方はどれか。","qz":"让 Claude 修改文章时，连不想改的部分也被改写了。最合适的指示方式是哪一个？","o":[{"j":"「第3段落のみを修正し、それ以外の段落は一字一句変えないで」と修正範囲を明示する","z":"明确修改范围：“只修改第 3 段，其他段落一字不改”"},{"j":"毎回全文を書き直してもらい、良い部分だけを人が拾い集める。比較の幅が広がり、より良い表現が見つかる","z":"每次让它全文重写，人工挑出好的部分。比较范围更广，能找到更好的表达"},{"j":"修正依頼をせず、Claudeの判断ですべて改善してもらう","z":"不提修改请求，让 Claude 凭判断全部改进"},{"j":"修正したくない部分を削除してから依頼し、あとで元に戻す","z":"先删除不想修改的部分再请求，之后再恢复"}],"a":[0],"e":"明确修改范围是最直接的方法。每次全文重写再挑选效率低；全交给 Claude 判断会继续改不想改的部分；删除再恢复繁琐且容易出错。","ej":"修正範囲(変えない部分)を明示する"},{"id":"d1-085","d":1,"t":"1.3","n":1,"q":"Claudeに作らせたキャッチコピー案が、どれも似たような表現になった。次の依頼として最も効果的なものはどれか。","qz":"Claude 生成的广告语方案都是相似的表达。下一步最有效的请求是哪一个？","o":[{"j":"「別の案を出して」とだけ伝えて、同じ依頼を何度か繰り返し、違う表現が出てくるのを待つ(偶然の変化に期待する)","z":"只说“再出别的方案”，重复几次同样的请求，等待出现不同的表达（期待偶然的变化）"},{"j":"キャッチコピーは人が考えるべきなので、Claudeの案は参考にせずにすべて破棄する","z":"广告语应该由人想，所以 Claude 的方案不参考，全部丢弃"},{"j":"似た表現でも問題ないので、最初の案の中から一つを選んでそのまま採用することにする","z":"相似也没关系，从最初的方案中选一个直接采用"},{"j":"「感情に訴える案、数字を使う案、問いかけ型の案をそれぞれ3つずつ」と切り口を指定する","z":"指定切入点：“诉诸情感的、使用数字的、提问式的各 3 个”"}],"a":[3],"e":"指定不同的切入角度，能有效增加多样性。只说“再出别的”效果有限；接受相似方案没有达成目的；全部丢弃浪费了可用的素材。","ej":"多様性がほしい→切り口を指定する"},{"id":"d1-019","d":1,"t":"1.4","n":1,"q":"新サービスの名称案を出すブレインストーミングにClaudeを使う。プロンプトの方針として最も適切なものはどれか。","qz":"用 Claude 进行新服务名称的头脑风暴。提示词的方针中最合适的是哪一个？","o":[{"j":"多様な案を多数出させ、方向性ごとに分類させた上で、評価は後の段階で行う","z":"让它提出大量多样的方案并按方向分类，评估放到后面的阶段"},{"j":"最初から最も良い1案だけを出させる","z":"一开始就只让它给出最好的 1 个方案"},{"j":"事実確認のため、Web検索で既存の名称だけを調べさせる","z":"为了核实事实，只让它用网络搜索调查已有名称"},{"j":"厳密な形式の表で、各案の市場性を示す統計データと出典を付けて、最初から順位づけして出させる","z":"用严格格式的表格，附上显示各方案市场性的统计数据和出处，一开始就排序输出"}],"a":[0],"e":"头脑风暴的目标是“发散”：先求数量和多样性，再收敛评估。一开始只要 1 个最佳方案会限制创意；只查现有名称不是创意任务；要求统计依据与命名创意不匹配。","ej":"ブレストは「発散→分類→評価」。最初から絞り込まない。"},{"id":"d1-020","d":1,"t":"1.4","n":1,"q":"市場規模の推計など、分析タスクでClaudeを使う場合に特に重要なプロンプトの要素はどれか。","qz":"在市场规模估算等分析任务中使用 Claude 时，提示词中特别重要的要素是哪一个？","o":[{"j":"前提や制約にとらわれず、自由で創造的な発想を促し、できるだけ多くの可能性を挙げさせること","z":"不拘泥于前提和约束，鼓励自由创意，尽可能多地列出可能性"},{"j":"感情に訴える表現を使うよう求めること","z":"要求使用诉诸情感的表达"},{"j":"できるだけ短い回答を求めること","z":"要求尽可能简短的回答"},{"j":"前提条件・使用データ・計算過程を明示させ、仮定と事実を区別させること","z":"让它明确前提条件、使用的数据和计算过程，并区分假设与事实"}],"a":[3],"e":"分析类任务要求可追溯、可验证：前提、数据来源和推导过程都要摆出来，并区分假设和事实，方便检查和修正。创意发散、情感表达和过度简短都不适合分析任务。","ej":"分析タスクは前提・データ・計算過程を明示し、仮定と事実を分ける。"},{"id":"d1-021","d":1,"t":"1.4","n":1,"q":"業界の最新動向について調査したい。Claudeを使った調査タスクの進め方として最も適切なものはどれか。","qz":"想调查行业最新动态。使用 Claude 进行调研任务时，最合适的做法是哪一个？","o":[{"j":"Web検索やResearch機能を使い、出典付きで情報を集めさせ、重要な点は出典を確認する","z":"使用网络搜索或 Research 功能，让它带出处收集信息，并对重点内容核对出处"},{"j":"検索機能は使わず、Claudeが学習した幅広い知識をもとに、最新動向を網羅的に答えさせる。出典の確認は手間がかかるため省略する","z":"不使用搜索功能，基于 Claude 学到的广泛知识，全面回答最新动态。核对出处太费事，所以省略"},{"j":"出典は不要なので、結論だけを求める","z":"不需要出处，只要结论"},{"j":"ブレスト用のプロンプトを使い、自由に予想させる","z":"使用头脑风暴提示词，让它自由预测"}],"a":[0],"e":"调研最新信息应使用网络搜索/Research 获取带出处的信息，并抽查关键出处。仅靠训练知识可能过时；不要出处无法验证；自由预测不是调研。","ej":"最新情報の調査は検索/Researchで出典付き＋重要点は出典確認。"},{"id":"d1-022","d":1,"t":"1.4","n":1,"q":"顧客向けのお詫びメールの起草をClaudeに依頼する。起草タスクとして最も重要な指定はどれか。","qz":"请 Claude 起草一封给客户的道歉邮件。作为起草任务，最重要的指定是哪一个？","o":[{"j":"統計的な根拠を必ず含めること","z":"必须包含统计依据"},{"j":"相手、経緯、伝えるべき事実と対応策、トーン、長さを指定すること","z":"指定对象、经过、需要传达的事实和对策、语气和长度"},{"j":"できるだけ多くの案を出させること","z":"让它尽可能多地提出方案"},{"j":"Web検索で他社のお詫び文の事例を幅広く探させ、最も評判の良い文面をそのまま流用させる","z":"用网络搜索广泛查找其他公司的道歉文案例，直接套用评价最好的文案"}],"a":[1],"e":"起草类任务需要清楚的“写给谁、为什么写、要说什么、用什么语气、多长”。统计依据与道歉邮件无关；大量方案属于头脑风暴；搜索他人道歉文不能替代本次的具体事实。","ej":"起草は相手・経緯・伝える事実・トーン・長さを指定する。"},{"id":"d1-023","d":1,"t":"1.4","n":2,"q":"タスクの種類と、それに適したプロンプト戦略の組み合わせとして適切なものはどれか。2つ選べ。","qz":"以下任务类型与适合的提示词策略的组合中，哪些是恰当的？请选择 2 项。","o":[{"j":"調査:出典の提示を求め、情報の日付や信頼性を確認する","z":"调研：要求给出出处，并确认信息的日期和可靠性"},{"j":"ブレスト:最初から実現可能性で厳しく絞り込ませる","z":"头脑风暴：一开始就按可行性严格筛选"},{"j":"分析:結論だけを短く出させ、過程は省略させる","z":"分析：只让它简短给出结论，省略过程"},{"j":"調査:検索を使わず、記憶だけで回答させる","z":"调研：不使用搜索，只凭记忆回答"},{"j":"起草:読み手・目的・トーンを指定し、下書きを反復して磨く","z":"起草：指定读者、目的和语气，反复打磨草稿"}],"a":[0,4],"e":"调研要重视出处、日期和可信度；起草要明确读者、目的和语气并迭代打磨。分析省略过程无法验证；头脑风暴一开始就严格筛选会扼杀创意；调研只靠记忆会过时。","ej":"調査＝出典と日付、起草＝読み手・目的・トーン＋反復。"},{"id":"d1-024","d":1,"t":"1.4","n":1,"q":"経営会議用に、複数の選択肢(A案・B案・C案)のメリット・デメリットを比較したい。プロンプトの工夫として最も適切なものはどれか。","qz":"想为经营会议比较多个选项（A、B、C 方案）的优缺点。提示词的做法中最合适的是哪一个？","o":[{"j":"「どれが一番良いか一言で」とだけ聞く","z":"只问“一句话说哪个最好”"},{"j":"最初に「B案が良いと考えている」と伝えたうえで、その理由を補強する観点から3案を比較させる","z":"先告诉它“我认为 B 方案好”，再从强化该理由的角度比较 3 个方案"},{"j":"評価軸(コスト・期間・リスク等)を指定し、表形式で同じ軸で比較させる","z":"指定评价维度（成本、周期、风险等），让它用表格按同一维度比较"},{"j":"比較は不要なので、各案の説明を長文で書かせる","z":"不需要比较，让它对每个方案写长篇说明"}],"a":[2],"e":"比较任务应先定义统一的评价维度，再用表格并排对比，便于决策。只要一句结论缺乏依据；先给出倾向会诱导偏向（迎合）；只写长篇说明不利于比较。","ej":"比較は評価軸を決めて表形式で。先に自分の結論を示すと誘導になる。"},{"id":"d1-029","d":1,"t":"1.4","n":1,"q":"技術的な内容を、専門知識のない顧客向けに説明する文章をClaudeに作らせる。プロンプトとして最も適切なものはどれか。","qz":"让 Claude 把技术性内容写成面向没有专业知识客户的说明文字。最合适的提示词是哪一个？","o":[{"j":"「正確さが最優先なので、専門用語をできるだけ多く使い、技術的な詳細も省略せずに説明して」","z":"“准确最优先，尽量多用专业术语，技术细节也不要省略地说明”"},{"j":"技術者向けに作られた詳細な資料をそのまま渡し、専門用語や構成は変えずに全体を短く要約させる","z":"直接交出为技术人员制作的详细资料，不改专业术语和结构，只让它整体简短总结"},{"j":"「短く一行で」","z":"“简短一行”"},{"j":"「読者はITの専門知識がない顧客。専門用語は避けるか平易に言い換え、身近な例えを1つ入れて、A4半分程度で」","z":"“读者是没有 IT 专业知识的客户。避免专业术语或改用通俗说法，加入一个贴近生活的比喻，篇幅约半张 A4”"}],"a":[3],"e":"面向非专业读者，需要明确读者画像、用词要求、表达手段（比喻）和篇幅。堆砌术语、直接总结技术资料、只写一行都不符合读者需求。","ej":"読み手を明示し、用語の扱い・例え・分量を指定する。"},{"id":"d1-033","d":1,"t":"1.4","n":1,"q":"スプレッドシートの売上データから傾向を読み取りたい。Claudeへの依頼として最も適切なものはどれか。","qz":"想从电子表格的销售数据中读出趋势。向 Claude 提出的请求中最合适的是哪一个？","o":[{"j":"データは添付せず、「売上の傾向を教えて」と聞く","z":"不附数据，问“告诉我销售趋势”"},{"j":"ファイルを添付し、分析の目的・見たい切り口(月別・地域別など)・出力形式(表・グラフ)を指定する","z":"附上文件，指定分析目的、想看的维度（按月、按地区等）和输出形式（表格、图表）"},{"j":"データの一部の数値を記憶から入力して分析させる","z":"凭记忆输入部分数值让它分析"},{"j":"データは添付せず、「当社の売上で何か面白い発見をして、意外な傾向を教えて」とだけ依頼する。先入観のない自由な発見が期待できる","z":"不附数据，只请求“从我们公司的销售中找出有趣的发现，告诉我意外的趋势”。可以期待没有先入之见的自由发现"}],"a":[1],"e":"数据分析需要真实数据，加上明确目的、分析维度和输出形式，结果才有用、可核对。不附数据只能得到泛泛之谈；凭记忆输入易错；“找有趣发现”目的不明。","ej":"データ分析は実データ＋目的・切り口・出力形式を指定。"},{"id":"d1-072","d":1,"t":"1.4","n":1,"q":"新しい社内イベントの企画アイデアをClaudeと出したい。最初の段階で最も適切なプロンプトはどれか。","qz":"想和 Claude 一起想新的内部活动企划创意。在最初阶段最合适的提示词是哪一个？","o":[{"j":"「最も良いアイデアを1つだけ教えて」","z":"“只告诉我一个最好的创意”"},{"j":"「過去に当社で実施したイベントと同じものを提案して」","z":"“提出与本公司过去举办过的相同的活动”"},{"j":"「実現可能性の低いアイデアは除外し、確実に成功するものだけを厳選して」。時間の無駄を省き、効率的に議論を進めるため","z":"“排除可行性低的创意，只严选一定会成功的”。为了省去时间浪费，高效推进讨论"},{"j":"「予算30万円、参加者100名の条件で、定番から意外なものまで20案を挙げて。評価はまだしないで」","z":"“在预算 30 万日元、参加者 100 人的条件下，从常规到意外列出 20 个方案。先不要评价”"}],"a":[3],"e":"头脑风暴初期要先追求数量和多样性，同时给出基本条件，先不评价。只要一个最好的会限制发散；重复过去的活动缺乏新意；一开始就严格筛选会扼杀创意。","ej":"ブレストは条件を示し、数と多様性→評価は後"},{"id":"d1-073","d":1,"t":"1.4","n":1,"q":"アイデアを20案出した後、絞り込みを行う。この段階のプロンプトとして最も適切なものはどれか。","qz":"列出 20 个创意之后要进行筛选。这一阶段最合适的提示词是哪一个？","o":[{"j":"「どれが良いか決めて」","z":"“决定哪个好”"},{"j":"「すべての案に良い点があるので、全部採用する前提で計画を立てて」。どの案も捨てずに済み、関係者の納得も得やすい","z":"“所有方案都有优点，以全部采用为前提制定计划”。不用舍弃任何方案，也容易获得相关人员认同"},{"j":"「費用・準備期間・参加者の満足度の3つの基準で各案を評価し、表で比較して上位3案を理由付きで示して」","z":"“按费用、准备时间、参加者满意度 3 个标准评估各方案，用表格比较，附理由给出前 3 名”"},{"j":"「さらに20案追加して」","z":"“再追加 20 个方案”"}],"a":[2],"e":"收敛阶段要给出明确的评价标准和输出形式（表格+理由）。“决定哪个好”没有标准；全部采用不现实；再加 20 个是继续发散而不是收敛。","ej":"絞り込みは評価基準を明示して比較"},{"id":"d1-074","d":1,"t":"1.4","n":1,"q":"顧客データの傾向分析をClaudeに依頼した。分析結果を業務で使う前提として、プロンプトに最も含めるべき指示はどれか。","qz":"请 Claude 分析客户数据的趋势。在把分析结果用于业务的前提下，提示词中最应该包含的指示是哪一个？","o":[{"j":"「専門的な統計用語をできるだけ多く使って、説得力のある報告にして」。専門性が伝われば読み手は結論を信頼しやすい","z":"“尽量多用专业统计术语，写成有说服力的报告”。专业性传达出来，读者就容易信任结论"},{"j":"「経営層が喜びそうな前向きな結論にまとめて」","z":"“整理成高管会喜欢的积极结论”"},{"j":"「結論だけを短く書いて」","z":"“只简短写结论”"},{"j":"「分析の根拠となるデータと計算方法を示し、事実と推測を区別して書いて」","z":"“给出作为分析依据的数据和计算方法，区分事实与推测”"}],"a":[3],"e":"分析任务要求给出依据和方法、区分事实与推测，方便验证。只给结论无法检查；迎合高管会引入偏见；堆砌术语不等于正确。","ej":"分析:根拠・方法を示し、事実と推測を区別"},{"id":"d1-075","d":1,"t":"1.4","n":1,"q":"法改正の最新状況について社内向け説明資料を作る。調査タスクとして最も適切な進め方はどれか。","qz":"制作关于法律修改最新状况的内部说明资料。作为调研任务，最合适的做法是哪一个？","o":[{"j":"昨年作成した資料をそのまま再利用する","z":"直接重新使用去年制作的资料"},{"j":"インターネット上の個人ブログの情報だけを集めてまとめる","z":"只收集网上个人博客的信息进行整理"},{"j":"Claudeの一般知識だけで説明資料を作り、すぐに全社へ配布する。Claudeは幅広い知識を持っているので確認は不要","z":"只用 Claude 的一般知识制作说明资料，立即向全公司分发。Claude 知识广博，所以不需要确认"},{"j":"Web検索やリサーチ機能で出典付きの情報を集め、官公庁の一次情報で確認してから資料にまとめる","z":"用网络搜索或 Research 功能收集附出处的信息，用政府机关的一手资料确认后整理成资料"}],"a":[3],"e":"法规等最新信息要用搜索/Research 获取并以一手资料确认。Claude 的一般知识可能过时；个人博客可信度低；去年的资料可能已经过时。","ej":"最新情報は検索＋一次情報で確認"},{"id":"d1-076","d":1,"t":"1.4","n":1,"q":"取引先への値上げのお知らせ文を起草する。トーンについての指定として最も適切なものはどれか。","qz":"起草给客户的涨价通知。关于语气的指定，最合适的是哪一个？","o":[{"j":"「できるだけ曖昧にして、値上げだと気づかれないように書いて」。顧客の反発を最小限に抑えられる","z":"“尽量写得含糊，不让对方察觉是涨价”。可以把客户的反感降到最低"},{"j":"トーンは指定せず、Claudeに任せる","z":"不指定语气，交给 Claude"},{"j":"「丁寧かつ誠実に。値上げの理由を簡潔に説明し、これまでの取引への感謝を伝えて」","z":"“礼貌而诚恳。简洁说明涨价理由，表达对以往交易的感谢”"},{"j":"「強気に。値上げは当然であることを強調して」","z":"“强硬一点。强调涨价是理所当然的”"}],"a":[2],"e":"对外通知需要明确读者关系和语气，并说明理由与感谢。强硬会损害关系；故意含糊有欺骗之嫌；不指定语气结果不稳定。","ej":"対外文書はトーンと伝える要素を明示"},{"id":"d1-077","d":1,"t":"1.4","n":2,"q":"タスクの種類ごとのプロンプト戦略として適切なものはどれか。2つ選べ。","qz":"关于不同任务类型的提示词策略，以下哪些合适？请选择 2 项。","o":[{"j":"要約:用途と読み手を伝え、残すべき情報と長さを指定する","z":"摘要：说明用途和读者，指定必须保留的信息和长度"},{"j":"データ抽出:抽出する項目と出力形式(表など)を明確に定義する","z":"数据提取：明确定义要提取的项目和输出格式（表格等）"},{"j":"調査:出典は不要とし、Claudeの回答をそのまま信じる","z":"调研：不需要出处，直接相信 Claude 的回答"},{"j":"ブレインストーミング:最初から1案に絞らせる","z":"头脑风暴：一开始就让它限定为一个方案"},{"j":"起草:読み手やトーンは指定せず、Claudeの判断に任せる","z":"起草：不指定读者和语气，交给 Claude 判断"}],"a":[0,1],"e":"摘要要指定用途、读者、保留信息和长度；数据提取要定义项目和格式。头脑风暴一开始不应限定为一案；调研需要出处和验证；起草需要读者和语气。","ej":"要約:用途・残す情報/抽出:項目と形式"},{"id":"d1-078","d":1,"t":"1.4","n":1,"q":"外国語の製品マニュアルを日本の顧客向けに翻訳したい。Claudeへの依頼として最も適切なものはどれか。","qz":"想把外语产品手册翻译给日本客户使用。给 Claude 的请求中最合适的是哪一个？","o":[{"j":"原文の語順をできるだけ保った直訳にし、正確性を最優先させたうえで、自然さは考慮しない。意訳は誤解のもとになるため","z":"尽量保持原文语序直译，最优先准确性，不考虑是否自然。因为意译容易造成误解"},{"j":"読み手(日本の一般顧客)、用語集(製品固有の訳語)、文体(です・ます調)を指定し、専門用語は担当者が確認する","z":"指定读者（日本的普通客户）、术语表（产品专用译名）、文体（です・ます体），专业术语由负责人确认"},{"j":"製品名や型番も日本語らしく自由に言い換えさせ、親しみやすさを優先する","z":"产品名和型号也让它自由改成日语化的说法，优先亲切感"},{"j":"「翻訳して」とだけ依頼し、そのまま顧客に配布する","z":"只说“翻译一下”，然后直接分发给客户"}],"a":[1],"e":"翻译需要读者、术语表、文体等指定，以及专业人员确认。只说“翻译”并直接分发缺乏检查；生硬直译不适合客户；随意改产品名和型号会造成混乱。","ej":"翻訳:読み手・用語集・文体を指定し専門家が確認"},{"id":"d1-079","d":1,"t":"1.4","n":1,"q":"上司から「この3つの業者の見積もりを比較して」と頼まれた。Claudeへの依頼として最も適切なものはどれか。","qz":"上司要求“比较一下这 3 家供应商的报价”。给 Claude 的请求中最合适的是哪一个？","o":[{"j":"「比較して」と見積書を貼るだけで依頼する","z":"只粘贴报价单并说“比较一下”"},{"j":"比較の観点(総額、納期、保守条件、実績)を示し、表形式で比較したうえで、判断に必要な不明点も挙げさせる","z":"给出比较角度（总额、交期、维护条件、业绩），用表格比较，并列出判断所需的不明之处"},{"j":"Claudeに業者の評判をインターネットで調べさせ、その結果だけで判断する。第三者の評価の方が見積書より客観的である","z":"让 Claude 在网上查供应商的口碑，只凭结果判断。第三方评价比报价单更客观"},{"j":"最も安い業者を選ぶように指示し、そのまま発注する","z":"指示选择最便宜的供应商，然后直接下单"}],"a":[1],"e":"比较分析要给出评价角度和输出格式，并让它指出不明点，供人判断。只说“比较”太模糊；只看价格忽略其他条件，而且由 AI 直接决定下单不合适；只看网上口碑不全面。","ej":"比較:観点と形式を示し、不明点も挙げさせる"},{"id":"d1-080","d":1,"t":"1.4","n":1,"q":"Claudeに「新入社員向けに、当社の経費精算ルールを説明する文章」を作らせる。最も重要な準備はどれか。","qz":"让 Claude 写“面向新员工、说明本公司报销规则的文章”。最重要的准备是哪一个？","o":[{"j":"新入社員が喜ぶようなユーモアをたくさん入れるよう指示する","z":"指示加入很多新员工会喜欢的幽默"},{"j":"最新の経費精算規程を資料として渡し、それに基づいて書くよう指示する","z":"提供最新的报销规章作为资料，指示据此撰写"},{"j":"文章をできるだけ長くするよう指示する","z":"指示尽量写长"},{"j":"Claudeが一般的な会社の経費ルールを知っているので、資料は不要とする","z":"Claude 知道一般公司的报销规则，所以不需要资料"}],"a":[1],"e":"公司特有的规则必须提供最新资料作为依据，否则 Claude 会用一般知识推测。一般规则不等于本公司规则；长度和幽默不是核心。","ej":"社内固有の内容は最新資料を渡して根拠にする"},{"id":"d1-081","d":1,"t":"1.4","n":1,"q":"顧客インタビュー10件の記録から、製品改善のヒントを見つけたい。最も適切なプロンプトはどれか。","qz":"想从 10 份客户访谈记录中找出产品改进线索。最合适的提示词是哪一个？","o":[{"j":"「インタビューから良い点だけを抜き出して」。前向きな材料の方が改善の議論を進めやすい","z":"“只从访谈中提取好的方面”。积极的材料更容易推动改进讨论"},{"j":"「不満・要望・称賛に分類し、それぞれ何件のインタビューで言及されたかと代表的な発言を示して」","z":"“分为不满、需求、称赞三类，分别给出在几份访谈中被提到以及代表性发言”"},{"j":"「インタビュー全体の感想を一言で」","z":"“用一句话说出对全部访谈的感想”"},{"j":"「最も声の大きかった顧客の意見を採用して」","z":"“采纳声音最大的客户的意见”"}],"a":[1],"e":"给出分类框架、频次和代表性原话，结果可以追溯、便于判断。只取好的方面会产生偏差；一句话感想信息太少；只采纳声音大的意见缺乏代表性。","ej":"定性分析:分類・件数・代表的発言で根拠を残す"},{"id":"d1-082","d":1,"t":"1.4","n":1,"q":"社外講演用のスライド原稿をClaudeに作らせる。起草の前に決めて伝えるべきこととして最も適切なものはどれか。","qz":"让 Claude 写对外演讲的幻灯片稿。起草前最应确定并告知的是哪一个？","o":[{"j":"聴衆の属性、講演時間、伝えたい主なメッセージ","z":"听众属性、演讲时间、想传达的主要信息"},{"j":"Claudeの使用モデル名だけ","z":"只有 Claude 使用的模型名称"},{"j":"スライドの背景色と、使用するフォントの種類","z":"幻灯片的背景色和使用的字体种类"},{"j":"過去の講演で使ったジョーク","z":"过去演讲中用过的笑话"}],"a":[0],"e":"起草前要明确听众、时间和核心信息，这决定内容和分量。背景色、模型名、笑话都是次要因素。","ej":"講演原稿:聴衆・時間・主メッセージ"},{"id":"d1-084","d":1,"t":"1.4","n":1,"q":"Claudeに競合製品の比較表を作らせたところ、一部のセルが「情報なし」とせずにもっともらしい数値で埋められていた。今後の依頼で最も適切な指示はどれか。","qz":"让 Claude 做竞品比较表，结果有些单元格没有写“无信息”，而是填了看似合理的数字。今后请求时最合适的指示是哪一个？","o":[{"j":"「資料で確認できない項目は『不明』と書き、数値には出典を付けて」","z":"“资料中无法确认的项目写‘不明’，数字附上出处”"},{"j":"「数値はおおよそでよいので、推測で埋めて」","z":"“数字大概就行，用推测填上”"},{"j":"比較表の形式をやめ、文章で説明させる","z":"不用比较表，改为文字说明"},{"j":"「空欄を作らないように、すべてのセルを必ず埋めて」。空欄があると比較表として使いにくいため","z":"“不要留空，所有单元格必须填满”。因为有空栏的话，比较表不好用"}],"a":[0],"e":"允许写“不明”并要求出处，可以防止编造数字。强制填满和允许推测都会增加幻觉；改成文字并不能解决问题。","ej":"確認できない項目は「不明」と書かせ出典を求める"},{"id":"d2-001","d":2,"t":"2.1","n":1,"q":"営業担当者がClaudeに、30ページの顧客提案書の要約を依頼した。要約は読みやすいが、提案書に含まれる価格条件と契約期間について一切触れていない。この要約を評価する観点として最も適切なものはどれか。","qz":"一名销售人员请 Claude 总结一份 30 页的客户提案书。摘要读起来很流畅，但完全没有提到提案书中的价格条件和合同期限。评价这份摘要时，最恰当的视角是哪一项？","o":[{"j":"文章が流暢なので、要約として十分な品質であると判断する。","z":"文字流畅，因此判断其作为摘要质量已经足够。"},{"j":"完全性の観点から、目的上重要な情報が欠落していないかを確認し、不足箇所を補うよう再依頼する。","z":"从完整性角度确认是否遗漏了对目的而言重要的信息，并要求补充缺失部分。"},{"j":"要約は短いほど良いため、価格や期間の省略は望ましい。","z":"摘要越短越好，因此省略价格和期限是可取的。"},{"j":"Claudeに自分の要約を10点満点で採点させ、8点以上であれば品質基準を満たしているとみなしてそのまま使う。","z":"让 Claude 给自己的摘要打分（满分10分），8分以上就视为达到质量标准并直接使用。"}],"a":[1],"e":"评价输出要同时看“正确性”和“完整性”。流畅≠完整，价格和期限对销售目的是关键信息，遗漏就是完整性缺陷，应明确指出并要求补充。「文章が流暢なので十分」只看文风；「短いほど良い」混淆了简洁和遗漏关键信息；让 Claude 自己打分不能作为质量依据。","ej":"流暢さ≠完全性。目的に必要な情報が揃っているかを確認する。"},{"id":"d2-002","d":2,"t":"2.1","n":1,"q":"マーケティング担当者が、自社製品の機能一覧を元資料としてClaudeに比較表を作らせた。出力を確認する最も効果的な方法はどれか。","qz":"一名市场人员以本公司产品功能列表为原始资料，让 Claude 制作对比表。确认输出时最有效的方法是哪一项？","o":[{"j":"表のレイアウトが整っているかを確認する。","z":"确认表格版式是否整齐。"},{"j":"Claudeに「この表は正確ですか」と質問し、「はい」と答えれば完了とする。","z":"问 Claude“这个表准确吗？”，如果回答“是”就算完成。"},{"j":"表の各項目を元資料と突き合わせ、記載の有無や数値が一致しているかを確認する。","z":"将表中的每一项与原始资料逐一核对，确认有无遗漏、数值是否一致。"},{"j":"別の担当者に見せ、見た目の印象を聞く。","z":"给另一位同事看，询问其对外观的印象。"}],"a":[2],"e":"有原始资料时，最可靠的验证是与来源逐项对照。问 Claude「この表は正確ですか」属于自我确认，不可靠；看表格排版或问别人的印象，都只看形式，不能验证内容正确性。","ej":"元資料がある場合は、出力を元資料と突き合わせて検証する。"},{"id":"d2-003","d":2,"t":"2.1","n":1,"q":"人事担当者が、社内アンケート500件の自由記述をClaudeに分析させ、「主な不満は3つ」という結果を得た。結論を経営会議に出す前に、まず行うべきこととして最も適切なものはどれか。","qz":"一名人事负责人让 Claude 分析 500 份内部问卷的自由填写内容，得到“主要不满有 3 项”的结果。在将结论提交经营会议之前，首先应做的最恰当的事是哪一项？","o":[{"j":"各不満カテゴリについて代表的な回答の原文と件数を示させ、一部をサンプルで原データと照合する。","z":"让 Claude 列出每个不满类别的代表性原文回答及件数，并抽样与原始数据核对。"},{"j":"3つという数が覚えやすいので、そのまま報告する。","z":"3 项这个数字好记，直接汇报。"},{"j":"同じ質問を再度投げ、2回とも同じ3つの不満が挙がれば、分析は正確で再現性もあると判断して報告する。","z":"再问一遍同样的问题，如果两次都列出相同的3项不满，就判断分析准确且可复现，然后汇报。"},{"j":"分析結果の文章をより説得力のある表現に書き換える。","z":"把分析结果改写成更有说服力的表述。"}],"a":[0],"e":"对大量数据的归纳结论，应要求提供依据（原文引用、件数），再抽样核对原始数据，检查是否有遗漏的类别或数量偏差。「2回とも同じなら正確」错在一致性不等于正确性（可能每次都错得一样）；「覚えやすいのでそのまま報告」和「説得力のある表現に書き換える」都没有验证。","ej":"結論には根拠（引用・件数）を出させ、サンプルで原データと照合する。"},{"id":"d2-004","d":2,"t":"2.1","n":1,"q":"Claudeに議事録から「決定事項」と「宿題（担当者・期限）」を抽出させた。出力では一部の宿題に担当者が書かれていない。最も適切な対応はどれか。","qz":"让 Claude 从会议记录中提取“决定事项”和“待办事项（负责人・期限）”。输出中部分待办事项没有写负责人。最恰当的应对是哪一项？","o":[{"j":"議事録の文脈から最も可能性の高い担当者をClaudeに推測させ、空欄をすべて埋めた状態で共有する。","z":"让 Claude 根据会议记录的上下文推测最可能的负责人，把空栏全部填满后再共享。"},{"j":"担当者欄が空の項目をそのまま削除する。","z":"直接删除负责人为空的条目。"},{"j":"出力形式が崩れていないので問題ないと判断する。","z":"输出格式没有乱，因此判断没有问题。"},{"j":"議事録に担当者の記載があるか確認し、記載がなければ「未定」と明示させ、関係者に確認する。","z":"确认会议记录中是否写有负责人；若没有，让 Claude 明确标注“未定”，并向相关人员确认。"}],"a":[3],"e":"信息缺失时，应先回到原文确认；原文确实没有就明确标为“未定/不明”，再向相关人员确认。让 Claude 推测负责人并填满空栏会制造幻觉；直接删除会丢失信息；「形式が崩れていないので問題ない」忽视了内容缺失。","ej":"不明な情報は推測させず「未定・不明」と明示させる。"},{"id":"d2-005","d":2,"t":"2.1","n":2,"q":"Claudeが作成した新サービスの市場調査レポートを評価する際、正確性と完全性を確認する方法として適切なものを2つ選べ。","qz":"评估 Claude 制作的新服务市场调研报告时，作为确认正确性与完整性的方法，请选出 2 项恰当的做法。","o":[{"j":"レポートに記載された統計値や出典を、一次情報で確認する。","z":"用一手资料确认报告中记载的统计数据和出处。"},{"j":"Claudeが自信を持った表現で書いている箇所は確認を省略する。","z":"Claude 以确信语气写的部分就省略确认。"},{"j":"レポートの文字数が十分に多いかを確認する。","z":"确认报告字数是否足够多。"},{"j":"依頼時に定めた調査項目（市場規模、競合、顧客層など）がすべて網羅されているかをチェックリストで確認する。","z":"用检查清单确认委托时设定的调研项目（市场规模、竞争对手、客户群等）是否全部覆盖。"},{"j":"見出しのデザインを統一する。","z":"统一标题的设计样式。"}],"a":[0,3],"e":"正确性：
