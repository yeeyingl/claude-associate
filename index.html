"通过连接器的话个人信息规定就不适用"},{"j":"接続設定は一度決めたら見直さない","z":"连接设置一旦决定就不再复查"},{"j":"便利なので全社の共有ドライブすべてにアクセスできるようにする","z":"因为方便，让它能访问全公司所有共享盘"},{"j":"接続先に機密文書が含まれる場合、その扱いを社内規程で確認する","z":"如果连接对象中包含机密文件，按公司规定确认其处理方式"}],"a":[0,4],"e":"连接器应遵循最小权限原则，并确认机密文件的处理规则。开放全部共享盘扩大泄露风险；通过连接器访问同样受数据规定约束；设置需要定期复查。","ej":"コネクタは最小権限+機密文書の扱いを確認"},{"id":"d6-015","d":6,"t":"6.2","n":1,"q":"Claudeに社内の人事評価データを分析させたい。分析の目的は「部署ごとの評価分布の偏り」を見ることである。データ最小化の観点で最も適切な入力はどれか。","qz":"想让Claude分析公司内部的人事评价数据。分析目的是查看“各部门评价分布的偏差”。从数据最小化角度，最合适的输入是哪一项？","o":[{"j":"偏りの原因まで分析できるよう、社員番号と評価コメント全文を含む部署別の元データ","z":"为了能分析偏差原因，包含员工编号和评价评语全文的各部门原始数据"},{"j":"評価者と被評価者の個人メールのやり取り","z":"评价者与被评价者之间的私人邮件往来"},{"j":"全社員の顔写真付き名簿","z":"附有全体员工照片的名单"},{"j":"部署名と評価ランクのみを集計した、個人を特定できないデータ","z":"只汇总部门名称和评价等级、无法识别个人的数据"}],"a":[3],"e":"数据最小化：只提供达成目的所需的数据。看部门分布只需部门和等级的汇总数据，无需个人标识。其他选项都包含与目的无关的个人信息。","ej":"目的に必要な最小限のデータだけ入力"},{"id":"d6-016","d":6,"t":"6.2","n":1,"q":"取引先から受け取った資料に「第三者への開示禁止」と記載された秘密保持契約(NDA)がある。この資料をClaudeで要約してよいかを判断するうえで最も適切な行動はどれか。","qz":"从客户那里收到的资料附有写明“禁止向第三方披露”的保密协议（NDA）。在判断能否用Claude总结这份资料时，最恰当的行动是哪一项？","o":[{"j":"要約だけなら契約違反にならない","z":"只是总结的话不算违约"},{"j":"AIサービスは人ではなく第三者への開示にはあたらないため、要約目的であれば規程を確認せずに入力してよい","z":"AI服务不是人，不构成向第三方披露，所以如果是总结目的，不确认规定也可以输入"},{"j":"NDAの条件と社内のAI利用規程を確認し、必要なら法務に相談する","z":"确认NDA条件和公司AI使用规定，必要时咨询法务"},{"j":"取引先に知られなければ問題ない","z":"只要客户不知道就没问题"}],"a":[2],"e":"是否允许把受NDA约束的资料输入AI服务，取决于合同条款和公司规定，必要时应咨询法务。“AI不是第三方”“只是总结”都是未经确认的主观判断；隐瞒违反诚信。","ej":"NDA資料は契約条件と社内規程を確認"},{"id":"d6-017","d":6,"t":"6.2","n":1,"q":"共有のチームProjectに、特定の顧客の契約金額一覧をナレッジとしてアップロードしようとしている。Projectには他部署のメンバーも参加している。最も適切な対応はどれか。","qz":"打算把特定客户的合同金额列表作为知识上传到共享的团队Project。该Project也有其他部门的成员参与。最恰当的应对是哪一项？","o":[{"j":"Projectのメンバーと共有範囲を確認し、閲覧権限のない人がいる場合はアップロードしないか、限定されたProjectを使う","z":"确认Project成员和共享范围，有无权查看的人时不上传，或使用限定成员的Project"},{"j":"アップロード後に全員へ「見ないで」と連絡する","z":"上传后通知所有人“请不要看”"},{"j":"Claudeはファイルの原本を他のメンバーに直接表示しないため、Project指示に「金額は回答しない」と書いてアップロードする","z":"Claude不会直接向其他成员显示文件原件，所以在Project指示中写“不回答金额”后上传"},{"j":"ファイル名をわかりにくくすればよい","z":"把文件名改得难懂就行"}],"a":[0],"e":"Project知识对Project成员可用，Claude也会在回答中引用，需按“需要知道”原则管理共享范围。认为Claude不会透露是错误的假设；改文件名不是访问控制；事后通知无法防止访问。","ej":"Projectの共有範囲=ナレッジの閲覧範囲を管理"},{"id":"d6-035","d":6,"t":"6.2","n":1,"q":"Claudeのメモリ機能が有効になっている。以前の会話で顧客の個人情報を扱ってしまったことに気づいた。最も適切な行動はどれか。","qz":"Claude的记忆功能已开启。你发现之前的对话中处理了客户的个人信息。最恰当的行动是哪一项？","o":[{"j":"設定でメモリの内容を確認・編集して該当情報を削除し、必要に応じて社内規程に従い報告する","z":"在设置中查看、编辑记忆内容并删除相关信息，必要时按公司规定报告"},{"j":"そのうち自然に忘れるので何もしない","z":"之后会自然遗忘，所以什么也不做"},{"j":"メモリ機能は個人情報を保存しないので問題ない","z":"记忆功能不会保存个人信息，所以没问题"},{"j":"新しい会話で「以前の顧客情報はすべて忘れて」と指示すれば、メモリと会話履歴から完全に削除される","z":"在新对话中指示“忘掉之前所有客户信息”，就会从记忆和对话历史中完全删除"}],"a":[0],"e":"记忆可以在设置中查看、编辑和删除；处理了不该输入的个人信息时，还应按公司规定报告（对话本身的删除等）。不能指望自然遗忘；口头说“忘掉”不能保证删除对话历史等所有数据；记忆可能包含任何过去提到的信息。","ej":"メモリは設定で確認・編集・削除、必要なら報告"},{"id":"d6-049","d":6,"t":"6.2","n":1,"q":"海外のグループ会社に、自社製品の詳細な設計図と技術資料を英語で説明する資料をClaudeで作りたい。製品には輸出管理の対象となる技術が含まれる可能性がある。最も適切な行動はどれか。","qz":"想用Claude制作向海外集团公司用英文说明本公司产品详细设计图和技术资料的文件。产品可能包含出口管制对象技术。最合适的行动是哪一个？","o":[{"j":"同じグループ会社なので輸出管理は関係なく、資料をそのまま作って送る","z":"因为是同一集团公司，与出口管制无关，直接制作并发送"},{"j":"英語にすれば技術の提供にはあたらないので確認は不要である","z":"翻译成英文就不算技术提供，所以不需要确认"},{"j":"Claudeに輸出管理の規制内容を説明させたうえで対象かどうかを判定させ、「対象外」と出たら輸出管理部門には確認せずに進める","z":"先让Claude说明出口管制的规定内容，再让它判定是否属于管制对象，显示“不属于”就不向出口管理部门确认直接推进"},{"j":"技術資料をClaudeに入力する前に、社内の輸出管理部門に該非判定や手続きの要否を確認する","z":"在把技术资料输入Claude之前，先向公司出口管理部门确认是否属于管制对象（该非判定）及是否需要手续"}],"a":[3],"e":"出口管制不仅针对货物，也包括向海外提供技术信息，集团公司之间同样适用。是否属于管制对象需要由公司出口管理部门判断，不能交给 AI。“集团内部没关系”“翻成英文不算”都是错误理解。","ej":"輸出管理の可能性＝入力前に輸出管理部門へ確認"},{"id":"d6-050","d":6,"t":"6.2","n":1,"q":"顧客から受託開発しているシステムのソースコードを、不具合調査のためにClaudeに入力したい。最も適切な行動はどれか。","qz":"想把受客户委托开发的系统源代码输入Claude以调查故障。最合适的行动是哪一个？","o":[{"j":"顧客との契約や秘密保持条項で外部サービスへの入力が認められているか、社内規程とあわせて確認してから利用する","z":"确认与客户的合同和保密条款是否允许输入外部服务，并结合公司规定确认后再使用"},{"j":"コードの一部だけを切り出して入力するなら契約上の問題は生じないので、顧客との契約内容は確認せずに必要な箇所を入力する","z":"只截取部分代码输入就不会产生合同问题，所以不确认与客户的合同内容，直接输入需要的部分"},{"j":"自社で書いたコードなので、自由に入力してよい","z":"因为是本公司写的代码，可以自由输入"},{"j":"不具合調査にAIを使うのは顧客に失礼なので、どのような場合も使わない","z":"用AI调查故障对客户不礼貌，因此任何情况下都不用"}],"a":[0],"e":"受托开发的代码通常受合同和保密条款约束，即使是自己写的，权利和保密义务也可能属于客户。只输入一部分也可能违约。正确做法是确认合同和公司规定；一律不用则过度。","ej":"受託案件のデータ＝契約・秘密保持条項を確認"},{"id":"d6-051","d":6,"t":"6.2","n":1,"q":"「仮名化」と「匿名化」の違いについて、最も適切な説明はどれか。","qz":"关于“假名化”和“匿名化”的区别，最合适的说明是哪一个？","o":[{"j":"仮名化も匿名化も同じ意味で、どちらも個人情報ではなくなる","z":"假名化和匿名化意思相同，都不再是个人信息"},{"j":"仮名化は氏名などを記号に置き換えるが、対応表などで元の個人を特定できる可能性が残る。匿名化は個人を特定できない状態にすること","z":"假名化是把姓名等替换成代号，但通过对照表等仍可能识别出原来的个人；匿名化是使个人无法被识别"},{"j":"匿名化は氏名だけを消すことで、住所や生年月日はそのまま残してよい","z":"匿名化只是删除姓名，地址和出生日期可以保留"},{"j":"仮名化したデータは対応表がなくても元に戻せないので、匿名化よりも安全性が高く、規制の対象外になる","z":"假名化的数据没有对照表也无法还原，因此比匿名化更安全，不受法规约束"}],"a":[1],"e":"假名化后的数据仍可能结合其他信息识别出个人，通常仍受个人信息相关规定约束；匿名化是让个人无法被识别。只删姓名而保留地址、出生日期等，组合后仍能识别个人，不算匿名化。","ej":"仮名化＝再識別の可能性あり／匿名化＝特定できない"},{"id":"d6-052","d":6,"t":"6.2","n":1,"q":"Claudeに画面の不具合を相談するため、業務システムのスクリーンショットをアップロードしようとしている。画面には顧客の氏名と住所が表示されている。最も適切な対応はどれか。","qz":"为了向Claude咨询界面故障，打算上传业务系统的截图。画面上显示了客户的姓名和地址。最合适的应对是哪一个？","o":[{"j":"画像なのでClaudeは文字を読めず、問題にならない","z":"因为是图片，Claude读不出文字，所以没问题"},{"j":"アップロード後に「顧客情報は無視して」と指示する","z":"上传后指示“请忽略客户信息”"},{"j":"顧客情報の部分を切り取るかマスキングしてから、必要な部分だけをアップロードする","z":"把客户信息部分裁掉或打码，只上传需要的部分"},{"j":"不具合相談のためには画面全体が必要なので、顧客情報が写ったまま複数枚アップロードする","z":"为了咨询故障需要整个画面，所以带着客户信息上传多张截图"}],"a":[2],"e":"Claude 能读取图片中的文字，截图也是个人信息的输入。应遵循数据最小化，裁剪或打码后只上传需要的部分。上传后再说“忽略”并不能撤回已经输入的数据。","ej":"スクリーンショットも個人情報＝切り取り・マスキング"},{"id":"d6-053","d":6,"t":"6.2","n":1,"q":"人事担当者が、社員の健康診断結果をClaudeで集計・分析したいと考えている。最も適切な対応はどれか。","qz":"人事负责人想用Claude汇总分析员工的体检结果。最合适的应对是哪一个？","o":[{"j":"分析結果の精度を上げるため、全社員の個人ごとの診断結果をそのまま入力する","z":"为了提高分析精度，直接输入全体员工每个人的体检结果"},{"j":"社内の人事データなので、通常の業務データと同じように扱ってよい","z":"是公司内部的人事数据，可以和普通业务数据一样处理"},{"j":"氏名を削除すれば、社員番号や部署が残っていても問題ない","z":"只要删除姓名，即使保留员工编号和部门也没问题"},{"j":"健康情報は特に配慮が必要な個人情報にあたるため、社内規程と法令で利用目的や取扱いが認められているかを確認し、必要に応じて統計化・匿名化したデータを使う","z":"健康信息属于需要特别注意的个人信息（要配虑个人信息），应确认公司规定和法令是否允许该利用目的和处理方式，必要时使用统计化、匿名化的数据"}],"a":[3],"e":"健康信息在日本个人信息保护法中属于“要配虑个人信息”，处理要求更严格。需要确认目的和规定，并尽量用统计化或匿名化的数据。员工编号、部门可以识别个人，只删姓名不够。","ej":"健康情報＝要配慮個人情報。目的・規程を確認し最小化"},{"id":"d6-054","d":6,"t":"6.2","n":1,"q":"Gmailコネクタを使って、過去の取引先メールから案件の経緯をClaudeにまとめさせたい。データ保護の観点で最も適切な使い方はどれか。","qz":"想用Gmail连接器让Claude从过去与客户的邮件中整理项目经过。从数据保护的角度看，最合适的用法是哪一个？","o":[{"j":"組織がコネクタの利用を認めていることを確認し、対象の案件に関係するメールに絞って検索させ、出力に含まれる第三者の情報の扱いに注意する","z":"确认组织允许使用该连接器，只针对相关项目的邮件进行搜索，并注意输出中包含的第三方信息的处理"},{"j":"コネクタ経由ならデータは保護されるので、社内規程の確認は不要である","z":"通过连接器数据就会受到保护，所以不需要确认公司规定"},{"j":"効率のため、受信箱全体を対象に、関係のないメールも含めて自由に検索させる","z":"为了效率，以整个收件箱为对象，包括无关邮件在内自由搜索"},{"j":"Claudeにまとめさせた内容を、元のメールを確認せずにそのまま取引先に転送する","z":"把Claude整理的内容不核对原邮件，直接转发给客户"}],"a":[0],"e":"连接器也要遵循组织的许可和最小化原则：限定用途和范围，注意邮件中第三方的个人信息。“通过连接器就安全”是误解；不核对原文就外发，则同时存在准确性和信息泄露风险。","ej":"コネクタ＝組織の許可＋必要な範囲に絞る"},{"id":"d6-055","d":6,"t":"6.2","n":1,"q":"在宅勤務中の社員が、会社のClaudeにログインできないため、個人で契約しているClaudeで業務資料を処理しようとしている。最も適切な行動はどれか。","qz":"一名居家办公的员工登录不了公司的Claude，打算用自己个人订阅的Claude处理工作资料。最合适的行动是哪一个？","o":[{"j":"同じClaudeなので、個人アカウントでも会社と同じ条件で保護される","z":"都是Claude，个人账号也会和公司一样受到同等保护"},{"j":"業務資料は個人アカウントで扱わず、ヘルプデスク等に連絡して会社の環境へのアクセスを回復してから作業する","z":"工作资料不用个人账号处理，联系帮助台等恢复对公司环境的访问后再工作"},{"j":"個人アカウントの学習利用設定をオフにしておけば、会社の環境と同じ扱いになるので、社内規程に関係なく業務資料を入力してよい","z":"只要关闭个人账号的训练使用设置，就和公司环境一样，所以可以不顾公司规定输入工作资料"},{"j":"個人アカウントで処理した後、履歴を削除すれば問題ない","z":"用个人账号处理后删除历史记录就没问题"}],"a":[1],"e":"个人方案和公司签约的商用方案在合同条款、管理员控制、数据处理上不同，工作资料应只在公司批准的环境中处理。删除历史或关闭训练设置都不能代替公司政策的要求。","ej":"業務データ＝会社が承認した環境のみ。個人アカウントは使わない"},{"id":"d6-056","d":6,"t":"6.2","n":2,"q":"データ最小化の考え方に沿った行動として、適切なものを2つ選べ。","qz":"以下符合数据最小化思路的行动，合适的有哪两个？","o":[{"j":"一度アップロードしたデータは、目的が終わっても参照のために残し続ける","z":"一旦上传的数据，即使目的完成后也继续保留以便参考"},{"j":"後で使うかもしれないので、関連しそうなデータはすべてProjectナレッジに入れておく","z":"因为以后可能会用到，把看起来相关的数据全部放进Project知识库"},{"j":"分析の目的に必要な列だけを残し、氏名や連絡先などの不要な列は削除してから入力する","z":"只保留分析目的所需的列，删除姓名、联系方式等不需要的列后再输入"},{"j":"精度を上げるため、元データにない個人の属性もClaudeに推測させて追加する","z":"为了提高精度，让Claude推测并添加原始数据中没有的个人属性"},{"j":"個人ごとのデータが不要な分析では、部署単位などに集計したデータを使う","z":"在不需要个人数据的分析中，使用按部门等单位汇总的数据"}],"a":[2,4],"e":"数据最小化是只使用目的所需的最少数据：删除不需要的列、用汇总数据代替个人数据。“以后可能用到”而保存、用完不删、推测个人属性都会扩大风险，后者还可能产生新的敏感信息。","ej":"データ最小化＝目的に必要な最小限だけ使う"},{"id":"d6-057","d":6,"t":"6.2","n":1,"q":"社内の検討資料をアーティファクトとして作成し、共有リンクで公開しようとしている。資料には未発表の価格情報が含まれる。最も適切な行動はどれか。","qz":"在Claude中把内部讨论资料制作成Artifact，打算通过分享链接公开。资料中包含未发布的价格信息。最合适的行动是哪一个？","o":[{"j":"リンクを知っている人しか見られないので、誰に転送されても問題ない","z":"只有知道链接的人才能看到，所以被转发给谁都没问题"},{"j":"価格情報は数字なので機密にはあたらない","z":"价格信息只是数字，不算机密"},{"j":"共有範囲の設定と社内規程を確認し、未発表の価格情報は社内限定で共有するか、公開版からは削除する","z":"确认分享范围设置和公司规定，未发布的价格信息只在公司内部共享，或从公开版本中删除"},{"j":"公開後に問題があれば、そのときにリンクを削除すれば元に戻せるので、まず公開して社内外の反応を見てから内容を調整する","z":"公开后如果有问题，到时删除链接就能恢复原状，所以先公开，看看公司内外的反应再调整内容"}],"a":[2],"e":"分享链接可能被转发，未发布价格属于机密信息。应先确认分享范围和规定，限定在公司内部或删除敏感内容。“事后删除”无法收回已被查看或保存的信息。","ej":"共有・公開の前に共有範囲と機密情報を確認"},{"id":"d6-058","d":6,"t":"6.2","n":1,"q":"社外の参加者もいるオンライン会議の録音を文字起こしし、Claudeで議事録を作りたい。最も適切な対応はどれか。","qz":"想把有外部人员参加的线上会议录音转写，并用Claude制作会议纪要。最合适的应对是哪一个？","o":[{"j":"社外参加者の発言は個人情報になるので、録音データは会社のシステムではなく自分の個人クラウドに丸ごと保存して管理しておく","z":"外部参会者的发言属于个人信息，所以把录音数据整个保存到自己的个人云盘而不是公司系统中管理"},{"j":"社外の参加者には関係ないので、知らせる必要はない","z":"与外部参会者无关，所以不需要告知"},{"j":"録音したことが分からないように、議事録には発言者名を一切書かない","z":"为了不让人知道录了音，纪要中完全不写发言人姓名"},{"j":"会議の録音・AIでの処理について、社内規程を確認し、必要に応じて参加者に事前に知らせて了承を得る","z":"确认公司关于会议录音和AI处理的规定，必要时事先告知参会者并取得同意"}],"a":[3],"e":"录音和用 AI 处理会议内容会涉及参会者的个人信息和对方公司的机密，应按规定事先告知并取得同意，这也是透明性的要求。隐瞒录音、存放到个人云盘都违反数据管理原则。","ej":"録音・AI処理＝規程確認と参加者への事前の周知"},{"id":"d6-059","d":6,"t":"6.2","n":1,"q":"新システムのテスト用データを作るため、本番環境の顧客データをClaudeに渡して「似たデータを作って」と依頼しようとしている。最も適切な方法はどれか。","qz":"为了制作新系统的测试数据，打算把生产环境的客户数据交给Claude，请它“生成类似的数据”。最合适的方法是哪一个？","o":[{"j":"本番データは渡さず、項目名・形式・値の範囲などの仕様だけを伝えて、架空のテストデータを生成させる","z":"不提供生产数据，只告诉它字段名、格式、取值范围等规格，生成虚构的测试数据"},{"j":"本番データをそのまま渡す方がリアルなテストデータができる","z":"直接给生产数据能生成更真实的测试数据"},{"j":"顧客の氏名だけを「テスト太郎」などの仮の名前に置き換えれば、住所や電話番号は本物のままでもテストデータとして使ってよい","z":"只要把客户姓名换成“测试太郎”等临时名字，地址和电话号码保留真实的也可以作为测试数据使用"},{"j":"テストデータの作成は個人情報とは関係がないので、規程を確認せずに本番データを使う","z":"制作测试数据与个人信息无关，所以不确认规定就使用生产数据"}],"a":[0],"e":"生成测试数据并不需要真实客户信息，只提供规格让 Claude 生成虚构数据，就能满足需求且不暴露个人信息。只替换姓名、保留地址电话，仍然是个人信息。","ej":"テストデータ＝本番データを使わず仕様から架空データを生成"},{"id":"d6-060","d":6,"t":"6.2","n":1,"q":"購入した有料の市場調査レポートをProjectナレッジにアップロードし、チームで分析に使いたい。最も適切な対応はどれか。","qz":"想把购买的付费市场调研报告上传到Project知识库，供团队分析使用。最合适的应对是哪一个？","o":[{"j":"購入したものなので、どのように使っても自由である","z":"因为是买来的，怎么用都是自由的"},{"j":"レポートの利用規約やライセンスで、AIサービスへの入力や社内共有の範囲が認められているか確認する","z":"确认报告的使用条款或许可是否允许输入AI服务、以及在公司内共享的范围"},{"j":"レポートを自分の言葉で要約してからアップロードすれば、著作物そのものではなくなるのでライセンスの問題は生じない","z":"先用自己的话把报告摘要后再上传，就不再是著作物本身，所以不会产生许可问题"},{"j":"著作権の問題を避けるため、レポートの内容をClaudeに推測で再現させる","z":"为了避免著作权问题，让Claude靠推测重现报告的内容"}],"a":[1],"e":"付费报告通常有许可条款，可能限制复制、共享人数或输入外部服务。应先确认许可范围。“买了就自由”是误解；摘要后上传也可能超出许可；让 AI 推测重现报告内容既不准确，也不能解决权利问题。","ej":"他者の著作物＝利用規約・ライセンスを確認"},{"id":"d6-061","d":6,"t":"6.2","n":2,"q":"取引先から受け取った資料をClaudeにアップロードする前に、確認すべきこととして適切なものを2つ選べ。","qz":"在把从客户收到的资料上传到Claude之前，应确认的事项中合适的有哪两个？","o":[{"j":"秘密保持契約や取引条件で、外部サービスでの処理が制限されていないか","z":"保密协议或交易条件是否限制在外部服务中处理"},{"j":"資料の作成日が今年かどうか","z":"资料的制作日期是否为今年"},{"j":"資料に個人情報や機密情報が含まれ、社内の情報区分上入力してよいものか","z":"资料是否包含个人信息或机密信息，按公司信息分类是否可以输入"},{"j":"資料のファイル形式がPDFかWordか","z":"资料的文件格式是PDF还是Word"},{"j":"取引先の担当者が資料を作るのにAIを使ったかどうか","z":"客户负责人制作资料时是否使用了AI"}],"a":[0,2],"e":"上传第三方资料前要确认两点：合同（保密协议等）上的限制，以及资料中是否有个人信息、机密信息、按公司信息分类是否允许输入。文件大小、对方是否用了 AI、制作日期与是否可以上传无关。","ej":"社外資料＝契約上の制限＋情報区分を確認"},{"id":"d6-062","d":6,"t":"6.2","n":1,"q":"中国の子会社から受け取った現地顧客のデータを、日本の本社でClaudeを使って分析したい。最も適切な行動はどれか。","qz":"想在日本总部用Claude分析从中国子公司收到的当地客户数据。最合适的行动是哪一个？","o":[{"j":"日本の個人情報保護法だけを守ればよい","z":"只要遵守日本的个人信息保护法就可以"},{"j":"グループ会社間のデータなので、国をまたいでも規制はかからない","z":"因为是集团公司之间的数据，跨国也不受监管"},{"j":"現地の個人情報保護法など越境移転に関する規制を含めて、法務・情報セキュリティ部門に確認してから利用範囲を決める","z":"包括当地个人信息保护法等跨境传输相关法规在内，先向法务和信息安全部门确认，再决定使用范围"},{"j":"規制が複雑なので、Claudeに現地の法律を調べさせて「この利用は合法か」と質問し、合法と回答されたら法務には確認せずに進める","z":"法规复杂，所以让Claude调查当地法律并问“这种用法是否合法”，回答合法就不向法务确认直接推进"}],"a":[2],"e":"跨境数据涉及数据来源国的法规（如中国个人信息保护法中关于跨境传输的规定），集团内部同样适用。应由法务和信息安全部门判断，不能只看日本法，也不能把法律判断交给 AI。","ej":"越境データ＝現地法を含め法務・情報セキュリティに確認"},{"id":"d6-063","d":6,"t":"6.2","n":1,"q":"システムの接続エラーをClaudeに相談するため、設定ファイルの内容を貼り付けようとしている。ファイルにはパスワードとAPIキーが書かれている。最も適切な対応はどれか。","qz":"为了向Claude咨询系统连接错误，打算粘贴配置文件的内容。文件中写有密码和API密钥。最合适的应对是哪一个？","o":[{"j":"会社のClaudeであれば認証情報を入力しても漏れることはないので、設定ファイル全体をそのまま貼り付けてよい","z":"只要是公司的Claude，输入认证信息也不会泄露，所以可以直接粘贴整个配置文件"},{"j":"エラーの原因特定に必要なので、そのまま貼り付ける","z":"为了确定错误原因需要这些信息，所以直接粘贴"},{"j":"貼り付けた後に「パスワードは覚えないで」と指示する","z":"粘贴后指示“不要记住密码”"},{"j":"パスワードやAPIキーを伏せ字やダミー値に置き換えてから貼り付ける","z":"把密码和API密钥替换成遮盖字符或虚拟值后再粘贴"}],"a":[3],"e":"密码和 API 密钥属于认证信息，排查错误通常并不需要真实值。应替换成虚拟值再粘贴。输入后再说“不要记住”无法撤回，“公司环境就不会泄露”也不能成为输入认证信息的理由。","ej":"認証情報（パスワード・APIキー）は伏せてから入力"},{"id":"d6-064","d":6,"t":"6.2","n":1,"q":"部署で、Claudeに入力したデータがどのくらいの期間保存されるのかを知りたいという声が出た。最も適切な対応はどれか。","qz":"部门里有人想知道输入Claude的数据会保存多长时间。最合适的应对是哪一个？","o":[{"j":"組織の管理者や情報セキュリティ部門に、契約プランの条件と組織のデータ保持設定を確認する","z":"向组织管理员或信息安全部门确认签约方案的条件和组织的数据保留设置"},{"j":"データは入力後すぐに完全に消えるので気にする必要はない","z":"数据输入后马上会被完全删除，所以不用担心"},{"j":"Claudeに「あなたは私のデータを何日保存しますか」と聞き、その回答を部署の正式な説明とする","z":"问Claude“你会保存我的数据几天”，把回答作为部门的正式说明"},{"j":"保存期間は分からないので、どのようなデータでも入力して問題ない","z":"因为不知道保存期间，所以什么数据都可以输入"}],"a":[0],"e":"数据保留期间取决于签约方案的条款和组织管理员的设置，应向管理员或信息安全部门确认官方信息。模型的自我说明不是可靠依据；“马上删除”是没有根据的假设；不知道就随便输入正好相反。","ej":"データ保持＝契約条件と管理者設定を確認。Claudeの自己申告に頼らない"},{"id":"d6-018","d":6,"t":"6.3","n":1,"q":"社内のAI利用ポリシーでは「業務では会社が契約した環境のみ使用」と定められている。急ぎの作業で会社のClaudeにアクセスできないとき、最も適切な行動はどれか。","qz":"公司AI使用政策规定“业务中只能使用公司签约的环境”。在紧急工作中无法访问公司的Claude时，最恰当的行动是哪一项？","o":[{"j":"機密情報を含まない部分に限れば影響は小さいので、個人の無料アカウントで作業し、後でIT部門に報告する","z":"只限于不含机密信息的部分影响很小，所以用个人免费账号处理，事后向IT部门报告"},{"j":"ポリシーに従い、アクセス復旧を待つか、IT部門に連絡して代替手段を確認する","z":"遵守政策，等待访问恢复或联系IT部门确认替代手段"},{"j":"同僚のアカウントを借りる","z":"借用同事的账号"},{"j":"個人のスマートフォンの無料アカウントで代わりに作業する","z":"用个人手机上的免费账号代替处理"}],"a":[1],"e":"即使紧急也要遵守组织的AI政策，通过正式渠道（IT部门）解决。个人账号属于“影子AI”，绕开管控；借用账号违反账户管理规定；自行扩大解释政策同样不合规。","ej":"緊急時もポリシー遵守・正規ルートで対応"},{"id":"d6-019","d":6,"t":"6.3","n":2,"q":"組織でClaudeを安全に展開するためのガバナンス施策として適切なものを2つ選べ。","qz":"为了在组织中安全推广Claude，请选出2项恰当的治理措施。","o":[{"j":"入力してよい情報の区分と禁止事項を明文化し、利用者に周知する","z":"把可以输入的信息分类和禁止事项写成明文，并告知用户"},{"j":"問題が起きるまでは利用状況を一切確認しない","z":"在出问题之前完全不确认使用情况"},{"j":"全社員に同じ管理者権限を付与する","z":"给所有员工授予相同的管理员权限"},{"j":"ルールは作らず、各自の良識に任せる","z":"不制定规则，交给每个人的良知"},{"j":"利用状況の確認やアクセス管理など、管理者による統制の仕組みを整える","z":"建立管理员管控机制，如确认使用情况和访问管理"}],"a":[0,4],"e":"治理要有明确的数据分类与禁止事项，并配合管理员层面的访问管理与使用状况监控。只靠个人良知不可控；不监控无法及时发现问题；全员管理员权限违反最小权限原则。","ej":"ルール明文化+管理者統制"},{"id":"d6-020","d":6,"t":"6.3","n":1,"q":"Claudeで作成した対外向け資料について、社内ポリシーでは「AI生成物は公開前に責任者の承認が必要」と定められている。締切が迫っている場合の最も適切な対応はどれか。","qz":"关于用Claude制作的对外资料，公司政策规定“AI生成物在公开前需要负责人批准”。截止日期迫近时，最恰当的应对是哪一项？","o":[{"j":"締切を優先して公開し、公開後すぐに責任者へ報告して事後承認を得る","z":"优先截止日期先公开，公开后立即向负责人报告并获得事后批准"},{"j":"責任者に早めに状況を伝えて承認を依頼し、承認を得てから公開する","z":"尽早向负责人说明情况并请求批准，获得批准后再公开"},{"j":"承認を省略して公開し、後で報告する","z":"省略批准直接公开，事后再报告"},{"j":"AI生成であることを隠して承認プロセスを回避する","z":"隐瞒是AI生成的以规避审批流程"}],"a":[1],"e":"时间紧张也要遵守审批流程，应尽早沟通以获得批准后再公开。先发后报、事后补批、隐瞒AI使用都违反政策和透明原则。","ej":"締切が迫っても承認プロセスを守る"},{"id":"d6-021","d":6,"t":"6.3","n":1,"q":"新しいコネクタ(社外のSaaSとの連携)を部署で使いたい。組織のガバナンスの観点で最も適切な進め方はどれか。","qz":"部门想使用新的连接器（与外部SaaS集成）。从组织治理角度，最恰当的推进方式是哪一项？","o":[{"j":"便利そうなので、各自が個人判断で接続する","z":"看起来方便，每个人自行判断连接"},{"j":"コネクタは全て危険なので一律禁止を提案する","z":"认为所有连接器都危险，提议一律禁止"},{"j":"利用目的とアクセスするデータの範囲を整理し、管理者・情報セキュリティ部門の承認を得てから有効化する","z":"整理使用目的和要访问的数据范围，获得管理员和信息安全部门批准后再启用"},{"j":"まず自分のアカウントで接続して数週間試し、問題がなければ部署全体に展開してから管理者に報告する","z":"先用自己的账号连接试用几周，没有问题就推广到整个部门，然后向管理员报告"}],"a":[2],"e":"新的外部集成会扩大数据访问范围，应明确目的和数据范围，经管理员/安全部门审批后启用（团队/企业版中连接器本就由管理员启用）。个人随意连接、试用后免审批都绕开治理；一律禁止则过度。","ej":"新しい連携は目的・範囲を整理し承認を得る"},{"id":"d6-022","d":6,"t":"6.3","n":1,"q":"社員がClaudeの出力をそのまま社外向けレポートに使用したところ、誤った統計値が含まれていた。再発防止策として最も適切なものはどれか。","qz":"员工把Claude的输出直接用于对外报告，结果其中包含错误的统计数值。作为防止再发的措施，最恰当的是哪一项？","o":[{"j":"Claudeの利用を全面禁止する","z":"全面禁止使用Claude"},{"j":"担当者を処分して終わりにする","z":"处分负责人后就结束"},{"j":"対外資料の数値・事実は一次情報で検証し、レビュー記録を残すルールを定め、周知する","z":"制定并告知规则：对外资料中的数值和事实必须用一次信息验证，并保留审核记录"},{"j":"全員のプロンプトに「正確な統計値のみを使い、誤りは含めないこと」と必ず書くよう指導する","z":"指导所有人在提示中必须写上“只使用准确的统计值，不得包含错误”"}],"a":[2],"e":"根本对策是建立验证流程（以一次信息核对数值事实）并留下审核记录。全面禁止过度；只处分个人不解决流程问题；提示中写“准确”并不能防止幻觉。","ej":"検証ルール+レビュー記録で再発防止"},{"id":"d6-023","d":6,"t":"6.3","n":1,"q":"利用者が、Claudeの出力に差別的と受け取られかねない表現を見つけた。組織として最も適切な対応の流れはどれか。","qz":"用户在Claude的输出中发现了可能被视为歧视的表达。作为组织，最恰当的应对流程是哪一项？","o":[{"j":"その出力を使用せず修正し、社内で定められた報告窓口に共有して、プロンプトやガイドラインの改善につなげる","z":"不使用该输出并修正，向公司规定的报告窗口共享，以改进提示和指南"},{"j":"表現を少し言い換えて差別的に見えないよう調整し、報告は不要として作業を続ける","z":"稍微改写表达使其看起来不歧视，认为不需要报告并继续工作"},{"j":"個人で削除し、誰にも共有しない","z":"个人删除，不与任何人共享"},{"j":"SNSで公開してAIの問題点を指摘する","z":"在社交媒体上公开，指出AI的问题"}],"a":[0],"e":"发现有问题的输出时，应停止使用、修正，并按组织流程报告，以便改进指南和防止再发。私下改写或删除而不报告会失去改进机会；擅自在SNS公开可能泄露内部信息且不符合流程。","ej":"問題出力は使わず、報告窓口へ共有し改善"},{"id":"d6-024","d":6,"t":"6.3","n":1,"q":"部署のProject指示に「顧客情報は入力しないこと」と書いておけば、データ保護のガバナンスとして十分か。最も適切な考え方はどれか。","qz":"如果在部门的Project指示中写上“不要输入客户信息”，作为数据保护治理是否足够？最恰当的观点是哪一项？","o":[{"j":"十分である。Project指示に書かれた禁止事項は、利用者が顧客情報を入力しようとした時点でClaudeが自動的に検知して拒否するため","z":"足够。写在Project指示中的禁止事项，会在用户试图输入客户信息时由Claude自动检测并拒绝"},{"j":"不十分である。Project指示は応答を方向付けるもので入力を制御する仕組みではないため、規程・教育・管理者設定と組み合わせる","z":"不够。Project指示用于引导回答，不是控制输入的机制，需要与规定、培训、管理员设置结合"},{"j":"十分である。指示に書いた内容は法的拘束力を持つため","z":"足够。写在指示里的内容具有法律约束力"},{"j":"不要である。顧客情報の入力は常に許可されているため","z":"不需要。输入客户信息总是被允许的"}],"a":[1],"e":"Project指示只影响Claude如何回应，不能阻止用户输入数据，也没有法律效力。数据保护需要政策、培训、管理员管控等多层措施。","ej":"Project指示は入力制御ではない→規程・教育・管理設定と併用"},{"id":"d6-025","d":6,"t":"6.3","n":2,"q":"組織のAIポリシーに沿ってClaudeを使う個人として、日頃から心がけるべきことを2つ選べ。","qz":"作为按照组织AI政策使用Claude的个人，请选出2项平时应注意的事情。","o":[{"j":"ポリシーが更新されていないか定期的に確認する","z":"定期确认政策是否有更新"},{"j":"判断に迷う使い方は、自己判断せず担当部門に相談する","z":"拿不准的用法不自行判断，咨询负责部门"},{"j":"他の人が使っている方法なら、ポリシーを確認せず真似してよい","z":"别人在用的方法，不确认政策也可以模仿"},{"j":"便利な新機能は、組織の承認前でも積極的に業務で試す","z":"方便的新功能，即使组织尚未批准也积极在业务中试用"},{"j":"ポリシーは入社時に一度読めば十分である","z":"政策入职时读一次就够了"}],"a":[0,1],"e":"AI政策随技术变化频繁更新，需定期确认；不确定时咨询负责部门。盲目模仿他人、只读一次、未批准就在业务中试用新功能都可能违规。","ej":"ポリシーは定期確認、迷ったら相談"},{"id":"d6-065","d":6,"t":"6.3","n":1,"q":"同僚が、会社で承認されていない無料のAIブラウザ拡張機能を使い、取引先とのメールを要約していることに気づいた。最も適切な行動はどれか。","qz":"发现同事在使用公司未批准的免费AI浏览器插件来摘要与客户的邮件。最合适的行动是哪一个？","o":[{"j":"便利なツールなので、自分も同じ拡張機能を使い始める","z":"这是方便的工具，自己也开始使用同样的插件"},{"j":"同僚に会社のAI利用ポリシーを伝えて承認済みのツールを使うよう促し、規程に従って必要な報告を行う","z":"向同事说明公司的AI使用政策，建议使用已批准的工具，并按规定进行必要的报告"},{"j":"同僚の個人的な判断なので、何もしない","z":"这是同事的个人判断，什么都不做"},{"j":"拡張機能の安全性をClaudeに質問し、問題ないと言われたら同僚にそのまま使ってよいと伝え、チーム全体にも勧める","z":"向Claude询问插件的安全性，如果说没问题，就告诉同事可以继续用，并推荐给整个团队"}],"a":[1],"e":"未经批准的 AI 工具（影子 AI）可能让客户邮件流向不受管理的服务，造成信息泄露。应引导使用批准的工具，并按规定报告。跟着用或放任不管都会扩大风险；工具的安全评估应由组织负责，而不是问 AI。","ej":"シャドーAI＝承認済みツールへ誘導し、規程に従って報告"},{"id":"d6-066","d":6,"t":"6.3","n":1,"q":"入力しようとしている資料が、社内の情報区分で入力可能かどうか判断できない。最も適切な行動はどれか。","qz":"无法判断要输入的资料按公司信息分类是否可以输入。最合适的行动是哪一个？","o":[{"j":"判断がつかないので、とりあえず入力してから考える","z":"判断不了，先输入再说"},{"j":"Claudeに資料を見せて、機密かどうかを判断してもらう","z":"把资料给Claude看，让它判断是否属于机密"},{"j":"情報の管理責任者や情報セキュリティ部門に確認し、判断が出るまでは入力しない","z":"向信息管理负责人或信息安全部门确认，在得到判断之前不输入"},{"j":"迷う資料はすべて今後も一切AIで扱わないと自分で決めておき、部署のメンバーにも同じルールを独自に指示する","z":"自己决定以后凡是犹豫的资料都完全不用AI处理，并自行向部门成员下达同样的规则"}],"a":[2],"e":"不确定时应询问负责部门，在得到判断前不输入。先输入再说会造成无法挽回的泄露；让 Claude 判断等于已经把资料输入了；自己定规则并下达给他人则超出个人权限，也不符合治理体系。","ej":"判断できないときは担当部門に確認。確認前は入力しない"},{"id":"d6-067","d":6,"t":"6.3","n":1,"q":"同僚が機密資料を個人のAIアカウントにアップロードしていたことが分かった。本人はすでに削除したと言っている。最も適切な対応はどれか。","qz":"发现同事把机密资料上传到了个人AI账号。本人说已经删除了。最合适的应对是哪一个？","o":[{"j":"削除済みなので、問題は解決している","z":"已经删除了，所以问题已解决"},{"j":"同僚をかばうため、誰にも言わない","z":"为了包庇同事，不告诉任何人"},{"j":"同僚を厳しく注意して二度としないと約束させ、本人も反省しているので、報告はせずに自分の判断でこの件は終わりにする","z":"严厉提醒同事并让他保证不再犯，本人也在反省，所以不报告，由自己判断就此结束"},{"j":"社内のインシデント報告手順に従い、情報セキュリティ部門などに報告して対応を仰ぐ","z":"按照公司的事件报告流程，向信息安全部门等报告并请求处理"}],"a":[3],"e":"即使删除了，数据可能已被处理或保存，影响范围需要专业部门评估。应按事件报告流程报告。隐瞒或私下处理会延误应对，也违反治理规则。","ej":"情報漏えいの可能性＝インシデント手順に従い報告"},{"id":"d6-068","d":6,"t":"6.3","n":1,"q":"管理者が、Google DriveやGmailなどのコネクタを全社員に一斉に有効化しようとしている。ガバナンスの観点で最も適切な進め方はどれか。","qz":"管理员打算对全体员工一次性启用Google Drive、Gmail等连接器。从治理的角度看，最合适的做法是哪一个？","o":[{"j":"業務上必要な部署・利用者から段階的に有効化し、最小権限で設定し、利用ルールと教育をあわせて整備する","z":"从业务需要的部门和用户开始分阶段启用，按最小权限设置，同时完善使用规则和培训"},{"j":"利便性を優先し、全員に全コネクタを有効化し、アクセス範囲も最大にする","z":"优先便利性，为所有人启用所有连接器，访问范围也设为最大"},{"j":"コネクタは危険なので、どの部署にも一切有効化しない","z":"连接器很危险，所以任何部门都不启用"},{"j":"有効化はすべて利用者に任せ、管理者は利用状況を確認しない","z":"启用全部交给用户，管理员不确认使用情况"}],"a":[0],"e":"连接器能让 Claude 访问邮件、文件等敏感数据，应按业务需要分阶段、最小权限启用，并配套规则和培训。一次性全开、完全禁止或放任不管都不是好的治理。","ej":"コネクタ展開＝段階的・最小権限・ルールと教育"},{"id":"d6-069","d":6,"t":"6.3","n":1,"q":"社内ポリシーで「AIを用いて作成した対外文書には、所定の表示を付ける」と定められている。Claudeで下書きし、自分で大幅に修正した文書を社外に出す場合、最も適切な行動はどれか。","qz":"公司政策规定“使用AI制作的对外文件需添加规定的标识”。用Claude起草、自己大幅修改后的文件要对外发出时，最合适的行动是哪一个？","o":[{"j":"大幅に修正したので、AIは使っていないことにする","z":"因为大幅修改过，就当作没有用AI"},{"j":"ポリシーの適用範囲を確認し、該当する場合は所定の表示を付ける。判断に迷う場合は担当部門に確認する","z":"确认政策的适用范围，符合时添加规定的标识；难以判断时向负责部门确认"},{"j":"表示は読み手の印象を悪くするので、付けない","z":"标识会让读者印象变差，所以不加"},{"j":"表示を付けるかどうかは個人の好みで決めてよい","z":"是否添加标识可以按个人喜好决定"}],"a":[1],"e":"应遵守组织的透明性规定。即使修改很多，只要属于政策适用范围就需要标识；不确定时询问负责部门。因为印象或个人喜好而不遵守，都违反政策。","ej":"組織のAI表示ルール＝適用範囲を確認して従う"},{"id":"d6-070","d":6,"t":"6.3","n":2,"q":"組織のAI利用ポリシーに含めるべき内容として、適切なものを2つ選べ。","qz":"以下应包含在组织AI使用政策中的内容，合适的有哪两个？","o":[{"j":"AIの出力を人が確認すべき場面と、問題が起きたときの報告先","z":"需要人工确认AI输出的场合，以及出现问题时的报告对象"},{"j":"Claudeの内部アルゴリズムの詳細","z":"Claude内部算法的细节"},{"j":"社員が使ってよいプロンプトの全文リスト","z":"员工可以使用的提示词全文列表"},{"j":"利用を認めるAIツールと、入力してよい情報の区分","z":"允许使用的AI工具，以及可以输入的信息类别"},{"j":"AIを使ったことを社内外に一切明かさないというルール","z":"绝不向公司内外透露使用了AI的规则"}],"a":[0,3],"e":"AI 使用政策的核心是：可用工具、可输入的数据类别、人工确认的场合、问题的报告途径。模型内部算法与员工无关；列出全部提示词不现实；“一律隐瞒”违背透明性。","ej":"AIポリシー＝承認ツール・情報区分・人の確認・報告先"},{"id":"d6-071","d":6,"t":"6.3","n":1,"q":"各チームが独自にプロンプトテンプレートやProject指示を作り、社内で広く共有し始めた。ガバナンスの観点で最も適切な取り組みはどれか。","qz":"各团队开始自行制作提示词模板和Project指示，并在公司内广泛共享。从治理的角度看，最合适的做法是哪一个？","o":[{"j":"混乱を避けるため、テンプレートの作成と共有を一切禁止する","z":"为了避免混乱，完全禁止制作和共享模板"},{"j":"便利さを優先し、誰でも自由に作成・変更できるようにして、変更内容や変更理由は記録しない運用にする","z":"优先便利性，让任何人都可以自由创建和修改，不记录修改内容和修改理由"},{"j":"テンプレートごとに管理者（オーナー）を決め、内容のレビューと更新履歴の管理を行う","z":"为每个模板确定管理者（负责人），进行内容审查和更新记录管理"},{"j":"テンプレートの内容は各利用者の責任なので、組織としては把握しない方針にする","z":"模板内容是各用户的责任，组织采取不掌握的方针"}],"a":[2],"e":"共享模板会影响很多人的输出质量和合规性，需要确定负责人、审查内容、记录变更。完全放任会造成混乱和风险，完全禁止又会失去标准化带来的好处。","ej":"共有テンプレート＝オーナー・レビュー・変更履歴"},{"id":"d6-072","d":6,"t":"6.3","n":1,"q":"Enterprise プランの監査ログについて、最も適切な説明はどれか。","qz":"关于Enterprise方案的审计日志，最合适的说明是哪一个？","o":[{"j":"Claudeの回答の正確さを自動的に保証する仕組みである","z":"这是自动保证Claude回答准确性的机制"},{"j":"監査ログがあれば、利用規程や教育は必要なくなる","z":"有了审计日志，就不需要使用规定和培训了"},{"j":"利用者が入力した個人情報を自動で削除する仕組みである","z":"这是自动删除用户输入的个人信息的机制"},{"j":"組織内での利用状況を記録・確認し、ガバナンスやインシデント調査に役立てる仕組みである","z":"这是记录和确认组织内使用情况，用于治理和事件调查的机制"}],"a":[3],"e":"审计日志用于记录和追踪组织内的使用情况，支持治理、合规检查和事件调查。它不保证输出正确，也不会自动删除个人信息，更不能代替规定和培训。","ej":"監査ログ＝利用状況の記録・追跡。ガバナンスと調査に使う"},{"id":"d6-073","d":6,"t":"6.3","n":1,"q":"締め切りが迫っており、社内ポリシーで禁止されている方法（未承認ツールの利用）を使えば間に合う状況である。最も適切な行動はどれか。","qz":"截止日期迫在眉睫，只要使用公司政策禁止的方法（使用未批准的工具）就能赶上。最合适的行动是哪一个？","o":[{"j":"ポリシーに従い、上司に状況を報告して、承認済みの手段での対応や期限の調整を相談する","z":"遵守政策，向上司报告情况，商量用已批准的手段应对或调整期限"},{"j":"ポリシーは守るが、締め切りに遅れることは誰にも伝えない","z":"遵守政策，但不告诉任何人会延误截止日期"},{"j":"今回だけなので、未承認ツールを使って締め切りに間に合わせる","z":"就这一次，用未批准的工具赶上截止日期"},{"j":"ポリシーの例外は状況に応じて自分で判断してよいので、未承認ツールを使って間に合わせ、使った後で上司に報告する","z":"政策例外可以根据情况自己判断，所以先用未批准的工具赶上，用了之后再向上司报告"}],"a":[0],"e":"时间压力不是违反政策的理由。正确做法是遵守政策并主动升级：报告上司，商量批准的手段或调整期限。私自例外、先斩后奏都破坏治理；不报告延误也会造成更大问题。","ej":"期限より規程を優先。上司に報告して相談（エスカレーション）"},{"id":"d6-074","d":6,"t":"6.3","n":1,"q":"チームのProjectのオーナーである社員が退職することになった。Projectには業務で使う指示とナレッジが入っている。最も適切な対応はどれか。","qz":"团队Project的负责人即将离职。Project中保存着业务所需的指示和知识。最合适的应对是哪一个？","o":[{"j":"退職者のアカウントを削除するとProjectが使えなくなるので、アカウントを残したまま、引き続き退職者の権限でProjectを使う","z":"删除离职者的账号Project就不能用了，所以保留账号，继续用离职者的权限使用Project"},{"j":"Projectの管理権限を後任者に引き継ぎ、退職者のアクセスは組織の手順に従って停止する","z":"把Project的管理权限交接给继任者，按组织流程停止离职者的访问"},{"j":"Projectを削除し、後任者が一から作り直す","z":"删除Project，由继任者从头重建"},{"j":"退職者が個人アカウントにProjectのナレッジを持ち出せるようにする","z":"让离职者可以把Project的知识带到个人账号"}],"a":[1],"e":"人员变动时，要交接管理权限，并按流程停止离职者的访问，以保证业务连续性和访问控制。保留离职者的权限、让其带走资料都有安全风险；删除重建则浪费已有成果。","ej":"退職時＝権限の引継ぎとアクセス停止"},{"id":"d6-075","d":6,"t":"6.3","n":1,"q":"業務委託先が「御社のデータを当社のAIアカウントで処理したい」と申し出てきた。最も適切な対応はどれか。","qz":"外包方提出：“想用我方公司的AI账号处理贵公司的数据。”最合适的应对是哪一个？","o":[{"j":"委託先の判断に任せる","z":"交给外包方判断"},{"j":"委託先も同じClaudeを使っているなら、確認なしで許可する","z":"如果外包方也用同样的Claude，不经确认就允许"},{"j":"委託先が使うAIサービスとデータの扱いについて、契約・社内規程に照らして関係部門が確認し、承認されるまでは許可しない","z":"由相关部门对照合同和公司规定确认外包方使用的AI服务和数据处理方式，在批准之前不允许"},{"j":"口頭で「注意して使ってください」と伝えれば十分である","z":"口头说一句“请注意使用”就足够了"}],"a":[2],"e":"委托方处理我方数据时，数据管理的责任仍在我方。需要按合同和规定确认对方的服务和数据处理条件，批准后才允许。同样是 Claude，方案和设置也可能不同；口头提醒不能代替正式的确认流程。","ej":"委託先のAI利用＝契約・規程で確認し承認を得る"},{"id":"d6-076","d":6,"t":"6.3","n":2,"q":"組織のAIポリシーに沿ってClaudeを利用する個人の行動として、適切なものを2つ選べ。","qz":"作为按照组织AI政策使用Claude的个人，以下行动中合适的有哪两个？","o":[{"j":"ポリシーは管理者のためのものなので、利用者は読まなくてよい","z":"政策是给管理员看的，用户不用读"},{"j":"Claudeの出力で問題（誤情報・不適切な表現など）を見つけたら、決められた窓口に報告する","z":"发现Claude的输出有问题（错误信息、不恰当的表达等）时，向规定的窗口报告"},{"j":"ポリシーで迷う点があっても、自分の解釈で進める","z":"即使对政策有疑问，也按自己的理解进行"},{"j":"ポリシーの改定情報を確認し、変更があれば自分の使い方を見直す","z":"确认政策的修订信息，有变更时调整自己的使用方法"},{"j":"便利な使い方は、ポリシーに反していても同僚に広める","z":"方便的用法，即使违反政策也向同事推广"}],"a":[1,3],"e":"个人的责任是了解并跟进政策、遇到问题及时报告。按自己的理解处理疑问、不读政策、推广违规用法，都会使治理失效。","ej":"個人の責務＝ポリシーを理解・更新を確認・問題を報告"},{"id":"d6-077","d":6,"t":"6.3","n":1,"q":"Claudeの利用を全社に広げる前に、利用者向けに行う施策として最も適切なものはどれか。","qz":"在把Claude的使用推广到全公司之前，面向用户的措施中最合适的是哪一个？","o":[{"j":"利用者には何も説明せず、使いながら覚えてもらう","z":"不向用户做任何说明，让他们边用边学"},{"j":"利用者全員に最上位のプランと全機能を開放し、ルールは問題が起きてから決める","z":"向所有用户开放最高级方案和全部功能，规则等出了问题再定"},{"j":"禁止事項の一覧だけを配布し、具体的な使い方は説明しない","z":"只发放禁止事项列表，不说明具体用法"},{"j":"ハルシネーションやデータ取扱いのルールを含む利用ガイドと研修を用意し、受講した人から利用できるようにする","z":"准备包含幻觉和数据处理规则的使用指南和培训，参加培训的人才可以使用"}],"a":[3],"e":"推广前提供包含局限性（幻觉）、数据规则和实际用法的培训，能同时提高效果和安全性。不说明、只列禁止事项、先开放再定规则，都会增加误用风险。","ej":"全社展開の前に、ガイドと研修を整備"},{"id":"d6-026","d":6,"t":"6.4","n":1,"q":"Claudeを大きく活用して作成したブログ記事を、自社サイトで公開する。AI Fluencyの「Diligence(責任)」の観点で最も適切な対応はどれか。","qz":"要在公司网站发布大量借助Claude写成的博客文章。从AI Fluency的“Diligence（尽责）”角度，最恰当的应对是哪一项？","o":[{"j":"AI利用は一切記載せず、自分が書いたと主張する","z":"完全不写AI使用情况，声称是自己写的"},{"j":"内容の正確性を自分で確認し、組織の方針に沿ってAIの利用について適切に開示し、内容に責任を持つ","z":"自己确认内容的准确性，按组织方针适当披露AI的使用，并对内容负责"},{"j":"正確性の確認は読者に任せる","z":"准确性的确认交给读者"},{"j":"Claudeに事実確認まで依頼して誤りがないと回答を得たうえで、AIの利用は記載せずに公開する","z":"让Claude也做事实确认并得到没有错误的回答后，不注明AI使用直接公开"}],"a":[1],"e":"Diligence强调对AI参与产出的内容负责：自己验证、透明（按方针适当披露）、承担责任。让Claude自查不能代替本人验证；把责任推给AI或读者、刻意隐瞒都违背这一原则。","ej":"Diligence=検証・透明性・責任"},{"id":"d6-027","d":6,"t":"6.4","n":1,"q":"Claudeに「若手社員」と「ベテラン社員」向けの研修案内を作らせたところ、若手を一律に未熟と決めつける表現が含まれていた。最も適切な対応はどれか。","qz":"让Claude制作面向“年轻员工”和“资深员工”的培训通知时，其中包含把年轻人一律认定为不成熟的表达。最恰当的应对是哪一项？","o":[{"j":"ステレオタイプに基づく表現を修正し、必要なら「年齢や属性で決めつけない」と条件を加えて再生成する","z":"修正基于刻板印象的表达，必要时加上“不要以年龄或属性下定论”的条件重新生成"},{"j":"表現が強いほうが伝わるので、さらに強調させる","z":"表达越强越能传达，所以让它进一步强调"},{"j":"若手向けの研修自体をやめる","z":"取消面向年轻人的培训本身"},{"j":"Claudeは中立に作られているので、年齢層による表現の違いは統計的な傾向を反映したものとしてそのまま使う","z":"Claude被设计为中立，因此年龄层间的表达差异是反映统计趋势，直接使用"}],"a":[0],"e":"AI输出可能含有偏见或刻板印象，使用者需识别并修正，必要时在提示中加入约束再生成。没有恶意不代表没有伤害；取消培训不解决问题；强化偏见会造成伤害。","ej":"ステレオタイプ表現は修正・条件を加えて再生成"},{"id":"d6-028","d":6,"t":"6.4","n":1,"q":"顧客との対話にClaudeを使って生成した文章を送る場合、倫理的な観点で最も重視すべきことはどれか。","qz":"在与客户的沟通中发送用Claude生成的文字时，从伦理角度最应重视的是哪一项？","o":[{"j":"顧客の満足度を高めるため、競合よりも有利な条件を可能な限り強調した表現になっていること","z":"为提高客户满意度，表达尽可能强调比竞争对手更有利的条件"},{"j":"送信までの時間ができるだけ短いこと","z":"发送前的时间尽可能短"},{"j":"顧客を誤解させる内容(誇大な表現や事実と異なる約束)が含まれていないかを確認する","z":"确认其中是否包含误导客户的内容（夸大表达或与事实不符的承诺）"},{"j":"文章ができるだけ長いこと","z":"文字尽可能长"}],"a":[2],"e":"伦理上最重要的是不误导、不做虚假承诺，保护客户利益。过度强调有利条件可能构成夸大；模型版本、速度、长度都不是伦理核心。","ej":"誤解を招く表現・虚偽の約束がないか確認"},{"id":"d6-029","d":6,"t":"6.4","n":2,"q":"AI利用の倫理的な影響について、適切な考え方を2つ選べ。","qz":"关于AI使用的伦理影响，请选出2项恰当的观点。","o":[{"j":"AIは中立なので、倫理的配慮は不要である","z":"AI是中立的，因此不需要伦理考量"},{"j":"AIの出力は学習データの偏りを反映する可能性があるため、影響を受ける人の視点で確認する","z":"AI输出可能反映训练数据的偏差，因此要从受影响者的角度确认"},{"j":"効率が上がるなら、透明性は犠牲にしてよい","z":"只要效率提高，可以牺牲透明性"},{"j":"法律で禁止されていなければ、倫理的な問題はない","z":"只要法律不禁止，就没有伦理问题"},{"j":"AIの出力を利用した結果の責任は、最終的に利用した人・組織にある","z":"利用AI输出所产生结果的责任，最终在于使用的人和组织"}],"a":[1,4],"e":"责任在使用者和组织；AI可能带有偏差，需要从受影响者的视角审视。AI并非天然中立；合法不等于合乎伦理；不能以效率为由牺牲透明性。","ej":"責任は人・組織／偏りを影響を受ける人の視点で確認"},{"id":"d6-030","d":6,"t":"6.4","n":1,"q":"社内の評価面談の準備で、上司がClaudeに部下のSlack発言を大量に読み込ませて「性格分析」をさせようとしている。最も適切な判断はどれか。","qz":"为准备内部评价面谈，上司想让Claude读取下属大量的Slack发言进行“性格分析”。最恰当的判断是哪一项？","o":[{"j":"分析結果を本人に見せなければ問題ない","z":"只要不让本人看分析结果就没问题"},{"j":"本人の同意や社内規程の根拠がなく、プライバシーや公正性の懸念が大きいため行うべきではない","z":"没有本人同意或公司规定依据，隐私和公正性方面担忧很大，因此不应进行"},{"j":"業務チャットは会社のものなので自由に分析してよい","z":"业务聊天属于公司，可以自由分析"},{"j":"業務チャットは会社の資産であり、Claudeの分析は人の主観より客観的なので、評価の参考資料として使ってよい","z":"业务聊天是公司资产，而且Claude的分析比人的主观更客观，可以作为评价参考资料"}],"a":[1],"e":"未经同意、无规定依据地对个人进行“性格分析”并用于评价，涉及隐私、监视和公平问题，属于不恰当用途。“公司所有”不等于可以任意用于个人画像；隐瞒结果更不透明；AI分析并不客观可靠。","ej":"同意・根拠のない個人プロファイリングはNG"},{"id":"d6-031","d":6,"t":"6.4","n":1,"q":"Claudeで作成した画像やデザイン案を広告に使う予定である。倫理・権利の観点で最も適切な対応はどれか。","qz":"计划把用Claude制作的图像或设计方案用于广告。从伦理和权利角度，最恰当的应对是哪一项？","o":[{"j":"広告審査は不要として公開する","z":"认为不需要广告审核就公开"},{"j":"既存の作品やブランド、実在の人物に酷似していないかを確認し、社内の法務・ブランド規程に沿って使用可否を判断する","z":"确认是否与现有作品、品牌或真实人物高度相似，并按公司法务和品牌规定判断能否使用"},{"j":"AI生成物には著作権が発生しないため、既存の作品やブランドに似ていても権利侵害にはならないと判断し、確認せずに広告に使用する","z":"AI生成物不产生著作权，因此判断即使与现有作品或品牌相似也不构成侵权，不经确认就用于广告"},{"j":"AIが作ったものは権利問題が一切発生しない","z":"AI制作的东西完全不会产生权利问题"}],"a":[1],"e":"AI生成内容也可能侵犯他人作品、商标或肖像权，需确认相似性并按法务/品牌规定判断。认为毫无权利问题是误解；刻意模仿著名角色有侵权风险；省略审核不合规。","ej":"既存作品・ブランド・人物との類似を確認"},{"id":"d6-032","d":6,"t":"6.4","n":1,"q":"Claudeに顧客向け説明資料を作らせる際、障がいのある人を含む多様な読み手に配慮したい。最も適切な依頼はどれか。","qz":"让Claude制作面向客户的说明资料时，想照顾到包括残障人士在内的多样化读者。最恰当的请求是哪一项？","o":[{"j":"「一般的な読み手だけを想定して」","z":"“只设想一般读者”"},{"j":"「文字を小さくして情報量を増やして」","z":"“把字缩小以增加信息量”"},{"j":"「平易な表現を使い、図には代替テキストを付け、色だけに頼らない構成にして」","z":"“使用平易的表达，给图片加替代文字，不要只依赖颜色来区分”"},{"j":"「主要な読み手である一般顧客に合わせて、色分けした図表を中心に情報を視覚的に伝えて」","z":"“配合主要读者一般客户，以颜色区分的图表为中心，视觉化地传达信息”"}],"a":[2],"e":"包容性（可访问性）是负责任使用的一部分：平易语言、替代文字、不只用颜色传达信息。堆砌术语、只考虑一般读者、缩小字体都会排除部分读者。","ej":"平易な表現・代替テキスト・色に頼らない"},{"id":"d6-033","d":6,"t":"6.4","n":1,"q":"競合他社の社員の個人SNSを大量に収集し、Claudeで分析して引き抜き対象を探そうという提案があった。最も適切な判断はどれか。","qz":"有人提议大量收集竞争对手员工的个人社交账号，用Claude分析来寻找挖角对象。最恰当的判断是哪一项？","o":[{"j":"分析結果を社外に出さなければ問題ない","z":"只要分析结果不外传就没问题"},{"j":"個人を対象にした監視・プロファイリングにあたり、プライバシーや法令・倫理上の問題があるため行わない","z":"属于针对个人的监视和画像，存在隐私、法律和伦理问题，因此不做"},{"j":"Claudeが拒否しなければ問題ない","z":"只要Claude不拒绝就没问题"},{"j":"対象はSNSで公開されている情報に限られるため、個人の同意がなくても採用活動のための分析は問題ない","z":"对象只限于社交媒体上公开的信息，因此即使没有个人同意，为招聘活动进行分析也没问题"}],"a":[1],"e":"即使是公开信息，大规模收集并对特定个人进行画像也可能违反隐私法规和伦理。公开≠可以任意使用；不外传不能消除问题；AI没有拒绝也不代表行为正当，判断责任在人。","ej":"公開情報でも個人の監視・プロファイリングはNG"},{"id":"d6-078","d":6,"t":"6.4","n":1,"q":"大学院に在籍する社員が、Claudeで書いた文章を論文の一部として提出しようとしている。大学の規程ではAI利用の申告が求められている。最も適切な行動はどれか。","qz":"在读研究生的员工打算把用Claude写的文字作为论文的一部分提交。大学规定要求申报AI的使用情况。最合适的行动是哪一个？","o":[{"j":"大学の規程に従ってAIの利用範囲を申告し、内容と引用の正確さは自分で確認する","z":"按照大学规定申报AI的使用范围，并自己确认内容和引用的准确性"},{"j":"自分の名前で提出するので、AIの利用は申告しない","z":"因为是以自己的名义提交，所以不申报AI的使用"},{"j":"AIを使ったことが分からないよう、Claudeに文体を変えさせる","z":"为了不让人看出用了AI，让Claude改变文风"},{"j":"Claudeが作った参考文献リストはそのまま使ってよいので、文献の実在確認は省き、申告もしない","z":"Claude生成的参考文献列表可以直接使用，省略确认文献是否存在，也不申报"}],"a":[0],"e":"在要求原创性的场合，应遵守规定如实申报 AI 的使用，这是透明性和诚信的要求。参考文献可能是编造的，必须确认是否真实存在。隐瞒、刻意掩饰都违反学术伦理。","ej":"透明性＝規程に従ってAI利用を申告。引用は実在確認"},{"id":"d6-079","d":6,"t":"6.4","n":1,"q":"マーケティング担当者が、高齢者の不安をあおって高額商品を購入させるような広告文をClaudeに作らせようとしている。最も適切な判断はどれか。","qz":"营销负责人打算让Claude写一则通过煽动老年人的不安来促使其购买高价商品的广告文案。最合适的判断是哪一个？","o":[{"j":"売上が上がるなら、表現の工夫の範囲として問題ない","z":"只要能提高销售额，就属于表达技巧的范围，没问题"},{"j":"弱い立場の人の不安につけこむ操作的な表現は倫理的に問題があり、法令にも抵触しうるため、商品の価値を正確に伝える内容に改める","z":"利用弱势群体不安心理的操纵性表达存在伦理问题，也可能触犯法规，应改为准确传达商品价值的内容"},{"j":"不安をあおる部分を少し弱めれば、高齢者を対象にした手法自体は続けてよい","z":"把煽动不安的部分稍微减弱，以老年人为目标的手法本身可以继续"},{"j":"広告審査で指摘されなければ、そのまま使ってよい","z":"只要广告审核没有指出问题，就可以直接使用"}],"a":[1],"e":"利用老年人等弱势群体的不安来诱导消费属于操纵，有伦理问题，也可能违反消费者保护法规。应改为准确说明商品价值。“能卖就行”“审核没发现就行”“稍微弱化”都没有改变操纵的本质。","ej":"弱い立場につけこむ操作的表現＝倫理的に不適切"},{"id":"d6-080","d":6,"t":"6.4","n":1,"q":"営業資料に、競合他社について「品質問題を隠している」とClaudeが書いた一文が含まれていた。根拠となる情報源は示されていない。最も適切な対応はどれか。","qz":"销售资料中有一句Claude写的关于竞争对手“隐瞒质量问题”的话，没有给出作为依据的信息来源。最合适的应对是哪一个？","o":[{"j":"Claudeが書いたので事実である可能性が高く、そのまま使う","z":"这是Claude写的，很可能是事实，所以直接使用"},{"j":"「〜と言われている」と表現をぼかせば使ってよい","z":"把表达改得模糊一些，比如“据说……”，就可以使用"},{"j":"根拠のない他社への否定的な記述は名誉毀損などのリスクがあるため削除し、比較する場合は確認できる事実に基づいて書く","z":"没有依据的对他社的负面描述存在诽谤等风险，应删除；如需比较，基于可以确认的事实来写"},{"j":"Claudeに「本当ですか」と確認し、「はい」と答えたら使う","z":"问Claude“这是真的吗”，回答“是”就使用"}],"a":[2],"e":"没有依据的负面断言可能是幻觉，对外使用还可能构成诽谤或不正当竞争。应删除，比较时只写可以核实的事实。模糊措辞不能消除风险；让 Claude 自我确认也不能证明真实性。","ej":"根拠のない他社批判＝削除。比較は確認できる事実で"},{"id":"d6-081","d":6,"t":"6.4","n":2,"q":"Claudeに顧客ペルソナを作らせたところ、「主婦は価格にしか関心がない」など、ステレオタイプに基づく記述が多く含まれていた。対応として適切なものを2つ選べ。","qz":"让Claude制作客户画像时，结果包含很多基于刻板印象的描述，例如“家庭主妇只关心价格”。合适的应对有哪两个？","o":[{"j":"Claudeの出力なので、偏りはClaudeの責任であり利用者が修正する必要はない","z":"这是Claude的输出，偏见是Claude的责任，用户不需要修正"},{"j":"性別や職業の記述をすべて削除すれば、内容の確認は不要である","z":"只要删除所有关于性别和职业的描述，就不需要确认内容"},{"j":"ステレオタイプは分かりやすいので、そのまま社内で使う","z":"刻板印象容易理解，所以直接在公司内使用"},{"j":"属性による決めつけを避け、多様な価値観を反映するよう指示し、出力を複数の視点でレビューする","z":"指示它避免按属性下定论、反映多样的价值观，并从多个视角审查输出"},{"j":"実際の顧客調査データを渡し、データに基づいてペルソナを作るよう指示する","z":"提供实际的客户调研数据，指示它基于数据制作画像"}],"a":[3,4],"e":"应对偏见的方法：用真实数据作依据、明确指示避免刻板印象、多视角审查。直接使用会强化偏见；只删除属性描述不能保证其他内容没有偏见；使用者对采用的输出负有责任。","ej":"バイアス対策＝実データ・明示的な指示・多様な視点でのレビュー"},{"id":"d6-082","d":6,"t":"6.4","n":1,"q":"求人広告の文案をClaudeで作成した。「若くて体力のある男性歓迎」という表現が含まれていた。最も適切な対応はどれか。","qz":"用Claude制作了招聘广告文案，其中包含“欢迎年轻有体力的男性”这样的表达。最合适的应对是哪一个？","o":[{"j":"体力が必要な仕事なので、そのまま掲載する","z":"因为是需要体力的工作，所以直接刊登"},{"j":"「男性」だけを削除すれば、年齢の表現は残してよい","z":"只删除“男性”，年龄的表达可以保留"},{"j":"Claudeが書いたものなので、会社の責任にはならない","z":"这是Claude写的，所以不是公司的责任"},{"j":"性別や年齢で応募者を制限する表現は差別につながり、法令にも抵触しうるため、仕事に必要な条件（業務内容・必要な作業）で書き直し、人事・法務の確認を受ける","z":"以性别和年龄限制应聘者的表达会导致歧视，也可能违反法规，应改为工作必需的条件（工作内容、必要作业）重写，并接受人事和法务的确认"}],"a":[3],"e":"招聘广告中按性别、年龄限制应聘者，可能违反男女雇用机会均等法等规定，也构成歧视。应改为描述岗位所需的具体条件，并请人事和法务确认。只删一部分不够；AI 写的内容一旦发布，责任仍在公司。","ej":"採用表現の性別・年齢制限＝差別のリスク。業務要件で書き直す"},{"id":"d6-083","d":6,"t":"6.4","n":1,"q":"自社サイトに、Claudeを使った問い合わせ対応チャットボットを導入する。透明性の観点で最も適切な対応はどれか。","qz":"在公司网站上引入使用Claude的咨询应答聊天机器人。从透明性的角度看，最合适的做法是哪一个？","o":[{"j":"AIが応答していることを利用者に明示し、必要に応じて人の担当者につなぐ手段を用意する","z":"向用户明确说明是AI在应答，并准备必要时转接人工的方式"},{"j":"人が対応していると思わせた方が顧客満足度が高いので、AIであることは伝えず、担当者らしい名前を付けて応答させる","z":"让客户以为是人在应答满意度会更高，所以不告知是AI，并给它起个像负责人的名字来应答"},{"j":"チャットボットに実在の社員の名前と顔写真を使わせる","z":"让聊天机器人使用真实员工的姓名和照片"},{"j":"問い合わせがあった場合だけ、AIであることを認める","z":"只有被问到时才承认是AI"}],"a":[0],"e":"透明性要求让用户知道自己在和 AI 对话，并能在需要时转接人工。假装是人、使用真实员工的身份，都会误导用户；只在被问到时才承认也不够透明。","ej":"チャットボット＝AIであることを明示し、人への引継ぎ手段を用意"},{"id":"d6-084","d":6,"t":"6.4","n":1,"q":"新入社員がClaudeの出力を理解しないまま報告書に貼り付けており、内容について質問されても説明できない。最も適切な対応はどれか。","qz":"新员工不理解Claude的输出就直接粘贴到报告中，被问到内容时也无法说明。最合适的应对是哪一个？","o":[{"j":"出力の正確さは利用者に関係ないので、問題ない","z":"输出的准确性与用户无关，所以没问题"},{"j":"Claudeの出力を自分で理解・検証し、説明できる内容だけを使うよう指導し、AIを学習の補助として使う方法も伝える","z":"指导新员工自己理解和验证Claude的输出，只使用能够说明的内容，并告诉他把AI作为学习辅助的方法"},{"j":"新入社員にはClaudeを使わせないようにする","z":"不让新员工使用Claude"},{"j":"説明できなくても、出典が付いていれば問題ない","z":"即使说明不了，只要有出处就没问题"}],"a":[1],"e":"使用者要对采用的内容负责，必须能理解和验证。过度依赖会影响技能成长，引入 AI 时要考虑员工的能力培养。禁止使用太过头；有出处也不代表本人理解并核实了内容。","ej":"自分で説明できない出力は使わない。AIは学習の補助にも"},{"id":"d6-085","d":6,"t":"6.4","n":2,"q":"人事評価の面談資料作成にClaudeを使う場合の倫理的な配慮として、適切なものを2つ選べ。","qz":"在用Claude制作人事评价面谈资料时，以下伦理上的考虑中合适的有哪两个？","o":[{"j":"評価コメントに、性別・年齢などに基づく偏った表現がないかを確認する","z":"确认评价评语中是否有基于性别、年龄等的偏颇表达"},{"j":"Claudeに部下の性格を推測させ、その結果を評価の根拠にする","z":"让Claude推测下属的性格，并以其结果作为评价依据"},{"j":"部下には、評価の根拠を説明しないようにする","z":"不向下属说明评价的依据"},{"j":"評価の判断は上司が行い、Claudeは事実の整理や文章の推敲などの補助に使う","z":"评价判断由上司做出，Claude用于整理事实、润色文字等辅助工作"},{"j":"評価を効率化するため、Claudeが作った評価文を全員に同じ文面で使う","z":"为了提高评价效率，所有人都使用Claude写的同一份评语"}],"a":[0,3],"e":"人事评价影响个人的待遇和职业，判断必须由人做出，Claude 只做辅助；还要检查评语中的偏见。让 AI 推测性格作为依据缺乏根据且不公平；统一文案无法反映个人；不说明依据违背透明性。","ej":"人事評価＝判断は人。偏りを確認し、根拠を説明できるように"},{"id":"d6-086","d":6,"t":"6.4","n":1,"q":"Claudeを使って作成した顧客向けレポートの誤りが原因で、顧客に損失が生じた。責任の考え方として最も適切なものはどれか。","qz":"由于用Claude制作的客户报告中的错误，导致客户蒙受了损失。关于责任的看法，最合适的是哪一个？","o":[{"j":"AIが間違えたので、利用者や組織には責任がない","z":"是AI出错了，所以用户和组织没有责任"},{"j":"Claudeを提供している会社だけが責任を負う","z":"只有提供Claude的公司负责"},{"j":"出力を採用して提供した利用者と組織が説明責任を負い、原因を分析して確認プロセスを見直す","z":"采用并提供输出的用户和组织负有说明责任，应分析原因并重新审视确认流程"},{"j":"誰も責任を問われないよう、今後はAIを使ったことを顧客に伝えず、問題が起きても個別に対応する","z":"为了谁都不被追责，以后不告诉客户用了AI，出了问题也个别处理"}],"a":[2],"e":"AI 是工具，采用其输出并交付给客户的人和组织负有责任（问责）。应分析原因，改进人工确认流程。把责任推给 AI 或提供商，或今后隐瞒使用，都违背负责任使用的原则。","ej":"説明責任＝出力を採用した利用者・組織にある"},{"id":"d6-087","d":6,"t":"6.4","n":1,"q":"地域の文化や宗教に関わる表現を含む海外向けキャンペーン文をClaudeで翻訳・作成した。最も適切な対応はどれか。","qz":"用Claude翻译和制作了面向海外的宣传文案，其中包含涉及当地文化和宗教的表达。最合适的应对是哪一个？","o":[{"j":"Claudeは多言語に対応しているので、文化的な問題は起きない","z":"Claude支持多语言，所以不会出现文化问题"},{"j":"問題が起きたら謝罪すればよいので、確認せずに公開する","z":"出了问题道歉就行，所以不确认就公开"},{"j":"文化的な表現はすべて削除して、日本語の原文をそのまま直訳する","z":"删除所有文化相关的表达，直接直译日语原文"},{"j":"現地の文化に詳しい担当者やネイティブスピーカーに、意味の正確さと文化的に不適切な表現がないかを確認してもらう","z":"请熟悉当地文化的负责人或母语者确认意思的准确性以及是否有文化上不恰当的表达"}],"a":[3],"e":"翻译在语言上可能通顺，但文化和宗教方面的细微差别容易出错，可能伤害当地人、损害品牌。应请熟悉当地文化的人确认。直译可能更不自然；“出问题再道歉”忽视了伤害难以挽回。","ej":"文化的に繊細な内容＝現地の人によるレビュー"},{"id":"d6-088","d":6,"t":"6.4","n":1,"q":"広告に、実在の有名人がその商品を使っているように見える画像や推薦文を、本人の許可なく生成して使おうという案が出た。最も適切な判断はどれか。","qz":"有人提出：在广告中使用未经本人许可生成的图片或推荐语，让人看起来像是真实名人在使用该商品。最合适的判断是哪一个？","o":[{"j":"本人の許可なく実在の人物が推薦しているように見せることは、肖像権・パブリシティ権の侵害や消費者の誤認につながるため行わない","z":"未经本人许可让人看起来像是真实人物在推荐，会侵犯肖像权、形象权并误导消费者，因此不做"},{"j":"小さく掲載すれば問題ない","z":"只要小尺寸刊登就没问题"},{"j":"「イメージです」と注記すれば、本人の許可なく使ってよい","z":"只要注明“图片仅供参考”，就可以不经本人许可使用"},{"j":"生成した画像なので、本人の権利とは関係ない","z":"因为是生成的图片，与本人的权利无关"}],"a":[0],"e":"未经许可让真实人物“代言”，侵犯肖像权和形象权，也会让消费者误以为真有其事。即使是生成的图片、加了注释或缩小尺寸，问题本质都不变。","ej":"実在の人物の無断利用＝権利侵害と消費者の誤認"},{"id":"d6-089","d":6,"t":"6.4","n":2,"q":"Claudeを使った業務での透明性を高める取り組みとして、適切なものを2つ選べ。","qz":"以下提高使用Claude开展业务透明性的做法中，合适的有哪两个？","o":[{"j":"AIの利用を伝えると評価が下がるので、常に伏せる","z":"告诉别人用了AI会降低评价，所以总是隐瞒"},{"j":"Claudeの出力をすべて自分のオリジナルとして発表する","z":"把Claude的输出全部当作自己的原创发表"},{"j":"組織のルールや相手の求めに応じて、AIを利用したことを適切に開示する","z":"按照组织规则或对方的要求，适当地披露使用了AI"},{"j":"AIを使ったかどうかは誰にも聞かれない限り記録しない","z":"只要没人问，就不记录是否使用了AI"},{"j":"重要な文書で、どの部分にAIを使い、誰が確認したかを記録しておく","z":"在重要文件中，记录哪些部分使用了AI、由谁确认"}],"a":[2,4],"e":"透明性包括：记录 AI 的使用和确认人，按规则和对方要求适当披露。一贯隐瞒、当作自己的原创发表、只有被问到才说，都不符合透明性和诚信。","ej":"透明性＝利用と確認者を記録し、ルールに応じて開示"},{"id":"d6-090","d":6,"t":"6.4","n":1,"q":"Claudeに依頼した内容について、Claudeが「その依頼には対応できません」と回答した。依頼内容は、実在の人物を中傷する文章の作成だった。最も適切な行動はどれか。","qz":"向Claude提出请求后，Claude回答“无法处理该请求”。请求内容是写一篇诽谤真实人物的文章。最合适的行动是哪一个？","o":[{"j":"言い回しを変えたり「これはフィクションです」と前置きしたりして、Claudeが応じるまで表現を工夫しながら繰り返し依頼する","z":"换个说法或加上“这是虚构的”前提，不断调整表达反复请求，直到Claude答应为止"},{"j":"依頼内容自体が他者を傷つけ、名誉毀損にもなりうることを踏まえ、そのような文章の作成をやめる","z":"考虑到请求本身会伤害他人、也可能构成诽谤，放弃写这类文章"},{"j":"別のAIサービスで同じ文章を作らせる","z":"用别的AI服务生成同样的文章"},{"j":"自分で書いた中傷文をClaudeに推敲させる","z":"把自己写的诽谤文章交给Claude润色"}],"a":[1],"e":"问题在于请求本身：诽谤真实人物会伤害他人，并可能违法。应停止这种行为，而不是想办法绕过限制、换工具或换种形式继续。","ej":"他者を傷つける依頼＝手段を変えて続けるのではなく、やめる"},{"id":"d7-001","d":7,"t":"7.1","n":1,"q":"数週間使い続けている1つのチャットで、Claudeが序盤に伝えたルールを守らなくなり、回答の質も落ちてきた。最も可能性の高い原因と対処はどれか。","qz":"在一个连续使用了好几周的对话中，Claude 不再遵守开头告知的规则，回答质量也在下降。最可能的原因和处理方式是哪一个？","o":[{"j":"Claudeが長時間の利用で疲れて集中力が落ちているので、数時間ほど時間を空けてから同じチャットで続ける","z":"Claude 长时间使用后疲劳、注意力下降，所以隔几个小时后在同一对话中继续"},{"j":"会話が長くなりコンテキストが圧迫されている。要点とルールを要約して新しいチャット(またはProject)で再開する","z":"对话太长，上下文被挤占。把要点和规则总结后，在新对话（或 Project）中重新开始"},{"j":"モデルが故障しているので、サポートに連絡する","z":"模型坏了，联系客服"},{"j":"ルールを守らせるため、同じチャットで毎回のメッセージの冒頭にルール全文をコピーして貼り続ける","z":"为了让它遵守规则，在同一对话中每条消息开头都复制粘贴规则全文"}],"a":[1],"e":"对话过长时，上下文窗口被大量历史占用，早期指示的影响变弱，质量下降。正确做法是总结要点、在新对话中重启；长期规则最好放入 Project 指示。AI 不会“疲劳”；这不是故障；在同一长对话里不断复制只会更挤。","ej":"長い会話で品質低下→要約して新しいチャットで再開。恒久ルールはProjectへ。"},{"id":"d7-002","d":7,"t":"7.1","n":1,"q":"Projectにアップロードした最新の価格表があるのに、Claudeが古い価格で回答した。最初に確認すべきこととして最も適切なものはどれか。","qz":"Project 里已经上传了最新价格表，但 Claude 用旧价格回答了。最应该首先确认的是哪一项？","o":[{"j":"プロジェクトナレッジに旧版の価格表も残っていないか、指示にどの資料を優先するか書かれているか","z":"项目知识中是否还留着旧版价格表，指示里是否写明优先使用哪份资料"},{"j":"より高性能なモデルが契約されているか、またそのモデルが最新の学習データを持っているかを確認し、必要なら上位プランに切り替える","z":"是否签约了更高性能的模型，以及该模型是否有最新的训练数据，必要时切换到更高级的方案"},{"j":"チャットの文字サイズ設定","z":"对话界面的字号设置"},{"j":"他の社員も同じ質問をしたかどうか","z":"其他员工是否也问过同样的问题"}],"a":[0],"e":"知识中新旧版本并存、未指定优先级，是引用旧信息的常见原因。应删除或标注旧版，并在指示中写明以最新版为准。模型性能、字号、他人提问与此无关。","ej":"古い情報で回答→ナレッジに旧版が残っていないか、優先順位の指示を確認。"},{"id":"d7-003","d":7,"t":"7.1","n":1,"q":"Claudeに「簡潔に」と指示しているのに、毎回長い回答が返ってくる。最も効果的な修正はどれか。","qz":"已经指示 Claude“简洁一点”，但每次回答都很长。最有效的修改是哪一个？","o":[{"j":"「簡潔に」を3回繰り返して書く","z":"把“简洁”写三遍"},{"j":"回答が長くなるのはモデルの特性なので、より短い回答をする傾向のある別のモデルに切り替える","z":"回答变长是模型特性，所以换成倾向于简短回答的其他模型"},{"j":"回答が長いのは仕様なので諦める","z":"回答长是规格问题，放弃"},{"j":"「3つの箇条書き、各1文以内」のように具体的な分量と形式を指定し、短い例を示す","z":"指定具体的数量和格式，如“3 条要点、每条不超过 1 句”，并给出简短示例"}],"a":[3],"e":"“简洁”是模糊的，每个人理解不同。把要求量化（条数、句数、字数）并给示例，才能稳定控制长度。重复同一模糊词无效；换模型不一定解决；放弃没有必要。","ej":"曖昧な指示(「簡潔に」)は数値と形式で具体化し、例を示す。"},{"id":"d7-004","d":7,"t":"7.1","n":2,"q":"Claudeの出力が期待どおりでないとき、原因を診断するために確認すべき観点として適切なものはどれか。2つ選べ。","qz":"当 Claude 的输出不如预期时，为诊断原因，以下哪些是应检查的方面？请选择 2 项。","o":[{"j":"Claudeに感情的に強く言ったかどうか","z":"是否对 Claude 说了情绪激烈的话"},{"j":"タスクに対してモデルや機能(検索、Research等)の選択が適切か","z":"针对任务，模型和功能（搜索、Research 等）的选择是否合适"},{"j":"プロンプトを書いた時刻","z":"写提示词的时间"},{"j":"使用しているブラウザの色設定","z":"所用浏览器的颜色设置"},{"j":"目的・読み手・制約・出力形式など、必要な情報がプロンプトに含まれているか","z":"提示词中是否包含目的、读者、约束、输出格式等必要信息"}],"a":[1,4],"e":"诊断输出问题，首先看提示词是否缺信息（描述问题），其次看模型/功能是否匹配任务（例如需要最新信息却没开搜索）。浏览器颜色、情绪化语气、书写时间都与输出质量无关。","ej":"診断の基本:プロンプトの情報不足か、モデル・機能の選択ミスか。"},{"id":"d7-005","d":7,"t":"7.1","n":1,"q":"最新のニュースについて質問したところ、Claudeが古い情報に基づいて回答した。最も適切な対処はどれか。","qz":"询问最新新闻时，Claude 基于旧信息作答。最合适的处理是哪一个？","o":[{"j":"同じ質問を何度も繰り返す","z":"反复问同一个问题"},{"j":"Claudeの回答を正しいものとして扱う","z":"把 Claude 的回答当作正确的"},{"j":"Web検索を有効にして再度質問し、出典と日付を確認する","z":"开启网络搜索后再次提问，并确认出处和日期"},{"j":"もっと丁寧な言葉で聞き直し、「最新の情報で答えてください」と強調して再度質問する","z":"用更礼貌的语言重新问，并强调“请用最新信息回答”"}],"a":[2],"e":"模型的训练知识有截止时间，最新信息需要通过网络搜索获取，并核对出处和日期。重复提问和改变措辞不会带来新信息；把过时回答当作正确有风险。","ej":"最新情報が古い→学習データの限界。Web検索を使い、出典と日付を確認。"},{"id":"d7-006","d":7,"t":"7.1","n":1,"q":"Claudeに顧客データの集計を依頼したところ、合計値が元データと一致しなかった。最も適切な対応はどれか。","qz":"请 Claude 汇总客户数据，结果合计值与原始数据不一致。最合适的应对是哪一个？","o":[{"j":"合計値の差は小さいので無視する","z":"差额不大，忽略"},{"j":"コード実行(分析ツール)を使って計算させ、計算手順を示させた上で、元データとサンプル照合する","z":"让它使用代码执行（分析工具）计算并展示计算步骤，再与原始数据抽样核对"},{"j":"Claudeに「この合計は本当に正しいですか」と確認し、「正しい」と回答があればそのまま使う","z":"向 Claude 确认“这个合计真的正确吗”，如果回答“正确”就直接使用"},{"j":"集計作業にはAIは使えないので手作業に戻す","z":"汇总工作不能用 AI，改回手工"}],"a":[1],"e":"精确计算应借助代码执行，让过程透明可复核，并与原始数据抽样对照。忽略差异有风险；模型的自我确认不是可靠依据；完全放弃 AI 则过度反应。","ej":"計算ミス→コード実行で計算させ、手順を示させ、元データと照合。自己申告は根拠にならない。"},{"id":"d7-007","d":7,"t":"7.1","n":1,"q":"Claudeが、Projectの指示に書いた「回答は必ず日本語で」というルールを、英語の資料について質問したときに守らないことがあった。最も適切な改善はどれか。","qz":"Project 指示中写了“回答必须用日语”，但在询问英文资料时，Claude 有时不遵守。最合适的改进是哪一个？","o":[{"j":"英語の資料を使うのをやめる","z":"不再使用英文资料"},{"j":"Projectを削除して作り直す","z":"删除 Project 重新建立"},{"j":"日本語で質問すれば必ず日本語で回答されるので、指示は変えずに質問の言語だけを統一する","z":"只要用日语提问就一定用日语回答，所以不改指示，只统一提问语言"},{"j":"「資料が英語の場合も、回答と引用の訳は日本語で出力する」と、例外になりやすい状況を明示して指示に追記する","z":"在指示中补充，明确写出容易成为例外的情况：“即使资料是英文，回答和引用译文也用日语输出”"}],"a":[3],"e":"指示在特定情境（如英文资料）下失效时，应把该情境明确写进指示。不用英文资料会限制业务；删除重建无针对性；仅靠日语提问并不能保证。","ej":"特定の状況でルールが守られない→その状況を明示して指示に追記。"},{"id":"d7-008","d":7,"t":"7.1","n":1,"q":"Claudeが添付したExcelファイルの一部のシートを読み落としているようだ。最も適切な対応はどれか。","qz":"Claude 似乎漏读了附加 Excel 文件的部分工作表。最合适的应对是哪一个？","o":[{"j":"対象のシート名と見るべき範囲を明示し、各シートの内容を確認したか先に一覧で報告させる","z":"明确目标工作表名称和需要查看的范围，并让它先以列表报告是否确认了每张工作表的内容"},{"j":"Excelファイルを画像(スクリーンショット)に変換し、シートごとに1枚ずつ送り直す。画像の方が読み取り精度が高いため","z":"把 Excel 文件转成图片（截图），每张工作表各发一张。因为图片的识别精度更高"},{"j":"データ分析にはClaudeを使わない","z":"数据分析不用 Claude"},{"j":"読み落としは仕方がないので、そのまま結果を使う","z":"漏读没办法，直接用结果"}],"a":[0],"e":"明确指出要处理的工作表和范围，并让 Claude 先报告读取情况，可以发现和防止遗漏。转成图片会丢失结构化数据；放弃使用和忽略问题都不合适。","ej":"読み落とし対策:対象範囲を明示し、先に読み取り内容を報告させる。"},{"id":"d7-019","d":7,"t":"7.1","n":1,"q":"Claudeが社内規程に関する質問に、規程に存在しない条項を引用して回答した。再発防止策として最も適切なものはどれか。","qz":"Claude 在回答有关内部规定的问题时，引用了规定中并不存在的条款。最合适的防止再发措施是哪一个？","o":[{"j":"規程の原文をナレッジとして提供し、回答時は該当箇所を引用させ、記載がなければ「記載なし」と答えるよう指示する","z":"提供规定原文作为知识，回答时让它引用相应原文，如无记载则指示回答“无记载”"},{"j":"Claudeに「嘘をつかないで」と伝える","z":"告诉 Claude“不要说谎”"},{"j":"回答をより断定的な口調にさせ、条文番号は必ず明記するよう求めて説得力を高める。具体的な条文番号があれば読み手も信頼しやすい","z":"让回答语气更断定，并要求必须写明条款编号以增强说服力。有了具体条款号，读者也更容易信任"},{"j":"引用を禁止し、要約だけを出させる","z":"禁止引用，只输出总结"}],"a":[0],"e":"编造条款是幻觉。对策是提供权威原文作为依据、要求引用原文并允许回答“无记载”。单纯说“别说谎”效果有限；断定语气会掩盖不确定性；禁止引用反而更难核实。","ej":"架空の条項→原文を根拠として渡し、引用させ、「記載なし」を許可。"},{"id":"d7-020","d":7,"t":"7.1","n":2,"q":"コネクタ経由でGoogle Driveの資料を参照させたいが、Claudeが目的のファイルを見つけられない。考えられる原因として適切なものはどれか。2つ選べ。","qz":"想通过连接器让 Claude 参考 Google Drive 的资料，但 Claude 找不到目标文件。以下哪些是可能的原因？请选择 2 项。","o":[{"j":"Claudeの回答スタイルがFormalになっている","z":"Claude 的回答风格设成了 Formal"},{"j":"チャットの背景色がダークモードになっている","z":"对话背景是深色模式"},{"j":"プロンプトが日本語で書かれている","z":"提示词是用日语写的"},{"j":"利用者のアカウントにそのファイルへのアクセス権限がない","z":"使用者的账户没有该文件的访问权限"},{"j":"コネクタが有効化・認証されていない、または組織で管理者が許可していない","z":"连接器未启用或未认证，或组织管理员未允许"}],"a":[3,4],"e":"连接器只能在已启用、已认证且被允许的范围内，以用户自身权限访问数据。所以未启用/未获管理员许可、用户本身没有文件权限都是常见原因。回答风格、语言、深色模式与访问无关。","ej":"コネクタで見つからない→有効化・認証・管理者許可、そして利用者自身の権限を確認。"},{"id":"d7-024","d":7,"t":"7.1","n":1,"q":"Claudeが特定の質問に対して回答を控えたが、業務上正当な依頼(例:セキュリティ研修用に、フィッシングメールの見分け方をまとめる)だった。最も適切な対応はどれか。","qz":"Claude 对某个问题拒绝回答，但这是业务上正当的请求（例如为安全培训整理识别钓鱼邮件的方法）。最合适的应对是哪一个？","o":[{"j":"目的・利用場面・対象者などの正当な文脈を明確に伝えて依頼し直し、それでも難しい場合は社内の適切な窓口に相談する","z":"明确说明目的、使用场景、对象等正当背景后重新请求，如仍有困难，向公司内适当窗口咨询"},{"j":"Claudeの制限を回避するため、インターネットで紹介されている言い回しや裏技を探して試してみる。業務上必要な依頼なので問題はない","z":"为绕过 Claude 的限制，在网上寻找并尝试介绍过的说法和窍门。这是业务上必要的请求，所以没有问题"},{"j":"別人になりすました設定でClaudeをだます","z":"假装成别人来欺骗 Claude"},{"j":"あきらめて研修資料を作らない","z":"放弃，不做培训资料"}],"a":[0],"e":"当正当请求被误判时，补充清楚的业务背景（目的、用途、对象）通常就能得到帮助；必要时按组织流程咨询。寻找绕过方法或伪装身份违反负责任使用原则；直接放弃也不必要。","ej":"正当な依頼が断られたら文脈を明確に伝え直す。回避策やなりすましは不可。"},{"id":"d7-026","d":7,"t":"7.1","n":1,"q":"Claudeに作らせた週次レポートが、毎週異なる見出し構成になってしまう。最も適切な対処はどれか。","qz":"让 Claude 做的周报，每周标题结构都不一样。最合适的处理是哪一个？","o":[{"j":"週によって構成が変わるのはClaudeの創造性なので、そのまま受け入れる","z":"每周结构变化是 Claude 的创造性，直接接受"},{"j":"毎週、出力後に人が見出しを手作業で統一し、次の週も同じプロンプトで依頼を続ける。人の目で整える方が確実で品質も安定する","z":"每周输出后由人工手动统一标题，下周继续用同样的提示词。由人来统一更可靠，质量也稳定"},{"j":"レポートの作成頻度を月1回に減らす","z":"把报告频率减少到每月一次"},{"j":"見出し構成のテンプレートをProjectの指示に記載し、その形式で出力するよう指定する","z":"把标题结构模板写进 Project 指示，指定按此格式输出"}],"a":[3],"e":"格式不稳定的原因是没有固定格式要求，把模板写进 Project 指示最有效。每次手工统一治标不治本；接受变化会影响阅读；降低频率与格式无关。","ej":"形式のばらつき→テンプレートを指示に記載"},{"id":"d7-027","d":7,"t":"7.1","n":1,"q":"Claudeが、長いPDFの後半にある情報について「記載がない」と回答した。実際には記載がある。最初に試すべき対処として最も適切なものはどれか。","qz":"Claude 对长 PDF 后半部分的信息回答“没有记载”，但实际上有记载。最先应该尝试的处理是哪一个？","o":[{"j":"同じ質問を何度も繰り返し、別の答えが出るまで待つ","z":"反复问同一个问题，直到出现不同答案"},{"j":"Claudeは長い資料を扱えないと判断し、今後PDFは一切使わない","z":"判断 Claude 不能处理长资料，今后完全不用 PDF"},{"j":"該当する章やページを指定して質問し直す、または該当部分を抜き出して渡す","z":"指定相关章节或页码重新提问，或者把相关部分摘出来给它"},{"j":"PDFは信用できないので、別の形式の資料は探さずにClaudeの一般知識で答えさせる","z":"PDF 不可靠，不找其他格式的资料，让 Claude 用一般知识回答"}],"a":[2],"e":"长文档中信息被忽略时，指定位置或提供相关摘录是最直接的办法。用一般知识回答会脱离资料；重复提问碰运气；完全不用 PDF 过度反应。","ej":"見落とし→該当箇所を指定・抜粋して渡す"},{"id":"d7-028","d":7,"t":"7.1","n":2,"q":"Claudeの回答の口調が、社外向けメールとしては砕けすぎていた。改善策として適切なものはどれか。2つ選べ。","qz":"Claude 回答的语气作为对外邮件来说太随便了。以下哪些改善措施合适？请选择 2 项。","o":[{"j":"社内で使っている模範的なビジネスメールを例として示す","z":"给出公司内部使用的范例商务邮件作为示例"},{"j":"砕けた口調の方が親しみやすいので、取引先にもこのまま送る","z":"随便的语气更亲切，所以也这样发给客户"},{"j":"口調は気にせず、内容が正しければそのまま送る","z":"不在意语气，只要内容正确就直接发送"},{"j":"Claudeを使うのをやめ、メールはすべて自分で書く","z":"不用 Claude，所有邮件都自己写"},{"j":"読み手(取引先の部長)と求める丁寧さのレベルをプロンプトに明記する","z":"在提示词中写明读者（客户的部长）和要求的礼貌程度"}],"a":[0,4],"e":"明确读者和礼貌程度、给出范例，是改善语气的有效方法。不管语气直接发送有损商务关系；完全放弃 Claude 过于消极。","ej":"口調の問題→読み手・丁寧さ・模範例"},{"id":"d7-029","d":7,"t":"7.1","n":1,"q":"Claudeが表形式で出力するよう指示したのに、文章で回答することがある。最も適切な対処はどれか。","qz":"明明指示 Claude 用表格输出，它有时仍用文字回答。最合适的处理是哪一个？","o":[{"j":"指示を変えずに、毎回出力をコピーしてExcelで整形する。整形はExcelの方が得意なので役割分担になる","z":"不改指示，每次复制输出到 Excel 中整理。Excel 更擅长整理格式，这算是分工"},{"j":"表という言葉を何度も繰り返して強調する","z":"反复使用“表格”一词来强调"},{"j":"Claudeは表を作れないので、表は自分で作る","z":"Claude 不能做表格，所以表格自己做"},{"j":"表の列名と並び順を具体的に示し、「表以外の説明は不要」と明記する","z":"具体给出表格的列名和顺序，并明确“不需要表格以外的说明”"}],"a":[3],"e":"具体定义表的列和顺序、明确不需要其他说明，可以提高格式遵从性。Claude 可以做表；每次手工整理效率低；单纯重复词语效果有限。","ej":"形式が守られない→列名・順序を具体的に指定"},{"id":"d7-030","d":7,"t":"7.1","n":1,"q":"Claudeによる経費データの集計結果が、元のExcelと一部異なっていた。今後の再発防止策として最も適切なものはどれか。","qz":"Claude 汇总的费用数据与原 Excel 部分不一致。今后的防止再发措施中最合适的是哪一个？","o":[{"j":"集計結果をそのまま報告書に載せる","z":"把汇总结果直接写进报告"},{"j":"より丁寧な言葉で依頼する","z":"用更礼貌的语言提出请求"},{"j":"Claudeに「間違えないで」と書き加える","z":"在提示词中加一句“不要出错”"},{"j":"集計にはコード実行(分析ツール)を使わせ、計算過程を確認できるようにしたうえで、主要な数値を検算する","z":"让它用代码执行（分析工具）进行汇总，以便确认计算过程，并验算主要数字"}],"a":[3],"e":"数值计算让 Claude 用代码执行，并确认过程、人工验算，是可靠的做法。礼貌用语和“不要出错”无法提高计算准确性；直接使用有错误的结果不负责任。","ej":"計算はコード実行＋検算"},{"id":"d7-031","d":7,"t":"7.1","n":1,"q":"Projectのナレッジに同じ規程の旧版と新版が両方入っており、Claudeの回答が混在している。最も適切な対処はどれか。","qz":"Project 知识库中同时有同一规章的旧版和新版，Claude 的回答混杂了两者。最合适的处理是哪一个？","o":[{"j":"旧版を削除して新版だけを残し、ファイル名に版数や施行日を入れる","z":"删除旧版只保留新版，在文件名中写入版本号或施行日期"},{"j":"Projectを使うのをやめ、毎回資料を貼り付ける","z":"不用 Project，每次粘贴资料"},{"j":"さらに別の版も追加して、Claudeに比較させる","z":"再追加其他版本，让 Claude 比较"},{"j":"毎回、質問に「新しい方で答えて」と書き添え、ナレッジはそのまま残しておく","z":"每次提问时加一句“用新的版本回答”，知识库保持不变"}],"a":[0],"e":"根本解决办法是清理旧版、只保留正式最新版，并标注版本。每次口头提醒不可靠；增加版本更混乱；放弃 Project 不必要。","ej":"旧版と新版の混在→旧版を削除し版数を明記"},{"id":"d7-032","d":7,"t":"7.1","n":1,"q":"Claudeが、業務で必要な情報を正当に求めたのに回答を控えた。最も適切な対応はどれか。","qz":"在业务中正当请求必要信息，Claude 却拒绝回答。最合适的应对是哪一个？","o":[{"j":"依頼の業務上の目的と背景を説明し、必要な範囲を明確にして依頼し直す","z":"说明请求的业务目的和背景，明确必要范围后重新请求"},{"j":"Claudeを騙すような言い回しを考えて、制限を回避する","z":"想出欺骗 Claude 的说法来绕过限制"},{"j":"その業務自体をあきらめる","z":"放弃那项业务本身"},{"j":"組織に承認されていない別のAIツールを使う","z":"使用组织未批准的其他 AI 工具"}],"a":[0],"e":"说明正当目的和背景通常能解决误判。欺骗式绕过限制不合适；使用未批准工具违反政策（影子 AI）；完全放弃没必要。如仍无法解决，可向管理员或相关部门咨询。","ej":"正当な依頼が断られた→目的・背景を説明して再依頼"},{"id":"d7-033","d":7,"t":"7.1","n":1,"q":"コネクタで接続したGmailから、特定の取引先とのやり取りを探させたが見つからなかった。考えられる原因と対処として最も適切なものはどれか。","qz":"让 Claude 通过连接器在 Gmail 中查找与特定客户的往来邮件，但没找到。最合适的原因分析和处理是哪一个？","o":[{"j":"検索の手がかり(取引先名、期間、件名のキーワード)を具体的にし、コネクタの接続・権限状態も確認する","z":"具体化搜索线索（客户名、期间、标题关键词），并确认连接器的连接和权限状态"},{"j":"パスワードをClaudeに直接伝えて、アクセスできるようにする","z":"把密码直接告诉 Claude，让它能访问"},{"j":"Gmailコネクタは必ずすべてのメールを見つけられるので、メール自体が存在しないと判断する","z":"Gmail 连接器一定能找到所有邮件，所以判断邮件本身不存在"},{"j":"Claudeにメールを自動送信させて取引先に再送を依頼する。相手からの最新のメールなら確実に見つかる","z":"让 Claude 自动发送邮件请客户重发。对方最新的邮件一定能找到"}],"a":[0],"e":"找不到时要具体化检索条件并确认连接和权限。连接器不保证一定找到；把密码告诉 Claude 违反安全原则；Gmail 连接器用于搜索、阅读和写草稿，发送应由人决定。","ej":"コネクタで見つからない→検索条件の具体化と接続・権限の確認"},{"id":"d7-034","d":7,"t":"7.1","n":2,"q":"Claudeの回答が毎回一般論ばかりで、自社の状況に合っていない。改善策として適切なものはどれか。2つ選べ。","qz":"Claude 的回答每次都是泛泛而谈，不符合本公司情况。以下哪些改善措施合适？请选择 2 项。","o":[{"j":"自社の業種、規模、制約などの背景情報をプロンプトやProjectの指示に加える","z":"在提示词或 Project 指示中加入本公司的行业、规模、限制等背景信息"},{"j":"回答の文字数を増やすよう指示する","z":"指示增加回答字数"},{"j":"関連する社内資料をProjectのナレッジに登録する","z":"把相关内部资料登记到 Project 知识库"},{"j":"毎回違うモデルを試して、偶然合う回答を待つ","z":"每次换不同模型，等待偶然合适的回答"},{"j":"一般論の方が汎用的で正しいので、そのまま使う","z":"泛泛而谈更通用、更正确，直接使用"}],"a":[0,2],"e":"泛泛的回答源于缺少背景，补充公司背景和内部资料是根本对策。增加字数无法增加针对性；直接用泛论不能满足业务；碰运气换模型效率低。","ej":"一般論ばかり→自社の背景・資料を与える"},{"id":"d7-035","d":7,"t":"7.1","n":1,"q":"Claudeが要約の中で、原文にない「今後の見通し」を付け加えていた。最も適切な対処はどれか。","qz":"Claude 在摘要中加了原文中没有的“今后展望”。最合适的处理是哪一个？","o":[{"j":"付け加えられた内容も参考になるので、区別せずそのまま配布する。Claudeの見解は読み手にとって有益な補足になる","z":"增加的内容也有参考价值，不加区分直接分发。Claude 的见解对读者是有益的补充"},{"j":"より長い要約を依頼する","z":"请求写更长的摘要"},{"j":"原文にない内容を加えないよう明記し、要約と自分の意見を分けて書かせる","z":"明确不要加入原文没有的内容，并让它把摘要和自己的意见分开写"},{"j":"要約をやめて原文を配布する","z":"放弃摘要，分发原文"}],"a":[2],"e":"摘要应忠实原文，必要时把意见单独标出。不加区分地分发会让读者误以为是原文内容；放弃摘要和加长都不能解决问题。","ej":"要約に原文外の内容→禁止を明記し意見は分けさせる"},{"id":"d7-036","d":7,"t":"7.1","n":1,"q":"Claudeとの長いチャットで「最初に伝えた条件」が守られなくなった。最も適切な対処はどれか。","qz":"在与 Claude 的长对话中，“最初告诉它的条件”不再被遵守。最合适的处理是哪一个？","o":[{"j":"チャットの文字サイズを大きくする","z":"放大对话的文字大小"},{"j":"同じチャットで、条件を守らなかったことを強く非難することで、ルールの重要性を理解させる","z":"在同一对话中强烈指责它没有遵守条件，让它理解规则的重要性"},{"j":"条件はあきらめて、守られない状態のまま作業を続ける","z":"放弃条件，在不被遵守的状态下继续工作"},{"j":"要点と条件をまとめて新しいチャットを始めるか、恒常的な条件ならProjectの指示に書く","z":"总结要点和条件开新对话；若是长期条件，就写进 Project 指示"}],"a":[3],"e":"长对话会让早期内容被稀释，总结后开新对话或把长期条件写进 Project 指示最有效。指责没有作用；放弃条件会降低质量；文字大小与此无关。","ej":"長い会話で条件が守られない→要約して再開/Projectの指示へ"},{"id":"d7-037","d":7,"t":"7.1","n":1,"q":"Claudeに数値の多い資料を読ませたところ、桁を誤って読み取っていた。今後の対策として最も適切なものはどれか。","qz":"让 Claude 读取数字很多的资料，结果读错了位数。今后的对策中最合适的是哪一个？","o":[{"j":"資料を画像に変換してから渡す","z":"把资料转换成图片后再给它"},{"j":"重要な数値は原資料と照合し、単位(千円・百万円など)を明記した資料を渡す","z":"重要数字要和原资料对照，并提供标明单位（千日元、百万日元等）的资料"},{"j":"数値の誤りはよくあることなので、気にせず使う","z":"数字错误很常见，不在意直接使用"},{"j":"Claudeに「自信がある数値だけ使って」と指示する。確信度の低い数値は自動的に除外されるため","z":"指示 Claude “只用有把握的数字”。因为把握低的数字会被自动排除"}],"a":[1],"e":"数字容易出错，应对照原资料并明确单位。直接使用有风险；Claude 的“自信”不可靠；转成图片反而可能增加读取错误。","ej":"数値の読み誤り→原資料と照合・単位を明記"},{"id":"d7-056","d":7,"t":"7.1","n":1,"q":"Claudeが作成した社内向け案内文に、存在しない問い合わせ窓口の電話番号が記載されていた。最も適切な対処はどれか。","qz":"Claude 写的内部通知中，写了一个不存在的咨询窗口电话号码。最合适的处理是哪一个？","o":[{"j":"Claudeに「本当に正しいですか?」と確認し、「はい」と答えたら配布する。二重確認として十分である","z":"问 Claude “真的正确吗？”，回答“是”就分发。这样双重确认就足够了"},{"j":"番号の誤りは小さな問題なので、そのまま配布して問い合わせが来てから訂正する","z":"号码错误是小问题，先直接分发，有人询问后再更正"},{"j":"電話番号などの固有情報はプロンプトで正式な値を渡し、出力後に公式情報と照合する","z":"电话号码等特定信息在提示词中提供正式值，输出后与官方信息对照"},{"j":"電話番号の記載をやめ、窓口の案内そのものを削除してしまう","z":"不写电话号码，连窗口说明本身也删掉"}],"a":[2],"e":"电话号码等具体信息容易被编造，应提供正式值并与官方信息核对。先分发再更正会造成混乱；Claude 的自我确认不可靠；删掉窗口说明会损害通知的用途。","ej":"固有情報は正式な値を渡し、公式情報と照合"},{"id":"d7-057","d":7,"t":"7.1","n":1,"q":"Claudeに英語の契約書の要点を日本語でまとめさせたところ、重要な例外条項が抜けていた。プロンプトの改善として最も適切なものはどれか。","qz":"让 Claude 用日语总结英文合同要点，结果漏掉了重要的例外条款。最合适的提示词改进是哪一个？","o":[{"j":"例外条項は重要でないことが多いので、そのまま使う","z":"例外条款大多不重要，直接使用"},{"j":"「もっと短くまとめて」と指示し、要点を絞り込ませる","z":"指示“总结得更短”，让它精简要点"},{"j":"「義務、期限、例外・免責条項、解約条件を必ず項目として立て、該当箇所の原文も併記して」と指定する","z":"指定“必须单独列出义务、期限、例外/免责条款、解约条件，并附上相关原文”"},{"j":"英語のまま要約させ、日本語訳は人が後でまとめて行うことにする。言語を変えれば抜けは自然に解消される","z":"让它用英文总结，日语翻译之后由人统一做。换一种语言，遗漏自然会消除"}],"a":[2],"e":"指定必须包含的项目并附原文，可以防止遗漏且便于核对。缩短只会更容易遗漏；改语言与遗漏无关；忽视例外条款在合同中风险很大，最终还应由法务确认。","ej":"抜けやすい項目を必須として指定し原文を併記"},{"id":"d7-009","d":7,"t":"7.2","n":1,"q":"Claudeで作成した営業メールのテンプレートについて、実際に送信したところ返信率が低かった。次に取るべき行動として最も適切なものはどれか。","qz":"用 Claude 制作的销售邮件模板实际发送后，回复率很低。下一步最合适的行动是哪一个？","o":[{"j":"返信率が低いのはClaudeが営業文書に向いていないためと判断し、Claudeの利用を全面的にやめる","z":"判断回复率低是因为 Claude 不适合销售文书，全面停止使用 Claude"},{"j":"同じテンプレートを送信数を増やして使い続ける","z":"继续使用同一模板并增加发送量"},{"j":"返信があったメールとなかったメールの違いや顧客の反応をClaudeに共有し、仮説を立てて改善案を作り、比較検証する","z":"把有回复和没回复邮件的差异、客户反应分享给 Claude，提出假设、制作改进方案并对比验证"},{"j":"件名や書き出しの表現を毎回ランダムに変えて送信し、返信率が上がるまで続ける","z":"每次随机更改标题和开头表达后发送，一直持续到回复率上升"}],"a":[2],"e":"根据实际结果反馈来调整：分析差异→形成假设→改进→对比验证，是持续优化的循环。放弃使用、盲目加量、随机修改都缺乏依据。","ej":"結果(フィードバック)を共有→仮説→改善→比較検証のサイクル。"},{"id":"d7-010","d":7,"t":"7.2","n":1,"q":"チームで使っているProjectについて、メンバーから「回答が専門的すぎる」という声が複数上がった。最も適切な対応はどれか。","qz":"关于团队使用的 Project，多名成员反馈“回答太专业了”。最合适的应对是哪一个？","o":[{"j":"各メンバーが質問のたびに「やさしく説明して」と書けば解決するので、Project側では何も変更しない。メンバーの裁量に任せるのが最も柔軟である","z":"每个成员每次提问时写“请通俗解释”就能解决，所以 Project 方面不做任何修改。交给成员自行处理最灵活"},{"j":"フィードバックの具体例を集め、プロジェクト指示に想定読者と表現レベルを追記し、変更後の反応を確認する","z":"收集反馈的具体例子，在项目指示中补充预想读者和表达水平，并确认修改后的反应"},{"j":"Projectを廃止して各自のチャットで使う","z":"废除 Project，各自在个人对话中使用"},{"j":"最も専門的なメンバーに合わせるため、変更しない","z":"为了配合最专业的成员，不做修改"}],"a":[1],"e":"多人反馈说明是共性问题，应在共享配置（项目指示）中统一修正，并在修改后确认效果。让每个人自己补充既低效又不一致；废除 Project 失去共享价值；不改则无视用户需求。","ej":"共通のフィードバックは共有設定(プロジェクト指示)を更新し、効果を確認。"},{"id":"d7-011","d":7,"t":"7.2","n":2,"q":"Claudeの出力に対するフィードバックをもとにアプローチを調整する際の行動として、適切なものはどれか。2つ選べ。","qz":"根据对 Claude 输出的反馈调整方法时，以下哪些行动是恰当的？请选择 2 项。","o":[{"j":"フィードバックの内容を確認せず、とりあえずプロンプトを長くする","z":"不确认反馈内容，先把提示词加长再说"},{"j":"フィードバックがあるたびに全く別のツールに乗り換える","z":"每次有反馈就换一个完全不同的工具"},{"j":"一度に一つの要素を変え、変更前後の結果を比較する","z":"一次只改变一个要素，比较修改前后的结果"},{"j":"否定的なフィードバックはすべて無視する","z":"无视所有负面反馈"},{"j":"うまくいった変更は記録し、テンプレートや指示に反映する","z":"把有效的修改记录下来，并反映到模板或指示中"}],"a":[2,4],"e":"一次只改一个变量才能判断哪项改动有效；把有效改动沉淀到模板或指示中，让改进可持续。盲目加长、无视负面反馈、频繁换工具都不是有依据的调整。","ej":"一度に1要素を変えて比較。成功した変更は記録して指示・テンプレートへ反映。"},{"id":"d7-012","d":7,"t":"7.2","n":1,"q":"Claudeが作成した翻訳文について、現地スタッフから「直訳的で不自然」と指摘を受けた。最も適切な調整はどれか。","qz":"当地员工指出 Claude 写的译文“直译、不自然”。最合适的调整是哪一个？","o":[{"j":"読み手と用途(例:現地顧客向けの販促文)を伝え、自然さを優先した意訳を許可し、現地スタッフの確認を継続する","z":"告知读者和用途（如面向当地客户的促销文），允许以自然为优先的意译，并继续请当地员工确认"},{"j":"直訳の方が正確なので、そのまま使い続ける","z":"直译更准确，所以继续使用"},{"j":"翻訳はAIに向かないため、すべて外注する","z":"翻译不适合 AI，全部外包"},{"j":"原文を短く削ってから翻訳させれば自然になるので、原文の情報量を半分程度に減らすことで、誤訳のリスクも減らせる","z":"先把原文删短再翻译就会自然，所以把原文的信息量减到一半左右，这样也能降低误译风险"}],"a":[0],"e":"翻译风格取决于用途与读者。明确用途并允许意译，同时保留母语者审核，是基于反馈的合理调整。坚持直译忽视了反馈；全部外包过度；缩短原文会丢失信息且未必改善自然度。","ej":"翻訳は用途と読み手を伝え、意訳の許可＋ネイティブ確認。"},{"id":"d7-013","d":7,"t":"7.2","n":1,"q":"Claudeによる要約を上司に提出したところ、「結論が最後にあって読みにくい」と言われた。最も効率的な対応はどれか。","qz":"把 Claude 写的总结交给上司后，上司说“结论在最后，不好读”。最高效的应对是哪一个？","o":[{"j":"要約をやめて元の資料をそのまま渡す","z":"不再总结，直接交原始资料"},{"j":"上司が読み慣れるまで同じ形式を続け、慣れてもらうよう要約の読み方を説明した資料を添える。形式を頻繁に変えると混乱を招くため","z":"继续使用同样格式直到上司习惯，并附上说明如何阅读总结的资料以便习惯。因为频繁改变格式会造成混乱"},{"j":"毎回手作業で結論を先頭に移動させる","z":"每次手动把结论移到开头"},{"j":"「結論を冒頭に1〜2文で示し、その後に根拠を記載する」構成を指示し、今後もその形式を使えるよう指示やテンプレートに反映する","z":"指示采用“开头用 1～2 句给出结论，然后写依据”的结构，并写入指示或模板以便今后沿用"}],"a":[3],"e":"把反馈转化为明确的结构要求，并沉淀到指示/模板中，一次修改长期受益。交原始资料、坚持原格式、每次手工调整都不高效。","ej":"フィードバックは構成指示に落とし込み、指示・テンプレートに反映して再利用。"},{"id":"d7-021","d":7,"t":"7.2","n":1,"q":"Claudeが作成したレポート案に対して、Claude自身に改善点を挙げさせる「自己レビュー」を行った。この手法の位置づけとして最も適切なものはどれか。","qz":"针对 Claude 写的报告草案，让 Claude 自己列出改进点，进行“自我审查”。对这种方法的定位最恰当的是哪一个？","o":[{"j":"自己レビューで問題がなければ、事実確認は不要になる","z":"如果自我审查没有问题，就不需要事实核查"},{"j":"自己レビューは意味がないので行うべきではない。AIがAIを評価しても客観性がないため","z":"自我审查没有意义，不应进行。因为 AI 评价 AI 缺乏客观性"},{"j":"自己レビューは構成や抜け漏れの改善に役立つが、事実の正確性は一次情報や人によるレビューで確認する","z":"自我审查有助于改进结构和遗漏，但事实准确性需要用一手资料和人工审核来确认"},{"j":"自己レビューを10回程度繰り返せば、内容の正確性は十分に保証されるので、外部の確認は省略できる","z":"自我审查重复 10 次左右就能充分保证内容准确性，可以省略外部确认"}],"a":[2],"e":"让 Claude 自我审查可以发现结构、清晰度、遗漏等问题，是有效的改进手段；但它不能替代对事实的外部验证，模型的自我判断并不可靠。认为无意义或重复多次即可保证都是误解。","ej":"自己レビューは改善に有効だが、事実確認の代わりにはならない。"},{"id":"d7-038","d":7,"t":"7.2","n":1,"q":"Claudeで作成したFAQを公開したところ、利用者から「回答が長くて探しにくい」という声が寄せられた。最も適切な対応はどれか。","qz":"用 Claude 制作的 FAQ 公开后，用户反映“回答太长，不好找”。最合适的应对是哪一个？","o":[{"j":"FAQの公開を停止する","z":"停止公开 FAQ"},{"j":"利用者の慣れの問題なので、変更しない","z":"这是用户习惯问题，不做修改"},{"j":"回答をさらに詳しくして、情報量を増やす","z":"把回答写得更详细，增加信息量"},{"j":"フィードバックを踏まえて「結論を1文目に、詳細は3行以内」などの形式を指示に加え、作り直す","z":"根据反馈，在指示中加入“第一句写结论，详细说明 3 行以内”等格式要求后重做"}],"a":[3],"e":"把用户反馈转化为具体的格式要求并反映到指示中，才能系统性地改进。忽视反馈、停止公开、继续加长都不能解决问题。","ej":"利用者の声→具体的な形式要件として指示に反映"},{"id":"d7-039","d":7,"t":"7.2","n":1,"q":"Claudeを使った提案書作成で、上司のレビューで毎回同じ指摘(根拠となるデータが不足)を受ける。最も効果的な改善はどれか。","qz":"用 Claude 写提案书时，每次上司审阅都提出同样的意见（缺少依据数据）。最有效的改进是哪一个？","o":[{"j":"提案書の文字数を減らし、指摘される箇所を少なくする","z":"减少提案书字数，减少被指出的地方"},{"j":"指摘を受けるたびに手作業で修正する","z":"每次被指出后手工修改"},{"j":"上司にClaudeの出力の限界を説明して、指摘しないように頼み、提案書の形式はそのまま維持する","z":"向上司说明 Claude 输出的局限，请他不要再提这个意见，提案书格式保持不变"},{"j":"「主張ごとに根拠となるデータと出典を示す」ことをProjectの指示やテンプレートに組み込む","z":"把“每个主张都要给出依据数据和出处”写进 Project 指示或模板"}],"a":[3],"e":"反复出现的问题要在指示或模板层面修正，而不是每次手工修改。请上司别再提意见是回避问题；减少字数也不能补充依据。","ej":"繰り返す指摘→指示・テンプレートに組み込む"},{"id":"d7-040","d":7,"t":"7.2","n":2,"q":"チームで使っているProjectの改善のため、メンバーからフィードバックを集める。進め方として適切なものはどれか。2つ選べ。","qz":"为改进团队使用的 Project，收集成员反馈。以下哪些做法合适？请选择 2 项。","o":[{"j":"改善後に、同じ質問で回答が良くなったかを確認する","z":"改进后，用相同的问题确认回答是否变好"},{"j":"問題があった具体的な質問と回答の例を集める","z":"收集出问题的具体问题和回答的例子"},{"j":"苦情が出たら、Projectをすぐに削除して作り直す","z":"一有投诉就马上删除 Project 重建"},{"j":"フィードバックは主観なので、集めても使わない","z":"反馈是主观的，收集了也不用"},{"j":"一人の意見だけを全面的に採用し、他の意見は聞かない","z":"只全面采纳一个人的意见，不听其他意见"}],"a":[0,1],"e":"收集具体案例、改进后用同样问题验证效果，是有效的反馈循环。不使用反馈、一有投诉就重建、只听一人意见都不合理。","ej":"具体例を集め、改善後に同じ質問で確認"},{"id":"d7-041","d":7,"t":"7.2","n":1,"q":"Claudeで作成した顧客向け回答案について、サポート担当者が毎回大幅に書き直している。最初に行うべきこととして最も適切なものはどれか。","qz":"对 Claude 生成的客户回复草稿，客服人员每次都大幅改写。最先应做的是哪一个？","o":[{"j":"担当者がどこをどう直しているかを分析し、その傾向をプロンプトや指示に反映する","z":"分析负责人改了哪里、怎么改的，把这些倾向反映到提示词或指示中"},{"j":"担当者に書き直しをやめるよう指示する。修正の手間をなくすことが最優先だから","z":"指示负责人不要再改写。因为最优先的是消除修改的工作量"},{"j":"回答案の文字数を倍にする","z":"把回复草稿字数加倍"},{"j":"Claudeの利用を中止する","z":"停止使用 Claude"}],"a":[0],"e":"人工修改的内容就是最好的反馈，分析修改倾向并反映到指示中，才能减少返工。禁止修改会降低质量；停止使用过于消极；加倍字数无关。","ej":"人の修正内容を分析→指示に反映"},{"id":"d7-042","d":7,"t":"7.2","n":1,"q":"Claudeの出力品質について、チーム内で「良い」「悪い」の評価が人によって分かれる。最も適切な対応はどれか。","qz":"团队内对 Claude 输出质量的评价“好”“坏”因人而异。最合适的应对是哪一个？","o":[{"j":"評価をやめて、出力をそのまま使う","z":"放弃评价，直接使用输出"},{"j":"評価の基準(正確性・網羅性・読みやすさ・形式など)をチームで合意し、その基準で評価する","z":"团队商定评价标准（准确性、全面性、易读性、格式等），按该标准评价"},{"j":"Claudeに自己評価させ、その結果で決める。AIによる評価の方が人の好みに左右されない","z":"让 Claude 自我评价，以结果决定。AI 的评价不会受人的喜好左右"},{"j":"声の大きいメンバーの意見で決める","z":"按声音最大的成员的意见决定"}],"a":[1],"e":"先统一评价标准，评价才能客观、可比较。按声音大小决定、放弃评价、依赖 Claude 自评都不可靠。","ej":"評価基準をチームで合意する"},{"id":"d7-043","d":7,"t":"7.2","n":1,"q":"Claudeに作らせた社内研修資料について、受講者アンケートで「事例が少ない」との結果が出た。次の改訂で最も適切な対応はどれか。","qz":"Claude 做的内部培训资料，学员问卷显示“案例太少”。下次修订中最合适的应对是哪一个？","o":[{"j":"Claudeに架空の事例を自由に作らせ、実話として紹介する。具体的な物語の方が受講者の記憶に残りやすい","z":"让 Claude 自由编造虚构案例，并当作真实故事介绍。具体的故事更容易被学员记住"},{"j":"社内の実際の事例(機密情報は除く)を提供し、各章に1つ以上の事例を入れるよう指示する","z":"提供公司内部的实际案例（去除机密信息），指示每章至少加入一个案例"},{"j":"事例の章をすべて削除する","z":"删除所有案例章节"},{"j":"アンケート結果は無視して、同じ資料を使い続ける","z":"无视问卷结果，继续使用同样的资料"}],"a":[1],"e":"提供真实案例（去除机密）并明确要求，是根据反馈改进的正确做法。把虚构案例当作真实故事介绍是不诚实的；无视反馈和删除案例都不合理。","ej":"フィードバック→実例(機密除く)を提供し指示に反映"},{"id":"d7-044","d":7,"t":"7.2","n":1,"q":"Claudeで作成した記事の効果測定をしたところ、閲覧数は多いが問い合わせにつながっていない。次の調整として最も適切なものはどれか。","qz":"对用 Claude 写的文章进行效果评估，浏览量很高但没有带来咨询。下一步最合适的调整是哪一个？","o":[{"j":"記事の数を倍に増やす","z":"把文章数量增加一倍"},{"j":"Claudeの利用をやめる","z":"停止使用 Claude"},{"j":"記事の目的(問い合わせ獲得)を明示し、読者の課題と次の行動を促す構成にするようプロンプトを見直す","z":"明确文章目的（获得咨询），修改提示词，让结构围绕读者的课题并促使其采取下一步行动"},{"j":"閲覧数が多いので成功とみなし、何も変えない","z":"浏览量高就视为成功，什么都不改"}],"a":[2],"e":"根据结果调整：明确目的并修改结构。只看浏览量忽视了目标；增加数量不解决转化问题；停用 Claude 过于消极。","ej":"結果を踏まえ目的を明示して構成を調整"},{"id":"d7-045","d":7,"t":"7.2","n":1,"q":"Claudeの出力の改善を繰り返しても、求める品質に届かない。業務上はシステム連携による自動処理が必要と分かった。最も適切な対応はどれか。","qz":"反复改进 Claude 的输出仍达不到要求的质量，并且发现业务上需要通过系统集成实现自动处理。最合适的应对是哪一个？","o":[{"j":"品質が届かないまま運用を続ける","z":"在质量不达标的情况下继续运行"},{"j":"プロンプトをさらに長くし続ける","z":"继续把提示词写得更长"},{"j":"要件を整理して、Claude Developer や Architect などの技術担当者にエスカレーションする","z":"整理需求，升级给 Claude Developer 或 Architect 等技术负责人"},{"j":"独学でAPI連携のシステムを本番環境に構築する","z":"自学构建 API 集成系统并直接上线到生产环境"}],"a":[2],"e":"超出 Associate 范围（系统集成、API）时应整理需求并升级给技术专家。擅自构建生产系统风险大；带着质量问题运行不负责任；无限加长提示词不能解决结构性问题。","ej":"技術的な統合が必要→要件を整理してエスカレーション"},{"id":"d7-058","d":7,"t":"7.2","n":1,"q":"Claudeで作成した社内アンケートの設問について、回答者から「質問の意図がわかりにくい」との声があった。改訂のアプローチとして最も適切なものはどれか。","qz":"用 Claude 制作的内部问卷题目，回答者反映“看不懂问题的意图”。最合适的修订方法是哪一个？","o":[{"j":"設問数を増やして、どれかで意図が伝わるようにする","z":"增加题目数量，总有一题能传达意图"},{"j":"わかりにくかった設問と理由を整理してClaudeに伝え、1問1論点・具体的な言葉で書き直させ、少人数で試してから再配布する","z":"整理难懂的题目及原因告诉 Claude，让它按“一题一个论点、用具体语言”重写，先小范围试用后再分发"},{"j":"回答者の読解力の問題なので、設問は変えない","z":"这是回答者理解能力的问题，不改题目"},{"j":"アンケートの実施をやめ、別の方法で意見を集めることも検討しない","z":"停止问卷，也不考虑用其他方法收集意见"}],"a":[1],"e":"把反馈具体化、提出改写原则，并小范围试用验证，是基于反馈的正确调整。归咎于回答者、增加题量、直接放弃都不能解决问题。","ej":"フィードバックを具体化→書き直し→少人数で試す"},{"id":"d7-059","d":7,"t":"7.2","n":1,"q":"Claudeによる要約を毎週チームに配布している。メンバーから「重要度の低い情報まで含まれている」との意見が出た。最も適切な調整はどれか。","qz":"每周向团队分发 Claude 做的摘要。成员反映“连不重要的信息也包含进去了”。最合适的调整是哪一个？","o":[{"j":"要約の配布を月1回にする","z":"把摘要改为每月分发一次"},{"j":"すべての情報を残す方が安全なので、変更しない","z":"保留全部信息更安全，不做修改"},{"j":"チームにとって重要な情報の基準(期限のある事項、意思決定が必要な事項など)を定義し、プロンプトに加える","z":"定义对团队重要的信息标准（有期限的事项、需要决策的事项等），加入提示词"},{"j":"要約の長さを半分にするよう指示するだけで、選び方の基準は特に変えない","z":"只指示把摘要长度减半，不改变挑选标准"}],"a":[2],"e":"明确“什么是重要信息”的标准，才能让摘要有针对性。只减半长度可能删掉重要信息；不改变无视反馈；降低频率与内容取舍无关。","ej":"重要度の基準を定義して指示に加える"},{"id":"d7-014","d":7,"t":"7.3","n":1,"q":"毎週、複数の部署から届く報告メールを読み、要点を1枚にまとめる作業に時間がかかっている。Claudeを使った効率化として最も適切なものはどれか。","qz":"每周阅读多个部门发来的报告邮件并汇总成一页要点，非常耗时。用 Claude 提高效率的最合适方法是哪一个？","o":[{"j":"毎回異なるプロンプトで、その週の内容に合わせてその場で思いついた形式で自由にまとめさせる","z":"每次用不同的提示词，按当周内容临时想到的格式自由汇总"},{"j":"報告メールを読まずに、Claudeに部署の状況を推測させる","z":"不读报告邮件，让 Claude 推测各部门情况"},{"j":"出力形式を固定したプロンプトをProjectに設定し、必要に応じてコネクタでメールを参照させ、最終確認は人が行う","z":"在 Project 中设置固定输出格式的提示词，必要时通过连接器读取邮件，最终由人确认"},{"j":"まとめ作業は効率化が難しいため、各部署の報告メールをそのまま全員に転送し、まとめ作業自体を廃止する","z":"汇总难以提效，所以把各部门的报告邮件直接转发给所有人，取消汇总工作本身"}],"a":[2],"e":"对重复性工作，应固定格式和提示词（Project），利用连接器减少复制粘贴，并保留人工最终确认。临时格式不一致；让 Claude 推测会产生虚假信息；直接取消可能影响业务。","ej":"定型業務はProject＋固定形式、コネクタで手作業削減、最終確認は人。"},{"id":"d7-015","d":7,"t":"7.3","n":1,"q":"大量の問い合わせメールを「請求」「技術」「その他」に分類する作業をClaudeで行いたい。品質を保ちつつコストと時間を抑える考え方として最も適切なものはどれか。","qz":"想用 Claude 把大量咨询邮件分类为“账单”“技术”“其他”。在保证质量的同时控制成本和时间，最合适的思路是哪一个？","o":[{"j":"分類基準と例を明確にしたうえで、単純で大量のタスクに向く高速・低コストのモデルを使い、サンプルで精度を確認する","z":"在明确分类标准和示例的基础上，使用适合大量简单任务的高速、低成本模型，并抽样确认准确率"},{"j":"精度を最大化するため常に最高性能のモデルを使い、さらに全件を人が再確認することで、誤分類を確実にゼロにする","z":"为了最大化准确率，总是使用最高性能模型，并且全部由人重新确认，以此确保误分类为零"},{"j":"分類基準は示さずにClaudeに任せる","z":"不给分类标准，全权交给 Claude"},{"j":"1通ずつ別々のチャットを開き、その都度思いついた指示で分類させ、結果を手作業で集計する","z":"每封邮件各开一个对话，每次用临时想到的指示分类，再手工汇总结果"}],"a":[0],"e":"简单大量的分类任务适合 Haiku 这类高速低成本模型，配合明确标准与示例，再抽样检验准确率，是质量、成本、速度的平衡。总用最高性能模型又全部人工复核成本过高；不给标准结果不稳定；每次指示不同会不一致。","ej":"単純・大量タスク＝高速低コストモデル＋明確な基準と例＋サンプル確認。"},{"id":"d7-016","d":7,"t":"7.3","n":2,"q":"Claudeを組み込んだ業務フローを最適化する際の考え方として適切なものはどれか。2つ選べ。","qz":"在优化引入了 Claude 的业务流程时，以下哪些思路是恰当的？请选择 2 项。","o":[{"j":"どの工程で時間がかかっているか、どこで手戻りが発生しているかを把握してから改善対象を決める","z":"先掌握哪些工序耗时、哪里出现返工，再决定改进对象"},{"j":"すべての工程をClaudeに置き換えることを目標にする","z":"以用 Claude 取代所有工序为目标"},{"j":"改善の効果は測らず、利用者の印象だけで判断する","z":"不测量改进效果，只凭使用者印象判断"},{"j":"効果を測るため、作業時間や修正回数などの指標を導入前後で比較する","z":"为了衡量效果，在导入前后比较作业时间、修改次数等指标"},{"j":"人による確認工程は時間がかかるので、すべて削除する","z":"人工确认工序费时，全部删除"}],"a":[0,3],"e":"优化应从识别瓶颈和返工点开始，并用指标量化前后效果。以全部替代为目标不现实也有风险；只凭印象无法判断；删除所有人工确认会放大错误风险。","ej":"ボトルネックを特定し、指標で導入前後を比較する。人の確認は残す。"},{"id":"d7-017","d":7,"t":"7.3","n":1,"q":"毎回同じ手順(データの整形→グラフ作成→所定書式のレポート出力)をClaudeに説明している。手順と書式を再利用可能な形でまとめ、関連する依頼で自動的に使われるようにしたい。最も適した機能はどれか。","qz":"每次都要向 Claude 说明同样的步骤（整理数据→制作图表→按规定格式输出报告）。希望把步骤和格式整理成可复用的形式，并在相关请求时自动使用。最适合的功能是哪一个？","o":[{"j":"シークレットチャット","z":"无痕对话"},{"j":"Styles(応答スタイル)を使い、手順と書式を文章の雰囲気として登録しておく","z":"使用 Styles（回答风格），把步骤和格式作为文章风格登记"},{"j":"Web検索","z":"网络搜索"},{"j":"Skills(手順・テンプレート・スクリプトをまとめたもの)","z":"Skills（汇总了步骤、模板和脚本的功能）"}],"a":[3],"e":"Skills 把流程说明、模板、脚本打包在一起，在相关任务时由 Claude 自动加载，适合标准化的重复流程。无痕对话不保留记录；Styles 只调整回答语气风格；网络搜索用于获取信息。","ej":"定型手順・テンプレートの再利用＝Skills。"},{"id":"d7-018","d":7,"t":"7.3","n":1,"q":"簡単な誤字チェックや短い言い換えにも、常に拡張思考(Extended thinking)を有効にした最上位モデルを使っている。最適化の観点から最も適切な見直しはどれか。","qz":"即使是简单的错字检查或简短改写，也一直使用开启扩展思考的最高端模型。从优化角度看，最合适的调整是哪一个？","o":[{"j":"品質が最優先なので現状を維持する","z":"质量最优先，维持现状"},{"j":"単純なタスクには軽量・高速なモデルを使い、拡張思考は複雑な推論が必要なときだけ使う","z":"简单任务使用轻量高速的模型，只有需要复杂推理时才用扩展思考"},{"j":"すべてのタスクでClaudeの利用をやめる","z":"所有任务都停止使用 Claude"},{"j":"拡張思考は常に有効にしたまま、プロンプトをできるだけ短くして処理量を減らす。品質を落とさずに利用量だけを抑えられる","z":"保持一直开启扩展思考，把提示词尽量缩短以减少处理量。可以在不降低质量的情况下只减少用量"}],"a":[1],"e":"应按任务难度匹配模型和功能：简单任务用轻量快速模型；扩展思考会增加时间和用量，只在复杂推理时使用。维持现状浪费成本和时间；停止使用过度；只缩短提示词没有解决不匹配问题。","ej":"タスクの難易度に合わせてモデルと拡張思考を使い分ける。"},{"id":"d7-022","d":7,"t":"7.3","n":1,"q":"毎回、同じ長い参考資料を新しいチャットに添付し直している。作業を効率化する方法として最も適切なものはどれか。","qz":"每次都要把同样的长篇参考资料重新附加到新对话中。最合适的效率化方法是哪一个？","o":[{"j":"資料を添付せず、Claudeに内容を思い出させる","z":"不附资料，让 Claude 回想内容"},{"j":"資料を手作業で要約し、毎回その要約を新しいチャットに貼り付けて使う","z":"手工总结资料，每次把总结粘贴到新对话中使用"},{"j":"新しいチャットを作ると資料が失われるので、1つのチャットにすべての作業を集約し続ける","z":"新建对话会丢失资料，所以一直把所有工作集中在一个对话里"},{"j":"資料をProjectのナレッジに登録し、そのProject内で新しいチャットを始める","z":"把资料登记到 Project 知识中，在该 Project 内开始新对话"}],"a":[3],"e":"反复使用的资料放入 Project 知识，Project 内所有对话都能参考，无需重复上传。Claude 不会在新对话中“记得”未提供的文件内容；手工总结会丢信息；一个对话用到底会撑满上下文。","ej":"繰り返し使う資料はProjectナレッジに。"},{"id":"d7-023","d":7,"t":"7.3","n":1,"q":"Claudeで作成した議事録をチーム全体に展開したところ、メンバーごとにプロンプトがばらばらで品質に差が出ている。最も効果的な改善はどれか。","qz":"把用 Claude 制作会议纪要的方法推广到整个团队后，每个成员的提示词各不相同，质量参差不齐。最有效的改进是哪一个？","o":[{"j":"各自のやり方を尊重し、何もしない","z":"尊重各自做法，什么都不做"},{"j":"検証済みのプロンプトと出力形式を共有Projectにまとめ、使い方と確認手順をチームで標準化する","z":"把验证过的提示词和输出格式整理到共享 Project 中，在团队内统一使用方法和确认流程"},{"j":"品質の低いメンバーを特定し、そのメンバーだけClaudeの利用を禁止して、残りのメンバーで運用する","z":"找出质量低的成员，只禁止其使用 Claude，由其余成员运营"},{"j":"品質の差はプロンプトの問題ではないので、議事録作成をClaudeに任せること自体をやめる","z":"质量差异不是提示词的问题，所以干脆不再让 Claude 制作会议纪要"}],"a":[1],"e":"团队层面的质量差异，最有效的是标准化：共享经过验证的提示词、格式和确认流程（例如共享 Project）。放任不管、禁止个人使用、放弃使用都不能提升整体质量。","ej":"チーム展開は検証済みプロンプト・形式・確認手順を共有して標準化。"},{"id":"d7-025","d":7,"t":"7.3","n":2,"q":"Claudeの利用状況を見直したところ、利用上限に早く達してしまうことが多い。利用を効率化する方法として適切なものはどれか。2つ選べ。","qz":"检查 Claude 的使用情况后发现，经常很快就达到使用上限。以下哪些是提高使用效率的恰当方法？请选择 2 项。","o":[{"j":"関連する複数の質問は1つのメッセージにまとめて依頼する","z":"把相关的多个问题合并在一条消息中请求"},{"j":"単純な質問にも常に最上位モデルと拡張思考を使う","z":"即使是简单问题也总是使用最高端模型和扩展思考"},{"j":"同じ大きなファイルを、質問のたびに何度も添付し直す","z":"每次提问都重新附加同一个大文件"},{"j":"長くなった会話は要約して新しいチャットで続け、不要な履歴を引き継がない","z":"对话变长后先总结，再在新对话中继续，不带入不必要的历史"},{"j":"回答が出るたびに再生成を繰り返し、最も良いものを選ぶ","z":"每次出结果后反复重新生成，选最好的"}],"a":[0,3],"e":"长对话每轮都要处理全部历史，消耗更多用量；总结后开新对话、把相关问题合并提问都能节省用量。重复附加大文件、简单任务也用最高端模型加扩展思考、反复重生成都会更快耗尽额度。","ej":"利用量の節約:長い会話は要約して新規チャット、質問はまとめて送る。"},{"id":"d7-046","d":7,"t":"7.3","n":1,"q":"毎日、同じ形式の問い合わせ100件に一次回答案を作っている。品質を保ちながら効率化する方法として最も適切なものはどれか。","qz":"每天要为 100 件格式相同的咨询制作初步回复草稿。在保证质量的同时提高效率，最合适的方法是哪一个？","o":[{"j":"すべての問い合わせに最上位モデルと拡張思考を使う","z":"所有咨询都使用最高级模型和扩展思考"},{"j":"回答方針と形式をProjectの指示にまとめ、少数で品質を確認したうえで、処理速度の速いモデルの利用も検討する","z":"把回答方针和格式整理到 Project 指示中，用少量确认质量后，也考虑使用速度更快的模型"},{"j":"回答案は確認せずにそのまま送信する","z":"不确认回复草稿直接发送"},{"j":"1件ずつ新しいチャットで、毎回説明を一から書く","z":"每件都开新对话，每次从头写说明"}],"a":[1],"e":"把方针模板化、先小规模确认、简单大量任务考虑快速模型，是兼顾质量和效率的方法。全部用最高级模型浪费；每次从头写低效；不确认直接发送有风险。","ej":"定型大量処理→指示を固定・少数で確認・速いモデルを検討"},{"id":"d7-047","d":7,"t":"7.3","n":2,"q":"Claudeを使った月次レポート作成フローを効率化したい。適切な施策はどれか。2つ選べ。","qz":"想提高用 Claude 制作月报流程的效率。以下哪些措施合适？请选择 2 项。","o":[{"j":"簡単な表記修正にも毎回Researchを使う","z":"简单的表述修改也每次都用 Research"},{"j":"毎月違うメンバーが自由なプロンプトで作る","z":"每月由不同成员用自由的提示词制作"},{"j":"データの取得にコネクタを使い、手作業のコピー&ペーストを減らす","z":"用连接器获取数据，减少手工复制粘贴"},{"j":"レポートの確認工程を削除する","z":"删除报告的确认环节"},{"j":"毎回使う手順と書式をSkillやテンプレートとしてまとめる","z":"把每次使用的步骤和格式整理成 Skill 或模板"}],"a":[2,4],"e":"把重复步骤做成 Skill/模板、用连接器减少手工操作，是有效的效率化。删除确认环节有风险；自由提示词会造成质量不稳；简单修改用 Research 是过度使用。","ej":"手順はSkill・テンプレート化/データ取得はコネクタ"},{"id":"d7-048","d":7,"t":"7.3","n":1,"q":"簡単な事実確認(社内の会議室の予約ルールの確認)のたびに、Research機能を使って数分待っている。最適化として最も適切なものはどれか。","qz":"每次做简单的事实确认（确认公司会议室的预约规则），都使用 Research 功能并等待几分钟。最合适的优化是哪一个？","o":[{"j":"社内ルールをProjectのナレッジに登録し、通常のチャットで質問する","z":"把公司规则登记到 Project 知识库，在普通对话中提问"},{"j":"毎回、最上位モデルと拡張思考を組み合わせて使う","z":"每次组合使用最高级模型和扩展思考"},{"j":"会議室の予約をやめる","z":"不再预约会议室"},{"j":"Researchの方が詳しいので、今後も使い続ける。調べる範囲が広いほど回答の信頼性も上がる","z":"Research 更详细，今后继续使用。查得越广，回答的可信度越高"}],"a":[0],"e":"内部规则放进 Project 知识库，用普通对话即可快速回答。Research 适合多来源深入调研，用于简单确认是过度的；最高级模型+扩展思考也是浪费。","ej":"簡単な確認にResearchは過剰→ナレッジ＋通常チャット"},{"id":"d7-049","d":7,"t":"7.3","n":1,"q":"複数の営業担当者が同じ種類の提案書をClaudeで作っているが、品質と作業時間に大きな差がある。最も効果的な改善はどれか。","qz":"多名营业人员用 Claude 制作同类提案书，但质量和工作时间差异很大。最有效的改进是哪一个？","o":[{"j":"良い成果を出している担当者のプロンプトと手順を標準化し、共有Projectとテンプレートとして展開する","z":"把成果好的负责人的提示词和步骤标准化，作为共享 Project 和模板推广"},{"j":"各自のやり方を尊重し、何も統一しない","z":"尊重各自的做法，什么都不统一"},{"j":"作業時間の長い担当者のClaude利用を禁止する","z":"禁止工作时间长的负责人使用 Claude"},{"j":"提案書の作成をすべて一人に集中させる","z":"把提案书制作全部集中给一个人"}],"a":[0],"e":"把最佳实践标准化并通过共享 Project 和模板推广，是团队层面的效率化。不统一无法缩小差距；禁止使用和集中一人都不合理。","ej":"ベストプラクティスを標準化・共有Projectで展開"},{"id":"d7-050","d":7,"t":"7.3","n":1,"q":"大量の短い商品タグ文(1件30字程度)を作成する。速度とコストの観点で最も適切な進め方はどれか。","qz":"要制作大量简短的商品标签文字（每条约 30 字）。从速度和成本角度，最合适的做法是哪一个？","o":[{"j":"最高性能のモデルで1件ずつ拡張思考を使って作る","z":"用最高性能模型逐条使用扩展思考制作"},{"j":"品質確認は一切しない","z":"完全不做质量确认"},{"j":"少数で品質を確認したうえで、高速・低コストなモデルで処理し、抜き取りで確認する","z":"用少量确认质量后，用高速低成本模型处理，并抽样检查"},{"j":"1件ごとに新しいチャットを開き、毎回同じ説明を書く","z":"每条都开新对话，每次写同样的说明"}],"a":[2],"e":"简单大量任务适合快速低成本模型，先小规模确认再批量处理并抽检。最高性能+扩展思考浪费；每条开新对话低效；完全不检查有风险。","ej":"単純大量→速い低コストモデル＋抜き取り確認"},{"id":"d7-051","d":7,"t":"7.3","n":1,"q":"Claudeを使った業務改善の効果を経営層に報告したい。効率化の成果を示す方法として最も適切なものはどれか。","qz":"想向高管报告使用 Claude 改善业务的效果。展示效率化成果最合适的方法是哪一个？","o":[{"j":"Claudeに効果の数値を推測で作らせることで、報告資料を短時間で作成する","z":"让 Claude 凭推测编出效果数字，以便在短时间内做出报告资料"},{"j":"「とても便利になった」という感想だけを伝える","z":"只传达“变得非常方便”的感想"},{"j":"効果は自明なので報告しない","z":"效果不言而喻，所以不报告"},{"j":"導入前後の作業時間・修正回数・品質指標を同じ条件で比較して示す","z":"在相同条件下比较并展示引入前后的工作时间、修改次数、质量指标"}],"a":[3],"e":"用同条件下的前后对比数据说明效果最有说服力。只有感想缺乏依据；让 Claude 编数字是捏造；不报告无法获得支持。","ej":"効果は導入前後を同条件で数値比較"},{"id":"d7-052","d":7,"t":"7.3","n":1,"q":"同じ参考資料(製品仕様書)を、毎回チャットに添付し直して質問している。最も効率的な方法はどれか。","qz":"每次都把同样的参考资料（产品规格书）重新附加到对话中提问。最有效率的方法是哪一个？","o":[{"j":"仕様書の内容を暗記して、Claudeを使わない","z":"把规格书背下来，不用 Claude"},{"j":"製品仕様書をProjectのナレッジに登録し、そのProject内で質問する","z":"把产品规格书登记到 Project 知识库，在该 Project 内提问"},{"j":"仕様書をメールで自分に送っておく","z":"把规格书用邮件发给自己"},{"j":"毎回添付する方が確実なので、今の方法を続ける。添付し忘れがない限り問題は起きない","z":"每次附加更可靠，继续现在的方法。只要不忘记附加就不会出问题"}],"a":[1],"e":"反复使用的资料放进 Project 知识库，可以省去重复上传并保持一致。继续每次附加效率低；背诵和发邮件都不能解决问题。","ej":"繰り返し使う資料はProjectのナレッジへ"},{"id":"d7-053","d":7,"t":"7.3","n":2,"q":"Claudeの利用上限にすぐ達してしまう。利用を最適化する方法として適切なものはどれか。2つ選べ。","qz":"很快就达到 Claude 的使用上限。以下哪些优化使用的方法合适？请选择 2 项。","o":[{"j":"すべてのタスクを最上位モデルで行う","z":"所有任务都用最高级模型"},{"j":"同じ質問を何度も送って最良の回答を選ぶ","z":"多次发送同一个问题，选出最好的回答"},{"j":"簡単なタスクでは拡張思考を使わず、必要な場面だけで使う","z":"简单任务不使用扩展思考，只在需要时使用"},{"j":"話題が変わったら新しいチャットを始め、不要に長い会話を続けない","z":"话题变化时开新对话，不要无谓地延续长对话"},{"j":"毎回すべての資料を添付し直す","z":"每次重新附加全部资料"}],"a":[2,3],"e":"避免冗长对话、按需使用扩展思考可以节省用量。重复发送同一问题、每次重新附加全部资料、所有任务都用最高级模型都会浪费用量。","ej":"不要な長い会話・過剰な機能利用を避ける"},{"id":"d7-054","d":7,"t":"7.3","n":1,"q":"議事録作成フローで、「文字起こし→要約→決定事項抽出→配布用整形」を毎回手作業でClaudeに指示している。最も効果的な効率化はどれか。","qz":"会议记录流程中，每次都手动指示 Claude 进行“转写→摘要→提取决定事项→整理成分发格式”。最有效的效率化是哪一个？","o":[{"j":"手順を省略して要約だけにする","z":"省略步骤，只做摘要"},{"j":"議事録の作成をやめる","z":"停止制作会议记录"},{"j":"毎回異なる順番で指示して、最も速い方法を探す","z":"每次用不同顺序指示，寻找最快的方法"},{"j":"手順と出力書式をSkillまたはProjectの指示としてまとめ、毎回同じ手順で処理されるようにする","z":"把步骤和输出格式整理成 Skill 或 Project 指示，让每次按同样步骤处理"}],"a":[3],"e":"固定的多步流程适合整理成 Skill 或 Project 指示，既省时又保证一致。省略步骤会丢失决定事项；随意改变顺序不稳定；停止制作不合理。","ej":"定型の多段手順→SkillやProjectの指示にまとめる"},{"id":"d7-055","d":7,"t":"7.3","n":1,"q":"Claudeを使った業務フローで、人による確認工程が時間のボトルネックになっている。最も適切な最適化はどれか。","qz":"在使用 Claude 的业务流程中，人工确认环节成了时间瓶颈。最合适的优化是哪一个？","o":[{"j":"確認工程をすべて廃止する","z":"全部取消确认环节"},{"j":"リスクに応じて確認の深さを変える(社外向け・高リスクは全件確認、社内の低リスクなものは抜き取り確認)","z":"根据风险调整确认深度（对外和高风险的全部确认，内部低风险的抽查）"},{"j":"確認を自分ではなくClaudeにだけ任せる","z":"确认不由自己做，只交给 Claude"},{"j":"確認を待つ間、別のAIに同じ作業をさせる","z":"等待确认期间让另一个 AI 做同样的工作"}],"a":[1],"e":"按风险分级确认，可以在保证安全的同时提高效率。全部取消确认风险大；只交给 Claude 自我检查不可靠；让另一个 AI 重复工作没有解决瓶颈。","ej":"確認はリスクに応じて深さを変える"},{"id":"d7-060","d":7,"t":"7.3","n":1,"q":"Claudeで作成した資料を、毎回WordやExcelに手作業で貼り付けて整形している。最も効率的な改善はどれか。","qz":"每次都把 Claude 生成的资料手工粘贴到 Word 或 Excel 中整理格式。最有效率的改进是哪一个？","o":[{"j":"整形をやめ、テキストのまま配布する","z":"不再整理格式，直接以文本分发"},{"j":"貼り付け作業を別の担当者に任せる。担当を分けることで本来の業務に集中できる","z":"把粘贴工作交给其他负责人。分开负责就能专注本职工作"},{"j":"出力を画像に変換して貼り付ける","z":"把输出转换成图片后粘贴"},{"j":"ファイル作成機能を有効にして、docxやxlsx形式で直接出力させる","z":"开启文件创建功能，让它直接输出 docx 或 xlsx 格式"}],"a":[3],"e":"用文件创建功能直接生成 Office 文件，可以省去手工粘贴和整理。转交他人没有减少工作量；不整理格式影响使用；转成图片不便于编辑。","ej":"ファイル作成機能でdocx/xlsxを直接出力"}];

};

  if(sec)jump(sec);

function jump(t){const el=document.getElementById("s"+t.replace(".","_"));if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
function markRead(t,d){const y=window.scrollY;if(!S.read.includes(t))S.read.push(t);else S.read=S.read.filter(x=>x!==t);save();V.chap({d});window.scrollTo(0,y)}

V.prac=()=>{
  M().innerHTML=`<h2>練習</h2>
  <div class="card"><div><h3>ドメイン別練習</h3>${ZH("按领域练习，每题即时显示解析","zhb mute")}</div><div class="list">${Object.keys(DN).map(d=>{const ids=QS.filter(q=>q.d==d).map(q=>q.id),s=stat(ids);
  return`<div class="it" onclick="startPractice(shuffle(QS.filter(q=>q.d==${d}).map(q=>q.id)),'D${d} ${DN[d][0]}')"><span class="tag">D${d}</span><div class="b"><div style="font-weight:500">${DN[d][0]} <span class="mute">${DN[d][2]}%</span></div>${ZH(DN[d][1])}<div class="bar" style="margin-top:5px"><i style="width:${s.done/s.n*100}%"></i></div></div><span class="mute num">${s.ok}/${s.n}</span></div>`}).join("")}</div></div>
  <div class="card"><div><h3>ランダム練習</h3>${ZH("随机练习","zhb mute")}</div>
  <div class="chips">${Object.keys(DN).map(d=>`<label><input type="checkbox" class="rd" id="rd${d}" value="${d}" checked>D${d}</label>`).join("")}</div>
