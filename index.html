","o":[{"j":"毎週すべてのメールを手作業でコピーして貼り付ける","z":"每周手动复制粘贴所有邮件"},{"j":"コネクタを使うと危険なので、要約は諦める","z":"使用连接器很危险，所以放弃汇总"},{"j":"メンバー全員のメールアカウント情報を集めて共有アカウントを作り、Claudeが全員の受信箱を毎週読めるようにする","z":"收集所有成员的邮箱账号信息做成共享账号，让Claude每周能读取所有人的收件箱"},{"j":"管理者が許可したGmail・Google Driveコネクタを使い、必要な範囲の情報を参照して要約させる","z":"使用管理员许可的Gmail、Google Drive连接器，参照必要范围的信息让它总结"}],"a":[3],"e":"连接器可以在授权范围内读取Gmail和Drive信息，团队/企业版需管理员启用，应只访问必要范围（最小权限）。收集密码严重违反安全；手动复制低效且易漏；在有合规手段时直接放弃不必要。","ej":"管理者許可のコネクタで必要範囲だけ参照"},{"id":"d4-026","d":4,"t":"4.4","n":1,"q":"Claudeを日常業務に組み込んだ後、効果が出ているかを継続的に把握したい。最も適切な方法はどれか。","qz":"把Claude嵌入日常业务后，想持续掌握是否有效果。最合适的方法是哪一项？","o":[{"j":"導入したこと自体を成果として報告し、測定はしない","z":"把导入本身作为成果报告，不做测定"},{"j":"導入前に決めた指標(処理時間、手戻り件数、満足度など)を定期的に測定し、改善点を見直す","z":"定期测定导入前决定的指标（处理时间、返工件数、满意度等），复查改善点"},{"j":"問題が報告されるまで何もしない","z":"在问题被报告之前什么也不做"},{"j":"毎月Claudeに「導入の効果はどの程度あったか」を質問し、その回答を効果測定の結果として報告する","z":"每月问Claude“导入效果有多大”，把它的回答作为效果测定结果报告"}],"a":[1],"e":"用事先定义的指标定期测量并持续改进，是工作流整合后的运营方式。导入本身不是成果；问Claude无法得到客观数据；被动等待会错过改善机会。","ej":"事前に決めた指標で定期測定→見直し"},{"id":"d4-027","d":4,"t":"4.4","n":1,"q":"営業資料作成フローにClaudeを組み込んだが、メンバーによって出力品質に大きな差が出ている。最も効果的な改善策はどれか。","qz":"在销售资料制作流程中嵌入了Claude，但不同成员的输出质量差异很大。最有效的改善措施是哪一项？","o":[{"j":"品質が低いメンバーの利用を禁止する","z":"禁止质量低的成员使用"},{"j":"品質の差は個性なので放置する","z":"质量差异是个性，置之不理"},{"j":"品質の良いメンバーのプロンプトと手順を標準化し、Projectの指示やテンプレートとして共有する","z":"把质量好的成员的提示和步骤标准化，作为Project指示或模板共享"},{"j":"全員の利用モデルを最上位のOpusに統一し、拡張思考を常にオンにすることで品質差をなくす","z":"把所有人的模型统一为最高级的Opus，并始终开启扩展思考来消除质量差异"}],"a":[2],"e":"质量差异多源于提示和流程不同，把最佳实践标准化并通过Project指示/模板共享最有效。禁止使用不能解决问题；只换模型无法弥补指示差异；放任会影响对外资料质量。","ej":"良いプロンプト・手順を標準化して共有"},{"id":"d4-028","d":4,"t":"4.4","n":2,"q":"既存の月次報告業務にClaudeを導入する際、利用者の定着を促すために有効な施策を2つ選べ。","qz":"在现有月度报告业务中导入Claude时，为促进用户的落地使用，请选出2项有效措施。","o":[{"j":"利用者からのフィードバックを集め、テンプレートや手順を定期的に更新する","z":"收集用户反馈，定期更新模板和步骤"},{"j":"使い方は各自に任せ、質問窓口は設けない","z":"使用方法交给各人，不设咨询窗口"},{"j":"導入目的を説明せずに利用を開始する","z":"不说明导入目的就开始使用"},{"j":"初日から全業務での利用を義務化し、例外を認めない","z":"从第一天起强制在所有业务中使用，不允许例外"},{"j":"具体的な業務例を使った短い研修とプロンプト例集を用意する","z":"准备使用具体业务例子的简短培训和提示示例集"}],"a":[0,4],"e":"落地需要贴近业务的培训与示例，以及根据反馈持续更新。完全放任、不设窗口会导致困惑；一刀切强制会引起抵触且忽略不适用场景；不说明目的难以获得理解。","ej":"業務例付き研修+フィードバックで継続更新"},{"id":"d4-069","d":4,"t":"4.4","n":1,"q":"法務部では、契約書の一次チェックを担当者が1件あたり1時間かけて行っている。Claudeを既存フローに組み込む方法として最も適切なものはどれか。","qz":"法务部每份合同的初步检查要花负责人 1 小时。把 Claude 融入现有流程的方法中，最合适的是哪一项？","o":[{"j":"社内のチェック観点リストに沿ってClaudeに論点の洗い出しをさせ、担当者がそれを確認・判断する工程にする","z":"让 Claude 按公司内部检查要点列出问题点，由负责人确认和判断"},{"j":"相手方から受け取った契約書を、社外の無料AIサービスにも入れて結果を比べる","z":"把从对方收到的合同也放进外部免费 AI 服务，比较结果"},{"j":"Claudeのチェックは観点の抜けがなく一貫しているため、その結果を最終判断とし、担当者による確認工程は廃止して時間を削減する","z":"Claude 的检查没有遗漏而且一致，所以把它的结果作为最终判断，取消负责人的确认工序以节省时间"},{"j":"契約書のチェックは専門性が高いので、Claudeは議事録作成だけに使う","z":"合同检查专业性高，所以 Claude 只用来写会议记录"}],"a":[0],"e":"在现有流程中加入 Claude 的初步检查，由人做判断，是典型的“扩展（Augment）”。取消人工确认对法律文件风险太高；完全不用于专业工作放弃了价值；把机密合同放进未经批准的外部服务违反政策。","ej":"拡張：Claudeが論点出し→担当者が判断"},{"id":"d4-070","d":4,"t":"4.4","n":1,"q":"ある企業では、毎月の報告書作成が「各部署が書く→取りまとめ担当がまとめ直す→部長が修正」という流れで2週間かかっている。業務の再設計（redesign）の例として最も適切なものはどれか。","qz":"某企业每月报告的制作流程是“各部门写→汇总负责人重新整理→部长修改”，需要 2 周。作为业务“重新设计（redesign）”的例子，最合适的是哪一项？","o":[{"j":"各部署が書いた報告書をClaudeに渡し、部長の確認なしでそのまま配布する","z":"把各部门写的报告交给 Claude，不经部长确认直接分发"},{"j":"報告書の作成をやめ、各部署が口頭で部長に報告するよう変更する","z":"停止制作报告，改为各部门口头向部长汇报"},{"j":"現場の混乱を避けるため今の流れはそのままにし、取りまとめ担当が最後に誤字脱字のチェックをするときだけClaudeを使う","z":"为了避免现场混乱，保持现有流程不变，只在汇总负责人最后检查错别字时使用 Claude"},{"j":"各部署は決められた項目だけを入力し、Claudeが統一形式の下書きにまとめ、部長が確認する流れに作り替える","z":"改为各部门只输入规定的项目，由 Claude 整合成统一格式的初稿，部长确认"}],"a":[3],"e":"重新设计是以 AI 为前提重新组织整个流程（输入标准化 → Claude 整合 → 人确认）。只用于错别字检查是“扩展”而不是重新设计；取消报告改口头是另一回事；去掉人工确认有风险。","ej":"再設計＝AI前提でフロー全体を組み替える"},{"id":"d4-071","d":4,"t":"4.4","n":2,"q":"コールセンターで、通話後の対応記録作成にClaudeを組み込む。運用ルールとして適切なものを2つ選べ。","qz":"在呼叫中心，把 Claude 用于通话后的处理记录制作。选出 2 项合适的运营规则。","o":[{"j":"記録の形式は担当者ごとに自由にし、統一したテンプレートは使わない","z":"记录格式由每个负责人自由决定，不使用统一模板"},{"j":"クレジットカード番号などの機微情報は、社内規定に従いマスキングしてから入力する","z":"信用卡号等敏感信息按公司规定遮蔽后再输入"},{"j":"記録の下書きは担当者が内容を確認し、事実と違う箇所を修正してから保存する","z":"记录初稿由负责人确认内容，修改与事实不符的地方后再保存"},{"j":"記録の速さを重視し、Claudeの下書きはそのまま顧客履歴に保存する","z":"重视记录速度，把 Claude 的初稿直接保存到客户记录"},{"j":"通話内容の全文を、承認されていない個人のAIアカウントにも保存しておく","z":"把通话全文也保存在未经批准的个人 AI 账号中"}],"a":[1,2],"e":"融入流程时要设定人工确认点，并按规定处理敏感信息。不确认直接保存会留下错误记录；使用未经批准的个人账号违反政策；格式不统一会降低记录质量和可比性。","ej":"人の確認ポイント＋機微情報の扱いをルール化"},{"id":"d4-072","d":4,"t":"4.4","n":1,"q":"チームでClaudeを使い始めたが、各自が別々のプロンプトを使っていて、成果物の形式がバラバラになっている。最も効果的な対策はどれか。","qz":"团队开始使用 Claude，但每个人用不同的提示词，成果格式五花八门。最有效的对策是哪一项？","o":[{"j":"共有Projectを作り、標準の指示・テンプレート・参考資料を入れてチームで同じ環境を使う","z":"建立共享 Project，放入标准指示、模板和参考资料，团队使用同一环境"},{"j":"形式の違いは個性なので、統一する必要はないとチームに伝える","z":"告诉团队格式差异是个性，不需要统一"},{"j":"最も若いメンバーにだけClaudeを使わせ、他のメンバーは使用を控える","z":"只让最年轻的成员使用 Claude，其他成员不用"},{"j":"毎回、完成した成果物を担当者が手作業で同じ形式に書き直す","z":"每次由负责人手工把完成的成果改写成同一格式"}],"a":[0],"e":"共享 Project 统一指示、模板和资料，是团队标准化的有效做法。放任不管会影响质量；限制使用者不能解决问题；事后手工改写效率低。","ej":"共有Project＋標準テンプレートで品質をそろえる"},{"id":"d4-073","d":4,"t":"4.4","n":1,"q":"営業部で、Googleドライブにある最新の提案資料をもとにClaudeで顧客別の提案文を作りたい。資料は頻繁に更新される。最も適切な方法はどれか。","qz":"营业部想基于 Google Drive 中的最新提案资料，用 Claude 制作针对各客户的提案文。资料经常更新。最合适的方法是哪一项？","o":[{"j":"資料を一度ダウンロードしてProjectのナレッジに入れておき、その後は更新があっても手間がかかるので差し替えずに使い続ける","z":"把资料下载一次放进 Project 知识中，之后即使有更新也因为麻烦而不替换，继续使用"},{"j":"担当者の記憶で資料の内容を要約して入力し、元の資料は参照させない","z":"凭负责人的记忆总结资料内容后输入，不让 Claude 参照原资料"},{"j":"管理者が許可したGoogleドライブのコネクタを使い、必要な資料を最新版のまま参照させる","z":"使用管理员许可的 Google Drive 连接器，让 Claude 参照最新版的必要资料"},{"j":"ドライブ全体へのアクセス権を個人の判断で外部のツールにも付与しておく","z":"凭个人判断把整个 Drive 的访问权限也授予外部工具"}],"a":[2],"e":"资料经常更新时，用连接器直接参照最新版比上传副本更合适，并且要使用管理员许可的连接器。不更新副本会导致用旧信息；凭记忆输入容易出错；随意给外部工具授权违反最小权限原则。","ej":"頻繁に更新される資料はコネクタで最新版を参照"},{"id":"d4-074","d":4,"t":"4.4","n":1,"q":"Claudeを業務に組み込んで3か月が経った。導入効果を継続的に把握する方法として最も適切なものはどれか。","qz":"把 Claude 融入业务已经 3 个月。持续掌握导入效果的方法中，最合适的是哪一项？","o":[{"j":"3か月使えたので効果は出ていると判断し、以後の測定はやめる","z":"用了 3 个月就判断有效果，之后不再测量"},{"j":"導入前に決めた指標（作業時間・修正回数・満足度など）を定期的に測り、課題があれば改善する","z":"定期测量导入前定好的指标（作业时间、修改次数、满意度等），有问题就改进"},{"j":"Claudeに「導入は成功していますか」と聞き、その回答を効果測定とする","z":"问 Claude“导入成功了吗”，把它的回答作为效果评估"},{"j":"利用者に感想を一度だけ聞き、良い意見だけを報告書にまとめる","z":"只问一次用户感想，只把好的意见写进报告"}],"a":[1],"e":"效果要用事先定好的指标定期测量并持续改进。停止测量无法发现问题；只报告好意见是偏颇的；让 Claude 自己评价不能代替实际测量。","ej":"指標を定期的に測定し、継続的に改善"},{"id":"d4-075","d":4,"t":"4.4","n":2,"q":"既存の業務にClaudeを導入する際、現場の定着を促すために効果的な施策を2つ選べ。","qz":"在现有业务中导入 Claude 时，选出 2 项能促进一线普及的有效措施。","o":[{"j":"説明はせずにツールだけ配布し、使い方は各自で調べてもらう","z":"不做说明只发工具，让各人自己研究用法"},{"j":"使わない人には罰則を設け、利用回数を毎日個人別に公表する","z":"对不用的人设罚则，每天公布每个人的使用次数"},{"j":"導入の目的と期待する効果を説明し、現場の意見を聞きながら運用ルールを調整する","z":"说明导入目的和预期效果，一边听取一线意见一边调整运营规则"},{"j":"現場の業務を理解していない外部の担当者だけで運用ルールを決める","z":"只由不了解一线业务的外部人员来决定运营规则"},{"j":"よく使うプロンプト例や操作手順をまとめたガイドを用意し、短い研修を行う","z":"准备常用提示词示例和操作步骤的指南，进行简短培训"}],"a":[2,4],"e":"说明目的、听取意见、提供指南和培训，是变更管理的基本做法。惩罚和公开排名会引起抵触；只发工具不说明难以普及；不了解一线的人定规则难以落地。","ej":"目的の説明・現場の声・ガイドと研修で定着"},{"id":"d4-076","d":4,"t":"4.4","n":1,"q":"マーケティング部で、キャンペーン企画書の作成をClaudeで効率化したい。現在の手順は「市場調査→アイデア出し→企画書作成→上長レビュー」である。Claudeの組込み方として最も適切なものはどれか。","qz":"市场部想用 Claude 提高活动企划书的制作效率。目前流程是“市场调查→想点子→写企划书→上司审阅”。Claude 的融入方式中最合适的是哪一项？","o":[{"j":"上長レビューの工程だけをClaudeに置き換え、上長は企画書を読まない","z":"只把上司审阅这一步换成 Claude，上司不再阅读企划书"},{"j":"調査・アイデア出し・企画書の下書きの各工程でClaudeを支援に使い、事実確認と上長レビューは人が行う","z":"在调查、想点子、写初稿各工序用 Claude 辅助，事实确认和上司审阅由人来做"},{"j":"Claudeは企画には向かないので、誤字脱字のチェックだけに使う","z":"Claude 不适合做企划，只用来检查错别字"},{"j":"効率を最大化するため、調査から企画書作成までの全工程をClaudeに一度に依頼し、出てきた企画書を上長レビューなしで実行に移す","z":"为了最大限度提高效率，把从调查到写企划书的全部工序一次交给 Claude，不经上司审阅直接执行企划书"}],"a":[1],"e":"在各工序发挥 Claude 的辅助作用，同时保留事实确认和人的审阅，是合适的融入方式。全部交给 Claude 并跳过审阅风险高；用 Claude 代替审批者等于放弃人的责任；只用于检查错别字没有发挥价值。","ej":"各工程で支援に使い、確認と承認は人"},{"id":"d4-077","d":4,"t":"4.4","n":1,"q":"ある部署でClaudeを使った週次の議事録要約が定着した。次に同じ仕組みを他の部署へ展開したい。最も適切な進め方はどれか。","qz":"某部门用 Claude 做每周会议摘要已经稳定下来。接下来想把同样机制推广到其他部门。最合适的推进方式是哪一项？","o":[{"j":"展開は各部署の自主性に任せ、成功した部署のノウハウは共有しない","z":"推广交给各部门自主决定，不共享成功部门的经验"},{"j":"成功した部署と同じ設定をそのまま全部署に一斉に適用し、業務内容に違いがあっても公平性を保つため個別の調整は行わない","z":"把成功部门的设置原样一次性应用到所有部门，即使业务内容不同，为了公平也不做个别调整"},{"j":"うまくいった手順・指示・注意点を文書化し、展開先の業務の違いを確認して調整しながら広げる","z":"把成功的步骤、指示和注意事项文档化，确认推广对象业务的差异并边调整边推广"},{"j":"他の部署は会議の性質が違うので、展開は検討しない","z":"其他部门的会议性质不同，所以不考虑推广"}],"a":[2],"e":"把成功经验文档化，并根据对象业务的差异调整后推广，是有效的横向展开。原样套用忽视了差异；不共享经验浪费了成果；直接放弃推广过于消极。","ej":"成功パターンを文書化し、違いを調整して横展開"},{"id":"d4-078","d":4,"t":"4.4","n":1,"q":"Gmailのコネクタを使い、Claudeに顧客からの問い合わせメールへの返信案を作らせる運用を始めたい。最も適切な運用はどれか。","qz":"想开始用 Gmail 连接器，让 Claude 起草对客户问询邮件的回复。最合适的运营方式是哪一项？","o":[{"j":"Claudeには下書きを作らせ、担当者が内容と宛先を確認してから自分で送信する","z":"让 Claude 写草稿，负责人确认内容和收件人后自己发送"},{"j":"返信案の作成には、社外の承認されていないメールツールを併用する","z":"起草回复时同时使用未经公司批准的外部邮件工具"},{"j":"全社員のメールボックスへのアクセスを一人のアカウントにまとめて付与する","z":"把全员邮箱的访问权限集中授予一个账号"},{"j":"Claudeが作った返信は正確なので、確認せずにすべて送信する運用にする","z":"Claude 写的回复很准确，所以采用不确认就全部发送的运营方式"}],"a":[0],"e":"Gmail 连接器可以搜索、阅读和写草稿，发送前由人确认内容和收件人是安全的运营方式。不确认就发送有错误风险；集中授予大范围权限违反最小权限原则；使用未经批准的工具属于影子 AI。","ej":"コネクタの下書き→人が確認して送信"},{"id":"d4-079","d":4,"t":"4.4","n":1,"q":"経理部で、Claudeを使った請求書チェックを試行した。作業時間は30%減ったが、確認漏れが1件発生した。最も適切な対応はどれか。","qz":"财务部试行了用 Claude 检查发票。作业时间减少了 30%，但发生了 1 起确认遗漏。最合适的应对是哪一项？","o":[{"j":"時間が30%減ったので、漏れは気にせず同じ方法で全社展開する","z":"时间减少了 30%，所以不在意遗漏，用同样方法向全公司推广"},{"j":"確認漏れが1件でも出た以上、同じ事故を防ぐために、Claudeの利用を直ちに全面禁止して元の手作業に戻す","z":"既然出现了哪怕 1 起确认遗漏，为了防止同样事故，立即全面禁止使用 Claude，回到原来的手工作业"},{"j":"漏れは担当者個人の責任として処分し、手順は変えずに続ける","z":"把遗漏当作负责人个人责任处理，流程不变继续"},{"j":"漏れの原因（指示の不足か、人の確認手順か）を分析し、チェック項目や確認工程を見直したうえで継続する","z":"分析遗漏的原因（指示不足还是人工确认步骤问题），重新检查检查项目和确认工序后继续"}],"a":[3],"e":"出现问题时先分析根本原因，再改进指示和确认工序，是持续改进的做法。立即全面禁止过度反应；无视问题直接推广风险大；只追究个人而不改流程会重复同样问题。","ej":"問題は原因分析→手順を見直して継続"},{"id":"d4-080","d":4,"t":"4.4","n":1,"q":"毎朝、営業担当者が前日の商談メモ（社内システムからコピー）をClaudeに貼り付けて日報を作っている。作業をさらに効率化する方法として最も適切なものはどれか。","qz":"营业人员每天早上把前一天的商谈记录（从公司系统复制）粘贴给 Claude 写日报。进一步提高效率的方法中，最合适的是哪一项？","o":[{"j":"毎回、日報の形式や注意点を一から詳しく書いてからメモを貼り付ける","z":"每次都从头详细写日报格式和注意事项，然后再粘贴记录"},{"j":"日報の形式と指示をProjectに保存し、毎回メモを貼るだけで同じ形式の下書きができるようにする","z":"把日报格式和指示保存在 Project 中，每次只需粘贴记录就能生成同样格式的初稿"},{"j":"日報の正確さは問わないことにし、確認せずに上長へ自動で転送する","z":"不再要求日报准确，不确认就自动转发给上司"},{"j":"商談メモを貼るのをやめ、Claudeに前日の商談内容を推測して書かせる","z":"不再粘贴商谈记录，让 Claude 推测前一天的商谈内容来写"}],"a":[1],"e":"把每次重复的指示和格式保存进 Project，可以减少重复输入、统一质量。每次从头写效率低；让 Claude 推测内容会产生编造；放弃准确性和确认不可取。","ej":"繰り返す指示はProjectに保存して効率化"},{"id":"d4-029","d":4,"t":"4.5","n":1,"q":"部長から「Claudeを使えば人員を半分にできるのか」と質問された。最も適切な回答方針はどれか。","qz":"部长问：“用了Claude是不是可以把人员减半？”最合适的回答方针是哪一项？","o":[{"j":"「必ず半分にできます」と断言する","z":"断言“一定可以减半”"},{"j":"業界調査で示されている平均的な生産性向上率をそのまま当社に当てはめ、人員を半分に削減できる可能性が高いと前向きに回答する","z":"把行业调研中的平均生产率提升比例直接套用到本公司，积极回答很有可能把人员削减一半"},{"j":"「AIは役に立たない」と答えて期待を下げる","z":"回答“AI没用”以降低期待"},{"j":"試行で得られた時間削減の実績と、人による確認が必要な作業を示し、期待できる効果と限界を具体的に説明する","z":"展示试行中得到的时间削减实绩和需要人确认的工作，具体说明可期待的效果和局限"}],"a":[3],"e":"向利益相关者沟通时，应基于本公司试行的实际数据说明价值，同时诚实说明局限（如需要人工审核的部分）。断言能减半或套用行业平均值都是夸大；全盘否定也不准确。","ej":"実績データで価値と限界をバランスよく説明"},{"id":"d4-030","d":4,"t":"4.5","n":1,"q":"Claude導入の稟議書を作成する。経営層の理解を得るために最も効果的な構成はどれか。","qz":"要撰写导入Claude的审批书。为了获得经营层的理解，最有效的结构是哪一项？","o":[{"j":"モデルの技術的な仕組みの詳細説明を中心にする","z":"以模型技术原理的详细说明为中心"},{"j":"導入のメリットと他社の成功事例を中心に華やかに構成し、リスクや費用については承認を得た後で詳細を詰めると簡単に記載する","z":"以导入优点和他社成功案例为中心做出亮眼的结构，风险和费用只简单写明批准后再细化"},{"j":"他社の成功事例だけを並べる","z":"只罗列其他公司的成功案例"},{"j":"解決したい業務課題、試行結果(定量効果)、リスクと対策、費用、次のステップを簡潔に示す","z":"简洁展示要解决的业务课题、试行结果（定量效果）、风险与对策、费用和下一步"}],"a":[3],"e":"面向经营层要用业务语言：课题、定量效果、风险与对策、成本、下一步。技术细节不是经营层关注重点；只列他社案例缺乏本公司依据；隐藏风险会损害信任并在后期出问题。","ej":"課題・効果・リスク対策・費用・次の一手"},{"id":"d4-031","d":4,"t":"4.5","n":1,"q":"現場の担当者が「Claudeの答えは全部正しいんでしょう?」と考えている。導入推進者として伝えるべき内容として最も適切なものはどれか。","qz":"现场负责人认为“Claude的回答全都是对的吧？”作为导入推进者，最应该传达的内容是哪一项？","o":[{"j":"Claudeは確信度が低いときには必ず自分からそう伝えてくれるので、断定的な口調の回答であれば確認せずにそのまま使ってよい","z":"Claude在把握不大时一定会主动说明，所以语气断定的回答可以不确认直接使用"},{"j":"Claudeはもっともらしい誤り(ハルシネーション)を出すことがあり、重要な事実は一次情報で確認する必要がある","z":"Claude有时会产生貌似合理的错误（幻觉），重要事实需要用一次信息确认"},{"j":"最新モデルなら誤りは絶対にない","z":"最新模型绝对不会出错"},{"j":"誤りは多いので、使わない方がよい","z":"错误很多，最好不要用"}],"a":[1],"e":"向相关人员说明局限是Domain 4的重要能力：AI可能产生幻觉，关键事实要核查。任何模型都不能保证零错误；Claude不会可靠地自动报告自己的错误；因噎废食也不是正确的沟通。","ej":"限界(ハルシネーション)と検証の必要性を伝える"},{"id":"d4-032","d":4,"t":"4.5","n":2,"q":"Claude活用の成果を社内の他部署に共有する。効果的な伝え方として適切なものを2つ選べ。","qz":"要向公司内其他部门分享Claude的应用成果。请选出2项有效的传达方式。","o":[{"j":"使ったプロンプトや入力データ(顧客情報を含む)をそのまま全社に公開する","z":"把使用的提示和输入数据（含客户信息）原样向全公司公开"},{"j":"専門用語を多用して先進性をアピールする","z":"多用专业术语以显示先进性"},{"j":"成功例だけを誇張して伝える","z":"只夸大地传达成功案例"},{"j":"Before/Afterの作業時間や品質など、具体的な数値と事例で示す","z":"用Before/After的作业时间、质量等具体数值和案例展示"},{"j":"うまくいかなかった点や人の確認が必要だった点も併せて共有する","z":"同时分享不顺利的地方和需要人确认的地方"}],"a":[3,4],"e":"具体数据+真实案例最有说服力，同时坦诚分享局限和教训，帮助他人正确预期。夸大成功会导致错误期待；公开含客户信息的数据违反隐私；堆砌术语不利于理解。","ej":"数値と事例+失敗・限界も共有"},{"id":"d4-033","d":4,"t":"4.5","n":1,"q":"法務部門が「Claudeに契約書レビューを任せたい」と言っている。価値と限界を伝える説明として最も適切なものはどれか。","qz":"法务部门说“想把合同审查交给Claude”。作为传达价值与局限的说明，最合适的是哪一项？","o":[{"j":"Claudeは大量の法律文書を学習しているため、定型的な契約書であればレビューと承認まで任せられる","z":"Claude学习了大量法律文书，所以如果是定型合同，可以把审查到批准都交给它"},{"j":"契約書は機密なので、Claudeは一切使えない","z":"合同是机密，所以完全不能使用Claude"},{"j":"条項の抽出や論点の一次チェックで作業を速められるが、法的判断と最終確認は法務担当者が行う必要がある","z":"可以通过条款提取和论点初步检查加快作业，但法律判断和最终确认需要由法务人员进行"},{"j":"Claudeの指摘がない条項は問題がないと考えてよい","z":"Claude没有指出的条款可以认为没有问题"}],"a":[2],"e":"Claude可以加速条款提取和初查，但专业的法律判断和最终责任在人。等同律师的说法夸大；在符合公司政策和合同条件（如商业版）的前提下，机密文件也可能被允许使用，一律禁止过于极端；没有指出≠没有问题，可能遗漏。","ej":"一次チェックで加速、法的判断・最終確認は人"},{"id":"d4-034","d":4,"t":"4.5","n":1,"q":"Claude導入に不安を感じているメンバーから「自分の仕事がなくなるのでは」と相談された。最も適切な対応はどれか。","qz":"对导入Claude感到不安的成员咨询说“我的工作会不会没了”。最合适的应对是哪一项？","o":[{"j":"「AIに勝てないので転職を考えた方がよい」と伝える","z":"告诉对方“赢不了AI，最好考虑换工作”"},{"j":"「導入は経営判断なので」と説明し、不安があれば人事部の相談窓口に連絡するよう案内して、それ以上は話を聞かずに終える","z":"说明“导入是经营判断”，引导对方有不安就联系人事部咨询窗口，不再继续听对方说就结束谈话"},{"j":"不安な人には導入の情報を伝えない","z":"不向感到不安的人传达导入信息"},{"j":"Claudeは定型的な作業を支援し、人はレビュー・判断・顧客対応など付加価値の高い業務に時間を使えることを、具体例で説明する","z":"用具体例子说明Claude辅助定型工作，人可以把时间用在审核、判断、客户应对等高附加值业务上"}],"a":[3],"e":"与利益相关者沟通时，要具体说明AI如何改变工作方式（增强而非简单替代），以及人的角色如何转向高附加值工作。空泛安慰无说服力；隐瞒信息加剧不安；负面断言既不准确也伤害信任。","ej":"人の役割(レビュー・判断)を具体例で説明"},{"id":"d4-081","d":4,"t":"4.5","n":1,"q":"役員から「Claudeを導入すれば、顧客対応のミスはゼロになるのか」と聞かれた。最も適切な回答はどれか。","qz":"高管问：“导入 Claude 后，客户应对的失误会变成零吗？”最合适的回答是哪一项？","o":[{"j":"AIは誤りが多いので、顧客対応には役に立たないと回答する","z":"回答 AI 错误很多，对客户应对没有帮助"},{"j":"ミスが起きた場合はClaudeの責任になるので、会社のリスクはなくなると説明する","z":"说明出错时是 Claude 的责任，所以公司没有风险"},{"j":"最新のAIは高い精度を持つため、顧客対応での誤りは起きないと断言し、その前提で導入の承認を得る","z":"最新的 AI 精度很高，所以断言客户应对中不会出错，并以此为前提获得导入批准"},{"j":"下書きの質と速さは上がるが、誤りの可能性は残るため、人の確認を組み合わせてミスを減らす仕組みにすると説明する","z":"说明初稿的质量和速度会提升，但仍可能出错，所以要结合人工确认来建立减少失误的机制"}],"a":[3],"e":"向利益相关者说明时要诚实、平衡：讲清价值，也讲清局限和对策。断言零失误是夸大；全面否定过于消极；责任始终在使用者和组织，而不是 AI。","ej":"価値と限界をバランスよく。責任は人と組織にある"},{"id":"d4-082","d":4,"t":"4.5","n":1,"q":"Claude活用の成果を経営会議で報告する。最も説得力のある報告の仕方はどれか。","qz":"在经营会议上报告 Claude 应用成果。最有说服力的报告方式是哪一项？","o":[{"j":"報告の印象をよくするため、利用者から寄せられた好意的なコメントだけを集めて紹介し、課題やリスクには触れずに報告する","z":"为了让报告印象好，只收集并介绍用户的正面评价，不提问题和风险"},{"j":"具体的な数字は出さず、「とても便利になった」という印象を伝える","z":"不给具体数字，只传达“变得非常方便”的印象"},{"j":"試行前後の作業時間や品質の測定結果を示し、残っている課題と今後の対策も合わせて説明する","z":"展示试行前后作业时间和质量的测量结果，同时说明遗留问题和今后对策"},{"j":"他社の成功事例の数字を、自社の成果として紹介する","z":"把其他公司的成功案例数字当作本公司成果介绍"}],"a":[2],"e":"用实际数据展示效果，并诚实说明课题和对策，最有说服力也最可信。只报好消息会失去信任；把他社数字当自己的成果是虚假报告；只讲印象缺少依据。","ej":"実測データ＋課題と対策をセットで報告"},{"id":"d4-083","d":4,"t":"4.5","n":2,"q":"現場の社員が「Claudeが書いたものは全部正しい」と思い込んでいる。導入推進者として伝えるべき内容を2つ選べ。","qz":"一线员工认为“Claude 写的东西全都是对的”。作为推进者，选出 2 项应该传达的内容。","o":[{"j":"Claudeの知識には期限があり、最新の情報は検索や最新資料で補う必要がある","z":"Claude 的知识有截止日期，最新信息需要用搜索或最新资料补充"},{"j":"誤りがあってもClaudeの責任なので、利用者は気にしなくてよい","z":"即使有错也是 Claude 的责任，所以用户不必在意"},{"j":"Claudeはもっともらしい誤り（ハルシネーション）を出すことがあるため、重要な事実や数字は確認が必要である","z":"Claude 有时会输出看似合理的错误（幻觉），所以重要的事实和数字需要确认"},{"j":"Claudeは自信を持って答えたときは必ず正しいので、その場合は確認不要である","z":"Claude 自信地回答时一定正确，所以那种情况不需要确认"},{"j":"AIは信用できないので、業務には一切使わないほうがよい","z":"AI 不可信，所以业务中最好完全不用"}],"a":[0,2],"e":"要让用户理解局限：幻觉和知识截止日期，并知道如何应对。“自信=正确”是误解；责任在用户和组织；完全不用是过度反应。","ej":"限界（ハルシネーション・知識のカットオフ）を正しく伝える"},{"id":"d4-084","d":4,"t":"4.5","n":1,"q":"現場のリーダーが「Claudeを入れても、結局チェックの手間が増えるだけだ」と導入に反対している。最も適切な対応はどれか。","qz":"一线负责人反对导入，说：“导入 Claude 也只会增加检查的工夫。”最合适的应对是哪一项？","o":[{"j":"懸念を聞いたうえで、小さな業務で試して作業時間とチェックの負担を実際に測り、結果をもとに一緒に判断する","z":"听取顾虑后，用小业务试行，实际测量作业时间和检查负担，并根据结果一起判断"},{"j":"導入はすでに上層部が決めたことなので、現場リーダーの反対意見は聞かずに、決定事項として導入を強制する","z":"导入已经由上层决定，所以不听一线负责人的反对意见，作为决定事项强制导入"},{"j":"反対があるので、この部署への導入は永久に見送る","z":"因为有反对，所以永久放弃在这个部门导入"},{"j":"チェックは不要だと説明して、リーダーの懸念を解消する","z":"说明不需要检查，以消除负责人的顾虑"}],"a":[0],"e":"认真对待顾虑，用试点数据一起判断，是有效的利益相关者沟通。强制推行会引起抵触；说“不需要检查”是错误信息；永久放弃过于草率。","ej":"懸念を聞き、試行データで一緒に判断"},{"id":"d4-085","d":4,"t":"4.5","n":1,"q":"顧客企業の担当者から「御社はClaudeで作った資料を使っているのか」と質問された。社内ポリシーでは、AI利用について適切に開示するよう定められている。最も適切な対応はどれか。","qz":"客户企业的负责人问：“贵公司在用 Claude 做的资料吗？”公司政策规定要适当披露 AI 的使用。最合适的应对是哪一项？","o":[{"j":"AIを使っていると印象が悪いので、使っていないと答える","z":"说用 AI 印象不好，所以回答没有使用"},{"j":"資料の内容はClaudeの責任なので、誤りがあればAnthropicに問い合わせるよう伝える","z":"告诉对方资料内容是 Claude 的责任，有错误请联系 Anthropic"},{"j":"質問には答えず、話題を変えてやり過ごす","z":"不回答问题，转移话题敷衍过去"},{"j":"ポリシーに沿って、Claudeを下書きに使い、内容は担当者が確認していることを説明する","z":"按照政策说明：用 Claude 写初稿，内容由负责人确认"}],"a":[3],"e":"按政策透明说明 AI 的使用方式和人工确认机制，可以建立信任。说谎违反透明性；回避问题有损信任；把责任推给 AI 提供商是错误的，责任在发布资料的公司。","ej":"ポリシーに沿って透明に説明（人が確認していることも）"},{"id":"d4-086","d":4,"t":"4.5","n":1,"q":"Claude導入の予算申請書を作成している。経営層の判断材料として最も適切な構成はどれか。","qz":"正在制作 Claude 导入的预算申请书。作为高层的判断依据，最合适的结构是哪一项？","o":[{"j":"解決したい課題、試行で得た効果、想定コスト、リスクとその対策、評価方法を順に示す","z":"依次说明要解决的问题、试行得到的效果、预计成本、风险及对策、评价方法"},{"j":"導入する機能の一覧と技術的な仕様だけを詳しく書く","z":"只详细写导入功能的一览和技术规格"},{"j":"競合各社が次々とAIを導入している状況を詳しく紹介し、AIブームに乗り遅れないことの重要性を中心に強調する","z":"详细介绍竞争对手接连导入 AI 的情况，重点强调不能错过 AI 热潮"},{"j":"リスクに触れると承認されにくいので、効果だけを最大限に書く","z":"提到风险就不容易获批，所以只尽量写效果"}],"a":[0],"e":"高层需要课题、效果依据、成本、风险对策和评价方法来做决策。只强调潮流缺乏依据；隐瞒风险是不诚实的；只写技术规格与经营判断关系不大。","ej":"課題・効果・コスト・リスク対策・評価方法をそろえる"},{"id":"d4-087","d":4,"t":"4.5","n":2,"q":"Claude活用の取り組みを社内の他部署に紹介する。効果的な伝え方として適切なものを2つ選べ。","qz":"向公司其他部门介绍 Claude 应用的做法。选出 2 个有效的传达方式。","o":[{"j":"うまくいかなかった点や注意点も共有し、同じ失敗を防げるようにする","z":"也分享不顺利的地方和注意事项，帮助别人避免同样的失败"},{"j":"成功した部分だけを見せ、失敗や課題は社外秘として伏せる","z":"只展示成功部分，把失败和问题作为机密隐藏"},{"j":"実際の業務での使用例（入力・出力・人の確認ポイント）を具体的に見せる","z":"具体展示在实际业务中的使用例（输入、输出、人工确认点）"},{"j":"専門用語を多用し、AIに詳しい人だけが理解できる説明にする","z":"大量使用专业术语，做成只有懂 AI 的人才明白的说明"},{"j":"どんな業務でも同じ効果が出ると約束する","z":"承诺任何业务都会有同样效果"}],"a":[0,2],"e":"具体例和失败经验的共享，能让其他部门正确理解价值和局限。只报喜会造成误解；承诺同样效果是夸大；术语过多会让听众难以理解。","ej":"具体例と注意点（失敗）も共有する"},{"id":"d4-088","d":4,"t":"4.5","n":1,"q":"人事部長が「Claudeに採用候補者の合否を決めさせれば、面接官の負担が減る」と提案した。Associateとして最も適切な説明はどれか。","qz":"人事部长提议：“让 Claude 决定录用候选人是否合格，可以减轻面试官的负担。”作为 Associate，最合适的说明是哪一项？","o":[{"j":"採用業務にはAIは一切使えないので、提案はすべて却下すべきだと伝える","z":"说明招聘业务完全不能用 AI，应该否决全部提议"},{"j":"評価メモの整理や質問案の作成などで負担は減らせるが、合否は人の権利に関わるため面接官が判断すべきだと伝える","z":"说明可以通过整理评价记录、准备问题方案等减轻负担，但录用与否关系到个人权益，应由面试官判断"},{"j":"合否判断を任せる前に、モデルを最上位のものに変更すれば問題ないと伝える","z":"说明在交给它判断之前，换成最高级模型就没问题"},{"j":"Claudeは人間のような先入観を持たず公平なので、合否判断を任せれば採用のバイアスがなくなり、面接官の負担も減ると説明する","z":"说明 Claude 没有人那样的先入之见、很公平，把录用判断交给它就能消除偏见，也能减轻面试官负担"}],"a":[1],"e":"说明 Claude 能帮什么（整理、准备），以及什么必须由人做（影响个人权利的决定）。AI 也可能有偏见；完全不用过于消极；换模型不能解决责任和伦理问题。","ej":"支援できる範囲と、人が判断すべき範囲を区別して説明"},{"id":"d4-089","d":4,"t":"4.5","n":1,"q":"プロジェクトの関係者に、Claudeで作成した市場分析の結果を共有する。限界を適切に伝えるための記載として最も適切なものはどれか。","qz":"要向项目相关人员共享用 Claude 做的市场分析结果。为恰当说明局限，最合适的记载是哪一项？","o":[{"j":"分析の前提条件は長くなるので省略し、結論だけを大きく書く","z":"分析的前提条件太长所以省略，只把结论写得很大"},{"j":"AIが作ったことは書かず、すべて確定した事実として記載する","z":"不写是 AI 做的，全部作为确定的事实记载"},{"j":"使用した情報源と時点、確認済みの数値と未確認の推計の区別、人が検証した範囲を明記する","z":"写明使用的信息来源和时间点、已确认数字与未确认推算的区别，以及人工验证过的范围"},{"j":"「AIの出力なので信頼しないでください」とだけ書き、内容の確認はしない","z":"只写“这是 AI 的输出，请不要相信”，不确认内容"}],"a":[2],"e":"写明来源、时间点、确认与未确认的区别，能让读者正确判断可信度。把推算当作事实会误导；只写免责声明而不确认是不负责任的；省略前提会导致结论被误用。","ej":"情報源・時点・確認済み/未確認を区別して伝える"},{"id":"d4-090","d":4,"t":"4.5","n":1,"q":"新しくClaudeを使い始めるチームに向けて、導入説明会を開く。説明内容として最も適切なものはどれか。","qz":"为新开始使用 Claude 的团队召开导入说明会。说明内容中最合适的是哪一项？","o":[{"j":"操作方法は各自で覚えられるので、モデルの技術的な仕組みと学習方法の詳細を中心に説明する","z":"操作方法各自能学会，所以重点说明模型的技术原理和训练方法细节"},{"j":"リスクを強調するため、過去にAIで起きた事故の事例だけを紹介して、慎重に使うよう繰り返し呼びかける","z":"为了强调风险，只介绍过去 AI 引发的事故案例，反复呼吁谨慎使用"},{"j":"期待を高めるため、Claudeでできることだけを紹介し、限界や注意点については質問があった場合にのみ個別に回答する","z":"为了提高期待，只介绍 Claude 能做的事，局限和注意事项只在有人提问时个别回答"},{"j":"得意な業務と苦手な業務の例、確認が必要な場面、社内ポリシーと相談窓口を紹介する","z":"介绍擅长和不擅长的业务例子、需要确认的场合、公司政策和咨询窗口"}],"a":[3],"e":"导入说明要平衡地讲清价值和局限，并告诉大家什么时候要确认、规则是什么、遇到问题找谁。只讲优点会造成过高期待；只讲事故会造成不必要的恐惧；技术原理细节对业务用户帮助不大。","ej":"得意・不得意、確認が必要な場面、ポリシーと相談先を伝える"},{"id":"d5-001","d":5,"t":"5.1","n":1,"q":"社内ヘルプデスク用のProjectを作成する。プロジェクト指示（カスタム指示）とプロジェクトナレッジの役割分担として最も適切なものはどれか。","qz":"要创建公司内部服务台用的 Project。关于项目指令（自定义指令）与项目知识库的分工，最合适的是哪一个？","o":[{"j":"指示もナレッジも設定せず、毎回チャットで説明する","z":"指令和知识库都不设置，每次在对话中说明"},{"j":"全てのマニュアル本文を指示欄に貼り付け、ナレッジは使わない。指示に書けば必ず参照されるので、資料もすべて指示に入れる方が確実である","z":"把全部手册正文贴进指令栏，不使用知识库。写进指令就一定会被参照，所以资料也全部放进指令更稳妥"},{"j":"回答ルールはナレッジのファイル内に紛れ込ませ、指示は空欄にする","z":"把回答规则混在知识库文件里，指令栏留空"},{"j":"役割・口調・回答ルールなどの振る舞いは指示に、社内マニュアルやFAQなどの参照資料はナレッジに置く","z":"角色、语气、回答规则等行为写在指令中，公司手册、FAQ 等参考资料放进知识库"}],"a":[3],"e":"项目指令＝“如何行动”（角色、语气、格式、边界、升级规则）；项目知识库＝“参考什么”（手册、FAQ、规程）。把手册正文全部塞进指令栏难维护，也混淆了行为与资料；把规则藏在知识文件里不一定被一致遵守；两者都不设置就失去了 Project 的意义。","ej":"指示＝振る舞い／ナレッジ＝参照資料"},{"id":"d5-002","d":5,"t":"5.1","n":1,"q":"営業チームのProjectに、製品カタログの旧版と新版の両方がナレッジとして入っており、Claudeが旧価格を回答することがある。最も適切な対処はどれか。","qz":"营业团队的 Project 知识库里同时放着新旧两版产品目录，Claude 有时会回答旧价格。最合适的处理是哪一个？","o":[{"j":"新旧の両方を残したまま、さらに改定予定の版も追加しておき、どの価格が正しいかはClaudeに毎回判断させる","z":"新旧两版都保留，再追加预定修订的版本，每次让 Claude 判断哪个价格正确"},{"j":"チャットのたびに「新しい方を使って」と伝える","z":"每次对话都说“请用新的那一版”"},{"j":"旧版を削除して新版のみを残し、必要なら指示に「価格は最新版カタログに基づく」と明記する","z":"删除旧版只保留新版，必要时在指令中写明“价格以最新版目录为准”"},{"j":"Projectを使うのをやめる","z":"停止使用 Project"}],"a":[2],"e":"知识库里新旧资料并存会造成矛盾回答。根本对策是维护知识库：删除或归档过期资料，只保留权威版本，并在指令中写明优先规则。每次对话口头提醒治标不治本且易漏；继续追加版本只会让矛盾更多；停止使用 Project 是过度反应。","ej":"古い資料は削除・差し替え。ナレッジは常に最新の正本を"},{"id":"d5-007","d":5,"t":"5.1","n":1,"q":"Projectナレッジに大量のファイルを追加したところ、Claudeがプロジェクトナレッジを検索して関連部分を参照する動作に変わった。この動作の説明として最も適切なものはどれか。","qz":"向 Project 知识库添加大量文件后，Claude 改为检索项目知识库并参照相关部分。关于这一行为，最合适的说明是哪一个？","o":[{"j":"エラーであり、ファイルを減らさない限り回答できない","z":"这是错误，除非减少文件否则无法回答"},{"j":"ナレッジがインターネットに公開されたことを意味する","z":"这意味着知识库被公开到了互联网"},{"j":"ナレッジが大きくなると検索（RAG）で関連部分を取り出す方式になり、扱える容量が拡大する","z":"知识库变大后会改用检索（RAG）方式取出相关部分，可处理的容量随之扩大"},{"j":"全ファイルが常に完全に読み込まれていることを意味するため、ファイルを追加するほど回答の精度は必ず上がる","z":"意味着所有文件始终被完整读入，所以文件加得越多，回答精度就一定越高"}],"a":[2],"e":"Project 知识库较小时可以全部放进上下文；变大时会自动切换为“项目知识检索”（RAG），只取出相关部分，从而扩大容量。这不是错误；也不是“所有文件始终被完整读入”，正好相反；与公开到互联网无关。实务上，文件命名清晰、内容结构化有助于检索命中。","ej":"ナレッジ大 → 自動でRAG（検索）に切替、容量拡大"},{"id":"d5-013","d":5,"t":"5.1","n":1,"q":"プロジェクトナレッジに関する説明として最も適切なものはどれか。","qz":"关于项目知识库，最合适的说明是哪一个？","o":[{"j":"一度アップロードすると、内容の更新や削除はできない","z":"一旦上传，内容就不能更新或删除"},{"j":"Projectにアップロードした資料は、どのプランでもClaudeの学習データとして自動的に使われるため注意が必要である","z":"上传到 Project 的资料在任何方案中都会自动用作 Claude 的训练数据，所以需要注意"},{"j":"全てのProjectで自動的に共有される","z":"在所有 Project 中自动共享"},{"j":"そのProject内のチャットで共通して参照される資料であり、追加・差し替え・削除して維持管理する","z":"是该 Project 内所有对话共同参照的资料，需要通过添加、替换、删除来维护"}],"a":[3],"e":"项目知识库属于该 Project，项目内的各个对话都会参照它；可以随时添加、替换、删除，需要持续维护。“上传后不能更新”错误；它不会在所有 Project 间自动共享；商用方案默认不用于训练，个人方案取决于用户设置，并非“自动用于训练”。","ej":"ナレッジ＝そのProject内で共通参照、追加・差替・削除で維持"},{"id":"d5-017","d":5,"t":"5.1","n":1,"q":"1つのProjectに「採用」「経費精算」「IT問い合わせ」の資料と指示を全て詰め込んでいたところ、回答の混同が増えた。最も適切な改善はどれか。","qz":"在一个 Project 里塞进了“招聘”“费用报销”“IT 咨询”的全部资料和指令，结果回答混淆增多。最合适的改进是哪一个？","o":[{"j":"さらに多くの資料を追加して網羅性を上げる","z":"再添加更多资料以提高覆盖面"},{"j":"指示を全て削除する","z":"删除所有指令"},{"j":"毎回のチャットで「今回は経費の話です。採用やITの資料は無視してください」と長く説明してから質問する","z":"每次对话都先长篇说明“这次讲的是报销，请忽略招聘和 IT 资料”，然后再提问"},{"j":"目的ごとにProjectを分け、それぞれに専用の指示とナレッジを設定する","z":"按目的拆分 Project，分别设置专用的指令和知识库"}],"a":[3],"e":"一个 Project 对应一个明确目的，指令和知识更聚焦，检索更准确，维护责任也更清楚。继续添加资料会加剧混淆；删除所有指令会失去行为规范；每次在对话里长篇说明治标不治本。","ej":"1 Project＝1目的。混同したら分割"},{"id":"d5-022","d":5,"t":"5.1","n":1,"q":"新しくProjectを立ち上げる際の進め方として最も適切なものはどれか。","qz":"新建 Project 时，最合适的推进方式是哪一个？","o":[{"j":"手元にある関連しそうな全ファイルを一度にアップロードし、指示は運用しながら後で考える","z":"把手头可能相关的全部文件一次性上传，指令在运营过程中以后再考虑"},{"j":"他部署のProject指示をそのままコピーする","z":"原样复制其他部门的 Project 指令"},{"j":"目的・利用者・期待する出力を定義し、必要最小限の資料と指示で始めて、試しながら改善する","z":"定义目的、用户和期望输出，以必要最少的资料和指令开始，边试边改进"},{"j":"完璧な指示ができるまで利用を開始しない","z":"在写出完美指令之前不开始使用"}],"a":[2],"e":"先明确目的、用户和期望输出，从最小可用配置开始，通过实际使用迭代改进。一次性上传手头所有文件，无关资料多且行为未定义；照搬其他部门的指令，目的不同；等写出完美指令再开始，会拖延价值实现，指令本来就需要迭代。","ej":"目的定義→最小構成で開始→試しながら改善"},{"id":"d5-025","d":5,"t":"5.1","n":1,"q":"Projectを使うことで得られる効果として、最も適切でないものはどれか。","qz":"关于使用 Project 带来的效果，最不合适的是哪一个？","o":[{"j":"毎回同じ前提や資料を説明する手間が減る","z":"减少每次说明相同前提和资料的麻烦"},{"j":"チームで同じ設定を共有することで、メンバー間で一貫した出力を得やすくなる","z":"团队共享同一套设置，成员之间更容易得到一致的输出"},{"j":"関連するチャットを1か所にまとめて管理できる","z":"可以把相关对话集中在一处管理"},{"j":"ナレッジに入れた資料の内容が事実として正しいことが保証される","z":"保证放入知识库的资料内容在事实上是正确的"}],"a":[3],"e":"Project 能减少重复说明、集中管理对话、帮助团队输出一致。但它不能保证知识库资料本身正确——资料错了回答也会错，Claude 也可能误读资料，所以仍需要维护和验证。","ej":"Projectは資料の正しさまでは保証しない"},{"id":"d5-031","d":5,"t":"5.1","n":1,"q":"採用面接の質問案を作るProjectを立ち上げる。Projectナレッジに入れる資料として最も適切なものはどれか。","qz":"要建立一个制作招聘面试问题方案的 Project。最适合放进 Project 知识库的资料是哪一个？","o":[{"j":"過去の応募者の氏名・連絡先・評価コメントを含む面接記録の原本","z":"包含过去应聘者姓名、联系方式、评价意见的面试记录原件"},{"j":"インターネットで見つけた出典不明の面接テクニック記事を大量に","z":"大量从网上找到的、出处不明的面试技巧文章"},{"j":"採用担当者の個人的な日記","z":"招聘负责人的个人日记"},{"j":"職務記述書、求める人物像、社内の面接ガイドライン","z":"职位说明书、理想人才画像、公司内部面试指南"}],"a":[3],"e":"知识库应放与目的直接相关、权威、允许上传的资料：职位说明书、人才画像、公司面试指南。含应聘者个人信息的原件不应直接上传（应按政策去标识化或不用）；个人日记与任务无关；出处不明的大量文章会降低回答质量和一致性。","ej":"目的に直結する正式資料を入れる"},{"id":"d5-032","d":5,"t":"5.1","n":1,"q":"Projectの指示とナレッジを設定したあと、最初に行うべきこととして最も適切なものはどれか。","qz":"设置好 Project 的指令和知识后，最应该首先做的是什么？","o":[{"j":"すぐに全社員に公開し、使いながら問題が報告されたら、そのときに指示やナレッジを考え直す","z":"马上公开给全体员工，使用中有人报告问题时再重新考虑指令和知识"},{"j":"ナレッジのファイル名をすべてランダムな記号に変える","z":"把知识库文件名全部改成随机符号"},{"j":"設定は完璧なはずなので、テストせずに運用を始める","z":"设置应该已经完美了，不测试就开始运营"},{"j":"想定される代表的な質問で試し、回答が指示とナレッジに沿っているかを確認する","z":"用设想的代表性问题测试，确认回答是否符合指令和知识"}],"a":[3],"e":"先用代表性问题测试，确认 Claude 是否按指令行动、是否正确参照知识库，再逐步开放给用户。不测试直接全员公开风险大；“设置一定完美”是不切实际的假设；随机文件名会让检索和维护都更困难。","ej":"設定後は代表的な質問でテスト"},{"id":"d5-033","d":5,"t":"5.1","n":1,"q":"Teamプランで、部署共有のProjectを作成した。共有設定として最も適切なものはどれか。","qz":"在 Team 方案中建立了部门共享的 Project。最合适的共享设置是哪一个？","o":[{"j":"Projectの内容を外部の取引先にも自動的に公開する","z":"把 Project 的内容也自动公开给外部合作方"},{"j":"誰でも編集できるように全社員に編集権限を与える","z":"给全体员工编辑权限，让任何人都能编辑"},{"j":"共有せず、各自が同じProjectを個別に作り直す","z":"不共享，每个人各自重新做同一个 Project"},{"j":"利用するメンバーには閲覧・利用権限を与え、指示やナレッジを編集できるのは管理担当者に限定する","z":"给使用的成员查看和使用权限，能编辑指令和知识的仅限管理负责人"}],"a":[3],"e":"按角色设置权限：使用者可用，编辑权限限于负责人，这样设置的质量和一致性才有保障，也便于变更管理。全员可编辑容易出现未经管理的修改；各自重建会导致设置不一致；自动公开给外部合作方有信息泄露风险。","ej":"利用者と編集者で権限を分ける"},{"id":"d5-034","d":5,"t":"5.1","n":2,"q":"Projectの指示（カスタム指示）に書く内容として適切なものを2つ選べ。","qz":"以下哪些适合写进 Project 指令（自定义指令）？请选择 2 项。","o":[{"j":"社員の個人的な連絡先一覧","z":"员工个人联系方式一览"},{"j":"ナレッジに答えがない場合の対応（推測せず担当窓口を案内する等）","z":"知识库中没有答案时的处理方式（不猜测、引导至负责窗口等）"},{"j":"参考資料の全文（300ページの規程集をそのまま貼り付ける）","z":"参考资料全文（把 300 页的规程集原样粘贴进去）"},{"j":"毎回変わる、今日だけの個別の依頼内容","z":"每次都会变的、只针对今天的个别请求内容"},{"j":"このProjectで期待する役割、読み手、出力の形式","z":"这个 Project 中期望的角色、读者、输出格式"}],"a":[1,4],"e":"指令写“如何行动”：角色、读者、格式、不知道时如何处理。大篇幅的参考资料应放进知识库而不是指令；只针对当次的请求写在对话里；员工个人联系方式这类个人信息不应写进指令。","ej":"指示＝役割・形式・不明時の扱い／資料＝ナレッジ"},{"id":"d5-035","d":5,"t":"5.1","n":1,"q":"同じ部署で「議事録要約」と「顧客向け提案書作成」の2つの用途にClaudeを使いたい。Projectの構成として最も適切なものはどれか。","qz":"同一个部门想把 Claude 用于“会议记录摘要”和“面向客户的提案书制作”两个用途。最合适的 Project 构成是哪一个？","o":[{"j":"用途ごとに別のProjectを作り、それぞれに専用の指示とナレッジを設定する","z":"按用途分别建立 Project，各自设置专用的指令和知识"},{"j":"1つのProjectにまとめ、指示には両方の用途のルールを混ぜて書く。資料が1か所にある方が管理しやすいためである","z":"合并到一个 Project 里，在指令中混合写两种用途的规则。因为资料放在一处更便于管理"},{"j":"Projectは使わず、毎回通常のチャットで前提をすべて説明する","z":"不使用 Project，每次在普通对话中说明全部前提"},{"j":"2つの用途の資料をすべてメモリに覚えさせる","z":"让记忆记住两个用途的全部资料"}],"a":[0],"e":"一个 Project 对应一个明确用途：指令更聚焦，检索更准确，维护也更清晰。混在一起，两种规则容易互相干扰；每次在普通对话中说明效率低；记忆不是管理用途资料的合适方式。","ej":"1つのProject＝1つの目的"},{"id":"d5-036","d":5,"t":"5.1","n":1,"q":"Projectナレッジの資料を、Claudeがより正確に参照できるようにする工夫として最も適切なものはどれか。","qz":"为了让 Claude 更准确地参照 Project 知识库的资料，最合适的做法是哪一个？","o":[{"j":"内容がわかるファイル名を付け、見出しや章立てで構造化し、古い版は削除する","z":"起能看出内容的文件名，用标题和章节结构化，删除旧版本"},{"j":"すべての資料を1つの巨大なファイルに結合し、見出しを削除して、Claudeが一度に全体を読めるようにする","z":"把所有资料合并成一个巨大文件并删除标题，让 Claude 能一次读完全部内容"},{"j":"ファイル名を「資料1」「資料2」などの連番だけにする","z":"文件名只用“资料1”“资料2”这样的序号"},{"j":"同じ資料を複数回アップロードして重要度を上げる","z":"把同一份资料多次上传以提高重要程度"}],"a":[0],"e":"清晰的文件名、结构化的标题章节、只保留最新版，能让检索（RAG）更容易找到正确的部分。合并成巨大文件并删标题会让定位更难；只用序号难以判断内容；重复上传会产生重复和矛盾，不会提高“重要度”。","ej":"わかる名前・構造化・旧版削除"},{"id":"d5-037","d":5,"t":"5.1","n":1,"q":"Projectの指示に「添付の規程に基づいて回答する」と書いたが、利用者が規程にない話題を質問した場合の動作が安定しない。最も適切な改善はどれか。","qz":"在 Project 指令里写了“根据附件规程回答”，但用户问到规程中没有的话题时，表现不稳定。最合适的改进是哪一个？","o":[{"j":"「規程に記載がない場合は、その旨を伝え、人事部の問い合わせ窓口を案内する」と範囲外の対応を明記する","z":"明确写出范围外的处理：“规程中没有记载时，说明这一点，并引导至人事部咨询窗口”"},{"j":"規程にない質問をした利用者を、Projectから外す","z":"把问了规程以外问题的用户移出 Project"},{"j":"「どんな質問にも必ず答えること」と指示する","z":"指示“无论什么问题都必须回答”"},{"j":"指示をすべて削除し、Claudeの自由な判断に任せる","z":"删除所有指令，交给 Claude 自由判断"}],"a":[0],"e":"指令应包含“范围外/不知道时怎么做”，这样回答会更稳定，也能减少幻觉。把用户移出 Project 没有解决问题；“必须回答所有问题”会诱发编造；删除指令会让行为更不稳定。","ej":"範囲外の質問への対応を指示に明記"},{"id":"d5-038","d":5,"t":"5.1","n":1,"q":"Projectを使う効果として最も適切なものはどれか。","qz":"使用 Project 的效果，最合适的是哪一个？","o":[{"j":"Projectに入れた資料は自動的に最新の内容に更新される","z":"放进 Project 的资料会自动更新为最新内容"},{"j":"Projectを使えば、出力を人が確認する必要がなくなる","z":"使用 Project 后，就不需要人工确认输出"},{"j":"関連する会話・指示・資料を1か所にまとめ、毎回同じ前提を説明する手間を減らせる","z":"把相关对话、指令、资料集中在一处，减少每次说明相同前提的麻烦"},{"j":"Projectに入れた情報は、組織外の取引先も含めて誰とでも自動で共有されるので、連絡の手間が減る","z":"放进 Project 的信息会自动与包括组织外合作方在内的任何人共享，减少联络工夫"}],"a":[2],"e":"Project 的价值是集中管理、减少重复说明、让团队保持一致。资料不会自动更新，需要人维护；人工确认仍然必要；Project 不会自动与组织外共享。","ej":"Project＝まとめて管理し前提の説明を省く"},{"id":"d5-039","d":5,"t":"5.1","n":1,"q":"新しいProjectの指示を書く前に整理しておくべきこととして最も適切なものはどれか。","qz":"在编写新 Project 指令之前，最应该整理好的是什么？","o":[{"j":"Projectの名前をできるだけ長くする方法","z":"尽可能让 Project 名称更长的方法"},{"j":"誰が使い、何のために、どんな出力が欲しいのか","z":"谁来用、为了什么、想要什么样的输出"},{"j":"社内で最も人気のある他部署のProject名","z":"公司内最受欢迎的其他部门的 Project 名称"},{"j":"Claudeの内部の仕組みの詳細","z":"Claude 内部机制的细节"}],"a":[1],"e":"指令的基础是目的、使用者、期望输出。明确了这些，才能写出角色、读者、格式、边界等具体指令。名称长短无关紧要；照搬其他部门的名字没有意义；Claude 内部机制的细节不是写指令的前提。","ej":"まず目的・利用者・期待する出力を決める"},{"id":"d5-040","d":5,"t":"5.1","n":1,"q":"ある担当者が、Projectナレッジにアップロードした資料の内容をClaudeが一部誤って要約していることに気づいた。最も適切な対応はどれか。","qz":"某负责人发现 Claude 对上传到 Project 知识库的资料做了部分错误的摘要。最合适的应对是哪一个？","o":[{"j":"Projectに入れた資料は正しく読まれるはずなので、要約の誤りは無視する","z":"放进 Project 的资料应该会被正确读取，所以忽略摘要的错误"},{"j":"Projectの利用をただちに全面禁止する","z":"立即全面禁止使用 Project"},{"j":"該当部分の原文を引用させて確認し、必要に応じて資料の構成や指示を改善する。重要な用途では人が原文と照合する","z":"让它引用相关原文进行确认，必要时改善资料结构或指令。重要用途由人对照原文"},{"j":"同じ資料をさらに5回アップロードする","z":"把同一份资料再上传 5 次"}],"a":[2],"e":"即使资料在知识库中，Claude 也可能误读或遗漏。要求引用原文便于核对；资料结构不清或指令不明确时加以改进；重要用途人工对照原文。忽略错误是放任风险；全面禁止是过度反应；重复上传会造成重复，不能提高准确性。","ej":"ナレッジがあっても引用で確認・構成を改善"},{"id":"d5-041","d":5,"t":"5.1","n":1,"q":"Projectナレッジの容量が大きくなり、検索（RAG）による参照に切り替わった。この状態での運用として最も適切なものはどれか。","qz":"Project 知识库容量变大，切换成了用检索（RAG）参照的方式。在这种状态下，最合适的运营方式是哪一个？","o":[{"j":"RAGはエラーなので、すぐにすべての資料を削除する","z":"RAG 是错误，所以马上删除所有资料"},{"j":"検索に切り替わった後も、すべての資料が常に完全に読み込まれているので、質問の仕方や根拠を気にする必要はない","z":"切换到检索后，所有资料仍然始终被完整读取，所以不必在意提问方式和依据"},{"j":"質問を具体的にし、必要に応じて参照すべき資料名を示す。回答の根拠となった箇所も確認する","z":"把问题提得更具体，必要时指明应参照的资料名称，并确认回答所依据的部分"},{"j":"質問はできるだけ曖昧にして、Claudeに幅広く探させる","z":"问题尽量模糊，让 Claude 广泛查找"}],"a":[2],"e":"检索方式是取出相关部分来回答，所以具体的问题和明确的资料名有助于命中正确内容，同时要确认回答依据。检索方式不是“所有资料都完整读入”；它也不是错误；模糊的问题会降低检索精度。","ej":"RAG時は具体的な質問と根拠の確認"},{"id":"d5-070","d":5,"t":"5.1","n":1,"q":"Projectの指示に、会社の沿革や全商品の詳細説明など大量の背景情報を書き込んだところ、肝心の回答ルールが守られにくくなった。最も適切な改善はどれか。","qz":"在 Project 指令中写入了公司沿革、全部商品详细说明等大量背景信息，结果关键的回答规则变得不容易被遵守。最合适的改进是哪一个？","o":[{"j":"背景資料はナレッジに移し、指示は役割・回答ルール・形式など行動の指定に絞る","z":"把背景资料移到知识库，指令只保留角色、回答规则、格式等行为方面的规定"},{"j":"回答ルールを指示の中に何度も繰り返して書く","z":"在指令中反复多次写回答规则"},{"j":"背景情報をさらに増やして、Claudeが会社と商品をより深く理解できるようにする","z":"进一步增加背景信息，让 Claude 更深入地理解公司和商品"},{"j":"回答ルールを削除して、背景情報だけを残す","z":"删除回答规则，只保留背景信息"}],"a":[0],"e":"指令写“如何行动”，资料放知识库。把大量背景塞进指令，关键规则会被淹没。反复重复规则治标不治本；继续增加背景会更糟；删除规则会失去行为规范。","ej":"指示は行動の指定に絞り、資料はナレッジへ"},{"id":"d5-004","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタを有効にしたい担当者がいる。組織はEnterpriseプランを利用している。最初に確認すべきこととして最も適切なものはどれか。","qz":"有员工想启用 Google Drive 连接器。组织使用的是 Enterprise 方案。首先应确认的事项中，最合适的是哪一个？","o":[{"j":"個人のGoogleアカウントで接続すれば、組織の管理者の許可は不要であり、社内ポリシーの確認も省略できる","z":"用个人 Google 账号连接的话，就不需要组织管理员的许可，也可以省略确认公司政策"},{"j":"コネクタは誰でも自由に追加できるので、確認は不要である","z":"连接器谁都可以自由添加，不需要确认"},{"j":"Driveの全ファイルを公開設定にしておく","z":"把 Drive 中所有文件设为公开"},{"j":"組織の管理者がコネクタを有効化しているか、また社内ポリシー上の利用条件を確認する","z":"确认组织管理员是否已启用该连接器，以及公司政策上的使用条件"}],"a":[3],"e":"在 Team/Enterprise 中，Google Workspace 等连接器需要管理员先在组织层面启用，同时要符合公司数据政策。用个人账号绕过管理有违规风险；“谁都能自由添加”错误；把 Drive 文件设为公开会造成严重泄露风险，与连接器无关。","ej":"Team/Enterpriseのコネクタ → 管理者の有効化＋社内ポリシー確認"},{"id":"d5-005","d":5,"t":"5.2","n":1,"q":"Gmailコネクタを使ってClaudeにできることの説明として最も適切なものはどれか。","qz":"关于使用 Gmail 连接器时 Claude 能做的事情，最合适的说明是哪一个？","o":[{"j":"Gmailのパスワードを変更できる","z":"可以修改 Gmail 密码"},{"j":"利用者の承認なしに、全社員へ自動でメールを一斉送信できる","z":"无需用户批准，自动向全体员工群发邮件"},{"j":"他人のメールボックスを自由に閲覧できる","z":"可以自由浏览他人的邮箱"},{"j":"メールを検索・読み取りし、返信の下書きを作成できる","z":"可以搜索、读取邮件，并起草回复"}],"a":[3],"e":"Gmail 连接器可以在用户授权范围内搜索、阅读邮件并创建草稿，发送前由人确认。未经批准自动群发不是连接器的工作方式；修改密码、浏览他人邮箱都超出授权范围，Claude 只能访问被授予权限的内容。","ej":"Gmail＝検索・読み取り・下書き作成（権限の範囲内）"},{"id":"d5-006","d":5,"t":"5.2","n":1,"q":"コネクタの権限設定についての考え方として最も適切なものはどれか。","qz":"关于连接器权限设置的思路，最合适的是哪一个？","o":[{"j":"権限は設定後に見直す必要はない","z":"权限设定后不需要重新检查"},{"j":"業務に必要な範囲に限定した最小権限で接続し、不要になったら接続を解除する","z":"以限定在业务所需范围的最小权限连接，不再需要时解除连接"},{"j":"将来使うかもしれないので、Driveやメールなど全てのデータにアクセスできる権限で接続し、そのまま維持しておく","z":"将来可能会用，所以用能访问 Drive、邮件等所有数据的权限连接，并一直保持"},{"j":"他部署のアカウントを借りて接続する","z":"借用其他部门的账号进行连接"}],"a":[1],"e":"最小权限原则：只授予完成任务所需的访问范围，定期检查，不需要时断开。“将来可能用到所以全开”扩大泄露面；“设定后无需复查”不对，权限需要持续维护；借用其他部门账号违反身份管理和审计要求。","ej":"コネクタは最小権限。不要になれば解除"},{"id":"d5-010","d":5,"t":"5.2","n":2,"q":"Projectナレッジにアップロードするファイルの扱いとして適切なものを2つ選べ。","qz":"关于上传到 Project 知识库的文件处理，请选出 2 个合适的做法。","o":[{"j":"同じ内容のファイルを複数の版で重複して入れる","z":"把内容相同的文件以多个版本重复放入"},{"j":"機密区分を確認し、組織ポリシー上アップロード可能なものだけを入れる","z":"确认机密等级，只放入组织政策允许上传的资料"},{"j":"顧客の個人情報を含む原本をそのまま入れる","z":"把含有客户个人信息的原件直接放入"},{"j":"念のため個人のメモや無関係な資料もまとめて入れる","z":"以防万一，把个人笔记和无关资料也一起放进去"},{"j":"内容が分かるファイル名を付け、版や日付を明記する","z":"使用能看出内容的文件名，并注明版本和日期"}],"a":[1,4],"e":"正确的两项：使用能看出内容的文件名并注明版本和日期，有助于检索和维护；上传前确认机密等级，只放入政策允许的资料。错误：个人笔记和无关资料会干扰回答；同一内容多版本重复放入会造成矛盾；含客户个人信息的原件应按政策去标识化或不上传。","ej":"分かる名前＋版／機密区分を確認して入れる"},{"id":"d5-014","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタ経由でDrive上の資料を参照させる利点として最も適切なものはどれか。","qz":"通过 Google Drive 连接器让 Claude 参照 Drive 上资料的优点，最合适的是哪一个？","o":[{"j":"資料の内容が必ず正しいことが保証される","z":"保证资料内容一定正确"},{"j":"Drive上の最新の資料を、ダウンロード・再アップロードせずに検索・参照でき、出典も示せる","z":"无需下载再上传，就能检索、参照 Drive 上的最新资料，并能标示出处"},{"j":"Drive上の全社員のファイルに、自分の権限に関係なくアクセスでき、部署をまたいだ資料もまとめて検索できる","z":"无论自己权限如何，都能访问 Drive 上所有员工的文件，跨部门资料也能一起搜索"},{"j":"組織の承認が不要になる","z":"不再需要组织批准"}],"a":[1],"e":"连接器的价值是直接访问源头的最新资料、省去下载再上传、回答可标注来源。它只能访问用户有权限的文件，不能越权；连接也不保证资料内容正确；组织的批准和政策仍然适用。","ej":"コネクタ＝最新の元資料を直接参照・出典表示"},{"id":"d5-018","d":5,"t":"5.2","n":1,"q":"Claudeがコネクタを通じて利用者の代わりに操作（例：カレンダー予定の作成）を行う場合の考え方として最も適切なものはどれか。","qz":"当 Claude 通过连接器代表用户执行操作（例如创建日历日程）时，最合适的思路是哪一个？","o":[{"j":"操作内容を確認・承認してから実行させ、結果も確認する","z":"在确认并批准操作内容后再执行，并检查结果"},{"j":"一度許可すれば、内容を確認する必要は一切ない","z":"只要授权一次，就完全不需要确认内容"},{"j":"操作の結果は外部サービス側の責任なので、承認した後の結果を利用者が確認する必要はない","z":"操作结果是外部服务方的责任，所以批准后用户不必确认结果"},{"j":"他人の名前で操作させてもよい","z":"可以让它以他人的名义操作"}],"a":[0],"e":"代表用户执行的操作，用户仍然负有责任：执行前确认与批准，执行后检查结果，这是人类监督的基本要求。“授权一次就不用再确认”“结果是外部服务的责任”都是放弃监督；以他人名义操作属于冒用身份，违反规定。","ej":"代行操作は確認・承認してから実行、結果も確認"},{"id":"d5-021","d":5,"t":"5.2","n":2,"q":"コネクタやアップロード資料を管理するうえで適切なものを2つ選べ。","qz":"在管理连接器和上传资料时，请选出 2 个合适的做法。","o":[{"j":"接続した外部サービスのデータは常に最新かつ正確である","z":"已连接外部服务的数据总是最新且准确的"},{"j":"使っていないコネクタは定期的に棚卸しして接続を解除する","z":"定期盘点未使用的连接器并解除连接"},{"j":"コネクタが接続されていれば、どの資料でも参照してよい","z":"只要连接器已连接，任何资料都可以参照"},{"j":"コネクタ経由で取得した情報も、重要な判断に使う前に元資料で確認する","z":"通过连接器获取的信息，在用于重要判断前也要对照原资料确认"},{"j":"アップロード資料の機密区分は確認しなくてよい","z":"不需要确认上传资料的机密等级"}],"a":[1,3],"e":"正确的两项：定期盘点未使用的连接器并断开，缩小风险面；通过连接器获取的信息在用于重要判断前也要对照原资料核实，Claude 的摘要也可能出错。错误：“连上了任何资料都能参照”，仍要遵守权限与政策；不确认上传资料的机密等级是违规风险；外部数据源本身也可能过期或有错。","ej":"コネクタは棚卸し／取得情報も元資料で確認"},{"id":"d5-028","d":5,"t":"5.2","n":1,"q":"ある担当者が、他部署の機密フォルダも含むDrive全体をClaudeから検索できるようにしたいと考えている。自分にはそのフォルダの閲覧権限がない。最も適切な判断はどれか。","qz":"某员工想让 Claude 能检索整个 Drive，包括其他部门的机密文件夹。他本人没有该文件夹的浏览权限。最合适的判断是哪一个？","o":[{"j":"コネクタは利用者の権限の範囲でしかアクセスできない。必要なら正規の手続きで権限を申請する","z":"连接器只能在用户权限范围内访问。如有需要，通过正式流程申请权限"},{"j":"Claude経由なら自分に閲覧権限がないフォルダでも参照できるので、そのまま接続して検索対象に含める","z":"通过 Claude 的话，即使自己没有查看权限的文件夹也能参照，所以直接连接并纳入搜索范围"},{"j":"他部署の同僚のアカウントで接続してもらう","z":"请其他部门的同事用他的账号连接"},{"j":"機密フォルダの共有設定を勝手に変更する","z":"擅自修改机密文件夹的共享设置"}],"a":[0],"e":"连接器继承用户自身的访问权限，不能越权。确有业务需要时，走正式的权限申请流程。“通过 Claude 没权限也能看”前提错误；借同事账号连接违规；擅自修改机密文件夹的共享设置是严重违规。","ej":"コネクタは本人の権限内のみ。必要なら正規申請"},{"id":"d5-042","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタを使う際、Claudeが参照できる範囲についての説明として最も適切なものはどれか。","qz":"使用 Google Drive 连接器时，关于 Claude 可参照的范围，最合适的说明是哪一个？","o":[{"j":"接続した利用者自身がアクセス権を持つファイルの範囲で参照できる","z":"在连接的用户本人有访问权限的文件范围内参照"},{"j":"組織のDrive上のすべてのファイルを、権限に関係なく参照できる","z":"无论权限如何，都能参照组织 Drive 上的所有文件"},{"j":"インターネット上に公開されたファイルだけを参照できる","z":"只能参照公开到互联网上的文件"},{"j":"管理者のファイルだけを参照できる","z":"只能参照管理员的文件"}],"a":[0],"e":"连接器继承连接用户本人的权限，只能访问该用户有权限的文件，不能越权。它不是“无视权限看全部”，也不限于公开文件或管理员的文件。","ej":"コネクタは利用者の権限の範囲内"},{"id":"d5-043","d":5,"t":"5.2","n":1,"q":"Gmailコネクタで顧客への返信をClaudeに作らせた。最も適切な運用はどれか。","qz":"用 Gmail 连接器让 Claude 制作给客户的回复。最合适的运营方式是哪一个？","o":[{"j":"Claudeに全顧客への一斉送信を自動で行わせ、内容は確認しない","z":"让 Claude 自动给全部客户群发，不确认内容"},{"j":"Claudeが作成した下書きを人が確認・修正し、自分で送信する","z":"由人确认、修改 Claude 制作的草稿，然后自己发送"},{"j":"下書きの内容は確認せず、件名だけ確認して送信する","z":"不确认草稿内容，只确认标题就发送"},{"j":"顧客のメールアドレスを社外のツールにすべて書き出して管理する","z":"把客户邮箱地址全部导出到公司外部工具管理"}],"a":[1],"e":"Gmail 连接器可以搜索、阅读邮件并创建草稿；对外发送前由人确认内容、负责发送，这是人类监督的基本做法。不确认就群发、只看标题就发都有出错和信息泄露风险；把客户地址导出到外部工具违反数据管理原则。","ej":"下書きは人が確認して送信"},{"id":"d5-044","d":5,"t":"5.2","n":2,"q":"Projectナレッジへのアップロード前に確認すべきことを2つ選べ。","qz":"上传到 Project 知识库之前，应确认的是哪些？请选择 2 项。","o":[{"j":"ファイルの色やフォントが好みかどうか","z":"文件的颜色和字体是否符合喜好"},{"j":"その資料が最新の正式版であるか","z":"该资料是否为最新正式版"},{"j":"ファイルのサイズが大きいほど回答の質が上がるかどうか","z":"文件越大回答质量是否越高"},{"j":"同じ資料をできるだけ多くの版で入れたかどうか","z":"是否把同一资料尽可能多的版本都放进去了"},{"j":"組織のポリシー上、その資料をアップロードしてよい機密区分か","z":"按组织政策，该资料的机密等级是否允许上传"}],"a":[1,4],"e":"上传前最重要的两点：是否符合组织的数据政策（机密等级），以及是否为最新正式版。文件大小不等于质量；颜色字体无关；多版本并存反而会造成矛盾回答。","ej":"アップロード前＝機密区分と最新版を確認"},{"id":"d5-045","d":5,"t":"5.2","n":1,"q":"コネクタで接続した社内資料をもとに、Claudeが「来月から手当の支給額が変わる」と回答した。最も適切な対応はどれか。","qz":"Claude 根据通过连接器连接的公司资料，回答“下个月起津贴金额会改变”。最合适的应对是哪一个？","o":[{"j":"コネクタ経由の情報なので、確認せずに全社員へ通知する","z":"因为是通过连接器获取的信息，所以不确认就通知全体员工"},{"j":"回答の出典となった資料を開き、正式な最新版の記載と一致するかを確認してから対応する","z":"打开作为回答出处的资料，确认与正式最新版的记载一致后再处理"},{"j":"Claudeの回答はいつも間違っているので、無視する","z":"Claude 的回答总是错的，所以忽略"},{"j":"同じ質問を何度か繰り返し、同じ答えが3回続けて出たら事実とみなして、全社員に通知する","z":"把同一问题重复问几次，连续 3 次得到相同答案就视为事实，并通知全体员工"}],"a":[1],"e":"连接器能让 Claude 参照源头资料，但 Claude 的解读和摘要仍可能出错，资料本身也可能是旧版。涉及影响全员的重要信息，应打开出处确认后再处理。直接通知风险大；一律无视会丢掉有用信息；重复回答一致也不能证明正确。","ej":"コネクタ経由でも出典を確認"},{"id":"d5-046","d":5,"t":"5.2","n":1,"q":"ある社員が、業務効率化のために個人で使っている外部サービスを、会社の承認なしにClaudeへ接続しようとしている。最も適切な対応はどれか。","qz":"某员工为提高工作效率，想在未经公司批准的情况下，把个人使用的外部服务连接到 Claude。最合适的应对是哪一个？","o":[{"j":"効率化につながるので、承認なしで接続してよい","z":"有助于提高效率，所以不经批准也可以连接"},{"j":"効率化につながるので、同僚にも同じ接続方法を広めて、部署全体で使えるようにする","z":"有助于提高效率，所以把同样的连接方法推广给同事，让整个部门都能使用"},{"j":"組織のAIポリシーと承認手続きを確認し、必要に応じて管理者に申請する","z":"确认组织的 AI 政策和审批流程，必要时向管理员申请"},{"j":"接続したことが分からないよう、履歴を削除する","z":"为了不让人知道已连接，删除历史记录"}],"a":[2],"e":"连接外部服务涉及数据流向和权限，必须遵守组织的 AI 政策和审批流程。未经批准连接属于“影子 AI”；推广给同事会扩大风险；删除历史掩盖行为违反治理和诚信原则。","ej":"外部サービス接続は組織の承認手続きに従う"},{"id":"d5-047","d":5,"t":"5.2","n":1,"q":"プロジェクトで使っていた外部コネクタが、業務の終了によって不要になった。最も適切な対応はどれか。","qz":"项目中使用的外部连接器因业务结束而不再需要。最合适的应对是哪一个？","o":[{"j":"いつか同じような業務で使うかもしれないので、接続も権限もそのままにしておく","z":"以后可能会在类似业务中使用，所以连接和权限都保持原样"},{"j":"権限をさらに広げておき、次の業務に備える","z":"进一步扩大权限，为下一项业务做准备"},{"j":"接続を解除し、関連するProjectのナレッジや指示も整理する","z":"断开连接，同时整理相关 Project 的知识和指令"},{"j":"他の部署の担当者に接続を譲り渡す","z":"把连接转让给其他部门的负责人"}],"a":[2],"e":"不需要的连接要及时断开，缩小数据访问范围（最小权限），并同步整理相关的知识和指令。保持连接会留下不必要的风险；扩大权限与最小权限原则相反；把连接转让给他人违反身份和权限管理。","ej":"不要なコネクタは解除する"},{"id":"d5-048","d":5,"t":"5.2","n":1,"q":"チャットに直接ファイルをアップロードする場合と、Projectナレッジに入れる場合の使い分けとして最も適切なものはどれか。","qz":"关于直接在对话中上传文件和放进 Project 知识库的区分，最合适的是哪一个？","o":[{"j":"Projectナレッジに入れた資料は、他のProjectでも自動で使われる","z":"放进 Project 知识库的资料，也会在其他 Project 中自动使用"},{"j":"どんな資料もチャットにアップロードする方が、常に正確に参照される","z":"任何资料都上传到对话里，总是能更准确地被参照"},{"j":"その会話でだけ使う資料はチャットに、繰り返し参照する資料はProjectナレッジに入れる","z":"只在该对话中使用的资料放在对话里，需要反复参照的资料放进 Project 知识库"},{"j":"一度チャットに上げた資料は、今後すべての会話で自動的に参照される","z":"一旦上传到对话的资料，今后所有对话都会自动参照"}],"a":[2],"e":"一次性的资料上传到当前对话即可；需要在多个对话中反复参照的资料放进 Project 知识库。对话上传不比知识库更“准确”；知识库不会跨 Project 共享；对话里上传的文件也不会自动用于以后的所有对话。","ej":"一回限り＝チャット／繰り返し＝Projectナレッジ"},{"id":"d5-049","d":5,"t":"5.2","n":1,"q":"ナレッジとして使っている社内マニュアルの中に、すでに廃止された手順が残っていることがわかった。最も適切な対応はどれか。","qz":"发现作为知识使用的公司手册中，还残留着已经废止的流程。最合适的应对是哪一个？","o":[{"j":"Claudeは文脈から廃止された手順を自動で判断して使わないはずなので、資料はそのままにしておく","z":"Claude 应该能从上下文自动判断已废止的流程并不使用，所以资料保持原样"},{"j":"廃止された手順の部分だけを太字にする","z":"只把已废止流程的部分加粗"},{"j":"利用者に「古い手順に注意」と口頭で伝えるだけにする","z":"只口头告诉用户“注意旧流程”"},{"j":"マニュアルの管理者に連絡して正式版を修正してもらい、ナレッジの資料も差し替える","z":"联系手册管理者修改正式版，同时替换知识库中的资料"}],"a":[3],"e":"从源头修正：请资料负责人修改正式版，再替换知识库中的文件，必要时在指令中注明。Claude 无法自动知道哪些流程已废止；口头提醒容易遗漏；加粗并不能告诉 Claude 这些内容已废止。","ej":"資料の誤り＝正式版を直してナレッジを差し替え"},{"id":"d5-050","d":5,"t":"5.2","n":2,"q":"コネクタを安全に使うための考え方として適切なものを2つ選べ。","qz":"以下哪些是安全使用连接器的正确思路？请选择 2 项。","o":[{"j":"便利なので、できるだけ多くのサービスに常時接続しておく","z":"因为方便，尽量多地连接各种服务并保持常时连接"},{"j":"Claudeが行う操作（予定の作成など）は内容を確認してから承認する","z":"Claude 执行的操作（如创建日程）要确认内容后再批准"},{"j":"コネクタ経由の情報は、組織のポリシーを気にせずどこにでも転記してよい","z":"通过连接器获得的信息可以不顾组织政策随意转载到任何地方"},{"j":"業務に必要な範囲だけを接続し、最小権限を保つ","z":"只连接业务需要的范围，保持最小权限"},{"j":"他人のアカウントを借りて接続すれば、権限のない資料も使える","z":"借用他人账号连接，就能使用没有权限的资料"}],"a":[1,3],"e":"最小权限、操作前确认批准，是安全使用连接器的两大原则。尽可能多地常时连接会扩大风险面；通过连接器得到的信息同样受组织政策约束；借用他人账号属于违规。","ej":"最小権限＋操作前の確認・承認"},{"id":"d5-051","d":5,"t":"5.2","n":1,"q":"Projectに顧客との打ち合わせ記録を入れて提案書を作りたい。記録には顧客担当者の個人の携帯電話番号が含まれている。組織のポリシーでは不要な個人情報の入力が制限されている。最も適切な対応はどれか。","qz":"想把与客户的会议记录放进 Project 来制作提案书。记录中包含客户负责人的个人手机号。组织政策限制输入不必要的个人信息。最合适的应对是哪一个？","o":[{"j":"提案書の作成をあきらめる","z":"放弃制作提案书"},{"j":"社内利用なので、そのまま入れてよい","z":"是公司内部使用，所以可以直接放进去"},{"j":"そのまま入れた後で、Claudeに「電話番号は見ないで」と指示しておく","z":"直接放进去之后，指示 Claude“不要看电话号码”"},{"j":"電話番号など提案書作成に不要な個人情報を削除してから入れる","z":"删除电话号码等制作提案书不需要的个人信息后再放进去"}],"a":[3],"e":"按政策先删除或遮蔽不需要的个人信息，再使用资料，这样任务可以继续又不违反政策。“内部使用没问题”不成立；放进去后再口头指示不是政策上的控制手段；放弃任务是不必要的过度反应。","ej":"不要な個人情報は削除してから入れる"},{"id":"d5-071","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタで参照している資料のうち、一部に誤った数値が含まれていることが分かった。最も根本的な対応はどれか。","qz":"通过 Google Drive 连接器参照的资料中，发现部分包含错误的数字。最根本的应对是哪一个？","o":[{"j":"Claudeに「誤った数値は無視して」と毎回伝える","z":"每次告诉 Claude“忽略错误的数字”"},{"j":"元のDrive上の資料を管理者が修正し、修正後の内容でClaudeの回答を確認する","z":"由管理者修改 Drive 上的原始资料，再用修改后的内容确认 Claude 的回答"},{"j":"コネクタを接続したまま、誤りは利用者が気づくのを待つ","z":"保持连接，等用户自己发现错误"},{"j":"正しい数値をメモリに覚えさせれば、元のDrive上の資料は直さなくても回答は正しくなる","z":"让记忆记住正确数字，即使不修改 Drive 上的原始资料，回答也会正确"}],"a":[1],"e":"连接器参照的是源头资料，源头错了回答也会错。根本对策是修改源头资料，再确认回答。每次口头提醒不可靠；等用户发现是在放任风险；用记忆打补丁会和源头资料产生矛盾，其他人也仍会看到错误资料。","ej":"元資料を直すのが根本対策"},{"id":"d5-072","d":5,"t":"5.2","n":1,"q":"Claudeがコネクタを使ってカレンダーに会議予定を作成しようとしている。利用者の行動として最も適切なものはどれか。","qz":"Claude 准备通过连接器在日历中创建会议日程。用户最合适的行为是哪一个？","o":[{"j":"日時・参加者・件名などの内容を確認してから承認し、作成後も予定を確認する","z":"确认日期时间、参加者、标题等内容后再批准，创建后也确认日程"},{"j":"Claudeに任せたので、内容を見ずに承認する","z":"既然交给 Claude 了，就不看内容直接批准"},{"j":"操作の承認を毎回求められるのは面倒なので、他人のアカウントで操作させる","z":"每次都要求批准太麻烦，所以让它用别人的账号操作"},{"j":"作成された予定に誤りがあっても、Claudeの責任なので放置する","z":"创建的日程即使有错，也是 Claude 的责任，所以置之不理"}],"a":[0],"e":"代表用户执行的操作，用户仍然负责：执行前确认内容再批准，执行后检查结果。不看就批准是放弃监督；用他人账号操作违规；出错时责任在使用者，不能放置不管。","ej":"操作は内容を確認して承認・結果も確認"},{"id":"d5-003","d":5,"t":"5.3","n":1,"q":"顧客向けメール文案を作るProjectの指示文として、最も効果的なものはどれか。","qz":"作为制作客户邮件草稿的 Project 指令，最有效的是哪一个？","o":[{"j":"「いい感じのメールを書いて」","z":"“写一封感觉不错的邮件”"},{"j":"「絶対に間違えないこと。」とだけ書く","z":"只写“绝对不要出错。”"},{"j":"会社の沿革を全文貼り付ける","z":"把公司沿革全文贴进去"},{"j":"「あなたは当社カスタマーサクセス担当です。読み手は既存顧客の担当者。敬体で300字以内、結論を先に書く。価格や契約条件は推測せず、不明な場合は【要確認】と記載する。」","z":"“你是本公司客户成功负责人。读者是现有客户的负责人。用敬体，300 字以内，先写结论。不要猜测价格和合同条件，不明时标注【要確認】。”"}],"a":[3],"e":"好的系统级指令包含：角色、读者、语气、长度、结构、边界（不猜测）以及不确定时的处理方式。“写一封感觉不错的邮件”太模糊；只写“绝对不要出错”是空泛要求，没有可执行的规则；贴上公司沿革全文是与任务无关的信息，只会占用上下文。","ej":"指示＝役割・読み手・形式・制約・不明時の扱いを具体的に"},{"id":"d5-009","d":5,"t":"5.3","n":1,"q":"Projectの指示に「回答は必ず日本語で」と書いてあるが、利用者が英語で質問すると英語で返ってくることがある。最も適切な改善策はどれか。","qz":"Project 指令中写着“回答必须用日语”，但用户用英语提问时有时会用英语回答。最合适的改进方案是哪一个？","o":[{"j":"指示を「質問の言語にかかわらず、回答は常に日本語で書く。英語の固有名詞はそのまま残してよい」のように明確化する","z":"把指令明确为“无论提问语言是什么，回答始终用日语书写。英文专有名词可保留原样”"},{"j":"英語で質問した利用者を利用禁止にする","z":"禁止用英语提问的用户使用"},{"j":"指示を削除する","z":"删除该指令"},{"j":"モデルを変えれば必ず解決するので、指示は見直さない","z":"换模型一定能解决，所以不改指令"}],"a":[0],"e":"指令不够具体时，遇到冲突情况（提问语言与指令不同）模型会做出别的判断。把条件和例外写清楚是最直接的改进。禁止英语提问者使用是过度反应；删除指令会让问题更严重；“换模型一定能解决”不可靠，先改善指令更根本。","ej":"指示が守られない → 条件・例外を明確に書き直す"},{"id":"d5-011","d":5,"t":"5.3","n":1,"q":"システムレベルの指示（Projectの指示など）に含めるべき内容として、最も優先度が低いものはどれか。","qz":"在系统级指令（如 Project 指令）中应包含的内容里，优先级最低的是哪一个？","o":[{"j":"Claudeに期待する役割と目的","z":"期望 Claude 扮演的角色和目的"},{"j":"作成者の昼食の好みなど、タスクに無関係な個人的情報","z":"制作者的午餐喜好等与任务无关的个人信息"},{"j":"出力の形式・長さ・トーン","z":"输出的格式、长度、语气"},{"j":"不明な場合や、Projectの対象範囲外の質問を受けた場合の対応方法","z":"不明情况或收到 Project 范围外问题时的处理方法"}],"a":[1],"e":"系统级指令应聚焦于角色/目的、输出规范、边界与例外处理。制作者的午餐喜好这类与任务无关的个人信息，只会占用上下文并可能干扰回答，优先级最低（最好不写）。","ej":"指示に無関係な情報は入れない"},{"id":"d5-015","d":5,"t":"5.3","n":2,"q":"FAQ回答用Projectの指示に追加すると効果的なものを2つ選べ。","qz":"在 FAQ 回答用 Project 的指令中，添加后有效果的内容请选出 2 个。","o":[{"j":"「ナレッジに記載がない場合は推測せず、その旨を伝えて担当窓口を案内する」","z":"“知识库中没有记载时不要猜测，说明这一点并引导至负责窗口”"},{"j":"「ナレッジの内容は無視して一般知識で答える」","z":"“忽略知识库内容，用一般知识回答”"},{"j":"「分からないことも自信を持って断定的に答える」","z":"“不知道的事情也要自信地断定回答”"},{"j":"「回答には根拠となった資料名と該当箇所を示す」","z":"“回答中注明作为依据的资料名称和对应位置”"},{"j":"「できるだけ長く、関係ない話題も含めて答える」","z":"“尽量长地回答，也包含无关话题”"}],"a":[0,3],"e":"正确的两项：“知识库没有记载时不要猜测，说明这一点并引导至负责窗口”能显著减少幻觉；“注明依据的资料名称和位置”便于用户核实。错误：要求不知道也自信断定，等于鼓励幻觉；“尽量长、包含无关话题”降低可读性；“忽略知识库用一般知识回答”违背 FAQ Project 的目的。","ej":"不明時は推測しない＋根拠資料を示させる"},{"id":"d5-019","d":5,"t":"5.3","n":1,"q":"指示文の書き方として、Claudeがより一貫して従いやすいものはどれか。","qz":"以下指令写法中，Claude 更容易一贯遵守的是哪一个？","o":[{"j":"「要約は3点の箇条書き、各点40字以内。理由：経営層がスマホで読むため」","z":"“摘要用 3 个要点列出，每点 40 字以内。理由：管理层用手机阅读”"},{"j":"「短くしないでほしいが長すぎるのもだめ、でもできるだけ詳しく、かつ簡潔に」","z":"“不要太短但也不能太长，但要尽量详细而且简洁”"},{"j":"「適当に良い感じでまとめて」","z":"“适当地整理得好一点”"},{"j":"禁止事項だけを大量に列挙する","z":"只大量列举禁止事项"}],"a":[0],"e":"具体、可衡量并说明理由的指令最容易被一贯遵守，说明理由还能帮助模型在没写到的情况下做出合理判断。“适当地整理得好一点”太模糊；“不要太短也不能太长但要详细”自相矛盾；只列禁止事项而不写期望行为，难以得到想要的结果。","ej":"具体的・測定可能・理由付きの指示"},{"id":"d5-023","d":5,"t":"5.3","n":1,"q":"社外向けチャット文案を作るProjectで、Claudeに競合他社を批判する表現を避けさせたい。指示の書き方として最も適切なものはどれか。","qz":"在制作对外聊天文案的 Project 中，希望 Claude 避免批评竞争对手的表达。最合适的指令写法是哪一个？","o":[{"j":"何も書かず、出力後に毎回手で削る","z":"什么都不写，每次输出后手动删除"},{"j":"「競合他社には言及しない。比較を求められた場合は自社製品の特長のみを事実に基づいて説明する」と、避けることと代わりにすべきことを書く","z":"写明“不提及竞争对手。被要求比较时，仅基于事实说明本公司产品的特点”，即写清要避免什么以及应改为做什么"},{"j":"「悪いことは書かないで」とだけ書く","z":"只写“不要写坏话”"},{"j":"競合他社の資料を全てナレッジに入れる","z":"把竞争对手的资料全部放进知识库"}],"a":[1],"e":"有效的限制指令应同时写明“不做什么”和“改为做什么”，并且具体。什么都不写、每次手动删除是浪费人工；只写“不要写坏话”标准不明确；把竞争对手资料全部放进知识库，反而可能增加提及竞争对手的概率。","ej":"禁止＋代わりにすべき行動をセットで書く"},{"id":"d5-026","d":5,"t":"5.3","n":1,"q":"Project指示に、出力例（良い例）を含める主な効果として最も適切なものはどれか。","qz":"在 Project 指令中加入输出示例（好的范例），主要效果中最合适的是哪一个？","o":[{"j":"期待する形式やトーンが具体的に伝わり、出力の一貫性が高まる","z":"能具体传达期望的格式和语气，提高输出的一致性"},{"j":"Claudeが例をそのまま毎回コピーするため、必ず同じ文章になる","z":"Claude 会每次照抄范例，所以文章一定相同"},{"j":"コンテキストの消費がゼロになる","z":"上下文消耗变为零"},{"j":"事実確認が不要になる","z":"不再需要事实核查"}],"a":[0],"e":"范例（few-shot）是传达格式、语气、详细程度的有效手段，能提高一致性。模型是参考而不是机械照抄（担心过度模仿时可以给多个不同例子）；范例本身也会占用上下文；事实核查依然必要。","ej":"良い例を示す＝形式・トーンの一貫性↑"},{"id":"d5-029","d":5,"t":"5.3","n":1,"q":"Project指示とチャット内での個別の依頼の関係について、最も適切な運用はどれか。","qz":"关于 Project 指令与对话中个别请求的关系，最合适的运用方式是哪一个？","o":[{"j":"毎回の個別依頼の内容も全てProject指示に追記していく","z":"把每次的个别请求内容也全部追加到 Project 指令里"},{"j":"共通で変わらないルールはProject指示に、その回だけの条件はチャットの依頼に書く","z":"共通且不变的规则写在 Project 指令中，只针对当次的条件写在对话请求里"},{"j":"Project指示は使い捨てにする","z":"Project 指令用完即弃"},{"j":"全ての要件をチャットで毎回伝え、Project指示は使わない。毎回伝える方が、状況に合わせられるので確実である","z":"所有要求每次都在对话里传达，不使用 Project 指令。每次传达更能适应情况，所以更稳妥"}],"a":[1],"e":"分层管理：长期共通的规则写进 Project 指令；只针对当次的具体条件写在对话请求里。把每次的个别请求都追加进指令，会让指令膨胀且互相矛盾；所有要求每次都在对话里说，重复劳动且不一致；用完即弃则失去持续性。","ej":"共通ルール→指示／その回の条件→チャット"},{"id":"d5-052","d":5,"t":"5.3","n":1,"q":"システムレベルの指示で、Claudeに一貫して守らせたいルールの書き方として最も適切なものはどれか。","qz":"在系统级指令中，想让 Claude 一贯遵守规则时，最合适的写法是哪一个？","o":[{"j":"「なるべく、できれば、場合によっては簡潔に」と曖昧に書く","z":"含糊地写“尽量、可以的话、视情况简洁一点”"},{"j":"「回答は結論を1文目に書き、その後に理由を箇条書きで最大3点。理由：忙しい管理職が読むため」と具体的に書く","z":"具体写出“第 1 句写结论，之后用要点列出理由最多 3 点。理由：给忙碌的管理者阅读”"},{"j":"ルールを100個以上並べ、優先順位はつけない","z":"列出 100 条以上规则，不排优先顺序"},{"j":"ルールは書かず、出力がおかしいたびにチャットで注意する","z":"不写规则，每次输出不对时在对话里提醒"}],"a":[1],"e":"具体、可执行、附带理由的规则最容易被一贯遵守。含糊的说法无法判断标准；大量规则且无优先顺序容易互相冲突、难以遵守；每次在对话里提醒既低效又不稳定。","ej":"具体的・理由付きのルール"},{"id":"d5-053","d":5,"t":"5.3","n":1,"q":"Project指示の中に「常に詳しく説明する」と「常に100字以内で答える」という2つのルールが入っていた。出力が不安定になっている原因として最も考えられるものはどれか。","qz":"Project 指令中同时有“始终详细说明”和“始终在 100 字以内回答”两条规则，输出变得不稳定。最可能的原因是哪一个？","o":[{"j":"利用者の質問が悪いため。利用者に質問の仕方を変えてもらう","z":"用户的问题不好。让用户改变提问方式"},{"j":"モデルの性能が低いため。最上位モデルに変えれば、矛盾した指示でも適切に解釈されて解決する","z":"模型性能低。换成最高级模型后，即使指令矛盾也能被恰当理解而解决"},{"j":"ナレッジが少ないため。資料をさらに追加すれば解決する","z":"知识太少。再追加资料就能解决"},{"j":"指示同士が矛盾しているため。優先順位や適用条件を明確にして整理する必要がある","z":"指令之间互相矛盾，需要明确优先顺序或适用条件并加以整理"}],"a":[3],"e":"互相矛盾的指令会让模型每次做出不同取舍，导致输出不稳定。应整理指令：明确优先顺序或适用条件（例如“通常 100 字以内，用户要求详细时再展开”）。换模型、加资料、怪用户都没有处理根本原因。","ej":"矛盾する指示は優先順位・条件を整理"},{"id":"d5-054","d":5,"t":"5.3","n":2,"q":"社内問い合わせ対応用のシステムレベル指示に含めると効果的なものを2つ選べ。","qz":"以下哪些写进公司内部咨询用的系统级指令中会比较有效？请选择 2 项。","o":[{"j":"毎回異なる、その日だけの特別な依頼","z":"每次不同、只针对当天的特别请求"},{"j":"「分からないことも推測で必ず答える」というルール","z":"“不知道的事也要靠推测一定回答”的规则"},{"j":"個人情報やパスワードを入力しないよう利用者に案内するルール","z":"引导用户不要输入个人信息和密码的规则"},{"j":"想定する利用者（IT知識の少ない社員など）と回答のトーン","z":"设想的用户（如 IT 知识少的员工等）和回答语气"},{"j":"指示作成者の趣味や休日の予定","z":"指令制作者的爱好和假期安排"}],"a":[2,3],"e":"有效的系统级指令包括：用户是谁、用什么语气，以及安全规则（如引导用户不要输入个人信息和密码）。“不知道也推测回答”会诱发幻觉；制作者的个人信息与任务无关；只针对当天的请求应写在对话里。","ej":"利用者像・トーン・安全ルールを指示に"},{"id":"d5-055","d":5,"t":"5.3","n":1,"q":"Project指示に「次の出力例のように書くこと」として良い例を1つだけ入れたところ、すべての出力がその例とほぼ同じ構成・同じ言い回しになってしまった。最も適切な改善はどれか。","qz":"在 Project 指令中写了“请按以下输出示例来写”并只放了一个好例子，结果所有输出的结构和措辞都和例子几乎一样。最合适的改进是哪一个？","o":[{"j":"例示をすべて削除し、出力形式の指定もやめる","z":"删除所有示例，也不再指定输出格式"},{"j":"同じ例をさらに3回繰り返して書く","z":"把同一个例子再重复写 3 次"},{"j":"性質の異なる複数の例を示し、「構成は参考にし、内容と表現は状況に合わせる」と意図を説明する","z":"提供多个性质不同的例子，并说明意图：“结构可以参考，内容和表达按情况调整”"},{"j":"例をもっと長くして、すべてのケースを1つの例に詰め込む","z":"把例子写得更长，把所有情况塞进一个例子里"}],"a":[2],"e":"只有一个例子时，模型容易过度模仿。给出多个不同的例子，并说明哪些要模仿（结构、格式）、哪些要灵活（内容、措辞），效果更好。全部删除会失去格式一致性；重复同一个例子会更加强化模仿；把所有情况塞进一个例子会难以理解。","ej":"例は複数・意図も説明"},{"id":"d5-056","d":5,"t":"5.3","n":1,"q":"指示文で「〇〇しないこと」という禁止事項ばかりを並べたところ、期待する出力が得られなかった。最も適切な改善はどれか。","qz":"在指令中只罗列了“不要做〇〇”这类禁止事项，结果没有得到期望的输出。最合适的改进是哪一个？","o":[{"j":"禁止事項をさらに増やし、想定されるあらゆる望ましくない表現を一つずつ列挙する","z":"进一步增加禁止事项，把能想到的所有不理想表达逐一列出"},{"j":"禁止事項をすべて大文字・太字にする","z":"把禁止事项全部大写、加粗"},{"j":"禁止事項に加えて、代わりに何をしてほしいか（望ましい行動）を具体的に書く","z":"除了禁止事项，还要具体写出希望它改为做什么（期望的行为）"},{"j":"指示をすべて削除し、自由に書かせる","z":"删除全部指令，让它自由发挥"}],"a":[2],"e":"只写“不要做什么”时，模型不知道该做什么。告诉它期望的行为（例如“不提及竞品时，改为基于事实说明本公司产品的特点”）效果更好。增加禁止事项、加粗强调都没有给出方向；删除全部指令会失去控制。","ej":"禁止だけでなく「代わりに何をするか」を書く"},{"id":"d5-057","d":5,"t":"5.3","n":1,"q":"多言語の利用者がいる社内ヘルプ用Projectで、回答言語を安定させたい。指示の書き方として最も適切なものはどれか。","qz":"在有多语种用户的公司内部帮助 Project 中，想让回答语言保持稳定。指令的最合适写法是哪一个？","o":[{"j":"「適当な言語で答えて」と書く","z":"写“用合适的语言回答”"},{"j":"言語については何も書かず、出力ごとに翻訳ツールで直す","z":"语言方面什么也不写，每次输出后用翻译工具修改"},{"j":"「質問と同じ言語で回答する。ただし社内規程の正式名称は日本語表記のまま併記する」と条件と例外を明記する","z":"明确写出条件和例外：“用与提问相同的语言回答。但公司规程的正式名称保留日语写法一并注明”"},{"j":"「英語を使ってはいけない」とだけ書く","z":"只写“不准用英语”"}],"a":[2],"e":"写清规则的条件和例外，模型在各种情况下都能做出一致判断。“合适的语言”太模糊；不写规则、每次事后翻译效率低；只写禁止项既不完整，也可能不符合多语种用户的需求。","ej":"条件と例外を明記して一貫性を高める"},{"id":"d5-058","d":5,"t":"5.3","n":1,"q":"システムレベルの指示と、その都度のチャットでの依頼の役割分担として最も適切なものはどれか。","qz":"系统级指令与每次对话中的请求如何分工，最合适的是哪一个？","o":[{"j":"すべての依頼内容をシステムレベルの指示に書き足していく","z":"把所有请求内容都不断追加到系统级指令中"},{"j":"チャットで伝えた内容は、システムレベルの指示より常に無視される","z":"在对话里传达的内容总是会被系统级指令覆盖而忽略"},{"j":"システムレベルの指示は使わず、毎回すべてをチャットで説明する","z":"不使用系统级指令，每次在对话里说明一切"},{"j":"共通の役割・形式・ルールはシステムレベルの指示に、個別のタスク内容や今回だけの条件はチャットで伝える","z":"共通的角色、格式、规则写在系统级指令中，个别任务内容和只针对这次的条件在对话里传达"}],"a":[3],"e":"分层：长期共通的规则 → 系统级指令；具体任务和一次性条件 → 对话。把所有请求都追加进指令会让指令膨胀、互相矛盾；全部在对话里说明重复且不一致；对话中的请求并不会“总被忽略”，它是传达具体任务的地方。","ej":"共通ルール＝指示／個別条件＝チャット"},{"id":"d5-059","d":5,"t":"5.3","n":1,"q":"指示の中に「回答の根拠となる資料名を必ず示すこと」を入れる主な目的として最も適切なものはどれか。","qz":"在指令中加入“必须注明作为回答依据的资料名称”，其主要目的是哪一个？","o":[{"j":"回答を長くして、より専門的に見せるため","z":"让回答更长，看起来更专业"},{"j":"利用者が根拠を確認しやすくし、誤りやハルシネーションに気づきやすくするため","z":"让用户更容易确认依据，更容易发现错误和幻觉"},{"j":"資料名を示せば、その資料に基づいていることが保証されるため、回答が必ず正しくなる","z":"只要注明资料名，就能保证回答依据了该资料，所以回答一定正确"},{"j":"Claudeの処理速度を上げるため","z":"提高 Claude 的处理速度"}],"a":[1],"e":"要求注明依据，是为了让用户能回到原资料核实，更容易发现错误或幻觉。目的不是让回答更长；注明资料名不保证内容正确（资料名本身也要核对）；与处理速度无关。","ej":"根拠の明示＝検証しやすくする"},{"id":"d5-060","d":5,"t":"5.3","n":2,"q":"システムレベルの指示の品質を高める方法として適切なものを2つ選べ。","qz":"以下哪些是提高系统级指令质量的正确方法？请选择 2 项。","o":[{"j":"できるだけ抽象的な表現にして、解釈を自由にする","z":"尽量用抽象表达，让解释更自由"},{"j":"矛盾していても、ルールは多いほど良い","z":"即使互相矛盾，规则越多越好"},{"j":"一度書いた指示は、どんな状況でも変更しない","z":"一旦写好的指令，无论什么情况都不改"},{"j":"ルールの理由や背景も書き、Claudeが意図を理解できるようにする","z":"也写出规则的理由和背景，让 Claude 能理解意图"},{"j":"代表的な質問で出力を確認し、問題があれば指示を修正する","z":"用代表性问题确认输出，有问题就修改指令"}],"a":[3,4],"e":"测试后修改、写出理由和背景，都能提高指令的效果和一致性。永不修改无法应对变化；抽象表达会让输出不稳定；矛盾的规则越多，输出越不稳定。","ej":"テストして改善・理由を書く"},{"id":"d5-073","d":5,"t":"5.3","n":1,"q":"Claudeに「わからない場合はわからないと答えてよい」と指示に明記する効果として最も適切なものはどれか。","qz":"在指令中写明“不知道时可以回答不知道”，最合适的效果说明是哪一个？","o":[{"j":"Claudeが「わからない」ばかり答えるようになり、何も役に立たなくなるので逆効果である","z":"Claude 会总是回答“不知道”，变得毫无用处，所以适得其反"},{"j":"処理速度が大幅に上がる","z":"处理速度会大幅提高"},{"j":"回答が必ず正確になるので、確認は不要になる","z":"回答一定会准确，所以不需要确认"},{"j":"根拠のない推測による回答（ハルシネーション）を減らす助けになる","z":"有助于减少没有依据的推测性回答（幻觉）"}],"a":[3],"e":"允许模型说“不知道”，它就不必为了回答而编造，有助于减少幻觉。它不会让 Claude 什么都不答；也不能保证正确，确认仍然必要；与处理速度无关。","ej":"「わからない」と言える許可で推測を減らす"},{"id":"d5-008","d":5,"t":"5.4","n":1,"q":"社内規程が改定されたが、規程Q&A用Projectの担当者が誰か決まっておらず、古い回答が出続けている。最も適切な改善策はどれか。","qz":"公司规章已修订，但规章问答 Project 没有确定负责人，持续给出旧的回答。最合适的改进方案是哪一个？","o":[{"j":"Projectのオーナーと更新手順を定め、規程改定時にナレッジと指示を更新し、更新日を記録する","z":"确定 Project 的负责人和更新流程，规章修订时更新知识库和指令，并记录更新日期"},{"j":"Projectを毎月作り直す","z":"每个月重建 Project"},{"j":"Claudeに規程改定を自動で察知させる","z":"让 Claude 自动察觉规章修订"},{"j":"利用者各自が回答を疑って使えばよいので、何もしない。規程の改定は利用者が自分で確認するべきである","z":"每个用户自己怀疑着用就行，所以什么都不做。规程的修订应由用户自己确认"}],"a":[0],"e":"配置与知识需要“运维”：明确负责人、更新触发条件和流程、更新记录。让用户自己怀疑着用，是把风险转嫁给用户；每月重建 Project 成本高，也没解决“谁负责”；Claude 不会自动察觉公司内部规章的修订。","ej":"オーナー・更新手順・更新履歴を決めて保守する"},{"id":"d5-012","d":5,"t":"5.4","n":1,"q":"マーケティング部門のProject指示を変更したところ、別の用途で同じProjectを使っていた広報担当の出力が崩れた。今後の再発防止策として最も適切なものはどれか。","qz":"修改了市场部门的 Project 指令后，同一 Project 中做其他用途的公关负责人输出出了问题。作为今后的防止再发措施，最合适的是哪一个？","o":[{"j":"指示の変更は口頭で済ませる","z":"指令变更口头说一下就行"},{"j":"変更しない方が安全なので、今後一切変更しない","z":"不改更安全，今后一律不改"},{"j":"用途ごとにProjectを分け、指示の変更時は影響範囲を確認し、テストしてから反映・周知する","z":"按用途拆分 Project，修改指令时确认影响范围，测试后再反映并通知"},{"j":"指示は誰でも自由に随時変更できるようにし、出力が変わったと気づいた人がその都度自分の用途に合わせて直す","z":"让任何人都能随时自由修改指令，发现输出变了的人每次按自己的用途去改"}],"a":[2],"e":"配置变更要像管理文档一样：按用途拆分、变更前确认影响范围、测试、记录、通知相关人员。口头说一下、让任何人随时自由修改，都缺乏变更管理；“今后一律不改”过度保守，业务变化时无法改进。","ej":"用途ごとにProject分離／変更は影響確認→テスト→周知"},{"id":"d5-016","d":5,"t":"5.4","n":1,"q":"Projectを半年運用したところ、利用者から「回答が冗長」「特定の質問で古い手順が出る」とのフィードバックが届いた。最も適切な対応はどれか。","qz":"Project 运营半年后，用户反馈“回答冗长”“某些问题会给出旧流程”。最合适的应对是哪一个？","o":[{"j":"フィードバックは個人の好みなので対応しない","z":"反馈只是个人喜好，不做处理"},{"j":"フィードバックを分析し、指示に長さの制約を追加、古い手順の資料を更新し、代表的な質問で改善を確認する","z":"分析反馈，在指令中加上长度限制，更新旧流程资料，并用代表性问题确认改进效果"},{"j":"利用者に、長い回答を自分で要約するよう指示する","z":"要求用户自己去总结冗长的回答"},{"j":"Projectを削除して新しいツールを探す","z":"删除 Project，寻找新工具"}],"a":[1],"e":"持续改进循环：收集反馈 → 找原因（指令还是知识）→ 修改指令和知识 → 用代表性问题测试确认。把反馈当个人喜好不处理、让用户自己总结冗长回答，都是把问题留给用户；删除 Project 换工具是过度反应，问题可以通过配置修正。","ej":"フィードバック→原因特定→指示・ナレッジ更新→テストで確認"},{"id":"d5-020","d":5,"t":"5.4","n":1,"q":"Projectの指示とナレッジを更新した後に行うべきこととして、最も適切なものはどれか。","qz":"更新 Project 的指令和知识库之后，最应该做的是哪一个？","o":[{"j":"旧版の指示をナレッジに追加で残しておく","z":"把旧版指令作为附加资料留在知识库中"},{"j":"何もしない。更新すれば必ず改善する","z":"什么都不做。更新了就一定会改善"},{"j":"更新内容は利用者に知らせず、しばらく運用してみて、問題が報告されたらそのときに原因を考える","z":"不把更新内容告诉用户，先运营一段时间，有人报告问题时再考虑原因"},{"j":"よく使われる代表的な質問を投げて、期待どおりの回答になるかを確認する","z":"用常用的代表性问题测试，确认回答是否符合预期"}],"a":[3],"e":"更新后用代表性问题（可预先准备一组测试问题）做回归确认，再通知用户。“更新了就一定会改善”忽视了副作用；把旧版指令留在知识库里会产生矛盾；不告诉用户、出问题再说，缺乏沟通和验证。","ej":"更新後は代表質問でテスト（回帰確認）"},{"id":"d5-024","d":5,"t":"5.4","n":1,"q":"組織で複数のProjectが乱立し、どれが最新で正式なものか分からなくなっている。最も適切な対策はどれか。","qz":"组织内多个 Project 泛滥，搞不清哪个是最新的正式版本。最合适的对策是哪一个？","o":[{"j":"全てのProjectを放置し、利用者に選ばせる","z":"放任所有 Project，让用户自己选"},{"j":"全てのProjectを削除して利用を停止する","z":"删除所有 Project 并停止使用"},{"j":"Projectの棚卸しを行い、正式版の命名ルール・オーナー・説明を定め、不要なものはアーカイブする","z":"盘点 Project，制定正式版的命名规则、负责人和说明，不需要的归档"},{"j":"さらに新しい「正式版」Projectを作って解決し、既存のProjectはそれぞれの作成者に任せてそのまま残す","z":"再建一个新的“正式版”Project 来解决，现有的 Project 交给各自的创建者，保持原样"}],"a":[2],"e":"配置管理需要治理：盘点、命名规则、负责人、用途说明、归档不用的。放任不管会造成混乱和误用；全部删除停止使用是过度反应；再建一个新 Project 只会让问题更严重。","ej":"Project棚卸し：命名ルール・オーナー・アーカイブ"},{"id":"d5-027","d":5,"t":"5.4","n":2,"q":"Claudeの設定（指示・ナレッジ・コネクタ）を継続的に維持するための取り組みとして適切なものを2つ選べ。","qz":"为了持续维护 Claude 的配置（指令、知识库、连接器），请选出 2 个合适的做法。","o":[{"j":"変更内容と理由を記録し、関係者に周知する","z":"记录变更内容和理由，并通知相关人员"},{"j":"利用者からのフィードバックは受け付けない","z":"不接受用户反馈"},{"j":"一度設定したら二度と変更しない","z":"设置一次后永不修改"},{"j":"資料の更新日やレビュー予定日を決め、定期的に見直す","z":"确定资料的更新日期和复审计划日，定期检查"},{"j":"担当者を決めず、気づいた人が無断で変更する","z":"不确定负责人，发现问题的人擅自修改"}],"a":[0,3],"e":"正确的两项：确定资料的更新日期和复审日，定期检查，防止过期；记录变更内容和理由并通知相关人员，便于追溯。错误：设置一次永不修改，业务和资料都会变化；不接受用户反馈，失去改进来源；没有负责人、谁发现谁擅自改，会导致混乱。","ej":"定期レビュー＋変更記録・周知"},{"id":"d5-030","d":5,"t":"5.4","n":1,"q":"Projectで使っていた社内テンプレートが全社で新様式に変わった。Projectの維持管理として最も適切な対応はどれか。","qz":"Project 中使用的公司内部模板在全公司改成了新格式。作为 Project 的维护，最合适的处理是哪一个？","o":[{"j":"テンプレートは関係ないので何もしない","z":"模板无关紧要，什么都不做"},{"j":"旧テンプレートを残し、利用者が出力後に手で直す","z":"保留旧模板，让用户在输出后手动修改"},{"j":"新テンプレートを追加するだけで、旧テンプレートと指示はそのままにし、どちらを使うかは利用者に任せる","z":"只追加新模板，旧模板和指令保持不变，用哪个交给用户决定"},{"j":"旧テンプレートを新テンプレートに差し替え、指示内の様式に関する記述も更新し、出力を確認する","z":"把旧模板替换为新模板，同时更新指令中有关格式的描述，并检查输出"}],"a":[3],"e":"资料变更时要成套更新：替换知识库中的模板、同步修改指令中相关描述、测试输出。保留旧模板让用户手动改，是把成本转嫁给用户；只追加新模板不动旧的，新旧并存会造成混用；什么都不做会持续输出旧格式。","ej":"様式変更 → ナレッジ差替＋指示更新＋出力確認"},{"id":"d5-061","d":5,"t":"5.4","n":1,"q":"部署のProjectで、誰がいつ指示を変更したのか分からず、出力が急に変わったときに原因を追えなかった。最も適切な再発防止策はどれか。","qz":"部门的 Project 中，不知道谁在什么时候改了指令，输出突然变化时无法追查原因。最合适的防止复发措施是哪一个？","o":[{"j":"変更があっても周知しない","z":"即使有修改也不通知大家"},{"j":"誰でも変更できるようにして、気づいた人がすぐに直せる体制にし、記録は特に残さない","z":"让任何人都能修改，发现问题的人马上就能改，也不特别留记录"},{"j":"指示を変更できる担当者を決め、変更内容・理由・日付を記録する","z":"确定能修改指令的负责人，记录修改内容、理由和日期"},{"j":"指示を毎日すべて書き直す","z":"每天把指令全部重写"}],"a":[2],"e":"变更管理的基本：确定负责人，记录变更内容、理由、日期，必要时通知用户，这样出问题时能追溯和恢复。任何人都能改会让情况更混乱；不通知用户会导致困惑；每天重写既不稳定也无法追溯。","ej":"変更は担当者を決めて記録"},{"id":"d5-062","d":5,"t":"5.4","n":1,"q":"商品の価格改定があった。価格を回答する営業支援Projectの維持管理として最も適切な対応はどれか。","qz":"商品价格进行了调整。对于回答价格的销售支持 Project，最合适的维护措施是哪一个？","o":[{"j":"新しい価格表を追加し、古い価格表も過去の問い合わせに答えるため念のため残しておく","z":"追加新价格表，为了回答过去的咨询，旧价格表也保留以防万一"},{"j":"利用者に「価格は自分で調べて」と伝え、Projectは使わせない","z":"告诉用户“价格请自己查”，不让他们使用 Project"},{"j":"Claudeが自動で価格改定を知るので、何もしない","z":"Claude 会自动知道价格调整，所以什么都不做"},{"j":"古い価格表を新しい版に差し替え、指示に価格の基準日を示し、代表的な質問で回答を確認する","z":"把旧价格表替换为新版本，在指令中注明价格基准日，并用代表性问题确认回答"}],"a":[3],"e":"资料更新要成套进行：替换旧版、在指令中注明基准、用代表性问题回归测试。新旧价格表并存会造成矛盾回答；Claude 不会自动知道内部价格变化；不让用户使用是过度反应，放弃了 Project 的价值。","ej":"改定時＝差し替え＋基準日明示＋確認"},{"id":"d5-063","d":5,"t":"5.4","n":2,"q":"Projectの設定を継続的に改善するための取り組みとして適切なものを2つ選べ。","qz":"以下哪些是持续改进 Project 设置的正确做法？请选择 2 项。","o":[{"j":"苦情が来るまでは何も確認しない","z":"在收到投诉之前什么都不检查"},{"j":"定期的な見直し日を決め、資料の鮮度や指示の妥当性を確認する","z":"确定定期复查日，确认资料是否新鲜、指令是否合适"},{"j":"利用者のフィードバックを集め、よくある不満の原因を分析して指示やナレッジに反映する","z":"收集用户反馈，分析常见不满的原因，并反映到指令或知识中"},{"j":"設定変更の記録は残さない","z":"不保留设置变更记录"},{"j":"出力に問題があっても、利用者に自分で直してもらう","z":"即使输出有问题，也让用户自己修改"}],"a":[1,2],"e":"反馈驱动的改进和定期复查，是让设置保持有效的两大支柱。等到投诉才检查过于被动；把问题推给用户不解决根本；不保留变更记录无法追溯。","ej":"フィードバック反映と定期見直し"},{"id":"d5-064","d":5,"t":"5.4","n":1,"q":"指示を改善した後に、以前は正しく答えられていた質問の回答が崩れていないかを確かめる作業を何と呼ぶのが最も適切か。","qz":"改进指令后，确认以前能正确回答的问题现在是否仍然回答正确，这项工作最合适的叫法是哪一个？","o":[{"j":"ブレインストーミング（アイデアの洗い出し）による再検討","z":"通过头脑风暴（列出创意）重新研究"},{"j":"回帰チェック（リグレッションの確認）","z":"回归检查（确认是否退化）"},{"j":"ハルシネーション","z":"幻觉"},{"j":"シャドーAI","z":"影子 AI"}],"a":[1],"e":"更新后用固定的测试问题确认原有效果没有变差，叫回归检查。头脑风暴是产生创意的方法；幻觉是 AI 生成错误信息的现象；影子 AI 是未经批准私自使用 AI 工具。","ej":"更新後は回帰チェック"},{"id":"d5-065","d":5,"t":"5.4","n":1,"q":"Projectの運用を始めて3か月後、利用者から「回答がいつも冗長」との声が多く寄せられた。最初に行うべきこととして最も適切なものはどれか。","qz":"Project 运营 3 个月后，很多用户反映“回答总是很啰嗦”。最应该首先做的是什么？","o":[{"j":"Projectを削除して、より簡潔に答えると評判の別のAIツールを導入する","z":"删除 Project，引入据说回答更简洁的其他 AI 工具"},{"j":"冗長なのは好みの問題なので、何もしない","z":"啰嗦是个人喜好问题，所以什么都不做"},{"j":"指示に出力の長さや構成の指定があるか確認し、具体的な上限や形式を追加してテストする","z":"确认指令中是否规定了输出长度和结构，追加具体的上限或格式后进行测试"},{"j":"利用者に、回答を自分で要約するよう依頼する","z":"请用户自己总结回答"}],"a":[2],"e":"先诊断：指令中是否缺少长度和格式的规定？针对原因修改指令并测试。多数用户都反映的问题不是个人喜好；换工具是过度反应；让用户自己总结是把问题推给用户。","ej":"フィードバック→原因を診断→指示を修正→テスト"},{"id":"d5-066","d":5,"t":"5.4","n":1,"q":"異動により、ある部署のProject管理担当者が不在になった。最も適切な対応はどれか。","qz":"由于人事调动，某部门的 Project 管理负责人离开了。最合适的应对是哪一个？","o":[{"j":"Projectを凍結し、誰も使えないようにする","z":"冻结 Project，让任何人都不能使用"},{"j":"担当者がいなくても、Projectは自動的に最新に保たれるので問題ない","z":"即使没有负责人，Project 也会自动保持最新，所以没问题"},{"j":"後任の担当者を決め、指示・ナレッジ・変更履歴・運用ルールを引き継ぐ","z":"确定接任负责人，交接指令、知识、变更历史和运营规则"},{"j":"前任者のアカウントを共有して、全員で管理する","z":"共享前任者的账号，大家一起管理"}],"a":[2],"e":"设置和知识需要有人负责维护。应确定接任者，交接指令、知识、变更历史和运营规则。Project 不会自动保持最新；冻结会让业务中断；共享前任者账号违反身份管理和安全原则。","ej":"担当者不在＝後任を決めて引き継ぐ"},{"id":"d5-067","d":5,"t":"5.4","n":1,"q":"利用している複数のProjectで、同じ社内規程の異なる版がそれぞれのナレッジに入っていることが判明した。最も適切な対応はどれか。","qz":"发现正在使用的多个 Project 中，各自的知识库里放着同一公司规程的不同版本。最合适的应对是哪一个？","o":[{"j":"正式な最新版を確認し、すべてのProjectで最新版に統一する。可能であれば元資料をコネクタで参照する","z":"确认正式最新版，所有 Project 都统一为最新版。可能的话通过连接器参照原始资料"},{"j":"各Projectの担当者に任せ、版の違いはそのままにする","z":"交给各 Project 负责人，版本差异保持原样"},{"j":"どの版が正しいかClaudeに判断させ、その結果をそのまま採用して、各Projectの担当者に通知する","z":"让 Claude 判断哪个版本正确，直接采用结果，并通知各 Project 负责人"},{"j":"すべての版を1つのProjectに集めて保管する","z":"把所有版本集中到一个 Project 中保管"}],"a":[0],"e":"多个 Project 中版本不一致会导致回答不一致。应确认正式最新版并统一，频繁更新的资料可以用连接器参照源头，避免复制后过时。放任不管会继续产生矛盾；哪个版本是正式版应由人根据正式来源确认，不应交给 Claude 判断；把所有版本集中保管只会让矛盾更多。","ej":"版の不一致＝正式最新版に統一"},{"id":"d5-068","d":5,"t":"5.4","n":1,"q":"Skillとして登録している報告書テンプレートが、社内の新しい様式に変わった。最も適切な対応はどれか。","qz":"注册为 Skill 的报告模板，换成了公司的新格式。最合适的应对是哪一个？","o":[{"j":"Skillはそのままにして、出力のたびに手作業で新様式に直す","z":"Skill 保持不变，每次输出后手工改成新格式"},{"j":"Skillの手順とテンプレートを新様式に更新し、出力例で確認してから利用者に周知する","z":"把 Skill 的步骤和模板更新为新格式，用输出示例确认后再通知用户"},{"j":"古いSkillと新しいSkillを両方残し、どちらを使うかはClaudeに任せる","z":"新旧 Skill 都保留，用哪个交给 Claude 决定"},{"j":"Skillを削除し、今後は毎回チャットで様式を説明する","z":"删除 Skill，今后每次在对话中说明格式"}],"a":[1],"e":"Skill 也需要像 Project 指令一样维护：更新步骤和模板、测试输出、通知用户。手工修改效率低、易出错；新旧并存会造成混用；删除 Skill 放弃了重复利用的价值。","ej":"Skillも様式変更に合わせて更新・確認・周知"},{"id":"d5-069","d":5,"t":"5.4","n":1,"q":"Projectのナレッジに入れている資料について、「いつ時点の情報か」が分からず、利用者が回答を信用してよいか迷っている。最も適切な改善策はどれか。","qz":"关于放进 Project 知识库的资料，用户不知道“是哪个时间点的信息”，因而不确定能否信任回答。最合适的改进措施是哪一个？","o":[{"j":"日付は混乱のもとなので、すべての資料から削除し、常に最新であるという前提で運用する","z":"日期容易引起混乱，所以从所有资料中删除，以“始终是最新的”为前提运营"},{"j":"ファイル名や文書内に版数・更新日を明記し、指示で回答時に基準日を示すよう求める","z":"在文件名或文档中写明版本号和更新日期，并在指令中要求回答时注明基准日期"},{"j":"Claudeに資料の作成日を推測させる","z":"让 Claude 推测资料的制作日期"},{"j":"利用者に資料の日付を気にしないよう伝える","z":"告诉用户不要在意资料的日期"}],"a":[1],"e":"写明版本和更新日期，并要求回答注明基准日期，用户就能判断信息是否新鲜，也便于负责人管理更新。删除日期会让判断更困难；让 Claude 推测日期不可靠；让用户不在意日期是在回避问题。","ej":"版数・更新日を明記し基準日を示させる"},{"id":"d5-074","d":5,"t":"5.4","n":1,"q":"組織のAI利用ポリシーが改定され、顧客名をProjectに入力することが禁止された。既存のProjectの維持管理として最も適切な対応はどれか。","qz":"组织的 AI 使用政策修订后，禁止在 Project 中输入客户名称。对现有 Project 的维护，最合适的应对是哪一个？","o":[{"j":"新しく作るProjectだけに新ルールを適用し、既存のProjectはこれまでどおり運用を続ける","z":"新规则只适用于新建的 Project，现有的 Project 照旧运营"},{"j":"既存のナレッジと指示を点検し、顧客名を含む資料を削除または匿名化し、利用者に新ルールを周知する","z":"检查现有知识和指令，删除或匿名化含有客户名称的资料，并向用户通知新规则"},{"j":"Claudeに「顧客名を見ないで」と指示すれば対応完了とする","z":"指示 Claude“不要看客户名称”就算处理完毕"},{"j":"ポリシー改定に気づかなかったことにして、運用を続ける","z":"假装没注意到政策修订，继续运营"}],"a":[1],"e":"政策变更也适用于现有设置：检查知识和指令，删除或匿名化违规内容，并通知用户。只适用新建 Project 会留下违规状态；口头指示不是政策上的控制手段；假装不知道违反治理原则。","ej":"ポリシー改定時は既存設定も点検・是正"},{"id":"d5-075","d":5,"t":"5.4","n":2,"q":"Projectの「テスト用の質問セット」を用意しておく利点として適切なものを2つ選べ。","qz":"预先准备 Project 的“测试问题集”，以下哪些是它的好处？请选择 2 项。","o":[{"j":"テストの結果、Claudeは今後二度と間違えなくなる","z":"测试之后，Claude 今后再也不会出错"},{"j":"指示やナレッジを更新した後、回答の質が下がっていないかを同じ条件で確かめられる","z":"更新指令或知识后，能在相同条件下确认回答质量没有下降"},{"j":"改善の前後を比較でき、変更の効果を客観的に判断しやすくなる","z":"可以比较改进前后，更容易客观判断修改效果"},{"j":"質問セットがあれば、ナレッジの更新は不要になる","z":"有了问题集，就不需要更新知识"},{"j":"テストをすれば、運用中の出力確認は一切不要になる","z":"只要测试过，运营中的输出确认就完全不需要了"}],"a":[1,2],"e":"固定的测试问题集可用于更新后的回归检查，也能比较改进前后的效果，让判断更客观。测试不能取代运营中的确认；也不能替代知识更新；测试不会让 Claude 永不出错。","ej":"テスト質問セット＝回帰確認と前後比較"},{"id":"d6-001","d":6,"t":"6.1","n":1,"q":"次のうち、Claudeの利用として最も不適切なものはどれか。","qz":"以下哪一项是最不恰当的Claude使用方式？","o":[{"j":"会議の議題案を複数出させ、チームで比較して選ぶ","z":"让它提出多个会议议题方案，团队比较后选择"},{"j":"公開済みのプレスリリースを英語に翻訳し、ネイティブ担当者が確認する","z":"把已公开的新闻稿翻译成英文，由母语负责人确认"},{"j":"社内研修資料の構成案を作成し、担当者が内容を確認する","z":"制作内部培训资料的结构方案，由负责人确认内容"},{"j":"従業員の解雇対象者を、Claudeの判定結果だけで決定する","z":"仅凭Claude的判定结果决定解雇对象员工"}],"a":[3],"e":"对人有重大影响的决定（解雇、录用、评价等）不能仅依赖AI判断，必须由人负责并有正当程序。其他三项都是AI辅助+人确认的恰当用法。","ej":"人に重大な影響を与える決定をAIだけで行わない"},{"id":"d6-002","d":6,"t":"6.1","n":2,"q":"Claudeの利用として適切なものを2つ選べ。","qz":"请选出2项恰当的Claude使用方式。","o":[{"j":"医師の診断を受けずに、Claudeの回答だけで社員の休職可否を判断する","z":"不经医生诊断，仅凭Claude的回答判断员工能否休职"},{"j":"社内規程の文書を要約し、従業員向けQ&Aのたたき台を作る","z":"总结公司规章文件，制作面向员工的Q&A初稿"},{"j":"取引先との契約交渉で、相手を欺くための虚偽データを作らせる","z":"在与客户的合同谈判中，制作用于欺骗对方的虚假数据"},{"j":"顧客アンケート(個人情報を除去済み)の傾向を分析し、改善案を出させる","z":"分析客户问卷（已去除个人信息）的趋势并提出改善方案"},{"j":"競合他社になりすました偽のレビューを作成し、Web上に投稿する","z":"冒充竞争对手制作虚假评论并发布到网上"}],"a":[1,3],"e":"总结规章做Q&A初稿、分析去标识化的问卷都是合规的增强用法。代替医生判断健康状况、伪造评论、制作欺骗性虚假数据都属于不恰当或违反伦理/法律的用途。","ej":"欺瞞・なりすまし・専門家判断の代替はNG"},{"id":"d6-003","d":6,"t":"6.1","n":1,"q":"社員が、顧客から届いた健康に関する相談メールへの返信をClaudeで作成しようとしている。最も適切な進め方はどれか。","qz":"员工想用Claude起草回复客户发来的有关健康咨询的邮件。最合适的推进方式是哪一项？","o":[{"j":"健康相談は難しいので、メールを無視する","z":"健康咨询太难，所以无视邮件"},{"j":"顧客の病歴を詳しく聞き出す質問を追加させる","z":"让它追加详细询问客户病史的问题"},{"j":"症状に関する一般的な医学情報をClaudeに詳しくまとめさせ、考えられる病名と具体的な対処法・市販薬の名前まで記載して、そのまま顧客に送る","z":"让Claude详细汇总有关症状的一般医学信息，写上可能的病名、具体处理方法乃至非处方药名称，直接发给客户"},{"j":"一般的な案内文の下書きに留め、医療的判断は専門家への相談を促す文面にし、社内規程に沿って担当者が確認する","z":"只起草一般性的指引文字，医疗判断部分写成建议咨询专家，并由负责人按公司规定确认"}],"a":[3],"e":"医疗等专业领域，Claude只适合起草一般性沟通文本，专业判断应引导至专家，并由人按规定确认。让AI诊断并直接发送风险极高；无视客户不恰当；收集不必要的敏感健康信息违反数据最小化。","ej":"専門的判断は専門家へ、AIは一般的な下書きまで"},{"id":"d6-004","d":6,"t":"6.1","n":1,"q":"あるチームが、採用候補者の履歴書をClaudeでスクリーニングし、上位者だけを面接に進める案を検討している。最も適切な懸念と対応はどれか。","qz":"某团队在考虑用Claude筛选应聘者简历，只让排名靠前者进入面试。最恰当的担忧与应对是哪一项？","o":[{"j":"候補者に知られなければ問題ない","z":"只要候选人不知道就没问题"},{"j":"大量の履歴書を処理するため速度とコストが最大の課題なので、Haikuに切り替えて全員を一括でスコア付けし、上位者を自動的に面接へ進める","z":"处理大量简历时速度和成本是最大的课题，所以切换到Haiku给所有人批量打分，自动让排名靠前的人进入面试"},{"j":"バイアスや不公平な判断のリスクがあるため、評価基準を明確にし、人が最終判断し、社内規程・法令を確認する","z":"存在偏见和不公平判断的风险，因此要明确评价标准、由人做最终判断，并确认公司规定和法令"},{"j":"Claudeは中立なので懸念はない","z":"Claude是中立的，所以没有担忧"}],"a":[2],"e":"招聘筛选属于高风险用途，AI可能反映训练数据中的偏见。应明确标准、保留人的最终判断，并确认公司规定与相关法规（各地对自动化招聘决策有要求）。速度不是核心问题；隐瞒不能免除责任；AI并不保证中立。","ej":"採用など高リスク用途はバイアス対策+人が最終判断"},{"id":"d6-005","d":6,"t":"6.1","n":1,"q":"広報担当が、実在の業界団体の公式声明に見える文書をClaudeで作り、SNSで拡散しようとしている。最も適切な判断はどれか。","qz":"公关负责人想用Claude制作看起来像真实行业团体官方声明的文件，并在社交媒体上扩散。最恰当的判断是哪一项？","o":[{"j":"拡散後に削除すれば問題ない","z":"扩散后删除就没问题"},{"j":"風刺であることが分かるよう文末に小さく注記を入れれば、団体名や体裁はそのままでも問題ない","z":"只要在文末小字注明是讽刺，团体名称和格式保持原样也没问题"},{"j":"団体名を少し変えれば問題ない","z":"只要稍微改一下团体名称就没问题"},{"j":"誤情報やなりすましにあたる不適切な利用なので行わない","z":"属于虚假信息和冒充的不当使用，所以不做"}],"a":[3],"e":"冒充真实组织发布声明属于虚假信息和冒充，是不恰当的用途。改名或加小字注释都不改变其误导性质；扩散后的危害无法通过删除消除。","ej":"なりすまし・誤情報の作成は不適切"},{"id":"d6-006","d":6,"t":"6.1","n":1,"q":"Claudeに任せてもよい作業と、人が担うべき作業の切り分けを考える。AI Fluencyの「Delegation(委任)」の考え方として最も適切なものはどれか。","qz":"考虑哪些工作可以交给Claude、哪些应由人承担。作为AI Fluency中“Delegation（委托）”的思路，最恰当的是哪一项？","o":[{"j":"AIは補助なので、どの作業も任せるべきではない","z":"AI只是辅助，所以任何工作都不应交给它"},{"j":"目的・AIの得意不得意・リスクを踏まえて、何をAIに任せ、何を人が担うかを判断する","z":"基于目的、AI的擅长与不擅长以及风险，判断什么交给AI、什么由人承担"},{"j":"できるだけ多くの作業をAIに任せることが目標である","z":"目标是尽可能多地把工作交给AI"},{"j":"AIに任せる範囲はIT部門が一律に決めるため、利用者は許可された作業をすべてAIに任せればよい","z":"交给AI的范围由IT部门统一决定，因此用户只需把被允许的工作全部交给AI即可"}],"a":[1],"e":"Delegation是根据目标、AI能力与局限、风险来决定分工。最大化交给AI不是目标；虽然要遵守组织政策，但使用者也需自行判断；完全不交给AI则失去价值。","ej":"Delegation=目的・能力・リスクで分担を判断"},{"id":"d6-007","d":6,"t":"6.1","n":1,"q":"学校の教員が、生徒の作文の採点にClaudeを使いたいと考えている。最も適切な使い方はどれか。","qz":"学校老师想用Claude给学生的作文打分。最恰当的使用方式是哪一项？","o":[{"j":"生徒の氏名・住所を含めて作文をアップロードし、本人特定に役立てる","z":"连同学生姓名、住址一起上传作文，用于识别本人"},{"j":"ルーブリック(評価基準)を示してフィードバック案を作らせ、教員が確認・修正して最終評価を決める","z":"给出评分标准（rubric）让它生成反馈草案，由老师确认、修改后决定最终评价"},{"j":"採点の一貫性を高めるため、全生徒の作文をClaudeに採点させ、そのスコアを成績表にそのまま記入する","z":"为提高评分一致性，让Claude给所有学生的作文打分，并把分数直接填入成绩单"},{"j":"採点基準を伝えず、Claudeの感覚で評価させる","z":"不告知评分标准，让Claude凭感觉评价"}],"a":[1],"e":"给出明确的评分标准、让AI生成反馈草案、由教师做最终评价，是恰当的增强方式。直接采用AI分数缺少人工判断；上传不必要的个人信息违反最小化原则；无标准评价会不一致且可能有偏。","ej":"基準を示し、最終評価は人"},{"id":"d6-034","d":6,"t":"6.1","n":1,"q":"Claudeに、社内の安全手順書の改訂案を作らせた。工場の作業員がこの手順に従って作業する。最も適切な扱いはどれか。","qz":"让Claude制作了公司内部安全手册的修订方案。工厂作业人员将按这个手册作业。最恰当的处理方式是哪一项？","o":[{"j":"安全管理の責任者・専門家がすべての手順を確認し、承認を得てから適用する","z":"由安全管理负责人和专家确认所有步骤，获得批准后再适用"},{"j":"文章が分かりやすくなったので、すぐに現場に配布する","z":"文字变得易懂了，马上发到现场"},{"j":"作業員に気づいた点があれば報告してもらい、確認は省略する","z":"让作业人员有发现就报告，省略确认"},{"j":"Claudeに労働安全の法令と照合させ、問題点の指摘がなければ専門家の確認は省略して適用する","z":"让Claude对照劳动安全法规，如果没有指出问题就省略专家确认直接适用"}],"a":[0],"e":"涉及人身安全的内容属于高风险，必须由负责人和专家全面确认并批准。易懂不等于正确；AI的自我确认不可靠；把确认推给一线作业人员会造成安全隐患。","ej":"安全に関わる内容は専門家の確認・承認が必須"},{"id":"d6-036","d":6,"t":"6.1","n":1,"q":"ローン審査部門で、申込者の書類をClaudeに読ませて「承認／否認」を判定させ、その結果をそのまま申込者に通知する案が出た。最も適切な判断はどれか。","qz":"贷款审核部门提出方案：让Claude读取申请人材料，判定“批准/拒绝”，并将结果直接通知申请人。最合适的判断是哪一个？","o":[{"j":"Claudeは書類の要点整理や確認項目の抽出に使い、承認・否認の最終判断は担当者が行い、社内規程と関連法令を確認する","z":"Claude用于整理材料要点、提取确认项目，批准/拒绝的最终判断由负责人做出，并确认公司规定和相关法令"},{"j":"Claudeの判定は人と違って気分や疲れに左右されず一貫性があるため、人の審査より公平であり、そのまま本番運用して担当者の確認も省いてよい","z":"Claude的判定不像人那样受情绪和疲劳影响、具有一致性，因此比人工审核更公平，可以直接正式运用，也可以省略负责人的确认"},{"j":"申込者に知らせなければ、AIが判定していても問題にならない","z":"只要不告诉申请人，即使由AI判定也不会成为问题"},{"j":"審査業務にAIは一切使えないので、書類整理も含めて利用を禁止する","z":"审核业务完全不能使用AI，因此连材料整理也禁止使用"}],"a":[0],"e":"贷款审批会对个人产生重大影响，属于高风险决定，不能交给 AI 单独决定，需要人做最终判断并确认法规（如说明义务、反歧视）。“AI 更公平”是误解，模型也可能带有偏见；“不告诉就没问题”违反透明性；全面禁止则过度，整理材料等辅助用途是合适的。","ej":"重大な影響のある判断＝AIは補助、最終判断は人"},{"id":"d6-037","d":6,"t":"6.1","n":1,"q":"ECサイトの担当者が、新商品の販売開始に合わせて「購入者のレビュー」をClaudeで30件作成し、商品ページに掲載しようとしている。最も適切な判断はどれか。","qz":"电商网站负责人打算配合新品上市，用Claude生成30条“购买者评价”并发布在商品页面上。最合适的判断是哪一个？","o":[{"j":"文章が自然であれば読者には区別がつかないので問題ない","z":"只要文章自然，读者就分辨不出来，所以没问题"},{"j":"実在しない購入者のレビューを作って掲載することは消費者を欺く行為であり、行うべきではない","z":"编造不存在的购买者评价并发布是欺骗消费者的行为，不应该做"},{"j":"件数を5件程度に減らし、内容を控えめな評価にしておけば、販促として許容される範囲になるので掲載してよい","z":"把数量减到5条左右、内容写得保守一些，就属于促销允许的范围，可以发布"},{"j":"Claudeに「本物らしく」と指示すれば適切になる","z":"只要指示Claude“写得像真的一样”就合适了"}],"a":[1],"e":"虚假评价是欺骗消费者的行为，可能违反景品表示法等法规，也违背负责任使用的原则。减少数量或写得保守，本质仍是伪造；写得更像真的只会让欺骗更严重。可以用 Claude 来整理真实评价、分析反馈。","ej":"架空のレビュー作成＝欺瞞。件数や表現の問題ではない"},{"id":"d6-038","d":6,"t":"6.1","n":1,"q":"海外拠点向けに、社内の業務マニュアル（公開不可・社外秘区分ではない社内一般資料）を英訳したい。Claudeの使い方として最も適切なものはどれか。","qz":"想把公司内部的业务手册（不对外公开，但不属于机密级别的一般内部资料）翻译成英文提供给海外据点。最合适的Claude用法是哪一个？","o":[{"j":"翻訳は誤りがないので、出力をそのまま海外拠点に配布する","z":"翻译不会出错，所以把输出直接分发给海外据点"},{"j":"社外秘ではないので、個人の無料アカウントで翻訳してもよい","z":"因为不是机密，所以用个人免费账号翻译也可以"},{"j":"会社が承認した環境で翻訳の下書きを作り、専門用語や手順の正確さを現地担当者や英語に詳しい社員が確認してから配布する","z":"在公司批准的环境中生成翻译初稿，由当地负责人或英语好的员工确认专业术语和步骤的准确性后再分发"},{"j":"AI翻訳は品質が保証されないので、社内マニュアルの英訳には一切使わず、時間と費用がかかってもすべて外部の翻訳会社に依頼する","z":"AI翻译质量没有保证，所以内部手册的英译完全不用它，即使花时间和费用也全部委托外部翻译公司"}],"a":[2],"e":"翻译初稿是 Claude 很适合的用途，但手册涉及操作步骤，术语错误可能导致事故，需要懂业务和语言的人确认。即使不是机密，内部资料也应在公司批准的环境中处理。完全不用 AI 则放弃了合理的效率提升。","ej":"翻訳の下書き＝適切。承認環境で作り、人が正確さを確認"},{"id":"d6-039","d":6,"t":"6.1","n":1,"q":"社長秘書が、全社員向けの年頭メッセージの下書きをClaudeで作成している。最も適切な進め方はどれか。","qz":"社长秘书正在用Claude起草面向全体员工的新年致辞。最合适的做法是哪一个？","o":[{"j":"社長に確認すると時間がかかるので、Claudeの下書きを社長名でそのまま配信する","z":"找社长确认太花时间，直接以社长名义发送Claude的初稿"},{"j":"過去の他社の社長メッセージをClaudeに集めさせ、自社に合うように表現を少し変えたうえで、社長の確認を省いて社長名で配信する","z":"让Claude收集其他公司社长过去的致辞，稍微改动表达以适合本公司，然后省略社长确认、以社长名义发送"},{"j":"AIで作った文章を社長名で出すのは常に不正なので、下書きにもClaudeを使わない","z":"用AI写的文章以社长名义发出总是不正当的，因此起草也不用Claude"},{"j":"社長の方針や伝えたい要点を確認して下書きを作り、社長本人が内容を確認・修正・承認したうえで配信する","z":"确认社长的方针和想传达的要点后起草，由社长本人确认、修改、批准后再发送"}],"a":[3],"e":"代笔本身并不违规，关键是署名人本人确认并认可内容、承担责任。未经确认直接以社长名义发送，是冒用名义；照搬他社内容有著作权和诚信问题；完全不用 AI 起草则过度。","ej":"代筆の下書き＝可。名義人本人が確認・承認する"},{"id":"d6-040","d":6,"t":"6.1","n":1,"q":"管理職が「部下の業務チャットをClaudeで常時分析し、会社への不満を言っている社員をリストアップしたい」と相談してきた。最も適切な対応はどれか。","qz":"一位管理者咨询：“想用Claude持续分析下属的工作聊天，列出对公司有不满的员工。”最合适的应对是哪一个？","o":[{"j":"従業員の監視やプライバシー、萎縮効果の問題があるため安易に実施せず、目的を確認したうえで人事・法務・社内ポリシーに照らして判断する","z":"存在员工监控、隐私和寒蝉效应等问题，不应轻易实施，应确认目的后对照人事、法务和公司政策判断"},{"j":"分析の精度を上げるため、私的なメッセージも含めてすべてを対象にする","z":"为了提高分析精度，把私人消息也全部纳入对象"},{"j":"リストは本人に知らせずに人事評価の参考資料として使えばよい","z":"名单不告诉本人，作为人事评价的参考资料即可"},{"j":"不満のある社員を早めに把握して対処するのは管理職の重要な責務であり、業務チャットは会社の資産なので、本人への説明なしに実施してよい","z":"尽早掌握并处理有不满的员工是管理者的重要职责，工作聊天是公司资产，所以可以不向本人说明就实施"}],"a":[0],"e":"用 AI 监视员工、给人贴“不满”标签，涉及隐私、劳动法和公平性，还会产生寒蝉效应，属于需要特别谨慎甚至不恰当的用途。“公司资产所以可以”忽略了法律和伦理；扩大到私人消息、暗中用于评价更不合适。","ej":"従業員の監視・選別目的＝不適切になりやすい。人事・法務に確認"},{"id":"d6-041","d":6,"t":"6.1","n":1,"q":"研修担当者が、新人研修の理解度確認テストをClaudeで作りたいと考えている。最も適切な使い方はどれか。","qz":"培训负责人想用Claude制作新人培训的理解度测试。最合适的用法是哪一个？","o":[{"j":"研修資料を渡さずに問題を作らせ、正解はClaudeが付けたものを確認せずに採点に使う","z":"不提供培训资料让它出题，答案直接用Claude给的、不经确认就用于评分"},{"j":"研修資料を渡して問題案と解説を作らせ、担当者が正解と難易度を確認してから使う","z":"提供培训资料，让它生成题目和解析，由负责人确认答案和难度后再使用"},{"j":"テスト作成は人の仕事なのでClaudeは使わない","z":"出题是人的工作，所以不用Claude"},{"j":"新人の回答をClaudeに採点させ、点数が低い新人の配属先をClaudeに決めさせる","z":"让Claude给新人的答卷评分，并让Claude决定低分新人的分配部门"}],"a":[1],"e":"根据资料生成测试题是合适的辅助用途，但答案和难度需要人确认。不给资料让它凭一般知识出题，可能与培训内容不符，答案也可能错；让 AI 决定人员分配属于重大人事决定，不能交给 AI。","ej":"教材を渡して問題案作成→人が正解を確認"},{"id":"d6-042","d":6,"t":"6.1","n":1,"q":"法律事務所ではない一般企業の総務担当者が、取引先とのトラブルについてClaudeに相談し、出力を「当社の法的見解」として取引先に送ろうとしている。最も適切な対応はどれか。","qz":"一家普通企业（不是律师事务所）的总务负责人就与客户的纠纷咨询Claude，打算把输出作为“本公司的法律见解”发给客户。最合适的应对是哪一个？","o":[{"j":"Claudeは法律の知識が豊富なので、出力をそのまま法的見解として送る","z":"Claude法律知识丰富，所以把输出直接作为法律见解发送"},{"j":"文末に「本回答はAIによるものであり、内容を保証するものではありません」と書けば、法的見解として取引先に送ってもよい","z":"只要在文末写上“本回答由AI生成，不保证内容”，就可以作为法律见解发给客户"},{"j":"Claudeで論点や事実関係の整理を行い、対外的な法的見解は法務部門や弁護士が確認・判断する","z":"用Claude整理争议点和事实关系，对外的法律见解由法务部门或律师确认和判断"},{"j":"トラブルについてはClaudeに一切相談せず、取引先の主張をそのまま受け入れる","z":"纠纷完全不咨询Claude，直接接受客户的主张"}],"a":[2],"e":"对外法律见解会产生法律后果，必须由法务或律师判断。Claude 适合用来整理论点和事实。只加一句“AI 回答”并不能弥补缺少专业审查的问题；完全接受对方主张也不是合理的风险管理。","ej":"対外的な法的見解＝専門家が判断。Claudeは論点整理"},{"id":"d6-043","d":6,"t":"6.1","n":2,"q":"Claudeの利用として、組織の観点から不適切なものを2つ選べ。","qz":"从组织的角度看，以下Claude用法中不恰当的有哪两个？","o":[{"j":"競合製品の性能について、根拠のない否定的な比較表を作って営業資料に載せる","z":"制作关于竞品性能的无依据负面比较表，放进销售资料"},{"j":"顧客アンケートの自由記述（個人情報を除去済み）をテーマ別に分類する","z":"把已去除个人信息的客户问卷自由回答按主题分类"},{"j":"実在の取引先担当者になりすましたメール文面を作り、相手の反応を探る","z":"制作冒充真实客户负责人的邮件，试探对方反应"},{"j":"公開されている業界ガイドラインの要点を整理し、社内勉強会の資料のたたき台にする","z":"整理公开的行业指南要点，作为内部学习会资料的初稿"},{"j":"会議の議題案と事前に検討すべき論点のリストを作る","z":"制作会议议题草案和需事先讨论的论点清单"}],"a":[0,2],"e":"冒充真实人物属于欺骗，可能违法；无依据的负面比较可能构成不正当竞争或诽谤，也会误导客户。整理公开指南、分类已去标识化的问卷、准备会议议题都是合适的辅助用途。","ej":"なりすまし・根拠のない比較＝不適切"},{"id":"d6-044","d":6,"t":"6.1","n":1,"q":"化学工場の安全担当者が、新しく導入する薬品の取扱手順をClaudeに作らせた。最も適切な扱いはどれか。","qz":"化工厂安全负责人让Claude编写新引进化学品的操作步骤。最合适的处理方式是哪一个？","o":[{"j":"Claudeは化学の知識が豊富なので、出力をそのまま現場に掲示する","z":"Claude化学知识丰富，所以直接把输出张贴到现场"},{"j":"安全に関わる文書なので、構成案や下書きも含めてClaudeの利用は一切禁止する","z":"因为是涉及安全的文件，所以包括结构草案和初稿在内完全禁止使用Claude"},{"j":"手順は詳しいほど安全なので、Claudeにできるだけ細かく長く書かせ、専門家による内容の確認は時間がかかるため省いて現場に掲示する","z":"步骤越详细越安全，所以让Claude尽量写得又细又长，专家确认内容太花时间就省略，直接张贴到现场"},{"j":"SDS（安全データシート）など一次資料と照合し、安全管理の専門家が確認・承認してから使用する","z":"与SDS（安全数据表）等一手资料对照，由安全管理专家确认、批准后使用"}],"a":[3],"e":"安全相关的操作步骤一旦出错可能造成人身伤害，属于高风险内容，必须与 SDS 等一手资料核对，并由专家批准。长不等于安全；完全禁止起草也不必要，关键在于专家把关。","ej":"安全に関わる手順＝一次資料と照合＋専門家の承認"},{"id":"d6-045","d":6,"t":"6.1","n":1,"q":"カスタマーサポートで、返金や補償の可否を含む問い合わせへの返信を、Claudeが作成した文面のまま自動送信する仕組みが提案された。最も適切な判断はどれか。","qz":"客服部门提出一个机制：对涉及退款和赔偿是否可行的咨询，直接自动发送Claude生成的回复。最合适的判断是哪一个？","o":[{"j":"返金・補償など金銭や契約に関わる回答は担当者が確認してから送信し、定型的な案内に限って自動化を検討する","z":"退款、赔偿等涉及金钱和合同的回复，由负责人确认后再发送，仅对定型说明考虑自动化"},{"j":"Claudeは規程を読めば間違えないので、確認は不要である","z":"Claude读了规定就不会出错，所以不需要确认"},{"j":"問い合わせ対応にAIを使うと顧客の信頼を損なうので、下書き作成も含めて利用しない","z":"在咨询应对中使用AI会损害客户信任，因此连起草也不使用"},{"j":"返信が速くなれば顧客満足度が上がるので、返金や補償の案件も含めて、すべての問い合わせでClaudeの文面を自動送信にする","z":"回复变快能提高客户满意度，所以包括退款和赔偿案件在内，所有咨询都自动发送Claude的文案"}],"a":[0],"e":"涉及金钱和合同的回复影响大、难以撤回，需要人工确认。风险低的定型说明可以考虑自动化。全部自动发送或认为“不会出错”忽视了幻觉风险；完全不用则放弃了起草带来的效率。","ej":"金銭・契約に関わる回答＝人が確認してから送信"},{"id":"d6-046","d":6,"t":"6.1","n":2,"q":"AI Fluencyの「Delegation（委任）」の考え方に沿って、Claudeに任せる業務を選ぶ。適切な考え方を2つ選べ。","qz":"按照AI Fluency中“Delegation（委任）”的思路，选择交给Claude的业务。合适的思路有哪两个？","o":[{"j":"任せる範囲を決める際に、Claudeの得意・不得意と業務のリスクの両方を考える","z":"决定交付范围时，同时考虑Claude的擅长/不擅长和业务风险"},{"j":"時間がかかる作業はすべて、内容にかかわらずClaudeに任せる","z":"所有耗时的工作，不论内容都交给Claude"},{"j":"責任の所在が曖昧になるよう、Claudeが作ったことは記録しない","z":"为了让责任归属变得模糊，不记录是Claude做的"},{"j":"人が判断すべき業務も、Claudeの方が速いので任せる","z":"即使是应由人判断的业务，因为Claude更快也交给它"},{"j":"結果を人が検証できる作業や、誤りがあっても修正しやすい作業から任せる","z":"从结果可以由人验证、即使有错也容易修正的工作开始交给它"}],"a":[0,4],"e":"委任的核心是判断“交给 AI 什么、保留给人什么”：要同时考虑 AI 的能力与业务风险，从可验证、易修正的工作开始。只看耗时、为了速度把人的判断交出去，或者故意模糊责任，都违背负责任使用的原则。","ej":"Delegation＝AIの能力×業務リスクで任せる範囲を決める"},{"id":"d6-047","d":6,"t":"6.1","n":1,"q":"新しく施行された業界規制について、社内勉強会のためにClaudeで概要資料を作る。最も適切な進め方はどれか。","qz":"针对新施行的行业法规，为内部学习会用Claude制作概要资料。最合适的做法是哪一个？","o":[{"j":"Claudeの知識だけで概要を作らせ、施行日や条文番号も出力どおりに記載する","z":"只用Claude的知识生成概要，施行日期和条文号也照输出填写"},{"j":"規制の公式文書をClaudeに渡して要点を整理させ、施行日・条文番号など具体的な事実は原文で確認する","z":"把法规的官方文件交给Claude整理要点，施行日期、条文号等具体事实对照原文确认"},{"j":"規制は難しいので、勉強会では扱わない","z":"法规太难，学习会上不讲"},{"j":"要約を短く読みやすくするため、例外規定や経過措置は省略するようClaudeに指示し、原文との照合はせずにそのまま配布する","z":"为了让摘要简短易读，指示Claude省略例外规定和过渡措施，不与原文核对就直接分发"}],"a":[1],"e":"新法规可能在 Claude 的知识截止日期之后，应提供官方原文，并核对日期、条文号等具体事实。只靠模型知识容易出现过时信息或幻觉；省略例外规定可能导致误解，不能不确认就分发。","ej":"新しい規制＝公式文書を渡し、具体的事実は原文で確認"},{"id":"d6-048","d":6,"t":"6.1","n":1,"q":"次のうち、Claudeに任せる前に特に慎重な検討と人による最終判断が必要な用途として、最も適切なものはどれか。","qz":"以下哪一种用途在交给Claude之前，特别需要慎重研究并由人做最终判断？","o":[{"j":"社内イベントのキャッチコピー案を20個出す","z":"为公司内部活动想20条宣传口号"},{"j":"会議の録音の文字起こしを読みやすく整える","z":"把会议录音的转写稿整理得易读"},{"j":"従業員の懲戒処分の要否と処分内容を決める","z":"决定是否对员工进行惩戒处分以及处分内容"},{"j":"社内報の記事の誤字脱字をチェックする","z":"检查内部刊物文章的错别字"}],"a":[2],"e":"惩戒处分对个人的职业和生活影响重大，需要事实确认、公正程序和法律判断，必须由人负责决定，Claude 最多用于整理事实材料。其他三项影响小、容易修正，适合交给 Claude。","ej":"人事上の重大な処分＝人が判断"},{"id":"d6-008","d":6,"t":"6.2","n":1,"q":"顧客の氏名・電話番号・購入履歴を含むCSVをClaudeで分析したい。社内規程では個人情報の外部サービス入力が制限されている。最も適切な行動はどれか。","qz":"想用Claude分析包含客户姓名、电话号码、购买记录的CSV。公司规定限制向外部服务输入个人信息。最恰当的行动是哪一项？","o":[{"j":"規程があるので、分析そのものを中止する","z":"因为有规定，中止分析本身"},{"j":"分析に不要な氏名・電話番号を削除または仮名化してから、規程の範囲で分析する","z":"先删除或假名化分析不需要的姓名和电话号码，再在规定范围内分析"},{"j":"社内分析なのでそのままアップロードしてよい","z":"因为是内部分析，可以直接上传"},{"j":"Claudeに「この情報は分析後すぐに破棄し、記憶しないで」と明確に指示したうえで、そのままアップロードする","z":"明确指示Claude“分析后立即丢弃这些信息，不要记住”后，直接上传"}],"a":[1],"e":"去除或假名化不需要的个人标识符，就能在遵守政策的前提下完成分析（数据最小化）。对模型下“不保存”的指示不能替代政策控制；“内部用途”不豁免规定；在可以匿名化时直接放弃不必要。","ej":"不要な個人識別子は削除・仮名化してから入力"},{"id":"d6-009","d":6,"t":"6.2","n":2,"q":"Claudeに入力する前に、特に慎重な扱い(除去・マスキング・利用可否の確認)が必要な情報を2つ選べ。","qz":"在输入Claude之前，请选出2项需要特别谨慎处理（去除、遮盖、确认是否可用）的信息。","o":[{"j":"一般的なビジネスメールの書き方の質問","z":"关于一般商务邮件写法的提问"},{"j":"Webで公開されている自社製品のカタログ","z":"网上公开的本公司产品目录"},{"j":"従業員の健康診断結果","z":"员工的体检结果"},{"j":"自社が既に公開しているプレスリリースの本文","z":"本公司已经公开的新闻稿正文"},{"j":"顧客のクレジットカード番号","z":"客户的信用卡号"}],"a":[2,4],"e":"信用卡号（支付信息）和体检结果（健康等敏感个人信息）属于高敏感数据，输入前必须去除或确认是否允许。已公开的新闻稿、产品目录和一般性问题风险低。","ej":"決済情報・健康情報は要配慮"},{"id":"d6-010","d":6,"t":"6.2","n":1,"q":"未発表の決算情報を含む資料をClaudeで要約したい。最も適切な対応はどれか。","qz":"想用Claude总结包含未公布财报信息的资料。最恰当的应对是哪一项？","o":[{"j":"個人アカウントのClaudeで、自宅から作業する","z":"用个人账号的Claude在家处理"},{"j":"重要な数字だけ少し変えて入力すれば問題ない","z":"只要把重要数字稍微改一下再输入就没问题"},{"j":"組織が承認した環境(商用プランなど)と社内規程で、その情報区分の入力が許可されているかを確認したうえで利用する","z":"确认在组织批准的环境（如商业版）和公司规定下，是否允许输入该类信息，然后再使用"},{"j":"社内で契約しているClaudeであれば入力内容は社外に一切出ないので、情報区分や社内規程を確認せずに資料全体をそのまま入力してよい","z":"只要是公司签约的Claude，输入内容完全不会外泄，因此不确认信息分类和公司规定就可以直接输入全部资料"}],"a":[2],"e":"内幕/未公开财务信息属于高度机密，应先确认组织批准的环境和信息分类规则是否允许。个人账号绕开组织管控；随意改数字既不可靠又会降低结果价值；不能因为“AI会保密”而忽视数据治理。","ej":"機密区分ごとに承認環境・規程を確認"},{"id":"d6-011","d":6,"t":"6.2","n":1,"q":"商用プラン(Team/Enterprise)と個人プランのデータ取扱いの違いについて、最も適切な説明はどれか。","qz":"关于商业版（Team/Enterprise）与个人版在数据处理上的差异，最恰当的说明是哪一项？","o":[{"j":"個人プランのほうが管理機能が充実している","z":"个人版的管理功能更完善"},{"j":"どちらのプランでも、入力データは必ずモデル学習に使われる","z":"无论哪种方案，输入数据都一定会被用于模型训练"},{"j":"個人プランでも学習利用の設定をオフにすれば商用プランと同じ管理機能が使えるので、業務に使ってよい","z":"个人版只要关闭训练使用设置，就能使用与商业版相同的管理功能，因此可以用于业务"},{"j":"商用プランでは既定で入力データがモデル学習に使われず、管理者による制御機能も提供される","z":"商业版默认不把输入数据用于模型训练，并提供管理员管控功能"}],"a":[3],"e":"商业版（Team/Enterprise/API）默认不将客户数据用于训练，并有SSO、权限、审计等管理功能。个人版则可在设置中选择是否允许用于训练。业务中应使用组织批准的账号。","ej":"商用プランは既定で学習に使われない+管理機能"},{"id":"d6-012","d":6,"t":"6.2","n":1,"q":"欧州の顧客データを扱うプロジェクトでClaudeを使いたい。最も適切な行動はどれか。","qz":"想在处理欧洲客户数据的项目中使用Claude。最恰当的行动是哪一项？","o":[{"j":"GDPRなどの適用規制と社内のデータ保護方針について、法務・情報セキュリティ部門に確認してから利用範囲を決める","z":"就GDPR等适用法规和公司数据保护方针，先向法务和信息安全部门确认，再决定使用范围"},{"j":"データ量が少なければ規制は適用されない","z":"数据量少的话法规就不适用"},{"j":"社内で処理する限り域外移転にはあたらないため、欧州の規制は考慮せず、日本の社内規程と個人情報保護法だけを確認すれば足りると判断する","z":"只要在公司内处理就不算跨境转移，因此不考虑欧洲法规，判断只确认日本的公司规定和个人信息保护法就足够"},{"j":"規制は複雑なので、Claudeに法的判断を任せる","z":"法规复杂，所以把法律判断交给Claude"}],"a":[0],"e":"涉及跨境个人数据时，应与法务/信息安全部门确认适用法规（如GDPR）和公司政策。法规适用取决于数据主体和处理方式，而不是服务国籍；法律判断不能交给AI；数据量少并不能免除法规。","ej":"規制対象データは法務・セキュリティ部門に確認"},{"id":"d6-013","d":6,"t":"6.2","n":1,"q":"同僚との雑談的な相談をClaudeで行う際、会話を履歴やメモリに残したくない。最も適切な機能はどれか。","qz":"在用Claude进行类似闲聊的咨询时，不想让对话留在历史记录和记忆中。最合适的功能是哪一项？","o":[{"j":"シークレットチャット(Incognito chat)","z":"无痕聊天（Incognito chat）"},{"j":"Artifacts","z":"Artifacts"},{"j":"個人用のProjectを作成し、指示に「この会話は記憶しないで」と書く","z":"创建个人Project，在指示中写“不要记住这个对话”"},{"j":"Research(リサーチ)","z":"Research（研究）"}],"a":[0],"e":"无痕聊天不会保存到聊天历史，也不会被记忆功能引用。但它不等于可以输入机密信息，组织政策依然适用（团队/企业版仍可能出现在数据导出中）。在Project指示里写“不要记住”并不能阻止记录保存；Research、Artifacts与此目的无关。","ej":"履歴・メモリに残さない→シークレットチャット"},{"id":"d6-014","d":6,"t":"6.2","n":2,"q":"Google Driveコネクタを部署で使い始める。データ保護の観点で適切な運用を2つ選べ。","qz":"部门开始使用Google Drive连接器。从数据保护角度，请选出2项恰当的运营方式。","o":[{"j":"業務に必要な範囲のフォルダ・権限に限定して接続する(最小権限)","z":"只连接业务所需范围的文件夹和权限（最小权限）"},{"j":"コネクタ経由なら個人情報の規程は適用されない","z":
