d3-028","d":3,"t":"3.1","n":1,"q":"アソシエイトが、社内の複雑なシステム連携（APIを使った自動化パイプライン）をClaudeで構築したいという依頼を受けた。自身はAPI開発の経験がない。最も適切な対応はどれか。","qz":"Associate 收到请求：要用 Claude 构建公司内部复杂的系统联动（使用 API 的自动化流水线）。本人没有 API 开发经验。最合适的应对是哪一个？","o":[{"j":"Claudeにコードを書かせ、検証せずに本番環境へ導入する","z":"让 Claude 写代码，不经验证就上线到生产环境"},{"j":"依頼を断り、理由も伝えない","z":"拒绝请求，也不说明理由"},{"j":"要件と業務上の目的を整理したうえで、Claude DeveloperやArchitectなど技術担当にエスカレーションする","z":"整理好需求和业务目的后，升级给 Claude Developer 或 Architect 等技术负责人"},{"j":"Researchで調べた手順通りに自分で本番構築する","z":"按 Research 查到的步骤自己搭建生产环境"}],"a":[2],"e":"Associate 的职责包括识别局限并把复杂/技术性的实现升级给 Architect 和 Developer。可以先用 Claude 整理需求、用例和业务目的，帮助后续交接。A、D 缺乏验证与专业审查，风险高；B 放弃了 Associate 可以贡献的价值。","ej":"API連携・エージェント設計 → Developer/Architectへエスカレーション"},{"id":"d3-006","d":3,"t":"3.2","n":1,"q":"Claudeのモデルファミリー（Haiku・Sonnet・Opus）に関する説明として、最も適切なものはどれか。","qz":"关于 Claude 模型家族（Haiku、Sonnet、Opus）的说明，最合适的是哪一个？","o":[{"j":"Haikuは最も高性能で、複雑な推論に最適である","z":"Haiku 性能最高，最适合复杂推理"},{"j":"3つのモデルは性能もコストも同じで、名前が違うだけである","z":"三个模型性能和成本都一样，只是名字不同"},{"j":"Haikuは高速・低コスト、Sonnetはバランス型、Opusは最も高性能で複雑なタスク向けである","z":"Haiku 快速低成本，Sonnet 均衡型，Opus 性能最高、适合复杂任务"},{"j":"Opusは最も高速かつ低コストで、大量処理に向く","z":"Opus 最快且成本最低，适合大批量处理"}],"a":[2],"e":"基本定位：Haiku＝快、便宜、适合大量简单任务；Sonnet＝性能与成本平衡，日常业务的标准选择；Opus＝最强，适合复杂推理和长的多步骤任务，但更贵更慢。A、D 把 Haiku 与 Opus 的特点颠倒；B 错误。","ej":"Haiku＝速い・安い／Sonnet＝バランス／Opus＝最高性能"},{"id":"d3-007","d":3,"t":"3.2","n":1,"q":"法務部門が、複数の契約書の条項間の矛盾を洗い出し、リスクの影響を多段階で推論して整理する作業を依頼したい。件数は少なく、精度が最優先である。最も適切なモデル選択はどれか。","qz":"法务部门想委托一项工作：找出多份合同条款之间的矛盾，并对风险影响进行多步推理整理。件数少，精度最优先。最合适的模型选择是哪一个？","o":[{"j":"最も高性能なモデル（Opus）を使い、必要に応じて拡張思考も有効にする","z":"使用性能最高的模型（Opus），必要时开启扩展思考"},{"j":"最も安いモデルを使い、出力は確認せずにそのまま使う","z":"用最便宜的模型，不检查直接使用输出"},{"j":"速度が最優先なので最速のモデルを使う","z":"速度最优先，所以用最快的模型"},{"j":"モデルの違いは無関係なので何でもよい","z":"模型差异无关，用哪个都行"}],"a":[0],"e":"复杂、多步推理、件数少、精度第一 —— 正是最高性能模型 + 扩展思考的使用场景，多花的时间和成本是值得的。B 低成本模型在这里风险大，而且法律输出必须人工确认；C 本题优先的是精度不是速度；D 模型能力确有差异。","ej":"少量・複雑・精度最優先 → Opus（＋拡張思考）"},{"id":"d3-019","d":3,"t":"3.2","n":1,"q":"あるチームが「最も高性能なモデルを使えば、ハルシネーションは起きないので出力確認は不要」と考えている。この考えに対する最も適切な評価はどれか。","qz":"某团队认为“只要用性能最高的模型就不会出现幻觉，所以无需检查输出”。对此最合适的评价是哪一个？","o":[{"j":"誤り。上位モデルでも誤りは起こり得るため、重要な出力は検証が必要である","z":"错误。即使是高级模型也可能出错，重要输出仍需验证"},{"j":"正しい。上位モデルは誤りを出さない","z":"正确。高级模型不会出错"},{"j":"正しい。ただし拡張思考をオンにした場合に限る","z":"正确。但仅限于开启扩展思考时"},{"j":"誤り。上位モデルは下位モデルより常に誤りが多い","z":"错误。高级模型总是比低级模型错误更多"}],"a":[0],"e":"更强的模型可以降低出错率，但任何模型都可能产生幻觉，尤其是具体数字、引用、条文号。重要输出必须用一次信息源验证。B、C 过度信任；D 说法也不正确。","ej":"どのモデルでもハルシネーションは起こり得る"},{"id":"d3-023","d":3,"t":"3.2","n":1,"q":"新しいClaudeモデルが発表され、チームで標準モデルを切り替えるか検討している。最も適切な進め方はどれか。","qz":"新的 Claude 模型发布了，团队在考虑是否切换标准模型。最合适的推进方式是哪一个？","o":[{"j":"新しいモデルは必ず全てで優れているので、即日全業務を切り替える","z":"新模型一定全面更好，当天切换全部业务"},{"j":"変化を避けるため、新モデルは一切試さない","z":"为避免变化，完全不尝试新模型"},{"j":"代表的な業務タスクで現行モデルと比較評価し、品質・速度・コストを確認してから切り替える","z":"用代表性业务任务与现行模型比较评估，确认质量、速度、成本后再切换"},{"j":"発表記事の評判だけで判断する","z":"只凭发布文章的评价来判断"}],"a":[2],"e":"切换前用自己业务的代表性任务做对比，确认质量、速度、成本是否满足要求，再分阶段切换。A 风险大；B 失去改进机会；D 公开评价不一定反映自己的业务。","ej":"モデル変更は自社タスクで比較評価してから"},{"id":"d3-030","d":3,"t":"3.2","n":1,"q":"短納期で、数百件の商品説明文を一定のテンプレートに沿って生成する必要がある。内容は単純だが、ブランド表記のルールを守る必要がある。最も適切な進め方はどれか。","qz":"交期很短，需要按固定模板生成几百条商品说明。内容简单，但必须遵守品牌书写规则。最合适的推进方式是哪一个？","o":[{"j":"最上位モデルで1件ずつ時間をかけて生成する","z":"用最高级模型逐条花时间生成"},{"j":"テンプレートやルールは示さず、モデルの判断に任せる","z":"不给模板和规则，交给模型自行判断"},{"j":"高速・低コストのモデルに、テンプレートとブランドルールを明示して生成させ、サンプルを確認してから全件処理する","z":"给快速低成本模型明确提供模板和品牌规则，先检查样例，再处理全部"},{"j":"生成後の確認は一切行わない","z":"生成后完全不检查"}],"a":[2],"e":"大量且简单 → 快速低成本模型；用明确的模板和规则保证一致性；先小样本检查再批量，能及早发现问题。A 慢且贵；B 无法保证品牌规则；D 缺少质量把关。","ej":"大量定型 → 高速モデル＋明確なルール＋サンプル確認"},{"id":"d3-008","d":3,"t":"3.3","n":1,"q":"カスタマーサポート部門が、毎日数千件届く問い合わせを「請求」「技術」「その他」の3カテゴリに振り分けたい。各判定は単純で、処理速度とコストが重要である。最も適切な選択はどれか。","qz":"客服部门想把每天上千条咨询分为“账单”“技术”“其他”三类。每次判定都很简单，处理速度和成本很重要。最合适的选择是哪一个？","o":[{"j":"全件を最も高性能なモデルで処理し、品質を最大化する","z":"全部用性能最高的模型处理，追求质量最大化"},{"j":"Research機能で1件ずつ調べさせる","z":"用 Research 功能逐条调查"},{"j":"拡張思考を常にオンにして慎重に判定させる","z":"始终开启扩展思考，让它谨慎判定"},{"j":"高速・低コストのモデル（Haiku）を使い、サンプルで精度を定期確認する","z":"使用快速低成本的模型（Haiku），并定期抽样检查准确率"}],"a":[3],"e":"大量、简单、重视速度和成本 → 选快速低成本模型，同时用抽样检查确认分类质量。A 浪费成本和时间；C 扩展思考增加延迟和 token，对简单分类没必要；B Research 用于多来源调查，完全不适合。","ej":"大量・単純・速度とコスト重視 → Haiku＋抽出確認"},{"id":"d3-009","d":3,"t":"3.3","n":1,"q":"営業企画チームが日常的に行う、議事録の要約・メール文案の作成・資料の構成案づくりに使う標準モデルを決めたい。品質とコスト・速度のバランスを重視する。最も適切なのはどれか。","qz":"营业企划团队想决定日常用于会议纪要摘要、邮件草稿、资料结构草案的标准模型。重视质量与成本、速度的平衡。最合适的是哪一个？","o":[{"j":"常にOpusを使う。品質以外は考慮しなくてよい","z":"始终用 Opus，除了质量不用考虑别的"},{"j":"常にHaikuを使う。品質は問わない","z":"始终用 Haiku，不在乎质量"},{"j":"毎回ランダムにモデルを選ぶ","z":"每次随机选择模型"},{"j":"バランス型のSonnetを標準とし、特に難しい案件だけ上位モデルに切り替える","z":"以均衡型 Sonnet 为标准，只有特别难的案子才切换到更高级的模型"}],"a":[3],"e":"日常知识工作以平衡型 Sonnet 为默认，遇到复杂任务再升级到 Opus、遇到大批量简单任务再降到 Haiku，这就是“按任务需求匹配模型”。A 成本和速度浪费；B 对写作类质量要求可能不足；C 没有依据。","ej":"日常業務の標準 → Sonnet、難題だけ上位へ"},{"id":"d3-010","d":3,"t":"3.3","n":2,"q":"モデル選択の考え方として適切なものを2つ選べ。","qz":"关于模型选择的思路，请选出 2 个合适的。","o":[{"j":"コストは利用部門の問題なので、モデル選択では考慮しない","z":"成本是使用部门的事，选模型时不考虑"},{"j":"最も高価なモデルなら必ず全てのタスクで最良の結果になるので、迷ったら常に最上位を選ぶ","z":"最贵的模型在所有任务上一定最好，犹豫时总是选最高级"},{"j":"小規模なテストで品質を確認し、十分なら低コストのモデルを採用する","z":"先小规模测试质量，如果足够就采用低成本模型"},{"j":"タスクの複雑さ・量・求められる速度・予算を考慮して選ぶ","z":"综合考虑任务复杂度、数量、所需速度和预算来选择"},{"j":"一度決めたモデルは、業務内容が変わっても見直さない","z":"一旦确定的模型，即使业务内容变化也不重新评估"}],"a":[2,3],"e":"正确：D 按复杂度、量、速度、预算匹配；C 先小规模验证，够用就选便宜的，是平衡质量与成本的实践。错误：B 对简单大量任务，顶级模型浪费成本和延迟，并不“必然最好”；E 业务变化时应重新评估；A 成本是模型选择的核心要素之一。","ej":"要件（複雑さ・量・速度・コスト）に合わせ、テストで検証"},{"id":"d3-011","d":3,"t":"3.3","n":1,"q":"拡張思考（Extended thinking）の利用に関する説明として、最も適切なものはどれか。","qz":"关于扩展思考（Extended thinking）的使用，最合适的说明是哪一个？","o":[{"j":"どんなタスクでも常にオンにすべきで、デメリットはない","z":"任何任务都应始终开启，没有缺点"},{"j":"オンにすると出力が必ず事実として正しくなるため、検証は不要になる","z":"开启后输出一定符合事实，因此不需要验证"},{"j":"コストを下げるための機能である","z":"这是用来降低成本的功能"},{"j":"複雑な推論や分析で精度向上が期待できるが、応答時間とトークン消費が増える","z":"在复杂推理和分析中有望提高准确度，但响应时间和 token 消耗会增加"}],"a":[3],"e":"扩展思考让模型在回答前进行更多推理，适合复杂分析、数学、多条件判断；代价是更慢、消耗更多 token。A 简单任务没必要；B 推理更深不等于事实保证，仍需验证；C 它会增加而不是降低成本。","ej":"拡張思考＝精度↑、時間・トークン↑。検証は依然必要"},{"id":"d3-020","d":3,"t":"3.3","n":1,"q":"短い社内チャット返信の下書きを大量に作るため最速モデルを使っていたが、一部の複雑な技術的問い合わせへの回答品質が不十分だと分かった。最も適切な改善策はどれか。","qz":"为了大量制作简短的内部聊天回复草稿而使用最快的模型，但发现部分复杂技术咨询的回答质量不足。最合适的改进方案是哪一个？","o":[{"j":"単純な問い合わせは高速モデルのまま、複雑な問い合わせだけ上位モデルに振り分ける","z":"简单咨询继续用快速模型，只把复杂咨询分配给更高级的模型"},{"j":"品質問題は無視して速度を優先し続ける","z":"无视质量问题，继续优先速度"},{"j":"全件を最上位モデルに切り替える","z":"全部切换到最高级模型"},{"j":"Claudeの利用をやめる","z":"停止使用 Claude"}],"a":[0],"e":"按任务难度分流：多数简单任务维持低成本高速模型，少数复杂任务升级。这样同时兼顾成本与质量。C 成本大增且对简单任务无益；B 放任质量问题；D 过度反应。","ej":"難易度で振り分け：単純→高速モデル、複雑→上位モデル"},{"id":"d3-027","d":3,"t":"3.3","n":2,"q":"コスト・速度・品質のトレードオフに関する記述として適切なものを2つ選べ。","qz":"关于成本、速度、质量的权衡，请选出 2 个合适的说法。","o":[{"j":"どのタスクでも最安モデルが最も費用対効果が高い","z":"无论什么任务，最便宜的模型性价比都最高"},{"j":"速度が必要な場面でも、常に拡張思考をオンにすべきである","z":"即使需要速度的场合，也应始终开启扩展思考"},{"j":"モデルの選択は出力品質に影響しない","z":"模型选择不影响输出质量"},{"j":"上位モデルは一般に高性能だが、コストが高く応答も遅めになりやすい","z":"高级模型一般性能更高，但成本更高、响应也往往更慢"},{"j":"タスクの重要度や難易度に応じてモデルを使い分けることで、全体のコストと品質を最適化できる","z":"根据任务的重要性和难度区分使用模型，可以优化整体成本和质量"}],"a":[3,4],"e":"正确：D 高级模型＝更强但更贵更慢；E 按重要度/难度分配模型实现整体最优。错误：A 复杂任务用最便宜模型可能需要大量返工，性价比反而低；C 模型选择明显影响质量；B 扩展思考会增加延迟。","ej":"上位＝高性能・高コスト・遅め／使い分けで最適化"},{"id":"d3-012","d":3,"t":"3.4","n":1,"q":"同じチャットで数時間にわたり企画書を練り上げてきたところ、Claudeが序盤に合意した前提を忘れたり、応答が遅くなったりしてきた。最も適切な対処はどれか。","qz":"在同一个对话里花了几个小时打磨企划书，Claude 开始忘记前面达成一致的前提，响应也变慢。最合适的处理是哪一个？","o":[{"j":"Claudeは長い会話でも全てを完全に覚えているので、気のせいとして続ける","z":"Claude 在长对话中也能完全记住一切，当作错觉继续"},{"j":"同じチャットで「前提を忘れないで」と繰り返し入力し続ける","z":"在同一对话里不断重复输入“不要忘记前提”"},{"j":"これまでの合意事項と現状を要約させ、その要約を使って新しいチャットで再開する","z":"让它总结至今为止的共识和现状，用这份摘要在新对话中重新开始"},{"j":"最初から全てをやり直し、これまでの成果は破棄する","z":"从头全部重来，丢弃之前的成果"}],"a":[2],"e":"对话变长会占满上下文窗口，导致早期信息被淡化、质量下降、速度变慢。标准做法：让 Claude 总结要点 → 在新对话中带着摘要重新开始。B 继续加长对话会让问题更严重；A 前提错误；D 没必要丢弃成果。","ej":"長い会話で劣化 → 要約して新しいチャットで再開"},{"id":"d3-013","d":3,"t":"3.4","n":1,"q":"コンテキストウィンドウの説明として最も適切なものはどれか。","qz":"关于上下文窗口（context window），最合适的说明是哪一个？","o":[{"j":"Claudeが一度に扱える作業記憶で、指示・アップロードしたファイル・会話履歴などがこの中に収まる必要がある","z":"Claude 一次能处理的工作记忆，指令、上传文件、对话历史等都需要容纳在其中"},{"j":"Claudeがインターネット上で検索できる範囲のこと","z":"Claude 可以在互联网上搜索的范围"},{"j":"ユーザーが保存できるチャットの数の上限","z":"用户可以保存的对话数量上限"},{"j":"Claudeが過去の全ユーザーとの会話を記憶する領域","z":"Claude 记住所有用户过去对话的区域"}],"a":[0],"e":"上下文窗口是模型单次处理时的“工作记忆”，项目指令、文件、整段对话历史、当前回答都在其中，超过或接近上限就会出现遗忘或无法继续。B 是 Web 搜索；C 与对话数量无关；D 模型不会跨用户记忆。","ej":"コンテキスト＝一度に扱える作業記憶（指示＋ファイル＋履歴）"},{"id":"d3-014","d":3,"t":"3.4","n":1,"q":"プロジェクトマネージャーが、毎回のチャットで「私はPMで、報告は箇条書き3点以内、敬体で」と説明している。この恒常的な好みを毎回伝える手間を省きたい。最も適切なのはどれか。","qz":"项目经理每次对话都要说明“我是 PM，汇报最多 3 个要点，用敬体”。想省去每次传达这些固定偏好的麻烦。最合适的是哪一个？","o":[{"j":"毎回チャットの最後に同じ説明を貼り付け続ける","z":"每次都在对话最后粘贴同样的说明"},{"j":"恒常的な好みはメモリや該当Projectの指示に持たせ、新しいチャットでも反映されるようにする","z":"把固定偏好放进记忆功能或对应 Project 的指令，使新对话也能体现"},{"j":"一つのチャットを永遠に使い続け、新しいチャットは開かない","z":"永远只用一个对话，不开新对话"},{"j":"シークレットチャットを使う","z":"使用无痕对话"}],"a":[1],"e":"长期不变的偏好应“持久化”：放在记忆（Memory）或 Project 指令中，每次新对话自动生效。A 低效易漏；C 会让上下文无限变长、质量下降；D 无痕对话不使用也不保存记忆，正好相反。","ej":"恒常的な情報 → メモリ／Project指示に永続化"},{"id":"d3-015","d":3,"t":"3.4","n":1,"q":"従業員が、社外秘の人事評価に関するブレインストーミングを、今後のメモリや会話履歴に残さない形で一時的に行いたい（組織ポリシー上、Claudeの利用自体は許可されている）。最も適切な機能はどれか。","qz":"员工想临时进行一次关于内部保密人事评价的头脑风暴，且不希望留在今后的记忆和对话历史中（按组织政策，使用 Claude 本身是允许的）。最合适的功能是哪一个？","o":[{"j":"Projectを作り、評価資料を全てナレッジに入れる","z":"建一个 Project，把评价资料全部放入知识库"},{"j":"シークレットチャット（インコグニート）を使う","z":"使用无痕对话（Incognito）"},{"j":"メモリに「この内容は忘れて」と書き込んでおく","z":"在记忆里写上“忘掉这些内容”"},{"j":"Research機能を使う","z":"使用 Research 功能"}],"a":[1],"e":"无痕对话不会保存到历史，也不会用于或写入记忆，适合不想留痕的临时讨论。A 会让资料长期留在项目里，与目的相反；C 不是可靠的控制方式；D 与留痕问题无关。注意：无痕不等于可以无视组织的数据政策。","ej":"履歴・メモリに残さない一時的な会話 → シークレットチャット"},{"id":"d3-016","d":3,"t":"3.4","n":2,"q":"長期にわたるプロジェクトで、コンテキストの制限を踏まえた情報管理として適切なものを2つ選べ。","qz":"在长期项目中，考虑上下文限制的信息管理方式，请选出 2 个合适的。","o":[{"j":"全ての作業を1つのチャットに集約し、決して新しいチャットを開かない","z":"所有工作集中在一个对话里，绝不开新对话"},{"j":"重要な決定事項や前提は、定期的に要約してProjectナレッジや指示に反映する","z":"定期总结重要决定和前提，并反映到 Project 知识库或指令中"},{"j":"関係のない大容量ファイルも念のため全て会話にアップロードしておく","z":"把无关的大文件也全部上传到对话中以防万一"},{"j":"話題が大きく変わるときは、新しいチャットを開始する","z":"话题发生大变化时开启新对话"},{"j":"Claudeは自動で全てを永久に記憶するので、管理は不要である","z":"Claude 会自动永久记住一切，不需要管理"}],"a":[1,3],"e":"正确：B 把需要长期保持的信息持久化到项目中；D 话题切换时开新对话，避免无关历史占用上下文。错误：A 对话越长越容易劣化；C 无关大文件浪费上下文、干扰回答；E 上下文有上限，记忆也不是全部永久保存。","ej":"要約して永続化／話題が変われば新チャット"},{"id":"d3-022","d":3,"t":"3.4","n":1,"q":"メモリ機能について、組織のTeamプランで利用者が「メモリの設定が見当たらない」と言っている。最も考えられる理由はどれか。","qz":"关于记忆功能，组织 Team 方案的用户说“找不到记忆设置”。最可能的原因是哪一个？","o":[{"j":"Teamプランではメモリ機能が存在しない","z":"Team 方案根本没有记忆功能"},{"j":"利用者がシークレットチャットを一度でも使うと永久に無効化される","z":"用户只要用过一次无痕对话就会永久失效"},{"j":"Team/Enterpriseでは、メモリは管理者が組織で有効化する必要があり、まだ有効化されていない可能性がある","z":"在 Team/Enterprise 中，记忆需要管理员在组织层面开启，可能尚未开启"},{"j":"メモリはモデルをHaikuにすると表示される","z":"把模型换成 Haiku 才会显示记忆"}],"a":[2],"e":"个人方案记忆默认开启；Team/Enterprise 需要组织管理员先启用。用户看不到设置，应联系管理员确认组织设置。A 错误，功能存在；B、D 都不是事实。","ej":"Team/Enterpriseのメモリは管理者が有効化"},{"id":"d3-025","d":3,"t":"3.4","n":1,"q":"大量の資料を1つのチャットにアップロードしたところ、「会話が長すぎる」旨の表示が出て続行できなくなった。最も適切な対応はどれか。","qz":"在一个对话中上传了大量资料后，出现“对话过长”的提示，无法继续。最合适的处理是哪一个？","o":[{"j":"資料を関連するものに絞る・分割して扱う、または継続利用ならProjectナレッジに置いて検索で参照させる","z":"把资料缩减为相关部分或拆分处理；如果要持续使用，就放进 Project 知识库让它通过检索参照"},{"j":"同じファイルを何度も再アップロードする","z":"反复重新上传同样的文件"},{"j":"Claudeは長さに制限がないので、時間をおいて再送する","z":"Claude 没有长度限制，过一会儿重发"},{"j":"資料の内容を想像で補ってもらう","z":"让它凭想象补全资料内容"}],"a":[0],"e":"达到上下文上限时，应减少放入的内容（只放相关部分、分批处理），长期使用的资料放进 Project 知识库，资料多时会自动切换到检索方式（RAG）。B、C 不解决根本问题；D 会导致幻觉。","ej":"上限到達 → 絞る・分割する・Projectナレッジ（RAG）へ"},{"id":"d3-029","d":3,"t":"3.4","n":1,"q":"利用者が「Claudeが以前の会話内容を覚えていて驚いた。どこで管理できるのか」と尋ねている。最も適切な案内はどれか。","qz":"用户问：“Claude 记得之前的对话内容，让我很吃惊。在哪里可以管理？”最合适的说明是哪一个？","o":[{"j":"アカウントを削除する以外に方法はない","z":"除了删除账号没有其他办法"},{"j":"一度記憶された内容は利用者には管理できない","z":"一旦被记住，用户无法管理"},{"j":"設定のメモリ関連項目から、記憶内容の確認・編集や、メモリ・過去チャット参照の無効化ができる","z":"可以在设置中的记忆相关项目查看、编辑记忆内容，或关闭记忆和过往对话参照"},{"j":"Claudeは過去の会話を覚えることはない","z":"Claude 从不记住过去的对话"}],"a":[2],"e":"记忆功能是透明可控的：用户可以在设置中查看和编辑记忆、关闭记忆或“搜索并参照过往对话”。B、A 不正确；D 记忆和过往对话搜索功能确实存在。","ej":"メモリは設定で確認・編集・無効化できる"},{"id":"d4-001","d":4,"t":"4.1","n":1,"q":"営業部門から「Claudeで何か効率化したい」という漠然とした相談を受けた。最初に行うべきこととして最も適切なものはどれか。","qz":"销售部门提出了“想用Claude提高点效率”这种模糊的咨询。最先应该做的事情，最合适的是哪一项？","o":[{"j":"最も高性能なモデルを全員に配布し、使いながら各自で効率化できる業務を見つけてもらう","z":"给所有人分配最高性能的模型，让每个人在使用中自己找到能提效的业务"},{"j":"まずAPI連携による営業支援の自動化システムを外注し、要件は稼働後に調整する","z":"先外包基于API对接的销售支持自动化系统，需求在上线后再调整"},{"j":"現在の業務フローと時間のかかっている作業を洗い出し、課題と成功指標を明確にする","z":"梳理当前的业务流程和耗时的工作，明确课题和成功指标"},{"j":"他社の事例をそのまま導入する","z":"直接照搬其他公司的案例"}],"a":[2],"e":"导入前先做需求分析：明确现状流程、痛点和衡量成功的指标，才能判断Claude适合用在哪里。直接发高端模型没有目标；照搬他社案例不一定符合本部门；一上来就做API系统超出了Associate的范围，也未确认需求。","ej":"まず現状業務と課題・成功指標を明確化"},{"id":"d4-002","d":4,"t":"4.1","n":1,"q":"人事担当者が、採用面接の議事メモから候補者の評価サマリーを作るユースケースを検討している。Claudeの適用可否を判断するうえで最も重要な観点はどれか。","qz":"人事负责人在考虑一个用例：根据招聘面试的会议笔记生成候选人评价摘要。判断是否适用Claude时，最重要的观点是哪一项？","o":[{"j":"出力の文字数をどれだけ減らせるか","z":"能把输出的字数减少多少"},{"j":"候補者に知らせずに処理できるかどうか","z":"能否在不告知候选人的情况下处理"},{"j":"個人情報の扱いに関する社内規程への適合と、最終判断を人が行う体制があるか","z":"是否符合关于个人信息处理的公司规定，以及是否有由人来做最终判断的体制"},{"j":"Claudeが評価基準に沿って採否を自動決定し、面接官の負担をなくせるかどうか","z":"Claude能否按评价标准自动决定录用与否，从而消除面试官的负担"}],"a":[2],"e":"招聘涉及个人信息和对人的重大决定，评估用例时首先要看数据处理是否合规、以及是否保留人的最终判断。让AI自动决定录用属于高风险用法；字数不是核心；不告知候选人违背透明性。","ej":"人に影響する判断は人が最終決定・個人情報規程に適合"},{"id":"d4-003","d":4,"t":"4.1","n":2,"q":"マーケティングチームがClaude活用候補の業務を挙げた。Claudeに適した候補として適切なものを2つ選べ。","qz":"市场团队列出了Claude的候选应用业务。请选出2项适合Claude的候选。","o":[{"j":"キャンペーン案のブレインストーミングと複数案の比較","z":"活动方案的头脑风暴及多方案比较"},{"j":"リアルタイムの株価に基づく自動発注","z":"基于实时股价的自动下单"},{"j":"顧客アンケートの自由記述回答のテーマ分類と要約","z":"客户问卷自由回答的主题分类和摘要"},{"j":"正式な広告予算の最終承認","z":"正式广告预算的最终审批"},{"j":"法的契約書への代表者署名","z":"在法律合同上代表人签字"}],"a":[0,2],"e":"头脑风暴和大量文本的分类摘要是Claude擅长的增强型任务。预算最终审批、合同签字属于需要人负责的决策；基于实时股价自动下单既需要实时数据又是高风险自动化，不适合Associate层面的Claude使用。","ej":"発想支援・大量テキスト整理は得意、承認・署名は人"},{"id":"d4-004","d":4,"t":"4.1","n":1,"q":"Claudeを使って新しい社内問い合わせ対応フローを設計したい。要件定義の段階でClaudeを最も効果的に使う方法はどれか。","qz":"想用Claude设计新的内部咨询应对流程。在需求定义阶段最有效使用Claude的方法是哪一项？","o":[{"j":"過去の問い合わせ例と制約条件を渡し、関係者・要件・抜け漏れの論点を洗い出させてから人が確認する","z":"提供过去的咨询案例和约束条件，让它梳理相关方、需求和遗漏点，然后由人确认"},{"j":"網羅的なシステム仕様書をClaudeに一度で作らせ、時間短縮のため開発会社へそのまま送付する","z":"让Claude一次性生成全面的系统规格书，为节省时间直接发给开发公司"},{"j":"要件定義は人だけで行い、Claudeは文章校正だけに使う","z":"需求定义只由人来做，Claude只用于文字校对"},{"j":"「良いフローを作って」とだけ依頼し、出てきた案をそのまま採用する","z":"只说“做一个好的流程”，直接采用给出的方案"}],"a":[0],"e":"在需求分析中，给Claude足够的背景（过去案例、约束），让它帮忙整理相关方、需求和遗漏点，再由人审核，是典型的增强用法。只给模糊指令得到的方案质量不可控；只用于校对浪费能力；未经审核直接发出规格书风险大。","ej":"背景を渡して論点洗い出し→人が確認"},{"id":"d4-005","d":4,"t":"4.1","n":1,"q":"ある業務について、Claudeで自動化すべきか、人の作業を支援(拡張)すべきかを判断したい。拡張(Augmentation)のほうが適している業務の特徴はどれか。","qz":"想判断某项业务应该用Claude自动化，还是用来辅助（增强）人的工作。哪一项特征说明更适合“增强”？","o":[{"j":"担当者がまったく関与したくない作業","z":"负责人完全不想参与的工作"},{"j":"誤りがあっても影響がほとんどない定型作業","z":"即使出错也几乎没有影响的固定作业"},{"j":"判断に文脈や専門知識が必要で、結果の責任を人が負う業務","z":"判断需要上下文和专业知识，且由人对结果负责的业务"},{"j":"毎回同じ形式で入力され、判定ルールが明確に文書化されている大量の定型処理","z":"每次以相同格式输入、判定规则已明确文档化的大量定型处理"}],"a":[2],"e":"AI Fluency中区分Automation（自动化）和Augmentation（增强）。需要专业判断、责任在人的业务适合人与AI协作的增强模式。规则明确的大量处理、低影响定型作业更适合自动化；“不想参与”不是判断依据。","ej":"専門判断・人が責任→Augmentation"},{"id":"d4-006","d":4,"t":"4.1","n":1,"q":"教育担当者が、研修資料作成にClaudeを導入する効果を事前に見積もりたい。最も適切な進め方はどれか。","qz":"培训负责人想事先估算在培训资料制作中导入Claude的效果。最合适的推进方式是哪一项？","o":[{"j":"全資料を一斉に切り替えてから効果を考える","z":"所有资料一次性切换后再考虑效果"},{"j":"ベンダーや他社の公開事例にある平均削減率を引用し、自部署の資料数を掛けて効果を算出する","z":"引用供应商或他社公开案例中的平均削减率，乘以本部门资料数计算效果"},{"j":"一部の資料で試行し、作成時間と品質(レビュー指摘数など)を従来と比較する","z":"在部分资料上试行，比较制作时间和质量（如审核指出数）与以往的差异"},{"j":"効果測定は不要なので、利用者数だけ数える","z":"不需要效果测定，只统计用户数"}],"a":[2],"e":"小规模试点（パイロット）并用时间和质量等指标与基线比较，是评估用例价值的标准做法。供应商数据不代表自己的环境；一次性全量切换风险大；仅统计用户数无法说明价值。","ej":"小さく試行し、時間・品質をベースラインと比較"},{"id":"d4-007","d":4,"t":"4.1","n":1,"q":"経理部が「月次の請求書データをClaudeで照合したい」と相談してきた。データは社内会計システムに数万件あり、毎日更新される。Associateとして最も適切な対応はどれか。","qz":"财务部咨询“想用Claude核对每月的发票数据”。数据在公司会计系统中有数万条，每天更新。作为Associate最合适的应对是哪一项？","o":[{"j":"サンプルデータで照合ルールの整理や例外パターン分析を支援しつつ、システム連携による本格自動化は開発者・アーキテクトに相談する","z":"用样本数据协助整理核对规则和分析例外模式，同时把基于系统对接的正式自动化交给开发者/架构师商量"},{"j":"会計システムの管理者アカウントを共有してもらい、Claudeから直接全データを参照できるようにして照合を自動化する","z":"让对方共享会计系统管理员账号，使Claude能直接参照全部数据并自动核对"},{"j":"毎日すべてのデータをチャットに貼り付ける運用を提案する","z":"建议每天把所有数据粘贴到聊天中的运作方式"},{"j":"照合は不可能だと伝えて検討を終える","z":"告知无法核对并结束讨论"}],"a":[0],"e":"大规模、每日更新、与系统集成的自动化超出Associate范围，应升级给Developer/Architect；但Associate可以在样本层面帮助梳理规则。每天手动粘贴数万条不现实且易错；直接放弃不必要；共享管理员密码违反安全原则。","ej":"大規模なシステム連携は開発者・アーキテクトへエスカレーション"},{"id":"d4-008","d":4,"t":"4.2","n":1,"q":"新規市場への参入を検討するため、複数の公開情報源から競合動向をまとめたい。最も適したClaudeの機能はどれか。","qz":"为了研究进入新市场，想从多个公开信息源汇总竞争对手动态。最适合的Claude功能是哪一项？","o":[{"j":"Research(リサーチ)機能で、引用付きの調査レポートを作成させる","z":"用Research（研究）功能，生成带引用的调研报告"},{"j":"スタイル設定を「簡潔」に変える","z":"把风格设置改为“简洁”"},{"j":"通常のチャットでOpusに競合の動向を質問し、学習済みの知識の範囲でまとめさせる","z":"在普通聊天中向Opus询问竞争动向，让它在已学习知识的范围内汇总"},{"j":"Haikuに一文で答えさせる","z":"让Haiku用一句话回答"}],"a":[0],"e":"需要跨多个信息源、多步检索并带出处的调研，正适合Research功能。只凭模型已学习的知识无法保证信息最新且没有出处；风格设置与信息收集无关；一句话回答无法满足综合调研。","ej":"多数の情報源・引用付き調査→Research"},{"id":"d4-009","d":4,"t":"4.2","n":1,"q":"プロジェクトマネージャーが、3か月の社内システム移行計画をClaudeと一緒に作りたい。最も効果的な依頼方法はどれか。","qz":"项目经理想和Claude一起制定3个月的内部系统迁移计划。最有效的委托方式是哪一项？","o":[{"j":"目的、期限、関係部署、制約(予算・停止可能時間など)を伝え、まずフェーズ分けとリスクを出させてから詳細化する","z":"告知目的、期限、相关部门、约束（预算、可停机时间等），先让它分阶段并列出风险，然后再细化"},{"j":"移行に関する一般的なベストプラクティスを質問し、出てきた詳細なガントチャートの日付をそのまま確定版とする","z":"询问迁移相关的一般最佳实践，把给出的详细甘特图日期直接作为定稿"},{"j":"過去の別プロジェクトの計画書を渡し、日付だけ変えさせる","z":"提供过去其他项目的计划书，只让它改日期"},{"j":"「移行計画を作って」と一言で依頼する","z":"只说一句“做个迁移计划”"}],"a":[0],"e":"规划类任务需要提供目的、期限、相关方、约束等上下文，并分步骤（先阶段划分和风险，再细化）推进。一句话指令缺少背景；套用别的项目计划忽略差异；一次性生成的日期未经验证不能直接确定。","ej":"文脈+制約を渡し、段階的に詳細化"},{"id":"d4-010","d":4,"t":"4.2","n":1,"q":"受注処理に時間がかかっている。業務改善のためClaudeを使う方法として最も適切なものはどれか。","qz":"接单处理很耗时。为了业务改善，使用Claude的方法中最合适的是哪一项？","o":[{"j":"改善は不要と判断し、処理件数を減らす","z":"判断不需要改善，减少处理件数"},{"j":"受注処理の全工程を即日Claudeに置き換える","z":"当天就把接单处理的全部工序替换为Claude"},{"j":"Claudeに業界の先進事例をもとにした理想の受注フローを設計させ、現行手順の確認は省いてそのまま導入する","z":"让Claude基于行业先进案例设计理想的接单流程，省略对现行步骤的确认直接导入"},{"j":"担当者の作業手順を書き出してClaudeに渡し、ボトルネックや重複作業の候補と改善案を挙げさせ、関係者と検証する","z":"写出负责人的作业步骤交给Claude，让它列出瓶颈和重复作业的候选及改善方案，再与相关人员验证"}],"a":[3],"e":"流程优化要基于现状：把实际步骤交给Claude分析瓶颈与重复，再由相关人员验证。脱离现状的理想流程可能不可行；一天内全部替换风险过高；减少件数不是改善。","ej":"現行手順を基に分析→関係者で検証"},{"id":"d4-011","d":4,"t":"4.2","n":2,"q":"Claudeを使った業界調査の結果を経営会議に提出する。提出前に行うべきこととして適切なものを2つ選べ。","qz":"要把用Claude做的行业调研结果提交给经营会议。提交前应该做的事情，请选出2项。","o":[{"j":"Claudeが作成したことを伏せ、自分の独自調査として提出する","z":"隐瞒由Claude制作，作为自己的独立调查提交"},{"j":"引用が多いので正確だと判断してそのまま提出する","z":"因为引用很多，判断为准确就直接提交"},{"j":"情報の日付を確認し、古いデータや推測が含まれていないかを明示・修正する","z":"确认信息日期，明示或修正其中是否包含旧数据或推测"},{"j":"重要な数値や主張について、引用元の一次情報を確認する","z":"对重要的数值和主张，确认引用源的一次信息"},{"j":"Claudeの回答の口調を経営層向けに強めるだけにする","z":"只把Claude回答的语气改得更适合经营层"}],"a":[2,3],"e":"调研结果用于决策前，应核查关键数据的原始出处和信息时效。只改语气不解决正确性；引用多不等于准确（引用本身也可能错或与内容不符）；隐瞒AI的使用违背Diligence（透明与负责）。","ej":"一次情報と日付を確認してから提出"},{"id":"d4-012","d":4,"t":"4.2","n":1,"q":"広報担当者が、来年度のコンテンツ配信計画を立てたい。Claudeに過去1年分の記事一覧と閲覧データ(CSV)を渡す場合、最も適切な依頼はどれか。","qz":"公关负责人想制定下一年度的内容发布计划。如果把过去1年的文章列表和浏览数据（CSV）交给Claude，最合适的请求是哪一项？","o":[{"j":"「データを分析し、反応の良かったテーマ・時期の傾向を示したうえで、根拠付きで来年度の配信計画案を3つ提案して」","z":"“分析数据，指出反响好的主题和时期的趋势，并基于依据提出3个下一年度发布计划方案”"},{"j":"「バズる記事を書いて」","z":"“写一篇爆款文章”"},{"j":"「過去の記事一覧を参考に、来年度に配信すべき記事タイトルを52本、週1本ずつ日付付きで一覧にして」","z":"“参考过去的文章列表，列出下一年度应发布的52个文章标题，每周一篇并附日期”"},{"j":"「CSVの行数を数えて」","z":"“数一下CSV的行数”"}],"a":[0],"e":"好的请求要明确任务（分析趋势→提出方案）、要求依据，并给出多个可比较的选项便于人决策。“写爆款文章”与计划无关；数行数无意义；直接列52个标题跳过了数据分析，缺乏依据。","ej":"分析→根拠付きで複数案を提案させる"},{"id":"d4-013","d":4,"t":"4.2","n":1,"q":"複数部署にまたがる業務プロセスの改善案をClaudeと作成した。案の妥当性を高めるための次のステップとして最も適切なものはどれか。","qz":"和Claude一起制作了跨多个部门的业务流程改善方案。作为提高方案合理性的下一步，最合适的是哪一项？","o":[{"j":"案をそのまま全社メールで通知する","z":"直接通过全公司邮件通知该方案"},{"j":"別のチャットでClaudeに案を評価させ、問題点の指摘がなければ各部署への確認を省略して確定する","z":"在另一个聊天中让Claude评估方案，如果没有指出问题，就省略各部门的确认直接定稿"},{"j":"案の文章量を2倍にして説得力を出す","z":"把方案的篇幅加倍以增强说服力"},{"j":"各部署の担当者に案をレビューしてもらい、現場の制約や例外を反映して改訂する","z":"请各部门负责人审阅方案，反映现场的约束和例外后修订"}],"a":[3],"e":"AI生成的方案需要现场相关人员审核，补充实际约束和例外，再迭代修订。让Claude自我确认不可靠；未经审核直接全员通知风险大；篇幅不等于质量。","ej":"現場担当者のレビューで制約・例外を反映"},{"id":"d4-014","d":4,"t":"4.2","n":1,"q":"研究開発部門の担当者が、学術論文20本を読み比べて技術動向を整理したい。最も効率的で信頼性の高い進め方はどれか。","qz":"研发部门的负责人想通读比较20篇学术论文，整理技术动向。最高效且可靠的推进方式是哪一项？","o":[{"j":"論文をProjectのナレッジにアップロードし、各論文の要点を出典付きで抽出させてから比較表を作り、重要箇所は原文で確認する","z":"把论文上传到Project知识库，让它带出处提取每篇要点，再做比较表，重要部分对照原文确认"},{"j":"20本を一文で要約させ、それを結論とする","z":"让它把20篇用一句话概括，并以此为结论"},{"j":"論文のタイトルだけを渡し、内容を推測させる","z":"只给论文标题，让它推测内容"},{"j":"論文は読ませず、Claudeの一般知識で技術動向をまとめさせ、もっともらしい内容であれば結論として採用する","z":"不让它读论文，用Claude的一般知识汇总技术动向，只要内容貌似合理就作为结论采用"}],"a":[0],"e":"把资料放入Project知识库，分步骤（逐篇提取→比较）并要求出处，再回到原文核对关键点，兼顾效率和可靠性。只给标题会导致推测和幻觉；一句话概括丢失信息；只靠一般知识可能过时且不基于指定资料。","ej":"資料を渡し、出典付き抽出→比較→原文確認"},{"id":"d4-035","d":4,"t":"4.2","n":1,"q":"新製品の発売準備として、Claudeにタスク一覧を作らせた。抜け漏れを減らすための追加の依頼として最も有効なものはどれか。","qz":"为新产品发售准备，让Claude生成了任务列表。为了减少遗漏，最有效的追加请求是哪一项？","o":[{"j":"「もっと長くして」","z":"“再写长一点”"},{"j":"「このタスク一覧を、より詳細なサブタスクに分解し、各タスクの所要時間を見積もって追加して」","z":"“把这个任务列表分解为更详细的子任务，并追加每项任务的所需时间估算”"},{"j":"「タスクをアルファベット順に並べて」","z":"“把任务按字母顺序排列”"},{"j":"「このタスク一覧を、関係部署(法務・物流・広報など)の観点からレビューし、不足しているタスクと依存関係を指摘して」","z":"“从相关部门（法务、物流、公关等）的视角审查这个任务列表，指出缺少的任务和依赖关系”"}],"a":[3],"e":"让Claude从不同相关方视角复查并找出缺口和依赖关系，是规划中提高完整性的有效手法。单纯加长不保证有用；细分子任务和估时只是在现有列表内深挖，无法发现遗漏的任务；排序不影响完整性。","ej":"関係者の視点でレビューさせ、不足と依存関係を洗い出す"},{"id":"d4-015","d":4,"t":"4.3","n":1,"q":"社内向けFAQページのたたき台をClaudeで作成している。初回の出力は網羅性が足りなかった。最も適切な次の行動はどれか。","qz":"正在用Claude制作内部FAQ页面的初稿。第一次的输出覆盖不够全面。最合适的下一步是哪一项？","o":[{"j":"同じ依頼文を何度も送り直して偶然良い結果を待つ","z":"反复发送同样的请求，等待偶然出现好结果"},{"j":"足りなかった観点(対象者、よくある問い合わせ例など)を具体的に伝え、改訂版を作らせる","z":"具体告知缺少的观点（对象人群、常见咨询示例等），让它生成修订版"},{"j":"より高性能なモデルに切り替えれば網羅性は自動的に改善されると考え、依頼内容は変えずに再実行する","z":"认为切换到更高性能的模型就能自动改善覆盖面，不改请求内容直接重新执行"},{"j":"諦めて最初から人手で全部作る","z":"放弃，从头全部由人手制作"}],"a":[1],"e":"方案设计是迭代过程：给出具体反馈（缺少的视角、示例）进行修订最有效。放弃浪费已有成果；重复同一指令缺乏改进；不改指示只换模型通常无法解决信息不足的问题。","ej":"具体的なフィードバックで反復改善"},{"id":"d4-016","d":4,"t":"4.3","n":1,"q":"新サービスの申込フォームの画面案を、関係者に見せて意見をもらいたい。Claudeを使う方法として最も適切なものはどれか。","qz":"想把新服务申请表单的界面方案展示给相关人员征求意见。使用Claude的方法中最合适的是哪一项？","o":[{"j":"プロトタイプは不要なので、完成後に意見を聞く","z":"不需要原型，完成后再听意见"},{"j":"画面の説明を長文で書かせ、関係者に読んでもらう","z":"让它写很长的界面说明文字，请相关人员阅读"},{"j":"Claudeに本番用のフォーム画面のコードを書かせ、関係者にはそのまま公開環境で操作して意見を出してもらう","z":"让Claude写正式用的表单界面代码，让相关人员直接在公开环境中操作并提出意见"},{"j":"Artifactとして簡単な画面プロトタイプを作成し、フィードバックを受けて反復改善する","z":"作为Artifact制作简单的界面原型，接受反馈后迭代改进"}],"a":[3],"e":"Artifact适合制作可视化的原型并反复修改，便于收集反馈。长篇文字说明不直观；直接写生产代码上线超出Associate范围且未经审核；完成后才收集意见返工成本高。","ej":"Artifactでプロトタイプ→フィードバックで反復"},{"id":"d4-017","d":4,"t":"4.3","n":2,"q":"Claudeを使った業務ソリューション(例:週次レポート自動下書き)を試行導入する。設計段階で決めておくべきこととして適切なものを2つ選べ。","qz":"要试行导入使用Claude的业务方案（例：自动起草周报）。在设计阶段应决定的事情，请选出2项。","o":[{"j":"成功を判断する指標(作成時間、修正回数など)","z":"判断成功的指标（制作时间、修改次数等）"},{"j":"利用者に指示文を一切変更させないルール","z":"不允许用户修改任何指示文的规则"},{"j":"どのモデルが一番人気か","z":"哪个模型最受欢迎"},{"j":"失敗したときにClaudeの責任にする手順","z":"失败时把责任推给Claude的流程"},{"j":"出力を誰がどの観点でレビューし、承認するか","z":"由谁、从什么观点审核并批准输出"}],"a":[0,4],"e":"设计阶段应确定审核/批准的责任人和观点，以及衡量成功的指标，以便迭代。模型人气与需求无关；AI不能承担责任，责任在使用者；完全禁止修改指示会阻碍持续改进。","ej":"レビュー体制と成功指標を設計時に決める"},{"id":"d4-018","d":4,"t":"4.3","n":1,"q":"Claudeで作成した顧客向け提案書のテンプレートを、チームで繰り返し使いたい。最も適切な方法はどれか。","qz":"想在团队中反复使用用Claude制作的面向客户的提案书模板。最合适的方法是哪一项？","o":[{"j":"チームのProjectを作成し、テンプレートと作成ルールをナレッジ・指示として設定し共有する","z":"创建团队Project，把模板和制作规则设为知识和指示并共享"},{"j":"シークレットチャットで作成して記録を残さない","z":"在无痕聊天中制作，不留记录"},{"j":"テンプレートを印刷して配布する","z":"把模板打印出来分发"},{"j":"各メンバーが自分のチャットでテンプレートを都度貼り付け、作成ルールも毎回口頭で補足して依頼する","z":"各成员在自己的聊天中每次粘贴模板，每次口头补充制作规则后请求"}],"a":[0],"e":"需要团队反复使用的内容，适合放进共享Project（指示+知识），保证一致性和可维护性。每次从头请求效率低且不一致；打印无法与Claude联动；无痕聊天不保留，无法复用。","ej":"繰り返し使う型はチームProjectで共有"},{"id":"d4-019","d":4,"t":"4.3","n":1,"q":"Claudeで作った業務チェックリストを試行したところ、現場から「項目が多すぎて使いにくい」という声が出た。最も適切な対応はどれか。","qz":"试用了用Claude制作的业务检查清单，现场反映“项目太多不好用”。最合适的应对是哪一项？","o":[{"j":"現場の意見と利用状況をClaudeに伝え、重要度で優先順位付けした簡潔版を作らせ、再度試行する","z":"把现场意见和使用情况告诉Claude，让它按重要度排序做出精简版，再次试行"},{"j":"網羅性を確保するため項目は維持し、使いにくさは慣れの問題として、使い方の研修を追加で実施する","z":"为确保覆盖面保持项目不变，把不好用看作习惯问题，追加实施使用培训"},{"j":"チェックリストの導入を中止する","z":"中止检查清单的导入"},{"j":"項目をさらに増やして網羅性を高める","z":"进一步增加项目以提高覆盖面"}],"a":[0],"e":"把用户反馈纳入下一轮迭代（排序、精简），再试行，是解决方案设计的基本循环。把“不好用”归为习惯问题而无视反馈不可取；直接中止过早；继续增加项目与反馈相反。","ej":"利用者の声を反映して反復(試行→改善)"},{"id":"d4-020","d":4,"t":"4.3","n":1,"q":"Claudeを使って社内イベントの運営マニュアルを作る。ソリューション開発を効率よく進めるための最も適切な順序はどれか。","qz":"用Claude制作内部活动的运营手册。为了高效推进方案开发，最合适的顺序是哪一项？","o":[{"j":"全文を一度に作成→配布→問題があれば作り直し","z":"一次性写完全文→分发→有问题再重做"},{"j":"各章の担当者がそれぞれ別のチャットで並行して作成し、時間短縮のため結合後のチェックは省略する","z":"各章负责人分别在不同聊天中并行制作，为节省时间省略合并后的检查"},{"j":"目次案の作成→担当者確認→各章を順に作成・レビュー→全体の整合性チェック","z":"制作目录方案→负责人确认→逐章制作与审核→检查整体一致性"},{"j":"最終版の体裁を先に決め、内容は最後に考える","z":"先决定最终版式，内容最后再考虑"}],"a":[2],"e":"先确定结构（目录）并确认，再逐章生成和审核，最后检查整体一致性，是任务分解+迭代的做法。一次写完返工成本高；分散生成直接拼接容易前后矛盾；先排版后内容本末倒置。","ej":"構成→確認→章ごと作成→全体整合性"},{"id":"d4-021","d":4,"t":"4.3","n":1,"q":"Claudeと設計した新しい業務フローについて、技術的な実装(社内システムとのAPI連携や自律エージェント化)が必要だと分かった。Associateとして最も適切な行動はどれか。","qz":"和Claude设计的新业务流程中，发现需要技术实现（与内部系统的API对接、自主代理化）。作为Associate最合适的行动是哪一项？","o":[{"j":"ベンダーに要件を伝えず、まず見積だけ取る","z":"不告诉供应商需求，先只要报价"},{"j":"Claudeに連携用のコードとエージェントの設定を書かせ、動作を確認しながら自分で本番環境へ導入する","z":"让Claude写对接代码和代理设置，一边确认运行一边自己导入生产环境"},{"j":"技術的な部分は不要として計画から削除する","z":"认为技术部分不需要，从计划中删除"},{"j":"要件・期待効果・試行結果をまとめて、Claude Developer/Architectの担当者に引き継ぐ","z":"汇总需求、预期效果和试行结果，交接给Claude Developer/Architect负责人"}],"a":[3],"e":"认证指南明确：API集成和代理系统设计属于Developer/Architect的范围，Associate的职责是识别局限并整理好需求和成果后升级。自己把代码导入生产风险大；删除必要部分会使方案失效；不给需求无法得到准确报价。","ej":"技術実装は要件を整理してDeveloper/Architectへ"},{"id":"d4-022","d":4,"t":"4.4","n":1,"q":"既存の議事録作成業務にClaudeを組み込みたい。現在は会議後に担当者が録音を聞き直して2時間かけて作成している。最も適切な組込み方はどれか。","qz":"想把Claude嵌入现有的会议纪要制作业务。目前会后由负责人重听录音，花2小时制作。最合适的嵌入方式是哪一项？","o":[{"j":"会議自体を廃止し、Claudeに議題の結論を出させる","z":"取消会议本身，让Claude给出议题结论"},{"j":"文字起こしテキストをClaudeに渡し、決定事項・ToDo・担当者を所定形式で下書きさせ、出席者が確認して確定する","z":"把转写文本交给Claude，按规定格式起草决定事项、待办和负责人，再由参会者确认定稿"},{"j":"議事録を作らず、各自の記憶に任せる","z":"不做纪要，交给各自记忆"},{"j":"録音データを無料の公開文字起こしサービスにアップロードし、出力をそのまま全社に配信して確認を省く","z":"把录音上传到免费的公开转写服务，把输出直接发全公司，省略确认"}],"a":[1],"e":"在现有流程中用Claude做起草（增强），并保留人的确认步骤，是典型的嵌入方式。取消会议、让AI决定结论偏离目的；随意上传到公开服务违反数据政策；不做纪要不是改善。","ej":"既存フローに下書き役として組込み、人が確認"},{"id":"d4-023","d":4,"t":"4.4","n":2,"q":"カスタマーサポートで、Claudeを使った返信下書き作成を業務フローに組み込む。運用ルールとして適切なものを2つ選べ。","qz":"在客户支持中，把用Claude起草回复嵌入业务流程。作为运营规则，请选出2项合适的。","o":[{"j":"回答方針・トーン・禁止事項をProject指示として共通化する","z":"把回答方针、语气、禁止事项作为Project指示统一化"},{"j":"返金・法的対応など高リスクな案件は、担当者が必ず内容を確認してから送信する","z":"退款、法律应对等高风险案件，负责人必须确认内容后再发送"},{"j":"担当者ごとに自由な指示で運用し、統一しない","z":"每个负责人用自由的指示运作，不统一"},{"j":"Claudeの下書きは常に正しいので確認なしで送信する","z":"Claude的草稿总是正确的，不确认直接发送"},{"j":"顧客のクレジットカード番号をそのまま貼り付けて文脈を補う","z":"直接粘贴客户信用卡号以补充上下文"}],"a":[0,1],"e":"按风险分级设置人工确认，并用Project指示统一方针和语气，能兼顾效率与质量。不确认直接发送有幻觉风险；粘贴信用卡号违反数据最小化原则；各自为政会导致回答不一致。","ej":"高リスクは人が確認+方針をProject指示で共通化"},{"id":"d4-024","d":4,"t":"4.4","n":1,"q":"業務フローを「拡張(augment)」するのではなく「再設計(redesign)」すべきと判断できるのは、どのような場合か。","qz":"在什么情况下，可以判断业务流程应该“重新设计（redesign）”而不是“增强（augment）”？","o":[{"j":"一部の文章作成だけを速くしたい場合","z":"只想加快部分文字写作的情况"},{"j":"既存の手順の多くが、Claudeの活用を前提にすると不要または順序を変えた方がよいと分かった場合","z":"发现以使用Claude为前提时，现有步骤中很多变得不必要或应该改变顺序的情况"},{"j":"Claudeの利用料を減らしたい場合","z":"想减少Claude使用费的情况"},{"j":"担当者が新しいツールに不慣れで、既存の手順のまま一部の作業だけを置き換えたいと考えている場合","z":"负责人不熟悉新工具，希望保持现有步骤只替换部分作业的情况"}],"a":[1],"e":"当以Claude为前提后，现有步骤大量变得多余或顺序应调整时，就应考虑重新设计流程，而不是在旧流程上加一个工具。只想加快局部写作属于增强；不熟悉工具是培训问题；降低费用不是重设计的判断标准。","ej":"前提が変わり手順自体が不要→再設計"},{"id":"d4-025","d":4,"t":"4.4","n":1,"q":"チームのタスク管理でClaudeを使い、毎週月曜に先週の進捗メールとチャットを要約したい。Google Workspaceを使っている場合、最も適切な方法はどれか。","qz":"团队在任务管理中使用Claude，想每周一汇总上周的进度邮件和聊天。在使用Google Workspace的情况下，最合适的方法是哪一项？","o":[{"j":"毎週すべてのメールを手作業でコピーして貼り付ける","z":"每周手动复制粘贴所有邮件"},{"j":"コネクタを使うと危険なので、要約は諦める","z":"使用连接器很危险，所以放弃汇总"},{"j":"メンバー全員のメールアカウント情報を集めて共有アカウントを作り、Claudeが全員の受信箱を毎週読めるようにする","z":"收集所有成员的邮箱账号信息做成共享账号，让Claude每周能读取所有人的收件箱"},{"j":"管理者が許可したGmail・Google Driveコネクタを使い、必要な範囲の情報を参照して要約させる","z":"使用管理员许可的Gmail、Google Drive连接器，参照必要范围的信息让它总结"}],"a":[3],"e":"连接器可以在授权范围内读取Gmail和Drive信息，团队/企业版需管理员启用，应只访问必要范围（最小权限）。收集密码严重违反安全；手动复制低效且易漏；在有合规手段时直接放弃不必要。","ej":"管理者許可のコネクタで必要範囲だけ参照"},{"id":"d4-026","d":4,"t":"4.4","n":1,"q":"Claudeを日常業務に組み込んだ後、効果が出ているかを継続的に把握したい。最も適切な方法はどれか。","qz":"把Claude嵌入日常业务后，想持续掌握是否有效果。最合适的方法是哪一项？","o":[{"j":"導入したこと自体を成果として報告し、測定はしない","z":"把导入本身作为成果报告，不做测定"},{"j":"導入前に決めた指標(処理時間、手戻り件数、満足度など)を定期的に測定し、改善点を見直す","z":"定期测定导入前决定的指标（处理时间、返工件数、满意度等），复查改善点"},{"j":"問題が報告されるまで何もしない","z":"在问题被报告之前什么也不做"},{"j":"毎月Claudeに「導入の効果はどの程度あったか」を質問し、その回答を効果測定の結果として報告する","z":"每月问Claude“导入效果有多大”，把它的回答作为效果测定结果报告"}],"a":[1],"e":"用事先定义的指标定期测量并持续改进，是工作流整合后的运营方式。导入本身不是成果；问Claude无法得到客观数据；被动等待会错过改善机会。","ej":"事前に決めた指標で定期測定→見直し"},{"id":"d4-027","d":4,"t":"4.4","n":1,"q":"営業資料作成フローにClaudeを組み込んだが、メンバーによって出力品質に大きな差が出ている。最も効果的な改善策はどれか。","qz":"在销售资料制作流程中嵌入了Claude，但不同成员的输出质量差异很大。最有效的改善措施是哪一项？","o":[{"j":"品質が低いメンバーの利用を禁止する","z":"禁止质量低的成员使用"},{"j":"品質の差は個性なので放置する","z":"质量差异是个性，置之不理"},{"j":"品質の良いメンバーのプロンプトと手順を標準化し、Projectの指示やテンプレートとして共有する","z":"把质量好的成员的提示和步骤标准化，作为Project指示或模板共享"},{"j":"全員の利用モデルを最上位のOpusに統一し、拡張思考を常にオンにすることで品質差をなくす","z":"把所有人的模型统一为最高级的Opus，并始终开启扩展思考来消除质量差异"}],"a":[2],"e":"质量差异多源于提示和流程不同，把最佳实践标准化并通过Project指示/模板共享最有效。禁止使用不能解决问题；只换模型无法弥补指示差异；放任会影响对外资料质量。","ej":"良いプロンプト・手順を標準化して共有"},{"id":"d4-028","d":4,"t":"4.4","n":2,"q":"既存の月次報告業務にClaudeを導入する際、利用者の定着を促すために有効な施策を2つ選べ。","qz":"在现有月度报告业务中导入Claude时，为促进用户的落地使用，请选出2项有效措施。","o":[{"j":"利用者からのフィードバックを集め、テンプレートや手順を定期的に更新する","z":"收集用户反馈，定期更新模板和步骤"},{"j":"使い方は各自に任せ、質問窓口は設けない","z":"使用方法交给各人，不设咨询窗口"},{"j":"導入目的を説明せずに利用を開始する","z":"不说明导入目的就开始使用"},{"j":"初日から全業務での利用を義務化し、例外を認めない","z":"从第一天起强制在所有业务中使用，不允许例外"},{"j":"具体的な業務例を使った短い研修とプロンプト例集を用意する","z":"准备使用具体业务例子的简短培训和提示示例集"}],"a":[0,4],"e":"落地需要贴近业务的培训与示例，以及根据反馈持续更新。完全放任、不设窗口会导致困惑；一刀切强制会引起抵触且忽略不适用场景；不说明目的难以获得理解。","ej":"業務例付き研修+フィードバックで継続更新"},{"id":"d4-029","d":4,"t":"4.5","n":1,"q":"部長から「Claudeを使えば人員を半分にできるのか」と質問された。最も適切な回答方針はどれか。","qz":"部长问：“用了Claude是不是可以把人员减半？”最合适的回答方针是哪一项？","o":[{"j":"「必ず半分にできます」と断言する","z":"断言“一定可以减半”"},{"j":"業界調査で示されている平均的な生産性向上率をもとに、人員削減の可能性が高いと前向きに回答する","z":"根据行业调研中的平均生产率提升比例，积极回答裁员可能性很高"},{"j":"「AIは役に立たない」と答えて期待を下げる","z":"回答“AI没用”以降低期待"},{"j":"試行で得られた時間削減の実績と、人による確認が必要な作業を示し、期待できる効果と限界を具体的に説明する","z":"展示试行中得到的时间削减实绩和需要人确认的工作，具体说明可期待的效果和局限"}],"a":[3],"e":"向利益相关者沟通时，应基于本公司试行的实际数据说明价值，同时诚实说明局限（如需要人工审核的部分）。断言能减半或套用行业平均值都是夸大；全盘否定也不准确。","ej":"実績データで価値と限界をバランスよく説明"},{"id":"d4-030","d":4,"t":"4.5","n":1,"q":"Claude導入の稟議書を作成する。経営層の理解を得るために最も効果的な構成はどれか。","qz":"要撰写导入Claude的审批书。为了获得经营层的理解，最有效的结构是哪一项？","o":[{"j":"モデルの技術的な仕組みの詳細説明を中心にする","z":"以模型技术原理的详细说明为中心"},{"j":"導入のメリットと他社の成功事例を中心に構成し、リスクは承認後に詳細を詰めると記載する","z":"以导入优点和他社成功案例为中心构成，风险部分写明批准后再细化"},{"j":"他社の成功事例だけを並べる","z":"只罗列其他公司的成功案例"},{"j":"解決したい業務課題、試行結果(定量効果)、リスクと対策、費用、次のステップを簡潔に示す","z":"简洁展示要解决的业务课题、试行结果（定量效果）、风险与对策、费用和下一步"}],"a":[3],"e":"面向经营层要用业务语言：课题、定量效果、风险与对策、成本、下一步。技术细节不是经营层关注重点；只列他社案例缺乏本公司依据；隐藏风险会损害信任并在后期出问题。","ej":"課題・効果・リスク対策・費用・次の一手"},{"id":"d4-031","d":4,"t":"4.5","n":1,"q":"現場の担当者が「Claudeの答えは全部正しいんでしょう?」と考えている。導入推進者として伝えるべき内容として最も適切なものはどれか。","qz":"现场负责人认为“Claude的回答全都是对的吧？”作为导入推进者，最应该传达的内容是哪一项？","o":[{"j":"Claudeは確信度が低いときは自分でそう伝えるので、断定的な回答であればそのまま使ってよい","z":"Claude在把握不大时会自己说明，所以断定性的回答可以直接使用"},{"j":"Claudeはもっともらしい誤り(ハルシネーション)を出すことがあり、重要な事実は一次情報で確認する必要がある","z":"Claude有时会产生貌似合理的错误（幻觉），重要事实需要用一次信息确认"},{"j":"最新モデルなら誤りは絶対にない","z":"最新模型绝对不会出错"},{"j":"誤りは多いので、使わない方がよい","z":"错误很多，最好不要用"}],"a":[1],"e":"向相关人员说明局限是Domain 4的重要能力：AI可能产生幻觉，关键事实要核查。任何模型都不能保证零错误；Claude不会可靠地自动报告自己的错误；因噎废食也不是正确的沟通。","ej":"限界(ハルシネーション)と検証の必要性を伝える"},{"id":"d4-032","d":4,"t":"4.5","n":2,"q":"Claude活用の成果を社内の他部署に共有する。効果的な伝え方として適切なものを2つ選べ。","qz":"要向公司内其他部门分享Claude的应用成果。请选出2项有效的传达方式。","o":[{"j":"使ったプロンプトや入力データ(顧客情報を含む)をそのまま全社に公開する","z":"把使用的提示和输入数据（含客户信息）原样向全公司公开"},{"j":"専門用語を多用して先進性をアピールする","z":"多用专业术语以显示先进性"},{"j":"成功例だけを誇張して伝える","z":"只夸大地传达成功案例"},{"j":"Before/Afterの作業時間や品質など、具体的な数値と事例で示す","z":"用Before/After的作业时间、质量等具体数值和案例展示"},{"j":"うまくいかなかった点や人の確認が必要だった点も併せて共有する","z":"同时分享不顺利的地方和需要人确认的地方"}],"a":[3,4],"e":"具体数据+真实案例最有说服力，同时坦诚分享局限和教训，帮助他人正确预期。夸大成功会导致错误期待；公开含客户信息的数据违反隐私；堆砌术语不利于理解。","ej":"数値と事例+失敗・限界も共有"},{"id":"d4-033","d":4,"t":"4.5","n":1,"q":"法務部門が「Claudeに契約書レビューを任せたい」と言っている。価値と限界を伝える説明として最も適切なものはどれか。","qz":"法务部门说“想把合同审查交给Claude”。作为传达价值与局限的说明，最合适的是哪一项？","o":[{"j":"Claudeは大量の法律文書を学習しているため、定型的な契約書であればレビューと承認まで任せられる","z":"Claude学习了大量法律文书，所以如果是定型合同，可以把审查到批准都交给它"},{"j":"契約書は機密なので、Claudeは一切使えない","z":"合同是机密，所以完全不能使用Claude"},{"j":"条項の抽出や論点の一次チェックで作業を速められるが、法的判断と最終確認は法務担当者が行う必要がある","z":"可以通过条款提取和论点初步检查加快作业，但法律判断和最终确认需要由法务人员进行"},{"j":"Claudeの指摘がない条項は問題がないと考えてよい","z":"Claude没有指出的条款可以认为没有问题"}],"a":[2],"e":"Claude可以加速条款提取和初查，但专业的法律判断和最终责任在人。等同律师的说法夸大；在符合公司政策和合同条件（如商业版）的前提下，机密文件也可能被允许使用，一律禁止过于极端；没有指出≠没有问题，可能遗漏。","ej":"一次チェックで加速、法的判断・最終確認は人"},{"id":"d4-034","d":4,"t":"4.5","n":1,"q":"Claude導入に不安を感じているメンバーから「自分の仕事がなくなるのでは」と相談された。最も適切な対応はどれか。","qz":"对导入Claude感到不安的成员咨询说“我的工作会不会没了”。最合适的应对是哪一项？","o":[{"j":"「AIに勝てないので転職を考えた方がよい」と伝える","z":"告诉对方“赢不了AI，最好考虑换工作”"},{"j":"「導入は経営判断なので」と説明し、不安があれば人事部に相談するよう案内して話を終える","z":"说明“导入是经营判断”，并引导对方有不安就去咨询人事部，然后结束谈话"},{"j":"不安な人には導入の情報を伝えない","z":"不向感到不安的人传达导入信息"},{"j":"Claudeは定型的な作業を支援し、人はレビュー・判断・顧客対応など付加価値の高い業務に時間を使えることを、具体例で説明する","z":"用具体例子说明Claude辅助定型工作，人可以把时间用在审核、判断、客户应对等高附加值业务上"}],"a":[3],"e":"与利益相关者沟通时，要具体说明AI如何改变工作方式（增强而非简单替代），以及人的角色如何转向高附加值工作。空泛安慰无说服力；隐瞒信息加剧不安；负面断言既不准确也伤害信任。","ej":"人の役割(レビュー・判断)を具体例で説明"},{"id":"d5-001","d":5,"t":"5.1","n":1,"q":"社内ヘルプデスク用のProjectを作成する。プロジェクト指示（カスタム指示）とプロジェクトナレッジの役割分担として最も適切なものはどれか。","qz":"要创建公司内部服务台用的 Project。关于项目指令（自定义指令）与项目知识库的分工，最合适的是哪一个？","o":[{"j":"指示もナレッジも設定せず、毎回チャットで説明する","z":"指令和知识库都不设置，每次在对话中说明"},{"j":"全てのマニュアル本文を指示欄に貼り付け、ナレッジは使わない","z":"把所有手册正文贴进指令栏，不使用知识库"},{"j":"回答ルールはナレッジのファイル内に紛れ込ませ、指示は空欄にする","z":"把回答规则混在知识库文件里，指令栏留空"},{"j":"役割・口調・回答ルールなどの振る舞いは指示に、社内マニュアルやFAQなどの参照資料はナレッジに置く","z":"角色、语气、回答规则等行为写在指令中，公司手册、FAQ 等参考资料放进知识库"}],"a":[3],"e":"项目指令＝“如何行动”（角色、语气、格式、边界、升级规则）；项目知识库＝“参考什么”（手册、FAQ、规程）。B 把大量资料塞进指令，难维护且混淆行为与资料；C 规则藏在文件中不一定被一致遵守；A 失去 Project 的意义。","ej":"指示＝振る舞い／ナレッジ＝参照資料"},{"id":"d5-002","d":5,"t":"5.1","n":1,"q":"営業チームのProjectに、製品カタログの旧版と新版の両方がナレッジとして入っており、Claudeが旧価格を回答することがある。最も適切な対処はどれか。","qz":"营业团队的 Project 知识库里同时放着新旧两版产品目录，Claude 有时会回答旧价格。最合适的处理是哪一个？","o":[{"j":"旧版を削除して新版のみを残し、必要なら指示に「価格は最新版カタログに基づく」と明記する","z":"删除旧版只保留新版，必要时在指令中写明“价格以最新版目录为准”"},{"j":"チャットのたびに「新しい方を使って」と伝える","z":"每次对话都说“请用新的那一版”"},{"j":"両方残したまま、さらに別の版も追加する","z":"两版都保留，再追加其他版本"},{"j":"Projectを使うのをやめる","z":"停止使用 Project"}],"a":[0],"e":"知识库里新旧资料并存会造成矛盾回答。根本对策是维护知识库：删除或归档过期资料，只保留权威版本，并在指令中明确优先规则。B 治标不治本且易漏；C 让矛盾更多；D 过度反应。","ej":"古い資料は削除・差し替え。ナレッジは常に最新の正本を"},{"id":"d5-007","d":5,"t":"5.1","n":1,"q":"Projectナレッジに大量のファイルを追加したところ、Claudeがプロジェクトナレッジを検索して関連部分を参照する動作に変わった。この動作の説明として最も適切なものはどれか。","qz":"向 Project 知识库添加大量文件后，Claude 改为检索项目知识库并参照相关部分。关于这一行为，最合适的说明是哪一个？","o":[{"j":"エラーであり、ファイルを減らさない限り回答できない","z":"这是错误，除非减少文件否则无法回答"},{"j":"ナレッジがインターネットに公開されたことを意味する","z":"这意味着知识库被公开到了互联网"},{"j":"全ファイルが常に完全に読み込まれていることを意味する","z":"这意味着所有文件始终被完整读入"},{"j":"ナレッジが大きくなると検索（RAG）で関連部分を取り出す方式になり、扱える容量が拡大する","z":"知识库变大后会改用检索（RAG）方式取出相关部分，可处理的容量随之扩大"}],"a":[3],"e":"Project 知识库较小时可直接全部放进上下文；变大时会自动切换为“项目知识检索”（RAG），只取出相关部分，从而扩大容量。A 不是错误；C 正好相反；B 与公开无关。实务上，文件命名清晰、内容结构化有助于检索命中。","ej":"ナレッジ大 → 自動でRAG（検索）に切替、容量拡大"},{"id":"d5-013","d":5,"t":"5.1","n":1,"q":"プロジェクトナレッジに関する説明として最も適切なものはどれか。","qz":"关于项目知识库，最合适的说明是哪一个？","o":[{"j":"一度アップロードすると、内容の更新や削除はできない","z":"一旦上传，内容就不能更新或删除"},{"j":"そのProject内のチャットで共通して参照される資料であり、追加・差し替え・削除して維持管理する","z":"是该 Project 内所有对话共同参照的资料，需要通过添加、替换、删除来维护"},{"j":"全てのProjectで自動的に共有される","z":"在所有 Project 中自动共享"},{"j":"Claudeの学習データとして自動的に使われる","z":"会自动被用作 Claude 的训练数据"}],"a":[1],"e":"项目知识库属于该 Project，项目内的各个对话都会参照它；可以随时添加、替换、删除，需要持续维护。A 错误；C 不会跨 Project 共享；D 商用方案默认不用于训练，个人方案也取决于用户设置，并非“自动”。","ej":"ナレッジ＝そのProject内で共通参照、追加・差替・削除で維持"},{"id":"d5-017","d":5,"t":"5.1","n":1,"q":"1つのProjectに「採用」「経費精算」「IT問い合わせ」の資料と指示を全て詰め込んでいたところ、回答の混同が増えた。最も適切な改善はどれか。","qz":"在一个 Project 里塞进了“招聘”“费用报销”“IT 咨询”的全部资料和指令，结果回答混淆增多。最合适的改进是哪一个？","o":[{"j":"さらに多くの資料を追加して網羅性を上げる","z":"再添加更多资料以提高覆盖面"},{"j":"目的ごとにProjectを分け、それぞれに専用の指示とナレッジを設定する","z":"按目的拆分 Project，分别设置专用的指令和知识库"},{"j":"毎回のチャットで「今回は経費の話」と長く説明する","z":"每次对话都长篇说明“这次讲的是报销”"},{"j":"指示を全て削除する","z":"删除所有指令"}],"a":[1],"e":"一个 Project 对应一个明确目的，指令和知识更聚焦，检索也更准确，维护责任也更清楚。A 加剧混淆；D 失去行为规范；C 治标不治本。","ej":"1 Project＝1目的。混同したら分割"},{"id":"d5-022","d":5,"t":"5.1","n":1,"q":"新しくProjectを立ち上げる際の進め方として最も適切なものはどれか。","qz":"新建 Project 时，最合适的推进方式是哪一个？","o":[{"j":"目的・利用者・期待する出力を定義し、必要最小限の資料と指示で始めて、試しながら改善する","z":"定义目的、用户和期望输出，以必要最少的资料和指令开始，边试边改进"},{"j":"他部署のProject指示をそのままコピーする","z":"原样复制其他部门的 Project 指令"},{"j":"手元の全ファイルを一度にアップロードし、指示は後で考える","z":"一次性上传手头所有文件，指令以后再说"},{"j":"完璧な指示ができるまで利用を開始しない","z":"在写出完美指令之前不开始使用"}],"a":[0],"e":"先明确目的、用户和期望输出，从最小可用配置开始，通过实际使用迭代改进。C 无关资料多、行为未定义；B 别部门的目的不同；D 完美主义会拖延价值实现，指令本来就需要迭代。","ej":"目的定義→最小構成で開始→試しながら改善"},{"id":"d5-025","d":5,"t":"5.1","n":1,"q":"Projectを使うことで得られる効果として、最も適切でないものはどれか。","qz":"关于使用 Project 带来的效果，最不合适的是哪一个？","o":[{"j":"毎回同じ前提や資料を説明する手間が減る","z":"减少每次说明相同前提和资料的麻烦"},{"j":"ナレッジに入れた資料の内容が事実として正しいことが保証される","z":"保证放入知识库的资料内容在事实上是正确的"},{"j":"関連するチャットを1か所にまとめて管理できる","z":"可以把相关对话集中在一处管理"},{"j":"チームで同じ設定を共有して一貫した出力を得やすくなる","z":"团队共享同一套设置，更容易得到一致的输出"}],"a":[1],"e":"Project 能减少重复说明、集中管理对话、帮助团队一致。但它不会保证资料本身正确 —— 资料错了，回答也会错，并且 Claude 仍可能误读资料，所以需要维护和验证。","ej":"Projectは資料の正しさまでは保証しない"},{"id":"d5-004","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタを有効にしたい担当者がいる。組織はEnterpriseプランを利用している。最初に確認すべきこととして最も適切なものはどれか。","qz":"有员工想启用 Google Drive 连接器。组织使用的是 Enterprise 方案。首先应确认的事项中，最合适的是哪一个？","o":[{"j":"組織の管理者がコネクタを有効化しているか、また社内ポリシー上の利用条件を確認する","z":"确认组织管理员是否已启用该连接器，以及公司政策上的使用条件"},{"j":"コネクタは誰でも自由に追加できるので、確認は不要である","z":"连接器谁都可以自由添加，不需要确认"},{"j":"Driveの全ファイルを公開設定にしておく","z":"把 Drive 中所有文件设为公开"},{"j":"個人のGoogleアカウントで接続すれば管理者の許可は不要である","z":"用个人 Google 账号连接就不需要管理员许可"}],"a":[0],"e":"在 Team/Enterprise 中，Google Workspace 等连接器需要管理员先在组织层面启用，同时要符合公司数据政策。D 绕过管理是违规风险；B 错误；C 把文件公开会造成严重泄露风险，与连接器无关。","ej":"Team/Enterpriseのコネクタ → 管理者の有効化＋社内ポリシー確認"},{"id":"d5-005","d":5,"t":"5.2","n":1,"q":"Gmailコネクタを使ってClaudeにできることの説明として最も適切なものはどれか。","qz":"关于使用 Gmail 连接器时 Claude 能做的事情，最合适的说明是哪一个？","o":[{"j":"Gmailのパスワードを変更できる","z":"可以修改 Gmail 密码"},{"j":"利用者の承認なしに、全社員へ自動でメールを一斉送信できる","z":"无需用户批准，自动向全体员工群发邮件"},{"j":"メールを検索・読み取りし、返信の下書きを作成できる","z":"可以搜索、读取邮件，并起草回复"},{"j":"他人のメールボックスを自由に閲覧できる","z":"可以自由浏览他人的邮箱"}],"a":[2],"e":"Gmail 连接器可以在用户授权范围内搜索、阅读邮件并创建草稿；发送前由人确认。B 未经批准的群发不是连接器的行为方式；A、D 超出授权范围，Claude 只能访问被授予权限的内容。","ej":"Gmail＝検索・読み取り・下書き作成（権限の範囲内）"},{"id":"d5-006","d":5,"t":"5.2","n":1,"q":"コネクタの権限設定についての考え方として最も適切なものはどれか。","qz":"关于连接器权限设置的思路，最合适的是哪一个？","o":[{"j":"業務に必要な範囲に限定した最小権限で接続し、不要になったら接続を解除する","z":"以限定在业务所需范围的最小权限连接，不再需要时解除连接"},{"j":"権限は設定後に見直す必要はない","z":"权限设定后不需要重新检查"},{"j":"将来使うかもしれないので、全てのデータにアクセスできるようにしておく","z":"将来可能会用，所以让它能访问所有数据"},{"j":"他部署のアカウントを借りて接続する","z":"借用其他部门的账号进行连接"}],"a":[0],"e":"最小权限原则：只授予完成任务所需的访问范围，定期检查并在不需要时断开。C 扩大泄露面；B 权限需持续维护；D 借用账号违反身份管理和审计要求。","ej":"コネクタは最小権限。不要になれば解除"},{"id":"d5-010","d":5,"t":"5.2","n":2,"q":"Projectナレッジにアップロードするファイルの扱いとして適切なものを2つ選べ。","qz":"关于上传到 Project 知识库的文件处理，请选出 2 个合适的做法。","o":[{"j":"内容が分かるファイル名を付け、版や日付を明記する","z":"使用能看出内容的文件名，并注明版本和日期"},{"j":"顧客の個人情報を含む原本をそのまま入れる","z":"把含有客户个人信息的原件直接放入"},{"j":"機密区分を確認し、組織ポリシー上アップロード可能なものだけを入れる","z":"确认机密等级，只放入组织政策允许上传的资料"},{"j":"念のため個人のメモや無関係な資料もまとめて入れる","z":"以防万一，把个人笔记和无关资料也一起放进去"},{"j":"同じ内容のファイルを複数の版で重複して入れる","z":"把内容相同的文件以多个版本重复放入"}],"a":[0,2],"e":"正确：A 清晰命名与版本信息有助于检索和维护；C 上传前确认机密等级，遵守组织政策。错误：D 无关资料干扰回答；E 重复和多版本造成矛盾；B 个人信息应按政策去标识化或不上传。","ej":"分かる名前＋版／機密区分を確認して入れる"},{"id":"d5-014","d":5,"t":"5.2","n":1,"q":"Google Driveコネクタ経由でDrive上の資料を参照させる利点として最も適切なものはどれか。","qz":"通过 Google Drive 连接器让 Claude 参照 Drive 上资料的优点，最合适的是哪一个？","o":[{"j":"資料の内容が必ず正しいことが保証される","z":"保证资料内容一定正确"},{"j":"Drive上の全社員のファイルに権限なくアクセスできる","z":"可以在没有权限的情况下访问 Drive 上所有员工的文件"},{"j":"Drive上の最新の資料を、ダウンロード・再アップロードせずに検索・参照でき、出典も示せる","z":"无需下载再上传，就能检索、参照 Drive 上的最新资料，并能标示出处"},{"j":"組織の承認が不要になる","z":"不再需要组织批准"}],"a":[2],"e":"连接器的价值是直接访问源头的最新资料、减少复制上传、回答可标注来源。B 只能访问用户有权限的文件；A 资料本身的正确性不因连接而保证；D 组织的批准和政策仍然适用。","ej":"コネクタ＝最新の元資料を直接参照・出典表示"},{"id":"d5-018","d":5,"t":"5.2","n":1,"q":"Claudeがコネクタを通じて利用者の代わりに操作（例：カレンダー予定の作成）を行う場合の考え方として最も適切なものはどれか。","qz":"当 Claude 通过连接器代表用户执行操作（例如创建日历日程）时，最合适的思路是哪一个？","o":[{"j":"一度許可すれば、内容を確認する必要は一切ない","z":"只要授权一次，就完全不需要确认内容"},{"j":"操作内容を確認・承認してから実行させ、結果も確認する","z":"在确认并批准操作内容后再执行，并检查结果"},{"j":"操作の結果は外部サービス側の責任なので気にしない","z":"操作结果是外部服务的责任，不必在意"},{"j":"他人の名前で操作させてもよい","z":"可以让它以他人的名义操作"}],"a":[1],"e":"代表用户执行的操作，用户仍然负有责任：执行前确认与批准、执行后检查结果，是人类监督的基本要求。A、C 放弃监督；D 冒用身份违反规定。","ej":"代行操作は確認・承認してから実行、結果も確認"},{"id":"d5-021","d":5,"t":"5.2","n":2,"q":"コネクタやアップロード資料を管理するうえで適切なものを2つ選べ。","qz":"在管理连接器和上传资料时，请选出 2 个合适的做法。","o":[{"j":"コネクタ経由で取得した情報も、重要な判断に使う前に元資料で確認する","z":"通过连接器获取的信息，在用于重要判断前也要对照原资料确认"},{"j":"アップロード資料の機密区分は確認しなくてよい","z":"不需要确认上传资料的机密等级"},{"j":"接続した外部サービスのデータは常に最新かつ正確である","z":"已连接外部服务的数据总是最新且准确的"},{"j":"使っていないコネクタは定期的に棚卸しして接続を解除する","z":"定期盘点未使用的连接器并解除连接"},{"j":"コネクタが接続されていれば、どの資料でも参照してよい","z":"只要连接器已连接，任何资料都可以参照"}],"a":[0,3],"e":"正确：D 定期盘点、断开不用的连接，缩小风险面；A Claude 对连接资料的摘要也可能有误，重要判断前回到原资料核实。错误：E 仍要遵守权限与政策；B 必须确认机密等级；C 数据源本身可能过期或有错。","ej":"コネクタは棚卸し／取得情報も元資料で確認"},{"id":"d5-028","d":5,"t":"5.2","n":1,"q":"ある担当者が、他部署の機密フォルダも含むDrive全体をClaudeから検索できるようにしたいと考えている。自分にはそのフォルダの閲覧権限がない。最も適切な判断はどれか。","qz":"某员工想让 Claude 能检索整个 Drive，包括其他部门的机密文件夹。他本人没有该文件夹的浏览权限。最合适的判断是哪一个？","o":[{"j":"Claude経由なら権限がなくても参照できるので、そのまま接続する","z":"通过 Claude 即使没有权限也能参照，直接连接"},{"j":"コネクタは利用者の権限の範囲でしかアクセスできない。必要なら正規の手続きで権限を申請する","z":"连接器只能在用户权限范围内访问。如有需要，通过正式流程申请权限"},{"j":"他部署の同僚のアカウントで接続してもらう","z":"请其他部门的同事用他的账号连接"},{"j":"機密フォルダの共有設定を勝手に変更する","z":"擅自修改机密文件夹的共享设置"}],"a":[1],"e":"连接器继承用户自身的访问权限，不能越权。确实有业务需要时，走正式的权限申请流程。A 前提错误；C 借用账号违规；D 擅自改共享设置是严重违规。","ej":"コネクタは本人の権限内のみ。必要なら正規申請"},{"id":"d5-003","d":5,"t":"5.3","n":1,"q":"顧客向けメール文案を作るProjectの指示文として、最も効果的なものはどれか。","qz":"作为制作客户邮件草稿的 Project 指令，最有效的是哪一个？","o":[{"j":"「いい感じのメールを書いて」","z":"“写一封感觉不错的邮件”"},{"j":"「絶対に間違えないこと。」とだけ書く","z":"只写“绝对不要出错。”"},{"j":"「あなたは当社カスタマーサクセス担当です。読み手は既存顧客の担当者。敬体で300字以内、結論を先に書く。価格や契約条件は推測せず、不明な場合は【要確認】と記載する。」","z":"“你是本公司客户成功负责人。读者是现有客户的负责人。用敬体，300 字以内，先写结论。不要猜测价格和合同条件，不明时标注【要確認】。”"},{"j":"会社の沿革を全文貼り付ける","z":"把公司沿革全文贴进去"}],"a":[2],"e":"好的系统级指令包含：角色、读者、语气、长度、结构、边界（不猜测）以及不确定时的处理方式。A 太模糊；B 只有空泛要求，没有可执行的规则；D 与任务无关的信息会占用上下文。","ej":"指示＝役割・読み手・形式・制約・不明時の扱いを具体的に"},{"id":"d5-009","d":5,"t":"5.3","n":1,"q":"Projectの指示に「回答は必ず日本語で」と書いてあるが、利用者が英語で質問すると英語で返ってくることがある。最も適切な改善策はどれか。","qz":"Project 指令中写着“回答必须用日语”，但用户用英语提问时有时会用英语回答。最合适的改进方案是哪一个？","o":[{"j":"英語で質問した利用者を利用禁止にする","z":"禁止用英语提问的用户使用"},{"j":"指示を「質問の言語にかかわらず、回答は常に日本語で書く。英語の固有名詞はそのまま残してよい」のように明確化する","z":"把指令明确为“无论提问语言是什么，回答始终用日语书写。英文专有名词可保留原样”"},{"j":"指示を削除する","z":"删除该指令"},{"j":"モデルを変えれば必ず解決するので、指示は見直さない","z":"换模型一定能解决，所以不改指令"}],"a":[1],"e":"指令不够具体时，模型会在冲突情况下（提问语言与指令不同）做出别的判断。把条件和例外写清楚是最直接的改进。A 过度；C 让问题更严重；D 模型变化可能有帮助，但先改善指令更根本。","ej":"指示が守られない → 条件・例外を明確に書き直す"},{"id":"d5-011","d":5,"t":"5.3","n":1,"q":"システムレベルの指示（Projectの指示など）に含めるべき内容として、最も優先度が低いものはどれか。","qz":"在系统级指令（如 Project 指令）中应包含的内容里，优先级最低的是哪一个？","o":[{"j":"Claudeに期待する役割と目的","z":"期望 Claude 扮演的角色和目的"},{"j":"作成者の昼食の好みなど、タスクに無関係な個人的情報","z":"制作者的午餐喜好等与任务无关的个人信息"},{"j":"出力の形式・長さ・トーン","z":"输出的格式、长度、语气"},{"j":"不明な場合や範囲外の質問への対応方法","z":"遇到不明情况或范围外问题时的处理方法"}],"a":[1],"e":"系统级指令应聚焦于角色/目的、输出规范、边界与例外处理。与任务无关的信息只会占用上下文并可能干扰回答，优先级最低（最好不写）。","ej":"指示に無関係な情報は入れない"},{"id":"d5-015","d":5,"t":"5.3","n":2,"q":"FAQ回答用Projectの指示に追加すると効果的なものを2つ選べ。","qz":"在 FAQ 回答用 Project 的指令中，添加后有效果的内容请选出 2 个。","o":[{"j":"「できるだけ長く、関係ない話題も含めて答える」","z":"“尽量长地回答，也包含无关话题”"},{"j":"「ナレッジに記載がない場合は推測せず、その旨を伝えて担当窓口を案内する」","z":"“知识库中没有记载时不要猜测，说明这一点并引导至负责窗口”"},{"j":"「ナレッジの内容は無視して一般知識で答える」","z":"“忽略知识库内容，用一般知识回答”"},{"j":"「分からないことも自信を持って断定的に答える」","z":"“不知道的事情也要自信地断定回答”"},{"j":"「回答には根拠となった資料名と該当箇所を示す」","z":"“回答中注明作为依据的资料名称和对应位置”"}],"a":[1,4],"e":"正确：B 给出“不知道时如何处理”可显著减少幻觉；E 要求注明依据便于用户核实。错误：D 鼓励幻觉；A 降低可读性；C 违背 FAQ Project 的目的。","ej":"不明時は推測しない＋根拠資料を示させる"},{"id":"d5-019","d":5,"t":"5.3","n":1,"q":"指示文の書き方として、Claudeがより一貫して従いやすいものはどれか。","qz":"以下指令写法中，Claude 更容易一贯遵守的是哪一个？","o":[{"j":"「適当に良い感じでまとめて」","z":"“适当地整理得好一点”"},{"j":"「短くしないでほしいが長すぎるのもだめ、でも詳しく」","z":"“不要太短但也不能太长，但要详细”"},{"j":"「要約は3点の箇条書き、各点40字以内。理由：経営層がスマホで読むため」","z":"“摘要用 3 个要点列出，每点 40 字以内。理由：管理层用手机阅读”"},{"j":"禁止事項だけを大量に列挙する","z":"只大量列举禁止事项"}],"a":[2],"e":"具体、可衡量、并说明理由的指令最容易被一贯遵守；说明理由还能帮助模型在未写明的情况下做出合理判断。A 模糊；B 自相矛盾；D 只写禁止而不写期望行为，难以得到想要的结果。","ej":"具体的・測定可能・理由付きの指示"},{"id":"d5-023","d":5,"t":"5.3","n":1,"q":"社外向けチャット文案を作るProjectで、Claudeに競合他社を批判する表現を避けさせたい。指示の書き方として最も適切なものはどれか。","qz":"在制作对外聊天文案的 Project 中，希望 Claude 避免批评竞争对手的表达。最合适的指令写法是哪一个？","o":[{"j":"何も書かず、出力後に毎回手で削る","z":"什么都不写，每次输出后手动删除"},{"j":"「悪いことは書かないで」とだけ書く","z":"只写“不要写坏话”"},{"j":"「競合他社には言及しない。比較を求められた場合は自社製品の特長のみを事実に基づいて説明する」と、避けることと代わりにすべきことを書く","z":"写明“不提及竞争对手。被要求比较时，仅基于事实说明本公司产品的特点”，即写清要避免什么以及应改为做什么"},{"j":"競合他社の資料を全てナレッジに入れる","z":"把竞争对手的资料全部放进知识库"}],"a":[2],"e":"有效的限制指令应同时写明“不做什么”和“改为做什么”，并具体化。A 浪费人工；B 模糊，标准不明确；D 可能反而增加提及竞争对手的概率。","ej":"禁止＋代わりにすべき行動をセットで書く"},{"id":"d5-026","d":5,"t":"5.3","n":1,"q":"Project指示に、出力例（良い例）を含める主な効果として最も適切なものはどれか。","qz":"在 Project 指令中加入输出示例（好的范例），主要效果中最合适的是哪一个？","o":[{"j":"事実確認が不要になる","z":"不再需要事实核查"},{"j":"Claudeが例をそのまま毎回コピーするため、必ず同じ文章になる","z":"Claude 会每次照抄范例，所以文章一定相同"},{"j":"コンテキストの消費がゼロになる","z":"上下文消耗变为零"},{"j":"期待する形式やトーンが具体的に伝わり、出力の一貫性が高まる","z":"能具体传达期望的格式和语气，提高输出的一致性"}],"a":[3],"e":"范例（few-shot）是传达格式、语气、细节程度的有效手段，提高一致性。B 模型会参考而不是机械照抄（若担心过度模仿可给多个不同例子）；C 范例也会占用上下文；A 事实核查依然必要。","ej":"良い例を示す＝形式・トーンの一貫性↑"},{"id":"d5-029","d":5,"t":"5.3","n":1,"q":"Project指示とチャット内での個別の依頼の関係について、最も適切な運用はどれか。","qz":"关于 Project 指令与对话中个别请求的关系，最合适的运用方式是哪一个？","o":[{"j":"毎回の個別依頼の内容も全てProject指示に追記していく","z":"把每次的个别请求内容也全部追加到 Project 指令里"},{"j":"全ての要件をチャットで毎回伝え、Project指示は使わない","z":"所有要求每次都在对话里说，不用 Project 指令"},{"j":"Project指示は使い捨てにする","z":"Project 指令用完即弃"},{"j":"共通で変わらないルールはProject指示に、その回だけの条件はチャットの依頼に書く","z":"共通且不变的规则写在 Project 指令中，只针对当次的条件写在对话请求里"}],"a":[3],"e":"分层管理：长期共通规则→Project 指令；一次性的具体条件→当次对话。A 指令会膨胀且互相矛盾；B 重复劳动且不一致；C 失去持续性。","ej":"共通ルール→指示／その回の条件→チャット"},{"id":"d5-008","d":5,"t":"5.4","n":1,"q":"社内規程が改定されたが、規程Q&A用Projectの担当者が誰か決まっておらず、古い回答が出続けている。最も適切な改善策はどれか。","qz":"公司规章已修订，但规章问答 Project 没有确定负责人，持续给出旧的回答。最合适的改进方案是哪一个？","o":[{"j":"Projectのオーナーと更新手順を定め、規程改定時にナレッジと指示を更新し、更新日を記録する","z":"确定 Project 的负责人和更新流程，规章修订时更新知识库和指令，并记录更新日期"},{"j":"Projectを毎月作り直す","z":"每个月重建 Project"},{"j":"Claudeに規程改定を自動で察知させる","z":"让 Claude 自动察觉规章修订"},{"j":"利用者各自が回答を疑って使えばよいので、何もしない","z":"每个用户自己怀疑着用就行，什么都不做"}],"a":[0],"e":"配置与知识需要“运维”：明确负责人、更新触发条件和流程、更新记录。D 把风险转嫁给用户；B 成本高且没解决“谁负责”；C Claude 不会自动知道内部规章修订。","ej":"オーナー・更新手順・更新履歴を決めて保守する"},{"id":"d5-012","d":5,"t":"5.4","n":1,"q":"マーケティング部門のProject指示を変更したところ、別の用途で同じProjectを使っていた広報担当の出力が崩れた。今後の再発防止策として最も適切なものはどれか。","qz":"修改了市场部门的 Project 指令后，同一 Project 中做其他用途的公关负责人输出出了问题。作为今后的防止再发措施，最合适的是哪一个？","o":[{"j":"指示の変更は口頭で済ませる","z":"指令变更口头说一下就行"},{"j":"用途ごとにProjectを分け、指示の変更時は影響範囲を確認し、テストしてから反映・周知する","z":"按用途拆分 Project，修改指令时确认影响范围，测试后再反映并通知"},{"j":"変更しない方が安全なので、今後一切変更しない","z":"不改更安全，今后一律不改"},{"j":"指示は誰でも自由に随時変更できるようにする","z":"让任何人都能随时自由修改指令"}],"a":[1],"e":"配置变更要像管理文档一样：用途分离、变更前确认影响、测试、记录、通知相关人员。A、D 缺乏变更管理；C 过度保守，业务变化时无法改进。","ej":"用途ごとにProject分離／変更は影響確認→テスト→周知"},{"id":"d5-016","d":5,"t":"5.4","n":1,"q":"Projectを半年運用したところ、利用者から「回答が冗長」「特定の質問で古い手順が出る」とのフィードバックが届いた。最も適切な対応はどれか。","qz":"Project 运营半年后，用户反馈“回答冗长”“某些问题会给出旧流程”。最合适的应对是哪一个？","o":[{"j":"フィードバックは個人の好みなので対応しない","z":"反馈只是个人喜好，不做处理"},{"j":"Projectを削除して新しいツールを探す","z":"删除 Project，寻找新工具"},{"j":"利用者に、長い回答を自分で要約するよう指示する","z":"要求用户自己去总结冗长的回答"},{"j":"フィードバックを分析し、指示に長さの制約を追加、古い手順の資料を更新し、代表的な質問で改善を確認する","z":"分析反馈，在指令中加上长度限制，更新旧流程资料，并用代表性问题确认改进效果"}],"a":[3],"e":"持续改进循环：收集反馈 → 找原因（指令 or 知识）→ 修改指令和知识 → 用代表性问题测试确认。A、C 把问题留给用户；B 过度反应，问题可以通过配置修正。","ej":"フィードバック→原因特定→指示・ナレッジ更新→テストで確認"},{"id":"d5-020","d":5,"t":"5.4","n":1,"q":"Projectの指示とナレッジを更新した後に行うべきこととして、最も適切なものはどれか。","qz":"更新 Project 的指令和知识库之后，最应该做的是哪一个？","o":[{"j":"旧版の指示をナレッジに追加で残しておく","z":"把旧版指令作为附加资料留在知识库中"},{"j":"何もしない。更新すれば必ず改善する","z":"什么都不做。更新了就一定会改善"},{"j":"よく使われる代表的な質問を投げて、期待どおりの回答になるかを確認する","z":"用常用的代表性问题测试，确认回答是否符合预期"},{"j":"利用者に知らせず、問題が出たら考える","z":"不告诉用户，出问题再说"}],"a":[2],"e":"更新后用代表性问题（可预先准备一组测试问题）做回归确认，再通知用户。B 更新可能带来副作用；A 旧指令混入会产生矛盾；D 缺乏沟通和验证。","ej":"更新後は代表質問でテスト（回帰確認）"},{"id":"d5-024","d":5,"t":"5.4","n":1,"q":"組織で複数のProjectが乱立し、どれが最新で正式なものか分からなくなっている。最も適切な対策はどれか。","qz":"组织内多个 Project 泛滥，搞不清哪个是最新的正式版本。最合适的对策是哪一个？","o":[{"j":"全てのProjectを放置し、利用者に選ばせる","z":"放任所有 Project，让用户自己选"},{"j":"全てのProjectを削除して利用を停止する","z":"删除所有 Project 并停止使用"},{"j":"さらに新しいProjectを作って解決する","z":"再建一个新的 Project 来解决"},{"j":"Projectの棚卸しを行い、正式版の命名ルール・オーナー・説明を定め、不要なものはアーカイブする","z":"盘点 Project，制定正式版的命名规则、负责人和说明，不需要的归档"}],"a":[3],"e":"配置管理需要治理：盘点、命名规则、负责人、用途说明、归档不用的。A 造成混乱和错误使用；B 过度反应；C 让问题更严重。","ej":"Project棚卸し：命名ルール・オーナー・アーカイブ"},{"id":"d5-027","d":5,"t":"5.4","n":2,"q":"Claudeの設定（指示・ナレッジ・コネクタ）を継続的に維持するための取り組みとして適切なものを2つ選べ。","qz":"为了持续维护 Claude 的配置（指令、知识库、连接器），请选出 2 个合适的做法。","o":[{"j":"一度設定したら二度と変更しない","z":"设置一次后永不修改"},{"j":"利用者からのフィードバックは受け付けない","z":"不接受用户反馈"},{"j":"資料の更新日やレビュー予定日を決め、定期的に見直す","z":"确定资料的更新日期和复审计划日，定期检查"},{"j":"変更内容と理由を記録し、関係者に周知する","z":"记录变更内容和理由，并通知相关人员"},{"j":"担当者を決めず、気づいた人が無断で変更する","z":"不确定负责人，发现问题的人擅自修改"}],"a":[2,3],"e":"正确：C 定期复审防止过期；D 变更记录和通知让团队了解变化、便于追溯。错误：A 业务和资料会变化；B 反馈是改进来源；E 没有负责人和流程会导致混乱。","ej":"定期レビュー＋変更記録・周知"},{"id":"d5-030","d":5,"t":"5.4","n":1,"q":"Projectで使っていた社内テンプレートが全社で新様式に変わった。Projectの維持管理として最も適切な対応はどれか。","qz":"Project 中使用的公司内部模板在全公司改成了新格式。作为 Project 的维护，最合适的处理是哪一个？","o":[{"j":"旧テンプレートを新テンプレートに差し替え、指示内の様式に関する記述も更新し、出力を確認する","z":"把旧模板替换为新模板，同时更新指令中有关格式的描述，并检查输出"},{"j":"旧テンプレートを残し、利用者が出力後に手で直す","z":"保留旧模板，让用户在输出后手动修改"},{"j":"新テンプレートを追加するだけで、旧テンプレートと指示はそのままにする","z":"只追加新模板，旧模板和指令保持不变"},{"j":"テンプレートは関係ないので何もしない","z":"模板无关紧要，什么都不做"}],"a":[0],"e":"资料变更时要成套更新：替换知识库中的模板、同步修改指令中相关描述、测试输出。B 把成本转嫁给用户；C 新旧并存会造成混用；D 会持续输出旧格式。","ej":"様式変更 → ナレッジ差替＋指示更新＋出力確認"},{"id":"d6-001","d":6,"t":"6.1","n":1,"q":"次のうち、Claudeの利用として最も不適切なものはどれか。","qz":"以下哪一项是最不恰当的Claude使用方式？","o":[{"j":"会議の議題案を複数出させ、チームで比較して選ぶ","z":"让它提出多个会议议题方案，团队比较后选择"},{"j":"公開済みのプレスリリースを英語に翻訳し、ネイティブ担当者が確認する","z":"把已公开的新闻稿翻译成英文，由母语负责人确认"},{"j":"社内研修資料の構成案を作成し、担当者が内容を確認する","z":"制作内部培训资料的结构方案，由负责人确认内容"},{"j":"従業員の解雇対象者を、Claudeの判定結果だけで決定する","z":"仅凭Claude的判定结果决定解雇对象员工"}],"a":[3],"e":"对人有重大影响的决定（解雇、录用、评价等）不能仅依赖AI判断，必须由人负责并有正当程序。其他三项都是AI辅助+人确认的恰当用法。","ej":"人に重大な影響を与える決定をAIだけで行わない"},{"id":"d6-002","d":6,"t":"6.1","n":2,"q":"Claudeの利用として適切なものを2つ選べ。","qz":"请选出2项恰当的Claude使用方式。","o":[{"j":"医師の診断を受けずに、Claudeの回答だけで社員の休職可否を判断する","z":"不经医生诊断，仅凭Claude的回答判断员工能否休职"},{"j":"社内規程の文書を要約し、従業員向けQ&Aのたたき台を作る","z":"总结公司规章文件，制作面向员工的Q&A初稿"},{"j":"取引先との契約交渉で、相手を欺くための虚偽データを作らせる","z":"在与客户的合同谈判中，制作用于欺骗对方的虚假数据"},{"j":"顧客アンケート(個人情報を除去済み)の傾向を分析し、改善案を出させる","z":"分析客户问卷（已去除个人信息）的趋势并提出改善方案"},{"j":"競合他社になりすました偽のレビューを作成し、Web上に投稿する","z":"冒充竞争对手制作虚假评论并发布到网上"}],"a":[1,3],"e":"总结规章做Q&A初稿、分析去标识化的问卷都是合规的增强用法。代替医生判断健康状况、伪造评论、制作欺骗性虚假数据都属于不恰当或违反伦理/法律的用途。","ej":"欺瞞・なりすまし・専門家判断の代替はNG"},{"id":"d6-003","d":6,"t":"6.1","n":1,"q":"社員が、顧客から届いた健康に関する相談メールへの返信をClaudeで作成しようとしている。最も適切な進め方はどれか。","qz":"员工想用Claude起草回复客户发来的有关健康咨询的邮件。最合适的推进方式是哪一项？","o":[{"j":"健康相談は難しいので、メールを無視する","z":"健康咨询太难，所以无视邮件"},{"j":"顧客の病歴を詳しく聞き出す質問を追加させる","z":"让它追加详细询问客户病史的问题"},{"j":"症状に関する一般的な医学情報をClaudeに詳しくまとめさせ、考えられる病名と対処法を記載して送る","z":"让Claude详细汇总有关症状的一般医学信息，写上可能的病名和处理方法后发送"},{"j":"一般的な案内文の下書きに留め、医療的判断は専門家への相談を促す文面にし、社内規程に沿って担当者が確認する","z":"只起草一般性的指引文字，医疗判断部分写成建议咨询专家，并由负责人按公司规定确认"}],"a":[3],"e":"医疗等专业领域，Claude只适合起草一般性沟通文本，专业判断应引导至专家，并由人按规定确认。让AI诊断并直接发送风险极高；无视客户不恰当；收集不必要的敏感健康信息违反数据最小化。","ej":"専門的判断は専門家へ、AIは一般的な下書きまで"},{"id":"d6-004","d":6,"t":"6.1","n":1,"q":"あるチームが、採用候補者の履歴書をClaudeでスクリーニングし、上位者だけを面接に進める案を検討している。最も適切な懸念と対応はどれか。","qz":"某团队在考虑用Claude筛选应聘者简历，只让排名靠前者进入面试。最恰当的担忧与应对是哪一项？","o":[{"j":"候補者に知られなければ問題ない","z":"只要候选人不知道就没问题"},{"j":"大量の履歴書を処理するため速度とコストが課題となるので、Haikuに切り替えて一括でスコア付けする","z":"处理大量简历时速度和成本是课题，所以切换到Haiku批量打分"},{"j":"バイアスや不公平な判断のリスクがあるため、評価基準を明確にし、人が最終判断し、社内規程・法令を確認する","z":"存在偏见和不公平判断的风险，因此要明确评价标准、由人做最终判断，并确认公司规定和法令"},{"j":"Claudeは中立なので懸念はない","z":"Claude是中立的，所以没有担忧"}],"a":[2],"e":"招聘筛选属于高风险用途，AI可能反映训练数据中的偏见。应明确标准、保留人的最终判断，并确认公司规定与相关法规（各地对自动化招聘决策有要求）。速度不是核心问题；隐瞒不能免除责任；AI并不保证中立。","ej":"採用など高リスク用途はバイアス対策+人が最終判断"},{"id":"d6-005","d":6,"t":"6.1","n":1,"q":"広報担当が、実在の業界団体の公式声明に見える文書をClaudeで作り、SNSで拡散しようとしている。最も適切な判断はどれか。","qz":"公关负责人想用Claude制作看起来像真实行业团体官方声明的文件，并在社交媒体上扩散。最恰当的判断是哪一项？","o":[{"j":"拡散後に削除すれば問題ない","z":"扩散后删除就没问题"},{"j":"風刺であることが分かるよう文末に小さく注記を入れれば、団体名や体裁はそのままでも問題ない","z":"只要在文末小字注明是讽刺，团体名称和格式保持原样也没问题"},{"j":"団体名を少し変えれば問題ない","z":"只要稍微改一下团体名称就没问题"},{"j":"誤情報やなりすましにあたる不適切な利用なので行わない","z":"属于虚假信息和冒充的不当使用，所以不做"}],"a":[3],"e":"冒充真实组织发布声明属于虚假信息和冒充，是不恰当的用途。改名或加小字注释都不改变其误导性质；扩散后的危害无法通过删除消除。","ej":"なりすまし・誤情報の作成は不適切"},{"id":"d6-006","d":6,"t":"6.1","n":1,"q":"Claudeに任せてもよい作業と、人が担うべき作業の切り分けを考える。AI Fluencyの「Delegation(委任)」の考え方として最も適切なものはどれか。","qz":"考虑哪些工作可以交给Claude、哪些应由人承担。作为AI Fluency中“Delegation（委托）”的思路，最恰当的是哪一项？","o":[{"j":"AIは補助なので、どの作業も任せるべきではない","z":"AI只是辅助，所以任何工作都不应交给它"},{"j":"目的・AIの得意不得意・リスクを踏まえて、何をAIに任せ、何を人が担うかを判断する","z":"基于目的、AI的擅长与不擅长以及风险，判断什么交给AI、什么由人承担"},{"j":"できるだけ多くの作業をAIに任せることが目標である","z":"目标是尽可能多地把工作交给AI"},{"j":"AIに任せる範囲はIT部門が一律に決めるため、利用者は許可された作業をすべてAIに任せればよい","z":"交给AI的范围由IT部门统一决定，因此用户只需把被允许的工作全部交给AI即可"}],"a":[1],"e":"Delegation是根据目标、AI能力与局限、风险来决定分工。最大化交给AI不是目标；虽然要遵守组织政策，但使用者也需自行判断；完全不交给AI则失去价值。","ej":"Delegation=目的・能力・リスクで分担を判断"},{"id":"d6-007","d":6,"t":"6.1","n":1,"q":"学校の教員が、生徒の作文の採点にClaudeを使いたいと考えている。最も適切な使い方はどれか。","qz":"学校老师想用Claude给学生的作文打分。最恰当的使用方式是哪一项？","o":[{"j":"生徒の氏名・住所を含めて作文をアップロードし、本人特定に役立てる","z":"连同学生姓名、住址一起上传作文，用于识别本人"},{"j":"ルーブリック(評価基準)を示してフィードバック案を作らせ、教員が確認・修正して最終評価を決める","z":"给出评分标准（rubric）让它生成反馈草案，由老师确认、修改后决定最终评价"},{"j":"採点の一貫性を高めるため、全生徒の作文をClaudeに採点させ、そのスコアを成績表にそのまま記入する","z":"为提高评分一致性，让Claude给所有学生的作文打分，并把分数直接填入成绩单"},{"j":"採点基準を伝えず、Claudeの感覚で評価させる","z":"不告知评分标准，让Claude凭感觉评价"}],"a":[1],"e":"给出明确的评分标准、让AI生成反馈草案、由教师做最终评价，是恰当的增强方式。直接采用AI分数缺少人工判断；上传不必要的个人信息违反最小化原则；无标准评价会不一致且可能有偏。","ej":"基準を示し、最終評価は人"},{"id":"d6-034","d":6,"t":"6.1","n":1,"q":"Claudeに、社内の安全手順書の改訂案を作らせた。工場の作業員がこの手順に従って作業する。最も適切な扱いはどれか。","qz":"让Claude制作了公司内部安全手册的修订方案。工厂作业人员将按这个手册作业。最恰当的处理方式是哪一项？","o":[{"j":"安全管理の責任者・専門家がすべての手順を確認し、承認を得てから適用する","z":"由安全管理负责人和专家确认所有步骤，获得批准后再适用"},{"j":"文章が分かりやすくなったので、すぐに現場に配布する","z":"文字变得易懂了，马上发到现场"},{"j":"作業員に気づいた点があれば報告してもらい、確認は省略する","z":"让作业人员有发现就报告，省略确认"},{"j":"Claudeに労働安全の法令と照合させ、問題点の指摘がなければ専門家の確認は省略して適用する","z":"让Claude对照劳动安全法规，如果没有指出问题就省略专家确认直接适用"}],"a":[0],"e":"涉及人身安全的内容属于高风险，必须由负责人和专家全面确认并批准。易懂不等于正确；AI的自我确认不可靠；把确认推给一线作业人员会造成安全隐患。","ej":"安全に関わる内容は専門家の確認・承認が必須"},{"id":"d6-008","d":6,"t":"6.2","n":1,"q":"顧客の氏名・電話番号・購入履歴を含むCSVをClaudeで分析したい。社内規程では個人情報の外部サービス入力が制限されている。最も適切な行動はどれか。","qz":"想用Claude分析包含客户姓名、电话号码、购买记录的CSV。公司规定限制向外部服务输入个人信息。最恰当的行动是哪一项？","o":[{"j":"規程があるので、分析そのものを中止する","z":"因为有规定，中止分析本身"},{"j":"分析に不要な氏名・電話番号を削除または仮名化してから、規程の範囲で分析する","z":"先删除或假名化分析不需要的姓名和电话号码，再在规定范围内分析"},{"j":"社内分析なのでそのままアップロードしてよい","z":"因为是内部分析，可以直接上传"},{"j":"Claudeに「この情報は分析後すぐに破棄し、記憶しないで」と明確に指示したうえで、そのままアップロードする","z":"明确指示Claude“分析后立即丢弃这些信息，不要记住”后，直接上传"}],"a":[1],"e":"去除或假名化不需要的个人标识符，就能在遵守政策的前提下完成分析（数据最小化）。对模型下“不保存”的指示不能替代政策控制；“内部用途”不豁免规定；在可以匿名化时直接放弃不必要。","ej":"不要な個人識別子は削除・仮名化してから入力"},{"id":"d6-009","d":6,"t":"6.2","n":2,"q":"Claudeに入力する前に、特に慎重な扱い(除去・マスキング・利用可否の確認)が必要な情報を2つ選べ。","qz":"在输入Claude之前，请选出2项需要特别谨慎处理（去除、遮盖、确认是否可用）的信息。","o":[{"j":"一般的なビジネスメールの書き方の質問","z":"关于一般商务邮件写法的提问"},{"j":"Webで公開されている自社製品のカタログ","z":"网上公开的本公司产品目录"},{"j":"従業員の健康診断結果","z":"员工的体检结果"},{"j":"自社が既に公開しているプレスリリースの本文","z":"本公司已经公开的新闻稿正文"},{"j":"顧客のクレジットカード番号","z":"客户的信用卡号"}],"a":[2,4],"e":"信用卡号（支付信息）和体检结果（健康等敏感个人信息）属于高敏感数据，输入前必须去除或确认是否允许。已公开的新闻稿、产品目录和一般性问题风险低。","ej":"決済情報・健康情報は要配慮"},{"id":"d6-010","d":6,"t":"6.2","n":1,"q":"未発表の決算情報を含む資料をClaudeで要約したい。最も適切な対応はどれか。","qz":"想用Claude总结包含未公布财报信息的资料。最恰当的应对是哪一项？","o":[{"j":"個人アカウントのClaudeで、自宅から作業する","z":"用个人账号的Claude在家处理"},{"j":"重要な数字だけ少し変えて入力すれば問題ない","z":"只要把重要数字稍微改一下再输入就没问题"},{"j":"組織が承認した環境(商用プランなど)と社内規程で、その情報区分の入力が許可されているかを確認したうえで利用する","z":"确认在组织批准的环境（如商业版）和公司规定下，是否允许输入该类信息，然后再使用"},{"j":"社内のClaudeであれば入力内容は社外に出ないので、情報区分を確認せずに資料全体を入力してよい","z":"只要是公司内的Claude，输入内容不会外泄，因此不确认信息分类就可以输入全部资料"}],"a":[2],"e":"内幕/未公开财务信息属于高度机密，应先确认组织批准的环境和信息分类规则是否允许。个人账号绕开组织管控；随意改数字既不可靠又会降低结果价值；不能因为“AI会保密”而忽视数据治理。","ej":"機密区分ごとに承認環境・規程を確認"},{"id":"d6-011","d":6,"t":"6.2","n":1,"q":"商用プラン(Team/Enterprise)と個人プランのデータ取扱いの違いについて、最も適切な説明はどれか。","qz":"关于商业版（Team/Enterprise）与个人版在数据处理上的差异，最恰当的说明是哪一项？","o":[{"j":"個人プランのほうが管理機能が充実している","z":"个人版的管理功能更完善"},{"j":"どちらのプランでも、入力データは必ずモデル学習に使われる","z":"无论哪种方案，输入数据都一定会被用于模型训练"},{"j":"個人プランでも学習利用の設定をオフにすれば商用プランと同じ管理機能が使えるので、業務に使ってよい","z":"个人版只要关闭训练使用设置，就能使用与商业版相同的管理功能，因此可以用于业务"},{"j":"商用プランでは既定で入力データがモデル学習に使われず、管理者による制御機能も提供される","z":"商业版默认不把输入数据用于模型训练，并提供管理员管控功能"}],"a":[3],"e":"商业版（Team/Enterprise/API）默认不将客户数据用于训练，并有SSO、权限、审计等管理功能。个人版则可在设置中选择是否允许用于训练。业务中应使用组织批准的账号。","ej":"商用プランは既定で学習に使われない+管理機能"},{"id":"d6-012","d":6,"t":"6.2","n":1,"q":"欧州の顧客データを扱うプロジェクトでClaudeを使いたい。最も適切な行動はどれか。","qz":"想在处理欧洲客户数据的项目中使用Claude。最恰当的行动是哪一项？","o":[{"j":"GDPRなどの適用規制と社内のデータ保護方針について、法務・情報セキュリティ部門に確認してから利用範囲を決める","z":"就GDPR等适用法规和公司数据保护方针，先向法务和信息安全部门确认，再决定使用范围"},{"j":"データ量が少なければ規制は適用されない","z":"数据量少的话法规就不适用"},{"j":"社内で処理する限り域外移転にはあたらないため、欧州の規制は考慮せず日本の社内規程だけを確認する","z":"只要在公司内处理就不算跨境转移，因此不考虑欧洲法规，只确认日本的公司规定"},{"j":"規制は複雑なので、Claudeに法的判断を任せる","z":"法规复杂，所以把法律判断交给Claude"}],"a":[0],"e":"涉及跨境个人数据时，应与法务/信息安全部门确认适用法规（如GDPR）和公司政策。法规适用取决于数据主体和处理方式，而不是服务国籍；法律判断不能交给AI；数据量少并不能免除法规。","ej":"規制対象データは法務・セキュリティ部門に確認"},{"id":"d6-013","d":6,"t":"6.2","n":1,"q":"同僚との雑談的な相談をClaudeで行う際、会話を履歴やメモリに残したくない。最も適切な機能はどれか。","qz":"在用Claude进行类似闲聊的咨询时，不想让对话留在历史记录和记忆中。最合适的功能是哪一项？","o":[{"j":"シークレットチャット(Incognito chat)","z":"无痕聊天（Incognito chat）"},{"j":"Artifacts","z":"Artifacts"},{"j":"個人用のProjectを作成し、指示に「この会話は記憶しないで」と書く","z":"创建个人Project，在指示中写“不要记住这个对话”"},{"j":"Research(リサーチ)","z":"Research（研究）"}],"a":[0],"e":"无痕聊天不会保存到聊天历史，也不会被记忆功能引用。但它不等于可以输入机密信息，组织政策依然适用（团队/企业版仍可能出现在数据导出中）。在Project指示里写“不要记住”并不能阻止记录保存；Research、Artifacts与此目的无关。","ej":"履歴・メモリに残さない→シークレットチャット"},{"id":"d6-014","d":6,"t":"6.2","n":2,"q":"Google Driveコネクタを部署で使い始める。データ保護の観点で適切な運用を2つ選べ。","qz":"部门开始使用Google Drive连接器。从数据保护角度，请选出2项恰当的运营方式。","o":[{"j":"業務に必要な範囲のフォルダ・権限に限定して接続する(最小権限)","z":"只连接业务所需范围的文件夹和权限（最小权限）"},{"j":"コネクタ経由なら個人情報の規程は適用されない","z":"通过连接器的话个人信息规定就不适用"},{"j":"接続設定は一度決めたら見直さない","z":"连接设置一旦决定就不再复查"},{"j":"便利なので全社の共有ドライブすべてにアクセスできるようにする","z":"因为方便，让它能访问全公司所有共享盘"},{"j":"接続先に機密文書が含まれる場合、その扱いを社内規程で確認する","z":"如果连接对象中包含机密文件，按公司规定确认其处理方式"}],"a":[0,4],"e":"连接器应遵循最小权限原则，并确认机密文件的处理规则。开放全部共享盘扩大泄露风险；通过连接器访问同样受数据规定约束；设置需要定期复查。","ej":"コネクタは最小権限+機密文書の扱いを確認"},{"id":"d6-015","d":6,"t":"6.2","n":1,"q":"Claudeに社内の人事評価データを分析させたい。分析の目的は「部署ごとの評価分布の偏り」を見ることである。データ最小化の観点で最も適切な入力はどれか。","qz":"想让Claude分析公司内部的人事评价数据。分析目的是查看“各部门评价分布的偏差”。从数据最小化角度，最合适的输入是哪一项？","o":[{"j":"偏りの原因まで分析できるよう、社員番号と評価コメント全文を含む部署別の元データ","z":"为了能分析偏差原因，包含员工编号和评价评语全文的各部门原始数据"},{"j":"評価者と被評価者の個人メールのやり取り","z":"评价者与被评价者之间的私人邮件往来"},{"j":"全社員の顔写真付き名簿","z":"附有全体员工照片的名单"},{"j":"部署名と評価ランクのみを集計した、個人を特定できないデータ","z":"只汇总部门名称和评价等级、无法识别个人的数据"}],"a":[3],"e":"数据最小化：只提供达成目的所需的数据。看部门分布只需部门和等级的汇总数据，无需个人标识。其他选项都包含与目的无关的个人信息。","ej":"目的に必要な最小限のデータだけ入力"},{"id":"d6-016","d":6,"t":"6.2","n":1,"q":"取引先から受け取った資料に「第三者への開示禁止」と記載された秘密保持契約(NDA)がある。この資料をClaudeで要約してよいかを判断するうえで最も適切な行動はどれか。","qz":"从客户那里收到的资料附有写明“禁止向第三方披露”的保密协议（NDA）。在判断能否用Claude总结这份资料时，最恰当的行动是哪一项？","o":[{"j":"要約だけなら契約違反にならない","z":"只是总结的话不算违约"},{"j":"AIサービスは人ではなく第三者への開示にはあたらないため、要約目的であれば規程を確認せずに入力してよい","z":"AI服务不是人，不构成向第三方披露，所以如果是总结目的，不确认规定也可以输入"},{"j":"NDAの条件と社内のAI利用規程を確認し、必要なら法務に相談する","z":"确认NDA条件和公司AI使用规定，必要时咨询法务"},{"j":"取引先に知られなければ問題ない","z":"只要客户不知道就没问题"}],"a":[2],"e":"是否允许把受NDA约束的资料输入AI服务，取决于合同条款和公司规定，必要时应咨询法务。“AI不是第三方”“只是总结”都是未经确认的主观判断；隐瞒违反诚信。","ej":"NDA資料は契約条件と社内規程を確認"},{"id":"d6-017","d":6,"t":"6.2","n":1,"q":"共有のチームProjectに、特定の顧客の契約金額一覧をナレッジとしてアップロードしようとしている。Projectには他部署のメンバーも参加している。最も適切な対応はどれか。","qz":"打算把特定客户的合同金额列表作为知识上传到共享的团队Project。该Project也有其他部门的成员参与。最恰当的应对是哪一项？","o":[{"j":"Projectのメンバーと共有範囲を確認し、閲覧権限のない人がいる場合はアップロードしないか、限定されたProjectを使う","z":"确认Project成员和共享范围，有无权查看的人时不上传，或使用限定成员的Project"},{"j":"アップロード後に全員へ「見ないで」と連絡する","z":"上传后通知所有人“请不要看”"},{"j":"Claudeはファイルの原本を他のメンバーに直接表示しないため、Project指示に「金額は回答しない」と書いてアップロードする","z":"Claude不会直接向其他成员显示文件原件，所以在Project指示中写“不回答金额”后上传"},{"j":"ファイル名をわかりにくくすればよい","z":"把文件名改得难懂就行"}],"a":[0],"e":"Project知识对Project成员可用，Claude也会在回答中引用，需按“需要知道”原则管理共享范围。认为Claude不会透露是错误的假设；改文件名不是访问控制；事后通知无法防止访问。","ej":"Projectの共有範囲=ナレッジの閲覧範囲を管理"},{"id":"d6-035","d":6,"t":"6.2","n":1,"q":"Claudeのメモリ機能が有効になっている。以前の会話で顧客の個人情報を扱ってしまったことに気づいた。最も適切な行動はどれか。","qz":"Claude的记忆功能已开启。你发现之前的对话中处理了客户的个人信息。最恰当的行动是哪一项？","o":[{"j":"設定でメモリの内容を確認・編集して該当情報を削除し、必要に応じて社内規程に従い報告する","z":"在设置中查看、编辑记忆内容并删除相关信息，必要时按公司规定报告"},{"j":"そのうち自然に忘れるので何もしない","z":"之后会自然遗忘，所以什么也不做"},{"j":"メモリ機能は個人情報を保存しないので問題ない","z":"记忆功能不会保存个人信息，所以没问题"},{"j":"新しい会話で「以前の顧客情報はすべて忘れて」と指示すれば、メモリと会話履歴から完全に削除される","z":"在新对话中指示“忘掉之前所有客户信息”，就会从记忆和对话历史中完全删除"}],"a":[0],"e":"记忆可以在设置中查看、编辑和删除；处理了不该输入的个人信息时，还应按公司规定报告（对话本身的删除等）。不能指望自然遗忘；口头说“忘掉”不能保证删除对话历史等所有数据；记忆可能包含任何过去提到的信息。","ej":"メモリは設定で確認・編集・削除、必要なら報告"},{"id":"d6-018","d":6,"t":"6.3","n":1,"q":"社内のAI利用ポリシーでは「業務では会社が契約した環境のみ使用」と定められている。急ぎの作業で会社のClaudeにアクセスできないとき、最も適切な行動はどれか。","qz":"公司AI使用政策规定“业务中只能使用公司签约的环境”。在紧急工作中无法访问公司的Claude时，最恰当的行动是哪一项？","o":[{"j":"機密情報を含まない部分に限れば影響は小さいので、個人の無料アカウントで作業し、後でIT部門に報告する","z":"只限于不含机密信息的部分影响很小，所以用个人免费账号处理，事后向IT部门报告"},{"j":"ポリシーに従い、アクセス復旧を待つか、IT部門に連絡して代替手段を確認する","z":"遵守政策，等待访问恢复或联系IT部门确认替代手段"},{"j":"同僚のアカウントを借りる","z":"借用同事的账号"},{"j":"個人のスマートフォンの無料アカウントで代わりに作業する","z":"用个人手机上的免费账号代替处理"}],"a":[1],"e":"即使紧急也要遵守组织的AI政策，通过正式渠道（IT部门）解决。个人账号属于“影子AI”，绕开管控；借用账号违反账户管理规定；自行扩大解释政策同样不合规。","ej":"緊急時もポリシー遵守・正規ルートで対応"},{"id":"d6-019","d":6,"t":"6.3","n":2,"q":"組織でClaudeを安全に展開するためのガバナンス施策として適切なものを2つ選べ。","qz":"为了在组织中安全推广Claude，请选出2项恰当的治理措施。","o":[{"j":"入力してよい情報の区分と禁止事項を明文化し、利用者に周知する","z":"把可以输入的信息分类和禁止事项写成明文，并告知用户"},{"j":"問題が起きるまでは利用状況を一切確認しない","z":"在出问题之前完全不确认使用情况"},{"j":"全社員に同じ管理者権限を付与する","z":"给所有员工授予相同的管理员权限"},{"j":"ルールは作らず、各自の良識に任せる","z":"不制定规则，交给每个人的良知"},{"j":"利用状況の確認やアクセス管理など、管理者による統制の仕組みを整える","z":"建立管理员管控机制，如确认使用情况和访问管理"}],"a":[0,4],"e":"治理要有明确的数据分类与禁止事项，并配合管理员层面的访问管理与使用状况监控。只靠个人良知不可控；不监控无法及时发现问题；全员管理员权限违反最小权限原则。","ej":"ルール明文化+管理者統制"},{"id":"d6-020","d":6,"t":"6.3","n":1,"q":"Claudeで作成した対外向け資料について、社内ポリシーでは「AI生成物は公開前に責任者の承認が必要」と定められている。締切が迫っている場合の最も適切な対応はどれか。","qz":"关于用Claude制作的对外资料，公司政策规定“AI生成物在公开前需要负责人批准”。截止日期迫近时，最恰当的应对是哪一项？","o":[{"j":"締切を優先して公開し、公開後すぐに責任者へ報告して事後承認を得る","z":"优先截止日期先公开，公开后立即向负责人报告并获得事后批准"},{"j":"責任者に早めに状況を伝えて承認を依頼し、承認を得てから公開する","z":"尽早向负责人说明情况并请求批准，获得批准后再公开"},{"j":"承認を省略して公開し、後で報告する","z":"省略批准直接公开，事后再报告"},{"j":"AI生成であることを隠して承認プロセスを回避する","z":"隐瞒是AI生成的以规避审批流程"}],"a":[1],"e":"时间紧张也要遵守审批流程，应尽早沟通以获得批准后再公开。先发后报、事后补批、隐瞒AI使用都违反政策和透明原则。","ej":"締切が迫っても承認プロセスを守る"},{"id":"d6-021","d":6,"t":"6.3","n":1,"q":"新しいコネクタ(社外のSaaSとの連携)を部署で使いたい。組織のガバナンスの観点で最も適切な進め方はどれか。","qz":"部门想使用新的连接器（与外部SaaS集成）。从组织治理角度，最恰当的推进方式是哪一项？","o":[{"j":"便利そうなので、各自が個人判断で接続する","z":"看起来方便，每个人自行判断连接"},{"j":"コネクタは全て危険なので一律禁止を提案する","z":"认为所有连接器都危险，提议一律禁止"},{"j":"利用目的とアクセスするデータの範囲を整理し、管理者・情報セキュリティ部門の承認を得てから有効化する","z":"整理使用目的和要访问的数据范围，获得管理员和信息安全部门批准后再启用"},{"j":"まず自分のアカウントで接続して数週間試し、問題がなければ部署全体に展開してから管理者に報告する","z":"先用自己的账号连接试用几周，没有问题就推广到整个部门，然后向管理员报告"}],"a":[2],"e":"新的外部集成会扩大数据访问范围，应明确目的和数据范围，经管理员/安全部门审批后启用（团队/企业版中连接器本就由管理员启用）。个人随意连接、试用后免审批都绕开治理；一律禁止则过度。","ej":"新しい連携は目的・範囲を整理し承認を得る"},{"id":"d6-022","d":6,"t":"6.3","n":1,"q":"社員がClaudeの出力をそのまま社外向けレポートに使用したところ、誤った統計値が含まれていた。再発防止策として最も適切なものはどれか。","qz":"员工把Claude的输出直接用于对外报告，结果其中包含错误的统计数值。作为防止再发的措施，最恰当的是哪一项？","o":[{"j":"Claudeの利用を全面禁止する","z":"全面禁止使用Claude"},{"j":"担当者を処分して終わりにする","z":"处分负责人后就结束"},{"j":"対外資料の数値・事実は一次情報で検証し、レビュー記録を残すルールを定め、周知する","z":"制定并告知规则：对外资料中的数值和事实必须用一次信息验证，并保留审核记录"},{"j":"全員のプロンプトに「正確な統計値のみを使い、誤りは含めないこと」と必ず書くよう指導する","z":"指导所有人在提示中必须写上“只使用准确的统计值，不得包含错误”"}],"a":[2],"e":"根本对策是建立验证流程（以一次信息核对数值事实）并留下审核记录。全面禁止过度；只处分个人不解决流程问题；提示中写“准确”并不能防止幻觉。","ej":"検証ルール+レビュー記録で再発防止"},{"id":"d6-023","d":6,"t":"6.3","n":1,"q":"利用者が、Claudeの出力に差別的と受け取られかねない表現を見つけた。組織として最も適切な対応の流れはどれか。","qz":"用户在Claude的输出中发现了可能被视为歧视的表达。作为组织，最恰当的应对流程是哪一项？","o":[{"j":"その出力を使用せず修正し、社内で定められた報告窓口に共有して、プロンプトやガイドラインの改善につなげる","z":"不使用该输出并修正，向公司规定的报告窗口共享，以改进提示和指南"},{"j":"表現を少し言い換えて差別的に見えないよう調整し、報告は不要として作業を続ける","z":"稍微改写表达使其看起来不歧视，认为不需要报告并继续工作"},{"j":"個人で削除し、誰にも共有しない","z":"个人删除，不与任何人共享"},{"j":"SNSで公開してAIの問題点を指摘する","z":"在社交媒体上公开，指出AI的问题"}],"a":[0],"e":"发现有问题的输出时，应停止使用、修正，并按组织流程报告，以便改进指南和防止再发。私下改写或删除而不报告会失去改进机会；擅自在SNS公开可能泄露内部信息且不符合流程。","ej":"問題出力は使わず、報告窓口へ共有し改善"},{"id":"d6-024","d":6,"t":"6.3","n":1,"q":"部署のProject指示に「顧客情報は入力しないこと」と書いておけば、データ保護のガバナンスとして十分か。最も適切な考え方はどれか。","qz":"如果在部门的Project指示中写上“不要输入客户信息”，作为数据保护治理是否足够？最恰当的观点是哪一项？","o":[{"j":"十分である。Project指示に書かれた禁止事項は、利用者が顧客情報を入力しようとした時点でClaudeが自動的に検知して拒否するため","z":"足够。写在Project指示中的禁止事项，会在用户试图输入客户信息时由Claude自动检测并拒绝"},{"j":"不十分である。Project指示はClaudeの応答を方向付けるもので、利用者の入力を制御する仕組みではないため、利用規程・教育・管理者設定と組み合わせる必要がある","z":"不够。Project指示是引导Claude回答的，不是控制用户输入的机制，需要与使用规定、培训、管理员设置结合"},{"j":"十分である。指示に書いた内容は法的拘束力を持つため","z":"足够。写在指示里的内容具有法律约束力"},{"j":"不要である。顧客情報の入力は常に許可されているため","z":"不需要。输入客户信息总是被允许的"}],"a":[1],"e":"Project指示只影响Claude如何回应，不能阻止用户输入数据，也没有法律效力。数据保护需要政策、培训、管理员管控等多层措施。","ej":"Project指示は入力制御ではない→規程・教育・管理設定と併用"},{"id":"d6-025","d":6,"t":"6.3","n":2,"q":"組織のAIポリシーに沿ってClaudeを使う個人として、日頃から心がけるべきことを2つ選べ。","qz":"作为按照组织AI政策使用Claude的个人，请选出2项平时应注意的事情。","o":[{"j":"ポリシーが更新されていないか定期的に確認する","z":"定期确认政策是否有更新"},{"j":"判断に迷う使い方は、自己判断せず担当部門に相談する","z":"拿不准的用法不自行判断，咨询负责部门"},{"j":"他の人が使っている方法なら、ポリシーを確認せず真似してよい","z":"别人在用的方法，不确认政策也可以模仿"},{"j":"便利な新機能は、組織の承認前でも積極的に業務で試す","z":"方便的新功能，即使组织尚未批准也积极在业务中试用"},{"j":"ポリシーは入社時に一度読めば十分である","z":"政策入职时读一次就够了"}],"a":[0,1],"e":"AI政策随技术变化频繁更新，需定期确认；不确定时咨询负责部门。盲目模仿他人、只读一次、未批准就在业务中试用新功能都可能违规。","ej":"ポリシーは定期確認、迷ったら相談"},{"id":"d6-026","d":6,"t":"6.4","n":1,"q":"Claudeを大きく活用して作成したブログ記事を、自社サイトで公開する。AI Fluencyの「Diligence(責任)」の観点で最も適切な対応はどれか。","qz":"要在公司网站发布大量借助Claude写成的博客文章。从AI Fluency的“Diligence（尽责）”角度，最恰当的应对是哪一项？","o":[{"j":"AI利用は一切記載せず、自分が書いたと主張する","z":"完全不写AI使用情况，声称是自己写的"},{"j":"内容の正確性を自分で確認し、組織の方針に沿ってAIの利用について適切に開示し、内容に責任を持つ","z":"自己确认内容的准确性，按组织方针适当披露AI的使用，并对内容负责"},{"j":"正確性の確認は読者に任せる","z":"准确性的确认交给读者"},{"j":"Claudeに事実確認まで依頼して誤りがないと回答を得たうえで、AIの利用は記載せずに公開する","z":"让Claude也做事实确认并得到没有错误的回答后，不注明AI使用直接公开"}],"a":[1],"e":"Diligence强调对AI参与产出的内容负责：自己验证、透明（按方针适当披露）、承担责任。让Claude自查不能代替本人验证；把责任推给AI或读者、刻意隐瞒都违背这一原则。","ej":"Diligence=検証・透明性・責任"},{"id":"d6-027","d":6,"t":"6.4","n":1,"q":"Claudeに「若手社員」と「ベテラン社員」向けの研修案内を作らせたところ、若手を一律に未熟と決めつける表現が含まれていた。最も適切な対応はどれか。","qz":"让Claude制作面向“年轻员工”和“资深员工”的培训通知时，其中包含把年轻人一律认定为不成熟的表达。最恰当的应对是哪一项？","o":[{"j":"ステレオタイプに基づく表現を修正し、必要なら「年齢や属性で決めつけない」と条件を加えて再生成する","z":"修正基于刻板印象的表达，必要时加上“不要以年龄或属性下定论”的条件重新生成"},{"j":"表現が強いほうが伝わるので、さらに強調させる","z":"表达越强越能传达，所以让它进一步强调"},{"j":"若手向けの研修自体をやめる","z":"取消面向年轻人的培训本身"},{"j":"Claudeは中立に作られているので、年齢層による表現の違いは統計的な傾向を反映したものとしてそのまま使う","z":"Claude被设计为中立，因此年龄层间的表达差异是反映统计趋势，直接使用"}],"a":[0],"e":"AI输出可能含有偏见或刻板印象，使用者需识别并修正，必要时在提示中加入约束再生成。没有恶意不代表没有伤害；取消培训不解决问题；强化偏见会造成伤害。","ej":"ステレオタイプ表現は修正・条件を加えて再生成"},{"id":"d6-028","d":6,"t":"6.4","n":1,"q":"顧客との対話にClaudeを使って生成した文章を送る場合、倫理的な観点で最も重視すべきことはどれか。","qz":"在与客户的沟通中发送用Claude生成的文字时，从伦理角度最应重视的是哪一项？","o":[{"j":"顧客の満足度を高めるため、競合よりも有利な条件を可能な限り強調した表現になっていること","z":"为提高客户满意度，表达尽可能强调比竞争对手更有利的条件"},{"j":"送信までの時間ができるだけ短いこと","z":"发送前的时间尽可能短"},{"j":"顧客を誤解させる内容(誇大な表現や事実と異なる約束)が含まれていないかを確認する","z":"确认其中是否包含误导客户的内容（夸大表达或与事实不符的承诺）"},{"j":"文章ができるだけ長いこと","z":"文字尽可能长"}],"a":[2],"e":"伦理上最重要的是不误导、不做虚假承诺，保护客户利益。过度强调有利条件可能构成夸大；模型版本、速度、长度都不是伦理核心。","ej":"誤解を招く表現・虚偽の約束がないか確認"},{"id":"d6-029","d":6,"t":"6.4","n":2,"q":"AI利用の倫理的な影響について、適切な考え方を2つ選べ。","qz":"关于AI使用的伦理影响，请选出2项恰当的观点。","o":[{"j":"AIは中立なので、倫理的配慮は不要である","z":"AI是中立的，因此不需要伦理考量"},{"j":"AIの出力は学習データの偏りを反映する可能性があるため、影響を受ける人の視点で確認する","z":"AI输出可能反映训练数据的偏差，因此要从受影响者的角度确认"},{"j":"効率が上がるなら、透明性は犠牲にしてよい","z":"只要效率提高，可以牺牲透明性"},{"j":"法律で禁止されていなければ、倫理的な問題はない","z":"只要法律不禁止，就没有伦理问题"},{"j":"AIの出力を利用した結果の責任は、最終的に利用した人・組織にある","z":"利用AI输出所产生结果的责任，最终在于使用的人和组织"}],"a":[1,4],"e":"责任在使用者和组织；AI可能带有偏差，需要从受影响者的视角审视。AI并非天然中立；合法不等于合乎伦理；不能以效率为由牺牲透明性。","ej":"責任は人・組織／偏りを影響を受ける人の視点で確認"},{"id":"d6-030","d":6,"t":"6.4","n":1,"q":"社内の評価面談の準備で、上司がClaudeに部下のSlack発言を大量に読み込ませて「性格分析」をさせようとしている。最も適切な判断はどれか。","qz":"为准备内部评价面谈，上司想让Claude读取下属大量的Slack发言进行“性格分析”。最恰当的判断是哪一项？","o":[{"j":"分析結果を本人に見せなければ問題ない","z":"只要不让本人看分析结果就没问题"},{"j":"本人の同意や社内規程の根拠がなく、プライバシーや公正性の懸念が大きいため行うべきではない","z":"没有本人同意或公司规定依据，隐私和公正性方面担忧很大，因此不应进行"},{"j":"業務チャットは会社のものなので自由に分析してよい","z":"业务聊天属于公司，可以自由分析"},{"j":"業務チャットは会社の資産であり、Claudeの分析は人の主観より客観的なので、評価の参考資料として使ってよい","z":"业务聊天是公司资产，而且Claude的分析比人的主观更客观，可以作为评价参考资料"}],"a":[1],"e":"未经同意、无规定依据地对个人进行“性格分析”并用于评价，涉及隐私、监视和公平问题，属于不恰当用途。“公司所有”不等于可以任意用于个人画像；隐瞒结果更不透明；AI分析并不客观可靠。","ej":"同意・根拠のない個人プロファイリングはNG"},{"id":"d6-031","d":6,"t":"6.4","n":1,"q":"Claudeで作成した画像やデザイン案を広告に使う予定である。倫理・権利の観点で最も適切な対応はどれか。","qz":"计划把用Claude制作的图像或设计方案用于广告。从伦理和权利角度，最恰当的应对是哪一项？","o":[{"j":"広告審査は不要として公開する","z":"认为不需要广告审核就公开"},{"j":"既存の作品やブランド、実在の人物に酷似していないかを確認し、社内の法務・ブランド規程に沿って使用可否を判断する","z":"确认是否与现有作品、品牌或真实人物高度相似，并按公司法务和品牌规定判断能否使用"},{"j":"AI生成物には著作権が発生しないため、既存作品に似ていても権利侵害にはならないと判断して使用する","z":"AI生成物不产生著作权，因此即使与现有作品相似也判断为不构成侵权并使用"},{"j":"AIが作ったものは権利問題が一切発生しない","z":"AI制作的东西完全不会产生权利问题"}],"a":[1],"e":"AI生成内容也可能侵犯他人作品、商标或肖像权，需确认相似性并按法务/品牌规定判断。认为毫无权利问题是误解；刻意模仿著名角色有侵权风险；省略审核不合规。","ej":"既存作品・ブランド・人物との類似を確認"},{"id":"d6-032","d":6,"t":"6.4","n":1,"q":"Claudeに顧客向け説明資料を作らせる際、障がいのある人を含む多様な読み手に配慮したい。最も適切な依頼はどれか。","qz":"让Claude制作面向客户的说明资料时，想照顾到包括残障人士在内的多样化读者。最恰当的请求是哪一项？","o":[{"j":"「一般的な読み手だけを想定して」","z":"“只设想一般读者”"},{"j":"「文字を小さくして情報量を増やして」","z":"“把字缩小以增加信息量”"},{"j":"「平易な表現を使い、図には代替テキストを付け、色だけに頼らない構成にして」","z":"“使用平易的表达，给图片加替代文字，不要只依赖颜色来区分”"},{"j":"「主要な読み手である一般顧客に合わせて、色分けした図表を中心に情報を視覚的に伝えて」","z":"“配合主要读者一般客户，以颜色区分的图表为中心，视觉化地传达信息”"}],"a":[2],"e":"包容性（可访问性）是负责任使用的一部分：平易语言、替代文字、不只用颜色传达信息。堆砌术语、只考虑一般读者、缩小字体都会排除部分读者。","ej":"平易な表現・代替テキスト・色に頼らない"},{"id":"d6-033","d":6,"t":"6.4","n":1,"q":"競合他社の社員の個人SNSを大量に収集し、Claudeで分析して引き抜き対象を探そうという提案があった。最も適切な判断はどれか。","qz":"有人提议大量收集竞争对手员工的个人社交账号，用Claude分析来寻找挖角对象。最恰当的判断是哪一项？","o":[{"j":"分析結果を社外に出さなければ問題ない","z":"只要分析结果不外传就没问题"},{"j":"個人を対象にした監視・プロファイリングにあたり、プライバシーや法令・倫理上の問題があるため行わない","z":"属于针对个人的监视和画像，存在隐私、法律和伦理问题，因此不做"},{"j":"Claudeが拒否しなければ問題ない","z":"只要Claude不拒绝就没问题"},{"j":"対象はSNSで公開されている情報に限られるため、個人の同意がなくても採用活動のための分析は問題ない","z":"对象只限于社交媒体上公开的信息，因此即使没有个人同意，为招聘活动进行分析也没问题"}],"a":[1],"e":"即使是公开信息，大规模收集并对特定个人进行画像也可能违反隐私法规和伦理。公开≠可以任意使用；不外传不能消除问题；AI没有拒绝也不代表行为正当，判断责任在人。","ej":"公開情報でも個人の監視・プロファイリングはNG"},{"id":"d7-001","d":7,"t":"7.1","n":1,"q":"数週間使い続けている1つのチャットで、Claudeが序盤に伝えたルールを守らなくなり、回答の質も落ちてきた。最も可能性の高い原因と対処はどれか。","qz":"在一个连续使用了好几周的对话中，Claude 不再遵守开头告知的规则，回答质量也在下降。最可能的原因和处理方式是哪一个？","o":[{"j":"Claudeが長時間の利用で疲れて集中力が落ちているので、数時間ほど時間を空けてから同じチャットで続ける","z":"Claude 长时间使用后疲劳、注意力下降，所以隔几个小时后在同一对话中继续"},{"j":"会話が長くなりコンテキストが圧迫されている。要点とルールを要約して新しいチャット(またはProject)で再開する","z":"对话太长，上下文被挤占。把要点和规则总结后，在新对话（或 Project）中重新开始"},{"j":"モデルが故障しているので、サポートに連絡する","z":"模型坏了，联系客服"},{"j":"ルールを守らせるため、同じチャットで毎回のメッセージの冒頭にルール全文をコピーして貼り続ける","z":"为了让它遵守规则，在同一对话中每条消息开头都复制粘贴规则全文"}],"a":[1],"e":"对话过长时，上下文窗口被大量历史占用，早期指示的影响变弱，质量下降。正确做法是总结要点、在新对话中重启；长期规则最好放入 Project 指示。AI 不会“疲劳”；这不是故障；在同一长对话里不断复制只会更挤。","ej":"長い会話で品質低下→要約して新しいチャットで再開。恒久ルールはProjectへ。"},{"id":"d7-002","d":7,"t":"7.1","n":1,"q":"Projectにアップロードした最新の価格表があるのに、Claudeが古い価格で回答した。最初に確認すべきこととして最も適切なものはどれか。","qz":"Project 里已经上传了最新价格表，但 Claude 用旧价格回答了。最应该首先确认的是哪一项？","o":[{"j":"プロジェクトナレッジに旧版の価格表も残っていないか、指示にどの資料を優先するか書かれているか","z":"项目知识中是否还留着旧版价格表，指示里是否写明优先使用哪份资料"},{"j":"より高性能なモデルが契約されているか、またそのモデルが最新の学習データを持っているか","z":"是否签约了更高性能的模型，以及该模型是否有最新的训练数据"},{"j":"チャットの文字サイズ設定","z":"对话界面的字号设置"},{"j":"他の社員も同じ質問をしたかどうか","z":"其他员工是否也问过同样的问题"}],"a":[0],"e":"知识中新旧版本并存、未指定优先级，是引用旧信息的常见原因。应删除或标注旧版，并在指示中写明以最新版为准。模型性能、字号、他人提问与此无关。","ej":"古い情報で回答→ナレッジに旧版が残っていないか、優先順位の指示を確認。"},{"id":"d7-003","d":7,"t":"7.1","n":1,"q":"Claudeに「簡潔に」と指示しているのに、毎回長い回答が返ってくる。最も効果的な修正はどれか。","qz":"已经指示 Claude“简洁一点”，但每次回答都很长。最有效的修改是哪一个？","o":[{"j":"「簡潔に」を3回繰り返して書く","z":"把“简洁”写三遍"},{"j":"回答が長くなるのはモデルの特性なので、より短い回答をする傾向のある別のモデルに切り替える","z":"回答变长是模型特性，所以换成倾向于简短回答的其他模型"},{"j":"回答が長いのは仕様なので諦める","z":"回答长是规格问题，放弃"},{"j":"「3つの箇条書き、各1文以内」のように具体的な分量と形式を指定し、短い例を示す","z":"指定具体的数量和格式，如“3 条要点、每条不超过 1 句”，并给出简短示例"}],"a":[3],"e":"“简洁”是模糊的，每个人理解不同。把要求量化（条数、句数、字数）并给示例，才能稳定控制长度。重复同一模糊词无效；换模型不一定解决；放弃没有必要。","ej":"曖昧な指示(「簡潔に」)は数値と形式で具体化し、例を示す。"},{"id":"d7-004","d":7,"t":"7.1","n":2,"q":"Claudeの出力が期待どおりでないとき、原因を診断するために確認すべき観点として適切なものはどれか。2つ選べ。","qz":"当 Claude 的输出不如预期时，为诊断原因，以下哪些是应检查的方面？请选择 2 项。","o":[{"j":"Claudeに感情的に強く言ったかどうか","z":"是否对 Claude 说了情绪激烈的话"},{"j":"タスクに対してモデルや機能(検索、Research等)の選択が適切か","z":"针对任务，模型和功能（搜索、Research 等）的选择是否合适"},{"j":"プロンプトを書いた時刻","z":"写提示词的时间"},{"j":"使用しているブラウザの色設定","z":"所用浏览器的颜色设置"},{"j":"目的・読み手・制約・出力形式など、必要な情報がプロンプトに含まれているか","z":"提示词中是否包含目的、读者、约束、输出格式等必要信息"}],"a":[1,4],"e":"诊断输出问题，首先看提示词是否缺信息（描述问题），其次看模型/功能是否匹配任务（例如需要最新信息却没开搜索）。浏览器颜色、情绪化语气、书写时间都与输出质量无关。","ej":"診断の基本:プロンプトの情報不足か、モデル・機能の選択ミスか。"},{"id":"d7-005","d":7,"t":"7.1","n":1,"q":"最新のニュースについて質問したところ、Claudeが古い情報に基づいて回答した。最も適切な対処はどれか。","qz":"询问最新新闻时，Claude 基于旧信息作答。最合适的处理是哪一个？","o":[{"j":"同じ質問を何度も繰り返す","z":"反复问同一个问题"},{"j":"Claudeの回答を正しいものとして扱う","z":"把 Claude 的回答当作正确的"},{"j":"Web検索を有効にして再度質問し、出典と日付を確認する","z":"开启网络搜索后再次提问，并确认出处和日期"},{"j":"もっと丁寧な言葉で聞き直し、「最新の情報で答えてください」と強調して再度質問する","z":"用更礼貌的语言重新问，并强调“请用最新信息回答”"}],"a":[2],"e":"模型的训练知识有截止时间，最新信息需要通过网络搜索获取，并核对出处和日期。重复提问和改变措辞不会带来新信息；把过时回答当作正确有风险。","ej":"最新情報が古い→学習データの限界。Web検索を使い、出典と日付を確認。"},{"id":"d7-006","d":7,"t":"7.1","n":1,"q":"Claudeに顧客データの集計を依頼したところ、合計値が元データと一致しなかった。最も適切な対応はどれか。","qz":"请 Claude 汇总客户数据，结果合计值与原始数据不一致。最合适的应对是哪一个？","o":[{"j":"合計値の差は小さいので無視する","z":"差额不大，忽略"},{"j":"コード実行(分析ツール)を使って計算させ、計算手順を示させた上で、元データとサンプル照合する","z":"让它使用代码执行（分析工具）计算并展示计算步骤，再与原始数据抽样核对"},{"j":"Claudeに「この合計は本当に正しいですか」と確認し、「正しい」と回答があればそのまま使う","z":"向 Claude 确认“这个合计真的正确吗”，如果回答“正确”就直接使用"},{"j":"集計作業にはAIは使えないので手作業に戻す","z":"汇总工作不能用 AI，改回手工"}],"a":[1],"e":"精确计算应借助代码执行，让过程透明可复核，并与原始数据抽样对照。忽略差异有风险；模型的自我确认不是可靠依据；完全放弃 AI 则过度反应。","ej":"計算ミス→コード実行で計算させ、手順を示させ、元データと照合。自己申告は根拠にならない。"},{"id":"d7-007","d":7,"t":"7.1","n":1,"q":"Claudeが、Projectの指示に書いた「回答は必ず日本語で」というルールを、英語の資料について質問したときに守らないことがあった。最も適切な改善はどれか。","qz":"Project 指示中写了“回答必须用日语”，但在询问英文资料时，Claude 有时不遵守。最合适的改进是哪一个？","o":[{"j":"英語の資料を使うのをやめる","z":"不再使用英文资料"},{"j":"Projectを削除して作り直す","z":"删除 Project 重新建立"},{"j":"日本語で質問すれば必ず日本語で回答されるので、指示は変えずに質問の言語だけを統一する","z":"只要用日语提问就一定用日语回答，所以不改指示，只统一提问语言"},{"j":"「資料が英語の場合も、回答と引用の訳は日本語で出力する」と、例外になりやすい状況を明示して指示に追記する","z":"在指示中补充，明确写出容易成为例外的情况：“即使资料是英文，回答和引用译文也用日语输出”"}],"a":[3],"e":"指示在特定情境（如英文资料）下失效时，应把该情境明确写进指示。不用英文资料会限制业务；删除重建无针对性；仅靠日语提问并不能保证。","ej":"特定の状況でルールが守られない→その状況を明示して指示に追記。"},{"id":"d7-008","d":7,"t":"7.1","n":1,"q":"Claudeが添付したExcelファイルの一部のシートを読み落としているようだ。最も適切な対応はどれか。","qz":"Claude 似乎漏读了附加 Excel 文件的部分工作表。最合适的应对是哪一个？","o":[{"j":"対象のシート名と見るべき範囲を明示し、各シートの内容を確認したか先に一覧で報告させる","z":"明确目标工作表名称和需要查看的范围，并让它先以列表报告是否确认了每张工作表的内容"},{"j":"Excelファイルを画像(スクリーンショット)に変換し、シートごとに1枚ずつ送り直す","z":"把 Excel 文件转成图片（截图），每张工作表各发一张"},{"j":"データ分析にはClaudeを使わない","z":"数据分析不用 Claude"},{"j":"読み落としは仕方がないので、そのまま結果を使う","z":"漏读没办法，直接用结果"}],"a":[0],"e":"明确指出要处理的工作表和范围，并让 Claude 先报告读取情况，可以发现和防止遗漏。转成图片会丢失结构化数据；放弃使用和忽略问题都不合适。","ej":"読み落とし対策:対象範囲を明示し、先に読み取り内容を報告させる。"},{"id":"d7-019","d":7,"t":"7.1","n":1,"q":"Claudeが社内規程に関する質問に、規程に存在しない条項を引用して回答した。再発防止策として最も適切なものはどれか。","qz":"Claude 在回答有关内部规定的问题时，引用了规定中并不存在的条款。最合适的防止再发措施是哪一个？","o":[{"j":"規程の原文をナレッジとして提供し、回答時は該当箇所を引用させ、記載がなければ「記載なし」と答えるよう指示する","z":"提供规定原文作为知识，回答时让它引用相应原文，如无记载则指示回答“无记载”"},{"j":"Claudeに「嘘をつかないで」と伝える","z":"告诉 Claude“不要说谎”"},{"j":"回答をより断定的な口調にさせ、条文番号は必ず明記するよう求めて説得力を高める","z":"让回答语气更断定，并要求必须写明条款编号以增强说服力"},{"j":"引用を禁止し、要約だけを出させる","z":"禁止引用，只输出总结"}],"a":[0],"e":"编造条款是幻觉。对策是提供权威原文作为依据、要求引用原文并允许回答“无记载”。单纯说“别说谎”效果有限；断定语气会掩盖不确定性；禁止引用反而更难核实。","ej":"架空の条項→原文を根拠として渡し、引用させ、「記載なし」を許可。"},{"id":"d7-020","d":7,"t":"7.1","n":2,"q":"コネクタ経由でGoogle Driveの資料を参照させたいが、Claudeが目的のファイルを見つけられない。考えられる原因として適切なものはどれか。2つ選べ。","qz":"想通过连接器让 Claude 参考 Google Drive 的资料，但 Claude 找不到目标文件。以下哪些是可能的原因？请选择 2 项。","o":[{"j":"Claudeの回答スタイルがFormalになっている","z":"Claude 的回答风格设成了 Formal"},{"j":"チャットの背景色がダークモードになっている","z":"对话背景是深色模式"},{"j":"プロンプトが日本語で書かれている","z":"提示词是用日语写的"},{"j":"利用者のアカウントにそのファイルへのアクセス権限がない","z":"使用者的账户没有该文件的访问权限"},{"j":"コネクタが有効化・認証されていない、または組織で管理者が許可していない","z":"连接器未启用或未认证，或组织管理员未允许"}],"a":[3,4],"e":"连接器只能在已启用、已认证且被允许的范围内，以用户自身权限访问数据。所以未启用/未获管理员许可、用户本身没有文件权限都是常见原因。回答风格、语言、深色模式与访问无关。","ej":"コネクタで見つからない→有効化・認証・管理者許可、そして利用者自身の権限を確認。"},{"id":"d7-024","d":7,"t":"7.1","n":1,"q":"Claudeが特定の質問に対して回答を控えたが、業務上正当な依頼(例:セキュリティ研修用に、フィッシングメールの見分け方をまとめる)だった。最も適切な対応はどれか。","qz":"Claude 对某个问题拒绝回答，但这是业务上正当的请求（例如为安全培训整理识别钓鱼邮件的方法）。最合适的应对是哪一个？","o":[{"j":"目的・利用場面・対象者などの正当な文脈を明確に伝えて依頼し直し、それでも難しい場合は社内の適切な窓口に相談する","z":"明确说明目的、使用场景、对象等正当背景后重新请求，如仍有困难，向公司内适当窗口咨询"},{"j":"Claudeの制限を回避するため、インターネットで紹介されている言い回しや裏技を探して試してみる","z":"为绕过 Claude 的限制，在网上寻找并尝试介绍过的说法和窍门"},{"j":"別人になりすました設定でClaudeをだます","z":"假装成别人来欺骗 Claude"},{"j":"あきらめて研修資料を作らない","z":"放弃，不做培训资料"}],"a":[0],"e":"当正当请求被误判时，补充清楚的业务背景（目的、用途、对象）通常就能得到帮助；必要时按组织流程咨询。寻找绕过方法或伪装身份违反负责任使用原则；直接放弃也不必要。","ej":"正当な依頼が断られたら文脈を明確に伝え直す。回避策やなりすましは不可。"},{"id":"d7-009","d":7,"t":"7.2","n":1,"q":"Claudeで作成した営業メールのテンプレートについて、実際に送信したところ返信率が低かった。次に取るべき行動として最も適切なものはどれか。","qz":"用 Claude 制作的销售邮件模板实际发送后，回复率很低。下一步最合适的行动是哪一个？","o":[{"j":"返信率が低いのはClaudeが営業文書に向いていないためと判断し、Claudeの利用を全面的にやめる","z":"判断回复率低是因为 Claude 不适合销售文书，全面停止使用 Claude"},{"j":"同じテンプレートを送信数を増やして使い続ける","z":"继续使用同一模板并增加发送量"},{"j":"返信があったメールとなかったメールの違いや顧客の反応をClaudeに共有し、仮説を立てて改善案を作り、比較検証する","z":"把有回复和没回复邮件的差异、客户反应分享给 Claude，提出假设、制作改进方案并对比验证"},{"j":"件名や書き出しの表現を毎回ランダムに変えて送信し、返信率が上がるまで続ける","z":"每次随机更改标题和开头表达后发送，一直持续到回复率上升"}],"a":[2],"e":"根据实际结果反馈来调整：分析差异→形成假设→改进→对比验证，是持续优化的循环。放弃使用、盲目加量、随机修改都缺乏依据。","ej":"結果(フィードバック)を共有→仮説→改善→比較検証のサイクル。"},{"id":"d7-010","d":7,"t":"7.2","n":1,"q":"チームで使っているProjectについて、メンバーから「回答が専門的すぎる」という声が複数上がった。最も適切な対応はどれか。","qz":"关于团队使用的 Project，多名成员反馈“回答太专业了”。最合适的应对是哪一个？","o":[{"j":"各メンバーが質問のたびに「やさしく説明して」と書けば解決するので、Project側では何も変更しない","z":"每个成员每次提问时写“请通俗解释”就能解决，所以 Project 方面不做任何修改"},{"j":"フィードバックの具体例を集め、プロジェクト指示に想定読者と表現レベルを追記し、変更後の反応を確認する","z":"收集反馈的具体例子，在项目指示中补充预想读者和表达水平，并确认修改后的反应"},{"j":"Projectを廃止して各自のチャットで使う","z":"废除 Project，各自在个人对话中使用"},{"j":"最も専門的なメンバーに合わせるため、変更しない","z":"为了配合最专业的成员，不做修改"}],"a":[1],"e":"多人反馈说明是共性问题，应在共享配置（项目指示）中统一修正，并在修改后确认效果。让每个人自己补充既低效又不一致；废除 Project 失去共享价值；不改则无视用户需求。","ej":"共通のフィードバックは共有設定(プロジェクト指示)を更新し、効果を確認。"},{"id":"d7-011","d":7,"t":"7.2","n":2,"q":"Claudeの出力に対するフィードバックをもとにアプローチを調整する際の行動として、適切なものはどれか。2つ選べ。","qz":"根据对 Claude 输出的反馈调整方法时，以下哪些行动是恰当的？请选择 2 项。","o":[{"j":"フィードバックの内容を確認せず、とりあえずプロンプトを長くする","z":"不确认反馈内容，先把提示词加长再说"},{"j":"フィードバックがあるたびに全く別のツールに乗り換える","z":"每次有反馈就换一个完全不同的工具"},{"j":"一度に一つの要素を変え、変更前後の結果を比較する","z":"一次只改变一个要素，比较修改前后的结果"},{"j":"否定的なフィードバックはすべて無視する","z":"无视所有负面反馈"},{"j":"うまくいった変更は記録し、テンプレートや指示に反映する","z":"把有效的修改记录下来，并反映到模板或指示中"}],"a":[2,4],"e":"一次只改一个变量才能判断哪项改动有效；把有效改动沉淀到模板或指示中，让改进可持续。盲目加长、无视负面反馈、频繁换工具都不是有依据的调整。","ej":"一度に1要素を変えて比較。成功した変更は記録して指示・テンプレートへ反映。"},{"id":"d7-012","d":7,"t":"7.2","n":1,"q":"Claudeが作成した翻訳文について、現地スタッフから「直訳的で不自然」と指摘を受けた。最も適切な調整はどれか。","qz":"当地员工指出 Claude 写的译文“直译、不自然”。最合适的调整是哪一个？","o":[{"j":"読み手と用途(例:現地顧客向けの販促文)を伝え、自然さを優先した意訳を許可し、現地スタッフの確認を継続する","z":"告知读者和用途（如面向当地客户的促销文），允许以自然为优先的意译，并继续请当地员工确认"},{"j":"直訳の方が正確なので、そのまま使い続ける","z":"直译更准确，所以继续使用"},{"j":"翻訳はAIに向かないため、すべて外注する","z":"翻译不适合 AI，全部外包"},{"j":"原文を短く削ってから翻訳させれば自然になるので、原文の情報量を半分程度に減らす","z":"先把原文删短再翻译就会自然，所以把原文的信息量减到一半左右"}],"a":[0],"e":"翻译风格取决于用途与读者。明确用途并允许意译，同时保留母语者审核，是基于反馈的合理调整。坚持直译忽视了反馈；全部外包过度；缩短原文会丢失信息且未必改善自然度。","ej":"翻訳は用途と読み手を伝え、意訳の許可＋ネイティブ確認。"},{"id":"d7-013","d":7,"t":"7.2","n":1,"q":"Claudeによる要約を上司に提出したところ、「結論が最後にあって読みにくい」と言われた。最も効率的な対応はどれか。","qz":"把 Claude 写的总结交给上司后，上司说“结论在最后，不好读”。最高效的应对是哪一个？","o":[{"j":"要約をやめて元の資料をそのまま渡す","z":"不再总结，直接交原始资料"},{"j":"上司が読み慣れるまで同じ形式を続け、慣れてもらうよう要約の読み方を説明した資料を添える","z":"继续使用同样格式直到上司习惯，并附上说明如何阅读总结的资料以便习惯"},{"j":"毎回手作業で結論を先頭に移動させる","z":"每次手动把结论移到开头"},{"j":"「結論を冒頭に1〜2文で示し、その後に根拠を記載する」構成を指示し、今後もその形式を使えるよう指示やテンプレートに反映する","z":"指示采用“开头用 1～2 句给出结论，然后写依据”的结构，并写入指示或模板以便今后沿用"}],"a":[3],"e":"把反馈转化为明确的结构要求，并沉淀到指示/模板中，一次修改长期受益。交原始资料、坚持原格式、每次手工调整都不高效。","ej":"フィードバックは構成指示に落とし込み、指示・テンプレートに反映して再利用。"},{"id":"d7-021","d":7,"t":"7.2","n":1,"q":"Claudeが作成したレポート案に対して、Claude自身に改善点を挙げさせる「自己レビュー」を行った。この手法の位置づけとして最も適切なものはどれか。","qz":"针对 Claude 写的报告草案，让 Claude 自己列出改进点，进行“自我审查”。对这种方法的定位最恰当的是哪一个？","o":[{"j":"自己レビューで問題がなければ、事実確認は不要になる","z":"如果自我审查没有问题，就不需要事实核查"},{"j":"自己レビューは意味がないので行うべきではない","z":"自我审查没有意义，不应进行"},{"j":"自己レビューは構成や抜け漏れの改善に役立つが、事実の正確性は一次情報や人によるレビューで確認する","z":"自我审查有助于改进结构和遗漏，但事实准确性需要用一手资料和人工审核来确认"},{"j":"自己レビューを10回程度繰り返せば、内容の正確性は十分に保証されるので、外部の確認は省略できる","z":"自我审查重复 10 次左右就能充分保证内容准确性，可以省略外部确认"}],"a":[2],"e":"让 Claude 自我审查可以发现结构、清晰度、遗漏等问题，是有效的改进手段；但它不能替代对事实的外部验证，模型的自我判断并不可靠。认为无意义或重复多次即可保证都是误解。","ej":"自己レビューは改善に有効だが、事実確認の代わりにはならない。"},{"id":"d7-014","d":7,"t":"7.3","n":1,"q":"毎週、複数の部署から届く報告メールを読み、要点を1枚にまとめる作業に時間がかかっている。Claudeを使った効率化として最も適切なものはどれか。","qz":"每周阅读多个部门发来的报告邮件并汇总成一页要点，非常耗时。用 Claude 提高效率的最合适方法是哪一个？","o":[{"j":"毎回異なるプロンプトで、その週の内容に合わせてその場で思いついた形式で自由にまとめさせる","z":"每次用不同的提示词，按当周内容临时想到的格式自由汇总"},{"j":"報告メールを読まずに、Claudeに部署の状況を推測させる","z":"不读报告邮件，让 Claude 推测各部门情况"},{"j":"出力形式を固定したプロンプトをProjectに設定し、必要に応じてコネクタでメールを参照させ、最終確認は人が行う","z":"在 Project 中设置固定输出格式的提示词，必要时通过连接器读取邮件，最终由人确认"},{"j":"まとめ作業は効率化が難しいため、各部署の報告メールをそのまま全員に転送し、まとめ作業自体を廃止する","z":"汇总难以提效，所以把各部门的报告邮件直接转发给所有人，取消汇总工作本身"}],"a":[2],"e":"对重复性工作，应固定格式和提示词（Project），利用连接器减少复制粘贴，并保留人工最终确认。临时格式不一致；让 Claude 推测会产生虚假信息；直接取消可能影响业务。","ej":"定型業務はProject＋固定形式、コネクタで手作業削減、最終確認は人。"},{"id":"d7-015","d":7,"t":"7.3","n":1,"q":"大量の問い合わせメールを「請求」「技術」「その他」に分類する作業をClaudeで行いたい。品質を保ちつつコストと時間を抑える考え方として最も適切なものはどれか。","qz":"想用 Claude 把大量咨询邮件分类为“账单”“技术”“其他”。在保证质量的同时控制成本和时间，最合适的思路是哪一个？","o":[{"j":"分類基準と例を明確にしたうえで、単純で大量のタスクに向く高速・低コストのモデルを使い、サンプルで精度を確認する","z":"在明确分类标准和示例的基础上，使用适合大量简单任务的高速、低成本模型，并抽样确认准确率"},{"j":"精度を最大化するため常に最高性能のモデルを使い、さらに全件を人が再確認する","z":"为了最大化准确率，总是使用最高性能
