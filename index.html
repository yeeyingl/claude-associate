function startRandom(){const ds=[...document.querySelectorAll(".rd:checked")].map(x=>+x.value),f=$("#rf").value,n=+$("#rn").value||20;
  let p=QS.filter(q=>ds.includes(q.d));if(f==="new")p=p.filter(q=>!S.ans[q.id]);if(f==="ng")p=p.filter(q=>S.ans[q.id]&&!S.ans[q.id].last);if(f==="bm")p=p.filter(q=>S.bm.includes(q.id));
  if(!p.length){toast("該当する問題がありません");return}startPractice(shuffle(p).slice(0,n).map(q=>q.id),"ランダム練習")}

const perm=q=>shuffle(q.o.map((_,i)=>i));
let PR=null;
function startPractice(ids,title){if(!ids.length){toast("問題がありません");return}PR={ids,i:0,title,sel:[],shown:false,ok:0,p:perm(QM[ids[0]])};setTab("prac");drawPr();window.scrollTo(0,0)}
function qHtml(q,p,sel,shown,click){
  return`<div class="qt">${esc(q.q)}</div>${ZH(q.qz)}${q.n>1?`<div class="pick">${q.n}つ選択 <span lang="zh-CN">/ 选${q.n}项</span></div>`:""}
  <div class="opts">${p.map((k,pos)=>{const o=q.o[k];let c="";if(shown){if(q.a.includes(k))c="ok";else if(sel.includes(k))c="ng"}else if(sel.includes(k))c="sel";
  return`<button type="button" class="opt ${c}" onclick="${click}(${k})"><span class="L">${L[pos]}</span><span class="tx"><span>${esc(o.j)}</span>${ZH(o.z)}</span></button>`}).join("")}</div>`;
}
function resHtml(q,p,sel){const ok=isOk(q,sel),lt=q.a.map(k=>L[p.indexOf(k)]).sort().join("・");
  return`<div class="res ${ok?'ok':'ng'}"><div class="h">${ok?'○ 正解':'× 不正解'}　正解：${lt}</div><div class="e" lang="zh-CN">${esc(q.e)}</div><div class="ej">${esc(q.ej)}</div></div>`}
function starBtn(id){return`<button type="button" class="star ${S.bm.includes(id)?'on':''}" aria-label="お気に入り" onclick="toggleBm('${id}',this)">★</button>`}
function toggleBm(id,el){if(S.bm.includes(id))S.bm=S.bm.filter(x=>x!==id);else S.bm.push(id);save();el.classList.toggle("on")}
function drawPr(){const q=QM[PR.ids[PR.i]];
  M().innerHTML=`<div class="qh"><span>${esc(PR.title)} ・ <span class="num">${PR.i+1} / ${PR.ids.length}</span></span><span>D${q.d} ・ ${q.t} ${starBtn(q.id)}</span></div>
  <div class="card">${qHtml(q,PR.p,PR.sel,PR.shown,"prPick")}${PR.shown?resHtml(q,PR.p,PR.sel):""}</div>
  <div class="row sp"><button class="btn g" type="button" onclick="endPr()">終了</button>
  ${PR.shown?`<button class="btn" type="button" onclick="prNext()">${PR.i<PR.ids.length-1?'次へ →':'結果を見る'}</button>`:`<button class="btn" type="button" ${PR.sel.length!==q.n?'disabled':''} onclick="prCheck()">解答する</button>`}</div>`}
function prPick(k){if(PR.shown)return;const q=QM[PR.ids[PR.i]];if(q.n===1)PR.sel=[k];else PR.sel=PR.sel.includes(k)?PR.sel.filter(x=>x!==k):PR.sel.length<q.n?PR.sel.concat(k):PR.sel;drawPr()}
function prCheck(){const q=QM[PR.ids[PR.i]];PR.shown=true;const ok=isOk(q,PR.sel);if(ok)PR.ok++;PR.done=(PR.done||0)+1;record(q.id,ok);drawPr()}
function prNext(){if(PR.i<PR.ids.length-1){PR.i++;PR.sel=[];PR.shown=false;PR.p=perm(QM[PR.ids[PR.i]]);drawPr();window.scrollTo(0,0)}else prResult()}
function endPr(){if(PR.done)prResult();else nav('prac')}
function prResult(){const n=PR.done||0;M().innerHTML=`<h2>${esc(PR.title)}</h2><div class="card center"><div class="big">${PR.ok} / ${n}</div><div class="mute">正解率 ${n?Math.round(PR.ok/n*100):0}%</div></div><div class="row"><button class="btn" type="button" onclick="nav('prac')">練習に戻る</button><button class="btn s" type="button" onclick="nav('stats')">成績を見る</button></div>`;window.scrollTo(0,0)}

let MK=null;
V.mock=()=>{const w=wrongIds().length;
  M().innerHTML=`<h2>模試</h2>
  <div class="card"><div class="row sp"><h3>本番模試</h3><span class="mute">60問 / 120分</span></div><div class="mute">ドメイン配点どおりに出題（D1 8・D2 13・D3 7・D4 10・D5 7・D6 9・D7 6）。提出まで正誤は表示されません。</div>${ZH("按正式权重出题，交卷后才显示结果。","zhb mute")}<div class="row"><button class="btn" type="button" onclick="startMock('full')">開始</button></div></div>
  <div class="card"><div class="row sp"><h3>ミニ模試</h3><span class="mute">20問 / 40分</span></div><div class="mute">短時間で全ドメインを確認。</div><div class="row"><button class="btn s" type="button" onclick="startMock('mini')">開始</button></div></div>
  <div class="card"><div class="row sp"><h3>弱点模試</h3><span class="mute">最大20問 / 1問2分</span></div><div class="mute">間違えた問題から出題（現在 ${w} 問）。</div><div class="row"><button class="btn s" type="button" ${w?'':'disabled'} onclick="startMock('weak')">開始</button></div></div>
  ${S.mocks.length?`<div class="card"><h3>模試の履歴</h3><div class="list">${S.mocks.slice(-10).reverse().map(m=>`<div class="it" style="cursor:default"><div class="b">${esc(m.kind)} <span class="num">${m.ok}/${m.n}（${Math.round(m.ok/m.n*100)}%）</span></div><span class="mute">${new Date(m.date).toLocaleDateString()}</span></div>`).join("")}</div></div>`:""}
  <p class="mute">本番は 100〜1,000 のスケールスコアで 720 以上が合格です。正答率との換算は公表されていないため、このアプリでは正答率 80% 以上を目標にしています。</p>`};
function startMock(kind){let ids=[],min;
  if(kind==="weak"){ids=shuffle(wrongIds()).slice(0,20);min=ids.length*2}
  else{const plan=kind==="full"?MOCK60:MOCK20;for(const d in plan)ids=ids.concat(shuffle(QS.filter(q=>q.d==d)).slice(0,plan[d]).map(q=>q.id));ids=shuffle(ids);min=kind==="full"?120:40}
  MK={kind:{full:"本番模試",mini:"ミニ模試",weak:"弱点模試"}[kind],ids,p:ids.map(id=>perm(QM[id])),sel:ids.map(()=>[]),i:0,end:Date.now()+min*60000,done:false,flag:[]};
  clearInterval(timerId);timerId=setInterval(tick,1000);setTab("mock");drawMk();window.scrollTo(0,0)}
function stopMock(){clearInterval(timerId);timerId=null;MK=null}
function tick(){if(!MK||MK.done)return;const r=MK.end-Date.now();if(r<=0){finishMock(true);return}const el=$("#tm");if(el){el.textContent=fmt(r);if(r<300000)el.style.color="var(--ng)"}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function drawMk(){const q=QM[MK.ids[MK.i]];
  M().innerHTML=`<div class="qh"><span>${MK.kind} ・ <span class="num">${MK.i+1} / ${MK.ids.length}</span></span><span>残り <span class="timer" id="tm">${fmt(MK.end-Date.now())}</span></span></div>
  <div class="card">${qHtml(q,MK.p[MK.i],MK.sel[MK.i],false,"mkPick")}</div>
  <div class="row sp"><button class="btn g" type="button" ${MK.i?'':'disabled'} onclick="mkGo(${MK.i-1})">← 前へ</button>
  <label class="mute"><input type="checkbox" id="flg" ${MK.flag.includes(MK.i)?'checked':''} onchange="mkFlag()"> 見直し</label>
  ${MK.i<MK.ids.length-1?`<button class="btn" type="button" onclick="mkGo(${MK.i+1})">次へ →</button>`:`<button class="btn" type="button" onclick="finishMock()">提出する</button>`}</div>
  <div class="card"><div class="grid">${MK.ids.map((id,k)=>`<button type="button" class="${MK.sel[k].length?'a':''} ${k===MK.i?'c':''}" onclick="mkGo(${k})">${MK.flag.includes(k)?'⚑':''}${k+1}</button>`).join("")}</div>
  <div class="row sp"><span class="mute">解答済み ${MK.sel.filter(s=>s.length).length} / ${MK.ids.length}</span><button class="btn s" type="button" onclick="finishMock()">提出する</button></div></div>`}
function mkPick(k){const q=QM[MK.ids[MK.i]];let s=MK.sel[MK.i];if(q.n===1)s=[k];else s=s.includes(k)?s.filter(x=>x!==k):s.length<q.n?s.concat(k):s;MK.sel[MK.i]=s;drawMk()}
function mkGo(k){MK.i=k;drawMk();window.scrollTo(0,0)}
function mkFlag(){MK.flag=MK.flag.includes(MK.i)?MK.flag.filter(x=>x!==MK.i):MK.flag.concat(MK.i)}
function finishMock(auto){if(!auto){const un=MK.sel.filter(s=>!s.length).length;ask(un?`未解答が ${un} 問あります。提出しますか？`:"提出しますか？",()=>doFinish(false),"提出する");return}doFinish(true)}
function doFinish(auto){clearInterval(timerId);MK.done=true;let ok=0;const by={};
  MK.ids.forEach((id,k)=>{const q=QM[id],r=isOk(q,MK.sel[k]);if(r)ok++;record(id,r);by[q.d]=by[q.d]||[0,0];by[q.d][1]++;if(r)by[q.d][0]++});
  S.mocks.push({kind:MK.kind,ok,n:MK.ids.length,date:Date.now(),by});save();MK.ok=ok;MK.by=by;MK.auto=auto;drawMkRes()}
function drawMkRes(){const p=Math.round(MK.ok/MK.ids.length*100),col=v=>v>=.8?'var(--ok)':v>=.6?'var(--warn-line)':'var(--ng)';
  M().innerHTML=`<h2>${MK.kind}の結果</h2>${MK.auto?'<p class="mute">時間切れのため自動で提出しました。</p>':''}
  <div class="card center"><div class="big" style="color:${col(p/100)}">${p}%</div><div class="num">${MK.ok} / ${MK.ids.length} 正解</div><div class="mute">${p>=80?'合格圏です。この調子で続けましょう':p>=70?'あと少し。弱いドメインを復習しましょう':'まずはノートとドメイン別練習で基礎を固めましょう'}</div></div>
  <div class="card"><h3>ドメイン別</h3>${Object.keys(MK.by).sort().map(d=>{const [a,n]=MK.by[d];return`<div class="row sp"><span>D${d} ${DN[d][0]}</span><span class="mute num">${a}/${n}</span></div><div class="bar"><i style="width:${a/n*100}%;background:${col(a/n)}"></i></div>`}).join("")}</div>
  <div class="card"><h3>解答の見直し</h3><div class="grid">${MK.ids.map((id,k)=>`<button type="button" class="${isOk(QM[id],MK.sel[k])?'ok':'ng'}" onclick="mkRev(${k})">${k+1}</button>`).join("")}</div></div>
  <div class="row"><button class="btn" type="button" onclick="MK=null;nav('mock')">模試メニューへ</button></div>`;window.scrollTo(0,0)}
function mkRev(k){const q=QM[MK.ids[k]],sel=MK.sel[k],p=MK.p[k];
  M().innerHTML=`<div class="qh"><span>見直し <span class="num">${k+1} / ${MK.ids.length}</span></span><span>D${q.d} ・ ${q.t} ${starBtn(q.id)}</span></div>
  <div class="card">${qHtml(q,p,sel,true,"void")}${resHtml(q,p,sel)}</div>
  <div class="row sp"><button class="btn g" type="button" ${k?'':'disabled'} onclick="mkRev(${k-1})">← 前へ</button><button class="btn s" type="button" onclick="drawMkRes()">結果に戻る</button><button class="btn g" type="button" ${k<MK.ids.length-1?'':'disabled'} onclick="mkRev(${k+1})">次へ →</button></div>`;window.scrollTo(0,0)}

let CD=null,CQ=null;
V.cards=()=>{
  M().innerHTML=`<h2>用語カード</h2><div class="card"><div class="mute">全 ${GLOSSARY.length} 語 ・ 覚えた ${S.cardk.length}</div>
  <div class="row"><button class="btn" type="button" onclick="startCards(false)">カード（全部）</button><button class="btn s" type="button" onclick="startCards(true)">まだ覚えていない語</button><button class="btn g" type="button" onclick="startCQ()">4択クイズ 10問</button></div></div>
  <div class="card"><div class="list">${GLOSSARY.map((g,i)=>`<div class="it" style="cursor:default"><div class="b"><div><b>${esc(g[0])}</b> <span class="mute">${esc(g[1])}</span></div><div class="sub" lang="zh-CN">${esc(g[2])}</div></div>${S.cardk.includes(i)?'<span class="chk">✓</span>':''}</div>`).join("")}</div></div>`};
function startCards(onlyNew){let idx=GLOSSARY.map((_,i)=>i);if(onlyNew)idx=idx.filter(i=>!S.cardk.includes(i));if(!idx.length){toast("すべて覚えました");return}CD={idx:shuffle(idx),i:0,flip:false};drawCard()}
function drawCard(){const g=GLOSSARY[CD.idx[CD.i]];
  M().innerHTML=`<div class="qh"><span>用語カード <span class="num">${CD.i+1} / ${CD.idx.length}</span></span><button class="btn g" type="button" onclick="nav('cards')">終了</button></div>
  <div class="card flash" onclick="CD.flip=!CD.flip;drawCard()">${CD.flip?`<div class="w" lang="zh-CN">${esc(g[2])}</div><div class="mute">${esc(g[0])} / ${esc(g[1])}</div>`:`<div class="w">${esc(g[0])}</div><div class="mute">${esc(g[1])}</div><div class="mute" style="margin-top:12px">タップで意味を表示</div>`}</div>
  <div class="row sp"><button class="btn g" type="button" onclick="cdNext(false)">まだ</button><button class="btn" type="button" onclick="cdNext(true)">覚えた ✓</button></div>`}
function cdNext(k){const i=CD.idx[CD.i];if(k&&!S.cardk.includes(i))S.cardk.push(i);if(!k)S.cardk=S.cardk.filter(x=>x!==i);save();if(CD.i<CD.idx.length-1){CD.i++;CD.flip=false;drawCard()}else nav('cards')}
function startCQ(){CQ={items:shuffle(GLOSSARY.map((_,i)=>i)).slice(0,10),i:0,ok:0,ans:null,opts:null};drawCQ()}
function drawCQ(){const gi=CQ.items[CQ.i];if(!CQ.opts)CQ.opts=shuffle([gi].concat(shuffle(GLOSSARY.map((_,i)=>i).filter(i=>i!==gi)).slice(0,3)));
  M().innerHTML=`<div class="qh"><span>用語クイズ <span class="num">${CQ.i+1} / 10</span></span><span>正解 ${CQ.ok}</span></div>
  <div class="card"><div class="qt">次の説明に当たる用語は？</div><div class="sub" lang="zh-CN" style="font-size:16px;color:var(--ink)">${esc(GLOSSARY[gi][2])}</div><div class="opts">${CQ.opts.map((o,k)=>{let c="";if(CQ.ans!==null){if(o===gi)c="ok";else if(o===CQ.ans)c="ng"}return`<button type="button" class="opt ${c}" onclick="cqPick(${o})"><span class="L">${L[k]}</span><span class="tx">${esc(GLOSSARY[o][0])}</span></button>`}).join("")}</div></div>
  ${CQ.ans!==null?`<div class="row" style="justify-content:flex-end"><button class="btn" type="button" onclick="cqNext()">${CQ.i<9?'次へ →':'結果'}</button></div>`:""}`}
function cqPick(o){if(CQ.ans!==null)return;CQ.ans=o;if(o===CQ.items[CQ.i])CQ.ok++;drawCQ()}
function cqNext(){if(CQ.i<9){CQ.i++;CQ.ans=null;CQ.opts=null;drawCQ()}else{toast(`10問中 ${CQ.ok} 問正解`);nav('cards')}}

V.stats=()=>{const w=wrongIds();
  M().innerHTML=`<h2>成績・弱点</h2>
  <div class="card"><div><h3>ドメイン別 正解率</h3>${ZH("按每题最近一次作答计算","zhb mute")}</div>${Object.keys(DN).map(d=>{const ids=QS.filter(q=>q.d==d).map(q=>q.id),s=stat(ids),r=s.done?s.ok/s.done:0;
   return`<div class="row sp"><span>D${d} ${DN[d][0]}</span><span class="mute num">${s.done?Math.round(r*100)+'%':'—'} ・ ${s.done}/${s.n}</span></div><div class="bar"><i style="width:${r*100}%;background:${!s.done?'var(--line)':r>=.8?'var(--ok)':r>=.6?'var(--warn-line)':'var(--ng)'}"></i></div>`}).join("")}</div>
  <div class="card"><div class="row sp"><h3>間違えた問題 <span class="num">${w.length}</span></h3>${w.length?`<button class="btn s" type="button" onclick="startPractice(wrongIds(),'間違えた問題')">復習する</button>`:""}</div>
  <div class="row sp"><h3>★ お気に入り <span class="num">${S.bm.length}</span></h3>${S.bm.length?`<button class="btn s" type="button" onclick="startPractice(S.bm.slice(),'お気に入り')">復習する</button>`:""}</div></div>
  <div class="card"><h3>バックアップ・引継ぎ</h3><div class="mute">進捗はこの端末のブラウザに保存されています。アプリ更新前や端末を変えるときは書き出してメモなどに保存してください。</div>${ZH("更新文件或换设备前，先导出备份。","zhb mute")}
  <div class="row"><button class="btn s" type="button" onclick="expo()">進捗を書き出す</button><button class="btn g" type="button" onclick="impo()">読み込む</button><button class="btn g" type="button" onclick="ask('すべての進捗を消去しますか？',resetAll,'消去する')">リセット</button></div>
  <textarea id="bk" placeholder="書き出したテキストがここに出ます。読み込むときはここに貼り付けてください"></textarea></div>
  <p class="mute">問題 ${QS.length} 問 ・ 用語 ${GLOSSARY.length} 語。Anthropic 公式 Exam Guide v1.0 の出題範囲に基づくオリジナル問題です（非公式・個人学習用）。</p>`};
function expo(){const t=$("#bk");t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast("コピーしました"),()=>toast("選択しました。手動でコピーしてください"));else toast("選択しました。手動でコピーしてください")}
function impo(){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o.ans)throw 0;S=Object.assign(S,o);save();toast("読み込みました");V.stats()}catch(e){toast("読み込めませんでした。テキスト全体を貼り付けてください")}}
function resetAll(){S={ans:{},bm:[],read:[],mocks:[],zh:S.zh,cardk:[]};save();V.stats();toast("消去しました")}

applyZh();nav("home");
if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
