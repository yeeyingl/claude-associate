用一手资料核实统计数字与出处。完整性：对照事先定义的调查项目逐项检查是否覆盖。「自信のある表現は確認を省略」错在语气自信不代表正确；字数多不代表完整；统一标题设计只是格式。","ej":"正確性＝一次情報で検証、完全性＝要件チェックリストで網羅確認。"},{"id":"d2-006","d":2,"t":"2.1","n":1,"q":"経理担当者がClaudeに、添付した請求書データの合計金額を計算させた。業務上、金額の誤りは許されない。最も適切な進め方はどれか。","qz":"一名会计让 Claude 计算附件发票数据的合计金额。业务上不允许金额出错。最恰当的做法是哪一项？","o":[{"j":"Claudeに合計金額を計算させ、念のため「計算は正しいですか」と確認して肯定されればそのまま使用する。","z":"让 Claude 计算合计金额，为保险起见再问“计算正确吗？”，得到肯定就直接使用。"},{"j":"コード実行機能で計算させ、計算過程を確認したうえで、元データの件数や小計と照合する。","z":"用代码执行功能进行计算，确认计算过程后，再与原始数据的件数和小计核对。"},{"j":"より丁寧な口調で再度依頼する。","z":"用更礼貌的语气再请求一次。"},{"j":"金額計算はAIでは一切行わず、すべて手作業に戻す。","z":"金额计算完全不用 AI，全部回到手工处理。"}],"a":[1],"e":"精确计算应使用代码执行，得到可复现、可检查的过程，并与原始数据的件数和小计核对。只让 Claude 计算再问「正しいですか」，语言模型直接计算可能出错，自我确认也不可靠；换成更礼貌的语气与准确性无关；「すべて手作業に戻す」是过度反应，有可行的验证手段时没必要完全放弃。","ej":"正確な計算はコード実行で行い、過程と元データで検証する。"},{"id":"d2-007","d":2,"t":"2.1","n":1,"q":"Claudeに社内規程の改定案を作成させたところ、第3条では「申請期限は5営業日前」、第7条では「申請期限は3営業日前」と記載されていた。この状態を最も適切に表しているものはどれか。","qz":"让 Claude 起草公司规章修订案，结果第3条写着“申请期限为提前5个工作日”，第7条却写着“申请期限为提前3个工作日”。最能恰当描述这种状态的是哪一项？","o":[{"j":"文書内の不整合（矛盾）であり、どちらが正しいか元の方針を確認して統一する必要がある。","z":"这是文档内部的不一致（矛盾），需要确认原有方针中哪一个正确并加以统一。"},{"j":"両方の条文があれば柔軟に運用できるので問題ない。","z":"两个条文都在可以灵活运用，没有问题。"},{"j":"書式の問題なので、フォントをそろえれば解決する。","z":"这是格式问题，统一字体即可解决。"},{"j":"Claudeの出力では後に書かれた条文の方が最新の検討結果を反映しているので、第7条に合わせて統一する。","z":"Claude 的输出中后写的条文反映了最新讨论结果，因此统一为第7条。"}],"a":[0],"e":"同一文档内前后数值不一致属于“不整合（矛盾）”，是评价输出时要识别的典型问题。应回到原始方针确认正确值并统一。「後に書かれた条文が最新」没有依据；「柔軟に運用できる」和「フォントをそろえる」都忽视了内容问题。","ej":"同一出力内の矛盾（不整合）は、元方針を確認して統一する。"},{"id":"d2-008","d":2,"t":"2.1","n":1,"q":"広報担当者が、Claudeにプレスリリースの英訳を依頼した。担当者は英語が得意ではない。翻訳の正確性を確認する方法として最も適切なものはどれか。","qz":"一名公关负责人请 Claude 把新闻稿翻译成英文。该负责人英语不太好。作为确认译文准确性的方法，最恰当的是哪一项？","o":[{"j":"翻訳文が長ければ正確だと判断する。","z":"译文越长就判断越准确。"},{"j":"Claudeに「この翻訳に誤りはありますか」と確認し、誤りがないと回答されれば、そのまま英語版として公開する。","z":"问 Claude“这份翻译有错误吗？”，若回答没有错误，就直接作为英文版发布。"},{"j":"固有名詞・数値・日付が原文と一致しているか確認し、対外公開前に英語に堪能な担当者のレビューを受ける。","z":"确认专有名词、数字、日期与原文一致，并在对外发布前请英语熟练的人员审阅。"},{"j":"翻訳は機械的な作業なので確認は不要である。","z":"翻译是机械性工作，不需要确认。"}],"a":[2],"e":"对外公开的内容属于高风险输出，自己无法充分判断时，应请精通英语的人审核。同时可先自行核对专有名词、数字、日期等容易出错且容易检查的部分。问 Claude「誤りはありますか」属于自我评价，不可靠；「長ければ正確」「確認は不要」都没有依据。","ej":"対外公開物で自分が判断できない場合は、専門性のある人のレビューを入れる。"},{"id":"d2-009","d":2,"t":"2.1","n":1,"q":"Claudeに「競合3社の価格プランを比較して」と依頼したところ、2社分の情報しか記載されず、3社目は「情報が見つかりませんでした」と書かれていた。この出力について最も適切な評価はどれか。","qz":"请 Claude“比较3家竞争对手的价格方案”，结果只写了2家的信息，第3家写着“未找到信息”。对这个输出最恰当的评价是哪一项？","o":[{"j":"3社目の情報がないのは不完全なので、業界の一般的な価格帯から推定値をClaudeに埋めさせて表を完成させる。","z":"缺少第3家信息不完整，让 Claude 根据行业一般价格区间填入推测值来完成表格。"},{"j":"出力全体が信頼できないので破棄する。","z":"整个输出都不可信，予以丢弃。"},{"j":"3社目は存在しない会社だと結論づける。","z":"断定第3家公司不存在。"},{"j":"不明点を明示している点は適切であり、3社目は公式サイトなど別の情報源で補完する。","z":"明确标出不明之处是恰当的，第3家用官网等其他信息来源补充。"}],"a":[3],"e":"模型坦白“找不到”比编造数据更好，这是可信输出的表现。缺口应由人用官方网站等其他可靠来源补充。让 Claude 按行业一般价格推测会诱发幻觉；「全体を破棄」是过度反应；「存在しない会社」是没有依据的推论。","ej":"「不明」と明示された箇所は、推測で埋めずに別の情報源で補う。"},{"id":"d2-051","d":2,"t":"2.1","n":1,"q":"購買部の担当者が、Claudeに3社の見積書（PDF）を読み込ませ、比較表を作成させた。表には単価と納期が並んでいるが、見積書に記載された「最低発注数量」の列がない。最も適切な対応はどれか。","qz":"采购部负责人让 Claude 读取 3 家公司的报价单（PDF）并制作比较表。表中列出了单价和交期，但没有报价单中写明的“最低订购数量”一栏。最合适的做法是哪一个？","o":[{"j":"単価と納期が比較できれば十分なので、表はそのまま上司に提出し、最低発注数量については質問が来たら答える","z":"能比较单价和交期就够了，表格直接交给上司，最低订购数量等被问到再回答"},{"j":"Claudeに「この表に漏れはありますか」と聞き、ないと言われれば完成とする","z":"问 Claude“这个表有遗漏吗”，如果说没有就算完成"},{"j":"比較の目的に照らして必要な項目が欠けているため、最低発注数量の列を追加させ、元の見積書と数値を照合する","z":"对照比较目的，缺少了必要项目，应让它追加最低订购数量一栏，并与原报价单核对数字"},{"j":"表のデザインを整え、各社の列に色を付けて見やすくする","z":"整理表格设计，给各公司的列上色，使其更易读"}],"a":[2],"e":"比较采购条件时，最低订购数量会直接影响实际成本，属于目的上必要的项目。评估完整性要对照目的检查是否缺项，并把补上的数字与原文核对。「単価と納期で十分」低估了遗漏的影响；美化表格只改外观；问 Claude 有没有遗漏属于自我确认，不可靠。","ej":"完全性＝目的に必要な項目がそろっているか、元資料と照合"},{"id":"d2-052","d":2,"t":"2.1","n":1,"q":"Claudeに60分の会議の文字起こしから議事録を作成させた。議事録は簡潔にまとまっているが、会議後半に議論された予算の件がまったく含まれていない。原因として最も考えられ、かつ適切な対応はどれか。","qz":"让 Claude 根据 60 分钟会议的文字记录制作会议纪要。纪要简洁，但完全没有包含会议后半段讨论的预算事项。最可能的原因和合适的对应是哪一个？","o":[{"j":"予算の件は重要でなかったとClaudeが判断したのだから、そのまま配布する","z":"Claude 判断预算事项不重要，所以直接分发"},{"j":"長い入力の後半が十分に反映されていない可能性があるため、前半と後半に分けて要約させ、各議題が含まれているか確認する","z":"长输入的后半部分可能没有被充分反映，应分成前后两部分分别摘要，并确认每个议题都包含在内"},{"j":"文字起こしデータに誤りがあるはずなので、会議を録音し直す","z":"文字记录数据一定有错误，所以重新录音"},{"j":"議事録が簡潔すぎるので、「もっと長くして」とだけ指示し、文字数が増えたことを確認したうえで完成とする","z":"纪要太简洁了，只指示“写长一点”，确认字数增加后就算完成"}],"a":[1],"e":"长文本的后半部分容易被遗漏，分段处理再合并、对照议题清单检查覆盖情况，是提高完整性的有效方法。认为 Claude 判断不重要就省略，是把取舍交给了模型；重新录音没有依据；只要求“写长一点”不能保证补上缺失的议题。","ej":"長い入力は分割して処理し、議題の網羅を確認"},{"id":"d2-053","d":2,"t":"2.1","n":1,"q":"法務担当者がClaudeに、社内規程の改定前後の差分をまとめさせた。差分リストは5項目あったが、担当者が把握している変更は7項目ある。最も適切な対応はどれか。","qz":"法务负责人让 Claude 整理公司规章修订前后的差异。差异列表有 5 项，但负责人掌握的变更有 7 项。最合适的做法是哪一个？","o":[{"j":"足りない2項目を自分で追記し、原因は確認しない","z":"自己补上缺少的 2 项，不确认原因"},{"j":"改定前後の条文を条ごとに並べて比較させ、漏れた2項目がなぜ抽出されなかったかを確認したうえで差分リストを修正する","z":"让它把修订前后的条文逐条并列比较，确认遗漏的 2 项为什么没被抽出，再修正差异列表"},{"j":"Claudeの方が正確なはずなので、自分の把握している7項目の方が間違っていると考え、差分リストは5項目のまま確定し関係部署に通知する","z":"Claude 应该更准确，所以认为自己掌握的 7 项有误，差异列表按 5 项确定并通知相关部门"},{"j":"差分抽出はAIに向かないので、今後は使わない","z":"差异抽取不适合 AI，今后不再使用"}],"a":[1],"e":"发现输出与已知事实不一致时，要用结构化的方法（逐条对照）重新验证，并找出遗漏的原因，这样也能判断其他部分是否可靠。盲目相信 Claude 更准确是自动化偏见；只补两项不查原因，可能还有别的遗漏；完全不用是过度反应。","ej":"既知の事実と食い違えば、逐条比較で原因まで確認"},{"id":"d2-054","d":2,"t":"2.1","n":1,"q":"Claudeに作成させた社内研修の確認テスト（10問）を評価したい。正確性と完全性の観点から最も適切な確認方法はどれか。","qz":"想评估让 Claude 制作的公司内部培训测验（10 题）。从准确性和完整性的角度，最合适的确认方法是哪一个？","o":[{"j":"問題文の日本語が自然かどうかだけを確認し、内容面は研修講師が作った資料をClaudeが読んでいるので問題ないとみなす","z":"只确认题目日语是否自然，内容方面因为 Claude 读过讲师的资料，视为没有问题"},{"j":"問題数が10問あることを確認する","z":"确认题数有 10 题"},{"j":"各問の正解が研修資料の内容と一致しているか確認し、研修の学習目標がすべて問われているかを対応表でチェックする","z":"确认每题的正确答案与培训资料内容一致，并用对照表检查培训的学习目标是否都被考到"},{"j":"受講者に解かせて、正答率が高ければ良いテストと判断する","z":"让学员作答，正确率高就判断是好测验"}],"a":[2],"e":"准确性：答案是否与教材一致；完整性：是否覆盖所有学习目标。两者都需要对照依据检查。只看日语是否自然、只数题数都是形式检查；正确率高可能只是题目太简单或有错题，不能说明测验质量。","ej":"正確性＝資料と一致、完全性＝目標を網羅"},{"id":"d2-055","d":2,"t":"2.1","n":1,"q":"財務担当者がClaudeに四半期決算の説明資料のドラフトを作らせた。資料には売上・利益・前年比が記載されている。提出前の確認として最も重要なものはどれか。","qz":"财务负责人让 Claude 制作季度决算说明资料的草稿，资料中写有销售额、利润和同比。提交前最重要的确认是哪一个？","o":[{"j":"グラフの色使いが会社のブランドガイドに沿っているかを確認する","z":"确认图表配色是否符合公司品牌指南"},{"j":"前年比の数値は計算結果なので確認を省き、売上と利益だけをざっと目視で確認したうえで、表現の分かりやすさを中心に見直す","z":"同比是计算结果所以省略确认，只大致目视检查销售额和利润，重点检查表达是否易懂"},{"j":"すべての数値を会計システムの確定値と照合し、前年比は計算し直して一致を確認する","z":"把所有数字与会计系统的确定值核对，同比要重新计算确认一致"},{"j":"Claudeに数値の確からしさを1〜5で評価させる","z":"让 Claude 用 1〜5 评价数字的可信度"}],"a":[2],"e":"决算资料中的数字错误会直接影响决策和信用，必须与正式的确定值核对，派生数字（同比等）也要重新计算。「計算結果なので省略」错在 Claude 的计算也可能出错；配色是形式问题；模型自评分数不能证明正确。","ej":"財務数値は確定値と照合、計算値も再計算"},{"id":"d2-056","d":2,"t":"2.1","n":1,"q":"Claudeに「新入社員向けオンボーディングのチェックリスト」を作らせた。完全性を評価するために最も役立つ方法はどれか。","qz":"让 Claude 制作“新员工入职检查清单”。为了评估完整性，最有用的方法是哪一个？","o":[{"j":"項目数が20以上あれば十分に網羅的だと判断する","z":"项目数在 20 个以上就判断为足够全面"},{"j":"インターネット上の一般的なオンボーディング例と文体が似ているか確認する","z":"确认文体是否与网上一般的入职示例相似"},{"j":"Claudeにもう一度作らせ、2つのリストの項目数を比べて多い方を採用し、少ない方は参考として残しておく","z":"让 Claude 再做一次，比较两份清单的项目数，采用多的那份，少的那份作参考保留"},{"j":"人事・IT・総務など関係部署の実際の手続きと照らし合わせ、抜けている手順がないか担当者に確認してもらう","z":"对照人事、IT、总务等相关部门的实际手续，请负责人确认有没有遗漏的步骤"}],"a":[3],"e":"完整性要对照“实际需要什么”来判断，公司特有的手续只有相关部门最清楚。项目数多不等于覆盖了必要内容；比较两次生成的数量没有依据；文体是否相似与完整性无关。","ej":"完全性は実際の要件・担当者の知見と照合"},{"id":"d2-057","d":2,"t":"2.1","n":2,"q":"Claudeの出力の正確性と完全性を評価する観点として、適切なものを2つ選べ。","qz":"作为评估 Claude 输出准确性和完整性的观点，选出 2 个合适的。","o":[{"j":"事実・数値・固有名詞が信頼できる情報源と一致しているか","z":"事实、数字、专有名词是否与可靠信息来源一致"},{"j":"出力に専門用語がどれだけ多く含まれているか","z":"输出中包含了多少专业术语"},{"j":"依頼時に求めた要件や項目がすべて満たされているか","z":"委托时要求的条件和项目是否全部满足"},{"j":"出力がどれだけ速く生成されたか","z":"输出生成得有多快"},{"j":"文章が自信に満ちた断定的な表現で書かれているか","z":"文章是否用充满自信的断定表达写成"}],"a":[0,2],"e":"准确性＝内容与可靠来源一致；完整性＝满足所有要求。语气是否断定、生成速度、专业术语的多少，都与内容是否正确、完整无关，有时专业术语多反而说明不适合读者。","ej":"正確性＝情報源と一致、完全性＝要件を満たす"},{"id":"d2-058","d":2,"t":"2.1","n":1,"q":"ITヘルプデスクの担当者が、Claudeに社内VPNの接続手順書を作らせた。手順書の正確性を確かめる方法として最も適切なものはどれか。","qz":"IT 服务台负责人让 Claude 制作公司 VPN 连接操作手册。确认手册准确性最合适的方法是哪一个？","o":[{"j":"手順の文章が丁寧で分かりやすいかを確認する","z":"确认步骤的文字是否礼貌易懂"},{"j":"一般的なVPNの解説記事と内容が似ていれば正しいとみなす","z":"内容与一般的 VPN 解说文章相似就视为正确"},{"j":"手順書どおりに実際の環境で操作してみて、画面名やボタン名、手順の順番が一致するか確認する","z":"按手册在实际环境中操作一遍，确认画面名称、按钮名称、步骤顺序是否一致"},{"j":"Claudeに「この手順で接続できますか」と質問し、できると回答されれば、そのまま全社員に配布して問い合わせ対応で補う","z":"问 Claude“按这个步骤能连上吗”，回答能的话就直接发给全体员工，用问询应对来补充"}],"a":[2],"e":"操作手册最直接的验证是实际操作一遍。Claude 不知道公司具体的 VPN 软件和界面，可能写出“看起来合理”的通用步骤。文字是否易懂只看形式；和一般文章相似不代表符合公司环境；问 Claude 能不能连上是自我确认。","ej":"手順書は実環境で再現して検証"},{"id":"d2-059","d":2,"t":"2.1","n":1,"q":"Claudeに複数の顧客インタビュー記録を要約させたところ、「全員が価格に不満を持っている」と書かれていた。元の記録では、価格に触れたのは8人中3人だった。この問題として最も適切なものはどれか。","qz":"让 Claude 摘要多份客户访谈记录，结果写着“所有人都对价格不满”。原始记录中提到价格的只有 8 人中的 3 人。这个问题最恰当的描述是哪一个？","o":[{"j":"要約とは本来そういうものなので、問題はない","z":"摘要本来就是这样，没有问题"},{"j":"インタビューの人数が少ないので、Claudeの出力は無視する","z":"访谈人数少，所以无视 Claude 的输出"},{"j":"価格についての不満が強いという方向性は合っているので、表現はそのまま残し、営業部門にも共有して価格の見直しを提案する","z":"对价格不满强烈的方向是对的，所以表达保留，并共享给销售部门建议重新审视价格"},{"j":"一部の意見を全体に一般化した過度な一般化であり、正確性に欠けるため、人数を明示した表現に修正させる","z":"把部分意见推广到全体的过度概括，缺乏准确性，应修改为明确人数的表达"}],"a":[3],"e":"摘要时把“部分人”说成“全员”是过度概括，会误导决策，属于准确性问题。应要求标明具体人数或比例。认为摘要本来如此忽视了失真；以“方向对”为由保留错误表达还用于建议，会放大误导；完全无视则过度。","ej":"過度な一般化に注意、人数・割合で表現"},{"id":"d2-060","d":2,"t":"2.1","n":1,"q":"Claudeが作成した顧客向けFAQ（30問）をチームで分担してレビューすることになった。レビューを効率的かつ漏れなく行う方法として最も適切なものはどれか。","qz":"团队决定分工审核 Claude 制作的面向客户 FAQ（30 题）。高效且无遗漏地审核，最合适的方法是哪一个？","o":[{"j":"各自が気になったところだけを自由にコメントする","z":"每个人只对自己在意的地方自由评论"},{"j":"正確性（最新の規約・価格と一致）、完全性（よくある問い合わせを網羅）、表現（顧客向けの言葉遣い）のチェック観点を決めて分担する","z":"确定检查观点（准确性：与最新条款、价格一致；完整性：覆盖常见问询；表达：面向客户的措辞）再分工"},{"j":"最初の5問だけ確認し、問題がなければ残りも同じ品質だとみなして公開し、残りの問題は顧客からの指摘で修正する","z":"只检查前 5 题，没问题就视为其余质量相同并公开，其余问题靠客户指出再修改"},{"j":"文字数が長い回答だけを確認する","z":"只检查字数长的回答"}],"a":[1],"e":"事先确定评价观点和标准，分工审核才能既高效又不遗漏。自由评论容易漏掉关键检查；只看前几题就推断全部、让客户来发现错误，违背了对外发布前的验证责任；按字数挑选没有依据。","ej":"レビューは観点（正確性・完全性・表現）を決めて分担"},{"id":"d2-061","d":2,"t":"2.1","n":1,"q":"Claudeに長い調達契約書の「支払条件」を要約させた。要約が正確かどうかを確認する方法として最も適切なものはどれか。","qz":"让 Claude 摘要一份很长的采购合同中的“付款条件”。确认摘要是否准确，最合适的方法是哪一个？","o":[{"j":"同じ要約をもう一度作らせ、表現が同じであれば正確と判断する","z":"让它再做一次同样的摘要，表达相同就判断为准确"},{"j":"契約書は法務が作ったものなので要約も正しいはずだと考え、確認をせずに支払担当者へ転送して処理を進めてもらう","z":"合同是法务做的，所以摘要也应该正确，不确认就转给付款负责人推进处理"},{"j":"要約の各記述に対応する契約書の条項番号を示させ、該当条項の原文と突き合わせる","z":"让它标出摘要中每条描述对应的合同条款编号，与该条款原文对照"},{"j":"要約の長さが契約書の1割程度に収まっているか確認する","z":"确认摘要长度是否控制在合同的一成左右"}],"a":[2],"e":"让摘要的每条内容都能追溯到原文条款，人就能快速逐条核对。长度比例与准确性无关；两次结果相同不代表正确；原文正确不等于摘要正确，摘要过程中可能出错或遗漏条件。","ej":"要約は条項番号で原文に遡って照合"},{"id":"d2-062","d":2,"t":"2.1","n":1,"q":"Claudeが作成したイベント案内文に、日時・会場・参加費・申込締切が記載されている。社外に送る前の確認として最も適切なものはどれか。","qz":"Claude 制作的活动通知中写有日期时间、会场、参加费和报名截止日期。发给公司外部之前，最合适的确认是哪一个？","o":[{"j":"案内文が魅力的に書けているかを中心に確認する","z":"重点确认通知写得是否有吸引力"},{"j":"曜日と日付の組み合わせはClaudeが自動で計算しているので正しいと考え、会場名だけを確認する","z":"星期和日期的组合是 Claude 自动计算的，所以认为正确，只确认会场名称"},{"j":"社外向けなので、上司に確認を依頼し、自分ではチェックしない","z":"因为是对外的，请上司确认，自己不检查"},{"j":"日時・会場・参加費・締切などの事実情報を、確定したイベント企画書と1項目ずつ照合する","z":"把日期时间、会场、参加费、截止日期等事实信息，与已确定的活动企划书逐项核对"}],"a":[3],"e":"对外通知中的事实信息一旦出错，影响很大，必须与确定资料逐项核对。星期和日期的对应是常见的出错点，不能默认正确；只看吸引力是表达层面；把检查全部推给上司，违背了制作者自己的责任。","ej":"社外文書の事実情報は確定資料と1項目ずつ照合"},{"id":"d2-063","d":2,"t":"2.1","n":1,"q":"Claudeの出力を評価するとき、「完全性」が不足している例として最も適切なものはどれか。","qz":"评估 Claude 的输出时，作为“完整性”不足的例子，最合适的是哪一个？","o":[{"j":"5つの拠点の比較を依頼したのに、4拠点分しか記載されていない","z":"委托比较 5 个据点，却只写了 4 个据点"},{"j":"文章の語尾が「です・ます」と「だ・である」で混在している（文体の統一ができていない）","z":"文章句尾“です・ます”和“だ・である”混用（文体不统一）"},{"j":"存在しない調査レポートが出典として挙げられている","z":"把不存在的调查报告列为出处"},{"j":"売上の数値が実際より1桁多く記載されている","z":"销售额数字比实际多写了一位"}],"a":[0],"e":"完整性是“要求的内容是否都有”，漏掉一个据点就是典型的完整性不足。数字多一位和虚构出处属于准确性问题（后者是幻觉）；文体混用是表达或一致性的问题。","ej":"完全性＝求めた範囲をすべてカバー"},{"id":"d2-010","d":2,"t":"2.2","n":1,"q":"法務部の担当者がClaudeに業界の判例をまとめさせたところ、判決日と事件番号付きの判例が5件挙げられた。そのうち1件は担当者が聞いたことのない判例だった。最も適切な対応はどれか。","qz":"法务部人员让 Claude 整理行业判例，列出了附有判决日期和案件编号的5个判例。其中1个是该人员从未听说过的。最恰当的应对是哪一项？","o":[{"j":"事件番号まで書かれているので実在すると判断する。","z":"连案件编号都写了，因此判断其真实存在。"},{"j":"Claudeに「この判例は本当に存在しますか」と聞き、「はい」なら採用する。","z":"问 Claude“这个判例真的存在吗？”，回答“是”就采用。"},{"j":"判例データベースなど公式の情報源で5件すべての実在と内容を確認する。","z":"通过判例数据库等官方信息源，确认全部5个判例的真实性和内容。"},{"j":"知らない1件だけ削除し、残りの4件はそのまま使う。","z":"只删除不认识的那1个，其余4个直接使用。"}],"a":[2],"e":"具体的编号、日期、引用看起来很“真”，但正是幻觉的典型形式（虚构引用）。必须通过判例数据库等官方来源核实，而且要核实全部 5 件，而不只是可疑的那一件——熟悉的判例也可能内容被写错。「事件番号があるので実在」只看形式；问 Claude「本当に存在しますか」是自我确认，不可靠；只删掉不认识的那件，其余仍未验证。","ej":"番号・日付付きの具体的な引用ほど、全件を公式情報源で確認する。"},{"id":"d2-011","d":2,"t":"2.2","n":1,"q":"Claudeに自社の過去5年の売上推移を説明させたところ、提供していない年度の売上数値まで具体的に記載されていた。この現象として最も適切なものはどれか。","qz":"让 Claude 说明本公司过去5年的销售额走势，结果连没有提供的年度销售数字也被具体写了出来。对这种现象最恰当的描述是哪一项？","o":[{"j":"Claudeが社内データベースに自動接続して取得した正しい数値である。","z":"这是 Claude 自动连接公司内部数据库获取的正确数值。"},{"j":"もっともらしいが根拠のない情報を生成するハルシネーションの可能性が高い。","z":"这很可能是生成看似合理但没有依据的信息的幻觉。"},{"j":"Claudeは過去の会話をすべて記憶しているため、正確な数値である。","z":"Claude 记得所有过去的对话，因此是准确的数值。"},{"j":"出力形式の問題であり、内容の正確性には影響しない。","z":"这是输出格式的问题，不影响内容的准确性。"}],"a":[1],"e":"没有提供数据却出现具体数字，是幻觉的典型信号。Claude 只能使用提供的资料、已连接并授权的工具或训练知识，不会自动连接未授权的公司数据库；记忆功能也不等于记住一切；这不是格式问题，而是内容正确性问题。","ej":"提供していないデータの具体的な数値はハルシネーションを疑う。"},{"id":"d2-012","d":2,"t":"2.2","n":1,"q":"採用担当者がClaudeに求人票の文案を作成させた。出力には「若くてエネルギッシュな方」「体力に自信のある男性歓迎」といった表現が含まれていた。最も適切な対応はどれか。","qz":"招聘负责人让 Claude 起草招聘启事。输出中包含“年轻有活力的人”“欢迎体力好的男性”等表述。最恰当的应对是哪一项？","o":[{"j":"年齢・性別に関するバイアスのある表現として修正し、職務要件に基づく中立的な表現に書き換える。","z":"将其视为带有年龄和性别偏见的表述加以修改，改写为基于职务要求的中立表述。"},{"j":"Claudeが作成したものなので、客観的で問題ないと判断する。","z":"因为是 Claude 写的，所以判断客观、没有问题。"},{"j":"表現はそのまま残し、「本求人は性別・年齢を問いません」という注意書きを末尾に追加して対応済みとする。","z":"保留原表述，在末尾加上“本招聘不限性别、年龄”的说明，视为已处理。"},{"j":"求人票の作成にはAIを使わないと決める。","z":"决定不再用 AI 撰写招聘启事。"}],"a":[0],"e":"AI 输出可能反映训练数据中的社会偏见。识别年龄、性别偏见，改为基于职务要求的中立表达，是使用者的责任。认为 AI 生成的内容天然客观是误解；保留原表达只在末尾加注意事项，并没有解决问题；「求人票にAIを使わない」是过度反应。","ej":"AIの出力にもバイアスは含まれる。人が検出し中立的に修正する。"},{"id":"d2-013","d":2,"t":"2.2","n":1,"q":"Claudeに「この業界の最新の規制動向」を質問したところ、Web検索を使わずに回答が返ってきた。回答には特定の施行日が記載されていた。最も注意すべき点はどれか。","qz":"向 Claude 询问“该行业最新的监管动向”，它没有使用网络搜索就给出了回答，回答中写有特定的施行日期。最需要注意的是哪一点？","o":[{"j":"回答が長文かどうか。","z":"回答是否够长。"},{"j":"回答の敬語が適切かどうか。","z":"回答的敬语是否恰当。"},{"j":"Claudeが回答に自信を示しているかどうか。自信があれば最新の情報を反映していると考えてよい。","z":"Claude 是否对回答表现出自信。如果有自信，可以认为反映了最新信息。"},{"j":"学習データの時点以降に変更がある可能性があり、最新の公式情報で施行日を確認する必要があること。","z":"在训练数据截止时间之后可能有变化，需要用最新的官方信息确认施行日期。"}],"a":[3],"e":"不使用 Web 搜索时，模型只依赖训练数据，存在“知识截止”问题，最新动向可能过时或被编造。应以最新的官方信息核实施行日期（也可开启 Web 搜索）。Claude 表现得自信不代表信息是最新的；回答的长度和敬语与正确性无关。","ej":"最新情報は学習データの時点以降に変わり得る。Web検索や公式情報で確認。"},{"id":"d2-014","d":2,"t":"2.2","n":2,"q":"Claudeの出力にハルシネーションが含まれている可能性が高いサインとして、特に注意すべきものを2つ選べ。","qz":"作为 Claude 输出中很可能含有幻觉的信号，请选出 2 项特别需要注意的。","o":[{"j":"回答が箇条書きで整理されている。","z":"回答以要点形式整理。"},{"j":"実在を確認できないURLや論文タイトルが引用されている。","z":"引用了无法确认是否存在的 URL 或论文标题。"},{"j":"回答の冒頭で質問内容を言い換えて確認している。","z":"回答开头对问题内容进行了复述确认。"},{"j":"回答に「確認が必要です」という注意書きがある。","z":"回答中有“需要确认”的提示。"},{"j":"提供した資料に書かれていない具体的な数値や固有名詞が登場する。","z":"出现了所提供资料中没有写的具体数字或专有名词。"}],"a":[1,4],"e":"无法确认存在的 URL 或论文标题，以及提供的资料中没有的具体数字或专有名词，是幻觉的典型信号。用要点整理、先复述问题都是格式和沟通方式；附上「確認が必要です」反而是谨慎的表现，并非幻觉信号。","ej":"架空の出典・URL、資料にない具体的数値や固有名詞はハルシネーションのサイン。"},{"id":"d2-015","d":2,"t":"2.2","n":1,"q":"同じ質問をClaudeに2回したところ、1回目は「A案が優れている」、2回目は「B案が優れている」と異なる結論が返ってきた。最も適切な解釈と対応はどれか。","qz":"同一个问题问了 Claude 两次，第一次回答“A方案更好”，第二次回答“B方案更好”，结论不同。最恰当的理解和应对是哪一项？","o":[{"j":"2回目の回答が新しいので、B案を採用する。","z":"第二次的回答更新，因此采用B方案。"},{"j":"評価基準が明確でない可能性があるため、判断基準（コスト・期間・リスク等）を明示して比較させ、根拠を確認する。","z":"可能是评价标准不明确，因此明确判断标准（成本、周期、风险等）让其比较，并确认依据。"},{"j":"Claudeは不安定なので、比較検討には一切使わない。","z":"Claude 不稳定，因此比较研究完全不用它。"},{"j":"同じ質問を10回繰り返し、より多く選ばれた案を採用する。回数を重ねるほど結論の信頼性は高まるからである。","z":"同一问题重复问10次，采用被选次数更多的方案，因为次数越多结论越可靠。"}],"a":[1],"e":"结论摇摆通常说明问题缺乏明确的评价标准，或两个方案本就接近。应明确判断标准（成本、期间、风险等），要求给出依据，最终由人判断。「2回目が新しいので採用」没有依据；重复 10 次取多数也不能保证正确；「比較検討に一切使わない」是过度反应。","ej":"結論が揺れる場合は判断基準を明示し、根拠を比較させる。"},{"id":"d2-016","d":2,"t":"2.2","n":1,"q":"Claudeに顧客レビューの感情分析を依頼したところ、特定の地域の顧客のレビューだけが一貫して否定的に分類されていた。最も適切な対応はどれか。","qz":"请 Claude 对客户评论做情感分析，结果某一特定地区客户的评论一律被归类为负面。最恰当的应对是哪一项？","o":[{"j":"AIの分類は一貫しているので、その地域の顧客は不満が多いと結論づけ、地域別の改善施策を経営会議に提案する。","z":"AI 的分类是一致的，因此断定该地区客户不满较多，并向经营会议提出按地区的改进措施。"},{"j":"その地域のレビューを分析対象から除外する。","z":"将该地区的评论排除在分析对象之外。"},{"j":"方言や表現の違いによる分類の偏りの可能性を疑い、サンプルを人が確認して判定基準を見直す。","z":"怀疑是方言或表达差异导致的分类偏差，由人抽查样本并修订判定标准。"},{"j":"分析結果のグラフの色を変えて目立たなくする。","z":"改变分析结果图表的颜色，让它不那么显眼。"}],"a":[2],"e":"某个群体的结果系统性地偏向一边，可能是方言、表达差异或模型偏见造成的误判。应由人抽查样本确认，并修订判定标准或提示词。直接得出“该地区不满多”是未经验证就下结论；排除该地区数据会丢失信息；改图表颜色是在掩盖问题。","ej":"特定グループに偏った結果はバイアスを疑い、人がサンプル確認する。"},{"id":"d2-017","d":2,"t":"2.2","n":1,"q":"Claudeが作成した製品マニュアルの草案で、「本製品は防水です」という記述と、後半の「水濡れに注意してください」という記述が併存していた。最初に取るべき行動はどれか。","qz":"Claude 编写的产品手册草稿中，“本产品防水”的描述与后半部分“请注意防止进水”的描述同时存在。首先应采取的行动是哪一项？","o":[{"j":"製品仕様書で防水性能を確認し、正しい内容に統一する。","z":"通过产品规格书确认防水性能，统一为正确内容。"},{"j":"両方の記述を残し、ユーザーの判断に任せる。","z":"保留两种描述，交给用户自行判断。"},{"j":"後半の記述を削除する。","z":"删除后半部分的描述。"},{"j":"Claudeに「どちらが正しいか」を聞き、その回答に従う。","z":"问 Claude“哪个是对的”，按其回答处理。"}],"a":[0],"e":"输出内部矛盾时，应以权威来源（产品规格书）确认事实再统一。两种描述都保留是把风险转嫁给用户；不确认就删除后半部分可能删错；问 Claude 哪个正确也不可靠，模型并不知道真实规格，可能再次猜测。","ej":"矛盾は権威ある情報源（仕様書等）で事実確認してから統一する。"},{"id":"d2-018","d":2,"t":"2.2","n":2,"q":"Claudeの出力に含まれるバイアスを減らし、検出しやすくするための取り組みとして適切なものを2つ選べ。","qz":"作为减少并更容易发现 Claude 输出中偏见的做法，请选出 2 项恰当的。","o":[{"j":"AIは中立なので、出力のレビューは不要とする。","z":"AI 是中立的，因此不需要审核输出。"},{"j":"出力をできるだけ短くするよう指示する。","z":"指示输出尽量简短。"},{"j":"複数の立場や視点からの意見を出すよう依頼し、偏りがないか比較する。","z":"要求从多个立场和视角提出意见，并比较是否有偏向。"},{"j":"自分の意見を先に伝え、それを支持する根拠だけを出させる。","z":"先说出自己的意见，只让它提供支持这一意见的依据。"},{"j":"多様な背景を持つメンバーが出力をレビューする。","z":"由具有多样背景的成员审核输出。"}],"a":[2,4],"e":"要求从多个立场提出意见并比较，以及由背景多样的成员审核，都能帮助发现偏见。「AIは中立なのでレビュー不要」是误解；缩短输出与偏见无关；先说自己的意见、只要支持的依据，会让 Claude 迎合你，强化确认偏误。","ej":"多角的な視点を出させる＋多様なメンバーでレビュー。先に自説を示すと迎合を招く。"},{"id":"d2-064","d":2,"t":"2.2","n":1,"q":"Claudeに業界団体のガイドラインについて質問したところ、「2023年版ガイドライン第4.2項」と具体的に引用して回答した。担当者はこのガイドラインを手元に持っていない。最も適切な対応はどれか。","qz":"向 Claude 询问行业团体的指南，它具体引用了“2023 年版指南第 4.2 项”来回答。负责人手边没有这份指南。最合适的做法是哪一个？","o":[{"j":"ガイドラインの原文を入手し、第4.2項が存在し、記載内容が回答と一致するかを確認する","z":"获取指南原文，确认第 4.2 项是否存在、内容是否与回答一致"},{"j":"項番まで具体的なので、正しい引用だと判断する","z":"连条目编号都很具体，所以判断为正确引用"},{"j":"項番の記載を削除し、内容だけを使う","z":"删掉条目编号，只使用内容"},{"j":"Claudeに引用が正しいか確認させ、「正しい」と回答すれば、その回答を記録したうえで資料に引用して社内に配布する","z":"让 Claude 确认引用是否正确，回答“正确”就记录下来，引用到资料中并在公司内分发"}],"a":[0],"e":"具体的版本、条目编号看起来可信，但正是幻觉常见的形式。必须获取原文确认是否存在以及内容是否一致。让 Claude 自我确认不可靠；删掉编号只使用内容，内容本身仍未经验证。","ej":"具体的な項番ほど原文で存在と内容を確認"},{"id":"d2-065","d":2,"t":"2.2","n":1,"q":"Claudeに架空の新製品のネーミング案を出させたところ、そのうち1つが他社の既存の登録商標と同じだった。この状況から学ぶべきこととして最も適切なものはどれか。","qz":"让 Claude 为新产品想名字，其中一个与其他公司已有的注册商标相同。从这件事中应该吸取的教训，最合适的是哪一个？","o":[{"j":"Claudeは既存の権利を確認して出力しているわけではないため、採用前に商標データベース等で人が確認する必要がある","z":"Claude 输出时并不会确认现有权利，所以采用前需要人用商标数据库等进行确认"},{"j":"Claudeに「商標に問題がない名前だけを出して」と指示すれば、確認は不要になる","z":"只要指示 Claude“只给出商标没有问题的名字”，就不需要确认了"},{"j":"Claudeは偶然同じ名前を出しただけなので、気にせずに採用候補として社内会議に提出し、問題があれば後で変更する。ネーミングの最終判断は会議で行えばよい","z":"Claude 只是碰巧给出了同样的名字，不用在意，作为候选提交公司会议，有问题以后再改。起名的最终判断在会议上做就行"},{"j":"ネーミングにはAIを一切使わないようにする","z":"起名完全不使用 AI"}],"a":[0],"e":"Claude 生成内容时不会检索商标登记，可能与现有权利冲突。名字、标语、图案等要在采用前由人通过官方数据库确认。指示“只给没问题的名字”不能代替确认，模型无法保证；不在意直接提交风险大；完全不用 AI 是过度反应。","ej":"生成物の権利侵害の有無は人が公式DBで確認"},{"id":"d2-066","d":2,"t":"2.2","n":1,"q":"Claudeに社内アンケートの結果をグラフ用に集計させたところ、各選択肢の割合を合計すると112%になった（単一回答の設問）。最も適切な解釈と対応はどれか。","qz":"让 Claude 把公司内部问卷结果汇总成图表用的数据，结果各选项比例合计为 112%（单选题）。最合适的解释和对应是哪一个？","o":[{"j":"四捨五入の影響なので問題ない","z":"是四舍五入的影响，没有问题"},{"j":"グラフにすれば目立たないので、そのまま使う","z":"做成图表就不显眼了，直接使用"},{"j":"単一回答で合計が100%を超えるのは矛盾しているため、集計に誤りがあると判断し、コード実行で再集計して原データと照合する","z":"单选题合计超过 100% 是矛盾的，判断汇总有误，用代码执行重新汇总并与原始数据核对"},{"j":"112%を100%に収まるよう各選択肢の割合を少しずつ均等に減らして調整し、グラフを完成させて報告する","z":"把各选项比例均等地稍微减少，调整到 100% 以内，完成图表并报告"}],"a":[2],"e":"单选题比例合计应约为 100%，四舍五入最多差一两个百分点，112% 是明显的内部矛盾，说明汇总有误。应用代码执行重新计算并与原始数据核对。随意按比例压缩是篡改数据；直接使用则把错误带进报告。","ej":"合計が合わない＝矛盾のサイン、再集計して照合"},{"id":"d2-067","d":2,"t":"2.2","n":1,"q":"ClaudeにAさんとBさんの業績評価コメントの下書きを作らせたところ、同程度の成果なのに、女性のAさんには「協調性がある」、男性のBさんには「リーダーシップがある」と書かれていた。最も適切な対応はどれか。","qz":"让 Claude 起草两位员工的绩效评语，成果相当，但对女性员工写的是“有协调性”，对男性员工写的是“有领导力”。最合适的做法是哪一个？","o":[{"j":"性別の情報を伏せたうえで、もう一度同じ依頼を出し、出てきたコメントをそのまま評価シートに転記して提出する。最終確認は省略する","z":"隐去性别信息后再提一次同样的请求，把得到的评语直接抄进评价表提交。省略最终确认"},{"j":"評価コメントはAIの判断なので、人が手を加えるべきではない","z":"评语是 AI 的判断，人不应该修改"},{"j":"どちらも褒め言葉なので問題ない","z":"两个都是褒义词，没有问题"},{"j":"性別による固定観念が反映されている可能性があるため、具体的な成果と行動事実に基づく表現に統一して書き直させる","z":"可能反映了基于性别的刻板印象，应让它统一改写为基于具体成果和行为事实的表达"}],"a":[3],"e":"同等成果却按性别使用不同类型的评价词，是刻板印象带来的偏见，会影响晋升等重要决定。应改为基于具体成果和行为事实的表达，并由评价者负责。「褒め言葉なので問題ない」忽视了偏见；把评语当作 AI 的判断不让人修改是错误的；隐去性别是有用的做法，但不经审核直接提交仍不妥。","ej":"評価文のバイアスは事実ベースの表現に統一"},{"id":"d2-068","d":2,"t":"2.2","n":1,"q":"Claudeに「〇〇という研究によると…」と論文を根拠にした説明をさせたところ、著者名・発表年・雑誌名がそろっていた。社内勉強会の資料に使う前に行うべきことはどれか。","qz":"让 Claude 以论文为依据进行说明，它写出了“根据某某研究……”，作者名、发表年份、期刊名都齐全。用于公司内部学习会资料之前应该做什么？","o":[{"j":"社内勉強会なので、多少の誤りがあっても問題ないとして、確認はせずに資料に入れ、参加者に配布しておく","z":"因为是内部学习会，有些错误也没关系，不确认就放进资料发给参加者"},{"j":"著者名・発表年・雑誌名がそろっているので、実在の論文だと判断する","z":"作者名、发表年份、期刊名都齐全，所以判断为真实论文"},{"j":"論文の部分だけ削除し、説明の内容はそのまま使う","z":"只删除论文部分，说明内容照常使用"},{"j":"学術データベースで論文が実在するか、著者・年・内容が説明と一致するかを確認する","z":"在学术数据库中确认论文是否真实存在，作者、年份、内容是否与说明一致"}],"a":[3],"e":"格式完整的文献引用也可能是虚构的，这是幻觉的典型例子。应在学术数据库中确认论文存在且内容一致。内部用途也会传播错误知识；删掉引用而保留说明，说明内容本身仍可能是错的。","ej":"論文引用は実在と内容をデータベースで確認"},{"id":"d2-069","d":2,"t":"2.2","n":1,"q":"Claudeの出力に含まれやすい問題として、「矛盾（不整合）」の例として最も適切なものはどれか。","qz":"作为 Claude 输出中容易出现的问题，“矛盾（不一致）”的例子最合适的是哪一个？","o":[{"j":"報告書が、読み手にとって難しい専門用語で書かれている","z":"报告用对读者来说很难的专业术语写成"},{"j":"報告書の冒頭では「参加者は120名」、後半の表では「参加者118名」と書かれている","z":"报告开头写“参加者 120 名”，后半部分的表格写“参加者 118 名”"},{"j":"報告書に、存在しない講演者の名前が書かれている","z":"报告中写了不存在的演讲者姓名"},{"j":"報告書に記載された参加者数が、実際の参加者数と異なっている","z":"报告中写的参加人数与实际人数不同"}],"a":[1],"e":"矛盾（不整合）是同一输出内部前后说法不一致。与实际人数不同是准确性问题；不存在的演讲者是幻觉；术语太难是表达是否适合读者的问题。","ej":"不整合＝同じ出力内での食い違い"},{"id":"d2-070","d":2,"t":"2.2","n":1,"q":"Claudeに競合他社の動向を調べさせたところ、Web検索を有効にしていなかったにもかかわらず「先月発表された新サービス」について詳しく説明された。最も適切な判断はどれか。","qz":"让 Claude 调查竞争对手的动向，虽然没有开启 Web 搜索，它却详细说明了“上个月发布的新服务”。最合适的判断是哪一个？","o":[{"j":"学習データの時点以降の情報は持っていない可能性が高く、内容が不正確または創作である恐れがあるため、Web検索や公式発表で確認する","z":"很可能没有训练数据时点之后的信息，内容可能不准确或是编造的，应通过 Web 搜索或官方发布确认"},{"j":"「先月」という言葉だけを「最近」に置き換えれば、内容が多少古くても問題はなくなるので、そのまま共有する","z":"只要把“上个月”换成“最近”，内容即使有点旧也没问题，所以直接共享"},{"j":"Claudeは常に最新情報を把握しているので信頼できる","z":"Claude 总是掌握最新信息，所以可信"},{"j":"説明が詳しいほど正確なので、そのまま報告に使う","z":"说明越详细越准确，所以直接用于报告"}],"a":[0],"e":"不开 Web 搜索时，Claude 只依赖有截止日期的训练知识，“上个月”的具体信息很可能不准确或是编造的。应用 Web 搜索和官方发布确认。详细不代表正确；只改措辞不能解决内容的可信度问题。","ej":"カットオフ後の「最新情報」はWeb検索・公式発表で確認"},{"id":"d2-071","d":2,"t":"2.2","n":2,"q":"ハルシネーションのリスクを減らすためのプロンプトの工夫として、適切なものを2つ選べ。","qz":"作为降低幻觉风险的提示词技巧，选出 2 个合适的。","o":[{"j":"「必ず具体的な数値と出典を挙げて断定的に答えてください」と指示する","z":"指示“一定要列出具体数字和出处，断定地回答”"},{"j":"「資料に記載がない場合は、推測せず『記載なし』と答えてください」と指示する","z":"指示“资料中没有写的，不要推测，回答‘未记载’”"},{"j":"回答の根拠となる資料を提供し、その資料に基づいて答えるよう指示する","z":"提供作为依据的资料，并指示基于该资料回答"},{"j":"「専門家として、わからないことがあっても自信を持って答えてください」と指示する","z":"指示“作为专家，即使有不懂的也要自信地回答”"},{"j":"回答をできるだけ長くするよう指示する","z":"指示回答尽量长"}],"a":[1,2],"e":"允许“不知道”、提供依据资料并要求基于资料回答，都能有效减少编造。强制要求具体数字和出处、要求不懂也自信回答，都会迫使模型在没有信息时编造；回答越长，出错的地方往往越多。","ej":"「わからなければそう言う」許可＋根拠資料の提供"},{"id":"d2-072","d":2,"t":"2.2","n":1,"q":"Claudeに複数の候補地の比較を依頼し、自分の推している候補地Xを先に伝えたうえで評価させたところ、Xが最も高く評価された。この結果の扱いとして最も適切なものはどれか。","qz":"让 Claude 比较多个候选地点，先告诉它自己推荐的候选地 X 再让它评价，结果 X 评价最高。如何对待这个结果，最合适的是哪一个？","o":[{"j":"ユーザーの意向に影響された可能性があるため、自分の意見を伝えずに評価基準だけを示して再度評価させ、結果を比較する","z":"可能受到了用户意向的影响，应不说自己的意见、只给出评价标准再评价一次，并比较结果"},{"j":"Xの評価が高い理由をもっと詳しく書かせ、その説明を説得材料として社内の決裁資料に盛り込み、承認を急ぐ","z":"让它把 X 评价高的理由写得更详细，作为说服材料写进内部审批资料，尽快获得批准"},{"j":"Claudeも同じ結論なので、Xで確定する","z":"Claude 也是同样结论，所以确定 X"},{"j":"Claudeは中立なので、ユーザーの意見に影響されることはない","z":"Claude 是中立的，不会受用户意见影响"}],"a":[0],"e":"先说出自己的倾向，模型可能迎合用户（谄媚、确认偏误），导致评价偏向。应只给出中立的评价标准重新评估，比较结果后再判断。直接确定或进一步强化说服材料都会放大偏差；认为 Claude 绝对中立是误解。","ej":"先に自分の意見を伝えると迎合バイアス、基準だけで再評価"},{"id":"d2-073","d":2,"t":"2.2","n":1,"q":"Claudeに地域別の売上分析をさせたところ、「関東は前年比+15%、関西は前年比-3%、全国合計は前年比-8%」と記載された。関東と関西で全体の大半を占める。最も適切な対応はどれか。","qz":"让 Claude 做分地区销售分析，结果写着“关东同比 +15%，关西同比 -3%，全国合计同比 -8%”。关东和关西占全体的大部分。最合适的做法是哪一个？","o":[{"j":"各地域の数値と全国合計の整合性が取れていない可能性が高いため、原データから計算をやり直して確認する","z":"各地区数字与全国合计很可能不一致，应从原始数据重新计算确认"},{"j":"全国合計の数値を削除して、地域別の数値だけを報告し、全国の状況は口頭で補足するようにすることで、資料の矛盾をなくす","z":"删除全国合计，只报告分地区数字，全国情况口头补充，以此消除资料中的矛盾"},{"j":"分析結果を分かりやすくするため、グラフを追加する","z":"为了让分析结果易懂，追加图表"},{"j":"地域ごとの数値が正しければ、全国合計は参考程度なので問題ない","z":"各地区数字正确的话，全国合计只是参考，没有问题"}],"a":[0],"e":"占大部分的两个地区一增一小减，全国却大幅下降，数字之间逻辑上不一致，说明计算或数据有误。应从原始数据重新计算。默认地区数字正确没有依据；删掉合计是回避问题；加图表只改了呈现方式。","ej":"部分と全体の数値の整合性をチェック"},{"id":"d2-074","d":2,"t":"2.2","n":1,"q":"Claudeに海外市場の消費者像をまとめさせたところ、特定の国の消費者について「時間にルーズ」「価格交渉が好き」といった表現が並んだ。最も適切な対応はどれか。","qz":"让 Claude 总结海外市场的消费者形象，结果对某个国家的消费者列出了“不守时”“喜欢讨价还价”等表达。最合适的做法是哪一个？","o":[{"j":"表現が直接的すぎるので、より婉曲な言い回しに変えるだけにして、内容そのものは変えずに資料に掲載する","z":"表达太直接了，只改成更委婉的说法，内容本身不变就放进资料"},{"j":"国籍に基づくステレオタイプの可能性があるため、調査データや出典に基づく具体的な傾向に限定して書き直させ、根拠を確認する","z":"可能是基于国籍的刻板印象，应让它限定为基于调查数据和出处的具体倾向来改写，并确认依据"},{"j":"海外市場の分析にはAIを使わないことにする","z":"海外市场分析不使用 AI"},{"j":"一般によく言われていることなので、そのまま資料に使う","z":"这是一般常说的，所以直接用在资料里"}],"a":[1],"e":"按国籍一概而论的描述是刻板印象，不仅不准确，还可能冒犯对方，影响商业判断。应限定为有调查数据和出处支持的具体倾向。“一般常说”不是依据；只改得委婉却不改内容，偏见仍然存在；不用 AI 是过度反应。","ej":"国籍等のステレオタイプはデータ・出典に基づく表現へ"},{"id":"d2-075","d":2,"t":"2.2","n":1,"q":"Claudeに社内の過去のトラブル事例を分析させたところ、「原因の大半は新人のミス」と結論づけられた。しかし提供したデータには担当者の経験年数が含まれていなかった。最も適切な対応はどれか。","qz":"让 Claude 分析公司过去的故障案例，结论是“大部分原因是新人的失误”。但提供的数据中并不包含负责人的经验年数。最合适的做法是哪一个？","o":[{"j":"結論が分かりやすいので、新人研修の強化策を立案し、来期の重点施策として経営会議に提案する","z":"结论易懂，所以制定加强新人培训的方案，作为下期重点措施提交经营会议"},{"j":"Claudeは多くの事例を学習しているので、その推論は信頼できる","z":"Claude 学习过很多案例，所以这个推论可信"},{"j":"データに根拠のない推論が含まれているため、結論の根拠となったデータ項目を示させ、根拠がない部分は削除・修正させる","z":"结论中包含了数据里没有依据的推论，应让它指出作为依据的数据项目，删除或修正没有依据的部分"},{"j":"経験年数のデータを後から追加すれば、結論は自然に正しくなる","z":"之后补充经验年数数据，结论自然就会变正确"}],"a":[2],"e":"提供的数据中没有经验年数，却得出“新人失误”的结论，是没有依据的推论（一种幻觉或偏见）。应要求指出依据，删除或修正无依据的部分。相信模型的“经验”、据此制定重点措施，都可能导致错误决策；补数据不会让已有的结论自动变正确，需要重新分析。","ej":"データにない結論は根拠を示させ、なければ修正"},{"id":"d2-076","d":2,"t":"2.2","n":1,"q":"Claudeの出力に潜むバイアスに気づきやすくするための行動として、最も適切なものはどれか。","qz":"为了更容易发现 Claude 输出中潜在的偏见，最合适的做法是哪一个？","o":[{"j":"「この分析で考慮されていない立場や反対意見はあるか」を問い、別の視点からの検討を求める","z":"询问“这个分析有没有没被考虑的立场或反对意见”，要求从其他角度进行探讨"},{"j":"一度出た結論は変えないよう指示し、以降の会話でもその前提を維持させる","z":"指示不要改变已经得出的结论，之后的对话也保持这个前提"},{"j":"自分の考えと同じ結論が出るまでプロンプトを調整する","z":"调整提示词，直到得出与自己想法相同的结论"},{"j":"出力をできるだけ短く要約させ、結論だけを見る","z":"让它把输出尽量简短地摘要，只看结论"}],"a":[0],"e":"主动询问遗漏的立场和反对意见，是发现偏见的有效方法。只看结论会丢失判断依据；调整到符合自己想法为止会强化确认偏误；固定结论会妨碍修正。","ej":"反対意見・別視点を求めてバイアスを点検"},{"id":"d2-019","d":2,"t":"2.3","n":1,"q":"企画担当者が、Claudeに長い業界レポート（PDF）を読み込ませて質問している。回答の根拠を確認しやすくするためのプロンプトとして最も適切なものはどれか。","qz":"一名企划人员让 Claude 读取一份很长的行业报告（PDF）并向其提问。为了便于确认回答的依据，最恰当的提示词是哪一项？","o":[{"j":"「できるだけ自信を持って回答してください」","z":"“请尽量自信地回答。”"},{"j":"「回答の根拠となるレポート内の該当箇所を引用し、ページ番号を添えてください。該当箇所がなければそう明記してください」","z":"“请引用报告中作为回答依据的相关段落，并附上页码。如果没有相关段落，请明确说明。”"},{"j":"「あなたはこの業界のトップアナリストです。専門家としての知見を最大限に活かし、自信を持って詳しく回答してください」","z":"“你是这个行业的顶级分析师。请最大限度发挥专家见解，自信而详细地回答。”"},{"j":"「簡潔に一言で回答してください」","z":"“请用一句话简洁回答。”"}],"a":[1],"e":"要求引用报告原文并附页码，人可以快速回到原文核对；同时允许“没有就说没有”，可以减少编造。「自信を持って回答」和「トップアナリストとして」只是改变语气或角色，可能让幻觉更难察觉；「一言で回答」去掉了依据。","ej":"根拠となる箇所を引用させ、なければ「ない」と言わせる。"},{"id":"d2-020","d":2,"t":"2.3","n":1,"q":"Claudeが回答の中で、ある調査機関の統計データを引用した。この統計を社外向け資料に使う前のファクトチェックとして最も適切なものはどれか。","qz":"Claude 在回答中引用了某调查机构的统计数据。在把该统计用于对外资料之前，作为事实核查最恰当的是哪一项？","o":[{"j":"他のAIツールにも同じ質問をして、同じ数値が出れば正しいと判断する。","z":"用其他 AI 工具问同样的问题，如果数字相同就判断正确。"},{"j":"数値が妥当な範囲に見えれば採用する。","z":"只要数值看起来在合理范围内就采用。"},{"j":"Claudeに出典を再確認させ、謝罪がなければ正しいとみなす。","z":"让 Claude 再次确认出处，如果它没有道歉就视为正确。"},{"j":"調査機関の公式発表や原典にあたり、数値・調査年・定義が一致するか確認する。","z":"查阅调查机构的官方发布或原始文献，确认数值、调查年份和定义是否一致。"}],"a":[3],"e":"事实核查的基本原则是回到一手资料（原典）。不仅核对数字，还要核对调查年份和定义（如“市场规模”的口径）。问其他 AI 得到相同数字也不算验证，多个 AI 可能犯同样的错；「妥当な範囲に見える」不等于正确；Claude 有没有道歉不是验证。","ej":"ファクトチェックは原典にあたり、数値・年・定義まで確認する。"},{"id":"d2-021","d":2,"t":"2.3","n":1,"q":"Web検索を有効にしたClaudeが、引用リンク付きで回答を返した。引用の扱いとして最も適切なものはどれか。","qz":"开启了网络搜索的 Claude 返回了附有引用链接的回答。对于引用，最恰当的处理是哪一项？","o":[{"j":"重要な主張については引用リンク先を開き、記載内容が回答と一致しているか確認する。","z":"对于重要的论断，打开引用链接，确认其内容与回答是否一致。"},{"j":"引用リンクが付いている主張は検索結果に基づいているので、リンク先を開かなくても正確だとみなしてよい。","z":"附有引用链接的论断是基于搜索结果的，因此即使不打开链接也可以视为准确。"},{"j":"引用の数が多いほど正確なので、引用数だけを確認する。","z":"引用越多越准确，因此只确认引用数量。"},{"j":"引用元のドメイン名だけを見て判断する。","z":"只看引用来源的域名来判断。"}],"a":[0],"e":"有引用也可能出现“引用内容与回答不符”或断章取义，重要论断需要打开来源核对。认为有链接就不用打开、按引用数量判断，都是把引用的存在当作正确性的证明；只看域名也不够，要看内容本身。","ej":"引用があっても、重要な主張はリンク先の内容と一致するか確認する。"},{"id":"d2-022","d":2,"t":"2.3","n":2,"q":"Claudeが作成した社内向けの技術解説資料について、効率的かつ確実にファクトチェックを行う方法として適切なものを2つ選べ。","qz":"对于 Claude 制作的内部技术讲解资料，作为高效且可靠地进行事实核查的方法，请选出 2 项恰当的。","o":[{"j":"Claudeに、資料中の検証が必要な事実主張（数値・固有名詞・日付）を一覧化させ、それを一つずつ確認する。","z":"让 Claude 把资料中需要验证的事实性论断（数字、专有名词、日期）列成清单，然后逐一确认。"},{"j":"重要な主張は、社内の公式ドキュメントやその分野の担当者に照会して確認する。","z":"重要论断通过公司内部官方文档或向该领域的负责人询问来确认。"},{"j":"資料の文体がプロらしければ正しいとみなす。","z":"资料文风专业就视为正确。"},{"j":"Claudeに同じ資料を再生成させ、内容が変わらなければ確認済みとする。","z":"让 Claude 重新生成同一份资料，内容不变就视为已确认。"},{"j":"誤りがあれば読者が気づくので、確認は省略して配布する。","z":"有错读者会发现，所以省略确认直接分发。"}],"a":[0,1],"e":"先让 Claude 把需要核实的事实论断（数字、专有名词、日期）列成清单，核查能更有系统、不遗漏；再向公司官方文档或负责人确认重要论断。文风专业不代表事实正确；重新生成内容不变也不能证明正确；「読者が気づく」是把核查责任推给读者，违背 Diligence。","ej":"検証が必要な主張を一覧化→公式文書・担当者で確認、が効率的で確実。"},{"id":"d2-023","d":2,"t":"2.3","n":1,"q":"Claudeに提供した契約書について「解約条件」を質問したところ、もっともらしい回答が返ってきた。回答が契約書の内容に基づいているかを確かめるために、最も有効なプロンプトはどれか。","qz":"就提供给 Claude 的合同询问“解约条件”，得到了看似合理的回答。为确认回答是否基于合同内容，最有效的提示词是哪一项？","o":[{"j":"「あなたの回答は正しいですか？」","z":"“你的回答正确吗？”"},{"j":"「契約書の内容に加えて、一般的な契約実務における解約条件も含めて、網羅的に詳しく説明してください」","z":"“除了合同内容外，也请包括一般合同实务中的解约条件，全面详细地说明。”"},{"j":"「まず契約書から解約に関する条文をそのまま抜き出し、その引用だけに基づいて回答してください」","z":"“请先从合同中原样摘录与解约相关的条文，然后只基于这些引用来回答。”"},{"j":"「法律の専門家として回答してください」","z":"“请以法律专家的身份回答。”"}],"a":[2],"e":"“先摘录合同原文条款，再只基于引用回答”是减少幻觉、提高可验证性的经典方法，人可以直接对照条文。问「あなたの回答は正しいですか」是自我确认，不可靠；要求加入一般合同实务会混入合同以外的知识；设定“法律专家”角色并不能保证依据来自这份合同。","ej":"先に原文を抜き出させ、その引用だけに基づいて回答させる。"},{"id":"d2-024","d":2,"t":"2.3","n":1,"q":"Claudeに市場規模の推計を依頼したところ、「約3,200億円」という数値が示された。推計の妥当性を検証する方法として最も適切なものはどれか。","qz":"请 Claude 估算市场规模，给出了“约3200亿日元”的数字。作为验证该估算是否合理的方法，最恰当的是哪一项？","o":[{"j":"桁が大きいので信頼できると判断する。","z":"数字量级大，判断可信。"},{"j":"推計に使った前提（顧客数、単価、普及率など）と計算過程を示させ、各前提を外部データで確認する。","z":"让其展示估算所用的前提（客户数、单价、普及率等）和计算过程，并用外部数据确认各前提。"},{"j":"数値を「約3,000億円」に丸めて使う。","z":"把数字四舍五入成“约3000亿日元”再使用。"},{"j":"推計の根拠は聞かずに何度か再生成させ、出てきた複数の数値の平均を取って最終的な市場規模とする。","z":"不问估算依据，多次重新生成，取得到的多个数字的平均值作为最终市场规模。"}],"a":[1],"e":"估算的可信度取决于前提与计算过程。要求展示前提（客户数、单价、普及率等）和推导过程，再逐一用外部数据核实，才能判断是否合理。四舍五入不改变正确性；不问依据、多次生成再取平均没有任何验证作用；「桁が大きいので信頼できる」没有依据。","ej":"推計は前提と計算過程を開示させ、前提を外部データで確認する。"},{"id":"d2-025","d":2,"t":"2.3","n":1,"q":"新入社員向け研修資料をClaudeで作成した。内容には社内制度（休暇制度・経費精算ルール）の説明が含まれる。公開前の確認として最も適切なものはどれか。","qz":"用 Claude 制作了新员工培训资料，其中包含公司制度（休假制度、报销规则）的说明。发布前的确认工作最恰当的是哪一项？","o":[{"j":"Claudeは一般的な企業制度に詳しいので確認は不要である。","z":"Claude 熟悉一般企业制度，不需要确认。"},{"j":"新入社員に配布してから質問があれば修正する。","z":"先分发给新员工，有疑问再修改。"},{"j":"誤字脱字のチェックのみ行う。","z":"只检查错别字和漏字。"},{"j":"最新の社内規程と照合し、人事・経理の制度担当者に内容確認を依頼する。","z":"与最新的公司规章核对，并请人事和财务的制度负责人确认内容。"}],"a":[3],"e":"公司特有的制度只能以公司内部最新规章为准，Claude 的一般知识可能与本公司规定不符。应与最新规章核对，并请人事、财务的制度负责人确认。「一般的な制度に詳しいので不要」是把一般知识当作本公司规定；发出去再改会让错误信息先流出；只查错别字只检查了形式。","ej":"社内制度は最新の社内規程と担当部署で確認する。一般知識で代用しない。"},{"id":"d2-026","d":2,"t":"2.3","n":2,"q":"Claudeの出力の正確性を検証する手法として、信頼性が低いものを2つ選べ。","qz":"作为验证 Claude 输出准确性的手段，请选出 2 项可靠性低的。","o":[{"j":"一次情報（公式発表、原典、規程原文）と照合する。","z":"与一手资料（官方发布、原始文献、规章原文）核对。"},{"j":"Claude自身に回答の確信度を数値で答えさせる。","z":"让 Claude 自己用数字回答对答案的确信程度。"},{"j":"その分野の専門家にレビューを依頼する。","z":"请该领域的专家审核。"},{"j":"回答の文章が断定的で迷いがないことを確認する。","z":"确认回答的文字是否断定、毫不犹豫。"},{"j":"コード実行で計算を再現する。","z":"用代码执行复现计算。"}],"a":[1,3],"e":"本题选“可靠性低”的方法。让 Claude 自报确信度、确认语气是否断定，都不是准确性的可靠信号——幻觉往往也很自信。与一手资料核对、请专家审核、用代码执行重现计算，都是有效的验证手段。","ej":"自己申告の確信度や断定的な口調は、正確性の根拠にならない。"},{"id":"d2-077","d":2,"t":"2.3","n":1,"q":"Claudeに社内規程（PDF）を読み込ませ、「在宅勤務の上限日数」を質問した。回答の根拠を効率よく確認するためのプロンプトとして最も適切なものはどれか。","qz":"让 Claude 读取公司规章（PDF），询问“居家办公的上限天数”。为了高效确认回答的依据，最合适的提示词是哪一个？","o":[{"j":"「人事のプロとして、一般的な企業の在宅勤務の上限日数も参考に、できるだけ具体的な日数を答えてください（推測でもよい）」","z":"“请作为人事专家，参考一般企业居家办公的上限天数，尽量回答具体的天数（推测也可以）”"},{"j":"「正確に答えてください」","z":"“请准确回答”"},{"j":"「回答の根拠となる条文をそのまま引用し、条番号を示してください。該当がなければ『記載なし』と答えてください」","z":"“请原文引用作为回答依据的条文并标明条号。如果没有相关内容，请回答‘未记载’”"},{"j":"「わかりやすく一言で答えてください」","z":"“请简单易懂地用一句话回答”"}],"a":[2],"e":"要求原文引用和条号，人可以直接对照规章；允许回答“未记载”可以防止编造。参考一般企业会混入规章以外的信息；“请准确回答”没有提供可验证的方法；一句话回答去掉了依据。","ej":"根拠条文の引用＋条番号＋「記載なし」許可"},{"id":"d2-078","d":2,"t":"2.3","n":1,"q":"Web検索を使ったClaudeの回答に、ニュースサイトへの引用リンクが3つ付いていた。重要な意思決定に使う前の確認方法として最も適切なものはどれか。","qz":"使用 Web 搜索的 Claude 回答附有 3 个新闻网站的引用链接。用于重要决策之前，最合适的确认方法是哪一个？","o":[{"j":"引用が3つあるので十分に裏付けられていると判断する","z":"有 3 个引用，判断为已有充分依据"},{"j":"リンク先を開いて記事の内容・日付が回答と一致するか確認し、可能であれば公式発表など一次情報にもあたる","z":"打开链接确认文章内容和日期是否与回答一致，可能的话再查官方发布等一手资料"},{"j":"リンクのURLが正しい形式か確認する","z":"确认链接 URL 格式是否正确"},{"j":"引用元が有名なニュースサイトであれば、記事を開かなくても内容は正しいと考え、回答の要約だけを意思決定の資料に記載する","z":"如果引用来源是知名新闻网站，不打开文章也认为内容正确，只把回答的摘要写进决策资料"}],"a":[1],"e":"引用内容可能与回答不符、日期过旧或被断章取义。重要决策前要打开来源核对，并尽量追溯到一手资料（官方发布）。引用数量多、URL 格式正确、来源有名，都不能代替确认内容本身。","ej":"引用は開いて内容・日付を確認、可能なら一次情報へ"},{"id":"d2-079","d":2,"t":"2.3","n":1,"q":"Claudeに作らせた社外向けホワイトペーパーに、市場データ・法規制・技術用語の説明が含まれている。ファクトチェックの進め方として最も適切なものはどれか。","qz":"让 Claude 制作的对外白皮书包含市场数据、法规和技术术语的说明。推进事实核查，最合适的方法是哪一个？","o":[{"j":"Claudeに「ファクトチェック済み」と文末に書かせる","z":"让 Claude 在文末写上“已完成事实核查”"},{"j":"全体を通読し、違和感のある箇所だけを確認する","z":"通读全文，只确认感觉不对的地方"},{"j":"別のAIツールに同じ内容を書かせ、両方の内容が一致している部分は正しいと判断し、一致しない部分だけを修正する。この方法なら短時間で全体を確認できる","z":"让另一个 AI 工具写同样的内容，两者一致的部分判断为正确，只修改不一致的部分。用这种方法可以在短时间内确认全部"},{"j":"検証が必要な主張を種類ごとに一覧化し、市場データは調査機関の原典、法規制は条文、技術用語は社内の専門家で確認する","z":"把需要验证的论断按类别列成清单，市场数据查调查机构原典，法规查条文，技术术语请公司内部专家确认"}],"a":[3],"e":"系统地列出需要验证的论断，再按类型对应合适的一手资料或专家确认，才能高效且无遗漏。只凭违和感会漏掉看起来自然的错误；写上“已核查”是形式；多个 AI 一致也可能一起出错，不是验证。","ej":"主張を一覧化し、種類ごとに適切な一次情報で確認"},{"id":"d2-080","d":2,"t":"2.3","n":1,"q":"Claudeに売上データ（CSV）を分析させ、「平均客単価は4,850円」という結果を得た。この数値を検証する方法として最も適切なものはどれか。","qz":"让 Claude 分析销售数据（CSV），得到“平均客单价为 4,850 日元”的结果。验证这个数字最合适的方法是哪一个？","o":[{"j":"数値が妥当な範囲に見えれば採用する","z":"数字看起来在合理范围就采用"},{"j":"Claudeに同じ質問をもう一度して、同じ数値が出れば正しいと判断する","z":"再问 Claude 一次同样的问题，得出相同数字就判断为正确"},{"j":"コード実行で計算させ、使用した計算式と対象件数を確認し、一部をスプレッドシートで再計算して照合する","z":"用代码执行计算，确认使用的计算公式和对象件数，部分用表格软件重新计算核对"},{"j":"前年の平均客単価と大きく違わないことだけを確認し、違わなければ、計算方法は確認せずにそのまま報告書に記載する","z":"只确认与去年平均客单价相差不大，不大的话不确认计算方法，直接写进报告"}],"a":[2],"e":"数字计算要确认计算过程（公式、对象范围、件数），并独立复算部分结果。看起来合理、与去年接近都不能证明正确，比如分母弄错也可能得出“看似合理”的值；同样问题问两次结果相同也不是验证。","ej":"数値は計算式・対象件数を確認し独立に再計算"},{"id":"d2-081","d":2,"t":"2.3","n":1,"q":"ファクトチェックにおける「一次情報」の例として、最も適切なものはどれか。","qz":"作为事实核查中“一手资料”的例子，最合适的是哪一个？","o":[{"j":"SNSで多く共有されている統計のまとめ画像","z":"在社交媒体上被大量分享的统计汇总图片"},{"j":"Claudeが統計について説明した回答","z":"Claude 对统计数据所做的说明"},{"j":"その統計を引用して解説しているブログ記事","z":"引用该统计并进行解说的博客文章"},{"j":"官公庁が公開している統計データの原表","z":"政府机关公开的统计数据原表"}],"a":[3],"e":"一手资料是信息的原始出处，如政府原表、法律原文、原论文、公司正式文件。博客、社交媒体汇总图都是二手或更多次加工的信息，可能有误引或过时；Claude 的回答本身就是要被验证的对象。","ej":"一次情報＝原典（公式統計・条文・原論文・社内正式文書）"},{"id":"d2-082","d":2,"t":"2.3","n":2,"q":"Claudeに長い技術マニュアルを読ませて質問に答えさせている。回答がマニュアルに基づいているか、効率よく検証できるようにするための工夫として適切なものを2つ選べ。","qz":"让 Claude 读取一份很长的技术手册并回答问题。为了能高效验证回答是否基于手册，选出 2 个合适的做法。","o":[{"j":"回答の前に、関連する箇所をマニュアルから引用として抜き出させる","z":"在回答前，让它从手册中摘录相关部分作为引用"},{"j":"引用部分に章・節の番号を付けさせ、原文に戻りやすくする","z":"让它给引用部分标上章节号，便于回到原文"},{"j":"回答はできるだけ簡潔にし、根拠は省略させる","z":"回答尽量简洁，省略依据"},{"j":"マニュアルにない一般知識でも積極的に補って答えるよう指示する","z":"指示即使是手册中没有的一般知识也要积极补充回答"},{"j":"回答が正しいかどうかをClaude自身に10点満点で採点させる","z":"让 Claude 自己用 10 分制给回答是否正确打分"}],"a":[0,1],"e":"先摘录引用、再标注章节号，人可以快速回到原文对照，大幅提高验证效率。积极补充一般知识会混入手册以外的内容；自我打分不可靠；省略依据则无法验证。","ej":"引用の抜き出し＋章節番号で検証しやすく"},{"id":"d2-083","d":2,"t":"2.3","n":1,"q":"Claudeが翻訳した海外の規制文書の要旨に「罰則は最大500万ユーロ」と記載されていた。この情報を社内の経営会議資料に記載する前に行うべきことはどれか。","qz":"Claude 翻译的海外法规文件要点中写着“罚款最高 500 万欧元”。在写进公司内部经营会议资料之前应该做什么？","o":[{"j":"翻訳はClaudeの得意分野なので、確認は不要である","z":"翻译是 Claude 的擅长领域，不需要确认"},{"j":"金額が大きいので、注意喚起のために強調表示し、経営会議でリスクとして説明できるよう補足資料を用意する","z":"金额很大，为了提醒而突出显示，并准备补充资料以便在经营会议上作为风险说明"},{"j":"ユーロを円に換算して分かりやすくする","z":"把欧元换算成日元，使其易懂"},{"j":"規制文書の原文で罰則の条文を特定し、金額・単位・条件が翻訳と一致しているか確認する","z":"在法规原文中找到罚则条文，确认金额、单位、条件是否与翻译一致"}],"a":[3],"e":"金额、单位、适用条件是翻译和摘要中容易出错的地方，用于经营判断前必须回到原文条文确认。换算或强调都不能改变信息是否正确；翻译擅长不等于不会出错，尤其是数字和条件。","ej":"数値・単位・条件は原文の条文で確認"},{"id":"d2-084","d":2,"t":"2.3","n":1,"q":"Claudeの回答を検証する際、「クロスチェック」の考え方として最も適切なものはどれか。","qz":"验证 Claude 的回答时，关于“交叉验证”的思路，最合适的是哪一个？","o":[{"j":"同じ情報源の別のページを見て確認する","z":"查看同一信息来源的其他页面确认"},{"j":"互いに独立した複数の信頼できる情報源で、同じ事実が裏付けられるかを確認する","z":"确认同一事实是否能被多个相互独立、可靠的信息来源证实"},{"j":"Claudeの回答を引用している記事を探して、同じことが書かれているか確認し、書かれていれば裏付けが取れたと判断する","z":"寻找引用了 Claude 回答的文章，确认是否写着同样的内容，写着的话就判断为已得到证实"},{"j":"Claudeに同じ質問を複数回して、回答が一致するか確認する","z":"向 Claude 多次提出同样的问题，确认回答是否一致"}],"a":[1],"e":"交叉验证的关键是“独立”的多个可靠来源。同一模型多次回答、同一来源的其他页面都不是独立来源；引用 AI 回答的文章是循环引用，不能作为证据。","ej":"クロスチェック＝独立した複数の信頼できる情報源"},{"id":"d2-085","d":2,"t":"2.3","n":1,"q":"Claudeが作成した製品比較資料で、自社製品の「バッテリー持続時間20時間」と記載されている。最も適切な検証方法はどれか。","qz":"Claude 制作的产品比较资料中写着本公司产品“电池续航 20 小时”。最合适的验证方法是哪一个？","o":[{"j":"営業担当者に「だいたい合っているか」を聞き、合っていると言われれば、測定条件の記載は省略して資料を完成させる","z":"问销售负责人“大致对不对”，说对的话就省略测量条件完成资料"},{"j":"Claudeは自社製品のWebサイトを学習しているはずなので、そのまま使う","z":"Claude 应该学习过公司产品网站，所以直接使用"},{"j":"競合製品よりも長ければ問題ないので、競合の数値だけを確認する","z":"只要比竞品长就没问题，所以只确认竞品的数字"},{"j":"自社の最新の公式製品仕様書で数値と測定条件を確認する","z":"用公司最新的官方产品规格书确认数字和测量条件"}],"a":[3],"e":"本公司产品的规格要以最新的官方规格书为准，还要确认测量条件（同样的数字在不同条件下意义不同）。训练知识可能过时或不准确；只查竞品不验证自己的数字；“大致对”的口头确认不够严谨。","ej":"自社仕様は最新の公式仕様書で数値と条件を確認"},{"id":"d2-086","d":2,"t":"2.3","n":1,"q":"Claudeに研究分野の概要を調べさせたところ、引用付きで回答が返ってきた。引用の扱いについて、最も適切な考え方はどれか。","qz":"让 Claude 调查某研究领域的概况，得到附有引用的回答。关于如何对待引用，最合适的想法是哪一个？","o":[{"j":"引用が付いていない主張だけを確認すればよい","z":"只需确认没有附引用的论断"},{"j":"引用は検証の手がかりであり、重要な主張は引用元を開いて内容が一致するか確認する必要がある","z":"引用是验证的线索，重要论断需要打开引用来源确认内容是否一致"},{"j":"引用が付いている主張はすべて正しい","z":"附有引用的论断都是正确的"},{"j":"引用元のタイトルが質問内容と関係していれば、本文を読まなくても主張は裏付けられているとみなしてよい","z":"引用来源的标题与提问内容相关，就可以不读正文，视为论断已被证实"}],"a":[1],"e":"引用帮助我们找到依据，但引用本身也可能与论断不符。重要论断要打开引用核对内容。认为有引用就正确、只查没有引用的部分、只看标题，都会漏掉引用错误。","ej":"引用は「検証の入口」、重要な主張は中身を確認"},{"id":"d2-087","d":2,"t":"2.3","n":1,"q":"Claudeが要約した四半期レポートを上司に送る前に、効率的に検証したい。最も適切な方法はどれか。","qz":"在把 Claude 摘要的季度报告发给上司之前，想高效地进行验证。最合适的方法是哪一个？","o":[{"j":"要約中の数値・固有名詞・結論をリスト化させ、それぞれを元のレポートの該当箇所と照合する","z":"让它把摘要中的数字、专有名词、结论列成清单，逐一与原报告的相应部分核对"},{"j":"要約の文章が読みやすければ問題ないとして送付する","z":"摘要读起来顺就视为没问题，直接发送"},{"j":"元のレポートを最初から最後まで読み直し、要約と比べる","z":"把原报告从头到尾重读一遍，与摘要比较"},{"j":"要約を作り直させ、2つの要約を比べて、内容が多い方を正しいと判断したうえで送付する。比較結果は記録として残しておく","z":"让它重新摘要，比较两份摘要，判断内容多的那份正确后发送。比较结果作为记录保留"}],"a":[0],"e":"把需要验证的要素列成清单再逐项对照，是兼顾效率和准确性的方法。全文重读虽然可靠但效率低；可读性不代表正确；内容多也不代表正确。","ej":"検証対象（数値・固有名詞・結論）をリスト化して照合"},{"id":"d2-088","d":2,"t":"2.3","n":2,"q":"ファクトチェックの方法として、信頼性が低いものを2つ選べ。","qz":"作为事实核查的方法，选出 2 个可靠性低的。","o":[{"j":"その分野の専門家に確認を依頼する","z":"请该领域的专家确认"},{"j":"回答の文章が論理的で筋が通っていれば正しいとみなす","z":"回答的文章逻辑通顺就视为正确"},{"j":"社内の正式な規程や記録と照合する","z":"与公司内部正式的规章或记录核对"},{"j":"公的機関が公開している原典と照合する","z":"与公共机构公开的原典核对"},{"j":"Claudeに「本当ですか」と聞き直し、訂正されなければ正しいとみなす","z":"再问 Claude 一次“真的吗”，没有更正就视为正确"}],"a":[1,4],"e":"问 Claude “真的吗”属于自我确认，模型可能坚持错误，也可能把正确的改错；逻辑通顺也不代表事实正确，幻觉往往说得很有道理。与原典、正式规章核对、请专家确认都是可靠的方法。","ej":"自己確認・もっともらしさは検証にならない"},{"id":"d2-089","d":2,"t":"2.3","n":1,"q":"Claudeに社内の過去の議事録（Projectのナレッジ）から「前回決めた予算額」を質問したところ、金額が回答された。この金額を次の会議資料に使う前の確認として最も適切なものはどれか。","qz":"在 Project 知识中放了公司过去的会议纪要，向 Claude 询问“上次决定的预算金额”，它回答了一个金额。在把这个金额用于下次会议资料前，最合适的确认是哪一个？","o":[{"j":"金額の桁数が妥当かどうかだけ確認する","z":"只确认金额位数是否合理"},{"j":"ナレッジには複数回分の議事録が入っているが、最新の金額が出ているはずだと考え、日付は確認せずに資料に記載する","z":"知识中有多次会议的纪要，但认为输出的应该是最新金额，不确认日期就写进资料"},{"j":"どの議事録のどの記述に基づくかを示させ、該当する議事録の原文で金額を確認する","z":"让它指出依据的是哪份纪要的哪段描述，在相应纪要原文中确认金额"},{"j":"Projectのナレッジに基づく回答なので、必ず正しい","z":"是基于 Project 知识的回答，所以一定正确"}],"a":[2],"e":"即使基于 Project 知识，Claude 也可能引用了旧版纪要或混淆了不同会议。应让它指出依据来源，并在原文中确认金额和日期。“基于知识就一定正确”是误解；只看位数不够；有多次纪要时尤其要确认是哪一次的决定。","ej":"ナレッジ由来でも出典の箇所と日付を原文で確認"},{"id":"d2-027","d":2,"t":"2.4","n":1,"q":"カスタマーサポートチームがClaudeで返信の下書きを作成している。次のうち、送信前に必ず人がレビューすべきケースとして最も適切なものはどれか。","qz":"客服团队用 Claude 起草回复。以下哪种情况最应该在发送前必须由人审核？","o":[{"j":"顧客から返金や契約上の補償を求められ、金額や条件を回答するケース。","z":"客户要求退款或合同上的补偿，需要回答金额或条件的情况。"},{"j":"営業時間を案内する定型的な返信。","z":"告知营业时间的固定格式回复。"},{"j":"問い合わせ受付を知らせる自動返信で、受付番号と回答予定日の目安を記載するもの。","z":"告知已受理咨询的自动回复，其中写有受理编号和预计回复日期的大致时间。"},{"j":"FAQページへのリンクを案内する返信。","z":"引导至FAQ页面链接的回复。"}],"a":[0],"e":"涉及退款、合同补偿等金钱和法律责任的回复，一旦出错影响大且难以挽回，必须由有权限的人审核。营业时间介绍、受理自动回复、FAQ 链接都属于低风险的定型内容，可以用模板提高效率（仍需定期抽查）。","ej":"金銭・契約・法的責任に関わる出力は送信前に必ず人がレビュー。"},{"id":"d2-028","d":2,"t":"2.4","n":1,"q":"人のレビューや追加検証の必要度を判断する際に、最も重視すべき観点はどれか。","qz":"在判断是否需要人工审核或额外验证时，最应重视的视角是哪一项？","o":[{"j":"出力の文字数の多さ。","z":"输出的字数多少。"},{"j":"Claudeの回答速度。","z":"Claude 的回答速度。"},{"j":"誤りがあった場合の影響の大きさ（リスク）と、出力が社外や意思決定に使われるかどうか。","z":"如果出错影响有多大（风险），以及输出是否用于对外或决策。"},{"j":"使用したモデルが最上位モデルかどうか。最上位モデルであれば誤りは少ないので、レビューを省略できる。","z":"所用模型是否是最高端模型。如果是最高端模型错误少，可以省略审核。"}],"a":[2],"e":"审核力度应与风险成正比：错误的影响越大、越是用于对外或重要决策，越需要人审核和额外验证。即使使用最上位模型也会出错，不能免除审核；字数和回答速度与风险无关。","ej":"レビューの強度はリスク（誤りの影響）と用途（社外・意思決定）で決める。"},{"id":"d2-029","d":2,"t":"2.4","n":1,"q":"医療機器メーカーのマーケティング担当者が、Claudeで製品の効能を説明する広告コピーを作成した。最も適切な次のステップはどれか。","qz":"一家医疗器械厂商的市场人员用 Claude 撰写了说明产品功效的广告文案。最恰当的下一步是哪一项？","o":[{"j":"コピーが魅力的なので、そのまま広告に使用する。","z":"文案很有吸引力，直接用于广告。"},{"j":"薬事・法務の担当部門による規制適合性のレビューを受けてから使用する。","z":"经药事/法务部门进行合规性审核后再使用。"},{"j":"Claudeに「この表現は法律に違反していませんか」と聞いて確認する。","z":"问 Claude“这个表述有没有违法？”来确认。"},{"j":"効能の表現をより強くして訴求力を高める。","z":"把功效表述写得更强，提高吸引力。"}],"a":[1],"e":"医疗相关的功效宣传受到严格法规约束，属于需要药事、法务专业人员审核的高风险领域。问 Claude「法律に違反していませんか」不能代替专业审核；加强功效表达会增加违规风险；直接使用则跳过了审核。","ej":"規制の厳しい領域（医療・金融・法務）は専門部門のレビューが必須。"},{"id":"d2-030","d":2,"t":"2.4","n":2,"q":"Claudeの出力について、人によるレビューや追加検証を特に強化すべき状況を2つ選べ。","qz":"对于 Claude 的输出，请选出 2 种特别需要加强人工审核或额外验证的情况。","o":[{"j":"社内の雑談チャンネル向けに、イベントのキャッチコピー案を出してもらう。","z":"为公司内部闲聊频道征集活动宣传语方案。"},{"j":"取締役会に提出する投資判断資料の財務数値をまとめる。","z":"整理提交给董事会的投资决策资料中的财务数字。"},{"j":"自分用のメモを箇条書きに整理する。","z":"把自己用的笔记整理成要点。"},{"j":"顧客に送付する契約更新条件の案内文を作成する。","z":"撰写发送给客户的合同续签条件通知。"},{"j":"ブレインストーミングでアイデアを20個出してもらう。","z":"在头脑风暴中让它提出20个点子。"}],"a":[1,3],"e":"提交董事会的投资判断用财务数字、发给客户的合同更新条件，一旦出错影响大且涉及责任，需要加强审核。闲聊频道的标语、自己的笔记、头脑风暴创意都是低风险的内部或创意用途，人本来就会筛选。","ej":"重要な意思決定・社外への契約情報は検証を強化。アイデア出しや個人メモは低リスク。"},{"id":"d2-031","d":2,"t":"2.4","n":1,"q":"チームリーダーが、Claudeで作成した週次レポートを毎週そのまま部長に送っている。これまで誤りは見つかっていない。最も適切な考え方はどれか。","qz":"一名团队负责人每周都把用 Claude 制作的周报直接发给部长，至今没发现错误。最恰当的想法是哪一项？","o":[{"j":"これまで誤りがないので、今後もレビューは不要である。","z":"至今没有错误，今后也不需要审核。"},{"j":"レポート作成はAIの責任なので、誤りがあればAIの問題である。","z":"报告制作是 AI 的责任，如果出错是 AI 的问题。"},{"j":"念のため、毎週すべての文章を一から書き直す。","z":"为保险起见，每周从头重写所有内容。"},{"j":"送付者として内容に責任を持ち、重要な数値や結論は毎回確認する。","z":"作为发送者对内容负责，每次都确认重要的数字和结论。"}],"a":[3],"e":"过去没错不代表将来不会错（自动化偏见）。使用 AI 产出并发送的人对结果负最终责任（Diligence），应以合理的成本每次检查关键数字和结论。「今後もレビュー不要」是自动化偏见；「誤りはAIの責任」是推卸责任；每周全部重写则过度，抵消了效率。","ej":"最終責任は送付者にある。過去に誤りがなくても重要点は毎回確認する。"},{"id":"d2-032","d":2,"t":"2.4","n":1,"q":"Claudeが、従業員の健康相談に関する問い合わせに対して一般的な健康情報を回答した。社内ヘルプデスクとしての運用で最も適切なものはどれか。","qz":"Claude 针对员工健康咨询的问题回答了一般性的健康信息。作为公司内部服务台的运营方式，最恰当的是哪一项？","o":[{"j":"Claudeの回答を医学的な診断として案内する。","z":"把 Claude 的回答当作医学诊断提供给员工。"},{"j":"一般情報にとどめ、個別の症状や判断が必要な場合は産業医や専門家へ案内する仕組みにする。","z":"仅限于一般信息，对于个别症状或需要判断的情况，建立引导至产业医生或专家的机制。"},{"j":"健康に関する質問はすべて無視する。","z":"忽略所有与健康相关的问题。"},{"j":"回答の正確性を高めるため、従業員の健康診断データをすべてClaudeに入力する。","z":"为提高回答准确性，把员工的体检数据全部输入 Claude。"}],"a":[1],"e":"涉及个人健康判断的领域需要专业人员。AI 可以提供一般信息，但应设计“升级到产业医或专家”的流程。把回答当作医学诊断是越权；全部无视是过度反应；输入所有员工的体检数据违反隐私和数据最小化原则。","ej":"専門判断が必要な領域は、専門家へエスカレーションする仕組みを作る。"},{"id":"d2-033","d":2,"t":"2.4","n":1,"q":"アソシエイトが、Claudeを使って業務自動化の簡単なスクリプトを生成した。そのスクリプトを全社の基幹システムに組み込みたいと考えている。最も適切な対応はどれか。","qz":"一名业务人员用 Claude 生成了一个简单的业务自动化脚本，想把它集成到全公司的核心系统中。最恰当的应对是哪一项？","o":[{"j":"技術的な実装やシステム連携は、開発者・アーキテクトにレビューと実装を依頼する。","z":"技术实现和系统集成应请开发人员或架构师进行审核和实施。"},{"j":"Claudeが生成したコードなので、そのまま本番環境に導入する。","z":"是 Claude 生成的代码，直接部署到生产环境。"},{"j":"Claudeに「このコードは安全ですか」と確認してから自分で導入する。","z":"先问 Claude“这段代码安全吗？”，再自己部署。"},{"j":"動作確認は本番環境で行えばよい。","z":"运行确认在生产环境中进行即可。"}],"a":[0],"e":"Associate 的定位是认清自身能力边界，把技术实现和系统集成升级给开发者、架构师审核和实施。核心系统集成涉及安全和可靠性，需要专业审核。直接导入生产环境、在生产环境做动作确认风险极高；问 Claude「このコードは安全ですか」不能替代专业审核。","ej":"基幹システム連携など技術的な実装は、Developer・Architectへエスカレーション。"},{"id":"d2-034","d":2,"t":"2.4","n":1,"q":"Claudeに外国の取引先との契約書を翻訳・要約させたところ、要約に「準拠法は日本法」と記載されていた。この要約をもとに契約締結の判断をする前に、最も適切な対応はどれか。","qz":"让 Claude 翻译并总结与外国客户的合同，摘要写着“准据法为日本法”。在基于该摘要做出签约判断之前，最恰当的应对是哪一项？","o":[{"j":"要約に明記されているので、そのまま判断材料とする。","z":"摘要中写得很清楚，直接作为判断依据。"},{"j":"要約の文章を整えて社内稟議に回す。","z":"润色摘要文字后提交公司内部审批。"},{"j":"準拠法など重要条項は原文で該当条文を確認し、法務部門のレビューを受ける。","z":"准据法等重要条款要在原文中确认相关条文，并接受法务部门审核。"},{"j":"別の言い方で再度要約させ、同じ結果なら確定とする。","z":"换个说法重新总结一次，结果相同就确定。"}],"a":[2],"e":"签约是高风险决策，准据法等关键条款必须回到原文确认，并由法务部门审核。摘要只是辅助理解的工具。换一种说法再摘要一次、结果相同也不能证明正确；直接作为判断依据或整理文字后提交审批，都跳过了验证。","ej":"契約締結など重要判断は、要約ではなく原文と法務レビューで確認する。"},{"id":"d2-090","d":2,"t":"2.4","n":1,"q":"Claudeを使って作成した、全社員向けの人事制度変更のお知らせを配信しようとしている。最も適切な進め方はどれか。","qz":"准备发布用 Claude 制作的、面向全体员工的人事制度变更通知。最合适的推进方式是哪一个？","o":[{"j":"配信後に社員からの質問を受けて、間違いがあれば訂正版を出す","z":"发布后接受员工提问，有错误就发更正版"},{"j":"制度の正確性について人事制度の担当者、表現について広報や上長の確認を経てから配信する","z":"准确性请人事制度负责人确认、表达请宣传或上级确认后再发布"},{"j":"Claudeに「この内容は正しいですか」と最終確認させ、正しいと回答されたら、そのまま全社員に配信し、問い合わせは人事に回す","z":"让 Claude 最终确认“内容是否正确”，回答正确的话直接发给全员，问询转给人事"},{"j":"Claudeが作成したので、誤字脱字を確認したら配信する","z":"因为是 Claude 做的，确认没有错别字就发布"}],"a":[1],"e":"面向全体员工的制度变更通知影响面大、出错难以挽回，必须由制度负责人确认内容、由相关人员确认表达。只查错别字是形式检查；先发后改会造成混乱；让 Claude 自我确认不能替代人的审核。","ej":"影響範囲が広い文書は担当者のレビューを経て配信"},{"id":"d2-091","d":2,"t":"2.4","n":1,"q":"人によるレビューの必要性が最も低いと考えられるClaudeの利用はどれか。","qz":"以下 Claude 的用法中，被认为最不需要人工审核的是哪一个？","o":[{"j":"顧客に提示する見積金額を計算する","z":"计算提供给客户的报价金额"},{"j":"自分の頭の整理のために、読んだ本の感想メモを箇条書きにまとめる","z":"为了整理自己的思路，把读书感想笔记整理成要点"},{"j":"採用候補者の書類選考の合否を判定する","z":"判断应聘者的书面筛选是否通过"},{"j":"社外に発表するプレスリリースを作成する","z":"制作对外发布的新闻稿"}],"a":[1],"e":"个人用的笔记整理只影响自己，出错也容易发现和修正，风险低。报价金额涉及金钱和合同；招聘筛选影响他人的机会，可能涉及偏见和法律问题；新闻稿是对外发布，都需要人审核。","ej":"自分用の低リスク用途はレビュー負担が小さい"},{"id":"d2-092","d":2,"t":"2.4","n":1,"q":"Claudeを使って社内の問い合わせ対応を一部自動化する計画がある。人によるレビューの設計として最も適切なものはどれか。","qz":"计划用 Claude 将公司内部问询应对部分自动化。人工审核的设计最合适的是哪一个？","o":[{"j":"リスクの低い定型的な問い合わせはClaudeの回答を活用し、給与・懲戒・健康など判断を伴う内容は担当者が確認する仕組みにする","z":"风险低的定型问询使用 Claude 的回答，涉及工资、惩戒、健康等需要判断的内容设计为由负责人确认的机制"},{"j":"回答の品質を保つため、Claudeが自信を持って回答できた問い合わせだけを自動で送信し、自信がないものは担当者が確認することで、確認の負担を減らす","z":"为了保证回答质量，只自动发送 Claude 有把握回答的问询，没有把握的由负责人确认，以此减轻确认负担"},{"j":"すべての回答を担当者が一から書き直す","z":"所有回答都由负责人从头重写"},{"j":"すべての回答をClaudeに任せ、担当者は関与しない","z":"所有回答都交给 Claude，负责人不参与"}],"a":[0],"e":"按风险分级设计人工审核：低风险定型内容提高效率，高风险或需要判断的内容由人确认（Human-in-the-loop）。全部重写失去了效率；全部交给 AI 风险太大；以 Claude 的“自信程度”作为分流标准不可靠，自信不代表正确。","ej":"リスクに応じてレビューを設計（人が入る場所を決める）"},{"id":"d2-093","d":2,"t":"2.4","n":2,"q":"Claudeの出力について、追加の検証や専門家のレビューが特に必要な状況を2つ選べ。","qz":"关于 Claude 的输出，选出 2 个特别需要追加验证或专家审核的情况。","o":[{"j":"社内プレゼンの見出し案を考える","z":"构思公司内部演讲的标题方案"},{"j":"自分用のToDoリストを整理する","z":"整理自己的待办事项清单"},{"j":"チームの懇親会の店の候補を挙げる","z":"列出团队聚餐的餐厅候选"},{"j":"従業員の懲戒処分の妥当性について、判断材料をまとめる","z":"整理关于员工惩戒处分是否妥当的判断材料"},{"j":"新製品の安全性に関する注意事項を取扱説明書に記載する","z":"在使用说明书中写入新产品安全相关的注意事项"}],"a":[3,4],"e":"惩戒处分涉及员工权利和法律风险，安全注意事项出错可能导致人身伤害，都必须经过专家审核。聚餐候选、演讲标题、个人待办都是低风险用途。","ej":"人の権利・安全に関わる内容は専門家レビュー"},{"id":"d2-094","d":2,"t":"2.4","n":1,"q":"Claudeで作成した投資信託の商品説明資料を顧客に渡したいと営業担当者が考えている。最も適切な対応はどれか。","qz":"销售负责人想把用 Claude 制作的投资信托产品说明资料交给客户。最合适的做法是哪一个？","o":[{"j":"Claudeに「金融商品取引法に違反していないか」を確認させれば十分である","z":"让 Claude 确认“是否违反金融商品交易法”就足够了"},{"j":"金融商品の説明には法令上の表示義務やリスク説明が必要なため、コンプライアンス部門の審査を受ける","z":"金融产品说明有法律上的表示义务和风险说明要求，应接受合规部门的审查"},{"j":"顧客の理解を助けるため、リスクの説明部分を短くし、期待されるリターンを中心にした分かりやすい内容に修正して渡す","z":"为了帮助客户理解，缩短风险说明部分，修改为以预期回报为中心的易懂内容再交给客户"},{"j":"内容が分かりやすく書けていれば、そのまま渡してよい","z":"内容写得易懂的话，直接交给客户即可"}],"a":[1],"e":"金融产品说明受到严格法规约束（风险说明、禁止误导性表示等），必须经过合规部门审查。易懂不代表合规；让 Claude 自行判断合规不能替代专业审查；缩短风险说明、强调回报会增加违规和误导风险。","ej":"金融・法規制の領域はコンプライアンス審査"},{"id":"d2-095","d":2,"t":"2.4","n":1,"q":"Claudeを日常的に使っているチームで、「AIの出力をそのまま信じてしまう」傾向（自動化バイアス）が心配されている。対策として最も適切なものはどれか。","qz":"在日常使用 Claude 的团队中，有人担心出现“直接相信 AI 输出”的倾向（自动化偏见）。最合适的对策是哪一个？","o":[{"j":"出力の用途やリスクに応じた確認ルール（何を誰がどう確認するか）を決め、チームで共有する","z":"根据输出的用途和风险制定确认规则（谁、用什么方式、确认什么），并在团队中共享"},{"j":"各メンバーの判断に任せ、問題が起きたときに個別に注意し、再発した場合には利用を制限することで、メンバーの自主性を尊重する","z":"交给每个成员自行判断，出问题时个别提醒，再犯的话限制使用，以此尊重成员的自主性"},{"j":"AIの利用を一律禁止する","z":"一律禁止使用 AI"},{"j":"最上位のモデルだけを使うようにすれば、出力を信じても問題ない","z":"只使用最高级的模型，相信输出也没问题"}],"a":[0],"e":"预防自动化偏见的关键是把“按风险确认”变成团队规则。一律禁止是过度反应；高级模型也会出错；事后个别提醒没有预防作用。","ej":"自動化バイアス対策＝リスクに応じた確認ルールの共有"},{"id":"d2-096","d":2,"t":"2.4","n":1,"q":"人によるレビューの必要度を判断するときに考慮すべき要素として、最も適切な組み合わせはどれか。","qz":"判断人工审核的必要程度时应考虑的因素，最合适的组合是哪一个？","o":[{"j":"出力の文字数、生成にかかった時間、使ったモデルの名前","z":"输出的字数、生成所花的时间、所用模型的名称"},{"j":"Claudeの回答の自信の度合い、文章の丁寧さ、見出しの有無","z":"Claude 回答的自信程度、文章的礼貌程度、有无标题"},{"j":"過去に同じ種類の出力で誤りがあったかどうかだけ","z":"只看过去同类输出是否出过错"},{"j":"誤りが起きた場合の影響の大きさ、出力の読み手（社内か社外か）、誤りを後から訂正できるか","z":"出错时影响的大小、输出的读者（公司内还是公司外）、错误之后能否更正"}],"a":[3],"e":"审核必要度取决于风险：影响多大、谁会看到、能否挽回。字数、时间、模型名、语气、标题都与风险无关；只看过去是否出错会陷入“以前没错所以不用查”的自动化偏见。","ej":"レビュー要否＝影響度・読み手・訂正可能性"},{"id":"d2-097","d":2,"t":"2.4","n":1,"q":"Claudeに顧客からのクレームメールへの返信案を作らせた。クレームの内容には、製品の欠陥による怪我の可能性が含まれている。最も適切な対応はどれか。","qz":"让 Claude 起草对客户投诉邮件的回复。投诉内容涉及产品缺陷可能导致受伤。最合适的做法是哪一个？","o":[{"j":"返信案から謝罪の表現を削除し、事実確認中とだけ伝える","z":"从回复草案中删掉道歉表达，只告知正在确认事实"},{"j":"Claudeの返信案が丁寧なので、すぐに送信して顧客の怒りを鎮める","z":"Claude 的回复草案很礼貌，立即发送平息客户的愤怒"},{"j":"いつもの定型クレームと同様に扱い、テンプレートに沿ってClaudeの返信案を少し修正したうえで、担当者の判断で送信する","z":"和平时的定型投诉同样处理，按模板稍微修改 Claude 的回复草案，由负责人自行判断发送"},{"j":"安全や法的責任に関わる重大案件として、品質保証・法務などの担当部門にエスカレーションし、返信内容の確認を受ける","z":"作为涉及安全和法律责任的重大案件，升级给质量保证、法务等负责部门，回复内容经其确认"}],"a":[3],"e":"涉及安全和法律责任的投诉是高风险案件，回复内容可能影响责任认定，需要升级给专业部门确认。为求快立即发送、自行删减表达、当作定型投诉处理，都绕过了必要的专业判断。","ej":"安全・法的責任の案件は担当部門へエスカレーション"},{"id":"d2-098","d":2,"t":"2.4","n":1,"q":"Claudeを使って、ある従業員の勤怠データから「問題のある勤務態度」を判定し、人事評価に反映させたいという提案があった。最も適切な考え方はどれか。","qz":"有人提议用 Claude 根据某员工的考勤数据判定“有问题的工作态度”，并反映到人事评价中。最合适的想法是哪一个？","o":[{"j":"本人に通知しなければ問題にならないので、試験的にClaudeの判定結果を評価に反映させ、精度を見ながら調整していく。問題が出れば中止する","z":"不通知本人就不会有问题，所以试验性地把 Claude 的判定结果反映到评价中，边看精度边调整。出现问题就停止"},{"j":"個人の評価に直結する判断はAIに委ねず、Claudeはデータ整理の補助にとどめ、最終判断は評価者が事実を確認して行う","z":"直接关系到个人评价的判断不交给 AI，Claude 只做数据整理的辅助，最终由评价者确认事实后判断"},{"j":"判定基準をClaudeに考えさせ、その基準で全従業員を自動的に評価する","z":"让 Claude 想出判定标准，并按这个标准自动评价全体员工"},{"j":"AIは感情に左右されないので、人よりも公平に判定できる","z":"AI 不受感情左右，所以能比人更公平地判定"}],"a":[1],"e":"人事评价直接影响员工的待遇和职业，属于高风险判断，必须由人基于事实作最终决定。认为 AI 天然公平是误解，AI 也可能有偏见；让 AI 定标准并自动评价是把重要判断完全交给 AI；不告知本人就试用，存在伦理和合规问题。","ej":"人事評価など個人に影響する判断は人が最終決定"},{"id":"d2-099","d":2,"t":"2.4","n":1,"q":"Claudeの出力を人がレビューする際の考え方として、最も適切なものはどれか。","qz":"关于人工审核 Claude 输出时的想法，最合适的是哪一个？","o":[{"j":"Claudeが作成した部分だけをレビューし、人が書き加えた部分は確認しない。人の文章は信頼できるため","z":"只审核 Claude 制作的部分，人追加的部分不确认。因为人写的文章可信"},{"j":"誰がレビューしても効果は同じなので、手の空いている人に任せる","z":"谁审核效果都一样，所以交给有空的人"},{"j":"レビューは形式的なものなので、承認の記録さえ残せばよい","z":"审核只是形式，只要留下批准记录就行"},{"j":"レビューする人は、内容を判断できる知識と、結果に責任を持てる立場を持っている必要がある","z":"审核的人需要具备能判断内容的知识，以及能对结果负责的立场"}],"a":[3],"e":"有效的人工审核要求审核者有判断内容的专业知识，并能承担责任。随便交给有空的人可能看不出错误；只留记录的形式化审核没有意义；人追加的部分同样可能出错，也要确认。","ej":"レビュー者＝判断できる知識＋責任を持てる立場"},{"id":"d2-100","d":2,"t":"2.4","n":1,"q":"Claudeで作成した社外向け資料について、「人が最終確認した」と言える状態として最も適切なものはどれか。","qz":"关于用 Claude 制作的对外资料，可以称为“人已最终确认”的状态，最合适的是哪一个？","o":[{"j":"担当者が資料をざっと開いて、レイアウトが崩れていないことを確認した","z":"负责人大致打开资料，确认版式没有乱"},{"j":"複数のメンバーにメールで共有し、期限までに誰からも指摘がなかったので、確認が済んだものとして社外に送付した","z":"通过邮件共享给多名成员，截止前没有人提出意见，于是视为已确认并发给公司外部"},{"j":"Claudeが「確認済み」と出力した","z":"Claude 输出了“已确认”"},{"j":"担当者が事実・数値を一次情報と照合し、表現と目的への適合を確認したうえで、自分の判断で承認している","z":"负责人把事实和数字与一手资料核对，确认表达和是否符合目的后，按自己的判断批准"}],"a":[3],"e":"真正的最终确认是负责人实际核对事实、表达和目的，并以自己的判断负责批准。只看版式是形式确认；Claude 写“已确认”不是人的确认；没人提意见不等于有人确认过（责任分散）。","ej":"最終確認＝照合・判断・承認を人が実際に行う"},{"id":"d2-101","d":2,"t":"2.4","n":1,"q":"Claudeを使って作成した社内向け研修資料と、取引先に提出する契約変更の案内文がある。レビューの進め方として最も適切なものはどれか。","qz":"有一份用 Claude 制作的内部培训资料，和一份要提交给客户的合同变更通知。审核的推进方式最合适的是哪一个？","o":[{"j":"両方を確認するが、取引先向けの案内文は契約条件を原本と照合し、法務の確認も受けるなど、より厳格にレビューする","z":"两份都要确认，但面向客户的通知要把合同条件与原件核对并经法务确认等，进行更严格的审核"},{"j":"社内向け資料の方が読む人数が多いので、そちらを厳しく確認し、取引先向けの案内文は担当営業の判断に任せて送付する","z":"内部资料读的人多，所以严格确认它，面向客户的通知交给负责销售自行判断发送"},{"j":"どちらも人が書き直す","z":"两份都由人重写"},{"j":"どちらもClaudeが作成したので、同じ程度に軽く確認する","z":"两份都是 Claude 做的，所以同样简单确认"}],"a":[0],"e":"审核强度要与风险匹配：对外、涉及合同条件的文件出错影响大，需要更严格的核对和专业确认；内部培训资料也要确认，但程度可以不同。一律轻度确认忽视了风险差异；只按读者人数判断忽略了法律影响；全部重写失去了效率。","ej":"レビューの厳しさはリスク（社外・契約）に比例"},{"id":"d2-035","d":2,"t":"2.5","n":1,"q":"技術部門がClaudeで作成したシステム障害の報告書を、経営層向けに共有したい。最も適切な依頼方法はどれか。","qz":"想把技术部门用 Claude 制作的系统故障报告分享给经营层。最恰当的请求方式是哪一项？","o":[{"j":"技術的な詳細は正確性のためにすべて残し、経営層が読みやすいように文字を大きくして図を追加するよう依頼する。","z":"为了准确性保留所有技术细节，并请它放大字体、增加图示，让经营层更易读。"},{"j":"「もっと短くして」とだけ指示する。","z":"只指示“写短一点”。"},{"j":"経営層に信頼されるよう、障害の技術的な原因分析をさらに詳しく書き加え、専門用語も正確に使って説得力を高めるよう指示する。","z":"为了获得经营层信任，指示它进一步详细补充故障的技术原因分析，并准确使用专业术语以提高说服力。"},{"j":"読み手（経営層）と目的を明示し、業務影響・原因概要・再発防止策・判断事項を1ページで、専門用語を避けて書き直させる。","z":"明确读者（经营层）和目的，让其用1页、避免专业术语，改写为业务影响、原因概要、防止再发措施和需决策事项。"}],"a":[3],"e":"为不同读者调整输出时，要明确告诉 Claude：读者是谁、他们关心什么、需要的结构和篇幅。经营层关心业务影响、原因概要、防止再发措施和需要判断的事项。只说「もっと短くして」不能保证保留经营层需要的信息；保留全部技术细节只放大字体、追加更多技术分析和专业术语，都不符合读者需求。","ej":"読み手・目的・構成・長さ・用語レベルを明示して書き直させる。"},{"id":"d2-036","d":2,"t":"2.5","n":1,"q":"Claudeに新製品の紹介文を3パターン作らせた。どれを採用するか決める方法として最も適切なものはどれか。","qz":"让 Claude 写了3种新产品介绍文案。决定采用哪一个时，最恰当的方法是哪一项？","o":[{"j":"ターゲット顧客・訴求ポイント・トーンなどの評価基準を決め、基準に沿って比較する。","z":"先确定目标客户、诉求重点、语气等评价标准，再按照标准进行比较。"},{"j":"最も長いパターンを選ぶ。","z":"选最长的那一版。"},{"j":"最初に生成されたパターンを選ぶ。","z":"选第一个生成的版本。"},{"j":"3パターンの良い部分をすべて取り入れるため、3つの文章をつなげて1つの紹介文にまとめる。","z":"为了吸收3种版本的所有优点，把3段文字连接成一份介绍文。"}],"a":[0],"e":"比较多个输出时，应先确定评价标准（目标客户、诉求点、语气等），再按标准比较，也可以让 Claude 按标准列出各版本的优缺点辅助判断。选最长的或最先生成的都没有依据；把三段文章拼成一篇会冗长、重复。","ej":"複数案は評価基準を先に決めてから比較する。"},{"id":"d2-037","d":2,"t":"2.5","n":1,"q":"Claudeが作成したメール文案が、取引先への謝罪メールとしてはカジュアルすぎる。最も効率的な修正方法はどれか。","qz":"Claude 写的邮件草稿作为给客户的道歉邮件过于随意。最高效的修改方法是哪一项？","o":[{"j":"会話をすべて削除して新しいチャットを開き、最初から「丁寧な謝罪メールを書いて」と依頼し直して新たに生成させる。","z":"删除全部对话，打开新聊天，从头请求“写一封礼貌的道歉邮件”重新生成。"},{"j":"内容は維持したまま「取引先への正式な謝罪メールとして、丁寧な敬語に修正して」と具体的にフィードバックする。","z":"保留内容，具体反馈：“作为给客户的正式道歉邮件，请修改为礼貌的敬语。”"},{"j":"自分で全文を書き直す。","z":"自己把全文重写。"},{"j":"「ダメです」とだけ伝える。","z":"只告诉它“不行”。"}],"a":[1],"e":"在同一对话中给出具体的修改反馈（保留内容、改成正式敬语、对象是客户），是最高效的迭代方式。只说「ダメです」缺乏具体指示，Claude 不知道怎么改；删除对话从头开始或自己全部重写，都浪费了已完成的工作。","ej":"何を維持し何をどう変えるかを具体的にフィードバックする。"},{"id":"d2-038","d":2,"t":"2.5","n":2,"q":"Claudeが作成した社内向け技術ブログ記事を、一般顧客向けのお知らせに転用する際に、修正すべき点として適切なものを2つ選べ。","qz":"把 Claude 撰写的内部技术博客文章转用为面向一般客户的通知时，请选出 2 项应修改的地方。","o":[{"j":"段落の数を増やす。","z":"增加段落数量。"},{"j":"記事の作成日をより新しい日付に変える。","z":"把文章的撰写日期改成更新的日期。"},{"j":"Claudeが作成したことを隠すため、文体を意図的に崩す。","z":"为了隐藏是 Claude 写的，故意把文风弄乱。"},{"j":"社内でしか通じない略語や専門用語を、一般向けの平易な表現に置き換える。","z":"把只有公司内部才懂的缩写和专业术语替换为面向大众的通俗表达。"},{"j":"社内の未公開情報や内部の検討経緯が含まれていないか確認し、削除する。","z":"确认是否包含内部未公开信息或内部讨论经过，并将其删除。"}],"a":[3,4],"e":"面向一般顾客转用时，要把公司内部才懂的缩写和术语换成通俗表达，并检查是否包含未公开信息或内部讨论经过。增加段落数与读者无关；改成更新的日期是篡改事实；为了隐瞒 AI 制作而故意打乱文体既不当也没有意义。","ej":"読み手の変更時は、用語レベルの調整と、未公開・社内情報の除去を確認する。"},{"id":"d2-039","d":2,"t":"2.5","n":1,"q":"教育担当者が、Claudeで作成した研修資料を新人向けとベテラン向けの2種類に分けたい。最も適切なアプローチはどれか。","qz":"一名培训负责人想把用 Claude 制作的培训资料分成新人版和资深员工版两种。最恰当的做法是哪一项？","o":[{"j":"同じ資料を2部コピーし、表紙だけ変える。","z":"把同一份资料复制两份，只改封面。"},{"j":"ベテラン向け資料だけ作成し、新人には自分で調べさせる。","z":"只做资深员工版，让新人自己查资料。"},{"j":"それぞれの対象者の前提知識と学習目標を伝え、説明の深さ・例・用語を調整した版を作らせる。","z":"告知各自对象的前提知识和学习目标，让 Claude 制作调整了讲解深度、示例和用语的版本。"},{"j":"ベテラン向けの資料を先に完成させ、分量を半分に削ったものを新人向けとして配布し、詳細は質問に応じて補う。","z":"先完成资深员工版，把内容删减一半作为新人版分发，细节根据提问再补充。"}],"a":[2],"e":"调整输出要基于读者的前提知识和学习目标：新人需要基础概念和具体例子，资深员工需要要点和进阶内容。复印两份只换封面没有任何调整；只做资深版让新人自己查不符合目的；把资深版删一半给新人，可能恰好删掉了新人最需要的基础说明。","ej":"対象者の前提知識と目標を伝え、深さ・例・用語を調整させる。"},{"id":"d2-040","d":2,"t":"2.5","n":1,"q":"Claudeが作成した提案書の草案について、上司から「論点が多すぎて結論がわかりにくい」と指摘を受けた。Claudeへの修正依頼として最も適切なものはどれか。","qz":"上司对 Claude 写的提案书草稿指出“论点太多，结论不清楚”。向 Claude 提出的修改请求中最恰当的是哪一项？","o":[{"j":"「論点をもっと増やして説得力を高めて」","z":"“再增加一些论点，提高说服力。”"},{"j":"「冒頭に結論を1文で示し、根拠を重要度の高い3点に絞って、残りは付録に移して」","z":"“在开头用一句话给出结论，把依据精简为最重要的3点，其余移到附录。”"},{"j":"「フォントと配色を変えて読みやすくして」","z":"“改变字体和配色，让它更易读。”"},{"j":"「上司が気に入るような表現と構成に全体を直してください。修正の方針はお任せします」","z":"“请把全文改成上司会喜欢的表述和结构，修改方针交给你。”"}],"a":[1],"e":"把上司的反馈转化为具体、可执行的修改指示：结论先行、依据精简到 3 点、次要内容移到附录。「上司が気に入るように、方針はお任せ」太模糊，Claude 不知道上司的偏好；增加论点与反馈相反；改字体和配色只改外观。","ej":"フィードバックは「結論先行・根拠を絞る」など具体的な指示に変換する。"},{"id":"d2-041","d":2,"t":"2.5","n":2,"q":"Claudeの出力を自分で編集・仕上げる際の姿勢として適切なものを2つ選べ。","qz":"自己编辑、完善 Claude 的输出时，请选出 2 项恰当的态度。","o":[{"j":"自分の知見や組織特有の文脈を加え、目的に合うよう内容を補強する。","z":"加入自己的见解和组织特有的背景，补强内容使其符合目的。"},{"j":"AIが作ったものは編集すると品質が下がるので、手を加えない。","z":"AI 写的东西一编辑质量就会下降，所以不动。"},{"j":"文字数を減らすことだけに集中する。","z":"只专注于减少字数。"},{"j":"出力の誤りは読み手が判断すればよい。","z":"输出中的错误由读者自行判断即可。"},{"j":"出力はあくまで下書きと捉え、最終的な内容と表現に自分が責任を持つ。","z":"把输出视为草稿，自己对最终内容和表达负责。"}],"a":[0,4],"e":"AI 输出是起点（草稿），人应加入自己的知识和组织特有的背景来补强，并对最终内容负责。「編集すると品質が下がる」放弃了人的作用；只关注减少字数太片面；「読み手が判断すればよい」是推卸责任。","ej":"出力は下書き。人が文脈を加えて仕上げ、最終責任を持つ。"},{"id":"d2-042","d":2,"t":"2.5","n":1,"q":"Claudeに同じテーマで2つの要約（A版：箇条書き、B版：段落形式）を作らせた。チーム内の進捗共有チャットに投稿する場合、最も適切な選択はどれか。","qz":"让 Claude 就同一主题写了两份摘要（A版：要点式，B版：段落式）。若要发布到团队内部的进度共享聊天中，最恰当的选择是哪一项？","o":[{"j":"A版とB版の両方を投稿し、メンバーそれぞれが読みやすい方を選べるようにする。","z":"两版都发布，让每位成员选择自己觉得易读的一版。"},{"j":"文字数が多いB版を選ぶ。","z":"选字数多的B版。"},{"j":"どちらも使わず、口頭で伝える。","z":"两份都不用，口头传达。"},{"j":"短時間で要点を把握できる箇条書きのA版を選び、必要に応じて調整する。","z":"选择能在短时间内掌握要点的要点式A版，必要时再调整。"}],"a":[3],"e":"选择输出形式要考虑使用场景：在聊天里共享进度需要快速扫读，要点式版本更合适。两个版本都发会增加读者负担；字数多不代表合适；改成口头传达则放弃了已有成果。","ej":"利用シーン（チャットでの共有）に合う形式を選ぶ。"},{"id":"d2-102","d":2,"t":"2.5","n":1,"q":"営業部長向けに作成した市場分析レポートを、同じ内容で現場の営業担当者向けにも共有したい。Claudeへの依頼として最も適切なものはどれか。","qz":"想把为销售部长制作的市场分析报告，以同样的内容也共享给一线销售人员。对 Claude 的委托最合适的是哪一个？","o":[{"j":"「読み手は現場の営業担当者です。日々の商談で使える示唆と具体的な行動例を中心に、1ページにまとめてください」","z":"“读者是一线销售人员。请以日常商谈中可用的启示和具体行动示例为中心，整理成 1 页”"},{"j":"「もっと簡単にしてください」","z":"“请写得更简单一些”"},{"j":"「部長向けのレポートと同じ構成・同じ分量を保ったまま、文体だけを少しくだけた話し言葉に変えて、営業担当者向けにしてください」","z":"“保持与部长版相同的结构和篇幅，只把文体改成稍微随意的口语，作为销售人员版”"},{"j":"「同じ内容をもう一度出力してください」","z":"“请再输出一次同样的内容”"}],"a":[0],"e":"为不同读者改写，要说明读者是谁、他们需要什么（可用于商谈的启示和行动）、篇幅和形式。重复输出没有调整；“简单一些”太模糊；只改文体不改结构和重点，不能满足一线人员的需求。","ej":"読み手・その人のニーズ・分量を明示して書き分け"},{"id":"d2-103","d":2,"t":"2.5","n":1,"q":"Claudeに同じテーマで3つのキャッチコピー案を出させた。最終案を選ぶプロセスとして最も適切なものはどれか。","qz":"让 Claude 就同一主题给出 3 个宣传标语方案。选出最终方案的流程，最合适的是哪一个？","o":[{"j":"ターゲット・ブランドの方針・伝えたい価値などの基準を明示し、Claudeに各案の長所短所を整理させたうえで、人が判断する","z":"明确目标客户、品牌方针、想传达的价值等标准，让 Claude 整理各方案的优缺点后，由人判断"},{"j":"一番短い案を選ぶ","z":"选最短的方案"},{"j":"Claudeに「どれが一番良いか」だけを聞き、その案を採用する","z":"只问 Claude“哪个最好”，采用那个方案"},{"j":"3案すべてを組み合わせて、要素を足し合わせた1つの長いコピーにまとめ、すべての訴求を盛り込んだうえで採用する","z":"把 3 个方案全部组合，把要素加在一起合成一个长标语，包含所有诉求后采用"}],"a":[0],"e":"比较多个输出时，先定标准，再让 Claude 辅助整理优缺点，最终由人判断。只问哪个最好而没有标准，判断依据不明；最短不一定最好；把所有要素塞进一个标语会失去焦点。","ej":"比較は基準を明示→長所短所の整理→人が判断"},{"id":"d2-104","d":2,"t":"2.5","n":1,"q":"Claudeが書いた顧客向けメールについて、上司から「内容は良いが、当社らしいトーンではない」と指摘された。今後も同様のメールを作成する場合、最も効果的な改善策はどれか。","qz":"关于 Claude 写的客户邮件，上司指出“内容不错，但不是本公司的语气”。今后还要写类似邮件，最有效的改进方法是哪一个？","o":[{"j":"毎回「当社らしく」とだけ指示する","z":"每次只指示“要有本公司的风格”"},{"j":"Claudeの出力を毎回自分で全文書き直す","z":"每次都自己把 Claude 的输出全部重写"},{"j":"自社の過去の模範メールを例として示し、トーンの特徴を説明したうえで、Projectの指示やスタイルとして設定する","z":"以公司过去的范例邮件为例，说明语气特点，然后设置为 Project 指示或风格"},{"j":"トーンは人によって感じ方が違うので、上司の指摘は気にせずに、内容が正しければそのまま送付し続ける","z":"语气每个人感受不同，所以不在意上司的意见，内容正确就继续直接发送"}],"a":[2],"e":"“本公司的语气”需要通过范例和具体特征说明才能被理解；反复使用的要求写进 Project 指示或风格，就不用每次重复。只说“要有本公司的风格”太抽象；每次重写效率低；无视反馈会影响品牌形象。","ej":"トーンは模範例で示し、指示・スタイルに設定して再利用"},{"id":"d2-105","d":2,"t":"2.5","n":2,"q":"Claudeが作成した技術的な障害報告を、顧客向けのお詫び文に転用する際に注意すべき点として、適切なものを2つ選べ。","qz":"把 Claude 制作的技术性故障报告转用为给客户的致歉信时，选出 2 个应该注意的点。","o":[{"j":"社内向けの技術的詳細や担当者名など、顧客に開示すべきでない情報を除く","z":"去掉面向公司内部的技术细节、负责人姓名等不应向客户公开的信息"},{"j":"責任を明確にするため、原因となった担当者の名前を記載する","z":"为了明确责任，写上导致问题的负责人姓名"},{"j":"文書を短くするため、お詫びの言葉は省略する","z":"为了缩短文件，省略道歉的话"},{"j":"顧客への影響、今後の対応、問い合わせ先など、顧客が知りたい情報を中心に構成する","z":"以对客户的影响、今后的应对、联系方式等客户想知道的信息为中心组织结构"},{"j":"報告書の専門用語はそのまま残し、正確さを優先する","z":"报告的专业术语原样保留，优先保证准确"}],"a":[0,3],"e":"转用给不同读者时，要去掉不应公开的信息，并以读者需要的信息为中心重新组织。保留专业术语会让客户难懂；写上负责人姓名既不妥当也不必要；致歉信中省略道歉与目的相反。","ej":"転用時は開示不可情報を除き、読み手の関心で再構成"},{"id":"d2-106","d":2,"t":"2.5","n":1,"q":"Claudeの出力を自分で編集する際の考え方として、最も適切なものはどれか。","qz":"关于自己编辑 Claude 输出时的想法，最合适的是哪一个？","o":[{"j":"編集は時間がかかるので、気になる箇所があっても使えるならそのまま出す","z":"编辑很花时间，即使有在意的地方，能用就直接发出"},{"j":"Claudeの出力は完成品なので、手を加えずに使う方が品質が高い","z":"Claude 的输出是成品，不加修改使用质量更高"},{"j":"Claudeの出力は叩き台として扱い、組織の文脈や最新の事情など自分が持つ知識を加えて仕上げる","z":"把 Claude 的输出当作初稿，加入组织背景、最新情况等自己掌握的知识来完成"},{"j":"Claudeの出力に手を加えると、AIを使った意味がなくなるので、問題があれば最初から依頼し直して、編集はしない","z":"修改 Claude 的输出就失去了使用 AI 的意义，有问题就从头重新委托，不编辑"}],"a":[2],"e":"Claude 的输出是起点，人加入组织特有的背景和最新情况，才能让成果真正可用，并对最终内容负责。当作成品直接使用、有问题也照发、不肯编辑只重做，都忽视了人的作用和责任。","ej":"出力は叩き台、自分の知見を加えて仕上げる"},{"id":"d2-107","d":2,"t":"2.5","n":1,"q":"Claudeに新規事業の提案書を作らせたところ、内容は網羅的だが20ページになった。経営会議では5分で説明しなければならない。最も適切な依頼はどれか。","qz":"让 Claude 制作新业务提案书，内容全面但有 20 页。在经营会议上必须用 5 分钟说明。最合适的委托是哪一个？","o":[{"j":"「文字を小さくして、20ページ分を5ページに収めてください」","z":"“请把字缩小，把 20 页的内容压缩到 5 页”"},{"j":"「20ページの内容はすべて重要なので、そのままにして、説明の速度を上げられるように話し言葉の原稿を別に作ってください」","z":"“20 页的内容都很重要，所以保持原样，另外做一份口语稿，以便加快说明速度”"},{"j":"「5分で説明する経営会議用に、結論・投資額・期待効果・リスク・判断事項を3枚程度にまとめ、詳細は付録にしてください」","z":"“请为 5 分钟说明的经营会议，把结论、投资额、预期效果、风险、需判断事项整理成约 3 页，详细内容放进附录”"},{"j":"「ページ数を減らしてください」","z":"“请减少页数”"}],"a":[2],"e":"根据场景（5 分钟、经营会议）明确告诉 Claude 需要的要素、篇幅和结构，详细内容放进附录。只说“减少页数”不知道该保留什么；缩小字体不是真正的精简；保持原样加快说话速度不符合读者的需求。","ej":"場面（時間・読み手）に合わせ要素と分量を指定"},{"id":"d2-108","d":2,"t":"2.5","n":1,"q":"Claudeが作成した社内マニュアルを、外国籍の社員向けにも分かりやすくしたい。最も適切な依頼はどれか。","qz":"想让 Claude 制作的公司内部手册对外籍员工也易懂。最合适的委托是哪一个？","o":[{"j":"「外国籍の社員は日本の文化に慣れていないので、日本の文化やマナーについての説明を大幅に追加し、マニュアル本体の前に置いてください」","z":"“外籍员工不熟悉日本文化，所以请大幅增加关于日本文化和礼仪的说明，放在手册正文前面”"},{"j":"「日本語を学習中の社員向けに、短い文・平易な語彙で書き直し、社内用語には説明を付けてください」","z":"“请面向正在学习日语的员工，用短句、简单词汇改写，并给公司内部用语加上解释”"},{"j":"「同じ内容をもっと丁寧な敬語で書いてください」","z":"“请用更礼貌的敬语写同样的内容”"},{"j":"「外国人向けにしてください」","z":"“请改成面向外国人的”"}],"a":[1],"e":"明确读者的特点（正在学日语）和具体的调整方法（短句、简单词汇、解释内部用语），才能得到合适的版本。“面向外国人”太模糊；更礼貌的敬语反而更难懂；大量追加文化说明偏离了手册的目的，也可能带有刻板印象。","ej":"読み手の特性と具体的な調整方法を指定"},{"id":"d2-109","d":2,"t":"2.5","n":1,"q":"Claudeの出力を読み手に合わせて調整する際、事前に伝えるべき情報として最も重要な組み合わせはどれか。","qz":"按读者调整 Claude 的输出时，事先应该告诉它的信息，最重要的组合是哪一个？","o":[{"j":"読み手が誰か、読み手の前提知識、読み手がその文書で何をするか（目的）","z":"读者是谁、读者的前提知识、读者要用这份文件做什么（目的）"},{"j":"自分の役職、作成にかけられる時間、使っているモデル名","z":"自己的职位、可用于制作的时间、所用模型名称"},{"j":"文書のファイル名、保存場所、作成日","z":"文件名、保存位置、制作日期"},{"j":"Claudeにどれだけ自信を持って書いてほしいか","z":"希望 Claude 写得多有自信"}],"a":[0],"e":"为读者调整输出，核心是读者是谁、懂多少、要用来做什么。自己的职位、时间、模型名、文件信息都不影响内容该如何为读者调整；要求自信程度与适合读者无关。","ej":"読み手・前提知識・目的を伝える"},{"id":"d2-110","d":2,"t":"2.5","n":1,"q":"Claudeに作らせた2つの要約版（短い版と詳しい版）を比較している。どちらを使うかの判断として最も適切なものはどれか。","qz":"正在比较让 Claude 制作的两个摘要版本（简短版和详细版）。关于用哪一个，最合适的判断是哪一个？","o":[{"j":"短い版の方が常に良い","z":"简短版总是更好"},{"j":"共有する場面と読み手が何を求めているかに照らして選び、必要なら一方を基に調整する","z":"对照共享的场景和读者的需求来选择，必要的话以其中一个为基础进行调整"},{"j":"情報量が多い詳しい版の方が常に良い","z":"信息量多的详细版总是更好"},{"j":"どちらか迷った場合は、両方を連続して送付し、読み手に好きな方を読んでもらうことで、判断の手間を省く","z":"不知道选哪个的时候，把两个都连续发出去，让读者读自己喜欢的那个，省去判断的工夫"}],"a":[1],"e":"没有“总是更好”的版本，取决于场景和读者需求，必要时再调整。认为详细或简短总是更好都是片面的；两个都发会把判断负担转嫁给读者。","ej":"比較は場面と読み手のニーズで判断"},{"id":"d2-111","d":2,"t":"2.5","n":2,"q":"Claudeが作成した採用広報用のブログ記事について、レビューの観点として適切なものを2つ選べ。","qz":"关于 Claude 制作的招聘宣传博客文章，选出 2 个合适的审核观点。","o":[{"j":"性別・年齢などで応募者を限定するような偏った表現が含まれていないか","z":"是否包含按性别、年龄等限定应聘者的偏颇表达"},{"j":"Claudeが作成したことが分からないように、意図的に誤字を入れているか","z":"是否为了不让人看出是 Claude 写的而故意加入错别字"},{"j":"記載されている制度や数値（福利厚生、平均残業時間など）が自社の最新の実態と一致しているか","z":"文中写的制度和数字（福利、平均加班时间等）是否与公司最新实际情况一致"},{"j":"できるだけ多くの業界用語を使っているか","z":"是否尽可能多地使用了行业术语"},{"j":"他社の採用ブログよりも文字数が多いか","z":"字数是否比其他公司的招聘博客多"}],"a":[0,2],"e":"招聘宣传要确认事实（制度、数字）准确，并检查是否有歧视性或偏颇表达。字数多少与质量无关；故意加错别字没有意义；大量行业术语会让求职者难以理解。","ej":"採用広報は事実の正確性と偏った表現をチェック"},{"id":"d2-112","d":2,"t":"2.5","n":1,"q":"Claudeの出力に対して、効果的なフィードバックを与えて改善させる方法として最も適切なものはどれか。","qz":"对 Claude 的输出给出有效反馈以改进，最合适的方法是哪一个？","o":[{"j":"何も言わずに同じ依頼を繰り返す","z":"什么都不说，重复同样的委托"},{"j":"どこを、どのように、なぜ変えてほしいかを具体的に伝える（例：「第2段落は専門用語が多いので、新人向けに言い換えて」）","z":"具体说明哪里、怎么改、为什么改（例：“第 2 段专业术语太多，请改写成面向新人的说法”）"},{"j":"改善点をまとめて伝えると混乱するので、気になる点が出るたびに新しいチャットを開いて一から依頼し直す","z":"一起说改进点会混乱，所以每次有在意的地方就开新对话从头委托"},{"j":"「良くないので書き直して」と伝える","z":"告诉它“不好，请重写”"}],"a":[1],"e":"具体指出位置、方向和理由，Claude 才能准确修改。“不好，重写”没有方向；重复同样的委托通常得到相似的结果；每次开新对话会丢失已完成的上下文，效率低。","ej":"フィードバックは「どこを・どう・なぜ」を具体的に"},{"id":"d2-113","d":2,"t":"2.5","n":1,"q":"Claudeに作成させた社内報の記事を、経営層・一般社員・新入社員の3つの層に向けて配信したい。最も効率的で効果的な方法はどれか。","qz":"想把让 Claude 制作的公司内刊文章，分别发给经营层、一般员工、新员工三个群体。最有效率且有效的方法是哪一个？","o":[{"j":"層ごとにゼロから別々の記事を書かせ、内容の整合性は確認しない","z":"为每个群体从零写不同的文章，不确认内容的一致性"},{"j":"新入社員向けに最も易しい版を1つだけ作り、経営層を含めた全員にその版を配信して、説明の手間を減らす。詳しく知りたい人には個別に説明する","z":"只做一个面向新员工的最简单版本，发给包括经营层在内的所有人，减少说明的工夫。想详细了解的人再单独说明"},{"j":"各層の関心と前提知識を整理して伝え、共通の事実は保ったまま、強調点と説明の深さを変えた3つの版を作らせる","z":"整理并告诉它各群体的关注点和前提知识，在保持共同事实的前提下，制作强调点和说明深度不同的 3 个版本"},{"j":"1つの記事をそのまま全員に配信する","z":"把一篇文章直接发给所有人"}],"a":[2],"e":"保持共同事实不变，按各群体的关注点和知识水平调整重点和深度，既高效又能满足各自需求。一篇发给所有人没有调整；分别从零写且不确认一致性，可能导致各版本事实不一致；只发最简单版本不能满足经营层的需求。","ej":"共通の事実を保ち、層ごとに強調点と深さを調整"},{"id":"d2-043","d":2,"t":"2.6","n":1,"q":"マーケティング担当者が、チームで繰り返し編集・共有する1ページのキャンペーン企画書をClaudeで作成したい。出力形式として最も適切なものはどれか。","qz":"一名市场人员想用 Claude 制作一份团队会反复编辑和共享的1页活动企划书。最恰当的输出形式是哪一项？","o":[{"j":"Artifactとして作成し、独立した成果物として反復編集・共有できるようにする。","z":"作为 Artifact 制作，使其成为可以反复编辑和共享的独立成果物。"},{"j":"チャットのインライン回答として出力し、編集が必要になるたびに全文をコピーして別のツールに貼り付ける。","z":"作为聊天行内回答输出，每次需要编辑时都把全文复制粘贴到其他工具中。"},{"j":"JSON形式で出力する。","z":"以 JSON 格式输出。"},{"j":"一文ずつ別々のメッセージで出力させる。","z":"让它每一句话分成单独的消息输出。"}],"a":[0],"e":"Artifact 适合篇幅较长、需要反复修改、独立使用或共享的成果（文档、代码、图表、小应用等）。行内回答适合简短答复，每次复制粘贴编辑很低效；JSON 适合系统处理，不适合人阅读；一句一条消息不实用。","ej":"繰り返し編集・共有する独立した成果物はArtifactが適切。"},{"id":"d2-044","d":2,"t":"2.6","n":1,"q":"同僚から「来週の会議は何曜日だったか」とチャットで聞かれ、Claudeで確認した。回答の形式として最も適切なものはどれか。","qz":"同事在聊天中问“下周的会议是星期几”，用 Claude 确认了。最恰当的回答形式是哪一项？","o":[{"j":"Artifactで会議情報のドキュメントを作成する。","z":"用 Artifact 制作会议信息文档。"},{"j":"会議の背景から詳しく説明する長文レポートを作成する。","z":"制作从会议背景开始详细说明的长篇报告。"},{"j":"短いインラインの回答で簡潔に伝える。","z":"用简短的行内回答简洁传达。"},{"j":"表形式のCSVを作成する。","z":"制作表格形式的 CSV。"}],"a":[2],"e":"简单的问答用简短的行内回答最合适。制作 Artifact 文档、写长篇报告或生成 CSV，对这种场景都是过度的，反而降低效率。","ej":"短い質問への回答はインラインで簡潔に。"},{"id":"d2-045","d":2,"t":"2.6","n":1,"q":"営業部が、Claudeで抽出した顧客問い合わせ情報（会社名・問い合わせ日・カテゴリ・緊急度）を、後でスプレッドシートに取り込んで集計したい。最も適切な出力形式の指定はどれか。","qz":"销售部想把用 Claude 提取的客户咨询信息（公司名、咨询日期、类别、紧急程度）之后导入电子表格进行汇总。最恰当的输出格式指定是哪一项？","o":[{"j":"自由な文章で要約するよう指定する。","z":"指定用自由文本进行总结。"},{"j":"列名・順序・日付形式（YYYY-MM-DD）・緊急度の選択肢を指定し、CSV形式で出力させる。","z":"指定列名、顺序、日期格式（YYYY-MM-DD）和紧急程度可选值，以 CSV 格式输出。"},{"j":"詩的な表現で印象に残るように書かせる。","z":"让它用富有诗意的表达写得令人印象深刻。"},{"j":"箇条書きで出力させ、各項目の書き方や日付の表記はClaudeが読みやすいと判断した形式に任せる。","z":"用要点式输出，各项写法和日期表示交给 Claude 判断的易读格式。"}],"a":[1],"e":"之后要被工具处理的数据，应使用结构化格式（CSV），并明确规定列名、顺序、日期格式和紧急度的可选值，保证一致，便于导入和汇总。自由文章或交给 Claude 自行决定写法的要点列表，格式不统一，难以处理；诗意的表达更不合适。","ej":"後で集計するデータは、列・形式・選択肢を指定した構造化データ（表・CSV）で。"},{"id":"d2-046","d":2,"t":"2.6","n":2,"q":"Claudeに大量の調査メモを整理・キュレーションさせる際の指示として適切なものを2つ選べ。","qz":"让 Claude 整理和筛选大量调研笔记时，请选出 2 项恰当的指示。","o":[{"j":"すべての情報を同じ重要度で羅列させる。","z":"让它把所有信息按同等重要性罗列。"},{"j":"出典は不要なので削除させる。","z":"出处没必要，让它删除。"},{"j":"テーマ別に分類し、重複する内容を統合したうえで、各項目に出典メモを残すよう指示する。","z":"指示其按主题分类、合并重复内容，并在每项保留出处备注。"},{"j":"目的（例：来期の施策検討）に照らして重要度を付け、関係の薄い情報は別枠にまとめるよう指示する。","z":"指示其参照目的（如：下期措施研讨）标注重要程度，把关联性低的信息归入另一栏。"},{"j":"整理の基準はClaudeに完全に任せ、結果は確認しない。","z":"整理标准完全交给 Claude，不确认结果。"}],"a":[2,3],"e":"好的信息整理：按主题分类、合并重复内容并保留出处备注，同时根据目的（如下期施策讨论）标注重要度，关系不大的信息另外归类。全部按同样重要度罗列等于没有筛选；删除出处会让之后无法核实；整理标准完全交给 Claude 且不确认，放弃了人的判断。","ej":"テーマ別分類・重複統合・出典保持、目的に沿った重要度付けで整理する。"},{"id":"d2-047","d":2,"t":"2.6","n":1,"q":"プロジェクトマネージャーが、関係者向けにプロジェクトのスケジュールを視覚的に示したい。Claudeへの依頼として最も適切なものはどれか。","qz":"一名项目经理想向相关人员直观展示项目进度安排。向 Claude 提出的请求中最恰当的是哪一项？","o":[{"j":"タスクの前後関係や期間がすべて伝わるよう、スケジュール全体を詳しい段落形式の文章で説明させる。","z":"为了完整传达任务的先后关系和期间，让它用详细的段落文字说明整个进度安排。"},{"j":"タスク名を1行ずつ並べるだけのリストを作らせる。","z":"让它只做一份逐行列出任务名的列表。"},{"j":"スケジュールの説明を口頭用の原稿にする。","z":"把进度说明写成口头讲稿。"},{"j":"タスク・期間・担当を整理し、ガントチャート風のタイムラインをArtifactで作成させる。","z":"整理任务、期间和负责人，用 Artifact 制作甘特图式的时间线。"}],"a":[3],"e":"“视觉化展示”的需求适合用图表或时间线，Artifact 可以生成独立的可视化成果并反复修改。详细的段落文章、只有任务名的列表、口头原稿都不能满足“直观”的需求。","ej":"視覚的に示したい内容は図・タイムラインなどをArtifactで作成する。"},{"id":"d2-048","d":2,"t":"2.6","n":1,"q":"Claudeに、5つのSaaSツールを「価格・主な機能・サポート体制・導入実績」で比較させたい。最も読み手が理解しやすい出力形式はどれか。","qz":"想让 Claude 从“价格、主要功能、支持体系、导入实绩”比较5个 SaaS 工具。读者最容易理解的输出形式是哪一项？","o":[{"j":"ツールを行、比較項目を列とした比較表。","z":"以工具为行、比较项目为列的对比表。"},{"j":"ツールごとに1段落ずつ、計5段落の詳しい説明文。","z":"每个工具一段，共5段详细说明文字。"},{"j":"比較項目を含まない、ツール名の一覧。","z":"不含比较项目的工具名称列表。"},{"j":"JSON形式のデータ。","z":"JSON 格式的数据。"}],"a":[0],"e":"多对象×多维度的比较最适合用表格，读者可以横向、纵向对照。每个工具写一段文章难以横向比较；只有工具名的列表信息不足；JSON 适合系统处理，不便人阅读。","ej":"複数対象×複数観点の比較は表形式が最適。"},{"id":"d2-049","d":2,"t":"2.6","n":1,"q":"Claudeの出力形式を選ぶ際の考え方として、最も適切なものはどれか。","qz":"选择 Claude 的输出形式时，最恰当的思路是哪一项？","o":[{"j":"常にArtifactを使う。独立した成果物として表示されるため、短い回答でも品質と見やすさが上がる。","z":"总是使用 Artifact。因为会作为独立成果物显示，即使是简短回答，质量和可读性也会提高。"},{"j":"利用目的・読み手・後工程（人が読む／システムが処理する／共有する）に合わせて選ぶ。","z":"根据使用目的、读者、后续环节（人读/系统处理/共享）来选择。"},{"j":"形式は内容に影響しないので、何でもよい。","z":"形式不影响内容，用什么都行。"},{"j":"文字数が多いほど詳細な形式を選ぶ。","z":"字数越多就选越详细的形式。"}],"a":[1],"e":"输出形式应为目的服务：简短回答→行内；长篇、可复用、要共享的成果→Artifact；需要系统处理→结构化数据（表、JSON、CSV）。「常にArtifact」是过度使用；「形式は何でもよい」错在形式会显著影响可用性；按字数选择没有依据。","ej":"形式は目的・読み手・後工程で選ぶ（インライン／Artifact／構造化データ）。"},{"id":"d2-050","d":2,"t":"2.6","n":2,"q":"次のうち、構造化データ（表・CSV・JSONなど）での出力が特に適しているケースを2つ選べ。","qz":"以下哪些情况特别适合以结构化数据（表格、CSV、JSON等）输出？请选出 2 项。","o":[{"j":"退職する同僚への感謝のメッセージを作成する。","z":"撰写给即将离职同事的感谢信息。"},{"j":"100件の問い合わせを分類し、その結果を集計ツールに取り込む。","z":"把100条咨询进行分类，并将结果导入汇总工具。"},{"j":"複数の商品の仕様を項目ごとに並べて比較する。","z":"把多个商品的规格按项目并列比较。"},{"j":"新しいサービス名のアイデアを自由に出す。","z":"自由提出新服务名称的创意。"},{"j":"上司へ送る短い業務連絡を書く。","z":"给上司写一条简短的工作联络。"}],"a":[1,2],"e":"结构化数据适合两类情况：需要被集计工具读取处理的数据（问询分类结果），以及多个对象按项目对照比较（商品规格）。感谢留言和简短业务联络是需要自然语言表达的沟通文本；自由发散的命名创意用列表或行内即可。","ej":"ツールに取り込むデータ・項目別の比較は構造化データが適する。"},{"id":"d2-114","d":2,"t":"2.6","n":1,"q":"Claudeに、毎月更新する部署の業務マニュアル（約10ページ）を作成させたい。チームで修正を重ねながら使う予定である。出力形式として最も適切なものはどれか。","qz":"想让 Claude 制作每月更新的部门业务手册（约 10 页），预计团队会一边反复修改一边使用。最合适的输出形式是哪一个？","o":[{"j":"1ページずつ別々のチャットで作成し、各チャットのURLを一覧にまとめてチームに共有し、更新時はそれぞれのチャットで修正する","z":"每页在不同的对话中制作，把各对话的 URL 整理成清单共享给团队，更新时在各对话中修改"},{"j":"Artifactまたは文書ファイルとして作成し、独立した成果物として更新・共有できるようにする","z":"制作成 Artifact 或文档文件，作为独立成果便于更新和共享"},{"j":"JSON形式で出力する","z":"用 JSON 格式输出"},{"j":"チャットのインライン回答として出力し、必要な部分をその都度コピーする","z":"作为对话中的行内回答输出，每次复制需要的部分"}],"a":[1],"e":"篇幅长、需要反复修改和共享的成果，适合作为 Artifact 或文档文件。行内回答每次复制效率低、容易出错；JSON 适合系统处理而不是人阅读；分散在多个对话中难以管理和更新。","ej":"繰り返し更新・共有する長文はArtifactやファイルで"},{"id":"d2-115","d":2,"t":"2.6","n":1,"q":"Claudeに顧客アンケートの自由記述300件を分類させ、その結果をBIツールで可視化したい。出力の指示として最も適切なものはどれか。","qz":"想让 Claude 对 300 条客户问卷的自由回答进行分类，并在 BI 工具中可视化结果。最合适的输出指示是哪一个？","o":[{"j":"分類結果を箇条書きでまとめさせ、カテゴリ名の表記はClaudeに任せる","z":"让它用要点整理分类结果，类别名称的写法交给 Claude"},{"j":"分類結果を読みやすい文章で説明させる","z":"让它用易读的文章说明分类结果"},{"j":"分類結果の傾向を要約したレポートをArtifactとして作成させ、そのレポートの文章をBIツールに貼り付けて可視化に使うことで、分析と可視化を一度に済ませる","z":"让它把分类结果的倾向制作成摘要报告 Artifact，再把报告文字贴进 BI 工具用于可视化，以此一次完成分析和可视化"},{"j":"回答ID・カテゴリ・感情（ポジティブ/ネガティブ/中立）の列を指定し、カテゴリの選択肢を定義したうえでCSV形式で出力させる","z":"指定回答 ID、类别、情感（正面/负面/中立）的列，定义类别的选项后，以 CSV 格式输出"}],"a":[3],"e":"要被工具读取的数据，应使用结构化格式（CSV），并事先规定列和选项，保证一致性。文章、要点或报告形式都不适合工具处理；类别写法交给 Claude 可能出现表记不统一，导致汇总出错。","ej":"ツールで処理するデータはCSV等の構造化データ（列と選択肢を定義）"},{"id":"d2-116","d":2,"t":"2.6","n":1,"q":"チャットで同僚に「経費精算の締め日はいつか」と聞かれ、Claudeに社内規程を確認させた。同僚への回答として最も適切な形式はどれか。","qz":"同事在聊天中问“报销截止日是哪天”，让 Claude 查阅了公司规章。回复同事最合适的形式是哪一个？","o":[{"j":"締め日と根拠の規程名を1〜2文で簡潔に伝える","z":"用 1〜2 句话简洁地告诉截止日和依据的规章名"},{"j":"経費精算のルール全体をまとめたArtifactを作成して送る","z":"制作一份整理了全部报销规则的 Artifact 发送"},{"j":"締め日の背景や経緯を含めた詳しいレポートを作成し、関連する他の規程の説明も加えて送る","z":"制作包含截止日背景和经过的详细报告，加上相关其他规章的说明后发送"},{"j":"規程の該当章を全文コピーして送る","z":"把规章相关章节全文复制发送"}],"a":[0],"e":"简单的问题用简短的回答最合适，附上依据便于对方确认。制作完整规则的 Artifact、复制全文、写详细报告，都对这个场景过度，反而让对方难以找到答案。","ej":"簡単な質問には簡潔なインライン回答＋根拠"},{"id":"d2-117","d":2,"t":"2.6","n":1,"q":"大量のWeb調査結果をClaudeに整理（キュレーション）させる際の指示として、最も適切なものはどれか。","qz":"让 Claude 整理（策展）大量网络调查结果时，最合适的指示是哪一个？","o":[{"j":"整理の方針はClaudeに任せ、まとめられた内容は確認せずにそのまま社内Wikiに掲載し、必要な人が参照できるようにする","z":"整理方针交给 Claude，整理好的内容不确认就直接发布到公司 Wiki，供需要的人参考"},{"j":"調査の目的を示し、目的に関係する情報を優先度順に整理し、重複は統合して、各項目に出典を残すよう指示する","z":"说明调查目的，按优先度整理与目的相关的信息，合并重复内容，并为每项保留出处"},{"j":"出典は不要なので、内容だけを短くまとめるよう指示する","z":"指示不需要出处，只把内容简短地整理"},{"j":"すべての情報を漏れなく、取得した順番に並べるよう指示する","z":"指示把所有信息无遗漏地按获取顺序排列"}],"a":[1],"e":"好的策展要基于目的进行取舍和排序、合并重复，并保留出处以便之后核实。全部按获取顺序排列没有整理；删掉出处会无法验证；不确认就发布到 Wiki 会传播可能的错误。","ej":"キュレーション＝目的で取捨・優先順位・重複統合・出典保持"},{"id":"d2-118","d":2,"t":"2.6","n":1,"q":"プロジェクトの進捗を関係者に視覚的に示すために、Claudeで簡単なダッシュボード風の画面を作り、何度か改良しながら共有したい。最も適切な方法はどれか。","qz":"为了向相关人员直观展示项目进度，想用 Claude 制作一个简单的仪表板式画面，经过几次改进后共享。最合适的方法是哪一个？","o":[{"j":"進捗データをJSONで出力させ、関係者に送る","z":"让它用 JSON 输出进度数据发给相关人员"},{"j":"毎回新しいチャットで最初から作り直させ、それぞれの画面のスクリーンショットを撮って比較し、最も良いものを関係者に送る","z":"每次在新对话中从头重做，截图比较各个画面，把最好的发给相关人员"},{"j":"進捗状況を長い文章で説明させる","z":"让它用长篇文章说明进度情况"},{"j":"Artifactとして作成し、フィードバックを受けて同じArtifactを反復的に更新する","z":"作为 Artifact 制作，根据反馈反复更新同一个 Artifact"}],"a":[3],"e":"可视化、需要反复改进并共享的成果适合 Artifact，在同一个 Artifact 上迭代效率最高。长篇文章不直观；JSON 不适合人阅读；每次从头重做会丢失改进的积累。","ej":"可視化・反復改良・共有はArtifactで"},{"id":"d2-119","d":2,"t":"2.6","n":2,"q":"Claudeの出力形式の選び方として適切なものを2つ選べ。","qz":"作为选择 Claude 输出形式的方法，选出 2 个合适的。","o":[{"j":"後で人が編集し、他の人と共有する文書は、Artifactやファイルとして作成する","z":"之后由人编辑并与他人共享的文件，作为 Artifact 或文件制作"},{"j":"人が読む報告書は、JSON形式で出力させる","z":"供人阅读的报告，让它用 JSON 格式输出"},{"j":"短い確認の質問にも、毎回Artifactで回答させる","z":"即使是简短的确认问题，每次也让它用 Artifact 回答"},{"j":"複数の項目を横並びで比較したい場合は、表形式を指定する","z":"想横向比较多个项目时，指定表格形式"},{"j":"出力形式はClaudeの判断に任せ、用途は伝えない","z":"输出形式交给 Claude 判断，不告诉用途"}],"a":[0,3],"e":"多项目比较用表格；需要编辑和共享的成果用 Artifact 或文件。简短问题用 Artifact 是过度；供人阅读的报告用 JSON 不便阅读；不告诉用途，Claude 无法选择合适的形式。","ej":"比較は表、編集・共有はArtifact/ファイル"},{"id":"d2-120","d":2,"t":"2.6","n":1,"q":"Claudeに研修資料をPowerPoint形式で作らせたいと考えている。社内では資料をPowerPointで編集・配布する決まりがある。最も適切な対応はどれか。","qz":"想让 Claude 制作 PowerPoint 格式的培训资料。公司规定资料要用 PowerPoint 编辑和分发。最合适的做法是哪一个？","o":[{"j":"社内の決まりよりも効率を優先し、資料の形式はClaudeが出しやすい形式のまま配布して、受け取った人に変換してもらう","z":"比起公司规定更优先效率，资料格式保持 Claude 容易输出的形式分发，让收到的人自己转换"},{"j":"PowerPointは使わず、Claudeのチャット画面のスクリーンショットを配布する","z":"不用 PowerPoint，分发 Claude 对话画面的截图"},{"j":"ファイル作成機能を使ってpptxファイルとして出力させ、内容を確認・編集してから配布する","z":"使用文件创建功能输出为 pptx 文件，确认和编辑内容后再分发"},{"j":"スライドの内容を文章で出力させ、自分でPowerPointに手入力する","z":"让它用文字输出幻灯片内容，自己手动输入到 PowerPoint"}],"a":[2],"e":"组织规定的格式（pptx）可以通过文件创建功能直接生成，再由人确认和编辑。自己手动输入效率低；截图无法编辑；无视规定把转换工作推给别人不合适。","ej":"組織の決まった形式はファイル作成機能で出力し確認"},{"id":"d2-121","d":2,"t":"2.6","n":1,"q":"Claudeに会議の議事録を作らせる際、後で「決定事項」と「宿題（担当者・期限）」を一覧で追跡したい。出力の指示として最も適切なものはどれか。","qz":"让 Claude 制作会议纪要时，之后想用清单追踪“决定事项”和“待办（负责人、期限）”。最合适的输出指示是哪一个？","o":[{"j":"決定事項と宿題は本文の中に自然に含めるよう指示する","z":"指示把决定事项和待办自然地包含在正文中"},{"j":"議事録は短いほど良いので、決定事項だけを1文にまとめさせ、宿題は各自が覚えておくことにすることで、議事録作成の負担を減らす","z":"纪要越短越好，所以只把决定事项整理成一句话，待办由各自记住，以此减轻纪要制作负担"},{"j":"会議の流れが分かるよう、時系列の文章だけで書かせる","z":"为了看懂会议流程，只用按时间顺序的文章写"},{"j":"本文とは別に、「決定事項」と「宿題」をそれぞれ表形式（宿題は内容・担当者・期限の列）で出力させる","z":"在正文之外，分别用表格输出“决定事项”和“待办”（待办列为内容、负责人、期限）"}],"a":[3],"e":"需要追踪的信息用结构化的表格单独列出，便于确认和后续跟进。只写时间顺序的文章或混在正文中，难以一眼找到；只写一句话、待办靠记忆，会导致遗漏。","ej":"追跡したい情報は表形式で別出しに"},{"id":"d2-122","d":2,"t":"2.6","n":1,"q":"Claudeで作成した分析結果を、他部署が自分たちのスプレッドシートに取り込んで使う予定である。出力に関する配慮として最も適切なものはどれか。","qz":"用 Claude 制作的分析结果，其他部门预计会导入自己的表格中使用。关于输出，最合适的考虑是哪一个？","o":[{"j":"Claudeの標準的な出力形式で送り、取り込み先の部署で必要に応じて形式を整えてもらうことで、自部署の作業を減らす","z":"用 Claude 的标准输出形式发送，让导入方部门按需要整理格式，减少自己部门的工作"},{"j":"分析結果を読みやすい文章にして送る","z":"把分析结果写成易读的文章发送"},{"j":"取り込み先の列構成やデータ形式（日付・数値の書式）を事前に確認し、それに合わせた構造化データで出力させる","z":"事先确认导入目标的列结构和数据格式（日期、数字的格式），并按其输出结构化数据"},{"j":"グラフの画像だけを送る","z":"只发送图表图片"}],"a":[2],"e":"考虑后续工序（导入表格），事先确认对方需要的结构和格式再输出，能减少转换错误。文章和图片无法直接导入；把格式整理推给对方会增加对方的工作和出错风险。","ej":"後工程（取り込み先）の形式に合わせて構造化"},{"id":"d2-123","d":2,"t":"2.6","n":1,"q":"Claudeの出力形式として「インライン（会話内の直接回答）」が最も適している場面はどれか。","qz":"Claude 的输出形式中，“行内（对话中的直接回答）”最适合的场景是哪一个？","o":[{"j":"関係者に共有するインタラクティブなスケジュール表を作るとき","z":"制作与相关人员共享的交互式日程表时"},{"j":"チームで繰り返し編集する企画書を作るとき","z":"制作团队要反复编辑的企划书时"},{"j":"ある用語の意味を確認したいとき","z":"想确认某个术语的意思时"},{"j":"100件のデータを集計ツールに取り込むとき","z":"把 100 条数据导入汇总工具时"}],"a":[2],"e":"简短的确认、解释用行内回答最合适。反复编辑的企划书、交互式日程表适合 Artifact；导入汇总工具的数据适合 CSV 等结构化数据。","ej":"インライン＝短い回答・説明・確認"},{"id":"d2-124","d":2,"t":"2.6","n":1,"q":"Claudeに作らせた長い調査レポートを、上司が移動中にスマートフォンで確認する予定である。出力形式の工夫として最も適切なものはどれか。","qz":"上司预计在移动中用智能手机查看让 Claude 制作的长篇调查报告。在输出形式上最合适的做法是哪一个？","o":[{"j":"冒頭に結論と要点を短くまとめ、詳細はその後に見出しで区切って配置する","z":"在开头简短地总结结论和要点，详细内容放在后面并用标题分隔"},{"j":"見出しを使わず、長い段落で一続きに書く","z":"不使用标题，用长段落连续写"},{"j":"すべての情報を1つの大きな表にまとめる","z":"把所有信息整理成一张大表"},{"j":"スマートフォンでは読みにくいので、レポートを画像に変換し、拡大して読めるようにしたうえで送付する","z":"手机上不好读，所以把报告转成图片，可以放大阅读后再发送"}],"a":[0],"e":"考虑阅读场景（手机、移动中）：结论先行、要点简短、用标题分段，便于快速掌握。大表在手机上难以浏览；长段落难读；转成图片无法搜索和复制，也不便阅读。","ej":"読む場面（スマホ等）に合わせ、結論先行・見出しで区切る"},{"id":"d2-125","d":2,"t":"2.6","n":1,"q":"Claudeに、社内の問い合わせ窓口一覧（部署名・担当業務・内線番号・メール）を整理させ、社員が必要なときに探しやすい形にしたい。最も適切な出力形式はどれか。","qz":"想让 Claude 整理公司内部问询窗口一览（部门名、负责业务、内线号码、邮箱），做成员工需要时容易查找的形式。最合适的输出形式是哪一个？","o":[{"j":"部署名・担当業務・内線・メールを列にした表形式で、担当業務のキーワードで探しやすいよう整理する","z":"以部门名、负责业务、内线、邮箱为列的表格形式，并整理成便于按负责业务关键词查找"},{"j":"各部署の紹介を1段落ずつの文章で書く","z":"每个部门用一段文章介绍"},{"j":"部署ごとに別々のメッセージで出力させ、社員にはチャット履歴を検索して必要な部署の情報を探してもらうよう案内する","z":"每个部门分别用不同消息输出，并告知员工在对话记录中搜索所需部门的信息"},{"j":"JSON形式で出力し、そのまま社員に配布する","z":"用 JSON 格式输出并直接发给员工"}],"a":[0],"e":"多个对象、相同属性的参考信息最适合用表格，读者可以快速查找和比较。每个部门写一段文章难以查找；JSON 不适合一般员工阅读；分散在多条消息中让人搜索记录很不方便。","ej":"同じ属性を持つ参照情報は表形式で"},{"id":"d3-001","d":3,"t":"3.1","n":1,"q":"マーケティング担当者が、毎週同じブランドガイドラインと過去のキャンペーン資料を参照しながらSNS投稿案を作成している。毎回ファイルをアップロードし直し、同じ前提を説明する手間を減らしたい。最も適切なClaudeの機能はどれか。","qz":"市场负责人每周都要参照同样的品牌规范和过去的活动资料来起草社交媒体文案。希望减少每次重新上传文件、重复说明相同前提的麻烦。最合适的 Claude 功能是哪一个？","o":[{"j":"Projectを作成し、ガイドラインと資料をプロジェクトナレッジに、前提をプロジェクト指示に設定する","z":"创建 Project，把规范和资料放进项目知识库，把前提写进项目指令"},{"j":"毎回新しいチャットを開き、冒頭に全資料を貼り付ける","z":"每次开新对话，在开头粘贴全部资料"},{"j":"Researchを使って毎回Webからブランド情報や競合のSNS投稿を幅広く収集させ、その結果をもとに投稿案を作らせる","z":"每次用 Research 从网上广泛收集品牌信息和竞争对手的社交媒体帖子，再根据结果制作发帖方案"},{"j":"シークレットチャットで作業し、情報が残らないようにする","z":"在无痕对话中工作，让信息不留存"}],"a":[0],"e":"反复使用同一组资料和前提，正是 Project 的用途：项目知识库保存文件，项目指令保存固定前提，在该项目里新建对话都会自动带上。“每次粘贴全部资料”费时且容易遗漏；Research 用于调查外部信息，品牌规范是内部资料；无痕对话不保留信息，与“减少重复”的目的相反。","ej":"繰り返し使う資料と前提 → Project（指示＋ナレッジ）"},{"id":"d3-002","d":3,"t":"3.1","n":1,"q":"事業企画担当者が、新規参入を検討している市場について、競合各社の動向・規制・市場規模を複数の情報源から調べ、引用付きのレポートにまとめたい。時間は数分かかっても構わない。最も適した機能はどれか。","qz":"事业企划负责人想针对正在考虑进入的市场，从多个信息源调查竞争对手动向、法规和市场规模，并整理成带引用的报告。花几分钟也没关系。最合适的功能是哪一个？","o":[{"j":"通常のチャットで、Claudeの学習済み知識だけで回答させ、足りない部分は一般的な業界の傾向から推測して補わせる","z":"在普通对话中只靠 Claude 的训练知识回答，不足的部分让它根据一般行业趋势推测补充"},{"j":"Research（リサーチ）機能を使い、複数の検索を自律的に行わせて引用付きレポートを作成させる","z":"使用 Research 功能，让它自主进行多次检索并生成带引用的报告"},{"j":"最も高速なモデルに切り替えて質問を短くする","z":"切换到最快的模型并把问题写短"},{"j":"Artifactで表を作成させる","z":"让它用 Artifact 生成表格"}],"a":[1],"e":"多来源、需要最新信息、要引用、可以等几分钟——这是 Research 的典型场景，它会自主多次搜索并给出带出处的报告。只凭训练知识可能过时且没有出处；Artifact 只是输出形式，解决不了信息收集；换快模型、写短问题也不对，速度不是这里的瓶颈。","ej":"多数の情報源・引用付き・数分OK → Research"},{"id":"d3-003","d":3,"t":"3.1","n":1,"q":"人事担当者が「今日の午後の会議で使う、来客用Wi-Fiのパスワードの伝え方の一文」をClaudeに頼もうとしている。同僚がResearch機能を使うよう勧めてきた。最も適切な判断はどれか。","qz":"人事负责人想请 Claude 写“今天下午会议上告知访客 Wi-Fi 密码的一句话”。同事建议使用 Research 功能。最合适的判断是哪一个？","o":[{"j":"Researchは常に品質が高いので、勧めに従う","z":"Research 质量总是更高，所以照做"},{"j":"Opusと拡張思考を有効にして依頼する","z":"开启 Opus 和扩展思考后再请求"},{"j":"Projectを新規作成し、会社のWi-Fi規程を全てアップロードしてから依頼する","z":"新建 Project，上传公司全部 Wi-Fi 规定后再请求"},{"j":"単純な短文作成なので、通常のチャットでインライン回答を得る","z":"这是简单的短句写作，用普通对话获得内联回答即可"}],"a":[3],"e":"任务简单、一次性、不需要外部调查，用普通对话直接得到内联回答最高效。Research 要花几分钟、面向多来源调查，这里属于过度手段；为此新建 Project 上传规定，准备成本远大于任务本身；Opus＋扩展思考只会增加时间和成本。","ej":"単純・一回限りのタスクに重い機能は過剰"},{"id":"d3-004","d":3,"t":"3.1","n":1,"q":"研修担当者が、Claudeと対話しながら新入社員向けのチェックリスト文書を何度も修正し、最終的にチームへ共有したい。会話の中に文書が埋もれず、版を重ねて編集しやすい形が望ましい。最も適切なのはどれか。","qz":"培训负责人想一边与 Claude 对话，一边多次修改面向新员工的检查清单文档，最终共享给团队。希望文档不被埋在对话里，方便多次迭代编辑。最合适的是哪一个？","o":[{"j":"Artifactとして作成させ、別パネルで反復編集し、完成版を共有する","z":"让它作为 Artifact 生成，在独立面板中反复编辑，完成后共享"},{"j":"毎回インラインで全文を出力させ、修正のたびに最新版を会話の中からスクロールして探し、コピーして共有する","z":"每次让它内联输出全文，每次修改后在对话里滚动查找最新版，复制后共享"},{"j":"Researchで類似チェックリストを集めさせる","z":"用 Research 收集类似的检查清单"},{"j":"シークレットチャットで作成し、履歴を残さない","z":"在无痕对话中制作，不留历史"}],"a":[0],"e":"需要反复修改、独立存在并共享的成果物，适合 Artifact：在独立面板显示、可迭代、可共享/发布。每次内联输出全文会让多个版本埋在对话里；Research 是信息收集，不解决编辑与共享；无痕对话与共享目的无关，还会丢失工作记录。","ej":"反復編集・共享する独立成果物 → Artifact"},{"id":"d3-005","d":3,"t":"3.1","n":1,"q":"広報担当者が「昨日発表された同業他社のプレスリリースの要点」をClaudeに尋ねたところ、もっともらしいが古い情報が返ってきた。最も適切な次の行動はどれか。","qz":"公关负责人向 Claude 询问“同行公司昨天发布的新闻稿要点”，得到的是看似合理但过时的信息。最合适的下一步是哪一个？","o":[{"j":"モデルの知識は常に最新なので、そのまま使う","z":"模型知识总是最新的，直接使用"},{"j":"同じ質問を言い回しを変えて何度も繰り返し、最も多く返ってきた回答を正しい最新情報として採用する","z":"换各种说法反复问同一个问题，把出现次数最多的回答当作正确的最新信息采用"},{"j":"Web検索を有効にし、引用元を確認できる形で最新情報を取得させる","z":"开启网页搜索，让它以可核对出处的方式获取最新信息"},{"j":"Artifactに出力させて見やすくする","z":"让它输出到 Artifact 以便阅读"}],"a":[2],"e":"模型的训练知识有截止时间，昨天的新闻不在其中。需要最新信息时应开启 Web 搜索，并通过引用核对原文。“模型知识总是最新”前提错误；换说法反复问不会产生它不知道的信息，反而可能诱发幻觉；输出到 Artifact 只改格式，不解决正确性。","ej":"最新情報 → Web検索＋引用で確認"},{"id":"d3-017","d":3,"t":"3.1","n":1,"q":"経理担当者が、売上データのCSVをアップロードし、月別の推移を集計してグラフ化し、Excelファイルとしても受け取りたい。最も関係の深い機能はどれか。","qz":"财务人员想上传销售数据 CSV，按月汇总趋势并做成图表，同时以 Excel 文件形式获取。关系最密切的功能是哪一个？","o":[{"j":"シークレットチャット","z":"无痕对话"},{"j":"コード実行とファイル作成","z":"代码执行与文件创建"},{"j":"Web検索","z":"网页搜索"},{"j":"Styles（応答スタイル）","z":"Styles（回答风格）"}],"a":[1],"e":"数据汇总、制图、生成 xlsx 文件，需要“代码执行与文件创建”功能（Claude 在沙盒中运行代码处理数据）。无痕对话只影响是否留痕；Styles 只调整文风；Web 搜索用于获取网络信息，不用于处理手头的数据。","ej":"データ分析・グラフ・ファイル生成 → コード実行／ファイル作成"},{"id":"d3-018","d":3,"t":"3.1","n":1,"q":"教育担当者が、同じチームの複数メンバーで同じ教材資料と指示を使い、一貫したトーンで研修資料を作りたい。組織はTeamプランを契約している。最も適切な方法はどれか。","qz":"教育负责人希望同一团队的多名成员使用相同的教材和指令，以一致的语气制作培训资料。组织订阅了 Team 方案。最合适的方法是哪一个？","o":[{"j":"教材はメールで回覧し、Claudeには何も設定しない","z":"教材用邮件传阅，Claude 不做任何设置"},{"j":"各メンバーが自分の判断で個別にチャットを始め、それぞれが教材を毎回アップロードし、トーンは各自の好みに任せる","z":"每个成员凭自己的判断各自开始对话，各自每次上传教材，语气交给个人喜好"},{"j":"共有Projectを作成し、教材をナレッジに、トーンの指示をプロジェクト指示に設定してメンバーに共有する","z":"创建共享 Project，把教材放入知识库、语气要求写进项目指令，并共享给成员"},{"j":"1人のアカウントを全員で使い回す","z":"全员共用一个人的账号"}],"a":[2],"e":"Team/Enterprise 可以共享 Project 并设置权限，让成员使用同一套知识和指令，产出保持一致。各自随意开对话无法保证一致；共用一个人的账号违反安全与使用条款，也无法审计；只用邮件传阅资料则完全没有利用 Claude 的配置能力。","ej":"チームで一貫性 → 共有Project（Team/Enterprise）"},{"id":"d3-021","d":3,"t":"3.1","n":2,"q":"次のタスクと機能の組み合わせのうち、適切なものを2つ選べ。","qz":"以下任务与功能的组合中，请选出 2 个合适的。","o":[{"j":"一文の言い換えをしたい → Research","z":"想改写
